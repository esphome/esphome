esphome:
  name: xiao-nrf54lm20a-test

zephyr:
  variant: nrf54lm20a
  framework:
    type: zephyr
    source:
      type: git
      ref: main

logger:

switch:
  - platform: gpio
    id: led0
    name: "LED0 Blue"
    pin:
      number: 55  # blue_led on the XIAO nRF54LM20A: gpio1 pin 23 (1*32 + 23)
      inverted: true  # GPIO_ACTIVE_LOW in the board's own devicetree

interval:
  - interval: 500ms
    then:
      - switch.toggle: led0

i2c:
  - id: bus_imu
    dts_node_override: i2c30  # onboard IMU bus (not the XIAO header's i2c22)
    sda: 8  # P0.08: gpio0 pin 8 (i2c30_default pinctrl, NRF_PSEL(TWIM_SDA, 0, 8))
    scl: 7  # P0.07: gpio0 pin 7 (i2c30_default pinctrl, NRF_PSEL(TWIM_SCL, 0, 7))

motion:
  - platform: lsm6ds
    id: lsm6ds_motion
    i2c_id: bus_imu
    accelerometer_range: 4G
    accelerometer_odr: 104HZ
    gyroscope_range: 2000DPS
    gyroscope_odr: 208HZ

sensor:
  - platform: lsm6ds
    name: "IMU Temperature"
  - platform: motion
    motion_id: lsm6ds_motion
    type: acceleration_x
    name: "IMU Accel X"
  - platform: motion
    motion_id: lsm6ds_motion
    type: acceleration_y
    name: "IMU Accel Y"
  - platform: motion
    motion_id: lsm6ds_motion
    type: acceleration_z
    name: "IMU Accel Z"

zephyr_ble_server:
