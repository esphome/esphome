number:
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "A/C Hysteresis temperature"
    register_type: holding
    address: 0x2004
    min_value: 1.0
    max_value: 15.0
    multiply: 10.0
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Maximum Fan Speed"
    register_type: holding
    address: 8250
    min_value: 500
    max_value: 1500
    multiply: 0.1
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Compressor Maximum"
    register_type: holding
    address: 8235
    min_value: 50
    max_value: 120
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Compressor Minimum"
    register_type: holding
    address: 8236
    min_value: 30
    max_value: 90
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Target Temperature"
    register_type: holding
    address: 8198
    min_value: 35
    max_value: 75
    multiply: 10.0

