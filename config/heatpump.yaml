    modbus_controller_id: modbus_device
    name: "Coil Temp"
    register_type: holding
    address: 0x1106
    device_class: "temperature"
    state_class: "measurement"
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    filters:
      - multiply: !lambda return 0.1;
