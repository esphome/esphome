esphome:
  name: awarma-12kw
  friendly_name: Awarma-12kw

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:
  logs:
    modbus_controller: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "OczLkEeZA2DhsL9h4w2izEQ5TS5CbYuimTz4ZxQkFYw="

ota:
  - platform: esphome
    password: "f38392bf9ae7a46f18f8ca9df2374d00"

ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk_mode: GPIO17_OUT
  phy_addr: 0
  power_pin: GPIO12
  manual_ip:
    gateway: 10.0.3.1
    subnet: 255.255.255.0
    static_ip: 10.0.3.25

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 9600
  # debug:
  #   direction: RX
  #   dummy_receiver: true
modbus:
  flow_control_pin: GPIO4
  id: modbus1
  disable_crc: "false"
  passive_mode: "true"

globals:
  - id: modbus_connected
    type: bool
    restore_value: no
    initial_value: "false"

modbus_controller:
  - id: modbus_device
    address: 0x1 ## address of the Modbus slave device on the bus
    modbus_id: modbus1
    setup_priority: -10
    on_online:
      then:
        - globals.set:
            id: modbus_connected
            value: "true"
    on_offline:
      then:
        - globals.set:
            id: modbus_connected
            value: "false"

binary_sensor:
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "Switched ON"
    register_type: holding
    address: 0x1000
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "OS: Standby / Shutdown"
    register_type: holding
    address: 0x1102
    bitmask: 1
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "OS: Power on State"
    register_type: holding
    address: 0x1102
    bitmask: 2
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "OS: Downtime State"
    register_type: holding
    address: 0x1102
    bitmask: 4
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "OS: Alarm Power on State"
    register_type: holding
    address: 0x1102
    bitmask: 8
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "OS: Defrosting State"
    register_type: holding
    address: 0x1102
    bitmask: 16
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "OS: Sterilization Status"
    register_type: holding
    address: 0x1102
    bitmask: 256
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "OS: Antifreeze State"
    register_type: holding
    address: 0x1102
    bitmask: 512
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "OS: Floor Drying"
    register_type: holding
    address: 0x1102
    bitmask: 1024
  - platform: modbus_controller
    modbus_controller_id: modbus_device
    name: "OS: PV Mode"
    register_type: holding
    address: 0x1102
    bitmask: 2048

sensor:
