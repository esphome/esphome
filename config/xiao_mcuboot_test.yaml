esphome:
  name: xiao-mcuboot-test

zephyr:
  variant: nrf52
  board: xiao_ble
  log_level: INFO
  overlays:
    # xiao_ble's stock devicetree ships a UF2/SoftDevice-coexistence partition table
    # (reserved_partition_0/code_partition/storage_partition/boot_partition), not the
    # slot0/slot1 labels MCUboot needs. Both images redefine the same physical layout
    # (each is built separately and must agree), then each points zephyr,code-partition
    # at its own partition -- pointing both at the same one makes MCUboot link itself
    # into the app's slot instead of its own.
    app: |
      /delete-node/ &reserved_partition_0;
      /delete-node/ &code_partition;
      /delete-node/ &storage_partition;
      /delete-node/ &boot_partition;

      &flash0 {
        partitions {
          compatible = "fixed-partitions";
          #address-cells = <1>;
          #size-cells = <1>;

          boot_partition: partition@0 {
            reg = <0x0 0x9000>;
          };
          slot0_partition: partition@9000 {
            reg = <0x9000 0x77000>;
          };
          slot1_partition: partition@80000 {
            reg = <0x80000 0x77000>;
          };
          storage_partition: partition@f7000 {
            reg = <0xf7000 0x8000>;
          };
        };
      };

      / {
        chosen {
          zephyr,code-partition = &slot0_partition;
        };
      };
    mcuboot: |
      /delete-node/ &reserved_partition_0;
      /delete-node/ &code_partition;
      /delete-node/ &storage_partition;
      /delete-node/ &boot_partition;

      &flash0 {
        partitions {
          compatible = "fixed-partitions";
          #address-cells = <1>;
          #size-cells = <1>;

          boot_partition: partition@0 {
            reg = <0x0 0x9000>;
          };
          slot0_partition: partition@9000 {
            reg = <0x9000 0x77000>;
          };
          slot1_partition: partition@80000 {
            reg = <0x80000 0x77000>;
          };
          storage_partition: partition@f7000 {
            reg = <0xf7000 0x8000>;
          };
        };
      };

      / {
        chosen {
          zephyr,code-partition = &boot_partition;
        };
      };
  kconfig_options:
    mcuboot:
      CONFIG_UART_CONSOLE: false
      CONFIG_CONSOLE: false

logger:
  hardware_uart: USB_CDC

output:
  - platform: gpio
    pin: 26
    id: red_led

interval:
  - interval: 1s
    then:
      - output.turn_on: red_led
      - delay: 0.5s
      - output.turn_off: red_led
