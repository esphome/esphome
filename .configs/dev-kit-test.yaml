esphome:
  name: dev-kit-test
  friendly_name: ESP32 Dev Kit

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf
# Enable logging
logger:
  level: VERBOSE
  logs:
    ethernet: VERBOSE
    ethernet.w5500: VERBOSE
    spi: VERBOSE
    esp-idf: VERBOSE

# Enable Home Assistant API
api:
  encryption:
    key: "mpJ8RZ/4Hgvrf/fvytXCZokzJedMVQa7B3Q2RbmZPGY="

ota:
  - platform: esphome
    password: "faa23229fbe03188178746511093c0e5"

# --- Remove or comment out WiFi and captive portal ---
