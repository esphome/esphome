# --- Ethernet (W5500) configuration, DHCP by default ---
ethernet:
  type: W5500
  clk_pin: GPIO2
  mosi_pin: GPIO10
  miso_pin: GPIO11
  cs_pin: GPIO18
  interrupt_pin: GPIO15
  reset_pin: GPIO23
  clock_speed: 25MHz

number:
  - platform: template
    name: "Bed width"
    id: width
    mode: box
    optimistic: true
    min_value: -5.0
    max_value: 5.0
    step: 0.1
    initial_value: 1.0

  - platform: template
    name: "Bed length"
    id: length
    mode: box
    optimistic: true
    min_value: -5.0
    max_value: 5.0
    step: 0.1
    initial_value: 1.0

