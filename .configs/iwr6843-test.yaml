esphome:
  name: iwr6843-test
  friendly_name: mmWave Sensor
  # Add this line if ESPHome doesn't auto-detect your custom component
  # custom_components:
  #   - esphome/components/iwr6843aop

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf
# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "mpJ8RZ/4Hgvrf/fvytXCZokzJedMVQa7B3Q2RbmZPGY="

ota:
  - platform: esphome
    password: "faa23229fbe03188178746511093c0e5"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "IWR6843-Test Fallback Hotspot"
    password: "cYzIXtzxcrwH"

captive_portal:

switch:
  - platform: gpio
    name: "GPIO 5 switch"
    pin: GPIO5

  - platform: gpio
    name: "GPIO 10 switch"
    pin: GPIO10

number:
  - platform: template
    name: "Bed head corner X"
    id: corner_1_x
    mode: box
    optimistic: true
    min_value: -5.0
    max_value: 5.0
    step: 0.1
    initial_value: 0.0

  - platform: template
    name: "Bed head corner Y"
    id: corner_1_y
    mode: box
    optimistic: true
    min_value: -5.0
    max_value: 5.0
    step: 0.1
    initial_value: 0.0

  - platform: template
    name: "Bed foot corner X"
    id: corner_2_x
    mode: box
    optimistic: true
    min_value: -5.0
    max_value: 5.0
    step: 0.1
    initial_value: 0.0

  - platform: template
    name: "Bed foot corner Y"
    id: corner_2_y
    mode: box
    optimistic: true
    min_value: -5.0
    max_value: 5.0
    step: 0.1
    initial_value: 0.0

# --- Add iwr6843aop custom component ---
iwr6843aop:
  id: my_iwr6843aop
  uart1_id: iwr_uart1
  uart2_id: iwr_uart2

  # Example float inputs (now referencing user-changeable numbers)
  float_input:
    corner_1_x: corner_1_x
    corner_1_y: corner_1_y
    corner_2_x: corner_2_x
    corner_2_y: corner_2_y

sensor:
  - platform: template
    name: "IWR6843 Float Output 1"
    id: iwr6843_float_output_1
    lambda: |-
      return id(my_iwr6843aop).get_float_output_1();
    update_interval: 100s

  - platform: template
    name: "IWR6843 Float Output 2"
    id: iwr6843_float_output_2
    lambda: |-
        return id(my_iwr6843aop).get_float_output_2();
    update_interval: 100s

  - platform: template
    name: "IWR6843 Int Output"
    id: iwr6843_int_output
    lambda: |-
        return id(my_iwr6843aop).get_int_output();
    update_interval: 100s

uart:
  - id: iwr_uart1
    tx_pin: GPIO15
    rx_pin: GPIO20
    baud_rate: 115200

  - id: iwr_uart2
    rx_pin: GPIO21
    baud_rate: 921600
    rx_buffer_size: 2048