esphome:
  name: iwr6843-test
  friendly_name: mmWave Sensor
  # Add this line if ESPHome doesn't auto-detect your custom component
  # custom_components:
  #   - esphome/components/iwr6843aop

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf
# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "mpJ8RZ/4Hgvrf/fvytXCZokzJedMVQa7B3Q2RbmZPGY="

ota:
  - platform: esphome
    password: "faa23229fbe03188178746511093c0e5"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "IWR6843-Test Fallback Hotspot"
    password: "cYzIXtzxcrwH"

captive_portal:

number:
  - platform: template
    name: "Bed width"
    id: width
    mode: box
    optimistic: true
    min_value: -5.0
    max_value: 5.0
    step: 0.1
    initial_value: 1.0

  - platform: template
    name: "Bed length"
    id: length
    mode: box
    optimistic: true
    min_value: -5.0
    max_value: 5.0
    step: 0.1
    initial_value: 1.0


# --- Add iwr6843aop custom component ---
iwr6843aop:
  id: my_iwr6843aop
  uart1_id: iwr_uart1
  uart2_id: iwr_uart2

  float_input:
    width: width
    length: length

  binary_sensor:
    room_presence: room_presence
    bed_presence: bed_presence

uart:
  - id: iwr_uart1
    tx_pin: GPIO15
    rx_pin: GPIO20
    baud_rate: 115200

  - id: iwr_uart2
    rx_pin: GPIO21
    baud_rate: 921600
    rx_buffer_size: 2048

binary_sensor:
  - platform: template
    id: room_presence
    name: "Room presence"

  - platform: template
    id: bed_presence
    name: "Bed presence"