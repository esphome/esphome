esphome:
  name: iwr6843-test
  friendly_name: mmWave Sensor

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf
# Enable logging
logger:
  level: DEBUG

# Enable Home Assistant API
api:
  encryption:
    key: "mpJ8RZ/4Hgvrf/fvytXCZokzJedMVQa7B3Q2RbmZPGY="

ota:
  - platform: esphome
    password: "faa23229fbe03188178746511093c0e5"

# --- Remove or comment out WiFi and captive portal ---
# wifi:
#   ssid: !secret wifi_ssid
#   password: !secret wifi_password
#   ap:
#     ssid: "IWR6843-Test Fallback Hotspot"
#     password: "cYzIXtzxcrwH"
# captive_portal:


# --- Ethernet (W5500) configuration, DHCP by default ---
ethernet:
  type: W5500
  clk_pin: GPIO6
  mosi_pin: GPIO7
  miso_pin: GPIO8
  cs_pin: GPIO9
  interrupt_pin: GPIO10
  reset_pin: GPIO11
  clock_speed: 25MHz

number:
  - platform: template
    name: "Bed width"
    id: width
    mode: box
    optimistic: true
    min_value: -5.0
    max_value: 5.0
    step: 0.1
    initial_value: 1.0

  - platform: template
    name: "Bed length"
    id: length
    mode: box
    optimistic: true
    min_value: -5.0
    max_value: 5.0
    step: 0.1
    initial_value: 1.0

iwr6843aop:
  id: my_iwr6843aop
  uart1_id: iwr_uart1
  uart2_id: iwr_uart2

  float_input:
    width: width
    length: length

  binary_sensor:
    room_presence: room_presence
    bed_presence: bed_presence

uart:
  - id: iwr_uart1
    tx_pin: GPIO15
    rx_pin: GPIO20
    baud_rate: 115200

  - id: iwr_uart2
    rx_pin: GPIO21
    baud_rate: 921600
    rx_buffer_size: 2048

binary_sensor:
  - platform: template
    id: room_presence
    name: "Room presence"

  - platform: template
    id: bed_presence
    name: "Bed presence"