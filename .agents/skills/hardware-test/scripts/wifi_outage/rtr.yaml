esphome:
  name: rtr-outage
  on_boot:
    priority: 800
    then:
      - logger.log: "MARK RTR BOOT"
esp8266:
  board: d1_mini
logger:
  level: VERBOSE
  logs:
    component: DEBUG
    scheduler: DEBUG
    app: DEBUG
wifi:
  ap:
    ssid: !secret t_ssid
    password: !secret t_pw
interval:
  - interval: 1s
    then:
      - lambda: |-
          char buf[160];
          size_t n = 0;
          int cnt = 0;
          struct station_info *st = wifi_softap_get_station_info();
          while (st != nullptr && n < sizeof(buf) - 40) {
            uint32_t a = st->ip.addr;
            n += snprintf(buf + n, sizeof(buf) - n, " %02X:%02X=%u.%u.%u.%u", st->bssid[4], st->bssid[5],
                          (unsigned) (a & 0xff), (unsigned) ((a >> 8) & 0xff), (unsigned) ((a >> 16) & 0xff),
                          (unsigned) (a >> 24));
            cnt++;
            st = STAILQ_NEXT(st, next);
          }
          wifi_softap_free_station_info();
          buf[n] = 0;
          ESP_LOGI("rtr", "RTR up=%u sta=%d%s", (unsigned) (millis() / 1000), cnt, buf);
