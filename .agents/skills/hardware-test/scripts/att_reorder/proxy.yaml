# Proxy (classic ESP32): bluetooth_proxy without service cache, plaintext API, the reorder wrapper. Substitutions: name, idf.
esphome:
  name: ${name}
  includes: [attswap.hpp]
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    version: ${idf}
logger:
  level: DEBUG
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
api:
  reboot_timeout: 0s
ota:
  - platform: esphome
external_components:
  - source: {type: local, path: components}
    components: [attswap]
attswap:
esp32_ble_tracker:
  scan_parameters:
    active: true
bluetooth_proxy:
  active: true
  cache_services: false
interval:
  - interval: 5s
    then:
      - lambda: 'ESP_LOGI("swap", "attswap swaps=%u", (unsigned) attswap_count);'
