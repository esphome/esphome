hlk_fm22x:
  id: fm
  uart_id: u_fm
  on_face_scan_matched:
    - logger.log:
        format: "EV matched id=%d name='%s' len=%u admin=%d is_admin_face=%d"
        args: ["face_id", "name.c_str()", "(unsigned) name.size()", "admin", "name == \"Admin\""]
  on_face_scan_unmatched:
    - logger.log: "EV unmatched"
  on_face_scan_invalid:
    - logger.log: {format: "EV invalid error=%u", args: [error]}
  on_face_info:
    - logger.log: {format: "EV info status=%d left=%d top=%d right=%d bottom=%d yaw=%d", args: [status, left, top, right, bottom, yaw]}
  on_face_details:
    - logger.log: {format: "EV details id=%d name='%s' admin=%d", args: [face_id, "name.c_str()", admin]}
  on_enrollment_done:
    - logger.log: {format: "EV enrolled id=%d dir=0x%02X", args: [face_id, direction]}
  on_enrollment_failed:
    - logger.log: {format: "EV enroll_failed error=%u", args: [error]}

binary_sensor:
  - platform: hlk_fm22x
    enrolling:
      name: Face Enrolling
      on_state: {logger.log: {format: "ENT enrolling %d", args: [x]}}
    scanning:
      name: Face Scanning
      on_state: {logger.log: {format: "ENT scanning %d", args: [x]}}

text_sensor:
  - platform: hlk_fm22x
    version:
      name: Version
      on_value: {logger.log: {format: "ENT version '%s' len=%u", args: ["x.c_str()", "(unsigned) x.size()"]}}
    serial_number:
      name: Serial
      on_value: {logger.log: {format: "ENT serial '%s' len=%u", args: ["x.c_str()", "(unsigned) x.size()"]}}
    last_face_name:
      name: Last Face Name
      on_value: {logger.log: {format: "ENT last_name '%s' len=%u", args: ["x.c_str()", "(unsigned) x.size()"]}}
    face_state:
      name: Face State
      on_value: {logger.log: {format: "ENT face_state '%s'", args: ["x.c_str()"]}}

interval:
  - interval: 500ms
    then:
      - lambda: |-
          static int last = -1;
          int now = id(fm).status_has_error() * 2 + id(fm).status_has_warning();
          if (now != last) { last = now; ESP_LOGI("fm22sim", "STATUS error=%d warning=%d", now >> 1, now & 1); }

script:
  - id: run_all
    then:
      - script.execute: common_cases
      - script.wait: common_cases
      - script.execute: pr_cases
      - script.wait: pr_cases
      - lambda: 'ESP_LOGI("fm22sim", "DONE frames=%d bad=%d", fm22sim::mod.rx_frames.load(), fm22sim::mod.rx_bad.load());'
  - id: pr_cases
    then:
      - logger.log: "CASE face_details (1 known, 42 unknown)"
      - hlk_fm22x.get_face_details: 1
      - hlk_fm22x.get_face_details: 42
      - delay: 2s
      - logger.log: "CASE cancel_scan (module answers the interrupted scan with aborted)"
      - lambda: 'fm22sim::mod.scan_mode = fm22sim::SCAN_MATCH; fm22sim::mod.scan_ms = 5000; fm22sim::mod.reset_aborts = true;'
      - hlk_fm22x.scan: {timeout: 8s}
      - delay: 1s
      - hlk_fm22x.cancel:
      - delay: 2s
      - logger.log: "CASE cancel_scan_no_abort_reply"
      - lambda: 'fm22sim::mod.reset_aborts = false;'
      - hlk_fm22x.scan:
      - delay: 1s
      - hlk_fm22x.cancel:
      - delay: 2s
      - lambda: 'fm22sim::mod.reset_aborts = true; fm22sim::mod.scan_ms = 800;'
      - logger.log: "CASE cancel_enroll"
      - lambda: 'fm22sim::mod.scan_ms = 3000;'
      - hlk_fm22x.enroll: {name: "Dave", direction: middle}
      - delay: 1s
      - hlk_fm22x.cancel:
      - delay: 2s
      - lambda: 'fm22sim::mod.scan_ms = 800;'
      - logger.log: "CASE cancel_idle"
      - hlk_fm22x.cancel:
      - delay: 1s
      - logger.log: "CASE enroll_single_admin"
      - hlk_fm22x.enroll: {name: "Single", admin: true, timeout: 20s}
      - delay: 2s
      - logger.log: "CASE scan_admin_false (Alice)"
      - lambda: 'fm22sim::mod.scan_mode = fm22sim::SCAN_MATCH_PLAIN;'
      - hlk_fm22x.scan: {timeout: 5s}
      - delay: 2s
      - logger.log: "CASE enroll_duplicate_refused"
      - lambda: 'fm22sim::mod.known_face = true;'
      - hlk_fm22x.enroll: {name: "Dup", allow_duplicate: false}
      - delay: 2s
      - lambda: 'fm22sim::mod.known_face = false;'
      - logger.log: "CASE enroll_itg_accepted"
      - hlk_fm22x.enroll: {name: "Eve", allow_duplicate: false}
      - delay: 2s
      - logger.log: "CASE enroll_bad_name_runtime"
      - hlk_fm22x.enroll:
          name: !lambda 'return std::string("Jos\xc3\xa9");'
      - delay: 1s
      - logger.log: "CASE second_enroll_while_one_waits"
      - hlk_fm22x.enroll: {name: "Frank"}
      - hlk_fm22x.enroll: {name: "Grace"}
      - delay: 3s
      - logger.log: "CASE queue_seven_scans_then_cancel"
      - hlk_fm22x.scan:
      - hlk_fm22x.scan:
      - hlk_fm22x.scan:
      - hlk_fm22x.scan:
      - hlk_fm22x.scan:
      - hlk_fm22x.scan:
      - hlk_fm22x.scan:
      - hlk_fm22x.cancel:
      - delay: 2s
      - logger.log: "CASE queue_seven_scans_run"
      - lambda: 'fm22sim::mod.scan_mode = fm22sim::SCAN_MATCH; fm22sim::mod.scan_ms = 300;'
      - hlk_fm22x.scan:
      - hlk_fm22x.scan:
      - hlk_fm22x.scan:
      - hlk_fm22x.scan:
      - hlk_fm22x.scan:
      - hlk_fm22x.scan:
      - hlk_fm22x.scan:
      - delay: 6s
      - lambda: 'fm22sim::mod.scan_ms = 800;'
      - logger.log: "CASE restart_during_delete"
      - lambda: 'fm22sim::mod.delete_ms = 3000;'
      - hlk_fm22x.delete: 1
      - delay: 500ms
      - lambda: 'fm22sim::mod.inject = 7;'
      - delay: 4s
      - lambda: 'fm22sim::mod.delete_ms = 300;'
      - logger.log: "CASE restart_during_scan"
      - lambda: 'fm22sim::mod.scan_ms = 5000;'
      - hlk_fm22x.scan:
      - delay: 1s
      - lambda: 'fm22sim::mod.inject = 6;'
      - delay: 3s
      - lambda: 'fm22sim::mod.scan_ms = 800;'
      - logger.log: "CASE late_delete_reply (reply after 12 s)"
      - lambda: 'fm22sim::mod.delete_ms = 12000;'
      - hlk_fm22x.delete: 0
      - delay: 14s
      - lambda: 'fm22sim::mod.delete_ms = 300;'
      - logger.log: "CASE module_gone (three unanswered commands, then back)"
      - lambda: 'fm22sim::mod.alive = false;'
      - hlk_fm22x.get_face_details: 0
      - hlk_fm22x.get_face_details: 3
      - hlk_fm22x.get_face_details: 4
      - delay: 16s
      - logger.log: "CASE module_back"
      - lambda: 'fm22sim::mod.alive = true;'
      - delay: 8s
      - logger.log: "CASE notes (eye state, unknown note)"
      - lambda: 'fm22sim::mod.inject = 4;'
      - delay: 300ms
      - lambda: 'fm22sim::mod.inject = 5;'
      - delay: 1s
      - logger.log: "CASE reset_idle"
      - hlk_fm22x.reset:
      - delay: 2s
      - logger.log: "CASE delete_all"
      - hlk_fm22x.delete_all:
      - delay: 2s
