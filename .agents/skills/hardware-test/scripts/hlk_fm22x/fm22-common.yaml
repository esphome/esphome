esp32:
  board: esp32dev
  framework:
    type: esp-idf

esphome:
  includes: [fm22sim.hpp]
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            fm22sim::mod.alive = false;  // module still booting when the ESP starts
            fm22sim::mod.start(id(u_mod), false);
    - priority: -100
      then:
        - script.execute: run_all

logger:
  level: VERBOSE
  logs:
    uart.idf: DEBUG
    scheduler: DEBUG
    component: DEBUG
    esp32.preferences: DEBUG

uart:
  - id: u_fm
    tx_pin: {number: GPIO25, allow_other_uses: true}
    rx_pin: {number: GPIO26, allow_other_uses: true}
    baud_rate: 115200
  - id: u_mod
    tx_pin: {number: GPIO26, allow_other_uses: true}
    rx_pin: {number: GPIO25, allow_other_uses: true}
    baud_rate: 115200
    rx_buffer_size: 512

sensor:
  - platform: hlk_fm22x
    face_count:
      name: Face Count
      on_value: {logger.log: {format: "ENT face_count %.0f", args: [x]}}
    last_face_id:
      name: Last Face ID
      on_value: {logger.log: {format: "ENT last_face_id %.0f", args: [x]}}
    status:
      name: Face Status
      on_value: {logger.log: {format: "ENT status %.0f", args: [x]}}
