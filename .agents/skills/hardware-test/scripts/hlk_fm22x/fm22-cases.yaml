# Cases both builds understand. Each CASE line names the step in the log.
script:
  - id: common_cases
    then:
      - delay: 8s
      - logger.log: "CASE late_module: module answers from now on and sends its ready note"
      - lambda: 'fm22sim::mod.alive = true; fm22sim::mod.inject = 6;'
      - delay: 6s
      - logger.log: "CASE scan_match"
      - lambda: 'fm22sim::mod.scan_mode = fm22sim::SCAN_MATCH; fm22sim::mod.scan_ms = 800;'
      - hlk_fm22x.scan:
      - delay: 3s
      - logger.log: "CASE scan_reject"
      - lambda: 'fm22sim::mod.scan_mode = fm22sim::SCAN_REJECT;'
      - hlk_fm22x.scan:
      - delay: 3s
      - logger.log: "CASE scan_module_timeout_result"
      - lambda: 'fm22sim::mod.scan_mode = fm22sim::SCAN_TIMEOUT; fm22sim::mod.scan_ms = 1500;'
      - hlk_fm22x.scan:
      - delay: 3s
      - logger.log: "CASE two_actions_at_once (scan + delete 2)"
      - lambda: 'fm22sim::mod.scan_mode = fm22sim::SCAN_MATCH_PLAIN; fm22sim::mod.scan_ms = 800;'
      - hlk_fm22x.scan:
      - hlk_fm22x.delete: 2
      - delay: 4s
      - logger.log: "CASE enroll_five_directions"
      - hlk_fm22x.enroll: {name: "Carol", direction: 1}
      - delay: 2s
      - hlk_fm22x.enroll: {name: "Carol", direction: 2}
      - delay: 2s
      - hlk_fm22x.enroll: {name: "Carol", direction: 4}
      - delay: 2s
      - hlk_fm22x.enroll: {name: "Carol", direction: 8}
      - delay: 2s
      - hlk_fm22x.enroll: {name: "Carol", direction: 16}
      - delay: 3s
      - logger.log: "CASE bad_frames (bad checksum, garbage, partial frame) then a scan"
      - lambda: 'fm22sim::mod.inject = 1;'
      - delay: 500ms
      - lambda: 'fm22sim::mod.inject = 2;'
      - delay: 500ms
      - lambda: 'fm22sim::mod.inject = 3;'
      - delay: 1s
      - lambda: 'fm22sim::mod.scan_mode = fm22sim::SCAN_MATCH;'
      - hlk_fm22x.scan:
      - delay: 3s
      - logger.log: "CASE scan_never_answered"
      - lambda: 'fm22sim::mod.scan_mode = fm22sim::SCAN_SILENT;'
      - hlk_fm22x.scan:
      - delay: 33s
      - logger.log: "CASE scan_after_silent"
      - lambda: 'fm22sim::mod.scan_mode = fm22sim::SCAN_MATCH;'
      - hlk_fm22x.scan:
      - delay: 3s
