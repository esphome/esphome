# ac_dimmer loop harness on an ESP8266 NodeMCU (#22912). Jumpers: GPIO12 (D6) to GPIO14 (D5), GPIO13 (D7) to GPIO4 (D2).
# esp8266_pwm on GPIO12 at 100 Hz 5 % is the zero cross (falling edge); acdm.hpp timestamps crossings and gate edges.
# One build per method: run.sh passes -s method and method_idx (0 leading pulse, 1 leading, 2 trailing).
substitutions:
  name: acd
  method: trailing
  method_idx: "2"

esphome:
  name: ${name}
  includes:
    - acdm.hpp
  on_boot:
    priority: -100
    then:
      - lambda: |-
          ESP_LOGI("acdm", "BOOT reset=%s method=${method}", ESP.getResetReason().c_str());
          acdm::start();
      - output.set_level:
          id: zc_gen
          level: 5%

esp8266:
  board: nodemcuv2

logger:
  level: INFO
  baud_rate: 115200

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

web_server:
  port: 80

output:
  - platform: esp8266_pwm
    id: zc_gen
    pin: GPIO12
    frequency: 100 Hz
  - platform: ac_dimmer
    id: dim
    gate_pin: GPIO13
    zero_cross_pin:
      number: GPIO14
      mode: INPUT
    method: ${method}

interval:
  - interval: 1s
    then:
      - lambda: acdm::tick(id(dim), ${method_idx});

  - interval: 20ms
    then:
      - lambda: if (acdm::noise) acdm::inject();

# An entity for the web_server page that run.sh requests during the hold.
switch:
  - platform: template
    name: dummy
    optimistic: true
