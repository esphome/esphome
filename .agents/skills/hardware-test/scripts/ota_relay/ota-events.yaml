# Shared package: OTA, Wi-Fi and liveness log lines that webrun.sh, dropana.py and windows.py read.
web_server:
  port: 80
ota:
  - platform: esphome
    on_begin:
      - lambda: ESP_LOGI("test", "OTAEV begin");
    on_end:
      - lambda: ESP_LOGI("test", "OTAEV end");
    on_error:
      - lambda: ESP_LOGI("test", "OTAEV error %u", (unsigned) x);
    on_abort:
      - lambda: ESP_LOGI("test", "OTAEV abort");
  - platform: web_server
    on_begin:
      - lambda: ESP_LOGI("test", "OTAEV web begin");
    on_end:
      - lambda: ESP_LOGI("test", "OTAEV web end");
    on_error:
      - lambda: ESP_LOGI("test", "OTAEV web error %u", (unsigned) x);
    on_abort:
      - lambda: ESP_LOGI("test", "OTAEV web abort");
interval:
  - interval: 5s
    then:
      - lambda: ESP_LOGI("test", "alive %u s", (unsigned) (millis() / 1000));
