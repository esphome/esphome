# ESP32-S3 test network: an open AP (an open AP makes a drop show at once) plus a USB Serial/JTAG relay to the DUT
# at its static address. relay_host.py's drop-ms file renames the AP for that many ms.
esphome:
  name: otarelay-ap
  platformio_options:
    build_flags: ["-DRELAY_AP", "-DRELAY_TARGET='\"192.168.5.50\"'"]
  includes:
    - relay.hpp
  on_boot:
    priority: 600
    then:
      - lambda: relay::start();
esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP_CONSOLE_NONE: y
      CONFIG_ESP_CONSOLE_SECONDARY_NONE: y
      CONFIG_BOOTLOADER_LOG_LEVEL_NONE: y
      CONFIG_LOG_DEFAULT_LEVEL_NONE: y
logger:
  baud_rate: 0
  hardware_uart: UART0
  level: NONE
wifi:
  power_save_mode: none
  reboot_timeout: 0s
  ap:
    ssid: otarelay-main
    channel: 6
    manual_ip:
      static_ip: 192.168.5.1
      gateway: 192.168.5.1
      subnet: 255.255.255.0
