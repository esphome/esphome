# Shared sweep: sets every output to each level, waits, probes each pin. Needs a `probe_all` script in the board file.
esphome:
  includes:
    - probe.hpp
  on_boot:
    - priority: -100
      then:
        - delay: 5s
        - lambda: 'pwmprobe::calibrate();'
        - repeat:
            count: 2
            then:
              - lambda: 'id(level) = 0.0f;'
              - script.execute: probe_all
              - script.wait: probe_all
              - lambda: 'id(level) = 0.1f;'
              - script.execute: probe_all
              - script.wait: probe_all
              - lambda: 'id(level) = 0.25f;'
              - script.execute: probe_all
              - script.wait: probe_all
              - lambda: 'id(level) = 0.5f;'
              - script.execute: probe_all
              - script.wait: probe_all
              - lambda: 'id(level) = 0.9f;'
              - script.execute: probe_all
              - script.wait: probe_all
              - lambda: 'id(level) = 1.0f;'
              - script.execute: probe_all
              - script.wait: probe_all
        - lambda: 'id(level) = 0.5f;'
        - script.execute: probe_all
        - script.wait: probe_all
        - logger.log: "DONE"
globals:
  - id: level
    type: float
    initial_value: '0'
logger:
  level: DEBUG
