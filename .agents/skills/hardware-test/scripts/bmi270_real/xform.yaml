substitutions:
  name: bmix
packages:
  common: !include common.yaml
esphome:
  on_boot:
    - priority: -200
      then:
        - delay: 16s
        - lambda: ESP_LOGI("bmiprobe", "STEP calibrate_level");
        - motion.calibrate_level:
            id: imu
            on_success:
              - lambda: ESP_LOGI("bmiprobe", "STEP calibrate_level success");
            on_error:
              - lambda: ESP_LOGI("bmiprobe", "STEP calibrate_level error");
        - delay: 16s
        - lambda: ESP_LOGI("bmiprobe", "STEP clear_calibration");
        - motion.clear_calibration:
            id: imu
motion:
  - platform: bmi270
    id: imu
    i2c_id: bus
    update_interval: 1s
    axis_map:
      x: y
      y: x
      z: -z
