esphome:
  name: btuxwbase  # one name per build (btuxwbase, btuxwpr)

substitutions:
  peer_mac: "AA:BB:CC:DD:EE:FF"  # the peer S3 Bluetooth MAC (Wi-Fi MAC + 2)
  exec_write: "true"

esp32:
  framework:
    sdkconfig_options:
      # GATT API trace prints one "GATTC_ExecuteWrite conn_id=" line per execute send
      CONFIG_BT_LOG_GATT_TRACE_LEVEL_API: y

packages:
  common: !include btu-common.yaml
