# Node A (SDO client) on an ESP32-C3 with an SN65HVD230; included by nodea.yaml and nodea-late.yaml.
packages:
  a2: !include actions2.yaml
esphome:
  includes:
    - cotest.hpp
esp32:
  variant: esp32c3
  board: esp32-c3-devkitc-02
  framework:
    type: esp-idf
logger:
  hardware_uart: UART0
  level: DEBUG
  logs:
    canbus: INFO
runtime_stats:
  log_interval: 30s
canbus:
  - platform: esp32_can
    id: can_bus
    can_id: 0
    bit_rate: 250kbps
    tx_pin: GPIO5
    rx_pin: GPIO6
canopen:
  id: hub
  response_timeout: 300ms
interval:
  - interval: 10s
    then:
      - lambda: |-
          auto s = id(can_bus).get_status();
          ESP_LOGI("cot", "STAT up %u s | bus_off %d tec %u rec %u bus_err %u arb_lost %u rx_missed %u",
                   (unsigned) (millis() / 1000), s.bus_off, s.tx_error_counter, s.rx_error_counter,
                   (unsigned) s.bus_error_count, (unsigned) s.arb_lost_count, (unsigned) s.rx_missed_count);
