substitutions:
  name: canopen-pico
  clock: 8MHZ
packages:
  a2: !include actions2.yaml
esphome:
  name: ${name}
  includes:
    - cotest.hpp
  on_boot:
    priority: -100
    then: [script.execute: suite]
rp2040:
  board: rpipico2w
logger:
  level: DEBUG
  logs:
    canbus: INFO
spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19
  miso_pin: GPIO16
canbus:
  - platform: mcp2515
    id: can_bus
    cs_pin: GPIO17
    data_rate: 2MHz
    clock: ${clock}
    can_id: 0
    bit_rate: 250KBPS
canopen:
  id: hub
  response_timeout: 300ms
interval:
  - interval: 10s
    then:
      - lambda: |-
          auto s = id(can_bus).get_status();
          ESP_LOGI("cot", "STAT up %u s | bus_off %d tec %u rec %u", (unsigned) (millis() / 1000), s.bus_off,
                   s.tx_error_counter, s.rx_error_counter);
script:
  - id: suite
    then:
      - delay: 8s
      - lambda: cot::phase_values(id(hub));
      - delay: 3s
      - script.execute: actions2
      - delay: 4s
      - lambda: cot::phase_strings(id(hub));
      - delay: 3s
      - lambda: cot::phase_wrap(id(hub));
      - delay: 3s
      - lambda: cot::phase_limits(id(hub));
      - delay: 3s
      - lambda: cot::phase_bad(id(hub));
      - delay: 3s
      - lambda: cot::phase_queue(id(hub));
      - delay: 3s
      - lambda: cot::phase_queue_mixed(id(hub));
      - delay: 3s
      - repeat:
          count: 3
          then:
            - lambda: cot::phase_late(id(hub));
            - delay: 2s
            - lambda: cot::phase_late_read(id(hub));
            - delay: 2s
      - lambda: |-
          cot::summary("before soak");
          cot::soak_start(id(hub), 15000);
      - delay: 17s
      - lambda: |-
          cot::soak_report();
          cot::summary("final");
