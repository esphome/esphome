# Register dump of the nPM1300 with id(pmic).read_register16; "!" marks a failed read.
script:
  - id: regdump
    then:
      - lambda: |-
          static const uint16_t REGS[] = {0x0201, 0x0202, 0x0207, 0x0304, 0x0308, 0x0309, 0x030C, 0x0334, 0x0336,
                                          0x0408, 0x040A, 0x040F, 0x0410, 0x0411, 0x0434, 0x0804, 0x0807, 0x0808,
                                          0x0809, 0x080C, 0x080D, 0x050A};
          char buf[400];
          size_t pos = 0;
          for (uint16_t r : REGS) {
            uint8_t v = 0;
            auto err = id(pmic).read_register16(r, &v, 1);
            pos += snprintf(buf + pos, sizeof(buf) - pos, " %04X=%s%02X", r, err == i2c::ERROR_OK ? "" : "!", v);
          }
          ESP_LOGI("regs", "REGS%s", buf);
