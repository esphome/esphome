# nPM1300 hub with every entity, a 500 mA VBUS limit, the charger settings, BUCK2 at 3.3 V and LDO1 as a 3.3 V LDO,
# state log lines from on_value and on_state lambdas, a register and switch dump every 60 s, and a toggles script
# (charger off and on, LDO1 off and on). Never switch BUCK2 off on the XIAO nRF54LM20A: it powers the board.
i2c:
  - id: pmic_bus
    sda: P1.18
    scl: P1.17
npm1300:
  id: pmic
  i2c_id: pmic_bus
  update_interval: 5s
  vbus_current_limit: 500mA
  thermistor_resistance: 10kOhm
  thermistor_beta: 3380
  charger:
    charge_current: 150mA
    termination_voltage: 4.2V
    warm_termination_voltage: 4.0V
    termination_current: 20%
    trickle_voltage: 2.5V
    discharge_current_limit: 1000mA
    recharge: true
  buck2:
    voltage: 3.3V
  ldo1:
    voltage: 3.3V
    mode: ldo
    enabled: true
  ldo2:
    mode: load_switch
    enabled: false
globals:
  - id: txt_count
    type: int
    initial_value: '0'
sensor:
  - platform: npm1300
    battery_voltage:
      name: VBAT
      on_value:
        - lambda: 'ESP_LOGI("st", "SENS VBAT=%.4f", x);'
    battery_current:
      name: IBAT
      on_value:
        - lambda: 'ESP_LOGI("st", "SENS IBAT=%.4f", x);'
    battery_temperature:
      name: TBAT
      on_value:
        - lambda: 'ESP_LOGI("st", "SENS TBAT=%.4f", x);'
    die_temperature:
      name: TDIE
      on_value:
        - lambda: 'ESP_LOGI("st", "SENS TDIE=%.4f", x);'
    system_voltage:
      name: VSYS
      on_value:
        - lambda: 'ESP_LOGI("st", "SENS VSYS=%.4f", x);'
    vbus_voltage:
      name: VBUS
      on_value:
        - lambda: 'ESP_LOGI("st", "SENS VBUS=%.4f", x);'
    vbus_current_limit:
      name: ILIM
      on_value:
        - lambda: 'ESP_LOGI("st", "SENS ILIM=%.4f", x);'
binary_sensor:
  - platform: npm1300
    vbus_present:
      name: VBUS Present
      trigger_on_initial_state: true
      on_state:
        - lambda: 'ESP_LOGI("st", "BIN vbus_present=%s", x ? "ON" : "OFF");'
    vbus_current_limit_active:
      name: ILIM Active
      trigger_on_initial_state: true
      on_state:
        - lambda: 'ESP_LOGI("st", "BIN vbus_current_limit_active=%s", x ? "ON" : "OFF");'
    charging:
      name: Charging
      trigger_on_initial_state: true
      on_state:
        - lambda: 'ESP_LOGI("st", "BIN charging=%s", x ? "ON" : "OFF");'
    charge_complete:
      name: Charge Complete
      trigger_on_initial_state: true
      on_state:
        - lambda: 'ESP_LOGI("st", "BIN charge_complete=%s", x ? "ON" : "OFF");'
    battery_detected:
      name: Battery Detected
      trigger_on_initial_state: true
      on_state:
        - lambda: 'ESP_LOGI("st", "BIN battery_detected=%s", x ? "ON" : "OFF");'
    charger_error:
      name: Charger Error
      trigger_on_initial_state: true
      on_state:
        - lambda: 'ESP_LOGI("st", "BIN charger_error=%s", x ? "ON" : "OFF");'
text_sensor:
  - platform: npm1300
    charger_status:
      name: Charger Status
      on_value:
        - lambda: |-
            id(txt_count) += 1;
            ESP_LOGI("st", "TXT #%d charger_status='%s'", id(txt_count), x.c_str());
switch:
  - platform: npm1300
    charger:
      id: sw_charger
      name: Charger
      restore_mode: DISABLED
      on_state:
        - lambda: 'ESP_LOGI("st", "SW charger=%s", x ? "ON" : "OFF");'
    buck1:
      id: sw_buck1
      name: BUCK1
      restore_mode: DISABLED
      on_state:
        - lambda: 'ESP_LOGI("st", "SW buck1=%s", x ? "ON" : "OFF");'
    buck2:
      id: sw_buck2
      name: BUCK2
      restore_mode: DISABLED
      on_state:
        - lambda: 'ESP_LOGI("st", "SW buck2=%s", x ? "ON" : "OFF");'
    ldo1:
      id: sw_ldo1
      name: LDO1
      restore_mode: DISABLED
      on_state:
        - lambda: 'ESP_LOGI("st", "SW ldo1=%s", x ? "ON" : "OFF");'
    ldo2:
      id: sw_ldo2
      name: LDO2
      restore_mode: DISABLED
      on_state:
        - lambda: 'ESP_LOGI("st", "SW ldo2=%s", x ? "ON" : "OFF");'
script:
  - id: swdump
    then:
      - lambda: |-
          ESP_LOGI("st", "SWSTATE charger=%d buck1=%d buck2=%d ldo1=%d ldo2=%d txt_count=%d", id(sw_charger).state,
                   id(sw_buck1).state, id(sw_buck2).state, id(sw_ldo1).state, id(sw_ldo2).state, id(txt_count));
  - id: toggles
    then:
      - logger.log: "STEP charger off"
      - switch.turn_off: sw_charger
      - delay: 1s
      - script.execute: regdump
      - component.update: pmic
      - delay: 1s
      - script.execute: swdump
      - logger.log: "STEP charger on"
      - switch.turn_on: sw_charger
      - delay: 1s
      - script.execute: regdump
      - component.update: pmic
      - delay: 1s
      - script.execute: swdump
      - logger.log: "STEP ldo1 off"
      - switch.turn_off: sw_ldo1
      - delay: 1s
      - script.execute: regdump
      - component.update: pmic
      - delay: 1s
      - script.execute: swdump
      - logger.log: "STEP ldo1 on"
      - switch.turn_on: sw_ldo1
      - delay: 1s
      - script.execute: regdump
      - component.update: pmic
      - delay: 1s
      - script.execute: swdump
      - logger.log: "STEP done"
interval:
  - interval: 60s
    then:
      - script.execute: regdump
      - script.execute: swdump
