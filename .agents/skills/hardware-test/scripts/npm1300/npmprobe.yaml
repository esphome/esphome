# XIAO nRF54LM20A probe build: the hub with no regulator or charger settings, a bus scan and a register dump every
# 20 s, to see the power-on state before writing anything. Name set with -s name.
esphome:
  name: ${name}
  on_boot:
    - priority: -100
      then:
        - delay: 3s
        - script.execute: regdump
nrf52:
  board: xiao_nrf54lm20a
logger:
  level: DEBUG
  hardware_uart: UART0
packages:
  regdump: !include regdump.yaml
i2c:
  - id: pmic_bus
    sda: P1.18
    scl: P1.17
    scan: true
npm1300:
  id: pmic
  i2c_id: pmic_bus
sensor:
  - platform: npm1300
    system_voltage:
      name: VSYS
    vbus_voltage:
      name: VBUS
    battery_voltage:
      name: VBAT
    die_temperature:
      name: Die
interval:
  - interval: 20s
    then:
      - script.execute: regdump
