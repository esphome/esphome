substitutions:
  name: wsevs
esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf
logger:
  hardware_uart: USB_SERIAL_JTAG
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
external_components:
  - source:
      type: local
      path: ext/components
    components: [https_test]
https_test:
packages:
  common: !include common.yaml
