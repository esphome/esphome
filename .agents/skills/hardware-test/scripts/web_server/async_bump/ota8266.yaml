# D1 mini web OTA images: aws-common.yaml plus a version text sensor, the max free block and alive logs
substitutions:
  name: ota8266-x
  ver: a
packages:
  common: !include aws-common.yaml
esphome:
  on_boot:
    priority: -100
    then:
      - lambda: ESP_LOGI("otatest", "BOOTED ver=${ver} heap=%u", (unsigned) ESP.getFreeHeap());
esp8266:
  board: d1_mini
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
web_server:
  version: 3
interval:
  - interval: 10s
    then:
      - lambda: ESP_LOGI("otatest", "alive ver=${ver} heap=%u maxblk=%u", (unsigned) ESP.getFreeHeap(), (unsigned) ESP.getMaxFreeBlockSize());
text_sensor:
  - platform: template
    name: Build ver
    lambda: return {"${ver}"};
    update_interval: 60s
sensor:
  - platform: debug
    block:
      name: Heap max block
