# Shared by every web_server build: web_server + web OTA + prometheus, fast sensor, switch, number, light
esphome:
  name: ${name}
logger:
  level: DEBUG
api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s
ota:
  - platform: esphome
  - platform: web_server
web_server:
  port: 80
prometheus:
debug:
  update_interval: 5s
text_sensor:
  - platform: debug
    reset_reason:
      name: Reset reason
sensor:
  - platform: uptime
    name: Uptime
    update_interval: 1s
  - platform: debug
    free:
      name: Heap free
  - platform: template
    name: Fast counter
    update_interval: 200ms
    lambda: |-
      static uint32_t n = 0;
      return n++;
switch:
  - platform: template
    name: Test switch
    optimistic: true
number:
  - platform: template
    name: Test number
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
output:
  - platform: template
    id: light_out
    type: float
    write_action:
      - lambda: ESP_LOGD("test", "light out %.3f", state);
light:
  - platform: monochromatic
    name: Test light
    output: light_out
    default_transition_length: 0s
button:
  - platform: restart
    name: Restart
