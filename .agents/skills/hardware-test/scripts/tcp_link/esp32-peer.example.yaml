substitutions:
  name: tcpe1
  peer: tcph3
  peer_host: HOST_LAN_IP
  srv_port: "46501"
  raw_port: "46502"
  probe_port: "46503"
  peer_srv_port: "46301"
  peer_raw_port: "46302"
  probe_host: HOST_LAN_IP
  probe_cli_port: "46504"
  probe_allow: HOST_LAN_IP/32
  et_key: Johnny Cash
  api_port: "6053"
  long_id: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
esp32:
  board: esp32dev
  framework:
    type: esp-idf
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
ota:
  - platform: esphome
packages:
  link: !include tcplink.yaml
packet_interface:
  - platform: tcp
    id: deny_srv
    role: server
    port: 46505
    allowed_ips: 10.255.255.1/32
    connected:
      name: deny_srv connected
      on_state:
        - logger.log: {format: "CONN deny_srv %d", args: ["x ? 1 : 0"]}
