# All Xiaomi BLE platforms on one ESP32-S3 (ESP-IDF), frames from gen_all.py injected into the tracker.
# Build: python gen_all.py, then esphome -s name <name> compile xball.yaml. No network: logs on USB_SERIAL_JTAG.
substitutions:
  name: xball

esphome:
  name: ${name}
  includes:
    - frames_all.hpp

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

esp32_ble_tracker:

globals:
  - id: xa_cycle
    type: int
    initial_value: "0"

interval:
  - interval: 1s
    startup_delay: 20s
    then:
      - lambda: |-
          int c = id(xa_cycle);
          if (c == 0)
            ESP_LOGI("heap", "IDLE before inject: free %u internal %u min %u largest %u", (unsigned) esp_get_free_heap_size(),
                     (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL), (unsigned) esp_get_minimum_free_heap_size(),
                     (unsigned) heap_caps_get_largest_free_block(MALLOC_CAP_INTERNAL));
          if ((size_t) c * XA_PER_CYCLE < XA_COUNT) {
            ESP_LOGI("xa", "inject cycle %d", c + 1);
            xa_inject(c * XA_PER_CYCLE, (c + 1) * XA_PER_CYCLE);
          } else if ((size_t) c * XA_PER_CYCLE == XA_COUNT + 10 * XA_PER_CYCLE) {
            ESP_LOGI("xa", "INJECT DONE");
            ESP_LOGI("heap", "IDLE after inject: free %u internal %u min %u", (unsigned) esp_get_free_heap_size(),
                     (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL), (unsigned) esp_get_minimum_free_heap_size());
          }
          id(xa_cycle)++;
