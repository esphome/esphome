substitutions:
  name: xbinject

esphome:
  name: ${name}
  includes:
    - frames.hpp

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

globals:
  - id: xb_step
    type: int
    initial_value: "0"

esp32_ble_tracker:
  on_ble_service_data_advertise:
    - mac_address: A4:C1:38:00:00:0A
      service_uuid: FE95
      then:
        - lambda: |-
            char buf[80];
            size_t n = 0;
            for (size_t i = 0; i < x.size() && n + 3 < sizeof(buf); i++)
              n += snprintf(buf + n, sizeof(buf) - n, "%02X", x[i]);
            ESP_LOGI("svcA", "len %u data %s", (unsigned) x.size(), buf);

interval:
  - interval: 1s
    startup_delay: 15s
    then:
      - lambda: |-
          if (id(xb_step) + 1 >= (int) XB_NUM_STEPS) {
            if (id(xb_step) + 1 == (int) XB_NUM_STEPS) {
              ESP_LOGI("xb", "INJECT DONE");
              xb_rewrite_probe(id(xa));
              id(xb_step)++;
            }
            return;
          }
          int s = id(xb_step);
          ESP_LOGI("xb", "inject step %d frames %u..%u", s, XB_STEPS[s], XB_STEPS[s + 1]);
          if (s == 0)
            xb_inject(0, XB_STEPS[0]);
          xb_inject(XB_STEPS[s], XB_STEPS[s + 1]);
          id(xb_step)++;

sensor:
  - platform: xiaomi_lywsd03mmc
    id: xa
    mac_address: A4:C1:38:00:00:0A
    bindkey: 6c0d1a3e5b7f29c4a18e90d2f3b46a57
    temperature:
      name: "xA lywsd03mmc temp"
