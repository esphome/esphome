esphome:
  name: ${name}

logger:
  level: DEBUG

wifi:
  networks:
    - ssid: !secret wisp_up_ssid
      password: !secret wisp_up_password
      manual_ip:
        static_ip: ${ip}
        gateway: 10.40.0.1
        subnet: 255.255.255.0
        dns1: 10.40.0.1
  power_save_mode: LIGHT
  ap:
    ssid: ${name}-fallback
    password: !secret fallback_ap_password

captive_portal:

web_server:
  port: 80

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

udp:
  addresses:
    - !secret syslog_ip
time:
  - platform: sntp
syslog:
  port: 5514

interval:
  - interval: 10s
    then:
      - lambda: ESP_LOGI("alive", "up %u s", (unsigned) (millis() / 1000));
  - interval: 30s
    then:
      - if:
          condition:
            lambda: |-
              static bool done = false;
              if (done || millis() < 19 * 60 * 1000) return false;
              done = true;
              return true;
          then:
            - lambda: ESP_LOGI("alive", "GOING HOME");
            - wifi.configure:
                ssid: !secret wifi_ssid
                password: !secret wifi_password
                save: false
