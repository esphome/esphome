esphome:
  name: wisp-upstream
  includes:
    - wdap_inc.h
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - script.execute: wpa3_ap

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9

wifi:
  ap:
    ssid: !secret wisp_up_ssid
    password: !secret wisp_up_password
    ap_mode: WISP
    manual_ip:
      static_ip: 10.40.0.1
      gateway: 10.40.0.1
      subnet: 255.255.255.0

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome

web_server:
  port: 80

button:
  - platform: template
    name: ap off
    on_press:
      - wifi.disable:
  - platform: template
    name: ap on
    on_press:
      - wifi.enable:
      - delay: 3s
      - script.execute: wpa3_ap

script:
  - id: wpa3_ap
    then:
      - lambda: |-
          static bool registered = false;
          wifi_config_t c{};
          esp_err_t err = esp_wifi_get_config(WIFI_IF_AP, &c);
          if (err == ESP_OK) {
            c.ap.authmode = WIFI_AUTH_WPA2_WPA3_PSK;
            c.ap.pmf_cfg.required = false;
            c.ap.sae_pwe_h2e = WPA3_SAE_PWE_BOTH;
            err = esp_wifi_set_config(WIFI_IF_AP, &c);
          }
          // read back: only a running AP that reports WPA2/WPA3 mixed counts as switched
          wifi_config_t check{};
          if (err == ESP_OK)
            err = esp_wifi_get_config(WIFI_IF_AP, &check);
          if (err != ESP_OK || check.ap.authmode != WIFI_AUTH_WPA2_WPA3_PSK) {
            ESP_LOGE("wdap", "AP CONFIG FAILED: %d authmode %d", err, (int) check.ap.authmode);
          } else {
            ESP_LOGI("wdap", "AP set to WPA2/WPA3 mixed, PMF capable: %d", err);
          }
          if (registered) return;
          registered = true;
          esp_event_handler_register(WIFI_EVENT, ESP_EVENT_ANY_ID, [](void *, esp_event_base_t, int32_t id, void *data) {
            if (id == WIFI_EVENT_AP_STACONNECTED) {
              auto *e = (wifi_event_ap_staconnected_t *) data;
              ESP_LOGI("wdap", "STA JOIN %02X:%02X:%02X:%02X:%02X:%02X", e->mac[0], e->mac[1], e->mac[2], e->mac[3], e->mac[4], e->mac[5]);
            } else if (id == WIFI_EVENT_AP_STADISCONNECTED) {
              auto *e = (wifi_event_ap_stadisconnected_t *) data;
              ESP_LOGI("wdap", "STA LEAVE %02X:%02X:%02X:%02X:%02X:%02X reason %u", e->mac[0], e->mac[1], e->mac[2], e->mac[3], e->mac[4], e->mac[5], e->reason);
            }
          }, nullptr);
