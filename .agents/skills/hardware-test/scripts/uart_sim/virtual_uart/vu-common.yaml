esphome:
  name: ${name}
  includes:
    - vu.hpp

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  level: DEBUG

debug:
  update_interval: 10s

sensor:
  - platform: debug
    free:
      name: Heap free
    loop_time:
      name: Loop time
  - platform: sds011
    uart_id: vu_sds
    pm_2_5:
      name: SDS PM2.5
      on_value:
        - lambda: vu::on_sds_state(x);
    pm_10_0:
      name: SDS PM10
  - platform: mhz19
    uart_id: vu_mhz
    update_interval: 2s
    warmup_time: 0s
    automatic_baseline_calibration: false
    co2:
      name: MHZ CO2
      on_value:
        - lambda: vu::on_mhz_state(x);
    temperature:
      name: MHZ Temp
      on_value:
        - lambda: vu::on_mhz_temp(x);

virtual_uart:
  - id: vu_sds
    baud_rate: 9600
    rx_buffer_size: 20
    on_tx:
      - lambda: vu::on_sds_tx(data);
  - id: vu_mhz
    baud_rate: 9600
    rx_buffer_size: 32
    debug:
      direction: BOTH
      after:
        bytes: 9
    on_tx:
      - lambda: vu::on_mhz_tx(id(vu_mhz), data);
  - id: vu_raw
    baud_rate: 115200
    rx_buffer_size: 128
  - id: vu_self
    baud_rate: 115200
    rx_buffer_size: 16
    on_tx:
      - lambda: vu::st.self_tx_calls++;
      - uart.write:
          id: vu_self
          data: [0x01]

script:
  - id: raw_round
    parameters:
      log_it: bool
    then:
      - virtual_uart.inject_rx:
          id: vu_raw
          data: [0x00, 0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08, 0x09, 0x0A, 0x0B, 0x0C, 0x0D, 0x0E, 0x0F, 0x10, 0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17, 0x18, 0x19, 0x1A, 0x1B, 0x1C, 0x1D, 0x1E, 0x1F, 0x20, 0x21, 0x22, 0x23, 0x24, 0x25, 0x26, 0x27, 0x28, 0x29, 0x2A, 0x2B, 0x2C, 0x2D, 0x2E, 0x2F, 0x30, 0x31, 0x32, 0x33, 0x34, 0x35, 0x36, 0x37, 0x38, 0x39, 0x3A, 0x3B, 0x3C, 0x3D, 0x3E, 0x3F, 0x40, 0x41, 0x42, 0x43, 0x44, 0x45, 0x46, 0x47, 0x48, 0x49, 0x4A, 0x4B, 0x4C, 0x4D, 0x4E, 0x4F, 0x50, 0x51, 0x52, 0x53, 0x54, 0x55, 0x56, 0x57, 0x58, 0x59, 0x5A, 0x5B, 0x5C, 0x5D, 0x5E, 0x5F, 0x60, 0x61, 0x62, 0x63]
      - virtual_uart.inject_rx:
          id: vu_raw
          data: [0x64, 0x65, 0x66, 0x67, 0x68, 0x69, 0x6A, 0x6B, 0x6C, 0x6D, 0x6E, 0x6F, 0x70, 0x71, 0x72, 0x73, 0x74, 0x75, 0x76, 0x77]
      - virtual_uart.inject_rx:
          id: vu_raw
          data: [0xEE, 0xEE, 0xEE, 0xEE, 0xEE, 0xEE, 0xEE, 0xEE, 0xEE]
      - virtual_uart.inject_rx:
          id: vu_raw
          data: [0x78, 0x79, 0x7A, 0x7B, 0x7C, 0x7D, 0x7E, 0x7F]
      - lambda: vu::raw_check(id(vu_raw), log_it);

interval:
  - interval: 2s
    then:
      - virtual_uart.inject_rx:
          id: vu_sds
          data: [0xAA, 0xC0, 0x7B, 0x00, 0xC8, 0x01, 0x12, 0x34, 0x8A, 0xAB]
      - delay: 1s
      - virtual_uart.inject_rx:
          id: vu_sds
          data: !lambda return vu::sds_next();
  - interval: 15s
    then:
      - lambda: vu::overflow(id(vu_sds));
      - script.execute:
          id: raw_round
          log_it: true
      - uart.write:
          id: vu_self
          data: [0x55, 0x56]
  - interval: 200ms
    then:
      - script.execute:
          id: raw_round
          log_it: false
  - interval: 10s
    then:
      - lambda: vu::summary();
