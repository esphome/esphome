esphome:
  name: rsi2
  includes:
    - simrs2.hpp
  on_boot:
    priority: -100
    then:
      - lambda: 'simrs::bus = id(sim_uart); simrs::double_mode = false;'
      - script.execute: cases

esp32:
  variant: esp32c3
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

uart:
  - id: rs_uart
    tx_pin: {number: GPIO3, allow_other_uses: true}
    rx_pin: {number: GPIO4, allow_other_uses: true}
    baud_rate: 9600
  - id: sim_uart
    tx_pin: {number: GPIO4, allow_other_uses: true}
    rx_pin: {number: GPIO3, allow_other_uses: true}
    baud_rate: 9600

interval:
  - interval: 5ms
    then:
      - lambda: simrs::poll();

rs485_frame:
  id: hub
  uart_id: rs_uart
  framing:
    escape:
      mode: escape_byte
      byte: 0x00
  crc:
    type: sum16_big_endian
  tx:
    gate:
      mode: idle_gap
      min_silence: 50ms
    queue_policy: fifo
    max_queue_size: 4
  dump_frames: true
  frame_timeout: 50ms
  max_frame_length: 200
  on_frame:
    - frame_type: []
      then:
        - lambda: |-
            char hex[300];
            format_hex_to(hex, sizeof(hex), payload.data(), payload.size() > 140 ? 140 : payload.size());
            ESP_LOGI("hwt", "FRAME t=%u %u B %s", (unsigned) millis(), (unsigned) payload.size(), hex);

button:
  - platform: rs485_frame
    id: cmd_a
    rs485_frame_id: hub
    name: cmd a
    frame_type: [0x00, 0x83]
    payload: [0x01, 0x10, 0xA1]
  - platform: rs485_frame
    id: cmd_b
    rs485_frame_id: hub
    name: cmd b
    frame_type: [0x00, 0x83]
    payload: [0x01, 0x10, 0xB2]

script:
  - id: cases
    then:
      - logger.log: "I0 quiet bus since boot, press cmd a"
      - lambda: 'ESP_LOGI("hwt", "PRESS I0 t=%u", (unsigned) millis());'
      - button.press: cmd_a
      - delay: 1s
      - lambda: 'simrs::send("I0 one garbage byte", {0x55});'
      - delay: 1s
      - logger.log: "I1 garbage byte every 20 ms for 600 ms, press cmd b after 100 ms"
      - repeat:
          count: 30
          then:
            - lambda: |-
                static int i = 0;
                simrs::send("I1 stream", {0x55});
                if (++i == 5) { ESP_LOGI("hwt", "PRESS I1 t=%u", (unsigned) millis()); id(cmd_b).press(); }
            - delay: 20ms
      - delay: 1s
      - logger.log: "I2 three 100 B frames queued at once"
      - rs485_frame.send_frame:
          id: hub
          frame_type: [0x00, 0x84]
          payload: !lambda 'return simrs::filled({0x01, 0xE1}, 100, 0x5A);'
      - rs485_frame.send_frame:
          id: hub
          frame_type: [0x00, 0x84]
          payload: !lambda 'return simrs::filled({0x01, 0xE2}, 100, 0x5A);'
      - rs485_frame.send_frame:
          id: hub
          frame_type: [0x00, 0x84]
          payload: !lambda 'return simrs::filled({0x01, 0xE3}, 100, 0x5A);'
      - delay: 2s
      - logger.log: "I3 cmd a queued, then a 40 B bus frame arrives"
      - lambda: 'simrs::send("I3 bus frame", simrs::frame(simrs::filled({0x01, 0x02, 0xD3}, 40, 0x33)));'
      - delay: 20ms
      - lambda: 'ESP_LOGI("hwt", "PRESS I3 t=%u", (unsigned) millis());'
      - button.press: cmd_a
      - delay: 1s
      - lambda: 'ESP_LOGI("hwt", "DONE");'
