# Package: Wi-Fi, plaintext API, web_server v3, OTA and a heap sensor; the device name comes from ${name}.
esphome:
  name: ${name}
  on_boot:
    - lambda: ESP_LOGI("test", "BOOTMARK name=${name}");
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
api:
  reboot_timeout: 0s
web_server:
  port: 80
  version: 3
ota:
  - platform: esphome
debug:
  update_interval: 10s
sensor:
  - platform: debug
    free:
      name: heap_free
