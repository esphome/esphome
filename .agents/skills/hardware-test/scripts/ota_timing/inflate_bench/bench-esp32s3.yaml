# Inflate benchmark: run gen_streams.py first, then bench.sh. Results go out over syslog to syslog_ip:5514.
substitutions:
  name: inflbench-s3

esphome:
  name: ${name}
  includes:
    - bench_streams.hpp
    - bench.hpp

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

udp:
  addresses:
    - !secret syslog_ip

time:
  - platform: sntp

syslog:
  port: 5514

interval:
  - interval: 90s
    then:
      - delay: 20s
      - lambda: run_inflate_bench();
