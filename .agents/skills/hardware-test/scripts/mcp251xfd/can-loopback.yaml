esphome:
  name: canlb-loopback
  includes:
    - canlb.hpp
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            ESP_LOGI("ram", "BOOTFREE %u TOTAL %u", (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL), (unsigned) heap_caps_get_total_size(MALLOC_CAP_INTERNAL));
            canlb::chip = id(can0);
            canlb::classic = false;
            canlb::cs_init(32);
            canlb::regs("boot");
            canlb::start(id(can0));
        - delay: 20s
        - lambda: canlb::report();
        - lambda: canlb::rtr_test();
        - delay: 500ms
        - lambda: canlb::queue_report("rtr");
        - lambda: canlb::resume();
        - delay: 5s
        - lambda: canlb::timing("pre-reset");
        - lambda: canlb::chip_reset();
        - lambda: canlb::watch_start(2);
        - delay: 10s
        - lambda: canlb::timing("reset+10s");
        - lambda: canlb::regs("reset+10s");
        - lambda: canlb::report();
        - delay: 10s
        - lambda: canlb::report();
        - lambda: canlb::force_mode(3);
        - lambda: canlb::watch_start(2);
        - wait_until:
            condition:
              lambda: return !canlb::watching;
            timeout: 15s
        - lambda: canlb::force_mode(3);
        - lambda: canlb::watch_start(2);
        - wait_until:
            condition:
              lambda: return !canlb::watching;
            timeout: 15s
        - delay: 5s
        - lambda: canlb::report();
        - delay: 10s
        - lambda: canlb::report();
        - lambda: ESP_LOGI("canlb", "PHASES DONE");

esp32:
  board: pico32
  framework:
    type: esp-idf

logger:
  level: DEBUG

spi:
  clk_pin: GPIO25
  mosi_pin: GPIO26
  miso_pin: GPIO27

canbus:
  - platform: mcp251xfd
    id: can0
    cs_pin: GPIO32
    interrupt_pin: GPIO33
    can_id: 0x7FF
    mode: LOOPBACK
    clock: 20MHZ
    bit_rate: 1000KBPS
    data_bit_rate: 5000KBPS

interval:
  - interval: 2ms
    then:
      - lambda: canlb::step();
  - interval: 10s
    then:
      - lambda: canlb::report();

sensor:
  - platform: pulse_counter
    pin: GPIO34
    name: clko
    internal_filter: 0us
    update_interval: 60s
