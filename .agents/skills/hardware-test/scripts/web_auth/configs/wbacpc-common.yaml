# Captive portal client: joins the DUT AP, probes portal and web_server routes without credentials,
# one bogus save, then the real credentials. Lines: "probe <what> status N", "real save status N"
substitutions:
  ap_ssid: wbacp
  ap_password: hwtestpass
  real_ssid: !secret wifi_ssid
  real_psk: !secret wifi_password
  basic_hash: "aHc6azdx"
esphome:
  name: ${name}
logger:
  level: DEBUG
http_request:
  id: http
  verify_ssl: false
  timeout: 10s
wifi:
  id: wifi_id
  networks:
    - ssid: ${ap_ssid}
      password: ${ap_password}
      priority: 10
    - ssid: ${real_ssid}
      password: ${real_psk}
  on_connect:
    - if:
        condition:
          lambda: |-
            char b[40];
            return strncmp(id(wifi_id).get_ip_addresses()[0].str_to(b), "192.168.4.", 10) == 0;
        then:
          - script.execute: probe
script:
  - id: probe
    mode: single
    then:
      - delay: 3s
      - http_request.get:
          url: "http://192.168.4.1/"
          capture_response: true
          on_response:
            - lambda: ESP_LOGI("test", "probe portal_root status %d len %d", response->status_code, (int) body.size());
          on_error:
            - lambda: ESP_LOGW("test", "probe portal_root status -1");
      - http_request.get:
          url: "http://192.168.4.1/config.json"
          capture_response: true
          on_response:
            - lambda: ESP_LOGI("test", "probe config_json status %d len %d", response->status_code, (int) body.size());
          on_error:
            - lambda: ESP_LOGW("test", "probe config_json status -1");
      - http_request.post:
          url: "http://192.168.4.1/switch/Test%20switch/toggle"
          capture_response: true
          on_response:
            - lambda: ESP_LOGI("test", "probe post_noauth status %d", response->status_code);
          on_error:
            - lambda: ESP_LOGW("test", "probe post_noauth status -1");
      - http_request.post:
          url: "http://192.168.4.1/switch/Test%20switch/toggle"
          request_headers:
            Authorization: "Basic ${basic_hash}"
          capture_response: true
          on_response:
            - lambda: ESP_LOGI("test", "probe post_auth status %d", response->status_code);
          on_error:
            - lambda: ESP_LOGW("test", "probe post_auth status -1");
      - http_request.get:
          url: "http://192.168.4.1/wifisave?ssid=hwtest-no-such-network&psk=nosuchpassword"
          capture_response: true
          on_response:
            - lambda: ESP_LOGI("test", "probe bogus_save status %d", response->status_code);
          on_error:
            - lambda: ESP_LOGW("test", "probe bogus_save status -1");
      - delay: 3s
      - logger.log: "posting the real credentials"
      - http_request.get:
          url: "http://192.168.4.1/wifisave?ssid=${real_ssid}&psk=${real_psk}"
          capture_response: true
          on_response:
            - lambda: ESP_LOGI("test", "real save status %d", response->status_code);
          on_error:
            - lambda: ESP_LOGW("test", "real save status -1");
interval:
  - interval: 5s
    then:
      - lambda: ESP_LOGI("test", "alive %u s", (unsigned) (millis() / 1000));
