# BW15 (RTL8720CF) on the station network with the Basic auth web_server and a 1 s heap reading for heap_churn.py
# (the 5 s default makes heap reads stale). Name set with -s name.
rtl87xx:
  board: bw15
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
debug:
  update_interval: 1s
packages:
  creds: !include creds-short.yaml
  common: !include wba-common.yaml
