# JSON stack arena check (#22699) on LibreTiny: VERY_VERBOSE logs over /events, a select with 40 long options, the main
# task stack high-water mark (stackmin.hpp) and free heap every 5 s as a log line and sensors, web_server v3 with Basic
# auth. Substitutions: name, web_user, web_pass (arena.sh passes them from ../configs/creds-*.yaml).
esphome:
  name: ${name}
  includes:
    - stackmin.hpp
logger:
  level: VERY_VERBOSE
ota:
  - platform: esphome
  - platform: web_server
web_server:
  port: 80
  version: 3
  auth:
    username: ${web_user}
    password: ${web_pass}
    type: basic
sensor:
  - platform: uptime
    name: Uptime
    update_interval: 1s
  - platform: template
    name: Stack min
    unit_of_measurement: B
    update_interval: 5s
    lambda: |-
      int32_t n = stackmin_free_bytes();
      return n < 0 ? NAN : (float) n;
  - platform: template
    name: Heap free
    unit_of_measurement: B
    update_interval: 5s
    lambda: return (float) lt_heap_get_free();
  - platform: template
    name: Fast counter
    update_interval: 200ms
    lambda: |-
      static uint32_t n = 0;
      return n++;
interval:
  - interval: 5s
    then:
      - lambda: |-
          ESP_LOGI("hwm", "main task stack min %d B, heap %u B, task %s",
                   (int) stackmin_free_bytes(),
                   (unsigned) lt_heap_get_free(), pcTaskGetName(nullptr));
switch:
  - platform: template
    name: Test switch
    optimistic: true
select:
  - platform: template
    name: Big select
    optimistic: true
    options:
      - "Option 00 with a deliberately long label to grow the listing"
      - "Option 01 with a deliberately long label to grow the listing"
