# Station: reboots on the first loop pass after WIFI_EVENT_STA_CONNECTED, before the Wi-Fi component's loop has handled
# the connect event (the window where a flag set from the main loop lags). Alternates App.reboot()/safe_reboot().
esphome:
  name: ${name}
  includes:
    - st_inc.hpp
  on_boot:
    priority: 200
    then:
      - lambda: st_register();

esp32:
  board: ${board}
  framework:
    type: esp-idf

logger:
  level: DEBUG

globals:
  - id: boots
    type: int
    restore_value: true
    initial_value: "0"
  - id: fired
    type: bool
    initial_value: "false"

wifi:
  ssid: w15pmf
  password: !secret wd_ap_password
  min_auth_mode: WPA2
  power_save_mode: none

interval:
  - interval: 1ms
    then:
      - lambda: |-
          int64_t c = s_conn_us.load();
          if (id(fired) || c == 0)
            return;
          id(fired) = true;
          id(boots) += 1;
          global_preferences->sync();
          bool comp = wifi::global_wifi_component->is_connected();
          if (id(boots) % 2) {
            ESP_LOGI("st", "EARLY REBOOT forced n=%d %lld us after STA_CONNECTED, component connected=%d", id(boots), (long long) (esp_timer_get_time() - c), comp);
            App.reboot();
          } else {
            ESP_LOGI("st", "EARLY REBOOT safe n=%d %lld us after STA_CONNECTED, component connected=%d", id(boots), (long long) (esp_timer_get_time() - c), comp);
            App.safe_reboot();
          }
