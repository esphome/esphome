# Station: reboots on the first loop pass after WIFI_EVENT_STA_CONNECTED, before the Wi-Fi component's loop has handled
# the connect event (the window where a flag set from the main loop lags). The event handler wakes the loop and
# on_loop runs before the Wi-Fi component's loop in that pass. Alternates App.reboot()/safe_reboot().
packages:
  base: !include st-base.yaml

esphome:
  includes:
    - st_inc.hpp
  on_boot:
    priority: 200
    then:
      - lambda: st_register();
  on_loop:
    - lambda: |-
        int64_t c = s_conn_us.load();
        if (id(fired) || c == 0)
          return;
        id(fired) = true;
        id(boots) += 1;
        global_preferences->sync();
        const bool forced = id(boots) % 2;
        ESP_LOGI("st", "EARLY REBOOT %s n=%d %lld us after STA_CONNECTED, component connected=%d",
                 forced ? "forced" : "safe", id(boots), (long long) (esp_timer_get_time() - c),
                 wifi::global_wifi_component->is_connected());
        if (forced) {
          App.reboot();
        } else {
          App.safe_reboot();
        }

globals:
  - id: fired
    type: bool
    initial_value: "false"
