# Station: joins the WPA3-only AP and alternates App.reboot() and App.safe_reboot() 10 s after connecting.
esphome:
  name: ${name}

esp32:
  board: ${board}
  framework:
    type: esp-idf

logger:
  level: DEBUG

globals:
  - id: boots
    type: int
    restore_value: true
    initial_value: "0"

wifi:
  ssid: w15pmf
  password: !secret wd_ap_password
  min_auth_mode: WPA2
  power_save_mode: none
  on_connect:
    - lambda: ESP_LOGI("st", "JOINED after %u ms since boot", (unsigned) millis());
    - delay: 10s
    - lambda: |-
        id(boots) += 1;
        global_preferences->sync();
        if (id(boots) % 2) {
          ESP_LOGI("st", "REBOOT forced n=%d", id(boots));
          App.reboot();
        } else {
          ESP_LOGI("st", "REBOOT safe n=%d", id(boots));
          App.safe_reboot();
        }
