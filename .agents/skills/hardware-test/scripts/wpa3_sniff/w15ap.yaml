# WPA3-SAE only AP with PMF required (set `board:`, an ESP32-C6 devkit here); logs station join/leave events and the management frames its
# sniffer sees (assoc req, auth, disassoc, deauth) with retry bit and sequence number.
esphome:
  name: w15ap
  includes:
    - sniff_inc.hpp
  on_boot:
    priority: -100
    then:
      - delay: 3s
      - lambda: |-
          wifi_config_t c{};
          esp_err_t err = esp_wifi_get_config(WIFI_IF_AP, &c);
          if (err == ESP_OK) {
            c.ap.authmode = WIFI_AUTH_WPA3_PSK;
            c.ap.pmf_cfg.capable = true;
            c.ap.pmf_cfg.required = true;
            c.ap.sae_pwe_h2e = WPA3_SAE_PWE_BOTH;
            c.ap.max_connection = 4;
            err = esp_wifi_set_config(WIFI_IF_AP, &c);
          }
          wifi_config_t check{};
          if (err == ESP_OK)
            err = esp_wifi_get_config(WIFI_IF_AP, &check);
          if (err != ESP_OK || check.ap.authmode != WIFI_AUTH_WPA3_PSK || !check.ap.pmf_cfg.required) {
            ESP_LOGE("wdap", "AP CONFIG FAILED: %d authmode %d", err, (int) check.ap.authmode);
          } else {
            ESP_LOGI("wdap", "AP set to WPA3-SAE, PMF required, channel %u: %d", check.ap.channel, err);
          }
          esp_event_handler_register(WIFI_EVENT, ESP_EVENT_ANY_ID, [](void *, esp_event_base_t, int32_t id, void *data) {
            if (id == WIFI_EVENT_AP_STACONNECTED) {
              auto *e = (wifi_event_ap_staconnected_t *) data;
              ESP_LOGI("wdap", "STA JOIN %02X:%02X:%02X:%02X:%02X:%02X aid %u t_us %lld", e->mac[0], e->mac[1], e->mac[2], e->mac[3], e->mac[4], e->mac[5], e->aid, (long long) esp_timer_get_time());
            } else if (id == WIFI_EVENT_AP_STADISCONNECTED) {
              auto *e = (wifi_event_ap_stadisconnected_t *) data;
              ESP_LOGI("wdap", "STA LEAVE %02X:%02X:%02X:%02X:%02X:%02X aid %u reason %u t_us %lld", e->mac[0], e->mac[1], e->mac[2], e->mac[3], e->mac[4], e->mac[5], e->aid, e->reason, (long long) esp_timer_get_time());
            }
          }, nullptr);
          sniff_start();
      - delay: 5400s
      - lambda: ESP_LOGI("wdap", "AP WINDOW OVER");
      - wifi.disable:

esp32:
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf

logger:
  level: DEBUG

wifi:
  ap:
    ssid: w15pmf
    password: !secret wd_ap_password
    channel: 11
    ap_timeout: 0s

interval:
  - interval: 50ms
    then:
      - lambda: sniff_drain();
