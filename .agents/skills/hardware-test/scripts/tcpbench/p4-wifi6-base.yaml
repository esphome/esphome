# Waveshare ESP32-P4-WIFI6 (rev 1.3, pre-rev3 silicon): Wi-Fi through the ESP32-C6 over SDIO. Logs a BUILDTAG line
# at boot so round.sh can check which build runs. Never flash a rev3-only build on this board (boot loop).
esphome:
  name: ${name}
  on_boot:
    - priority: -100
      then:
        - logger.log: {format: "BUILDTAG ${name}", level: INFO}
esp32:
  variant: esp32p4
  board: esp32-p4-evboard
  engineering_sample: true
  framework:
    type: esp-idf
    log_level: INFO
esp32_hosted:
  variant: ESP32C6
  slot: 1
  reset_pin: GPIO54
  cmd_pin: GPIO19
  clk_pin: GPIO18
  d0_pin: GPIO14
  d1_pin: GPIO15
  d2_pin: GPIO16
  d3_pin: GPIO17
logger:
  hardware_uart: UART0
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
api:
  reboot_timeout: 0s
ota:
  - platform: esphome
