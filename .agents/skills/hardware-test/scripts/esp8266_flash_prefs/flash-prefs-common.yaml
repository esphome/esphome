# Shared base of scan-repro.yaml and isr-load.yaml: a NodeMCU syncing preferences to flash every second.
esp8266:
  board: nodemcuv2
  restore_from_flash: ${restore_from_flash}

logger:
  level: DEBUG

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

preferences:
  flash_write_interval: 1s
