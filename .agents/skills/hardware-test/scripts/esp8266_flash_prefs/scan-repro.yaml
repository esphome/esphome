# Wi-Fi scan versus flash erase heap collapse on the ESP8266 (#21046): a restore_value global bumped every second
# with 1 s flash syncs, and a raw SDK scan every 3 s once connected (ungated it pre-empts ESPHome's own scan and the
# board never joins). Add `ping -i 0.05` from the computer (run.sh does). Build a control with
# `-s restore_from_flash false`.
substitutions:
  name: scan-repro
  restore_from_flash: "true"

esphome:
  name: ${name}
  includes:
    - scan_cb.h

esp8266:
  board: nodemcuv2
  restore_from_flash: ${restore_from_flash}

logger:
  level: DEBUG

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

preferences:
  flash_write_interval: 1s

globals:
  - id: counter
    type: uint32_t
    restore_value: true
    initial_value: "0"

interval:
  # Dirty the flash sector every second so sync() erases + writes each second
  - interval: 1s
    then:
      - lambda: id(counter) += 1;
  # Start a raw SDK scan every 3 s so erases overlap scans
  - interval: 3s
    then:
      - lambda: |-
          if (!wifi::global_wifi_component->is_connected())
            return;
          bool ok = wifi_station_scan(nullptr, repro_scan_done);
          uint32_t heap = ESP.getFreeHeap();
          if (heap < repro_min_heap) repro_min_heap = heap;
          ESP_LOGD("repro", "scan start %d, counter %u, free heap %u, min %u, max block %u, done %u, up %u", ok,
                   id(counter), heap, repro_min_heap, ESP.getMaxFreeBlockSize(), repro_scan_done_count, millis() / 1000);
