substitutions:
  name: scaninst
  duration: 5s

esphome:
  name: ${name}
  includes:
    - scan_inst.hpp
  platformio_options:
    build_flags:
      - -Wl,--wrap=BTM_BleScan
      - -Wl,--wrap=btu_start_timer
      - -Wl,--wrap=btm_ble_timeout
      - -Wl,--wrap=osi_alarm_new
      - -Wl,--wrap=btc_transfer_context

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: VERBOSE
  hardware_uart: USB_SERIAL_JTAG
  logs:
    esp32_ble_tracker: VERBOSE
    esp32_ble: DEBUG
    bluetooth_proxy: DEBUG
    api: DEBUG
    api.connection: DEBUG
    api.service: DEBUG
    sensor: INFO
    text_sensor: INFO
    debug: INFO
    wifi: DEBUG
    scheduler: DEBUG
    component: DEBUG

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true
    duration: ${duration}

  on_scan_end:
    - lambda: id(scan_ends)++;

bluetooth_proxy:
  active: true

globals:
  - id: scan_ends
    type: uint32_t
    initial_value: '0'

interval:
  - interval: 30s
    then:
      - lambda: |-
          auto &g = g_scan_inst;
          int64_t now = esp_timer_get_time();
          ESP_LOGI("scaninst", "start=%u bad=%u stop=%u timer=%u fire=%u timeout=%u cmpl_post=%u cmpl_fail=%u pid=%u ends=%u "
                   "ago_ms timer=%lld fire=%lld timeout=%lld cmpl=%lld",
                   (unsigned) g.ble_scan_start, (unsigned) g.ble_scan_start_bad, (unsigned) g.ble_scan_stop,
                   (unsigned) g.timer_start, (unsigned) g.alarm_fire, (unsigned) g.ble_timeout,
                   (unsigned) g.inq_cmpl_post, (unsigned) g.inq_cmpl_post_fail, (unsigned) g.pid, (unsigned) id(scan_ends),
                   (now - g.last_timer_start_us) / 1000, (now - g.last_fire_us) / 1000,
                   (now - g.last_timeout_us) / 1000, (now - g.last_inq_cmpl_us) / 1000);

sensor:
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
  - platform: uptime
    name: Uptime
  - platform: debug
    free:
      name: Free memory
    block:
      name: Largest free block
    min_free:
      name: Lowest free memory
    loop_time:
      name: Loop time

debug:
  update_interval: 60s

text_sensor:
  - platform: version
    name: ESPHome version
  - platform: debug
    reset_reason:
      name: Reset reason

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key
