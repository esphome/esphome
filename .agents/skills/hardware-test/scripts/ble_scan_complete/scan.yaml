substitutions:
  name: scan2610
  duration: 5s

esphome:
  name: ${name}

esp32:
  board: esp32-c6-devkitc-1
  variant: esp32c6
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  level: VERBOSE
  hardware_uart: USB_SERIAL_JTAG
  logs:
    esp32_ble_tracker: VERBOSE
    esp32_ble: DEBUG
    bluetooth_proxy: DEBUG
    api: DEBUG
    api.connection: DEBUG
    api.service: DEBUG
    sensor: INFO
    text_sensor: INFO
    debug: INFO
    wifi: DEBUG
    scheduler: DEBUG
    component: DEBUG

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true
    duration: ${duration}

bluetooth_proxy:
  active: true

sensor:
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
  - platform: uptime
    name: Uptime
  - platform: debug
    free:
      name: Free memory
    block:
      name: Largest free block
    min_free:
      name: Lowest free memory
    loop_time:
      name: Loop time

debug:
  update_interval: 60s

text_sensor:
  - platform: version
    name: ESPHome version
  - platform: debug
    reset_reason:
      name: Reset reason

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key
