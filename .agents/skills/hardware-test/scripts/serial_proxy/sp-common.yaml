# serial_proxy on UART A, simulated device (spsim.hpp) on UART B, cross-wired through the GPIO matrix
esphome:
  name: ${name}
  includes:
    - spsim.hpp
  on_boot:
    priority: -100
    then:
      - lambda: |-
          spsim::bus = id(sim_uart);
          spsim::proxy_bus = id(proxy_uart);

esp32:
  variant: esp32c3
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:
  reboot_timeout: 0s

uart:
  - id: proxy_uart
    tx_pin:
      number: GPIO4
      allow_other_uses: true
    rx_pin:
      number: GPIO5
      allow_other_uses: true
    baud_rate: 1920
    rx_buffer_size: ${rx_buf}
  - id: sim_uart
    tx_pin:
      number: GPIO5
      allow_other_uses: true
    rx_pin:
      number: GPIO4
      allow_other_uses: true
    baud_rate: 1920
    rx_buffer_size: 1024
    tx_buffer_size: 1024

serial_proxy:
  - id: proxy
    uart_id: proxy_uart
    name: Sim Port
    port_type: TTL

ezsp_proxy_tap:
  serial_proxy_id: proxy

interval:
  - interval: 1ms
    then:
      - lambda: spsim::poll();
  - interval: 10s
    then:
      - lambda: 'ESP_LOGI("spsim", "HEAP free=%u min=%u", (unsigned) esp_get_free_heap_size(), (unsigned) esp_get_minimum_free_heap_size());'
