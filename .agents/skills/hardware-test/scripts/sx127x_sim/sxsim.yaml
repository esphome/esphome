# ESP32-PICO-D4 (board pico32, ESP-IDF): sx127x driven by the fake SX1276 in sxsim.hpp, scenarios in sxrun.hpp.
# Build sxpr.yaml (a driver with the async API) or sxbase.yaml with `-s name <name>`; they set `flags` and include this.
# No Wi-Fi: everything is judged from the serial log ("RES", "EV", "STATE", "TRACE" lines, "ALLDONE" at the end).
# The SPI pins and CS are replaced by fake pins at on_boot 800; only DIO0 (GPIO4) is a real pad, driven by the model.
substitutions:
  flags: -DSXSIM_BASE
esphome:
  name: ${name}
  includes: [spibits.hpp, sxsim.hpp, sxrun.hpp]
  platformio_options:
    build_flags: ${flags}
  on_boot:
    - priority: 800
      then:
        - lambda: |-
            sxsim::install(id(spibus), id(radio), 4);
            sxrun::boot(id(radio));
    - priority: 399
      then:
        - lambda: sxsim::late_pin_setup();
esp32:
  board: pico32
  framework:
    type: esp-idf
logger:
  level: DEBUG
  tx_buffer_size: 1024
spi:
  id: spibus
  interface: software
  clk_pin: GPIO18
  mosi_pin: GPIO23
  miso_pin: GPIO19
sx127x:
  id: radio
  cs_pin: GPIO5
  rst_pin: GPIO21
  dio0_pin:
    number: GPIO4
    mode:
      input: true
      pulldown: true
  frequency: 433920000
  modulation: LORA
  bandwidth: 125_0kHz
  spreading_factor: 7
  coding_rate: CR_4_5
  preamble_size: 8
  crc_enable: true
  sync_value: [0x12]
  rx_start: true
  on_packet:
    then:
      - lambda: 'ESP_LOGI("ev", "EV trigger len=%u rssi=%.1f snr=%.2f", (unsigned) x.size(), rssi, snr);'
globals:
  - id: want_action
    type: bool
    initial_value: "false"
interval:
  - interval: 20ms
    then:
      - lambda: sxrun::run(id(radio), &id(want_action));
      - if:
          condition:
            lambda: return id(want_action);
          then:
            - lambda: id(want_action) = false;
            - sx127x.send_packet:
                data: [0xC5, 0x51, 0x78, 0x82, 0xB7]
            - lambda: sxsim::log_state("action");
