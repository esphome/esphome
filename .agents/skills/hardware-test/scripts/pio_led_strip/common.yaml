# Pico 2 W: two PIO LED strips with no LEDs attached; counts rising edges on each data pin through a GPIO IRQ
esphome:
  name: ${name}
  includes:
    - edges.hpp
  on_boot:
    - priority: 1000
      then:
        - lambda: |-
            for (int i = 0; i < 32; i++) pio1->instr_mem[i] = 0;
            ESP_LOGI("pio", "PIO1 instruction memory cleared");
    - priority: -100
      then:
        - lambda: edges_start();
rp2040:
  board: rpipico2w
logger:
  level: DEBUG
light:
  - platform: rp2040_pio_led_strip
    id: s0
    pin: GPIO2
    num_leds: 8
    chipset: WS2812B
    pio: 0
    rgb_order: GRB
    name: s0
  - platform: rp2040_pio_led_strip
    id: s1
    pin: GPIO3
    num_leds: 8
    chipset: ${chipset1}
    pio: 1
    rgb_order: GRB
    name: s1
interval:
  - interval: 2s
    then:
      - lambda: |-
          static bool on = false;
          on = !on;
          auto c0 = id(s0).make_call(); c0.set_state(true); c0.set_brightness(1.0); c0.set_rgb(on ? 1.0 : 0.2, 0.5, on ? 0.0 : 1.0); c0.set_transition_length(0); c0.perform();
          auto c1 = id(s1).make_call(); c1.set_state(true); c1.set_brightness(1.0); c1.set_rgb(on ? 1.0 : 0.2, 0.5, on ? 0.0 : 1.0); c1.set_transition_length(0); c1.perform();
  - interval: 2s
    then:
      - delay: 1s
      - lambda: edges_report();
