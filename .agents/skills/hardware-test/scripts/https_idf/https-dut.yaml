# HTTPS listener test on an ESP32-C3 (web_server_idf HTTPS, #22185 and its follow-up that switches the listener
# at run time). Run make_certs.sh first. Substitution: name.
substitutions:
  name: httpstest

esphome:
  name: ${name}

external_components:
  - source:
      type: local
      path: ext

esp32:
  variant: esp32c3
  board: esp32-c3-devkitm-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

httpstest:
  id: hst

interval:
  - interval: 2s
    then:
      - lambda: |-
          ESP_LOGI("hwt", "ALIVE heap=%u min=%u", (unsigned) heap_caps_get_free_size(MALLOC_CAP_8BIT),
                   (unsigned) heap_caps_get_minimum_free_size(MALLOC_CAP_8BIT));
