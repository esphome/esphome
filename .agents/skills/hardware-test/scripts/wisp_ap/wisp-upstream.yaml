esphome:
  name: wisp-upstream

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9

wifi:
  ap:
    ssid: !secret wisp_up_ssid
    password: !secret wisp_up_password
    ap_mode: WISP
    manual_ip:
      static_ip: 10.40.0.1
      gateway: 10.40.0.1
      subnet: 255.255.255.0

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s

ota:
  - platform: esphome

web_server:
  port: 80

button:
  - platform: template
    name: ap off
    on_press:
      - wifi.disable:
  - platform: template
    name: ap on
    on_press:
      - wifi.enable:
