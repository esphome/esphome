# Ethernet backbone loss without touching the cable (esphome#22929): phy.hpp powers the PHY down (BMCR bit 11) and
# back up with autonegotiation restarted. API actions drop(secs) and race(delay_ms); race takes the link down
# race_delay ms after "border routing restarts" is logged.
esphome:
  includes:
    - phy.hpp
globals:
  - id: race_delay
    type: int
    initial_value: '-1'
  - id: link_down  # the power-down took effect, so the power-up and its marker belong to it
    type: bool
    initial_value: 'false'
logger:
  on_message:
    - level: INFO
      then:
        - lambda: |-
            if (id(race_delay) >= 0 && strstr(message, "border routing restarts") != nullptr) {
              id(race_fire).execute();
            }
script:
  - id: link_drop
    parameters:
      secs: int
    then:
      # the start and end markers only when the PHY really changed ("HWT phy failed" otherwise)
      - lambda: |-
          id(link_down) = hwt_phy_power(false);
          if (id(link_down))
            ESP_LOGI("hwt", "HWT link drop start");
          else
            ESP_LOGW("hwt", "HWT link drop none");
      - delay: !lambda 'return secs * 1000;'
      - lambda: |-
          if (id(link_down) && hwt_phy_power(true))
            ESP_LOGI("hwt", "HWT link drop end");
  - id: race_fire
    mode: single
    then:
      - delay: !lambda 'return id(race_delay);'
      - lambda: |-
          id(link_down) = hwt_phy_power(false);
          if (id(link_down))
            ESP_LOGI("hwt", "HWT race link down after %d ms", id(race_delay));
          else
            ESP_LOGW("hwt", "HWT race link drop none");
          id(race_delay) = -1;
      - delay: 20s
      - lambda: |-
          if (id(link_down) && hwt_phy_power(true))
            ESP_LOGI("hwt", "HWT race link up");
api:
  actions:
    - action: drop
      variables:
        secs: int
      then:
        - if:
            condition:
              lambda: 'return secs >= 1 && secs <= 600;'
            then:
              - script.execute:
                  id: link_drop
                  secs: !lambda 'return secs;'
            else:
              - logger.log:
                  format: "HWT drop refused: secs must be 1-600"
                  level: WARN
    - action: race
      variables:
        delay_ms: int
      then:
        - if:
            condition:
              lambda: 'return delay_ms >= 0 && delay_ms <= 10000;'
            then:
              - lambda: 'id(race_delay) = delay_ms;'
              - script.execute:
                  id: link_drop
                  secs: 15
              # the 15 s drop plus time for the restart: an arm still set by then never fired
              - delay: 75s
              - lambda: |-
                  if (id(race_delay) >= 0) {
                    ESP_LOGW("hwt", "HWT race not fired");
                    id(race_delay) = -1;
                  }
            else:
              - logger.log:
                  format: "HWT race refused: delay_ms must be 0-10000"
                  level: WARN
