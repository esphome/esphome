# Shared by every STA/Ethernet build: API with 5 Hz state traffic, OTA, web_server, reset reason
esphome:
  name: ${name}
logger:
  level: DEBUG
api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s
ota:
  - platform: esphome
web_server:
  port: 80
debug:
  update_interval: 5s
text_sensor:
  - platform: debug
    reset_reason:
      name: Reset reason
sensor:
  - platform: uptime
    name: Uptime
    update_interval: 1s
  - platform: debug
    free:
      name: Heap free
  - platform: template
    name: Fast counter
    update_interval: 200ms
    lambda: |-
      static uint32_t n = 0;
      return n++;
button:
  - platform: restart
    name: Restart
