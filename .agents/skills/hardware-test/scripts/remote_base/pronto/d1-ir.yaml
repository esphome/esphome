esphome:
  name: ${name}
esp8266:
  board: d1_mini
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
logger:
  baud_rate: 460800
  level: DEBUG
api:
  reboot_timeout: 0s
ota:
  - platform: esphome
remote_transmitter:
  id: irtx
  pin:
    number: GPIO12
    allow_other_uses: true
  carrier_duty_percent: 100%
remote_receiver:
  id: irrx
  pin:
    number: GPIO12
    allow_other_uses: true
  dump: all
  buffer_size: 3kb
  on_pronto:
    - lambda: |-
        ESP_LOGI("trig", "TRIG len=%u", (unsigned) x.data.size());
        for (size_t i = 0; i < x.data.size(); i += 200)
          ESP_LOGI("trig", "TRIG %s", x.data.substr(i, 200).c_str());
interval:
  - interval: 250ms
    then:
      - lambda: pinMode(12, OUTPUT);
packages:
  common: !include gen-common.yaml
