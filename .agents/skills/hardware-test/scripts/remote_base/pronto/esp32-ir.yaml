# ESP32 devkit, one-pin loopback on GPIO27 with every dumper; the board and network come from climate_ir_loop.
packages:
  base: !include ../../climate_ir_loop/base.yaml
  board: !include
    file: ../../climate_ir_loop/esp32-ir.yaml
    vars:
      rmt_symbols: "256"
      receive_symbols: "256"
  common: !include gen-common.yaml
logger:
  baud_rate: 921600
  level: DEBUG
remote_receiver:
  dump: all
  on_pronto:
    - lambda: |-
        ESP_LOGI("trig", "TRIG len=%u", (unsigned) x.data.size());
        for (size_t i = 0; i < x.data.size(); i += 200)
          ESP_LOGI("trig", "TRIG %s", x.data.substr(i, 200).c_str());
