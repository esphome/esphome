# build twice: `-s level DEBUG` and `-s level VERBOSE` (with a different `-s name`), then compare with cmp.sh
substitutions:
  level: DEBUG
esphome:
  name: ${name}
  includes:
    - dumpers.h
    - rbh.hpp
  on_boot:
    priority: -100
    then:
      - lambda: rbh_run();
host:
logger:
  level: ${level}
external_components:
  - source:
      type: local
      path: ../ext
rbtest:
