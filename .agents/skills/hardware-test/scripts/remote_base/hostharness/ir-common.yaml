esphome:
  name: ${name}
  includes:
    - rbh.hpp
logger:
  level: DEBUG
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key
ota:
  - platform: esphome
remote_transmitter:
  id: irtx
  pin:
    number: ${pin}
    allow_other_uses: true
  carrier_duty_percent: 100%
remote_receiver:
  pin:
    number: ${pin}
    allow_other_uses: true
  dump: [aeha, haier, mirage]
  on_aeha:
    then:
      - lambda: rbh_on_frame("ON_AEHA", x.data);
  on_haier:
    then:
      - lambda: rbh_on_frame("ON_HAIER", x.data);
  on_mirage:
    then:
      - lambda: rbh_on_frame("ON_MIRAGE", x.data);
button:
  - platform: template
    name: TX all
    on_press:
      - script.execute: tx_all
script:
  - id: tx_all
    mode: single
    then:
      - logger.log: "TXMARK aeha 2"
      - lambda: ${prep}
      - remote_transmitter.transmit_aeha:
          address: 0xE6C2
          data: [0x79, 0xB7]
      - delay: 900ms
      - logger.log: "TXMARK aeha 3"
      - lambda: ${prep}
      - remote_transmitter.transmit_aeha:
          address: 0x7EDA
          data: [0x61, 0x89, 0x59]
      - delay: 900ms
      - logger.log: "TXMARK aeha 8"
      - lambda: ${prep}
      - remote_transmitter.transmit_aeha:
          address: 0x9D2C
