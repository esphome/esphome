esphome:
  name: ${name}
  includes:
    - pdslave.hpp
    - snf.hpp
  platformio_options:
    build_flags:
      - -Wl,--wrap=malloc
      - -DSNF_PDSLAVE
  on_boot:
    - priority: 700
      then:
        - lambda: |-
            pds::install();
            snf::bus = id(bus_hw);
    - priority: -100
      then:
        - delay: 4s
        - lambda: id(started) = true;

esp32:
  board: pico32
  framework:
    type: esp-idf

logger:
  level: DEBUG
  baud_rate: 115200

globals:
  - id: started
    type: bool
    initial_value: "false"

i2c:
  id: bus_hw
  sda: GPIO32
  scl: GPIO33
  frequency: ${freq}
  scan: false

ads1115:
  - address: 0x48
    id: ads
    i2c_id: bus_hw

interval:
  - interval: 20ms
    then:
      - lambda: |-
          if (id(started)) snf::step(id(ads));
