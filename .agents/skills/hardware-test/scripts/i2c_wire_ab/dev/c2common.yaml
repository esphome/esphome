esphome:
  name: ${name}
  includes:
    - ${swfile}
    - snf.hpp
  platformio_options:
    build_flags:
      - -Wl,--wrap=malloc
      - ${flags}
  on_boot:
    - priority: 700
      then:
        - lambda: |-
            gpio_reset_pin(GPIO_NUM_6); gpio_set_direction(GPIO_NUM_6, GPIO_MODE_OUTPUT); gpio_set_level(GPIO_NUM_6, 1);
            gpio_reset_pin(GPIO_NUM_7); gpio_set_direction(GPIO_NUM_7, GPIO_MODE_OUTPUT); gpio_set_level(GPIO_NUM_7, 0);
            #ifdef SNF_SW
            snf::bus = snf::make_sw();
            id(ads)->set_i2c_bus(snf::bus);
            #else
            snf::bus = id(bus_hw);
            #endif
    - priority: -100
      then:
        - delay: 6s
        - lambda: |-
            snf::install();
            id(started) = true;

esp32:
  board: esp32-c2-devkitm-1
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_XTAL_FREQ_26: y

logger:
  level: DEBUG
  baud_rate: 115200

globals:
  - id: started
    type: bool
    initial_value: "false"

i2c:
  id: bus_hw
  sda: ${hw_sda}
  scl: ${hw_scl}
  frequency: ${freq}
  scan: true

ads1115:
  - address: 0x48
    id: ads
    i2c_id: bus_hw

sensor:
  - platform: ads1115
    ads1115_id: ads
    multiplexer: A2_GND
    gain: 6.144
    resolution: 12_BITS
    name: a2
    update_interval: 2s
    on_value:
      - lambda: ESP_LOGI("rd", "READ a2 %.4f", x);
  - platform: ads1115
    ads1115_id: ads
    multiplexer: A3_GND
    gain: 6.144
    resolution: 12_BITS
    name: a3
    update_interval: 2s
    on_value:
      - lambda: ESP_LOGI("rd", "READ a3 %.4f", x);

interval:
  - interval: 20ms
    then:
      - lambda: |-
          if (id(started)) snf::step(id(ads));
