# Package for allocring.hpp: arms it ${alloc_arm_s} s after boot and adds the dump button. See heap_alloc.md.
esphome:
  includes:
    - allocring.hpp
  on_boot:
    then:
      - delay: ${alloc_arm_s}s
      - lambda: |-
          g_alloc_armed = true;
          ESP_LOGI("allocs", "ARMED total=%u", g_new_count);

interval:
  - interval: 30s
    then:
      - lambda: |-
          ESP_LOGI("allocs", "total=%u kept=%u heap=%u", g_new_count, (unsigned) g_alloc_n.load(),
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL));

button:
  - platform: template
    name: Dump allocations
    on_press:
      - lambda: |-
          g_alloc_armed = false;
          uint32_t n = std::min<uint32_t>(g_alloc_n.load(), ALLOC_CAP);
          ESP_LOGI("allocs", "DUMP n=%u total=%u", n, g_new_count);
          for (uint32_t i = 0; i < n; i++) {
            const AllocEntry &e = g_allocs[i];
            ESP_LOGI("allocs", "E %u %u %u %08x %08x %08x %08x %08x", i, e.ms, e.size, e.pc[0], e.pc[1], e.pc[2],
                     e.pc[3], e.pc[4]);
            if ((i & 15) == 15)
              delay(20);  // let the log drain
          }
          ESP_LOGI("allocs", "DUMP END");
