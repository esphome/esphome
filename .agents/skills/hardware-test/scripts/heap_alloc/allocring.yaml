# Package: count and record every operator new on ESP32 (Arduino or ESP-IDF).
# Recording starts at ${alloc_arm_s} s of uptime, past the scheduler freelist trim 10 s after setup.
# Press "Dump allocations" afterwards and save the API or serial log; decode.py turns it into callers.
# Lambdas can add markers with alloc_marker(a, b) (written as size 0 entries) to split the run into phases.
esphome:
  includes:
    - allocring.hpp

interval:
  - interval: 1s
    then:
      - lambda: |-
          if (!g_alloc_armed && millis() > ${alloc_arm_s} * 1000) {
            g_alloc_armed = true;
            ESP_LOGI("ring", "ARMED total=%u", g_new_count);
          }
  - interval: 30s
    then:
      - lambda: |-
          ESP_LOGI("ring", "total=%u ring=%u heap=%u", g_new_count, (unsigned) g_alloc_n.load(),
                   (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL));

button:
  - platform: template
    name: Dump allocations
    on_press:
      - lambda: |-
          g_alloc_armed = false;
          uint32_t n = std::min<uint32_t>(g_alloc_n.load(), ALLOC_RING);
          ESP_LOGI("ring", "DUMP n=%u total=%u", n, g_new_count);
          for (uint32_t i = 0; i < n; i++) {
            const AllocEntry &e = g_alloc_ring[i];
            ESP_LOGI("ring", "E %u %u %u %08x %08x %08x %08x %08x", i, e.ms, e.size, e.pc[0], e.pc[1], e.pc[2],
                     e.pc[3], e.pc[4]);
            if ((i & 15) == 15)
              delay(20);
          }
          ESP_LOGI("ring", "DUMP END");
