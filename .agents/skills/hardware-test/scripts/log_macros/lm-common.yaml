esphome:
  name: ${name}
logger:
  # sensor states and switch, light and fan calls log at VERBOSE; at DEBUG an A/B sees none of them
  level: VERBOSE
api:
  reboot_timeout: 0s
ota:
  - platform: esphome
web_server:
  port: 80
improv_serial:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
binary_sensor:
  - {platform: template, id: bs1, name: bs one, lambda: return true;}
  - {platform: template, id: bs2, name: bs two, lambda: return false;}
switch:
  - {platform: template, id: sw1, name: sw one, optimistic: true, restore_mode: ALWAYS_OFF, assumed_state: true}
number:
  - {platform: template, name: num one, optimistic: true, min_value: 0, max_value: 10, step: 0.5, restore_value: false, initial_value: 2.5}
lock:
  - {platform: template, name: lock one, optimistic: true, assumed_state: true}
fan:
  - {platform: template, id: fan1, name: fan one, speed_count: 3, has_oscillating: true}
output:
  - {platform: template, id: out1, type: binary, write_action: []}
light:
  - {platform: binary, id: light1, name: light one, output: out1}
alarm_control_panel:
  - platform: template
    name: acp one
    codes: ["1234"]
    binary_sensors:
      - input: bs1
        bypass_armed_home: true
        chime: true
      - input: bs2
        bypass_auto: true
sensor:
  - {platform: template, id: s0, name: s acc0, accuracy_decimals: 0, lambda: return 12.5f;, update_interval: 5s}
  - {platform: template, id: s2, name: s acc2, accuracy_decimals: 2, lambda: return 3.14159f;, update_interval: 5s}
  - {platform: template, id: sneg, name: s neg2, accuracy_decimals: 2, lambda: return -0.005f;, update_interval: 5s}
  - {platform: template, id: s_nan, name: s nan, accuracy_decimals: 1, lambda: return NAN;, update_interval: 5s}
  - {platform: template, id: s_inf, name: s inf, accuracy_decimals: 1, lambda: return INFINITY;, update_interval: 5s}
  - {platform: template, id: shi, name: s acc6, accuracy_decimals: 6, lambda: return 1.2345678f;, update_interval: 5s}
  - {platform: template, id: sbig, name: s big, accuracy_decimals: 3, lambda: return 123456789.0f;, update_interval: 5s}
button:
  - platform: template
    name: exercise
    on_press:
      - lambda: |-
          ESP_LOGI("lm", "MARK exercise");
          ESPTime t = ESPTime::from_epoch_utc(1700000000);
          char buf[ESPTime::STRFTIME_BUFFER_SIZE];
          size_t n = t.strftime_to(buf, "%Y-%m-%d %H:%M:%S %A %B");
          ESP_LOGI("lm", "STRF normal len=%u '%s'", (unsigned) n, buf);
          n = t.strftime_to(buf, "%Y-%m-%d %H:%M:%S %A %B | %Y-%m-%d %H:%M:%S %A %B | %Y-%m-%d %H:%M:%S %A %B | %Y-%m-%d %H:%M:%S %A %B | %c");
          ESP_LOGI("lm", "STRF overflow len=%u '%s'", (unsigned) n, buf);
          ESP_LOGI("lm", "WORDS %s %s %s %s %s %s", YESNO(true), YESNO(false), ONOFF(true), ONOFF(false), TRUEFALSE(true), TRUEFALSE(false));
      - switch.toggle: sw1
      - delay: 200ms
      - switch.toggle: sw1
      - fan.turn_on: {id: fan1, speed: 2, oscillating: true}
      - delay: 200ms
      - fan.turn_off: fan1
      - light.turn_on: light1
      - delay: 200ms
      - light.turn_off: light1
      - lambda: ESP_LOGI("lm", "MARK exercise done");
text_sensor:
  - platform: wifi_info
    scan_results:
      name: scan results
