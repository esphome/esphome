# Forced reconnect mid-burst (a package): the retained burst topics, with the count restarted on every connect
# (mode: restart script), and a RESULT line 6 s after each connect. The per-run file supplies board, name, logger.
packages:
  topics: !include ../retained_burst/burst-topics.yaml

globals:
  - id: conn
    type: uint32_t
    initial_value: "0"

mqtt:
  idf_send_async: true
  on_connect:
    - script.execute: report

script:
  - id: report
    mode: restart
    then:
      - lambda: |-
          id(conn)++;
          id(got) = 0;
          id(sw_on) = 0;
          ESP_LOGI("hwt", "EV CONNECTED %u", (unsigned) id(conn));
      - delay: 6s
      - lambda: |-
          ESP_LOGI("hwt", "CONN %u", (unsigned) id(conn));
          ESP_LOGI("hwt", "RESULT got=%u/25 mask=%08X switches_on=%u/15 mask=%08X",
                     (unsigned) __builtin_popcount(id(got)), (unsigned) id(got),
                     (unsigned) __builtin_popcount(id(sw_on)), (unsigned) id(sw_on));
