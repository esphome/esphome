# The retained burst topics (a package shared by burst-common.yaml and ../reconnect/kick-common.yaml): 25 on_message
# topics and 15 switches whose command topics seed.sh leaves retained, setting bits in got and sw_on.
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

globals:
  - id: got
    type: uint32_t
    initial_value: "0"
  - id: sw_on
    type: uint32_t
    initial_value: "0"

mqtt:
  id: mq
  broker: ${broker}
  port: ${broker_port}
  discovery: false
  reboot_timeout: 0s
  log_topic: null
  topic_prefix: hwburst
  on_message:
    - topic: hwburst/in/0
      then:
        - lambda: id(got) |= 1u << 0;
    - topic: hwburst/in/1
      then:
        - lambda: id(got) |= 1u << 1;
    - topic: hwburst/in/2
      then:
        - lambda: id(got) |= 1u << 2;
    - topic: hwburst/in/3
      then:
        - lambda: id(got) |= 1u << 3;
    - topic: hwburst/in/4
      then:
        - lambda: id(got) |= 1u << 4;
    - topic: hwburst/in/5
      then:
        - lambda: id(got) |= 1u << 5;
    - topic: hwburst/in/6
      then:
        - lambda: id(got) |= 1u << 6;
    - topic: hwburst/in/7
      then:
        - lambda: id(got) |= 1u << 7;
    - topic: hwburst/in/8
      then:
