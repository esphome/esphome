# VL6180X probe on an ESP8266 NodeMCU (SDA GPIO4, SCL GPIO5, XSHUT GPIO14, INT GPIO12): scan and raw ID reads.
esphome:
  name: ${name}
  on_boot:
    - priority: 1100
      then:
        - lambda: |-
            pinMode(14, OUTPUT); digitalWrite(14, HIGH);
            pinMode(4, INPUT); pinMode(5, INPUT); pinMode(12, INPUT);
            delay(5);
            ESP_LOGI("probe", "idle SDA=%d SCL=%d INT=%d", digitalRead(4), digitalRead(5), digitalRead(12));
esp8266:
  board: nodemcuv2
logger:
i2c:
  id: bus_a
  sda: GPIO4
  scl: GPIO5
  scan: true
interval:
  - interval: 2s
    then:
      - lambda: |-
          auto rd = [](uint16_t reg, uint8_t &v) {
            uint8_t w[2] = {(uint8_t)(reg >> 8), (uint8_t)reg};
            return (int) id(bus_a)->write_readv(0x29, w, 2, &v, 1);
          };
          uint8_t id0 = 0, rev = 0, fresh = 0;
          int e1 = rd(0x000, id0); int e2 = rd(0x001, rev); int e3 = rd(0x016, fresh);
          ESP_LOGI("probe", "MODEL_ID=0x%02X (err %d) MODEL_REV_MAJOR=0x%02X (err %d) FRESH_OUT_OF_RESET=0x%02X (err %d) INT=%d",
                   id0, e1, rev, e2, fresh, e3, digitalRead(12));
substitutions:
  name: vlprobe
