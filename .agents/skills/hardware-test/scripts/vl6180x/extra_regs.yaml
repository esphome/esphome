interval:
  - interval: 10s
    then:
      - lambda: |-
          auto rd = [](uint16_t reg) {
            uint8_t w[2] = {(uint8_t)(reg >> 8), (uint8_t)reg}; uint8_t v = 0xEE;
            id(bus_a)->write_readv(0x29, w, 2, &v, 1); return v;
          };
          ESP_LOGI("regs", "fresh=0x%02X p2p_offset=%d scaling=0x%02X%02X als_gain=0x%02X range_chk=0x%02X als_status=0x%02X warn=%d",
                   rd(0x016), (int8_t) rd(0x024), rd(0x096), rd(0x097), rd(0x03F), rd(0x02D), rd(0x04E),
                   (int) id(tof).status_has_warning());
