# Damaged web_server OTA DUT: logs each OTA event and starts the captive portal on the station network, so the
# portal's upload path can be tested without an AP client. Build with -s marker A|B to tell images apart.
substitutions:
  name: otashort
  marker: A
esphome:
  name: ${name}
  on_boot:
    - lambda: ESP_LOGI("test", "BOOTMARK build=${marker} name=${name}");
esp8266:
  board: d1_mini
logger:
  level: VERBOSE
  logs:
    esp8266.preferences: DEBUG
    scheduler: DEBUG
    component: DEBUG
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: ${name}-ap
    password: !secret ap_password
captive_portal:
interval:
  - interval: 10s
    then:
      - if:
          condition:
            lambda: >-
              return wifi::global_wifi_component->is_connected() &&
              !captive_portal::global_captive_portal->is_active();
          then:
            - lambda: |-
                ESP_LOGI("test", "starting captive portal on STA");
                captive_portal::global_captive_portal->start();
packages:
  events: !include ../ota_relay/ota-events.yaml
