# Pico 2 W: five PIO LED strips (no LEDs needed) probed three times by pioscope.hpp from PIO2.
esphome:
  name: pa
  includes:
    - pioscope.hpp
  on_boot:
    - priority: -100
      then:
        - delay: 6s
        - repeat:
            count: 3
            then:
              - script.execute: probe_all
              - delay: 2s
        - lambda: 'ESP_LOGI("hwt", "DONE");'

rp2040:
  board: rpipico2w

logger:
  level: DEBUG

interval:
  - interval: 2s
    then:
      - lambda: 'static int n = 0; ESP_LOGI("hwt", "ALIVE %d", ++n);'

script:
  - id: probe_all
    then:
      - light.turn_on: {id: s_ws_p0, brightness: 100%, red: 100%, green: 100%, blue: 100%}
      - light.turn_on: {id: s_ws_p1, brightness: 100%, red: 100%, green: 100%, blue: 100%}
      - light.turn_on: {id: s_cust1_p1, brightness: 100%, red: 100%, green: 100%, blue: 100%}
      - light.turn_on: {id: s_cust2_p0, brightness: 100%, red: 100%, green: 100%, blue: 100%}
      - light.turn_on: {id: s_ws2_p0, brightness: 100%, red: 100%, green: 100%, blue: 100%}
      - delay: 500ms
      - lambda: |-
          pioscope::probe("s_ws_p0", id(s_ws_p0), 2, esphome::Color(0xA5, 0x3C, 0x0F));
          pioscope::probe("s_ws_p1", id(s_ws_p1), 3, esphome::Color(0xA5, 0x3C, 0x0F));
          pioscope::probe("s_cust1_p1", id(s_cust1_p1), 6, esphome::Color(0xA5, 0x3C, 0x0F));
          pioscope::probe("s_cust2_p0", id(s_cust2_p0), 7, esphome::Color(0xA5, 0x3C, 0x0F));
          pioscope::probe("s_ws2_p0", id(s_ws2_p0), 8, esphome::Color(0xA5, 0x3C, 0x0F));
light:
  - platform: rp2040_pio_led_strip
    id: s_ws_p0
    pin: 2
    num_leds: 2
    pio: 0
    channel_colors: GRB
    gamma_correct: 1.0
    default_transition_length: 0s
    chipset: WS2812
  - platform: rp2040_pio_led_strip
    id: s_ws_p1
    pin: 3
    num_leds: 2
    pio: 1
    channel_colors: GRB
    gamma_correct: 1.0
    default_transition_length: 0s
    chipset: WS2812
  - platform: rp2040_pio_led_strip
    id: s_cust1_p1
    pin: 6
    num_leds: 2
    pio: 1
    channel_colors: GRB
    gamma_correct: 1.0
    default_transition_length: 0s
    bit0_high: 0.3us
    bit0_low: 0.9us
    bit1_high: 0.9us
    bit1_low: 0.3us
  - platform: rp2040_pio_led_strip
    id: s_cust2_p0
    pin: 7
    num_leds: 2
    pio: 0
    channel_colors: GRB
    gamma_correct: 1.0
    default_transition_length: 0s
    bit0_high: 0.5us
    bit0_low: 1.0us
    bit1_high: 1.2us
    bit1_low: 0.5us
  - platform: rp2040_pio_led_strip
    id: s_ws2_p0
    pin: 8
    num_leds: 2
    pio: 0
    channel_colors: GRB
    gamma_correct: 1.0
    default_transition_length: 0s
    chipset: WS2812
