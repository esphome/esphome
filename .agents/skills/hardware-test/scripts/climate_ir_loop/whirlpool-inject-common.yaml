esphome:
  name: ${name}
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
logger:
  level: VERBOSE
  logs:
    wifi: DEBUG
    api: DEBUG
    api.service: DEBUG
    api.connection: DEBUG
    scheduler: DEBUG
    component: DEBUG
    esp32.preferences: DEBUG
    esp8266.preferences: DEBUG
    preferences: DEBUG
    mdns: DEBUG
    sensor: DEBUG
    remote_receiver: DEBUG
    remote_transmitter: DEBUG
api:
  reboot_timeout: 0s
  actions:
    # A Hitachi frame the sender cannot produce: temperature nibble 15 (16 + 15 = 31 C, above the 30 C max), cool, fan low
    - action: inject_t15
      then:
        - lambda: |-
            static constexpr remote_base::BitTimings T{.bit_mark = 572, .one_space = 1659, .zero_space = 553};
            uint8_t s[21] = {0};
            s[0] = 0xA9; s[1] = 0x59; s[2] = 0x03; s[3] = 0xF2; s[6] = 0x80; s[10] = 0x20; s[15] = 0x02;
            s[18] = 0x38; s[19] = 0x08;
            s[13] = xor_bytes(&s[2], 11);
            s[20] = xor_bytes(&s[14], 6);
            ESP_LOGI("w22704", "inject t15");
            auto call = id(irtx).transmit();
            auto *d = call.get_data();
            d->set_carrier_frequency(38000);
            d->mark(9000); d->space(4494);
            for (int i = 0; i < 21; i++) {
              if (i == 6 || i == 14) { d->mark(572); d->space(7960); }
              d->item_bytes<T>(s + i, 1);
            }
            d->mark(572);
            call.perform();
    # A 14-byte frame (what some whirlpool remotes send): bytes 0 to 13, the second divider, then silence
    - action: inject_short
      variables:
        hitachi: bool
      then:
        - lambda: |-
            static constexpr remote_base::BitTimings T{.bit_mark = 572, .one_space = 1659, .zero_space = 553};
            uint8_t s[14] = {0};
            s[0] = hitachi ? 0xA9 : 0x83; s[1] = hitachi ? 0x59 : 0x06; s[2] = 0x03; s[3] = 0xE2; s[6] = 0x80;
            if (hitachi) s[10] = 0x20;
            s[13] = xor_bytes(&s[2], 11);
            ESP_LOGI("w22704", "inject short hitachi=%d", (int) hitachi);
            auto call = id(irtx).transmit();
            auto *d = call.get_data();
            d->set_carrier_frequency(38000);
            d->mark(9000); d->space(4494);
            for (int i = 0; i < 14; i++) {
              if (i == 6) { d->mark(572); d->space(7960); }
              d->item_bytes<T>(s + i, 1);
            }
            d->mark(572);
            call.perform();
ota:
  - platform: esphome
