esp32:
  board: esp32dev
  framework:
    type: esp-idf
remote_transmitter:
  id: irtx
  pin:
    number: GPIO27
    allow_other_uses: true
  carrier_duty_percent: 100%
remote_receiver:
  id: irrx
  pin:
    number: GPIO27
    allow_other_uses: true
  dump: raw
  rmt_symbols: 384
  receive_symbols: 384
