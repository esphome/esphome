esp8266:
  board: d1_mini
remote_transmitter:
  id: irtx
  pin:
    number: GPIO12
    allow_other_uses: true
  carrier_duty_percent: 100%
remote_receiver:
  id: irrx
  pin:
    number: GPIO12
    allow_other_uses: true
  dump: raw
interval:
  # the receiver's setup leaves the shared pin an input; drive it so the transmitter reaches the pad
  - interval: 250ms
    then:
      - lambda: pinMode(12, OUTPUT);
