esphome:
  name: ${name}
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
logger:
  level: VERBOSE
  logs:
    wifi: DEBUG
    api: DEBUG
    api.service: DEBUG
    api.connection: DEBUG
    scheduler: DEBUG
    component: DEBUG
    esp32.preferences: DEBUG
    esp8266.preferences: DEBUG
    preferences: DEBUG
    mdns: DEBUG
    sensor: DEBUG
    remote_receiver: DEBUG
    remote_transmitter: DEBUG
    climate: DEBUG
api:
  reboot_timeout: 0s
ota:
  - platform: esphome
