esphome:
  includes:
    - crctest.hpp
  on_boot:
    - priority: -100
      then:
        - delay: 3s
        - lambda: |-
            // unqualified call, as a lambda user would write it; counted in the CRCRESULT totals
            crctest::run(crc32(0, reinterpret_cast<const uint8_t *>("123456789"), 9));

interval:
  - interval: 20s
    then:
      - lambda: crctest::run();
