# USB NCM device with the boot recorder: prints the previous boot's verdict, USB times, event ring and snapshots.
esphome:
  includes:
    - boot_recorder.hpp
  on_boot:
    - priority: 600
      then:
        - lambda: pd5_start();
  on_shutdown:
    - priority: 1000
      then:
        - lambda: pd5_on_shutdown();
  platformio_options:
    build_flags:
      - -Wl,--wrap=panic
      - -Wl,--wrap=tud_network_xmit
      - -Wl,--wrap=dcd_event_handler
      - -Wl,--wrap=tud_task_ext
      - -Wl,--wrap=dcd_edpt_xfer
      - -Wl,--wrap=netd_reset
      - -Wl,--wrap=netd_open
      - -Wl,--wrap=netd_control_xfer_cb
      - -Wl,--wrap=netd_xfer_cb
      - -Wl,--wrap=usbd_edpt_xfer
      - -Wl,--wrap=tud_network_can_xmit
packages:
  common: !include common.yaml
safe_mode:
  on_safe_mode:
    - lambda: pd5_enter_safe_mode();
interval:
  - interval: 100ms
    then:
      - lambda: pd5_beat();
  - interval: 20s
    then:
      - lambda: |-
          pd5_report();
          ESP_LOGI("pdiag", "uptime %u ms", (unsigned) millis());
