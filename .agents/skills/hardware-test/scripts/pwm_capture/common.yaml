# ESP32-C6: a 20 kHz ledc output on GPIO14 behind a monochromatic light, captured period by period on the same pad
# by pwmcap.hpp. Substitutions: name, ps (wifi power_save_mode).
esphome:
  name: ${name}
  includes:
    - pwmcap.hpp
  on_boot:
    priority: -100
    then:
      - lambda: pwmcap::start(14);
      - light.turn_on:
          id: lamp
          brightness: 50%
          transition_length: 0s

esp32:
  variant: esp32c6
  board: esp32-c6-devkitc-1
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components: [esp_driver_rmt, esp_driver_pcnt]
    sdkconfig_options:
      CONFIG_RMT_ISR_IRAM_SAFE: y
      CONFIG_PCNT_ISR_IRAM_SAFE: y

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  reboot_timeout: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: ${ps}

output:
  - platform: ledc
    pin: GPIO14
    id: pwm_output
    frequency: 20000 Hz

light:
  - platform: monochromatic
    id: lamp
    name: Lamp
    output: pwm_output
    default_transition_length: 1000ms

interval:
  - interval: 10s
    then:
      - lambda: pwmcap::report();
