# ESP8266 harness: UART0 TX is looped back into its own RX inside the chip, so the frames the case scripts write
# reach the reader under test with no wires. Logs go over the API only.
esphome:
  name: ${name}
  includes:
    - lfh.hpp
  on_boot:
    priority: -100
    then:
      - lambda: |-
          USC0(0) |= (1 << UCLBE);
          ESP_LOGI("harness", "UART0 loopback on");

esp8266:
  board: ${board}

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  reboot_timeout: 0s

logger:
  baud_rate: 0
  level: VERBOSE

uart:
  id: bus
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: ${baud}
  rx_buffer_size: 512

button:
  - platform: template
    name: Run
    on_press:
      - script.execute: run_cases

  - platform: restart
    name: Restart
