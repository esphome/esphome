# proxy.yaml on an ESP32-S3 with 16 MB flash (Wi-Fi, OTA), plus the coexlog.hpp coexistence logger. -s name, flags, window
substitutions:
  name: i22859p
  flags: "y"
  window: 300ms

esphome:
  name: ${name}
  includes:
    - ivlog.hpp
    - coexlog.hpp
  platformio_options:
    build_flags:
      - -Wl,--wrap=esp_ble_gattc_register_callback
      - -Wl,--wrap=esp_ble_gap_register_callback
      - -Wl,--wrap=esp_coex_status_bit_set
      - -Wl,--wrap=esp_coex_status_bit_clear

esp32:
  variant: ESP32S3
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf
    log_level: INFO
    sdkconfig_options:
      CONFIG_BT_BLE_50_FEATURES_SUPPORTED: ${flags}
      CONFIG_BT_BLE_42_FEATURES_SUPPORTED: y

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

ota:
  - platform: esphome

api:
  reboot_timeout: 0s
  encryption:
    key: !secret api_key

esp32_ble:
  max_connections: 5

esp32_ble_tracker:
  scan_parameters:
    interval: 300ms
    window: ${window}
    active: true

bluetooth_proxy:
  active: true
  connection_slots: 5
