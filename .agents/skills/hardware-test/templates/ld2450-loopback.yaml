esphome:
  name: ${name}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // UART0 TX looped back into its own RX so injected frames reach the hub
          USC0(0) |= (1 << UCLBE);
          ESP_LOGI("harness", "UART0 loopback on");

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  reboot_timeout: 0s

logger:
  baud_rate: 0
  level: VERBOSE

uart:
  id: radar_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: ${baud}
  debug:
    direction: TX
    dummy_receiver: false
    after:
      delimiter: [0x04, 0x03, 0x02, 0x01]

ld2450:
  id: radar
  uart_id: radar_uart

select:
  - platform: ld2450
    baud_rate:
      name: Baud Rate
    zone_type:
      name: Zone Type

text_sensor:
  - platform: ld2450
    version:
      name: Radar Version
    target_1:
      direction:
        name: T1 Direction
    target_2:
      direction:
        name: T2 Direction
    target_3:
      direction:
        name: T3 Direction

sensor:
  - platform: ld2450
    target_count:
      name: Target Count

button:
  # periodic frames: header, 3 x (x, y, speed, resolution), footer
  - platform: template
    name: Frame Approach
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xAA, 0xFF, 0x03, 0x00,
                 0x00, 0x00, 0xE8, 0x83, 0x14, 0x00, 0x64, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x55, 0xCC]
  - platform: template
    name: Frame Away
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xAA, 0xFF, 0x03, 0x00,
                 0x00, 0x00, 0xE8, 0x83, 0x14, 0x80, 0x64, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x55, 0xCC]
  - platform: template
    name: Frame Stationary
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xAA, 0xFF, 0x03, 0x00,
                 0x00, 0x00, 0xE8, 0x83, 0x00, 0x00, 0x64, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x55, 0xCC]
  - platform: template
    name: Frame None
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xAA, 0xFF, 0x03, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x55, 0xCC]
  - platform: template
    name: Frame T2 T3
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xAA, 0xFF, 0x03, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0xF4, 0x81, 0x20, 0x83, 0x1E, 0x00, 0x64, 0x00,
                 0x2C, 0x01, 0xB0, 0x84, 0x0A, 0x80, 0x64, 0x00,
                 0x55, 0xCC]
  # query zone acks: header, length, command C1, status 01, 00 00, zone type, 00, 24 coordinate bytes, footer
  - platform: template
    name: Zone Ack Disabled
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x1E, 0x00, 0xC1, 0x01, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x04, 0x03, 0x02, 0x01]
  - platform: template
    name: Zone Ack Detection
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x1E, 0x00, 0xC1, 0x01, 0x00, 0x00, 0x01, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x04, 0x03, 0x02, 0x01]
  - platform: template
    name: Zone Ack Filter
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x1E, 0x00, 0xC1, 0x01, 0x00, 0x00, 0x02, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x04, 0x03, 0x02, 0x01]
  # name based setters, the path lambdas use
  - platform: template
    name: Set Zone Filter By Name
    on_press:
      - lambda: id(radar).set_zone_type("Filter");
  - platform: template
    name: Set Zone Bogus By Name
    on_press:
      - lambda: id(radar).set_zone_type("Bogus");
  - platform: template
    name: Set Baud 57600 By Name
    on_press:
      - lambda: id(radar).set_baud_rate("57600");
  - platform: template
    name: Set Baud Bogus By Name
    on_press:
      - lambda: id(radar).set_baud_rate("Bogus");
  # target 1 at x 772, y 258: bytes 04 03 02 01 are the command footer
  - platform: template
    name: Frame CmdFooter In Payload
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xAA, 0xFF, 0x03, 0x00,
                 0x04, 0x03, 0x02, 0x01, 0x00, 0x00, 0x64, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x55, 0xCC]
  # zone ack, type Detection, zone 1 x1 = 0xCC55: bytes 55 CC are the periodic footer
  - platform: template
    name: Zone Ack DataFooter In Payload
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x1E, 0x00, 0xC1, 0x01, 0x00, 0x00, 0x01, 0x00,
                 0x55, 0xCC, 0xC8, 0x00, 0xDC, 0x05, 0xB8, 0x0B, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x04, 0x03, 0x02, 0x01]
  # zone ack, type Filter, zone 1 x1 = 0x0304 and y1 = 0x0102: bytes 04 03 02 01 are the command footer
  - platform: template
    name: Zone Ack CmdFooter In Payload
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x1E, 0x00, 0xC1, 0x01, 0x00, 0x00, 0x02, 0x00,
                 0x04, 0x03, 0x02, 0x01, 0xDC, 0x05, 0xB8, 0x0B, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x04, 0x03, 0x02, 0x01]
  # a periodic frame cut after 12 bytes, then a complete zone ack (type Disabled, zeros)
  - platform: template
    name: Cut Frame Then Zone Ack
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xAA, 0xFF, 0x03, 0x00, 0x00, 0x00, 0xE8, 0x83, 0x14, 0x00, 0x64, 0x00,
                 0xFD, 0xFC, 0xFB, 0xFA, 0x1E, 0x00, 0xC1, 0x01, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x04, 0x03, 0x02, 0x01]
  # a periodic frame missing its last byte, then a complete one (target 1 moving away)
  - platform: template
    name: Cut Frame Then Frame
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xAA, 0xFF, 0x03, 0x00,
                 0x00, 0x00, 0xE8, 0x83, 0x14, 0x00, 0x64, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x55,
                 0xAA, 0xFF, 0x03, 0x00,
                 0x00, 0x00, 0xE8, 0x83, 0x14, 0x80, 0x64, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x55, 0xCC]
  # a command header claiming a 255 byte payload, then a complete periodic frame (target 1 stationary)
  - platform: template
    name: Bogus Length Then Frame
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0xFF, 0x00,
                 0xAA, 0xFF, 0x03, 0x00,
                 0x00, 0x00, 0xE8, 0x83, 0x00, 0x00, 0x64, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x55, 0xCC]
  # five garbage bytes, then a complete periodic frame (target 1 approaching)
  - platform: template
    name: Garbage Then Frame
    on_press:
      - uart.write:
          id: radar_uart
          data: [0x01, 0x02, 0x03, 0x42, 0x99,
                 0xAA, 0xFF, 0x03, 0x00,
                 0x00, 0x00, 0xE8, 0x83, 0x14, 0x00, 0x64, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x55, 0xCC]

number:
  - platform: ld2450
    presence_timeout:
      name: Presence Timeout
    zone_1:
      x1:
        name: Z1 X1
      y1:
        name: Z1 Y1
      x2:
        name: Z1 X2
      y2:
        name: Z1 Y2
