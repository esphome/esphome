esphome:
  name: ${name}
  on_boot:
    priority: -100
    then:
      - lambda: |-
          // UART0 TX looped back into its own RX so injected frames reach the hub
          USC0(0) |= (1 << UCLBE);
          ESP_LOGI("harness", "UART0 loopback on");

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  reboot_timeout: 0s

logger:
  baud_rate: 0
  level: VERBOSE

uart:
  id: radar_uart
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: ${baud}
  debug:
    direction: TX
    dummy_receiver: false
    after:
      delimiter: [0x04, 0x03, 0x02, 0x01]

ld2450:
  id: radar
  uart_id: radar_uart

select:
  - platform: ld2450
    baud_rate:
      name: Baud Rate
    zone_type:
      name: Zone Type

text_sensor:
  - platform: ld2450
    version:
      name: Radar Version
    target_1:
      direction:
        name: T1 Direction
    target_2:
      direction:
        name: T2 Direction
    target_3:
      direction:
        name: T3 Direction

sensor:
  - platform: ld2450
    target_count:
      name: Target Count

button:
  # periodic frames: header, 3 x (x, y, speed, resolution), footer
  - platform: template
    name: Frame Approach
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xAA, 0xFF, 0x03, 0x00,
                 0x00, 0x00, 0xE8, 0x83, 0x14, 0x00, 0x64, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x55, 0xCC]
  - platform: template
    name: Frame Away
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xAA, 0xFF, 0x03, 0x00,
                 0x00, 0x00, 0xE8, 0x83, 0x14, 0x80, 0x64, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x55, 0xCC]
  - platform: template
    name: Frame Stationary
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xAA, 0xFF, 0x03, 0x00,
                 0x00, 0x00, 0xE8, 0x83, 0x00, 0x00, 0x64, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x55, 0xCC]
  - platform: template
    name: Frame None
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xAA, 0xFF, 0x03, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x55, 0xCC]
  - platform: template
    name: Frame T2 T3
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xAA, 0xFF, 0x03, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0xF4, 0x81, 0x20, 0x83, 0x1E, 0x00, 0x64, 0x00,
                 0x2C, 0x01, 0xB0, 0x84, 0x0A, 0x80, 0x64, 0x00,
                 0x55, 0xCC]
  # query zone acks: header, length, command C1, status 01, 00 00, zone type, 00, 24 coordinate bytes, footer
  - platform: template
    name: Zone Ack Disabled
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x1E, 0x00, 0xC1, 0x01, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x04, 0x03, 0x02, 0x01]
  - platform: template
    name: Zone Ack Detection
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x1E, 0x00, 0xC1, 0x01, 0x00, 0x00, 0x01, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x04, 0x03, 0x02, 0x01]
  - platform: template
    name: Zone Ack Filter
    on_press:
      - uart.write:
          id: radar_uart
          data: [0xFD, 0xFC, 0xFB, 0xFA, 0x1E, 0x00, 0xC1, 0x01, 0x00, 0x00, 0x02, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
                 0x04, 0x03, 0x02, 0x01]
  # name based setters, the path lambdas use
  - platform: template
    name: Set Zone Filter By Name
    on_press:
      - lambda: id(radar).set_zone_type("Filter");
  - platform: template
    name: Set Zone Bogus By Name
    on_press:
      - lambda: id(radar).set_zone_type("Bogus");
  - platform: template
    name: Set Baud 57600 By Name
    on_press:
      - lambda: id(radar).set_baud_rate("57600");
  - platform: template
    name: Set Baud Bogus By Name
    on_press:
      - lambda: id(radar).set_baud_rate("Bogus");
