# Client side: the daikin_madoka climate under test, connecting to the fake BRC1H. fake_mac is the fake's
# Bluetooth MAC (its Wi-Fi STA MAC + 2): esphome -s fake_mac AA:BB:CC:DD:EE:FF run madokacli.yaml
esphome:
  name: madokacli
esp32:
  board: esp32dev
  framework:
    type: esp-idf
logger:
  level: VERBOSE
  logs:
    ble_device_base: INFO
    component: DEBUG
    scheduler: DEBUG
    api.service: DEBUG
    api.connection: DEBUG
    api: DEBUG
    wifi: DEBUG
    esp32_ble_tracker: INFO
    esp32_ble: DEBUG
    sensor: DEBUG
    climate: DEBUG
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
api:
  reboot_timeout: 0s
ota:
  - platform: esphome
esp32_ble:
  io_capability: display_yes_no
esp32_ble_tracker:
ble_client:
  - mac_address: ${fake_mac}
    id: madoka_ble
climate:
  - platform: daikin_madoka
    name: Madoka Climate
    ble_client_id: madoka_ble
    update_interval: 10s
