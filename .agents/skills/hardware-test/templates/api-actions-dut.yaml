esphome:
  name: ${name}

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

logger:
  level: DEBUG

api:
  reboot_timeout: 0s
  actions:
    - action: play_buzzer
      description: Play a song or build one from parts
      variables:
        song_str:
          type: string
          description: Full RTTTL string
          example: "scale:d=4,o=5,b=100:c,d,e"
          required: false
        notes:
          type: string
          required: false
        octave:
          type: int
          default: 5
        bpm:
          type: int
          default: 100
        tempo:
          type: float
          default: 1.5
        loud:
          type: bool
          default: true
        label:
          type: string
          default: ""
      then:
        - lambda: |-
            char s[40], n[40], l[40];
            snprintf(s, sizeof(s), "%.*s", (int) song_str.size(), song_str.c_str());
            snprintf(n, sizeof(n), "%.*s", (int) notes.size(), notes.c_str());
            snprintf(l, sizeof(l), "%.*s", (int) label.size(), label.c_str());
            ESP_LOGD("main", "play_buzzer song=%s(%d) notes=%s(%d) octave=%d bpm=%d tempo=%.1f loud=%d label=%s(%d)", s,
                     (int) song_str.size(), n, (int) notes.size(), octave, bpm, tempo, loud, l, (int) label.size());
    - action: plain_action
      variables:
        value: int
      then:
        - logger.log:
            format: "plain_action value=%d"
            args: ["value"]
    - action: list_action
      variables:
        values: int[]
      then:
        - logger.log:
            format: "list_action n=%d"
            args: ["values.size()"]
