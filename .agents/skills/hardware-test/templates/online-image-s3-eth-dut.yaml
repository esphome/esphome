esphome:
  name: oi-s3eth
  friendly_name: oi-s3eth

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9

api:
  encryption:
    key: !secret api_key
  reboot_timeout: 0s
  actions:
    - action: fetch
      variables:
        url: string
      then:
        - online_image.set_url:
            id: img
            url: !lambda 'return url;'
            update: false
        - component.update: img
    - action: refetch
      then:
        - component.update: img
    - action: fetch_small
      variables:
        url: string
      then:
        - online_image.set_url:
            id: img_small
            url: !lambda 'return url;'
            update: false
        - component.update: img_small
    - action: refetch_small
      then:
        - component.update: img_small

http_request:
  timeout: 4.5s
  verify_ssl: false

display:

image:
  - platform: online_image
    id: img
    url: http://127.0.0.1/none.bmp
    format: AUTO
    type: RGB565
    update_interval: never
    on_download_finished:
      logger.log:
        format: "download finished: img cached=%d"
        args: [cached]
    on_error:
      logger.log: "download error: img"
  - platform: online_image
    id: img_small
    url: http://127.0.0.1/none.bmp
    format: AUTO
    type: RGB565
    buffer_size: 256
    update_interval: never
    on_download_finished:
      logger.log:
        format: "download finished: img_small cached=%d"
        args: [cached]
    on_error:
      logger.log: "download error: img_small"

button:
  - platform: restart
    id: reboot_btn
    name: Reboot

debug:
  update_interval: 2s

sensor:
  - platform: debug
    loop_time:
      name: Loop Time
    free:
      name: Heap Free
