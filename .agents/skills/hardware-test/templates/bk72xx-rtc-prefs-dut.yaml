substitutions:
  run: "1"

esphome:
  name: lt21007e
  includes: [../scripts/libretiny_prefs/ltprefs.hpp]
  platformio_options:
    build_flags: ["-DUSE_LIBRETINY_RTC_PREFERENCES"]
  on_boot:
    priority: -100
    then:
      - lambda: id(act) = ltprefs_boot(id(step), ${run});
      # the first boot waits so the host can open the port and pulse a reset before the sequence starts
      - delay: !lambda 'return (id(step) == 0 || id(step) == 8) ? 30000 : 3000;'
      - lambda: ltprefs_exit(id(step), ${run}, id(act));

bk72xx:
  board: generic-bk7238-tuya

logger:
  hardware_uart: UART1
  level: DEBUG

preferences:
  flash_write_interval: 1s

globals:
  - id: step
    type: int
    initial_value: "0"
  - id: act
    type: int
    initial_value: "0"

interval:
  - interval: 10s
    then:
      - lambda: ltprefs_alive(id(step), id(act));
