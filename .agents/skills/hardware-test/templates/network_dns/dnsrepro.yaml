# esphome#19805 repro on the Waveshare ESP32-S3-ETH (W5500). Substitutions:
#   first: ethernet or wifi (network: priority order), scenario timeline in the interval lambda.
substitutions:
  name: dnsrepro
  first: ethernet
  second: wifi
  # "false" powers the W5500 PHY down at boot: a link-less start without unplugging anything
  phy_boot: "true"

esphome:
  name: ${name}
  includes:
    - dnsdiag.hpp
  on_boot:
    priority: -100
    then:
      - lambda: if (!${phy_boot}) dnsdiag::phy_power(false);

esp32:
  variant: esp32s3
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

network:
  priority:
    - ${first}
    - ${second}

ethernet:
  type: W5500
  clk_pin: GPIO13
  mosi_pin: GPIO11
  miso_pin: GPIO12
  cs_pin: GPIO14
  interrupt_pin: GPIO10
  reset_pin: GPIO9
  clock_speed: 20MHz

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  enable_on_boot: false
  power_save_mode: none
  reboot_timeout: 0s

interval:
  - interval: 3s
    then:
      - lambda: dnsdiag::print();
  - interval: 5s
    then:
      - lambda: dnsdiag::lookup();
  # Timeline (seconds since boot):
  #  40 wifi.enable (Wi-Fi DHCP starts after Ethernet has the default)
  # 100 wifi.disable, 110 wifi.enable (Wi-Fi reconnect)
  # 170 W5500 PHY power off (no link: Ethernet retries DHCP every 15 s), 250 PHY power on
  # 320 done
  - interval: 1s
    then:
      - lambda: |-
          static int step = 0;
          uint32_t s = millis() / 1000;
          static const uint32_t at[] = {40, 100, 110, 170, 250, 320};
          if (step >= 6 || s < at[step]) return;
          ESP_LOGI("dnsdiag", "STEP %d at %u s", step, (unsigned) s);
          switch (step) {
            case 0: case 2: wifi::global_wifi_component->enable(); break;
            case 1: wifi::global_wifi_component->disable(); break;
            case 3: dnsdiag::phy_power(false); break;
            case 4: dnsdiag::phy_power(true); break;
            case 5: ESP_LOGI("dnsdiag", "TIMELINE DONE"); break;
          }
          step++;
