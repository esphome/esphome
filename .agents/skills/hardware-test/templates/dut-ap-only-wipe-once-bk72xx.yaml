esphome:
  name: i19430-dut3
  on_boot:
    priority: 800
    then:
      - lambda: |-
          auto marker = global_preferences->make_preference<uint32_t>(0x19430001, true);
          uint32_t v = 0;
          if (!marker.load(&v)) {
            ESP_LOGW("test", "first boot: wiping preferences");
            global_preferences->reset();
            static_cast<esphome::libretiny::LibreTinyPreferences *>(global_preferences)->open();
            v = 1;
            marker.save(&v);
            global_preferences->sync();
          }

bk72xx:
  board: generic-bk7238

logger:
  hardware_uart: UART1
  level: VERBOSE

wifi:
  ap:
    ssid: i19430-ap

captive_portal:

interval:
  - interval: 5s
    then:
      - lambda: ESP_LOGI("test", "alive %u s", (unsigned) (millis() / 1000));
