substitutions:
  base: !secret manifest_base

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

logger:
  level: DEBUG
api:
  reboot_timeout: 0s

http_request:
  verify_ssl: false
  timeout: 10s

ota:
  - platform: http_request
    id: ota_http

update:
  - platform: http_request
    id: upd
    name: Firmware
    source: ${base}/stable.json
    update_interval: 1h

button:
  - platform: template
    name: Check
    on_press:
      - lambda: id(upd).check();
  - platform: template
    name: URL Slow Cstr
    on_press:
      - lambda: |-
          std::string url = "${base}/slow.json";
          id(upd).set_source_url(url.c_str());
  - platform: template
    name: URL Stable Literal
    on_press:
      - lambda: id(upd).set_source_url("${base}/stable.json");
  - platform: template
    name: Heap
    on_press:
      - lambda: |-
          #ifdef USE_ESP8266
          ESP_LOGI("harness", "heap free %u", ESP.getFreeHeap());
          #else
          ESP_LOGI("harness", "heap free %u", (unsigned) heap_caps_get_free_size(MALLOC_CAP_INTERNAL));
          #endif
