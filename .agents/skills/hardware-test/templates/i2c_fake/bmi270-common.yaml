# Fake BMI270 on an in-firmware I2C bus (bmi270fake.hpp). The real i2c: bus keeps codegen happy; the on_boot
# at 700 runs after the bus and before the bmi270 setup (DATA) and swaps the device onto the fake.
esphome:
  name: ${name}
  includes:
    - alloc_count.hpp
    - bmi270fake.hpp
  platformio_options:
    build_flags:
      - -Wl,--wrap=malloc
      - -DBMI_FAKE_WRAP_MALLOC
  on_boot:
    - priority: 700
      then:
        - lambda: |-
            bmi270fake::bus.init_bmm(${fake_aux_addr});
            id(imu)->set_i2c_bus(&bmi270fake::bus);
    - priority: -100
      then:
        - lambda: |-
            ESP_LOGI("bmi270fake", "BUILD %s imu_failed=%d", "${name}", id(imu)->is_failed());
            bmi270fake::bus.report();

logger:
  level: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

api:
  reboot_timeout: 0s

i2c:
  id: i2c_bus
  sda: ${sda}
  scl: ${scl}
  scan: false

sensor:
  - platform: bmi270
    bmi270_id: imu
    name: "BMI Temperature"
  - platform: motion
    type: acceleration_x
    name: "BMI Accel X"
    accuracy_decimals: 4
  - platform: motion
    type: acceleration_y
    name: "BMI Accel Y"
    accuracy_decimals: 4
  - platform: motion
    type: acceleration_z
    name: "BMI Accel Z"
    accuracy_decimals: 4
  - platform: motion
    type: gyroscope_x
    name: "BMI Gyro X"
  - platform: motion
    type: gyroscope_y
    name: "BMI Gyro Y"
  - platform: motion
    type: gyroscope_z
    name: "BMI Gyro Z"

interval:
  - interval: 60s
    then:
      - lambda: bmi270fake::bus.report();
