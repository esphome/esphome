esp32:
  board: esp32dev
  framework:
    type: esp-idf

esphome:
  includes:
    - ccsfake.hpp
  on_boot:
    - priority: 700
      then:
        - lambda: id(ccs)->set_i2c_bus(&ccsfake::bus);

logger:
  level: DEBUG
  logs:
    sensor: INFO
    ccs811: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:
  reboot_timeout: 0s

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: false

sensor:
  - platform: template
    id: hum
    update_interval: never
  - platform: template
    id: tmp
    update_interval: never
  - platform: ccs811
    id: ccs
    address: 0x5A
    update_interval: never
    eco2:
      name: CCS eCO2
    tvoc:
      name: CCS TVOC
    humidity: hum
    temperature: tmp
    version:
      name: CCS Version

button:
  - platform: template
    name: CCS Cases
    on_press:
      - lambda: |-
          const float cases[][2] = {{50, 25},  {42.348f, 20.5f}, {33.9995f, -0.0005f}, {45.3f, 22.7f}, {0, -25},
                                    {100, 50}, {60.1f, 18.4f},   {NAN, NAN},           {120, 80},     {0.001f, 0.001f}};
          ccsfake::bus.quiet = false;
          for (auto &c : cases)
            ccsfake::run(id(ccs), id(hum), id(tmp), c[0], c[1]);
          auto &b = ccsfake::bus;
          bool ok = b.checked && !b.bad && !b.bad_reads && !b.bad_writes;
          ESP_LOGI("ccsfake", "CASES checked %u bad %u bad_reads %u bad_writes %u %s", (unsigned) b.checked,
                   (unsigned) b.bad, (unsigned) b.bad_reads, (unsigned) b.bad_writes, ok ? "PASS" : "FAIL");
  - platform: template
    name: CCS Sweep
    on_press:
      - lambda: |-
          ccsfake::bus.quiet = true;
          auto &b = ccsfake::bus;
          uint32_t c0 = b.checked, b0 = b.bad, r0 = b.bad_reads, w0 = b.bad_writes;
          for (int i = 0; i < 2000; i++) {
            float h = (esphome::random_uint32() % 100001) / 1000.0f;
            float t = (int32_t) (esphome::random_uint32() % 75001) / 1000.0f - 25.0f;
            ccsfake::run(id(ccs), id(hum), id(tmp), h, t);
            App.feed_wdt();
          }
          uint32_t checked = b.checked - c0, bad = b.bad - b0;
          uint32_t bad_reads = b.bad_reads - r0, bad_writes = b.bad_writes - w0;
          bool ok = checked && !bad && !bad_reads && !bad_writes;
          ESP_LOGI("ccsfake", "SWEEP checked %u bad %u bad_reads %u bad_writes %u %s", (unsigned) checked,
                   (unsigned) bad, (unsigned) bad_reads, (unsigned) bad_writes, ok ? "PASS" : "FAIL");
