esphome:
  name: ${name}
  includes:
    - wkfake.hpp
  on_boot:
    - priority: 999.95  # before the weikai hub setup (BUS - 0.1)
      then:
        - lambda: |-
            wkfake::bus.trace = 1000;
            id(wk)->set_i2c_bus(&wkfake::bus);
    - priority: -100
      then:
        - lambda: wkfake::bus.trace = 0;
        - delay: 4s
        - script.execute: drive

logger:
  level: VERBOSE
  logs:
    component: DEBUG
    scheduler: DEBUG
    app: DEBUG
    switch: DEBUG
    binary_sensor: DEBUG
    gpio.binary_sensor: DEBUG
    gpio.switch: DEBUG
    esp32: DEBUG

i2c:
  id: realbus
  sda: GPIO21
  scl: GPIO22
  scan: false

wk2168_i2c:
  - id: wk
    i2c_id: realbus
    address: 0x10
    uart:
      - id: wk_uart0
        channel: 0
        baud_rate: 115200
      - id: wk_uart1
        channel: 1
        baud_rate: 9600

switch:
  - platform: gpio
    id: wk_out0
    name: "WK pin 0"
    restore_mode: ALWAYS_OFF
    pin:
      wk2168_i2c: wk
      number: 0
      mode:
        output: true
    on_turn_on:
      - logger.log: {format: "SWITCH pin0 ON", level: INFO}
    on_turn_off:
      - logger.log: {format: "SWITCH pin0 OFF", level: INFO}

binary_sensor:
  - platform: gpio
    id: wk_in1
    name: "WK pin 1"
    trigger_on_initial_state: true
    pin:
      wk2168_i2c: wk
      number: 1
      mode:
        input: true
    on_state:
      - lambda: |-
          ESP_LOGI("wktest", "BINARY pin1 = %s", x ? "ON" : "OFF");

button:
  - platform: template
    id: in_high
    name: "Fake input pin1 high"
    on_press:
      - lambda: wkfake::bus.set_input(1, true);
  - platform: template
    id: in_low
    name: "Fake input pin1 low"
    on_press:
      - lambda: wkfake::bus.set_input(1, false);

interval:
  - interval: 100ms
    then:
      - lambda: |-
          uart::UARTComponent *u[2] = {id(wk_uart0), id(wk_uart1)};
          for (int c = 0; c < 2; c++) {
            size_t n = u[c]->available();
            if (!n) continue;
            char buf[64];
            if (n > sizeof(buf) - 1) n = sizeof(buf) - 1;
            u[c]->read_array((uint8_t *) buf, n);
            for (size_t i = 0; i < n; i++) if (buf[i] < 0x20) buf[i] = '.';
            buf[n] = 0;
            ESP_LOGI("wktest", "UART ch%d got %u bytes '%s'", c, (unsigned) n, buf);
          }

script:
  - id: drive
    then:
      - logger.log: {format: "STEP 1 state after setup", level: INFO}
      - lambda: wkfake::bus.dump();
      - logger.log: {format: "STEP 2 trace one poll pass", level: INFO}
      - lambda: wkfake::bus.trace = 14;
      - delay: 1s
      - logger.log: {format: "STEP 3 GPIO output toggles", level: INFO}
      - switch.turn_on: wk_out0
      - delay: 1s
      - switch.turn_off: wk_out0
      - delay: 1s
      - switch.turn_on: wk_out0
      - delay: 1s
      - logger.log: {format: "STEP 4 GPIO input changes", level: INFO}
      - button.press: in_high
      - delay: 1s
      - button.press: in_low
      - delay: 1s
      - button.press: in_high
      - delay: 1s
      - logger.log: {format: "STEP 5 UART TX", level: INFO}
      - lambda: |-
          id(wk_uart0)->write_str("PING0");
          id(wk_uart1)->write_str("PING1");
      - delay: 1s
      - logger.log: {format: "STEP 6 UART RX inject", level: INFO}
      - lambda: |-
          wkfake::bus.inject_rx(0, "hello0");
          wkfake::bus.inject_rx(1, "hello1");
      - delay: 1s
      - logger.log: {format: "STEP 7 three single read NACKs", level: INFO}
      - lambda: wkfake::bus.fail_reads = 1;
      - delay: 1s
      - lambda: wkfake::bus.fail_reads = 1;
      - delay: 1s
      - lambda: wkfake::bus.fail_reads = 1;
      - delay: 1s
      - logger.log: {format: "STEP 8 single NACK on the register pointer write", level: INFO}
      - lambda: wkfake::bus.fail_ptr = 1;
      - delay: 1s
      - logger.log: {format: "STEP 9 double read NACK", level: INFO}
      - lambda: wkfake::bus.fail_reads = 2;
      - delay: 1s
      - logger.log: {format: "STEP 10 every 37th read NACKed for 5 s", level: INFO}
      - lambda: |-
          wkfake::bus.every_n = 37;
          ESP_LOGI("wktest", "EVERYN start injected=%u retries=%u", wkfake::bus.injected, wkfake::bus.retries);
      - delay: 5s
      - lambda: |-
          wkfake::bus.every_n = 0;
          ESP_LOGI("wktest", "EVERYN end injected=%u retries=%u no_retry=%u", wkfake::bus.injected, wkfake::bus.retries, wkfake::bus.no_retry);
      - delay: 500ms
      - logger.log: {format: "STEP 11 GPIO and UART again after faults", level: INFO}
      - switch.turn_off: wk_out0
      - button.press: in_low
      - delay: 1s
      - lambda: |-
          wkfake::bus.inject_rx(0, "again0");
          id(wk_uart1)->write_str("PONG1");
      - delay: 1s
      - logger.log: {format: "STEP 12 final", level: INFO}
      - lambda: wkfake::bus.dump();
      - logger.log: {format: "DRIVE DONE", level: INFO}
