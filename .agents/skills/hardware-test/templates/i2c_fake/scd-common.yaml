esp32:
  board: esp32dev
  framework:
    type: esp-idf

esphome:
  includes:
    - scdfake.hpp
  on_boot:
    - priority: 700
      then:
        - lambda: |-
            id(scd)->set_i2c_bus(&scdfake::bus);
            id(scd_fixed)->set_i2c_bus(&scdfake::bus);

logger:
  level: DEBUG
  logs:
    sensor: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:
  reboot_timeout: 0s

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: false

sensor:
  - platform: template
    id: press
    update_interval: never
  - platform: scd4x
    id: scd
    address: 0x62
    update_interval: never
    ambient_pressure_compensation_source: press
    co2:
      id: scd_co2
      name: SCD CO2
  - platform: scd4x
    id: scd_fixed
    address: 0x63
    update_interval: never
    ambient_pressure_compensation: 1013.6mbar
    co2:
      name: SCD Fixed CO2

button:
  - platform: template
    name: Next
    on_press:
      - lambda: |-
          using namespace scdfake;
          float p = CASES[idx++ % (sizeof(CASES) / sizeof(CASES[0]))];
          start_case(p);
          id(press).state = p;
          id(scd_co2).state = NAN;
          ESP_LOGI("scdfake", "CASE source %.2f", p);
          id(scd).update();
      # the measurement read runs from a timeout after update(), so count once it is done
      - delay: 200ms
      - lambda: |-
          scdfake::log_case("source", scdfake::case_p, id(scd_co2).state == 600.0f ? 1 : 0);
  - platform: template
    name: Show
    on_press:
      - lambda: |-
          using namespace scdfake;
          int fixed = RANGE_CHECKED ? (int) lroundf(FIXED_HPA) : (int) FIXED_HPA;
          bool pass = bus.count_e000[1] == 1 && bus.last_e000[1] == fixed && bus.e000_bad_crc() == 0 &&
                      bus.bad_writes == 0 && bus.unknown_reads == 0 && !id(scd)->is_failed() &&
                      !id(scd_fixed)->is_failed();
          ESP_LOGI("scdfake", "SHOW 0x62 last E000 %d (%u writes, %u bad CRC), 0x63 last E000 %d (%u writes, %u bad CRC, expected one of %d), bad writes %u, unknown reads %u, scd failed %d, fixed failed %d %s",
                   bus.last_e000[0], (unsigned) bus.count_e000[0], (unsigned) bus.bad_crc_e000[0], bus.last_e000[1],
                   (unsigned) bus.count_e000[1], (unsigned) bus.bad_crc_e000[1], fixed, (unsigned) bus.bad_writes,
                   (unsigned) bus.unknown_reads, (int) id(scd)->is_failed(), (int) id(scd_fixed)->is_failed(),
                   pass ? "PASS" : "FAIL");
  - platform: template
    name: Direct
    on_press:
      - lambda: |-
          for (float p : {101325.0f, 1013.6f, 450.0f, 1100.2f}) {
            scdfake::start_case(p);
            id(scd)->set_ambient_pressure_compensation(p);
            scdfake::log_case("direct", p, -1);
          }
