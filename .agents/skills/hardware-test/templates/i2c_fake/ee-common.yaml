esp32:
  board: esp32dev
  framework:
    type: esp-idf

esphome:
  includes:
    - eefake.hpp
  on_boot:
    - priority: 700
      then:
        - lambda: |-
            id(hte)->set_i2c_bus(&eefake::bus);
            id(tee)->set_i2c_bus(&eefake::bus);

logger:
  level: VERBOSE
  logs:
    component: DEBUG
    api.service: DEBUG
    api.connection: DEBUG
    scheduler: DEBUG
    sensor: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:
  reboot_timeout: 0s

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: false

sensor:
  - platform: hte501
    id: hte
    update_interval: never
    temperature:
      name: HTE Temperature
      filters: []
    humidity:
      name: HTE Humidity
      filters: []
  - platform: tee501
    id: tee
    name: TEE Temperature
    update_interval: never
    filters: []

button:
  - platform: template
    name: Next
    on_press:
      - lambda: |-
          uint16_t r = eefake::RAWS[eefake::idx++ % (sizeof(eefake::RAWS) / sizeof(eefake::RAWS[0]))];
          eefake::bus.raw = r;
          ESP_LOGI("eefake", "RAW 0x%04X expect %.2f", r, (int16_t) r / 100.0f);
          id(hte).update();
          id(tee).update();
