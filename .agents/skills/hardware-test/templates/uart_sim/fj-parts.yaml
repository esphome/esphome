esphome:
  on_boot:
    priority: -100
    then:
      - lambda: sim::loopback(id(u_j));

uart:
  - id: u_j
    tx_pin: GPIO25
    rx_pin: GPIO26
    baud_rate: 9600

sensor:
  - platform: jsn_sr04t
    name: JSN Distance
    uart_id: u_j
    update_interval: 15s
    accuracy_decimals: 3
    filters: []

button:
  - platform: template
    name: JSN Good
    on_press:
      - lambda: sim::send(id(u_j), "JSN Good", sim::d4(3001));
  - platform: template
    name: JSN Bad Checksum
    on_press:
      - lambda: sim::send(id(u_j), "JSN Bad Checksum", sim::d4(3002, true));
  - platform: template
    name: JSN Garbage Then Frame
    on_press:
      - lambda: sim::send(id(u_j), "JSN Garbage Then Frame", sim::cat({0x12, 0x34}, sim::d4(3003)));
  - platform: template
    name: JSN Repeated Header
    on_press:
      - lambda: sim::send(id(u_j), "JSN Repeated Header", sim::cat({0xFF}, sim::d4(3004)));
  - platform: template
    name: JSN Cut Then Frame
    on_press:
      - lambda: sim::send(id(u_j), "JSN Cut Then Frame", sim::cat({0xFF, 0x01}, sim::d4(3005)));
  - platform: template
    name: JSN Too Close
    on_press:
      - lambda: sim::send(id(u_j), "JSN Too Close", sim::d4(100));
  - platform: template
    name: JSN Split
    on_press:
      - lambda: sim::send(id(u_j), "JSN Split head", sim::part(sim::d4(3006), 0, 2));
      - delay: 300ms
      - lambda: sim::send(id(u_j), "JSN Split rest", sim::part(sim::d4(3006), 2, 4));
  - platform: template
    name: JSN Two Frames
    on_press:
      - lambda: sim::send(id(u_j), "JSN Two Frames", sim::cat(sim::d4(3007), sim::d4(3008)));
  - platform: template
    name: JSN Bad Then Good
    on_press:
      - lambda: sim::send(id(u_j), "JSN Bad Then Good", sim::cat(sim::d4(3009, true), sim::d4(3010)));
  - platform: template
    name: JSN Good After
    on_press:
      - lambda: sim::send(id(u_j), "JSN Good After", sim::d4(3011));
