esp32:
  board: esp32dev
  framework:
    type: esp-idf

esphome:
  includes: [ld6sim2.hpp]
  on_boot:
    priority: -100
    then:
      - lambda: ld6sim::mod.u = id(uart_mod);
      - delay: 15s
      - script.execute: cases

logger:
  level: VERBOSE
  logs:
    component: DEBUG
    api.service: DEBUG
    api.connection: DEBUG
    scheduler: DEBUG
    wifi: DEBUG
    uart.idf: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

uart:
  - id: uart_radar
    tx_pin: {number: GPIO25, allow_other_uses: true}
    rx_pin: {number: GPIO26, allow_other_uses: true}
    baud_rate: 115200
    rx_buffer_size: 2048
  - id: uart_mod
    tx_pin: {number: GPIO26, allow_other_uses: true}
    rx_pin: {number: GPIO25, allow_other_uses: true}
    baud_rate: 115200
    rx_buffer_size: 512

ld6002b:
  id: ld6002b_radar
  uart_id: uart_radar
  wakeup_pin: GPIO14

sensor:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    target_count:
      name: Target Count
    point_count:
      name: Point Count
    target_1:
      x:
        name: Target-1 X
      y:
        name: Target-1 Y
      z:
        name: Target-1 Z
      doppler_index:
        name: Target-1 Dop
      cluster_id:
        name: Target-1 Cluster
    target_2:
      x:
        name: Target-2 X
      y:
        name: Target-2 Y
      z:
        name: Target-2 Z
      doppler_index:
        name: Target-2 Dop
      cluster_id:
        name: Target-2 Cluster
    target_3:
      x:
        name: Target-3 X
      y:
        name: Target-3 Y
      z:
        name: Target-3 Z
      doppler_index:
        name: Target-3 Dop
      cluster_id:
        name: Target-3 Cluster
    interference_area_0:
      x_min:
        name: Interference-0 X Min
      x_max:
        name: Interference-0 X Max
      y_min:
        name: Interference-0 Y Min
      y_max:
        name: Interference-0 Y Max
      z_min:
        name: Interference-0 Z Min
      z_max:
        name: Interference-0 Z Max
    detection_area_0:
      x_min:
        name: Detection-0 X Min
      x_max:
        name: Detection-0 X Max
      y_min:
        name: Detection-0 Y Min
      y_max:
        name: Detection-0 Y Max
      z_min:
        name: Detection-0 Z Min
      z_max:
        name: Detection-0 Z Max

binary_sensor:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    target:
      name: Presence
    target_1:
      name: Target-1 Presence
    detection_area_0:
      name: Detection Area-0 Presence

text_sensor:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    work_mode:
      name: Work Mode
    ota_version:
      name: OTA Version

number:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    hold_delay:
      name: Hold Delay
    z_min:
      name: Z Min
    z_max:
      name: Z Max
    low_power_sleep_time:
      name: Low Power Sleep
    area_config:
      x_min:
        name: Area X Min
      x_max:
        name: Area X Max
      y_min:
        name: Area Y Min
      y_max:
        name: Area Y Max
      z_min:
        name: Area Z Min
      z_max:
        name: Area Z Max

select:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    sensitivity:
      name: Sensitivity
    trigger_speed:
      name: Trigger Speed
    installation_mode:
      name: Installation
    area_id:
      name: Area ID

switch:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    low_power:
      name: Low Power
    point_cloud:
      name: Point Cloud
    target_display:
      name: Target Display

button:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    apply_area:
      name: Apply Area
    auto_interference:
      name: Auto Interference
    get_areas:
      name: Get Areas
    clear_interference:
      name: Clear Interference
    reset_detection_area:
      name: Reset Detection
    get_delay:
      name: Get Delay
    get_sensitivity:
      name: Get Sensitivity
    get_trigger_speed:
      name: Get Trigger Speed
    get_z_range:
      name: Get Z Range
    get_installation:
      name: Get Installation
    get_low_power_mode:
      name: Get Low Power Mode
    get_low_power_sleep_time:
      name: Get Low Power Sleep
    reset_unattended:
      name: Reset Unattended
    wake:
      name: Wake

interval:
  - interval: 10ms
    then:
      - lambda: ld6sim::mod.poll();

script:
  - id: gap
    then:
      - delay: 300ms
  - id: cases
    then:
      - lambda: ESP_LOGI("ld6sim", "CASE good");
      - lambda: ld6sim::mod.send("x=1", ld6sim::target(1));
      - delay: 300ms
      - lambda: ld6sim::mod.send("x=-1 (count 0)", ld6sim::target(-1));
      - delay: 300ms
      - lambda: ld6sim::mod.send("x=2", ld6sim::target(2));
      - delay: 300ms
      - lambda: ESP_LOGI("ld6sim", "CASE split");
      - lambda: ld6sim::mod.send_slow("x=3 slow", ld6sim::target(3));
      - delay: 300ms
      - lambda: |-
          ESP_LOGI("ld6sim", "CASE garbage");
          auto f = ld6sim::target(4);
          std::vector<uint8_t> b = {0x00, 0xFF, 0x55, 0x01, 0x02};
          b.insert(b.end(), f.begin(), f.end());
          ld6sim::mod.send("garbage+x=4", b);
      - delay: 300ms
      - lambda: |-
          ESP_LOGI("ld6sim", "CASE bad_hck");
          auto a = ld6sim::target(50); a[7] ^= 0x10;
          auto b = ld6sim::target(5);
          a.insert(a.end(), b.begin(), b.end());
          ld6sim::mod.send("bad hck x=50 + x=5", a);
      - delay: 300ms
      - lambda: |-
          ESP_LOGI("ld6sim", "CASE bad_dck");
          auto a = ld6sim::target(60); a.back() ^= 0x10;
          auto b = ld6sim::target(6);
          a.insert(a.end(), b.begin(), b.end());
          ld6sim::mod.send("bad dck x=60 + x=6", a);
      - delay: 300ms
      - lambda: |-
          ESP_LOGI("ld6sim", "CASE lost_hck");
          auto a = ld6sim::target(70); a.erase(a.begin() + 7);
          auto b = ld6sim::target(7);
          a.resize(7);  // header only, its checksum lost; the next frame follows at once
          a.insert(a.end(), b.begin(), b.end());
          ld6sim::mod.send("lost hck + x=7", a);
      - delay: 300ms
      - lambda: |-
          ESP_LOGI("ld6sim", "CASE lost_dck");
          auto a = ld6sim::target(80); a.pop_back();
          auto b = ld6sim::target(8);
          a.insert(a.end(), b.begin(), b.end());
          ld6sim::mod.send("lost dck x=80 + x=8", a);
      - delay: 300ms
      - lambda: |-
          ESP_LOGI("ld6sim", "CASE oversized");
          std::vector<uint8_t> d(1100, 0x01);
          auto a = ld6sim::frame(0x1234, 0x0A08, d);
          auto b = ld6sim::target(9);
          a.insert(a.end(), b.begin(), b.end());
          ld6sim::mod.send("1100 byte frame + x=9", a);
      - delay: 300ms
      - lambda: |-
          ESP_LOGI("ld6sim", "CASE burst");
          std::vector<uint8_t> a;
          for (int i = 0; i < 20; i++) { auto f = ld6sim::target(100 + i); a.insert(a.end(), f.begin(), f.end()); }
          ld6sim::mod.send("20 frames x=100..119", a);
      - delay: 500ms
      - lambda: |-
          ESP_LOGI("ld6sim", "CASE area_presence");
          std::vector<uint8_t> d; ld6sim::put_u(d, 1); ld6sim::put_u(d, 0); ld6sim::put_u(d, 0); ld6sim::put_u(d, 1);
          ld6sim::mod.out(0x0A0A, d);
      - delay: 300ms
      - lambda: |-
          ESP_LOGI("ld6sim", "CASE work_mode");
          ld6sim::mod.out(0x0A14, {1});
      - delay: 300ms
      - lambda: ESP_LOGI("ld6sim", "CASE done acks=%u", (unsigned) ld6sim::mod.acks);
