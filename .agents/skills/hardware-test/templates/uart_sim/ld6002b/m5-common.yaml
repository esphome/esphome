esp32:
  board: esp32dev
  framework:
    type: esp-idf

esphome:
  includes: [ld6sim2.hpp]
  on_boot:
    priority: -100
    then:
      - lambda: ld6sim::mod.u = id(uart_mod);
      - delay: 15s
      - script.execute: cases

logger:
  level: VERBOSE
  logs:
    component: DEBUG
    api.service: DEBUG
    api.connection: DEBUG
    scheduler: DEBUG
    wifi: DEBUG
    uart.idf: DEBUG

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

api:
  reboot_timeout: 0s

ota:
  - platform: esphome

uart:
  - id: uart_radar
    tx_pin: {number: GPIO25, allow_other_uses: true}
    rx_pin: {number: GPIO26, allow_other_uses: true}
    baud_rate: 115200
    rx_buffer_size: 2048
  - id: uart_mod
    tx_pin: {number: GPIO26, allow_other_uses: true}
    rx_pin: {number: GPIO25, allow_other_uses: true}
    baud_rate: 115200
    rx_buffer_size: 512

ld6004:
  id: radar4
  uart_id: uart_radar

globals:
  - id: boots
    type: int
    restore_value: true
    initial_value: "0"

binary_sensor:
  - platform: ld6004
    ld6004_id: radar4
    target:
      name: Presence

sensor:
  - platform: ld6004
    ld6004_id: radar4
    target_count:
      name: Target Count
    point_count:
      name: Point Count
    target_1:
      x:
        name: T1 X

switch:
  - platform: ld6004
    ld6004_id: radar4
    point_cloud:
      id: sw_pc
      name: Point Cloud
    target_display:
      id: sw_td
      name: Target Display

interval:
  - interval: 10ms
    then:
      - lambda: ld6sim::mod.poll();

script:
  - id: gap
    then:
      - delay: 300ms
  - id: cases
    then:
      - lambda: |-
          id(boots) += 1;
          ESP_LOGI("ld6sim", "BOOT %d pc=%d td=%d", id(boots), (int) id(sw_pc).state, (int) id(sw_td).state);
      - lambda: |-
          ESP_LOGI("ld6sim", "CASE p1_defaults");
          ld6sim::mod.send("target x=1", ld6sim::targets_n(1, 1));
          std::vector<uint8_t> d; ld6sim::put_u(d, 5);
          ld6sim::mod.out(0x0A08, d);
      - delay: 600ms
      - switch.turn_on: sw_pc
      - delay: 600ms
      - lambda: |-
          ESP_LOGI("ld6sim", "CASE p2_pc_on");
          ld6sim::mod.send("target x=2", ld6sim::targets_n(1, 2));
          std::vector<uint8_t> d; ld6sim::put_u(d, 7);
          ld6sim::mod.out(0x0A08, d);
      - delay: 600ms
      - switch.turn_off: sw_td
      - delay: 600ms
      - lambda: |-
          ESP_LOGI("ld6sim", "CASE p3_td_off");
          ld6sim::mod.send("target x=3", ld6sim::targets_n(1, 3));
          std::vector<uint8_t> d; ld6sim::put_u(d, 8);
          ld6sim::mod.out(0x0A08, d);
      - delay: 600ms
      - switch.turn_on: sw_td
      - delay: 600ms
      - lambda: |-
          ESP_LOGI("ld6sim", "CASE p4_td_on");
          ld6sim::mod.send("target x=4", ld6sim::targets_n(1, 4));
          std::vector<uint8_t> d; ld6sim::put_u(d, 9);
          ld6sim::mod.out(0x0A08, d);
      - delay: 600ms
      - switch.turn_off: sw_pc
      - delay: 600ms
      - lambda: |-
          ESP_LOGI("ld6sim", "CASE p5_pc_off");
          ld6sim::mod.send("target x=5", ld6sim::targets_n(1, 5));
          std::vector<uint8_t> d; ld6sim::put_u(d, 11);
          ld6sim::mod.out(0x0A08, d);
      - delay: 600ms
      - lambda: ESP_LOGI("ld6sim", "CASE p6_set_for_reboot");
      - switch.turn_on: sw_pc
      - switch.turn_off: sw_td
      - delay: 3s
      - lambda: |-
          ESP_LOGI("ld6sim", "CASE done boot=%d", id(boots));
          if (id(boots) == 1) { global_preferences->sync(); App.safe_reboot(); }
