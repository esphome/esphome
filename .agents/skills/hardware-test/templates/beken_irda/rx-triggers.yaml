# Receive side triggers, merged into the receiver block of each build.
on_nec:
  then:
    - lambda: ESP_LOGI("irsim", "RX nec a=0x%04X c=0x%04X", x.address, x.command);
on_raw:
  then:
    - lambda: |-
        char buf[900];
        size_t pos = 0;
        for (size_t i = 0; i < x.size() && pos < sizeof(buf) - 12; i++)
          pos += snprintf(buf + pos, sizeof(buf) - pos, "%d,", (int) x[i]);
        buf[pos] = 0;
        if (x.size() >= 2)
          ESP_LOGI("irsim", "RX raw n=%u h=%d,%d", (unsigned) x.size(), (int) x[0], (int) x[1]);
        else
          ESP_LOGI("irsim", "RX raw n=%u", (unsigned) x.size());
        ESP_LOGI("irsim", "DUR %s", buf);
on_samsung:
  then:
    - lambda: ESP_LOGI("irsim", "RX samsung 0x%08llX", (unsigned long long) x.data);
on_sony:
  then:
    - lambda: ESP_LOGI("irsim", "RX sony 0x%X", (unsigned) x.data);
on_rc5:
  then:
    - lambda: ESP_LOGI("irsim", "RX rc5 a=0x%02X c=0x%02X", x.address, x.command);
on_lg:
  then:
    - lambda: ESP_LOGI("irsim", "RX lg 0x%08X", (unsigned) x.data);
on_panasonic:
  then:
    - lambda: ESP_LOGI("irsim", "RX panasonic a=0x%04X c=0x%08X", x.address, (unsigned) x.command);
on_jvc:
  then:
    - lambda: ESP_LOGI("irsim", "RX jvc 0x%04X", (unsigned) x.data);
