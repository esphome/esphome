esphome:
  name: cbp
  includes: [irsim.hpp, probe.hpp]
  on_boot:
    priority: -100
    then:
      - delay: 25s
      - lambda: probe::dump("boot");
      - lambda: irsim::claim(26);
      - lambda: probe::dump("claimed");
      - repeat:
          count: 5
          then:
            - lambda: |-
                ESP_LOGI("irsim", "TX nec a=0xEF00 c=0xF708 func_on");
                irsim::send(irsim::nec(0xEF00, 0xF708));
                probe::dump("after-func-on");
            - delay: 200ms
      - lambda: irsim::strip_func = true;
      - repeat:
          count: 5
          then:
            - lambda: |-
                ESP_LOGI("irsim", "TX nec a=0xEF00 c=0xF609 func_off");
                irsim::send(irsim::nec(0xEF00, 0xF609));
                *reinterpret_cast<volatile uint32_t *>(0x802800 + 26 * 4) = 0x48;
                probe::dump("after-func-off");
            - delay: 200ms
bk72xx:
  board: cb3s
api:
  reboot_timeout: 0s
logger:
  hardware_uart: UART1
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
beken_irda:
  pin: P26
  mode: hardware
  <<: !include rx-triggers-net.yaml
