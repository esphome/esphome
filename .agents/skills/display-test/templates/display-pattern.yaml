# Display test pattern: corner markers, centre reference and partial-update markers.
# Replace the display platform and pins with the driver under test.
esphome:
  name: display-pattern

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

spi:
  clk_pin: GPIO11
  mosi_pin: GPIO12

display:
  - platform: st7305
    id: test_display
    cs_pin: GPIO40
    dc_pin: GPIO5
    reset_pin: GPIO41
    update_interval: 1s
    auto_clear_enabled: false
    lambda: |-
      static int frame = 0;
      if (frame == 0) {
        it.fill(Color::WHITE);
        it.rectangle(0, 0, it.get_width(), it.get_height(), Color::BLACK);
        it.filled_rectangle(it.get_width() / 2 - 10, it.get_height() / 2 - 10, 20, 20, Color::BLACK);
      } else if (frame == 1) {
        it.filled_rectangle(20, 20, 60, 20, Color::BLACK);
        it.filled_rectangle(20, 50, 20, 20, Color::BLACK);
      } else if (frame == 2) {
        it.filled_rectangle(20, it.get_height() - 40, 60, 20, Color::BLACK);
      } else if (frame == 3) {
        it.filled_rectangle(it.get_width() - 80, 20, 60, 20, Color::BLACK);
      } else if (frame == 4) {
        it.filled_rectangle(it.get_width() - 80, it.get_height() - 40, 60, 20, Color::BLACK);
      }
      frame++;
