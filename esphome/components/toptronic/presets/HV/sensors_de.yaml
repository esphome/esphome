      - Aus, z.B. Standbybetrieb
      - "Normaler L\xFCftungsbetrieb"
      - VOC Modus aktiv
      - Feuchtigkeitsmodus aktiv
      - Frostschutz aktiv
      - CoolVet aktiv
      - Fehlerzustand
      - Sommerfeuchte
      - Ausschaltstop
