text_sensor:
  - platform: toptronic
    name: "Betriebswahl L\xFCftung"
    device_type: HV
    device_addr: ${TT_HV_addr}
    function_group: 50
    function_number: 0
    datapoint: 40650
    options:
      - Standby
      - Woche 1
      - Woche 2
      - Konstantbetrieb, Sollwert 40651
      - Sparbetrieb, Sollwert DAP40686
