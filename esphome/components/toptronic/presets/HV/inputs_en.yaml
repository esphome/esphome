select:
  - platform: toptronic
    name: Op. choice ventilation
    device_type: HV
    device_addr: ${TT_HV_addr}
    function_group: 50
    function_number: 0
    datapoint: 40650
    id: HV_50_0_40650_set
    options:
      - Standby
      - Week 1
      - Week 2
      - Constant operation, setpoint 40651
      - Eco mode, setpoint DAP40686
    values:
      - 0
      - 1
      - 2
      - 4
      - 5

  - platform: toptronic
    name: Party mode
    device_type: HV
    device_addr: ${TT_HV_addr}
    function_group: 50
    function_number: 0
    datapoint: 2010                  # 0x07DA duration register
    id: HV_party_mode_set
    type: U16
    icon: mdi:party-popper
    options:
      - "1h 100%"
      - "2h 100%"
      - "3h 100%"
      - "5h 100%"
      - "8h 100%"
      - "10h 100%"
    values:
      - 10
      - 20
      - 30
      - 50
      - 80
      - 100
