number:
  - platform: toptronic
    name: Normal ventilation modulation
    device_type: HV
    device_addr: ${TT_HV_addr}
    function_group: 50
    function_number: 0
    datapoint: 40651
    id: HV_50_0_40651_set
    type: U8
    min_value: 15
    max_value: 100
    step: 1
    decimal: 0
    unit_of_measurement: '%'
    icon: mdi:percent
    device_class: power_factor
  - platform: toptronic
    name: Eco ventilation modulation
    device_type: HV
    device_addr: ${TT_HV_addr}
    function_group: 50
    function_number: 0
    datapoint: 40686
    id: HV_50_0_40686_set
    type: U8
    min_value: 15
    max_value: 100
    step: 1
    decimal: 0
    unit_of_measurement: '%'
    icon: mdi:percent
    device_class: power_factor
  - platform: toptronic
    name: Humidity set value
    device_type: HV
    device_addr: ${TT_HV_addr}
    function_group: 50
    function_number: 0
    datapoint: 40687
    id: HV_50_0_40687_set
    type: U8
    min_value: 30
    max_value: 65
    step: 1
    decimal: 0
    unit_of_measurement: '%'
    icon: mdi:water-percent
