---
# LILYGO T5 4.7" Plus – Touchscreen Demo
#
# Touch the screen to move a black square to a random position.
# Further touches are ignored while the e-paper refresh (~4 s) is in progress.
#
# Paste this into the ESPHome UI, compile and flash via USB.
# No other setup required.

substitutions:
  device_name: lilygo-t547-touch-demo

esphome:
  name: ${device_name}
  on_boot:
    - priority: -100
      then:
        - lambda: |-
            id(is_refreshing) = true;
            id(display).update();
            id(is_refreshing) = false;

packages:
  board:
    url: https://github.com/hbast/esphome
    ref: feature_lilygo_t5_47_plus
    file: esphome/components/lilygo_t5_47_plus/board_config.yaml

external_components:
  - source:
      type: git
      url: https://github.com/hbast/esphome
      ref: feature_lilygo_t5_47_plus
    components: [lilygo_t5_47_plus]
    refresh: 1d

logger:
  hardware_uart: USB_SERIAL_JTAG

i2c:
  sda: GPIO18
  scl: GPIO17
  frequency: 400kHz

globals:
  - id: sq_x
    type: int
    initial_value: '440'
  - id: sq_y
    type: int
    initial_value: '230'
  - id: is_refreshing
    type: bool
    initial_value: 'false'

touchscreen:
  - platform: lilygo_t5_47_plus
    id: touch
    display: display
    update_interval: 50ms
    transform:
      swap_xy: true
      mirror_y: true
    on_touch:
      - lambda: |-
          if (id(is_refreshing)) return;
          id(is_refreshing) = true;
          id(sq_x) = esp_random() % (960 - 80);
          id(sq_y) = esp_random() % (540 - 80);
          ESP_LOGI("demo", "Touch at (%d, %d) -> square to (%d, %d)",
                   touch.x, touch.y, id(sq_x), id(sq_y));
          id(display).update();
          id(is_refreshing) = false;

display:
  - platform: lilygo_t5_47_plus
    id: display
    greyscale: false
    update_interval: never
    lambda: |-
      it.fill(COLOR_OFF);
      it.filled_rectangle(id(sq_x), id(sq_y), 80, 80, COLOR_ON);
