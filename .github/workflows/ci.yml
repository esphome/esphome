        with:
          # Need history for HEAD~1 to work for checking changed files
          fetch-depth: 2

      - name: Restore Python
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache-key: ${{ needs.common.outputs.cache-key }}

      - name: Cache ESP-IDF install
        uses: ./.github/actions/cache-esp-idf

      - name: Cache clang-tidy idedata
        uses: ./.github/actions/cache-clang-tidy-idedata
        with:
          environment: esp32-idf-tidy

      - name: Register problem matchers
        run: |
          echo "::add-matcher::.github/workflows/matchers/gcc.json"
          echo "::add-matcher::.github/workflows/matchers/clang-tidy.json"

      - name: Check if full clang-tidy scan needed
        id: check_full_scan
        run: |
          . venv/bin/activate
          # determine-jobs.clang-tidy-full-scan is true when core C++ or a
          # clang-tidy-relevant config file changed, or the ci-run-all label
          # forced --force-all.
          if [ "${{ needs.determine-jobs.outputs.clang-tidy-full-scan }}" = "true" ]; then
            echo "full_scan=true" >> $GITHUB_OUTPUT
            echo "reason=determine_jobs" >> $GITHUB_OUTPUT
          else
            echo "full_scan=false" >> $GITHUB_OUTPUT
            echo "reason=normal" >> $GITHUB_OUTPUT
          fi

      - name: Run clang-tidy
        run: |
          . venv/bin/activate
          if [ "${{ steps.check_full_scan.outputs.full_scan }}" = "true" ]; then
            echo "Running FULL clang-tidy scan (reason: ${{ steps.check_full_scan.outputs.reason }})"
            script/clang-tidy --all-headers --fix --environment esp32-idf-tidy
          else
            echo "Running clang-tidy on changed files only"
            script/clang-tidy --all-headers --fix --changed --environment esp32-idf-tidy
          fi
        env:
          # Also cache libdeps, store them in a ~/.platformio subfolder
          PLATFORMIO_LIBDEPS_DIR: ~/.platformio/libdeps

      - name: Prune ESP-IDF install before cache save
        if: (github.ref == 'refs/heads/dev' || contains(github.event.pull_request.labels.*.name, 'ci-cache-write'))
        uses: ./.github/actions/prune-esp-idf

      - name: Suggested changes
        run: script/ci-suggest-changes
        if: always()

  clang-tidy-split:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs:
      - common
      - determine-jobs
    if: needs.determine-jobs.outputs.clang-tidy-mode == 'split'
    env:
      GH_TOKEN: ${{ github.token }}
      # esp32-idf-tidy installs ESP-IDF natively; share the native IDF cache.
      ESPHOME_ESP_IDF_PREFIX: ~/.esphome-idf
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: clang-tidy
            name: Run script/clang-tidy for ESP32 IDF 1/5
            options: --environment esp32-idf-tidy --split-num 5 --split-at 1
          - id: clang-tidy
            name: Run script/clang-tidy for ESP32 IDF 2/5
            options: --environment esp32-idf-tidy --split-num 5 --split-at 2
          - id: clang-tidy
            name: Run script/clang-tidy for ESP32 IDF 3/5
            options: --environment esp32-idf-tidy --split-num 5 --split-at 3
          - id: clang-tidy
            name: Run script/clang-tidy for ESP32 IDF 4/5
            options: --environment esp32-idf-tidy --split-num 5 --split-at 4
          - id: clang-tidy
            name: Run script/clang-tidy for ESP32 IDF 5/5
            options: --environment esp32-idf-tidy --split-num 5 --split-at 5

    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need history for HEAD~1 to work for checking changed files
          fetch-depth: 2

      - name: Restore Python
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache-key: ${{ needs.common.outputs.cache-key }}

      - name: Cache ESP-IDF install
        uses: ./.github/actions/cache-esp-idf

      - name: Cache clang-tidy idedata
        uses: ./.github/actions/cache-clang-tidy-idedata
        with:
          environment: esp32-idf-tidy

      - name: Register problem matchers
        run: |
          echo "::add-matcher::.github/workflows/matchers/gcc.json"
          echo "::add-matcher::.github/workflows/matchers/clang-tidy.json"

      - name: Check if full clang-tidy scan needed
        id: check_full_scan
        run: |
          . venv/bin/activate
          # determine-jobs.clang-tidy-full-scan is true when core C++ or a
          # clang-tidy-relevant config file changed, or the ci-run-all label
          # forced --force-all.
          if [ "${{ needs.determine-jobs.outputs.clang-tidy-full-scan }}" = "true" ]; then
            echo "full_scan=true" >> $GITHUB_OUTPUT
            echo "reason=determine_jobs" >> $GITHUB_OUTPUT
          else
            echo "full_scan=false" >> $GITHUB_OUTPUT
            echo "reason=normal" >> $GITHUB_OUTPUT
          fi

      - name: Run clang-tidy
        run: |
          . venv/bin/activate
          if [ "${{ steps.check_full_scan.outputs.full_scan }}" = "true" ]; then
            echo "Running FULL clang-tidy scan (reason: ${{ steps.check_full_scan.outputs.reason }})"
            script/clang-tidy --all-headers --fix ${{ matrix.options }}
          else
            echo "Running clang-tidy on changed files only"
            script/clang-tidy --all-headers --fix --changed ${{ matrix.options }}
          fi
        env:
          # Also cache libdeps, store them in a ~/.platformio subfolder
          PLATFORMIO_LIBDEPS_DIR: ~/.platformio/libdeps

      - name: Prune ESP-IDF install before cache save
        if: (github.ref == 'refs/heads/dev' || contains(github.event.pull_request.labels.*.name, 'ci-cache-write'))
        uses: ./.github/actions/prune-esp-idf

      - name: Suggested changes
        run: script/ci-suggest-changes
        if: always()

  clang-tidy-esp32-variants:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs:
      - common
      - determine-jobs
    if: needs.determine-jobs.outputs.clang-tidy == 'true'
    env:
      GH_TOKEN: ${{ github.token }}
      # The variant tidy envs install ESP-IDF natively; share the native IDF cache.
      ESPHOME_ESP_IDF_PREFIX: ~/.esphome-idf
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: clang-tidy
            name: Run script/clang-tidy for ESP32 S3
            # yamllint disable-line rule:line-length
            options: --environment esp32s3-idf-tidy --grep SOC_TEMP_SENSOR_SUPPORTED --grep SOC_RISCV_COPROC_SUPPORTED --grep USE_ESP32_VARIANT_ESP32S3 --grep USE_LOGGER_USB_CDC --grep SOC_I2S_SUPPORTS_TDM --grep USE_OPENTHREAD
            tidy_environment: esp32s3-idf-tidy
          - id: clang-tidy
            name: Run script/clang-tidy for ESP32 P4
            # P4 has no native Wi-Fi/BLE; those run over the hosted co-processor,
            # so their code paths differ -- lint them under the P4 build too.
            # yamllint disable-line rule:line-length
            options: --environment esp32p4-idf-tidy --grep USE_ESP32_VARIANT_ESP32P4 --grep SOC_LP_CORE_SUPPORTED --grep CONFIG_IDF_TARGET_ESP32P4 --grep USE_ESP32_HOSTED --grep USE_WIFI --grep USE_BLE
            tidy_environment: esp32p4-idf-tidy
          - id: clang-tidy
            name: Run script/clang-tidy for ESP32 C6
            # yamllint disable-line rule:line-length
            options: --environment esp32c6-idf-tidy --grep SOC_LP_I2C_SUPPORTED --grep SOC_LP_CORE_SUPPORTED --grep USE_ESP32_VARIANT_ESP32C6 --grep USE_OPENTHREAD --grep USE_ZIGBEE
            tidy_environment: esp32c6-idf-tidy

    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need history for HEAD~1 to work for checking changed files
          fetch-depth: 2

      - name: Restore Python
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache-key: ${{ needs.common.outputs.cache-key }}

      - name: Cache ESP-IDF install
        uses: ./.github/actions/cache-esp-idf

      - name: Cache clang-tidy idedata
        uses: ./.github/actions/cache-clang-tidy-idedata
        with:
          environment: ${{ matrix.tidy_environment }}

      - name: Register problem matchers
        run: |
          echo "::add-matcher::.github/workflows/matchers/gcc.json"
          echo "::add-matcher::.github/workflows/matchers/clang-tidy.json"

      - name: Check if full clang-tidy scan needed
        id: check_full_scan
        run: |
          . venv/bin/activate
          # determine-jobs.clang-tidy-full-scan is true when core C++ or a
          # clang-tidy-relevant config file changed, or the ci-run-all label
          # forced --force-all.
          if [ "${{ needs.determine-jobs.outputs.clang-tidy-full-scan }}" = "true" ]; then
            echo "full_scan=true" >> $GITHUB_OUTPUT
            echo "reason=determine_jobs" >> $GITHUB_OUTPUT
          else
            echo "full_scan=false" >> $GITHUB_OUTPUT
            echo "reason=normal" >> $GITHUB_OUTPUT
          fi

      - name: Run clang-tidy
        # Limited variant scan: only the files carrying that variant's code paths
        # (no --all-headers; the comprehensive esp32-idf pass covers the shared tree).
        run: |
          . venv/bin/activate
          if [ "${{ steps.check_full_scan.outputs.full_scan }}" = "true" ]; then
            echo "Running FULL clang-tidy scan (reason: ${{ steps.check_full_scan.outputs.reason }})"
            script/clang-tidy --fix ${{ matrix.options }}
          else
            echo "Running clang-tidy on changed files only"
            script/clang-tidy --fix --changed ${{ matrix.options }}
          fi

      - name: Prune ESP-IDF install before cache save
        if: (github.ref == 'refs/heads/dev' || contains(github.event.pull_request.labels.*.name, 'ci-cache-write'))
        uses: ./.github/actions/prune-esp-idf

      - name: Suggested changes
        run: script/ci-suggest-changes
        if: always()

  test-build-components-split:
    name: Test components batch (${{ matrix.batch.components }})
    runs-on: ubuntu-24.04
    needs:
      - common
      - determine-jobs
    if: github.event_name == 'pull_request' && fromJSON(needs.determine-jobs.outputs.component-test-count) > 0
    env:
      # esp32 component builds use the native ESP-IDF toolchain (default), so
      # share the tidy jobs' install location -- the restore below lands here.
      ESPHOME_ESP_IDF_PREFIX: ~/.esphome-idf
      # nrf52 component builds install sdk-nrf natively; pin it to the shared
      # cacheable path so the restore below lands where the build looks.
      ESPHOME_SDK_NRF_PREFIX: ~/.esphome-sdk-nrf
    strategy:
      fail-fast: false
      matrix:
        batch: ${{ fromJson(needs.determine-jobs.outputs.component-test-batches) }}
    steps:
      - name: Show disk space
        run: |
          echo "Available disk space:"
          df -h

      - name: List components
        run: echo ${{ matrix.batch.components }}

      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install apt packages (cached)
        # A cache hit (seeded on dev by seed-apt-cache) never touches apt,
        # so mirror outages cannot hang this PR-only job; the timeout bounds
        # the cold path. The action has no --no-install-recommends; same
        # package set this job used before #17463.
        timeout-minutes: 10
        uses: ./.github/actions/apt-packages
      - name: Restore Python
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache-key: ${{ needs.common.outputs.cache-key }}
      - name: Cache ESP-IDF install (restore-only)
        # Only batches whose test platforms include esp32 need the native
        # ESP-IDF install; never save -- just reuse the shared install the
        # dev tidy jobs already cached when present.
        if: matrix.batch.needs_idf
        uses: ./.github/actions/cache-esp-idf
        with:
          restore-only: true
      - name: Cache nRF Connect SDK install (restore-only)
        # Only batches whose test platforms include nrf52 need the native
        # sdk-nrf install; never save -- just reuse the shared install the
        # dev nrf52 tidy job cached when present.
        if: matrix.batch.needs_nrf
        uses: ./.github/actions/cache-sdk-nrf
        with:
          restore-only: true
      - name: Cache the native ESP8266 toolchain
        # Only batches whose test platforms include esp8266; never saves
        # here, it reuses the install the dev seed job cached.
        if: matrix.batch.needs_arduino8266
        uses: ./.github/actions/cache-arduino8266
      - name: Validate and compile components with intelligent grouping
        run: |
          . venv/bin/activate

          # Check if /mnt has more free space than / before bind mounting
          # Extract available space in KB for comparison
          root_avail=$(df -k / | awk 'NR==2 {print $4}')
          mnt_avail=$(df -k /mnt 2>/dev/null | awk 'NR==2 {print $4}')

          echo "Available space: / has ${root_avail}KB, /mnt has ${mnt_avail}KB"

          # Only use /mnt if it has more space than /
          if [ -n "$mnt_avail" ] && [ "$mnt_avail" -gt "$root_avail" ]; then
            echo "Using /mnt for build files (more space available)"
            # Bind mount PlatformIO directory to /mnt (tools, packages, build cache all go there)
            sudo mkdir -p /mnt/platformio
            sudo chown $USER:$USER /mnt/platformio
            mkdir -p ~/.platformio
            sudo mount --bind /mnt/platformio ~/.platformio

            # Bind mount test build directory to /mnt
            sudo mkdir -p /mnt/test_build_components_build
            sudo chown $USER:$USER /mnt/test_build_components_build
            mkdir -p tests/test_build_components/build
            sudo mount --bind /mnt/test_build_components_build tests/test_build_components/build
          else
            echo "Using / for build files (more space available than /mnt or /mnt unavailable)"
          fi

          # Convert space-separated components to comma-separated for Python script
          components_csv=$(echo "${{ matrix.batch.components }}" | tr ' ' ',')

          # Only isolate directly changed components when targeting dev branch
          # For beta/release branches, group everything for faster CI
          #
          # WHY ISOLATE DIRECTLY CHANGED COMPONENTS?
          # - Isolated tests run WITHOUT --testing-mode, enabling full validation
          # - This catches pin conflicts and other issues in directly changed code
          # - Grouped tests use --testing-mode to allow config merging (disables some checks)
          # - Dependencies are safe to group since they weren't modified in this PR
          if [[ "${{ needs.determine-jobs.outputs.release-pr }}" == "true" ]]; then
            directly_changed_csv=""
            echo "Testing components: $components_csv"
            echo "Target branch: ${{ github.base_ref }} - grouping all components"
          else
            directly_changed_csv=$(echo '${{ needs.determine-jobs.outputs.directly-changed-components-with-tests }}' | jq -r 'join(",")')
            echo "Testing components: $components_csv"
            echo "Target branch: ${{ github.base_ref }} - isolating directly changed components: $directly_changed_csv"
          fi
          echo ""

          # Show disk space before validation
          echo "Disk space before config validation:"
          df -h
          echo ""

          # Run config validation with grouping and isolation
          python3 script/test_build_components.py -e config -c "$components_csv" -f --isolate "$directly_changed_csv"

          echo ""
          echo "Config validation passed! Starting compilation..."
          echo ""

          # Compute the compile-stage component list. Components whose only
          # changes are validate.*.yaml files are config-only -- their source
          # and test fixtures didn't move, so rebuilding firmware adds no
          # signal. Subtract them from this batch before invoking compile.
          validate_only_json='${{ needs.determine-jobs.outputs.validate-only-components }}'
          if [ -z "$validate_only_json" ]; then
            validate_only_json='[]'
          fi
          if ! validate_only_csv=$(echo "$validate_only_json" | jq -r 'join(",")'); then
            echo "::error::Failed to render validate-only-components as CSV from: $validate_only_json"
            exit 1
          fi
          if [ -z "$validate_only_csv" ]; then
            compile_csv="$components_csv"
          else
            components_sorted=$(echo "$components_csv" | tr ',' '\n' | sort -u)
            validate_sorted=$(echo "$validate_only_csv" | tr ',' '\n' | sort -u)
            if ! diff_out=$(comm -23 <(echo "$components_sorted") <(echo "$validate_sorted")); then
              echo "::error::Failed to compute compile component subset."
              exit 1
            fi
            compile_csv=$(echo "$diff_out" | paste -sd ',' -)
            skipped=$(comm -12 <(echo "$components_sorted") <(echo "$validate_sorted") | paste -sd ',' -)
            if [ -n "$skipped" ]; then
              echo "Validate-only components in this batch (skipping compile): $skipped"
            fi
          fi

          # Show disk space before compilation
          echo "Disk space before compilation:"
          df -h
          echo ""

          if [ -n "$compile_csv" ]; then
            # Run compilation with grouping and isolation
            # The bootloader has no ESPHome code and these builds never
            # flash; the check_idf_py batch keeps the full build so the
            # native sub-build and the equivalence check stay covered.
            skip_flag="--skip-bootloader"
            if [[ "${{ matrix.batch.check_idf_py }}" == "true" ]]; then
              skip_flag=""
            fi
            python3 script/test_build_components.py -e compile -c "$compile_csv" -f --isolate "$directly_changed_csv" $skip_flag
            if [[ "${{ matrix.batch.check_idf_py }}" == "true" ]]; then
              # The real idf.py must find nothing to configure or build in a
              # tree built above; catches drift on ESP-IDF bumps.
              echo "Checking the native ESP-IDF build matches idf.py"
              python3 script/check_idf_py_equivalence.py
            fi
          else
            echo "All components in this batch are validate-only -- skipping compile stage."
            if [[ "${{ matrix.batch.check_idf_py }}" == "true" ]]; then
              # determine-jobs and this step disagree on what compiles; fail
              # rather than let the check run nowhere.
              echo "::error::This batch was picked for the idf.py check but compiled nothing"
              exit 1
            fi
          fi

      - name: Print ccache statistics
        # esphome stores the cache under the IDF tools path; expand the leading
        # ~ in ESPHOME_ESP_IDF_PREFIX so ccache reads the dir the build used.
        run: CCACHE_DIR="${ESPHOME_ESP_IDF_PREFIX/#\~/$HOME}/ccache" ccache -s

  test-esp32-platformio:
    name: Test esp32 components with PlatformIO
    runs-on: ubuntu-24.04
    needs:
      - common
      - determine-jobs
    if: github.event_name == 'pull_request' && needs.determine-jobs.outputs.esp32-platformio == 'true'
    env:
      # Comma-joined subset of the esp32 PlatformIO representative component list,
      # computed by script/determine-jobs.py (esp32_platformio_components_to_test).
      # Single source of truth -- the full list lives in
      # script/determine-jobs.py::ESP32_PLATFORMIO_TEST_COMPONENTS.
      TEST_COMPONENTS: ${{ needs.determine-jobs.outputs.esp32-platformio-components }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Python
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache-key: ${{ needs.common.outputs.cache-key }}

      - name: Run PlatformIO compile test
        run: |
          . venv/bin/activate

          echo "Testing components: $TEST_COMPONENTS"
          echo ""

          # compile validates config first, so a separate config pass is
          # redundant for this smoke test. ESP-IDF framework via PlatformIO:
          python3 script/test_build_components.py -e compile -t esp32-idf -c "$TEST_COMPONENTS" -f --toolchain platformio --fail-on-no-tests

          echo ""
          echo "ESP-IDF-via-PlatformIO build passed! Starting Arduino smoke test..."
          echo ""

          # Arduino framework via PlatformIO (only components with an esp32-ard test are built):
          python3 script/test_build_components.py -e compile -t esp32-ard -c "$TEST_COMPONENTS" -f --toolchain platformio

  test-esp8266-native:
    name: Test esp8266 components with the native toolchain
    runs-on: ubuntu-24.04
    needs:
      - common
      - determine-jobs
    if: github.event_name == 'pull_request' && needs.determine-jobs.outputs.esp8266-native == 'true'
    env:
      # Computed by script/determine-jobs.py (ESP8266_NATIVE_TEST_COMPONENTS)
      TEST_COMPONENTS: ${{ needs.determine-jobs.outputs.esp8266-native-components }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Python
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache-key: ${{ needs.common.outputs.cache-key }}

      - name: Cache the native toolchain
        uses: ./.github/actions/cache-arduino8266

      - name: Run native toolchain compile test
        run: |
          . venv/bin/activate

          echo "Testing components: $TEST_COMPONENTS"
          echo ""

          # ESP8266 Arduino built directly (no PlatformIO); compile validates
          # config first, so a separate config pass is redundant.
          python3 script/test_build_components.py -e compile -t esp8266-ard -c "$TEST_COMPONENTS" -f --toolchain arduino --fail-on-no-tests

  test-windows:
    name: Compile ${{ matrix.target }} with ${{ matrix.toolchain }} on Windows (ccache ${{ matrix.ccache }})
    runs-on: windows-latest
    needs:
      - common
      - determine-jobs
    if: github.event_name == 'pull_request' && needs.determine-jobs.outputs.windows-build-matrix != '[]'
    # A hung compiler must fail the job, not hold the runner for six hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # One leg per build path ESPHome ships on Windows; the list comes from
        # script/determine-jobs.py (WINDOWS_BUILD_LEGS), which also decides
        # which legs a change needs. No toolchain is cached: every leg installs
        # its own from scratch, as a fresh Windows machine does.
        include: ${{ fromJson(needs.determine-jobs.outputs.windows-build-matrix) }}
    env:
      # ESPHOME_CCACHE_ENABLE stays unset: the build must detect ccache on
      # PATH by itself, as it does for ESPHome Desktop and a pip install
      # The test script prints characters the cp1252 console cannot encode
      PYTHONUTF8: "1"
      # The exact static build ESPHome Desktop ships
      CCACHE_URL: https://github.com/ccache/ccache/releases/download/v4.14/ccache-4.14-windows-x86_64.zip
      CCACHE_SHA256: 2568347a697e103ca1b073981c704ad76fb2507d066c38dba038dd73399d968f
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Python
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache-key: ${{ needs.common.outputs.cache-key }}

      - name: Install ccache
        if: matrix.ccache == '1'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "ccache"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $zip = Join-Path $dir "ccache.zip"
          Invoke-WebRequest -Uri $env:CCACHE_URL -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne $env:CCACHE_SHA256) {
            Write-Host "::error::ccache archive sha256 $hash does not match $env:CCACHE_SHA256"
            exit 1
          }
          Expand-Archive -Path $zip -DestinationPath $dir
          $bin = Get-ChildItem -Path $dir -Recurse -Filter ccache.exe | Select-Object -First 1
          Add-Content -Path $env:GITHUB_PATH -Value $bin.DirectoryName
          & $bin.FullName --version

      - name: Take any ccache off PATH
        if: matrix.ccache == '0'
        shell: pwsh
        # The runner image ships one with Strawberry Perl; this leg is the build of a machine without
        run: |
          $path = $env:PATH
          for ($i = 0; $i -lt 5; $i++) {
            $found = Get-Command ccache -ErrorAction SilentlyContinue
            if (-not $found) { break }
            $dir = Split-Path $found.Source
            Write-Host "Taking $dir off PATH for $($found.Source)"
            $path = ($path -split ';' | Where-Object { $_ -ne $dir }) -join ';'
            $env:PATH = $path
          }
          if (Get-Command ccache -ErrorAction SilentlyContinue) {
            Write-Host "::error::a ccache is still on PATH"
            exit 1
          }
          "PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Show disk space
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}}, @{n='UsedGB';e={[math]::Round($_.Used/1GB,1)}}

      - name: Compile
        shell: pwsh
        # One base config per leg; the toolchain install is part of the timed run
        run: |
          if ("${{ matrix.ccache }}" -eq "0" -and (Get-Command ccache -ErrorAction SilentlyContinue)) {
            Write-Host "::error::a ccache is on PATH; this leg builds without one"
            exit 1
          }
          . .\venv\Scripts\Activate.ps1
          if ("${{ matrix.idf_target }}") {
            # Only the chip this leg builds; CI otherwise installs every toolchain
            $env:ESPHOME_IDF_DEFAULT_TARGETS = "${{ matrix.idf_target }}"
          }
          $arguments = "script/test_build_components.py", "-e", "compile", "-t", "${{ matrix.target }}", "-c", "${{ matrix.component }}", "--base-only", "--toolchain", "${{ matrix.toolchain }}", "--fail-on-no-tests"
          $p = Start-Process -FilePath python -ArgumentList $arguments -NoNewWindow -PassThru
          # Reading the handle keeps ExitCode available after the process exits
          $null = $p.Handle
          if (-not $p.WaitForExit(50 * 60 * 1000)) {
            Write-Host "::error::The compile did not finish in 50 minutes; processes still running:"
            Get-CimInstance Win32_Process |
              Where-Object { $_.CommandLine -match 'xtensa|riscv|arm-|ccache|ninja|cmake|west|platformio|pio|esphome' } |
              Select-Object ProcessId, ParentProcessId, CreationDate, CommandLine |
              Format-List | Out-String -Width 4096 | Write-Host
            Get-Process |
              Where-Object { $_.Name -match 'cc1|ccache|ninja|cmake|xtensa|riscv|arm-|python' } |
              Select-Object Id, Name, CPU, WorkingSet64 |
              Format-Table | Out-String | Write-Host
            taskkill /PID $p.Id /T /F
            exit 1
          }
          exit $p.ExitCode

      - name: Show ccache statistics
        # Also after a failed or killed compile: the counters say whether
        # ccache was ever reached
        if: always() && matrix.ccache == '1'
        shell: pwsh
        # The stores live under ESPHome's tools cache (tools_cache_path() in
        # build_helpers/tools_cache.py), each native build's next to its
        # install. A passing compile that never called ccache is a bug in the
        # build's ccache wiring, not a pass.
        run: |
          $cache = Join-Path $env:LOCALAPPDATA "esphome\Cache"
          $env:CCACHE_DIR = switch ("${{ matrix.toolchain }}") {
            "arduino" { Join-Path $cache "arduino8266\ccache" }
            "esp-idf" { Join-Path $cache "idf\ccache" }
            "sdk-nrf" { Join-Path $cache "sdk-nrf\ccache" }
            "platformio" { Join-Path $cache "platformio-ccache" }
          }
          ccache -s
          # Cacheable calls = hits + misses; the tab-separated keys do not change between locales
          $calls = 0
          foreach ($line in (ccache --print-stats)) {
            $key, $value = $line -split "`t"
            if ($key -in "direct_cache_hit", "preprocessed_cache_hit", "cache_miss") {
              $calls += [int]$value
            }
          }
          if ($calls -eq 0) {
            Write-Host "::error::ccache was never called by the compile"
            exit 1
          }

  device-builder:
    name: Test downstream esphome/device-builder
    runs-on: ubuntu-24.04
    needs:
      - common
      - determine-jobs
    if: needs.determine-jobs.outputs.device-builder == 'true'
    steps:
      - name: Check out esphome (this PR)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: esphome
      - name: Check out esphome/device-builder
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: esphome/device-builder
          ref: main
          path: device-builder
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Set up uv
        # Mirrors the install shape device-builder's own CI uses
        # (esphome/device-builder#192): uv replaces pip for the
        # install step (order-of-magnitude faster on cold boots,
        # with its own wheel cache). actions/setup-python still
        # provides the interpreter.
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          # Pull request saves land in per-PR scopes nothing else can
          # reuse; dev pushes seed the shared copy instead.
          save-cache: ${{ github.event_name != 'pull_request' }}
          # Pin uv version so the action does not have to fetch the
          # manifest from raw.githubusercontent.com on every cache
          # miss; that fetch flakes on Windows runners.
          version: "0.11.15"
      - name: Install device-builder + esphome from PR
        # Install device-builder with its esphome + test extras
        # first so its pinned versions of pytest/etc. land, then
        # overlay the PR's esphome so the downstream tests run
        # against this PR's Python code. ``--system`` installs into
        # the runner's Python instead of a venv.
        run: |
          uv pip install --system -e './device-builder[esphome,test]'
          uv pip install --system -e ./esphome
      - name: Run device-builder pytest
        # ``-n auto`` runs under pytest-xdist (matches device-builder's
        # own CI). No ``--cov`` here -- this is purely a downstream
        # smoke check against this PR's esphome code. ``tests/e2e/slow``
        # is excluded: those are real multi-minute toolchain compiles
        # (LibreTiny SDK clone, native ESP-IDF install) that device-builder
        # runs in its own dedicated jobs, not this smoke check.
        working-directory: device-builder
        run: pytest -q -n auto --maxfail=5 --durations=30 --no-cov --ignore=tests/benchmarks --ignore=tests/e2e/slow

  memory-impact-target-branch:
    name: Build target branch for memory impact
    runs-on: ubuntu-24.04
    needs:
      - common
      - determine-jobs
    if: github.event_name == 'pull_request' && fromJSON(needs.determine-jobs.outputs.memory_impact).should_run == 'true'
    outputs:
      ram_usage: ${{ steps.extract.outputs.ram_usage }}
      flash_usage: ${{ steps.extract.outputs.flash_usage }}
      cache_hit: ${{ steps.cache-memory-analysis.outputs.cache-hit }}
      skip: ${{ steps.check-script.outputs.skip || steps.check-tests.outputs.skip }}
    steps:
      - name: Check out target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.base_ref }}

      # Check if memory impact extraction script exists on target branch
      # If not, skip the analysis (this handles older branches that don't have the feature)
      - name: Check for memory impact script
        id: check-script
        run: |
          if [ -f "script/ci_memory_impact_extract.py" ]; then
            echo "skip=false" >> $GITHUB_OUTPUT
          else
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::ci_memory_impact_extract.py not found on target branch, skipping memory impact analysis"
          fi

      # The build below uses --base-only, so skip unless the target branch has
      # test.<platform>.yaml for every requested component (test-*.yaml
      # variants alone compile nothing, and a partial set would compare a
      # smaller target build against the PR build). Checked here, not in
      # determine-jobs.py, because determine-jobs runs on the PR branch and
      # cannot see the target branch.
      - name: Check for test files on target branch
        id: check-tests
        if: steps.check-script.outputs.skip != 'true'
        run: |
          components='${{ toJSON(fromJSON(needs.determine-jobs.outputs.memory_impact).components) }}'
          platform="${{ fromJSON(needs.determine-jobs.outputs.memory_impact).platform }}"
          missing=""
          for component in $(echo "$components" | jq -r '.[]'); do
            if [ ! -f "tests/components/${component}/test.${platform}.yaml" ]; then
              missing="${missing} ${component}"
            fi
          done
          if [ -n "$missing" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "::warning::No test.${platform}.yaml on target branch for${missing}, skipping memory impact analysis"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # All remaining steps only run if script and tests exist
      - name: Generate cache key
        id: cache-key
        if: steps.check-script.outputs.skip != 'true' && steps.check-tests.outputs.skip != 'true'
        run: |
          # Get the commit SHA of the target branch
          target_sha=$(git rev-parse HEAD)

          # Hash the build infrastructure files (all files that affect build/analysis)
          infra_hash=$(cat \
            script/test_build_components.py \
            script/ci_memory_impact_extract.py \
            script/analyze_component_buses.py \
            script/merge_component_configs.py \
            script/ci_helpers.py \
            .github/workflows/ci.yml \
            | sha256sum | cut -d' ' -f1)

          # Get platform and components from job inputs
          platform="${{ fromJSON(needs.determine-jobs.outputs.memory_impact).platform }}"
          components='${{ toJSON(fromJSON(needs.determine-jobs.outputs.memory_impact).components) }}'
          components_hash=$(echo "$components" | sha256sum | cut -d' ' -f1)

          # Combine into cache key
          cache_key="memory-analysis-target-${target_sha}-${infra_hash}-${platform}-${components_hash}"
          echo "cache-key=${cache_key}" >> $GITHUB_OUTPUT
          echo "Cache key: ${cache_key}"

      - name: Restore cached memory analysis
        id: cache-memory-analysis
        if: steps.check-script.outputs.skip != 'true' && steps.check-tests.outputs.skip != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: memory-analysis-target.json
          key: ${{ steps.cache-key.outputs.cache-key }}

      - name: Cache status
        if: steps.check-script.outputs.skip != 'true' && steps.check-tests.outputs.skip != 'true'
        run: |
          if [ "${{ steps.cache-memory-analysis.outputs.cache-hit }}" == "true" ]; then
            echo "✓ Cache hit! Using cached memory analysis results."
            echo "  Skipping build step to save time."
          else
            echo "✗ Cache miss. Will build and analyze memory usage."
          fi

      - name: Restore Python
        if: steps.check-script.outputs.skip != 'true' && steps.check-tests.outputs.skip != 'true' && steps.cache-memory-analysis.outputs.cache-hit != 'true'
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache-key: ${{ needs.common.outputs.cache-key }}

      - name: Cache the native ESP8266 toolchain
        if: steps.check-script.outputs.skip != 'true' && steps.check-tests.outputs.skip != 'true' && steps.cache-memory-analysis.outputs.cache-hit != 'true' && fromJSON(needs.determine-jobs.outputs.memory_impact).needs_arduino8266
        uses: ./.github/actions/cache-arduino8266

      - name: Build, compile, and analyze memory
        if: steps.check-script.outputs.skip != 'true' && steps.check-tests.outputs.skip != 'true' && steps.cache-memory-analysis.outputs.cache-hit != 'true'
        id: build
        run: |
          . venv/bin/activate
          components='${{ toJSON(fromJSON(needs.determine-jobs.outputs.memory_impact).components) }}'
          platform="${{ fromJSON(needs.determine-jobs.outputs.memory_impact).platform }}"

          echo "Building with test_build_components.py for $platform with components:"
          echo "$components" | jq -r '.[]' | sed 's/^/  - /'

          # Use test_build_components.py which handles grouping automatically
          # Pass components as comma-separated list
          component_list=$(echo "$components" | jq -r 'join(",")')

          echo "Compiling with test_build_components.py..."

          # Run build and extract memory with auto-detection of build directory for detailed analysis
          # Use tee to show output in CI while also piping to extraction script
          python script/test_build_components.py \
            -e compile \
            -c "$component_list" \
            -t "$platform" \
            --base-only 2>&1 | \
            tee /dev/stderr | \
            python script/ci_memory_impact_extract.py \
              --output-env \
              --output-json memory-analysis-target.json

          # Add metadata to JSON before caching
          python script/ci_add_metadata_to_json.py \
            --json-file memory-analysis-target.json \
            --components "$components" \
            --platform "$platform"

      - name: Save memory analysis to cache
        if: steps.check-script.outputs.skip != 'true' && steps.check-tests.outputs.skip != 'true' && steps.cache-memory-analysis.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: memory-analysis-target.json
          key: ${{ steps.cache-key.outputs.cache-key }}

      - name: Extract memory usage for outputs
        id: extract
        if: steps.check-script.outputs.skip != 'true' && steps.check-tests.outputs.skip != 'true'
        run: |
          if [ -f memory-analysis-target.json ]; then
            ram=$(jq -r '.ram_bytes' memory-analysis-target.json)
            flash=$(jq -r '.flash_bytes' memory-analysis-target.json)
            echo "ram_usage=${ram}" >> $GITHUB_OUTPUT
            echo "flash_usage=${flash}" >> $GITHUB_OUTPUT
            echo "RAM: ${ram} bytes, Flash: ${flash} bytes"
          else
            echo "Error: memory-analysis-target.json not found"
            exit 1
          fi

      - name: Upload memory analysis JSON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-analysis-target
          path: memory-analysis-target.json
          if-no-files-found: warn
          retention-days: 1

  memory-impact-pr-branch:
    name: Build PR branch for memory impact
    runs-on: ubuntu-24.04
    needs:
      - common
      - determine-jobs
    if: github.event_name == 'pull_request' && fromJSON(needs.determine-jobs.outputs.memory_impact).should_run == 'true'
    outputs:
      ram_usage: ${{ steps.extract.outputs.ram_usage }}
      flash_usage: ${{ steps.extract.outputs.flash_usage }}
    steps:
      - name: Check out PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore Python
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache-key: ${{ needs.common.outputs.cache-key }}
      - name: Cache the native ESP8266 toolchain
        if: fromJSON(needs.determine-jobs.outputs.memory_impact).needs_arduino8266
        uses: ./.github/actions/cache-arduino8266
      - name: Build, compile, and analyze memory
        id: extract
        run: |
          . venv/bin/activate
          components='${{ toJSON(fromJSON(needs.determine-jobs.outputs.memory_impact).components) }}'
          platform="${{ fromJSON(needs.determine-jobs.outputs.memory_impact).platform }}"

          echo "Building with test_build_components.py for $platform with components:"
          echo "$components" | jq -r '.[]' | sed 's/^/  - /'

          # Use test_build_components.py which handles grouping automatically
          # Pass components as comma-separated list
          component_list=$(echo "$components" | jq -r 'join(",")')

          echo "Compiling with test_build_components.py..."

          # Run build and extract memory with auto-detection of build directory for detailed analysis
          # Use tee to show output in CI while also piping to extraction script
          python script/test_build_components.py \
            -e compile \
            -c "$component_list" \
            -t "$platform" \
            --base-only 2>&1 | \
            tee /dev/stderr | \
            python script/ci_memory_impact_extract.py \
              --output-env \
              --output-json memory-analysis-pr.json

          # Add metadata to JSON (components and platform are in shell variables above)
          python script/ci_add_metadata_to_json.py \
            --json-file memory-analysis-pr.json \
            --components "$components" \
            --platform "$platform"

      - name: Upload memory analysis JSON
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: memory-analysis-pr
          path: memory-analysis-pr.json
          if-no-files-found: warn
          retention-days: 1

  memory-impact-comment:
    name: Comment memory impact
    runs-on: ubuntu-24.04
    needs:
      - common
      - determine-jobs
      - memory-impact-target-branch
      - memory-impact-pr-branch
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && fromJSON(needs.determine-jobs.outputs.memory_impact).should_run == 'true' && needs.memory-impact-target-branch.outputs.skip != 'true'
    permissions:
      contents: read        # actions/checkout to load the comment-posting script
      pull-requests: write  # ci_memory_impact_comment.py posts/updates the memory-impact comment on the PR
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore Python
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache-key: ${{ needs.common.outputs.cache-key }}
      - name: Download target analysis JSON
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: memory-analysis-target
          path: ./memory-analysis
        continue-on-error: true
      - name: Download PR analysis JSON
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: memory-analysis-pr
          path: ./memory-analysis
        continue-on-error: true
      - name: Post or update PR comment
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          . venv/bin/activate

          # Pass JSON file paths directly to Python script
          # All data is extracted from JSON files for security
          python script/ci_memory_impact_comment.py \
            --pr-number "$PR_NUMBER" \
            --target-json ./memory-analysis/memory-analysis-target.json \
            --pr-json ./memory-analysis/memory-analysis-pr.json

  ci-status:
    name: CI Status
    runs-on: ubuntu-24.04
    # Listed in the same order the jobs are defined above. One job is
    # deliberately left out: "benchmarks" reports through CodSpeed rather than
    # this check.
    needs:
      - common
      - seed-apt-cache
      - seed-esp8266-native-cache
      - determine-jobs
      - ci-custom
      - pylint
      - lint-format
      - pytest
      - codecov-empty-upload
      - integration-tests
      - integration-ccache-prune
      - import-time
      - cpp-unit-tests
      - clang-tidy-single
      - clang-tidy-nosplit
      - clang-tidy-split
      - clang-tidy-esp32-variants
      - test-build-components-split
      - test-esp32-platformio
      - test-esp8266-native
      - test-windows
      - device-builder
      - memory-impact-target-branch
      - memory-impact-pr-branch
      - memory-impact-comment
    if: always()
    steps:
      - name: Check job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # memory-impact-target-branch is allowed to fail without blocking CI.
          # This job builds the target branch (dev/beta/release) which may fail because:
          # 1. The target branch has a build issue independent of this PR
          # 2. This PR fixes a build issue on the target branch
          # In either case, we only care that the PR branch builds successfully.
          # Every other job must have succeeded or been skipped; a "cancelled" or
          # "failure" result fails this check so CI is not reported green when the
          # workflow was cancelled.
          echo "$NEEDS_JSON" | jq -e 'del(.["memory-impact-target-branch"]) | all(.result == "success" or .result == "skipped")'
