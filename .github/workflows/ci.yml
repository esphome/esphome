---
name: CI

on:
  push:
    branches: [dev, beta, release]

  pull_request:
  merge_group:

permissions:
  contents: read  # actions/checkout for all jobs; individual jobs add their own scopes when they need to write

env:
  DEFAULT_PYTHON: "3.12"
  PYUPGRADE_TARGET: "--py312-plus"

concurrency:
  # yamllint disable-line rule:line-length
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  common:
    name: Create common environment
    runs-on: ubuntu-24.04
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Generate cache-key
        id: cache-key
        run: echo key="${{ hashFiles('requirements.txt', 'requirements_dev.txt', 'requirements_test.txt', '.pre-commit-config.yaml') }}" >> $GITHUB_OUTPUT
      - name: Set up Python ${{ env.DEFAULT_PYTHON }}
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
      - name: Restore Python virtual environment
        id: cache-venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: venv
          # yamllint disable-line rule:line-length
          key: ${{ runner.os }}-${{ steps.python.outputs.python-version }}-venv-${{ steps.cache-key.outputs.key }}
      - name: Set up uv
        # Only needed on cache miss to populate the venv. ``uv pip install``
        # detects the activated venv via ``VIRTUAL_ENV`` so downstream jobs
        # that ``. venv/bin/activate`` see an identical layout.
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          # Pull request saves land in per-PR scopes nothing else can
          # reuse; dev pushes seed the shared copy instead.
          save-cache: ${{ github.event_name != 'pull_request' }}
          # Pin uv version so the action does not have to fetch the
          # manifest from raw.githubusercontent.com on every cache
          # miss; that fetch flakes on Windows runners.
          version: "0.11.15"
      - name: Create Python virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          . venv/bin/activate
          python --version
          uv pip install -r requirements.txt -r requirements_dev.txt -r requirements_test.txt
          uv pip install -e .

  seed-apt-cache:
    name: Seed apt package cache
    runs-on: ubuntu-24.04
    # PR-branch cache saves are invisible to other PRs, so dev/beta/release
    # pushes seed the one shared entry PR jobs restore. The key is derived
    # only from the package list and version, kept in the apt-packages action.
    # In ci-status needs so a broken seed fails dev.
    if: github.event_name == 'push'
    timeout-minutes: 10
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
      - name: Install apt packages (cached)
        uses: ./.github/actions/apt-packages

  determine-jobs:
    name: Determine which jobs to run
    runs-on: ubuntu-24.04
    needs:
      - common
    outputs:
      core-ci: ${{ steps.determine.outputs.core-ci }}
      integration-tests: ${{ steps.determine.outputs.integration-tests }}
      integration-run-all: ${{ steps.determine.outputs.integration-run-all }}
      integration-test-buckets: ${{ steps.determine.outputs.integration-test-buckets }}
      clang-tidy: ${{ steps.determine.outputs.clang-tidy }}
      clang-tidy-mode: ${{ steps.determine.outputs.clang-tidy-mode }}
      clang-tidy-full-scan: ${{ steps.determine.outputs.clang-tidy-full-scan }}
      python-linters: ${{ steps.determine.outputs.python-linters }}
      import-time: ${{ steps.determine.outputs.import-time }}
      device-builder: ${{ steps.determine.outputs.device-builder }}
      esp32-platformio: ${{ steps.determine.outputs.esp32-platformio }}
      esp32-platformio-components: ${{ steps.determine.outputs.esp32-platformio-components }}
      esp8266-native: ${{ steps.determine.outputs.esp8266-native }}
      esp8266-native-components: ${{ steps.determine.outputs.esp8266-native-components }}
      windows-build-matrix: ${{ steps.determine.outputs.windows-build-matrix }}
      changed-components: ${{ steps.determine.outputs.changed-components }}
      changed-components-with-tests: ${{ steps.determine.outputs.changed-components-with-tests }}
      directly-changed-components-with-tests: ${{ steps.determine.outputs.directly-changed-components-with-tests }}
      component-test-count: ${{ steps.determine.outputs.component-test-count }}
      changed-cpp-file-count: ${{ steps.determine.outputs.changed-cpp-file-count }}
      memory_impact: ${{ steps.determine.outputs.memory-impact }}
      cpp-unit-tests-run-all: ${{ steps.determine.outputs.cpp-unit-tests-run-all }}
      cpp-unit-tests-components: ${{ steps.determine.outputs.cpp-unit-tests-components }}
      component-test-batches: ${{ steps.determine.outputs.component-test-batches }}
      validate-only-components: ${{ steps.determine.outputs.validate-only-components }}
      benchmarks: ${{ steps.determine.outputs.benchmarks }}
      # "true" when this run is a pull request into one of the release
      # branches. Those pull requests are batches of changes already tested on
      # their original dev pull requests, so several jobs below trade coverage
      # for turnaround time on them. Matched exactly, not by prefix, so an
      # ordinary branch named e.g. "release-notes" is not caught by it.
      release-pr: ${{ github.base_ref == 'beta' || github.base_ref == 'release' }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Fetch enough history to find the merge base
          fetch-depth: 2
      - name: Restore Python
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache-key: ${{ needs.common.outputs.cache-key }}
      - name: Restore components graph cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .temp/components_graph.json
          key: components-graph-${{ hashFiles('esphome/components/**/*.py') }}
      - name: Determine which tests to run
        id: determine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . venv/bin/activate
          EXTRA_ARGS=""
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'ci-run-all') }}" == "true" ]]; then
            EXTRA_ARGS="--force-all"
            echo "::notice::ci-run-all label detected -- forcing every CI job to run"
          fi
          output=$(python script/determine-jobs.py $EXTRA_ARGS)
          echo "Test determination output:"
          echo "$output" | jq

          # Extract individual fields
          echo "core-ci=$(echo "$output" | jq -r '.core_ci')" >> $GITHUB_OUTPUT
          echo "integration-tests=$(echo "$output" | jq -r '.integration_tests')" >> $GITHUB_OUTPUT
          # A missing key must fail here, not silently disable the junit upload
          run_all=$(echo "$output" | jq -r 'if has("integration_run_all") then .integration_run_all else error("integration_run_all missing") end')
          echo "integration-run-all=${run_all}" >> $GITHUB_OUTPUT
          echo "integration-test-buckets=$(echo "$output" | jq -c '.integration_test_buckets')" >> $GITHUB_OUTPUT
          echo "clang-tidy=$(echo "$output" | jq -r '.clang_tidy')" >> $GITHUB_OUTPUT
          echo "clang-tidy-mode=$(echo "$output" | jq -r '.clang_tidy_mode')" >> $GITHUB_OUTPUT
          echo "clang-tidy-full-scan=$(echo "$output" | jq -r '.clang_tidy_full_scan')" >> $GITHUB_OUTPUT
          echo "python-linters=$(echo "$output" | jq -r '.python_linters')" >> $GITHUB_OUTPUT
          echo "import-time=$(echo "$output" | jq -r '.import_time')" >> $GITHUB_OUTPUT
          echo "device-builder=$(echo "$output" | jq -r '.device_builder')" >> $GITHUB_OUTPUT
          echo "esp32-platformio=$(echo "$output" | jq -r '.esp32_platformio')" >> $GITHUB_OUTPUT
          echo "esp32-platformio-components=$(echo "$output" | jq -r '.esp32_platformio_components')" >> $GITHUB_OUTPUT
          echo "esp8266-native=$(echo "$output" | jq -r '.esp8266_native')" >> $GITHUB_OUTPUT
          echo "esp8266-native-components=$(echo "$output" | jq -r '.esp8266_native_components')" >> $GITHUB_OUTPUT
          echo "windows-build-matrix=$(echo "$output" | jq -c '.windows_build_matrix')" >> $GITHUB_OUTPUT
          echo "changed-components=$(echo "$output" | jq -c '.changed_components')" >> $GITHUB_OUTPUT
          echo "changed-components-with-tests=$(echo "$output" | jq -c '.changed_components_with_tests')" >> $GITHUB_OUTPUT
          echo "directly-changed-components-with-tests=$(echo "$output" | jq -c '.directly_changed_components_with_tests')" >> $GITHUB_OUTPUT
          echo "component-test-count=$(echo "$output" | jq -r '.component_test_count')" >> $GITHUB_OUTPUT
          echo "changed-cpp-file-count=$(echo "$output" | jq -r '.changed_cpp_file_count')" >> $GITHUB_OUTPUT
          echo "memory-impact=$(echo "$output" | jq -c '.memory_impact')" >> $GITHUB_OUTPUT
          echo "cpp-unit-tests-run-all=$(echo "$output" | jq -r '.cpp_unit_tests_run_all')" >> $GITHUB_OUTPUT
          echo "cpp-unit-tests-components=$(echo "$output" | jq -c '.cpp_unit_tests_components')" >> $GITHUB_OUTPUT
          echo "component-test-batches=$(echo "$output" | jq -c '.component_test_batches')" >> $GITHUB_OUTPUT
          echo "validate-only-components=$(echo "$output" | jq -c '.validate_only_components')" >> $GITHUB_OUTPUT
          echo "benchmarks=$(echo "$output" | jq -r '.benchmarks')" >> $GITHUB_OUTPUT
      - name: Save components graph cache
        if: github.ref == 'refs/heads/dev'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .temp/components_graph.json
          key: components-graph-${{ hashFiles('esphome/components/**/*.py') }}

  seed-esp8266-native-cache:
    name: Seed the esp8266 native toolchain cache
    runs-on: ubuntu-24.04
    needs:
      - common
    # PR-branch cache saves are invisible to other PRs, so dev pushes seed
    # the shared entry the component matrix, the memory impact jobs and
    # test-esp8266-native restore. Only dev: the composite action saves
    # nowhere else, so a beta/release push would download the toolchain and
    # discard it.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    timeout-minutes: 15
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore Python
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache-key: ${{ needs.common.outputs.cache-key }}
      - name: Cache the native toolchain
        uses: ./.github/actions/cache-arduino8266
      - name: Install the native toolchain
        run: |
          . venv/bin/activate
          python -c "from esphome.arduino8266.framework import check_and_install; from esphome.components.esp8266 import RECOMMENDED_ARDUINO_FRAMEWORK_VERSION; check_and_install(RECOMMENDED_ARDUINO_FRAMEWORK_VERSION)"

  ci-custom:
    name: Run script/ci-custom
    runs-on: ubuntu-24.04
    needs:
      - common
      - determine-jobs
    if: needs.determine-jobs.outputs.core-ci == 'true'
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore Python
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache-key: ${{ needs.common.outputs.cache-key }}
      - name: Register matcher
        run: echo "::add-matcher::.github/workflows/matchers/ci-custom.json"
      - name: Run script/ci-custom
        run: |
          . venv/bin/activate
          script/ci-custom.py
          script/build_codeowners.py --check
          script/build_alias_registry.py --check
          script/build_language_schema.py --check
          script/generate-esp32-boards.py --check
          script/generate-rp2-boards.py --check
          script/ci_check_duplicate_test_ids.py
          script/ci_check_test_fixture_list_form.py

  pylint:
    name: Check pylint
    runs-on: ubuntu-24.04
    needs:
      - common
      - determine-jobs
    if: needs.determine-jobs.outputs.python-linters == 'true'
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore Python
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache-key: ${{ needs.common.outputs.cache-key }}
      - name: Run pylint
        run: |
          . venv/bin/activate
          pylint -f parseable --persistent=n esphome
      - name: Suggested changes
        run: script/ci-suggest-changes
        if: always()

  lint-format:
    name: Check lint and formatting
    runs-on: ubuntu-latest
    needs:
      - determine-jobs
    if: github.event_name == 'pull_request' && needs.determine-jobs.outputs.release-pr == 'false' && needs.determine-jobs.outputs.core-ci == 'true'
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read prek version from requirements_test.txt
        id: prek
        # requirements_test.txt is the only place the version is pinned, so a
        # Dependabot bump there is picked up here without a second edit.
        run: |
          if ! version=$(sed -nE 's/^prek==([^[:space:]#]+).*/\1/p' requirements_test.txt) || [ -z "$version" ]; then
            echo "::error::No prek== pin found in requirements_test.txt."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run prek
        uses: j178/prek-action@44924fe9ef4a6f88253c4b6b1bf11c689d3ce53d # v3.1.0
        with:
          prek-version: ${{ steps.prek.outputs.version }}
          # This job only runs on pull requests, so nothing ever populates
          # the cache on dev. Every run would miss and then write a per-pull
          # request copy, which is what the old seed-cache job existed to
          # avoid. Building the hooks from scratch takes seconds, so skip it.
          cache: false
        env:
          PREK_SKIP: pylint,ci-custom
      # Pushes any fixes the hooks made back to the pull request. This step
      # must keep its default name: the GitHub App that performs the push
      # locates the workflow run by that name.
      - uses: pre-commit-ci/lite-action@062bca0919bc9d6e66755cc05074b70c77e111fc # v1.2.0
        if: always()
        with:
          msg: apply automatic formatting fixes

  pytest:
    name: Run pytest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        os:
          - ubuntu-latest
          - macOS-latest
          - windows-latest
        exclude:
          # Minimize CI resource usage
          # by only running the Python version
          # version used for docker images on Windows and macOS
          - python-version: "3.13"
            os: windows-latest
          - python-version: "3.13"
            os: macOS-latest
    runs-on: ${{ matrix.os }}
    needs:
      - common
      - determine-jobs
    if: needs.determine-jobs.outputs.core-ci == 'true'
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore Python
        id: restore-python
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ matrix.python-version }}
          cache-key: ${{ needs.common.outputs.cache-key }}
      - name: Register matcher
        run: echo "::add-matcher::.github/workflows/matchers/pytest.json"
      - name: Run pytest
        if: matrix.os == 'windows-latest'
        run: |
          . ./venv/Scripts/activate.ps1
          pytest -vv --cov-report=xml --tb=native --durations=30 -n auto tests --ignore=tests/integration/
      - name: Run pytest
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macOS-latest'
        run: |
          . venv/bin/activate
          pytest -vv --cov-report=xml --tb=native --durations=30 -n auto tests --ignore=tests/integration/
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      - name: Save Python virtual environment cache
        if: github.ref == 'refs/heads/dev'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: venv
          key: ${{ runner.os }}-${{ steps.restore-python.outputs.python-version }}-venv-${{ needs.common.outputs.cache-key }}

  codecov-empty-upload:
    name: Report no coverage to Codecov
    runs-on: ubuntu-24.04
    needs:
      - determine-jobs
    # ``pytest`` is the only job that uploads coverage, and it is skipped when
    # every changed file is CI-irrelevant (see ``should_run_core_ci`` in
    # ``script/determine-jobs.py``). With no upload Codecov never reports a
    # result, so the required ``codecov/patch`` status stays pending forever and
    # the pull request can never be merged. Tell Codecov up front that this
    # commit has nothing to cover so it publishes a passing status instead.
    #
    # ``force`` skips Codecov's own check that every changed file is ignorable;
    # ``determine-jobs`` has already decided none of these files can affect
    # coverage, and Codecov would otherwise fail the status for paths it does
    # not recognise as non-testable (``docker/**``, ``.yamllint``).
    if: needs.determine-jobs.outputs.core-ci == 'false'
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report empty upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          run_command: empty-upload
          force: true
          fail_ci_if_error: true

  integration-tests:
    name: Run integration tests (${{ matrix.bucket.name }})
    # Must match seed-apt-cache's image: the apt cache key has no OS in it.
    runs-on: ubuntu-24.04
    needs:
      - common
      - determine-jobs
    if: needs.determine-jobs.outputs.integration-tests == 'true'
    # A hung test is failed by pytest's --timeout below; this bounds the rest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        bucket: ${{ fromJson(needs.determine-jobs.outputs.integration-test-buckets) }}
    env:
      # Registry libraries (noise-c, libsodium, ArduinoJson, lvgl) the host builds
      # download, shared per xdist worker by tests/integration/conftest.py
      INTEGRATION_LIBRARY_CACHE_PATH: ~/.esphome-integration-tests/pio_components
      # The host build's ccache (get_build_env() in esphome/host/toolchain.py)
      INTEGRATION_CCACHE_PATH: ~/.cache/esphome/host/ccache
      # Only a full matrix run saves the ccache seed: a partial run would
      # trim it to the few tests it ran
      INTEGRATION_CCACHE_SAVE: ${{ needs.determine-jobs.outputs.integration-run-all == 'true' && (github.ref == 'refs/heads/dev' || contains(github.event.pull_request.labels.*.name, 'ci-cache-write')) }}
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install apt packages (cached)
        # ccache speeds up the host compiles. A cache hit never touches apt
        # (mirror outages cannot hang the job); the timeout bounds the cold
        # path. libsdl2-dev is needed by the headless display tests, which
        # capture screenshots.
        timeout-minutes: 10
        uses: ./.github/actions/apt-packages
      - name: Set up Python 3.13
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: Restore integration library cache
        # A miss or a changed pin self-heals with a download, so no restore-keys
        id: library-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.INTEGRATION_LIBRARY_CACHE_PATH }}
          key: integration-libraries-v1-${{ runner.os }}-${{ hashFiles('esphome/components/json/__init__.py', 'esphome/components/noise/__init__.py', 'esphome/components/lvgl/__init__.py', 'esphome/components/improv_base/__init__.py') }}
      # A full run saves one ccache slice per bucket and restores only its own; a
      # partial run groups tests differently, so it restores all of them. One step
      # per slice of INTEGRATION_TESTS_SPLIT_BUCKETS in script/determine-jobs.py.
      - name: Restore integration ccache (slice 1/5)
        if: needs.determine-jobs.outputs.integration-run-all != 'true' || strategy.job-index == 0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.INTEGRATION_CCACHE_PATH }}
          key: integration-ccache-v1-0-${{ github.run_id }}
          restore-keys: integration-ccache-v1-0-
      - name: Restore integration ccache (slice 2/5)
        if: needs.determine-jobs.outputs.integration-run-all != 'true' || strategy.job-index == 1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.INTEGRATION_CCACHE_PATH }}
          key: integration-ccache-v1-1-${{ github.run_id }}
          restore-keys: integration-ccache-v1-1-
      - name: Restore integration ccache (slice 3/5)
        if: needs.determine-jobs.outputs.integration-run-all != 'true' || strategy.job-index == 2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.INTEGRATION_CCACHE_PATH }}
          key: integration-ccache-v1-2-${{ github.run_id }}
          restore-keys: integration-ccache-v1-2-
      - name: Restore integration ccache (slice 4/5)
        if: needs.determine-jobs.outputs.integration-run-all != 'true' || strategy.job-index == 3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.INTEGRATION_CCACHE_PATH }}
          key: integration-ccache-v1-3-${{ github.run_id }}
          restore-keys: integration-ccache-v1-3-
      - name: Restore integration ccache (slice 5/5)
        if: needs.determine-jobs.outputs.integration-run-all != 'true' || strategy.job-index == 4
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.INTEGRATION_CCACHE_PATH }}
          key: integration-ccache-v1-4-${{ github.run_id }}
          restore-keys: integration-ccache-v1-4-
      - name: Mark the restored ccache as unused
        # A hit refreshes an entry's mtime, so the trim before the save keeps
        # exactly what this run used; the zeroed statistics cover this run only
        run: |
          dir="${INTEGRATION_CCACHE_PATH/#\~/$HOME}"
          if [ -d "$dir" ]; then
            find "$dir" -type f -exec touch -m -d 2000-01-01 {} +
          fi
          echo "CCACHE_DIR=$dir" >> "$GITHUB_ENV"
          CCACHE_DIR="$dir" ccache -z
      - name: Restore Python virtual environment
        id: cache-venv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: venv
          key: ${{ runner.os }}-${{ steps.python.outputs.python-version }}-venv-${{ needs.common.outputs.cache-key }}
      - name: Set up uv
        # Only needed on cache miss to populate the venv.
        if: steps.cache-venv.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          # Pull request saves land in per-PR scopes nothing else can
          # reuse; dev pushes seed the shared copy instead.
          save-cache: ${{ github.event_name != 'pull_request' }}
          # Pin uv version so the action does not have to fetch the
          # manifest from raw.githubusercontent.com on every cache
          # miss; that fetch flakes on Windows runners.
          version: "0.11.15"
      - name: Create Python virtual environment
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          python -m venv venv
          . venv/bin/activate
          python --version
          uv pip install -r requirements.txt -r requirements_test.txt
          uv pip install -e .
      - name: Register matcher
        run: echo "::add-matcher::.github/workflows/matchers/pytest.json"
      - name: Run integration tests
        id: integration
        env:
          # JSON array of test paths; parsed into a bash array below to avoid
          # shell word-splitting / glob hazards.
          BUCKET_TESTS: ${{ toJson(matrix.bucket.tests) }}
        run: |
          . venv/bin/activate
          mapfile -t test_files < <(echo "$BUCKET_TESTS" | jq -r '.[]')
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "::error::Empty integration test bucket; pytest would collect the whole tree"
            exit 1
          fi
          echo "Bucket ${{ matrix.bucket.name }}: running ${#test_files[@]} integration tests"
          # A hung test fails after 30 min: the 15 min shared build lock wait plus a cold compile
          pytest -vv --no-cov --tb=native --durations=30 -n auto --dist worksteal --timeout=1800 \
            --junitxml=junit-integration.xml "${test_files[@]}"
      - name: Re-run the failed tests with debug symbols
        # The first run builds without -g. A crash in the re-run prints a gdb
        # backtrace of its core; exit 1 keeps the job red when the re-run passes.
        if: failure() && steps.integration.outcome == 'failure'
        timeout-minutes: 30
        env:
          ESPHOME_INTEGRATION_DEBUG_SYMBOLS: "1"
          ESPHOME_INTEGRATION_CORE_DIR: /tmp/esphome-cores
        run: |
          . venv/bin/activate
          # The image's package lists usually suffice; refresh them only if not
          if ! command -v gdb >/dev/null &&
            ! sudo DEBIAN_FRONTEND=noninteractive timeout -k 15 90 apt-get install -y -qq gdb; then
            sudo timeout -k 15 300 apt-get update -qq &&
              sudo DEBIAN_FRONTEND=noninteractive timeout -k 15 300 apt-get install -y -qq gdb ||
              echo "::warning::gdb install failed; no backtraces"
          fi
          {
            mkdir -p "$ESPHOME_INTEGRATION_CORE_DIR" &&
              echo "$ESPHOME_INTEGRATION_CORE_DIR/core.%p" | sudo tee /proc/sys/kernel/core_pattern &&
              ulimit -c unlimited
          } || echo "::warning::core dumps not enabled; no backtraces"
          # Under the step limit, so a hung test still reports before Actions kills the step
          pytest -vv --no-cov --tb=native -n auto --dist worksteal --timeout=600 \
            --lf --lfnf=none tests/integration || true
          exit 1
      - name: Upload test artifacts
        # Tests that compare rendered output write the image they actually got here, so a
        # failure can be looked at without reproducing the whole build locally.
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-test-artifacts-${{ matrix.bucket.name }}
          path: test_artifacts/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload junit timings
        # Consumed by sync-integration-durations.yml through
        # script/update_integration_test_durations.py; only full matrix dev
        # runs produce usable data.
        if: github.ref == 'refs/heads/dev' && needs.determine-jobs.outputs.integration-run-all == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: junit-integration-${{ strategy.job-index }}
          path: junit-integration.xml
          if-no-files-found: error
          # A full cron period of margin for the weekly refresh
          retention-days: 14
      - name: Trim the integration ccache to this run
        # Restored entries this run did not hit are stale; dropping them keeps
        # the seed at one full run's working set instead of growing per save
        if: success() && env.INTEGRATION_CCACHE_SAVE == 'true'
        run: ccache --evict-older-than 1d
      - name: Print ccache statistics
        run: ccache -s
      - name: Save integration ccache slice
        if: success() && env.INTEGRATION_CCACHE_SAVE == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.INTEGRATION_CCACHE_PATH }}
          key: integration-ccache-v1-${{ strategy.job-index }}-${{ github.run_id }}
      - name: Save integration library cache
        # Bucket 0 only; the others would race the same immutable key.
        if: success() && (github.ref == 'refs/heads/dev' || contains(github.event.pull_request.labels.*.name, 'ci-cache-write')) && strategy.job-index == 0 && steps.library-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.INTEGRATION_LIBRARY_CACHE_PATH }}
          key: ${{ steps.library-cache.outputs.cache-primary-key }}

  integration-ccache-prune:
    name: Prune replaced integration ccache slices
    runs-on: ubuntu-24.04
    needs:
      - determine-jobs
      - integration-tests
    # Dev only: a pull request's saves stay in its own scope and expire unused.
    # A separate job so no test code runs with the cache write scope.
    if: >-
      !cancelled() &&
      github.ref == 'refs/heads/dev' &&
      needs.determine-jobs.outputs.integration-run-all == 'true'
    permissions:
      actions: write
    steps:
      - name: Delete the slices this run replaced
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          entries=$(gh cache list --ref refs/heads/dev --key integration-ccache-v1- --limit 100 --json id,key)
          # A slice whose bucket failed did not save; its older entry stays
          for key in $(jq -r --arg run "-$GITHUB_RUN_ID" '.[].key | select(endswith($run))' <<<"$entries"); do
            prefix="${key%-"$GITHUB_RUN_ID"}-"
            jq -r --arg p "$prefix" --argjson run "$GITHUB_RUN_ID" \
              '.[] | select((.key | startswith($p)) and (.key | ltrimstr($p) | tonumber) < $run) | .id' <<<"$entries" |
              while read -r id; do
                if ! out=$(gh api -X DELETE "repos/$GH_REPO/actions/caches/$id" 2>&1); then
                  # An overlapping dev run may have deleted it already; any other error fails the job
                  grep -q 'HTTP 404' <<<"$out" || { echo "$out" >&2; exit 1; }
                  echo "::notice::cache $id already gone"
                fi
              done
          done

  import-time:
    name: Check import esphome.__main__ time
    runs-on: ubuntu-24.04
    needs:
      - common
      - determine-jobs
    if: needs.determine-jobs.outputs.import-time == 'true'
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore Python
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache-key: ${{ needs.common.outputs.cache-key }}
      - name: Check import time against budget and write waterfall HAR
        run: |
          . venv/bin/activate
          script/check_import_time.py --check --har importtime.har
      - name: Upload waterfall HAR
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: import-time-waterfall
          path: importtime.har
          if-no-files-found: ignore
          retention-days: 14

  benchmarks:
    name: Run CodSpeed benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - common
      - determine-jobs
    if: >-
      github.repository == 'esphome/esphome' && (
        (github.event_name == 'push' && github.ref_name == 'dev') ||
        (
          github.event_name == 'pull_request' &&
          needs.determine-jobs.outputs.release-pr == 'false' &&
          needs.determine-jobs.outputs.benchmarks == 'true'
        )
      )
    # CodSpeed benchmarks require a CodSpeed account linked to the repository to run
    # (https://codspeed.io) -- disabled on forks that aren't esphome/esphome itself.
    #
    # Pull requests into beta and release are skipped as well. CodSpeed compares a
    # pull request against the newest commit of its base branch that has a benchmark
    # run of its own, and only dev is benchmarked. A release pull request therefore
    # falls back to dev's latest run, so every speed-up merged into dev since the
    # release branched is reported as a regression in the release. The changes there
    # have already been benchmarked on their original dev pull requests.
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Python
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache-key: ${{ needs.common.outputs.cache-key }}

      - name: Build benchmarks
        id: build
        run: |
          # pipefail: without it a failed build is masked by the grep/cut
          # pipeline below, leaving BINARY empty and silently dropping every
          # C++ benchmark from the run while the job still reports success.
          set -o pipefail
          . venv/bin/activate
          BENCHMARK_LIB_CONFIG=$(python script/setup_codspeed_lib.py)
          export BENCHMARK_LIB_CONFIG
          # --build-only prints BUILD_BINARY=<path> to stdout; the grep is
          # non-fatal so a missing marker reaches the check below instead of
          # tripping errexit at this assignment
          BINARY=$(script/cpp_benchmark.py --all --build-only | { grep '^BUILD_BINARY=' || true; } | tail -1 | cut -d= -f2-)
          if [ -z "$BINARY" ]; then
            echo "::error::Benchmark build did not report a binary path"
            exit 1
          fi
          echo "binary=$BINARY" >> $GITHUB_OUTPUT

      - name: Bound apt fetches and pre-install libc6-dbg
        # The CodSpeed runner installs valgrind + libc6-dbg via its own
        # unbounded apt-get update; per-invocation apt options cannot reach
        # it. The apt.conf.d timeouts below bound every later apt call in
        # this job, the runner's included. Pre-installing libc6-dbg lets the
        # runner skip apt once its valgrind cache is restored (it checks
        # ``dpkg -s libc6-dbg``, so the cache action's unregistered restores
        # would not count). Install without update first: image lists are
        # fresh, and the index refresh is what a congested mirror makes
        # slow. Best effort; the job timeout is the last backstop.
        timeout-minutes: 15
        continue-on-error: true
        run: |
          sudo tee /etc/apt/apt.conf.d/99ci-acquire-timeouts >/dev/null <<'EOF'
          Acquire::Retries "1";
          Acquire::http::Timeout "15";
          Acquire::https::Timeout "15";
          EOF
          if dpkg -s libc6-dbg >/dev/null 2>&1; then
            echo "libc6-dbg already installed"
            exit 0
          fi
          # Common path: the image's package lists are fresh enough.
          if sudo DEBIAN_FRONTEND=noninteractive timeout -k 15 90 \
              apt-get install -y libc6-dbg; then
            exit 0
          fi
          # Rescue path: refresh the lists once with a generous bound; the
          # apt config already fails a stalled mirror over quickly.
          sudo DEBIAN_FRONTEND=noninteractive timeout -k 10 30 \
            dpkg --configure -a || true
          sudo timeout -k 15 300 apt-get update
          sudo DEBIAN_FRONTEND=noninteractive timeout -k 15 300 \
            apt-get install -y libc6-dbg

      - name: Run CodSpeed benchmarks
        uses: CodSpeedHQ/action@78102a468f96d8e0ccb92d0ec49425753fc42062 # v5.6.0
        with:
          run: |
            . venv/bin/activate
            ${{ steps.build.outputs.binary }}
            pytest tests/benchmarks/python/ --codspeed --no-cov
          mode: simulation

  cpp-unit-tests:
    name: Run C++ unit tests
    runs-on: ubuntu-24.04
    needs:
      - common
      - determine-jobs
    if: github.event_name == 'pull_request' && (needs.determine-jobs.outputs.cpp-unit-tests-run-all == 'true' || needs.determine-jobs.outputs.cpp-unit-tests-components != '[]')
    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore Python
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache-key: ${{ needs.common.outputs.cache-key }}

      - name: Run cpp_unit_test.py
        run: |
          . venv/bin/activate
          if [ "${{ needs.determine-jobs.outputs.cpp-unit-tests-run-all }}" = "true" ]; then
            script/cpp_unit_test.py --all
          else
            ARGS=$(echo '${{ needs.determine-jobs.outputs.cpp-unit-tests-components }}' | jq -r '.[] | @sh' | xargs)
            script/cpp_unit_test.py $ARGS
          fi

  clang-tidy-single:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    needs:
      - common
      - determine-jobs
    if: needs.determine-jobs.outputs.clang-tidy == 'true'
    env:
      GH_TOKEN: ${{ github.token }}
      # esp32-arduino-tidy installs ESP-IDF natively; share the native IDF cache.
      ESPHOME_ESP_IDF_PREFIX: ~/.esphome-idf
      # nrf52-tidy installs sdk-nrf natively; pin it to a cacheable path.
      ESPHOME_SDK_NRF_PREFIX: ~/.esphome-sdk-nrf
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: clang-tidy
            name: Run script/clang-tidy for ESP8266
            options: --environment esp8266-arduino-tidy --grep USE_ESP8266 --grep USE_SOCKET_IMPL_LWIP_TCP --grep USE_SHD_FIRMWARE_DATA
            pio_cache_key: tidyesp8266
          - id: clang-tidy
            name: Run script/clang-tidy for ESP32 Arduino
            options: --environment esp32-arduino-tidy --grep USE_ARDUINO
            cache_idf: true
          - id: clang-tidy
            name: Run script/clang-tidy for ZEPHYR
            options: --environment nrf52-tidy --grep USE_ZEPHYR --grep USE_NRF52
            cache_sdk_nrf: true
            ignore_errors: false
          - id: clang-tidy
            name: Run script/clang-tidy for RP2
            options: --environment rp2-tidy --grep USE_RP2 --grep USE_BLE_SCAN_RESPONSE_MERGER
            pio_cache_key: tidyrp2
          - id: clang-tidy
            name: Run script/clang-tidy for host
            options: --environment host-tidy --grep USE_HOST
            pio_cache_key: tidyhost
          - id: clang-tidy
            name: Run script/clang-tidy for LibreTiny
            environments: bk72xx-tidy ln882h-tidy rtl87xxb-tidy rtl87xxc-tidy
            options: --grep USE_LIBRETINY --grep USE_BK72XX --grep USE_RTL87XX --grep USE_LN882X --grep USE_LN882H_BLE --grep USE_SOCKET_IMPL_LWIP_SOCKETS
            pio_cache_key: tidylibretiny

    steps:
      - name: Check out code from GitHub
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need history for HEAD~1 to work for checking changed files
          fetch-depth: 2
      - name: Install apt packages (cached)
        if: matrix.pio_cache_key == 'tidyhost'
        # libsdl2-dev is needed by the sdl component on the host, libmbedtls-dev
        # by dsmr and dlms_meter.
        timeout-minutes: 10
        uses: ./.github/actions/apt-packages

      - name: Restore Python
        id: restore-python
        uses: ./.github/actions/restore-python
        with:
          python-version: ${{ env.DEFAULT_PYTHON }}
          cache-key: ${{ needs.common.outputs.cache-key }}

      # Key on the exact Python version as well: LibreTiny creates a venv under
      # ~/.platformio/penv whose interpreter is a symlink into the runner's
      # hosted toolcache, so a cache saved on an older runner image breaks once
      # a new image ships a newer patch release and drops the old interpreter.
      - name: Cache platformio
        if: github.ref == 'refs/heads/dev' && matrix.pio_cache_key
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: platformio-${{ matrix.pio_cache_key }}-${{ steps.restore-python.outputs.python-version }}-${{ hashFiles('platformio.ini') }}

      - name: Cache platformio
        if: github.ref != 'refs/heads/dev' && matrix.pio_cache_key
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: platformio-${{ matrix.pio_cache_key }}-${{ steps.restore-python.outputs.python-version }}-${{ hashFiles('platformio.ini') }}

      - name: Cache ESP-IDF install
        if: matrix.cache_idf
        uses: ./.github/actions/cache-esp-idf
        with:
          framework: arduino

      - name: Cache clang-tidy idedata
        if: matrix.cache_idf
        uses: ./.github/actions/cache-clang-tidy-idedata
        with:
          environment: esp32-arduino-tidy

      - name: Cache nRF Connect SDK install
        if: matrix.cache_sdk_nrf
        uses: ./.github/actions/cache-sdk-nrf

      - name: Register problem matchers
        run: |
          echo "::add-matcher::.github/workflows/matchers/gcc.json"
          echo "::add-matcher::.github/workflows/matchers/clang-tidy.json"

      - name: Check if full clang-tidy scan needed
        id: check_full_scan
        run: |
          . venv/bin/activate
          # determine-jobs.clang-tidy-full-scan is true when core C++ or a
          # clang-tidy-relevant config file changed, or the ci-run-all label
          # forced --force-all.
          if [ "${{ needs.determine-jobs.outputs.clang-tidy-full-scan }}" = "true" ]; then
            echo "full_scan=true" >> $GITHUB_OUTPUT
            echo "reason=determine_jobs" >> $GITHUB_OUTPUT
          else
            echo "full_scan=false" >> $GITHUB_OUTPUT
            echo "reason=normal" >> $GITHUB_OUTPUT
          fi

      - name: Run clang-tidy
        run: |
          . venv/bin/activate
          if [ "${{ steps.check_full_scan.outputs.full_scan }}" = "true" ]; then
            echo "Running FULL clang-tidy scan (reason: ${{ steps.check_full_scan.outputs.reason }})"
            changed=""
          else
            echo "Running clang-tidy on changed files only"
            changed="--changed"
          fi
          if [ -n "${{ matrix.environments }}" ]; then
            rc=0
            for env in ${{ matrix.environments }}; do
              echo "::group::clang-tidy $env"
              script/clang-tidy --all-headers --fix $changed --environment "$env" ${{ matrix.options }} ${{ matrix.ignore_errors && '|| true' || '' }} || rc=1
              echo "::endgroup::"
            done
            exit $rc
          else
            script/clang-tidy --all-headers --fix $changed ${{ matrix.options }} ${{ matrix.ignore_errors && '|| true' || '' }}
          fi
        env:
          # Also cache libdeps, store them in a ~/.platformio subfolder
          PLATFORMIO_LIBDEPS_DIR: ~/.platformio/libdeps

      - name: Prune ESP-IDF install before cache save
        if: matrix.cache_idf && (github.ref == 'refs/heads/dev' || contains(github.event.pull_request.labels.*.name, 'ci-cache-write'))
        uses: ./.github/actions/prune-esp-idf

      - name: Suggested changes
        run: script/ci-suggest-changes ${{ matrix.ignore_errors && '|| true' || '' }}
        # yamllint disable-line rule:line-length
        if: always()

  clang-tidy-nosplit:
    name: Run script/clang-tidy for ESP32 IDF
    runs-on: ubuntu-24.04
    needs:
      - common
      - determine-jobs
    if: needs.determine-jobs.outputs.clang-tidy-mode == 'nosplit'
    env:
