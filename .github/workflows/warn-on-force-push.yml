# .github/workflows/warn-on-force-push.yml
#
# Detects a history-rewriting force-push to a PR branch and comments once
# with an explanation and restore instructions. Purely reactive: never
# touches the branch itself. Works for fork PRs.
#
# Only fires on the FIRST detected rewrite per PR — if a warning comment
# already exists, it's left alone (not updated, not reposted), even if a
# later push still looks non-fast-forward relative to the tip right
# before it (which a legitimate restore always will, since undoing a
# rewrite is itself a rewrite).

name: Warn on history-rewriting force-push

on:
  pull_request_target:
    types: [synchronize]

permissions:
  pull-requests: write
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for force-push and comment if this is the first one
        uses: actions/github-script@v7
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const prNumber = context.payload.pull_request.number;
            const before = process.env.BEFORE;
            const after = process.env.AFTER;
            const marker = "<!-- force-push-warning -->";

            async function fetchSha(sha) {
              const res = await exec.getExecOutput("git", ["fetch", "origin", sha], { ignoreReturnCode: true });
              return res.exitCode === 0;
            }
            async function isAncestor(a, b) {
              const res = await exec.getExecOutput("git", ["merge-base", "--is-ancestor", a, b], { ignoreReturnCode: true });
              return res.exitCode === 0;
            }

            await fetchSha(before);
            await fetchSha(after);

            const haveBefore = await exec.getExecOutput("git", ["cat-file", "-e", `${before}^{commit}`], { ignoreReturnCode: true });
            if (haveBefore.exitCode !== 0) {
              core.info(`Previous tip ${before} not fetchable — skipping.`);
              return;
            }

            const lost = !(await isAncestor(before, after));
            if (!lost) {
              core.info("Fast-forward update — nothing to do.");
              return;
            }

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            if (comments.some(c => c.body.includes(marker))) {
              core.info("Warning already posted for this PR — suppressing.");
              return;
            }

            const { data: reviewComments } = await github.rest.pulls.listReviewComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 1,
            });
            if (reviewComments.length === 0) {
              core.info("No existing review comments — skipping warning.");
              return;
            }

            const body = [
              marker,
              "### \u26a0\ufe0f This branch's history was rewritten",
              "",
              `A force-push to \`${branch}\` replaced earlier commits — the previous tip is no longer an ancestor of the current tip (\`${after.slice(0, 7)}\`).`,
              "",
              "Rewriting history mid-review makes it harder to track what changed since the last look, and can detach existing review comments from their code. Please avoid `git push --force` on PR branches — push new commits on top instead, or check with reviewers first if a rebase is really needed.",
              "",
              "**To restore the previous state, if this wasn't intentional:**",
              "",
              "If you still have the old commits locally (check `git reflog` on your machine first):",
              "```",
              `git push --force origin HEAD:${branch}`,
              "```",
              "",
              "Otherwise, the old tip may still be recoverable by SHA:",
              "```",
              `git fetch origin ${before}`,
              `git push --force origin ${before}:${branch}`,
              "```",
              "(This only works if GitHub hasn't garbage-collected the old commit yet — not guaranteed indefinitely.)",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
