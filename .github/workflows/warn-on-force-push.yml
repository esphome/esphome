# .github/workflows/warn-on-force-push.yml
#
# Detects a history-rewriting force-push to a PR branch and comments once
# with an explanation and restore instructions. Purely reactive: never
# touches the branch itself. Works for fork PRs.
#
# Only fires on the FIRST detected rewrite per PR

name: Warn on history-rewriting force-push

on:
  pull_request_target:
    types: [synchronize]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: warn-on-force-push-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: Check for force-push and comment if this is the first one
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const prNumber = context.payload.pull_request.number;
            const before = process.env.BEFORE;
            const after = process.env.AFTER;
            const marker = "<!-- force-push-warning -->";

            async function isRewrite() {
              let comparison;
              try {
                ({ data: comparison } = await github.rest.repos.compareCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  base: before,
                  head: after,
                }));
              } catch (err) {
                if (err.status === 404) {
                  // compareCommits 404s if either `before` or `after` can't be
                  // resolved. Only call it a rewrite if `after` resolves and
                  // `before` doesn't.
                  try {
                    await github.rest.repos.getCommit({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      ref: after,
                    });
                  } catch {
                    core.info(`Could not resolve ${after} — skipping.`);
                    return false;
                  }
                  core.info(`Previous tip ${before} is no longer reachable — history was rewritten.`);
                  return true;
                }
                throw err;
              }
              // Fast-forward: `after` descends from `before` (status "ahead",
              // behind_by 0). Anything else — diverged, or `before` ahead of
              // `after` — is a rewrite.
              return comparison.status === "diverged" || comparison.behind_by > 0;
            }

            if (!(await isRewrite())) {
              core.info("Fast-forward update — nothing to do.");
              return;
            }

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                per_page: 100,
              },
            );
            if (comments.some(c => c.body.includes(marker))) {
              core.info("Warning already posted for this PR — suppressing.");
              return;
            }

            const reviewComments = await github.paginate(github.rest.pulls.listReviewComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const hasHumanReviewComment = reviewComments.some(
              c => c.user?.type !== "Bot" && !c.user?.login?.endsWith("bot")
            );
            if (!hasHumanReviewComment) {
              core.info("No existing human review comments — skipping warning.");
              return;
            }

            // Git ref names allow backticks, @, and other characters that could
            // break markdown formatting or ping an uninvolved user.
            const safeBranch = branch.replace(/`/g, "").replace(/@/g, "@​");

            const body = [
              marker,
              "### ⚠️ This branch's history was rewritten",
              "",
              `A force-push to \`${safeBranch}\` replaced earlier commits — the previous tip is no longer an ancestor of the current tip (\`${after.slice(0, 7)}\`).`,
              "",
              "Rewriting history mid-review makes it harder to track what changed since the last look, and can detach existing review comments from their code. Please avoid `git push --force` on PR branches — push new commits on top instead, or check with reviewers first if a rebase is really needed.",
              "",
              "**To restore the previous state, if this wasn't intentional:**",
              "",
              "Push the previous tip back onto the branch:",
              "```",
              `git push --force origin ${before}:${safeBranch}`,
              "```",
              `Or view it first at https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${before}.`,
              "",
              "That commit may no longer be fetchable with `git fetch` once no branch or tag references it, but it's often still viewable at the link above for a while.",
            ].join("\n");

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
