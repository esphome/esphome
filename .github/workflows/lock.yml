name: Lock

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

concurrency:
  group: lock

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: dessant/lock-threads@1bf7ec25051fe7c00bdd17e6a7cf3d7bfb7dc771 # v4
        with:
          pr-inactive-days: "1"
          pr-lock-reason: ""
          exclude-any-pr-labels: keep-open

          issue-inactive-days: "7"
          issue-lock-reason: ""
          exclude-any-issue-labels: keep-open
