---
name: Move Shared Constants

# When the CI "Run script/ci-custom" job fails because a CONF_ or UNIT_ constant is
# defined in 3 or more files, open one PR against dev that moves those constants
# into esphome/const.py or esphome/components/const/__init__.py. Each triggering
# PR gets one move PR, which later runs rebuild from dev. Above MAX_CONSTANTS the
# workflow asks the author to move them by hand instead.
# The PR head is only ever read as text (script/move_shared_constants.py find);
# the move itself is computed from the trusted dev branch.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

# Runs for the same triggering branch wait for each other instead of racing on
# the same move branch.
concurrency:
  group: move-shared-constants-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

env:
  MAX_CONSTANTS: 5

jobs:
  find:
    name: Find constants to move
    runs-on: ubuntu-24.04
    if: >
      github.repository == 'esphome/esphome' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'
    permissions:
      actions: read        # gh api to list the jobs of the CI run
      contents: read       # actions/checkout of dev and of the PR head
      pull-requests: read  # gh api to look up the PR number by head SHA
    outputs:
      constants: ${{ steps.limit.outputs.constants }}
      over_limit: ${{ steps.limit.outputs.over_limit }}
      found: ${{ steps.find.outputs.constants }}
      pr_number: ${{ steps.pr.outputs.pr_number }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check that ci-custom failed
        id: gate
        run: |
          conclusion=$(gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/jobs" \
            --jq '.jobs[] | select(.name == "Run script/ci-custom") | .conclusion')
          echo "ci-custom conclusion: ${conclusion:-none}"
          if [ "$conclusion" = "failure" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out trusted dev
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7.0.1
        with:
          ref: dev
          persist-credentials: false

      - name: Check out PR head (data only)
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ github.event.workflow_run.head_repository.full_name }}
          ref: ${{ github.event.workflow_run.head_sha }}
          path: pr
          persist-credentials: false

      - name: Setup Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Find constants
        id: find
        if: steps.gate.outputs.run == 'true'
        run: |
          constants=$(python script/move_shared_constants.py find --root pr)
          echo "Constants to move: $constants"
          echo "constants=$constants" >> "$GITHUB_OUTPUT"

      - name: Look up PR number
        id: pr
        if: steps.gate.outputs.run == 'true'
        run: |
          pr_number=$(gh api --paginate "repos/$REPO/pulls" \
            --jq ".[] | select(.head.sha == \"$HEAD_SHA\") | .number" | head -n 1)
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

      - name: Apply the limit
        id: limit
        if: steps.gate.outputs.run == 'true'
        env:
          FOUND: ${{ steps.find.outputs.constants }}
        run: |
          found_count=$(jq 'length' <<< "$FOUND")
          if [ "$found_count" -gt "$MAX_CONSTANTS" ]; then
            echo "::warning::$found_count constants need moving, more than the limit of $MAX_CONSTANTS."
            echo "constants=[]" >> "$GITHUB_OUTPUT"
            echo "over_limit=true" >> "$GITHUB_OUTPUT"
          else
            echo "constants=$FOUND" >> "$GITHUB_OUTPUT"
          fi

  comment:
    name: Ask the author to move the constants
    needs: find
    runs-on: ubuntu-24.04
    if: needs.find.outputs.over_limit == 'true' && needs.find.outputs.pr_number != ''
    permissions: {}  # the comment is written with the App token minted below
    env:
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ needs.find.outputs.pr_number }}
      FOUND: ${{ needs.find.outputs.found }}
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.ESPHOME_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.ESPHOME_GITHUB_APP_PRIVATE_KEY }}
          permission-pull-requests: write  # post or update the comment on the triggering PR

      - name: Post or update the comment
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          marker="<!-- move-shared-constants -->"
          list=$(jq -r '.[] | "- `\(.)`"' <<< "$FOUND")
          body="$marker
          These constants are each defined in 3 or more files, which \`script/ci-custom.py\` rejects:

          $list

          That is more than $MAX_CONSTANTS, too many to move in one PR. Please open small separate PRs against \`dev\` that each move at most $MAX_CONSTANTS of them, and rebase this PR once they merge. A constant goes in \`esphome/const.py\` if any code outside \`esphome/components/\` uses it, otherwise in \`esphome/components/const/__init__.py\`. Then import it from there in each file that defined it."
          if ! existing=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
              --jq ".[] | select(.user.login == \"esphome[bot]\" and (.body | startswith(\"$marker\"))) | .id"); then
            echo "::error::Could not list the comments on #$PR_NUMBER."
            exit 1
          fi
          comment_id=$(head -n 1 <<< "$existing")
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" -f body="$body" > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$body" > /dev/null
          fi

  move:
    name: Move the constants
    needs: find
    runs-on: ubuntu-24.04
    if: >
      needs.find.outputs.pr_number != '' &&
      needs.find.outputs.constants != '' &&
      needs.find.outputs.constants != '[]'
    permissions:
      contents: read  # actions/checkout of dev; repo writes use the App token minted below
    env:
      CONSTANTS: ${{ needs.find.outputs.constants }}
      PR_NUMBER: ${{ needs.find.outputs.pr_number }}
      REPO: ${{ github.repository }}
      BRANCH: auto/move-const/pr-${{ needs.find.outputs.pr_number }}
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.ESPHOME_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.ESPHOME_GITHUB_APP_PRIVATE_KEY }}
          permission-contents: write       # push the auto/move-const/* branch
          permission-pull-requests: write  # gh pr list, create and edit

      - name: Check out dev
        uses: actions/checkout@v7.0.1
        with:
          ref: dev
          token: ${{ steps.generate-token.outputs.token }}

      - name: Look for an earlier move PR
        id: existing
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          if ! prs=$(gh pr list --repo "$REPO" --head "$BRANCH" --state all --json number,state); then
            echo "::error::Could not list PRs for $BRANCH."
            exit 1
          fi
          open_pr=$(jq -r '[.[] | select(.state == "OPEN")][0].number // empty' <<< "$prs")
          closed=$(jq '[.[] | select(.state == "CLOSED")] | length' <<< "$prs")
          echo "open_pr=$open_pr" >> "$GITHUB_OUTPUT"
          if [ -z "$open_pr" ] && [ "$closed" != "0" ]; then
            echo "A move PR for #$PR_NUMBER was closed without merging, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.existing.outputs.skip != 'true'
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Install ruff
        if: steps.existing.outputs.skip != 'true'
        run: pip install "$(grep '^ruff==' requirements_test.txt | cut -d' ' -f1)"

      - name: Move the constants
        id: move
        if: steps.existing.outputs.skip != 'true'
        run: |
          moved=""
          core=false
          for constant in $(jq -r '.[]' <<< "$CONSTANTS"); do
            home=$(python script/move_shared_constants.py move "$constant")
            if [ -n "$home" ]; then
              moved="$moved- \`$constant\` to \`$home\`"$'\n'
              if [ "$home" = "esphome/const.py" ]; then
                core=true
              fi
            fi
          done
          {
            echo "core=$core"
            echo "moved<<EOF"
            printf '%s' "$moved"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.move.outputs.moved != ''
        run: |
          git config user.name "esphome[bot]"
          git config user.email "115708604+esphome[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git commit -a -m "Move constants shared by 3 or more files"
          # The branch belongs to this workflow; each run rebuilds it from dev.
          git push --force origin "$BRANCH"

      - name: Create or update the pull request
        if: steps.move.outputs.moved != ''
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          OPEN_PR: ${{ steps.existing.outputs.open_pr }}
          MOVED: ${{ steps.move.outputs.moved }}
          CORE: ${{ steps.move.outputs.core }}
        run: |
          if [ "$CORE" = "true" ]; then
            title="[core] Move constants shared by 3 or more files"
          else
            title="[const] Move constants shared by 3 or more files"
          fi
          desc="Moves constants that were each defined in 3 or more files, which \`script/ci-custom.py\` rejects. Only the constant definitions and import lines change. Opened automatically after the check failed on #$PR_NUMBER.

          $MOVED"
          # Fill the PR template: description goes under the first heading, tick "Code quality improvements".
          body=$(DESC="$desc" awk '
            /^<!-- Quick description/ { print ENVIRON["DESC"]; next }
            /^- \[ \] Code quality improvements/ { sub(/\[ \]/, "[x]") }
            { print }
          ' .github/PULL_REQUEST_TEMPLATE.md)
          if [ -n "$OPEN_PR" ]; then
            gh pr edit "$OPEN_PR" --repo "$REPO" --title "$title" --body "$body"
          else
            gh pr create --repo "$REPO" --base dev --head "$BRANCH" --title "$title" --body "$body"
          fi
