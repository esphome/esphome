name: QEMU MQTT Topic Test

on:
  push:
    branches:
      - main
    paths:
      - esphome/components/mqtt/**
      - esphome/core/helpers.cpp
      - esphome/core/helpers.h
      - esphome/helpers.py
      - test_mqtt_openeth.yaml
      - .github/workflows/qemu-openeth.yml
  pull_request:
    paths:
      - esphome/components/mqtt/**
      - esphome/core/helpers.cpp
      - esphome/core/helpers.h
      - esphome/helpers.py
      - test_mqtt_openeth.yaml
      - .github/workflows/qemu-openeth.yml

permissions:
  contents: read

jobs:
  qemu-openeth:
    name: QEMU OpenETH MQTT topics
    runs-on: ubuntu-24.04
    env:
      LANG: C.UTF-8
    steps:
      - name: Check out code
        uses: actions/checkout@v5.0.0

      - name: Set up Python 3.11
        uses: actions/setup-python@v6.0.0
        with:
          python-version: "3.11"

      - name: Ensure user-local pip bin is on PATH
        run: echo "PATH=$HOME/.local/bin:$PATH" >> $GITHUB_ENV

      - name: Upgrade pip and install Python tools (esptool, platformio, pyserial)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          # Install esptool so esptool.py executable is available
          python -m pip install --user esptool
          # PlatformIO may be required for .pioenvs builds — install if not already present
          python -m pip install --user platformio
          # pyserial used for serial operations/flashing
          python -m pip install --user pyserial
          # (optional) install esphome CLI here if your workflow relies on it
          # python -m pip install --user esphome

      - name: (Optional) Install QEMU packages on runner (if your tests require system qemu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # install common qemu packages — adjust specific packages if you need particular arch
          sudo apt-get install -y qemu-system qemu-user-static qemu-utils || true

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') || 'esphome-ci' }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m venv venv
          . venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-xtensa mosquitto mosquitto-clients esptool git libpixman-1-0 libsdl2-2.0-0

      - name: Install Espressif QEMU (esp32)
        run: |
          set -e
          if command -v qemu-system-xtensa >/dev/null && qemu-system-xtensa -machine help 2>&1 | grep -q 'esp32'; then
            echo "System qemu-system-xtensa supports esp32 machine"
          else
            echo "Installing Espressif QEMU via idf_tools.py"
            git clone --depth 1 https://github.com/espressif/esp-idf.git
            cd esp-idf
            python3 ./tools/idf_tools.py install qemu-xtensa
            # Export is not strictly necessary since we locate the binary explicitly, but it primes the tool cache
            python3 ./tools/idf_tools.py export --format key-value >> "$GITHUB_ENV" || true
          fi

      - name: Start local Mosquitto broker
        run: |
          QEMU_WORK_DIR=.qemu
          mkdir -p "$QEMU_WORK_DIR"
          cat <<'CONF' > "$QEMU_WORK_DIR"/mosquitto.conf
          allow_anonymous true
          listener 1883 0.0.0.0
          CONF
          mosquitto -c "$QEMU_WORK_DIR"/mosquitto.conf -d

      - name: Compile ESPHome configuration
        run: |
          . venv/bin/activate
          esphome compile test_mqtt_openeth.yaml

      - name: Run QEMU and verify MQTT topics
        timeout-minutes: 20
        run: |
          set -euo pipefail
          BUILD_DIR=".esphome/build/qemu-test/.pioenvs/qemu-test"
          LOG_DIR=".qemu"
          mkdir -p "$LOG_DIR"
          pushd "$BUILD_DIR"
          esptool.py --chip esp32 merge_bin -o qemu_flash_4mb.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB --fill-flash-size 4MB \
            0x1000 bootloader.bin 0x8000 partitions.bin 0x10000 firmware.bin >/dev/null
          python -c "open('qemu_efuse_zero.bin','wb').write(b'\\x00'*1024)"
          QEMU_BIN="$(command -v qemu-system-xtensa || true)"
          # Prefer a qemu build that supports the esp32 machine
          if [ -n "$QEMU_BIN" ]; then
            if ! "$QEMU_BIN" -machine help 2>&1 | grep -q 'esp32'; then
              QEMU_BIN=""
            fi
          fi
          if [ -z "$QEMU_BIN" ]; then
            # Try Espressif-provided QEMU under ~/.espressif
            QEMU_BIN=$(ls -d "$HOME/.espressif/tools/qemu-xtensa"/*/qemu/bin/qemu-system-xtensa 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$QEMU_BIN" ] || ! "$QEMU_BIN" -machine help 2>&1 | grep -q 'esp32'; then
            echo "No qemu-system-xtensa with esp32 machine found. Install Espressif QEMU (see docs)."
            exit 1
          fi
          timeout 10m "$QEMU_BIN" \
            -nographic -M esp32 -m 4 \
            -drive file=qemu_flash_4mb.bin,if=mtd,format=raw \
            -drive file=qemu_efuse_zero.bin,format=raw,if=none,id=efuse \
            -global driver=nvram.esp32.efuse,property=drive,value=efuse \
            -global driver=timer.esp32.timg,property=wdt_disable,value=true \
            -nic user,model=open_eth \
            -serial mon:stdio \
            > qemu.log 2>&1 &
          QEMU_PID=$!
          echo "QEMU started with PID $QEMU_PID"
          popd
          # Give firmware time to boot and bring network up
          sleep 15
          # Collect a minimal set of MQTT messages with timeouts to avoid hangs
          : > "$LOG_DIR/mqtt.log"
          for topic in \
            "qemu-test/status" \
            "qemu-test/sensor/Тестовый_сенсор_температуры/state" \
            "qemu-test/sensor/Тестовый_сенсор_влажности/state" \
            "qemu-test/switch/Тестовый_переключатель_1/state"; do
            echo "Waiting for topic: $topic"
            if ! timeout 120s mosquitto_sub -h 127.0.0.1 -p 1883 -u local -P local123 -t "$topic" -C 1 -v >> "$LOG_DIR/mqtt.log"; then
              echo "Timeout waiting for $topic"
              # Stop QEMU before exiting on failure
              kill $QEMU_PID 2>/dev/null || true
              wait $QEMU_PID 2>/dev/null || true
              exit 1
            fi
          done
          # Stop QEMU (if still running)
          kill $QEMU_PID 2>/dev/null || true
          wait $QEMU_PID 2>/dev/null || true
          # Verify expected topics seen
          grep -F "qemu-test/sensor/Тестовый_сенсор_температуры/state" "$LOG_DIR/mqtt.log"
          grep -F "qemu-test/sensor/Тестовый_сенсор_влажности/state" "$LOG_DIR/mqtt.log"
          grep -F "qemu-test/switch/Тестовый_переключатель_1/state" "$LOG_DIR/mqtt.log"

      - name: Show QEMU log (on failure)
        if: failure()
        run: |
          tail -n 200 .esphome/build/qemu-test/.pioenvs/qemu-test/qemu.log || true

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: qemu-openeth-logs
          path: |
            .esphome/build/qemu-test/.pioenvs/qemu-test/qemu.log
            .qemu/mqtt.log

      - name: Stop Mosquitto
        if: always()
        run: pkill mosquitto || true
