name: Add External Component Comment

on:
  pull_request_target:
    types: [opened, synchronize]
    # PRs against the release branches are not meant to be used as external components
    branches-ignore: [beta, release]

# All API calls (pulls.{list,listFiles}, repos.compareCommits + issues.{list,create,update}Comment) are performed with
# the App token minted below, so the workflow's GITHUB_TOKEN does not need any scopes.
permissions: {}

jobs:
  external-comment:
    name: External component comment
    runs-on: ubuntu-latest
    steps:
      - name: Generate a token
        id: generate-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.ESPHOME_GITHUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.ESPHOME_GITHUB_APP_PRIVATE_KEY }}
          # pulls.listFiles + issues.{list,create,update}Comment on PRs. For PR resources
          # the issues.*Comment APIs require the pull-requests scope, not issues.
          permission-pull-requests: write

      - name: Add external component comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          script: |
            // Generate external component usage instructions
            function generateExternalComponentInstructions(prNumber, componentNames, owner, repo) {
                let source;
                if (owner === 'esphome' && repo === 'esphome')
                    source = `github://pr#${prNumber}`;
                else
                    source = `github://${owner}/${repo}@pull/${prNumber}/head`;
                return `To use the changes from this PR as an external component, add the following to your ESPHome configuration YAML file:

            \`\`\`yaml
            external_components:
              - source: ${source}
                components: [${componentNames.join(', ')}]
                refresh: 1h
            \`\`\``;
            }

            // Generate repo clone instructions
            function generateRepoInstructions(prNumber, owner, repo, branch) {
                return `To use the changes in this PR:

            \`\`\`bash
            # Clone the repository:
            git clone https://github.com/${owner}/${repo}
            cd ${repo}

            # Checkout the PR branch:
            git fetch origin pull/${prNumber}/head:${branch}
            git checkout ${branch}

            # Install the development version:
            script/setup

            # Activate the development version:
            source venv/bin/activate
            \`\`\`

            Now you can run \`esphome\` as usual to test the changes in this PR.
            `;
            }

            async function createComment(octokit, owner, repo, prNumber, esphomeChanges, componentChanges) {
                const commentMarker = "<!-- This comment was generated automatically by the external-component-bot workflow. -->";
                const legacyCommentMarker = "<!-- This comment was generated automatically by a GitHub workflow. -->";
                let commentBody;
                if (esphomeChanges.length === 1) {
                    commentBody = generateExternalComponentInstructions(prNumber, componentChanges, owner, repo);
                } else {
                    commentBody = generateRepoInstructions(prNumber, owner, repo, context.payload.pull_request.head.ref);
                }
                commentBody += `\n\n---\n(Added by the PR bot)\n\n${commentMarker}`;

                // Check for existing bot comment
                const comments = await github.paginate(
                    github.rest.issues.listComments,
                    {
                        owner: owner,
                        repo: repo,
                        issue_number: prNumber,
                        per_page: 100,
                    }
                );

                const sorted = comments.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));

                const botComment = sorted.find(comment =>
                    (
                      comment.body.includes(commentMarker) ||
                      comment.body.includes(legacyCommentMarker)
                    ) && comment.user.type === "Bot"
                );

                if (botComment && botComment.body === commentBody) {
                    // No changes in the comment, do nothing
                    return;
                }

                if (botComment) {
                    // Update existing comment
                    await github.rest.issues.updateComment({
                        owner: owner,
                        repo: repo,
                        comment_id: botComment.id,
                        body: commentBody,
                    });
                } else {
                    // Create new comment
                    await github.rest.issues.createComment({
                        owner: owner,
                        repo: repo,
                        issue_number: prNumber,
                        body: commentBody,
                    });
                }
            }

            // Find the open PR whose head branch is the given branch of this repo, if there is one
            async function findPullRequestForBranch(github, owner, repo, branch) {
                const {data} = await github.rest.pulls.list({
                    owner: owner,
                    repo: repo,
                    state: 'open',
                    head: `${owner}:${branch}`,
                    per_page: 1,
                });
                return data.length !== 0 ? data[0] : null;
            }

            // List the files the PR changes. A stacked PR, whose base is the head branch of another open PR,
            // is compared with the base of the bottom PR in the stack rather than its direct base, so the
            // changes from the PRs below it, which the external component source also fetches, are included.
            async function listChangedFiles(github, owner, repo, pullRequest) {
                // Walk down the stack; the depth limit guards against a cycle of PRs based on each other
                let base = pullRequest.base.ref;
                let stacked = false;
                for (let depth = 0; depth !== 20; depth++) {
                    const parent = await findPullRequestForBranch(github, owner, repo, base);
                    if (parent === null)
                        break;
                    base = parent.base.ref;
                    stacked = true;
                }
                if (!stacked) {
                    return await github.paginate(
                        github.rest.pulls.listFiles,
                        {
                            owner: owner,
                            repo: repo,
                            pull_number: pullRequest.number,
                            per_page: 100,
                        }
                    );
                }
                // The compare API returns all changed files (up to 300) on the first page; per_page only
                // limits the commit list, which is not needed here.
                const {data} = await github.rest.repos.compareCommitsWithBasehead({
                    owner: owner,
                    repo: repo,
                    basehead: `${base}...${pullRequest.head.sha}`,
                    per_page: 1,
                });
                return data.files ?? [];
            }

            async function getEsphomeAndComponentChanges(github, owner, repo, pullRequest) {
                const changedFiles = await listChangedFiles(github, owner, repo, pullRequest);

                // Files used only for development and CI, which do not affect use as an external component
                const ignoredFiles = ["esphome/core/defines.h", "esphome/idf_component.yml"];
                const esphomeChanges = changedFiles
                    .filter(file => !ignoredFiles.includes(file.filename) && file.filename.startsWith('esphome/'))
                    .map(file => {
                        const match = file.filename.match(/esphome\/([^/]+)/);
                        return match ? match[1] : null;
                    })
                    .filter(it => it !== null);

                if (esphomeChanges.length === 0) {
                    return {esphomeChanges: [], componentChanges: []};
                }

                const uniqueEsphomeChanges = [...new Set(esphomeChanges)];
                const componentChanges = changedFiles
                    .filter(file => file.filename.startsWith('esphome/components/'))
                    .map(file => {
                        const match = file.filename.match(/esphome\/components\/([^/]+)\//);
                        return match ? match[1] : null;
                    })
                    .filter(it => it !== null);

                return {esphomeChanges: uniqueEsphomeChanges, componentChanges: [...new Set(componentChanges)]};
            }

            // Start of main code.

            const pullRequest = context.payload.pull_request;
            const prNumber = pullRequest.number;
            const {owner, repo} = context.repo;

            const {esphomeChanges, componentChanges} = await getEsphomeAndComponentChanges(github, owner, repo, pullRequest);
            if (componentChanges.length !== 0) {
                await createComment(github, owner, repo, prNumber, esphomeChanges, componentChanges);
            }
