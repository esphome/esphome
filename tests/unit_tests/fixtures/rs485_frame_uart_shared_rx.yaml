esphome:
  name: test-device

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Each hub drains its UART's receive stream, so two hubs cannot share one. Must be rejected.
uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

rs485_frame:
  - id: sniffer_a
    uart_id: uart_bus
    framing:
      escape:
        mode: escape_byte
        byte: 0x00
    crc:
      type: sum8
    sniffer_only: true

  - id: sniffer_b
    uart_id: uart_bus
    framing:
      escape:
        mode: escape_byte
        byte: 0x00
    crc:
      type: sum8
    sniffer_only: true
