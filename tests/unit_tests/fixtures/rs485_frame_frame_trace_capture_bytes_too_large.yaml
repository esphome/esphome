esphome:
  name: test-device

esp32:
  board: esp32dev
  framework:
    type: esp-idf

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

rs485_frame:
  id: hub
  uart_id: uart_bus
  framing:
    escape:
      mode: escape_byte
      byte: 0x00
  crc:
    type: sum16_big_endian
  tx:
    gate:
      frame_type: [0x01, 0x01]
  frame_trace:
    capture_bytes: 256  # FRAME_TRACE_CAPTURE_BYTES_UPPER is 255
