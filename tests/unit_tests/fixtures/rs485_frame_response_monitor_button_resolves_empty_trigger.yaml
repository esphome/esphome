esphome:
  name: test-device

esp32:
  board: esp32dev
  framework:
    type: esp-idf

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

rs485_frame:
  id: hub
  uart_id: uart_bus
  framing:
    escape:
      mode: escape_byte
      byte: 0x00
  crc:
    type: sum16_big_endian
  tx:
    gate:
      frame_type: [0x01, 0x01]
  response_fields:
    led_mask:
      frame_type: [0x01, 0x02]
      offset: 2
      length: 4
      endian: little
  response_monitor:
    # empty_button's raw frame_type:/payload: are both empty, so _resolve_button_trigger
    # resolves this trigger to zero bytes -- it would never arm. Must be rejected.
    - name: empty_confirm
      trigger:
        button_id: empty_button
      window: 200ms
      signature:
        - field: led_mask
          type: masked_int
          value: 0x00010000

button:
  - platform: rs485_frame
    id: empty_button
    rs485_frame_id: hub
    name: "Empty"
    frame_type: []
    payload: []
