esphome:
  name: test-device

esp32:
  board: esp32dev
  framework:
    type: esp-idf

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

rs485_frame:
  id: hub
  uart_id: uart_bus
  framing:
    escape:
      mode: escape_byte
      byte: 0x00
  crc:
    type: sum16_big_endian
  tx:
    gate:
      frame_type: [0x01, 0x01]
  command_format:
    preamble: [0x00, 0x83, 0x01]
    value_element_bytes: 4
    postamble: [0x00]
  response_fields:
    led_mask:
      frame_type: [0x01, 0x02]
      offset: 2
      length: 4
      endian: little
  response_monitor:
    - name: bad_trigger
      trigger:
        # reboot_button is a core restart button, not an rs485_frame button. It lives under
        # the top-level button: domain, so it is only caught by the id's type, not by the
        # "is it a button: entry" check.
        button_id: reboot_button
      window: 200ms
      signature:
        - field: led_mask
          type: changed
          mask: 0x40

button:
  - platform: restart
    id: reboot_button
    name: "Restart"
