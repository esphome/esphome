esphome:
  name: test-device

esp32:
  board: esp32dev
  framework:
    type: esp-idf

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

rs485_frame:
  id: hub
  uart_id: uart_bus
  framing:
    escape:
      mode: escape_byte
      byte: 0x00
  crc:
    type: sum16_big_endian
  tx:
    gate:
      frame_type: [0x01, 0x01]
  on_frame:
    # Deferring is fine once the bytes are copied: script.execute runs synchronously and the
    # uint8_t[] parameter owns its copy, so the script may delay.
    - frame_type: [0x01, 0x03]
      then:
        - script.execute:
            id: handle_frame
            data: !lambda "return std::vector<uint8_t>(payload.begin(), payload.end());"

script:
  - id: handle_frame
    # queued, not the default single, so frames arriving during the delay are not skipped.
    mode: queued
    max_runs: 5
    parameters:
      data: uint8_t[]
    then:
      - delay: 100ms
      - lambda: |-
          ESP_LOGD("test", "%u", (unsigned) data.size());
