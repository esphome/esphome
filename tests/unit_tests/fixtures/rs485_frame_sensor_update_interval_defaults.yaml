esphome:
  name: test-device

esp32:
  board: esp32dev
  framework:
    type: esp-idf

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

rs485_frame:
  id: hub
  uart_id: uart_bus
  framing:
    escape:
      mode: escape_byte
      byte: 0x00
  crc:
    type: sum16_big_endian
  tx:
    gate:
      frame_type: [0x01, 0x01]

sensor:
  # High-rate decode (changes roughly every RX frame): must default to a coarse poll
  # interval so it doesn't flood the API/HA recorder.
  - platform: rs485_frame
    rs485_frame_id: hub
    name: "Frames Received"
    decode: frames_received
  # Event-driven decode (changes only on rare error/edge conditions): must default to a
  # tight poll interval so a real occurrence isn't buried behind a minute-long wait.
  - platform: rs485_frame
    rs485_frame_id: hub
    name: "CRC Failures"
    decode: crc_failures
  # Explicit user override must be left untouched by the per-decode default.
  - platform: rs485_frame
    rs485_frame_id: hub
    name: "Frames Received Custom"
    decode: frames_received
    update_interval: 5s

text_sensor:
  # Last frame type changes on nearly every frame on a live bus: must default to the same
  # coarse poll interval as the high-rate sensor decodes.
  - platform: rs485_frame
    rs485_frame_id: hub
    name: "Last Frame Type"
