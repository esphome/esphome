substitutions:
  display_scale: 1.5
  a: 10
  b: 4
  c: 79
  func: double
  template: &id001
    x: ${s*10}
    y: ${s*20}
  switch_template: &id002
    platform: gpio
    id: switch${id}
    pin: ${pin}
    name: GPIO Switch on pin ${pin}
jinja:
  macros:
    multiply:
      parameters:
        a: 3
        b: 4
      body: ${a*b}
      vars:
        display_scale: 1.5
        a: 10
        b: 4
        c: 79
        func: double
        template: *id001
        switch_template: *id002
        d: 82
        position: &id003
          x: 4
          y: 3
    modulus:
      parameters:
        vec:
          x: 0
          y: 0
      body: ${math.sqrt(vec.x*vec.x+vec.y*vec.y)}
      vars:
        display_scale: 1.5
        a: 10
        b: 4
        c: 79
        func: double
        template: *id001
        switch_template: *id002
        d: 82
        position: *id003
    scale:
      parameters:
        x: 0
        factor: null
      body: ${(x * (display_scale if factor is none else factor)) | round | int}
      vars:
        display_scale: 1.5
        a: 10
        b: 4
        c: 79
        func: double
        template: *id001
        switch_template: *id002
        d: 82
        position: *id003
    square:
      parameters:
        x: 0
      body: ${x*x}
      vars:
        display_scale: 1.5
        a: 10
        b: 4
        c: 79
        func: double
        template: *id001
        switch_template: *id002
        d: 82
        position: *id003
    double:
      parameters:
        x: 0
      body: ${x*2}
      vars:
        display_scale: 1.5
        a: 10
        b: 4
        c: 79
        func: double
        template: *id001
        switch_template: *id002
        d: 82
        position: *id003
    pin:
      parameters:
        number: 10
        inverted: false
      body: "#if number > 20\n${\n  {\n      \"number\": number,\n      \"inverted\"\
        \ : inverted,\n      \"pullup\": true\n  }\n}\n#else\n${\n  {\n      \"number\"\
        : number,\n      \"inverted\" : inverted,\n  }\n}\n#endif\n"
      vars:
        display_scale: 1.5
        a: 10
        b: 4
        c: 79
        func: double
        template: *id001
        switch_template: *id002
        d: 82
        position: *id003
    testeval:
      parameters:
        s: 5
      body: '${eval(template, {"s": s})}'
      vars:
        display_scale: 1.5
        a: 10
        b: 4
        c: 79
        func: double
        template: *id001
        switch_template: *id002
        d: 82
        position: *id003
    generate_switches:
      parameters:
        pins: []
      body: '# set ns = namespace(switches=[], id=0)

        # for pin in pins

        #   set ns.id = ns.id + 1

        #   set ns.switches = ns.switches + [ eval(switch_template, {"pin" : pin,
        "id": ns.id}) ]

        # endfor

        ${ ns.switches }'
      vars:
        display_scale: 1.5
        a: 10
        b: 4
        c: 79
        func: double
        template: *id001
        switch_template: *id002
        d: 82
        position: *id003
  vars:
    a: 7
    b: 0
    c: 3
    d: 82
    position: *id003
testlist:
  - The value of c is 79, not 3. Substitution is evaluated first
  - Even if I do this, c is still 79.
  - Substitutions are evaluated before jinja, 20
  - The value of d is 82 since it is defined as a var
  - Position x=4, y=3
  - Distance = 5
  - multiply(6,7) = 42
  - multiply(2) = 8, because parameter b has a default value of 4
  - multiply(a=5, b=7) = 35
  - scale(100) = 150 because macro takes display_scale as default
  - scale(100, 1.377892) = 138
  - square(a) = 100
  - double(b) = 8
  - number: 10
    inverted: true
  - number: 10
    inverted: false
  - number: 22
    inverted: false
    pullup: true
  - x: 790
    y: 1580
switch:
  - platform: gpio
    id: switch1
    pin: 12
    name: GPIO Switch on pin 12
  - platform: gpio
    id: switch2
    pin: 21
    name: GPIO Switch on pin 21
  - platform: gpio
    id: switch3
    pin: 22
    name: GPIO Switch on pin 22
  - platform: gpio
    id: switch4
    pin: 34
    name: GPIO Switch on pin 34
