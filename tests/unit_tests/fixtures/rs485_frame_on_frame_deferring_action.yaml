esphome:
  name: test-device

esp32:
  board: esp32dev
  framework:
    type: esp-idf

uart:
  id: uart_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 9600

rs485_frame:
  id: hub
  uart_id: uart_bus
  framing:
    escape:
      mode: escape_byte
      byte: 0x00
  crc:
    type: sum16_big_endian
  tx:
    gate:
      frame_type: [0x01, 0x01]
  on_frame:
    # payload is a view into the hub's receive buffer. After the delay it would show
    # whichever frame arrived last, not this one. Must be rejected.
    - frame_type: [0x01, 0x03]
      then:
        - delay: 100ms
        - lambda: |-
            ESP_LOGD("test", "%u", (unsigned) payload.size());
