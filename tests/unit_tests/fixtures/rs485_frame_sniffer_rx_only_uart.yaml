esphome:
  name: test-device

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# A sniffer_only hub never transmits, so an RX-only UART is enough.
uart:
  id: uart_bus
  rx_pin: GPIO16
  baud_rate: 9600

rs485_frame:
  - id: hub
    uart_id: uart_bus
    framing:
      escape:
        mode: escape_byte
        byte: 0x00
    crc:
      type: sum8
    sniffer_only: true
