substitutions:
  name: "Radio"
  lname: "radio"
  device_description: "CC1101 Transceiver"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

esphome:
  name: $lname
  friendly_name: $name
  comment: ${device_description}

wifi:
  ssid: test
  password: testtest
  fast_connect: true

api:

ota:
  - platform: esphome
logger:
  level: DEBUG

time:
  - platform: homeassistant
    id: homeassistant_time

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23 # This is the important part

cc1101:
  id: transceiver
  cs_pin: GPIO5
  gdo0_pin: GPIO4
  tuner:
    frequency: 433920
    if_frequency: 153
    filter_bandwidth: 203
    channel: 0
    channel_spacing: 200
    symbol_rate: 5000
    modulation_type: ASK/OOK

remote_receiver:
  pin: GPIO22
  id: receiver
  buffer_size: 4kb
  filter: 20us
  idle: 10ms
  dump: all

button:
  - platform: restart
    name: "My Restart Button"
    id: my_restart_button
    entity_category: diagnostic
    icon: mdi:restart
