# Shared by test_lvgl_headless_render.py and test_lvgl_color_picker_render.py, so LVGL is compiled
# once for both. Each test draws on its own display, driven by its own LVGL instance, at the size
# its expected hashes were taken at.
esphome:
  name: lvgl-render-test
host:

api:
  actions:
    # The name comes from the test so it can capture more than once: a snapshot never writes over
    # a file that is already there, so a fixed name could only ever be captured once.
    - action: take_hello_screenshot
      variables:
        name: string
      then:
        - snapshot.take:
            id: hello_display
            filename: !lambda return name;
    - action: take_picker_screenshot
      variables:
        name: string
      then:
        - snapshot.take:
            id: picker_display
            filename: !lambda return name;
    - action: set_orange
      then:
        - lvgl.color_picker.update:
            id: picker_sliders
            color: 0xFF8800
        - lvgl.color_picker.update:
            id: picker_wheel
            color: 0xFF8800
        # White has no saturation, which a hue-only picker could never change again
        - lvgl.color_picker.update:
            id: picker_hue
            color: 0xFFFFFF

logger:
  level: DEBUG

display:
  # Displays with no screen, so what LVGL draws depends on LVGL alone - nothing about the machine
  # running the test, and no graphics library outside this repository, can move the result.
  - platform: snapshot
    id: hello_display
    auto_clear_enabled: false
    dimensions:
      width: 300
      height: 300
  - platform: snapshot
    id: picker_display
    auto_clear_enabled: false
    dimensions:
      width: 680
      height: 480

lvgl:
  # The widgets are spelled out here rather than left to the built in "Hello World" screen, which
  # LVGL builds when nothing is configured: that screen contains a spinner, and an animation cannot
  # produce the same picture twice.
  #
  # Everything that affects the rendered pixels is set explicitly, so the expected hash in the test
  # depends only on the drawing code and the built in font. In particular the background comes from
  # a full screen object rather than from the theme, so adjusting a theme default does not break it.
  - id: hello_lvgl
    displays: hello_display
    default_font: montserrat_14
    widgets:
      - obj:
          width: 100%
          height: 100%
          bg_color: 0x000080
          bg_opa: cover
          border_width: 0
          radius: 0
          pad_all: 0
          widgets:
            - label:
                align: center
                text: "Hello World!"
                text_color: 0xFFFFFF

  - id: picker_lvgl
    displays: picker_display
    default_font: montserrat_14
    widgets:
      - obj:
          width: 100%
          height: 100%
          bg_color: 0x404040
          bg_opa: cover
          border_width: 0
          radius: 0
          pad_all: 4
          layout:
            type: flex
            flex_flow: row_wrap
            pad_row: 4
            pad_column: 4
          widgets:
            - color_picker:
                id: picker_sliders
                width: 196
                color: 0x3366CC
            - color_picker:
                id: picker_wheel
                width: 196
                wheel: true
                color: 0x3366CC
            # Sized from the text font
            - color_picker:
                id: picker_content
                color: 0x3366CC
            # No red, green and blue bars beside the swatch
            - color_picker:
                id: picker_hsv
                width: 196
                sliders: hsv
                color: 0x3366CC
            # Only the hue bar
            - color_picker:
                id: picker_hue
                width: 196
                sliders: hue
                color: 0x3366CC
