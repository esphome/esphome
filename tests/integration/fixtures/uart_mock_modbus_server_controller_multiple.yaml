esphome:
  name: uart-mock-modbus-server-mult

host:
api:
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy modbus's DEPENDENCIES = ["uart"]
# The actual UART bus used is the uart_mock component below
uart:
  baud_rate: 115200
  port: /dev/null

uart_mock:
  - id: virtual_uart_server
    baud_rate: 9600
    auto_start: false
    debug:
    on_tx:
      - then:
          - uart_mock.inject_rx:
              id: virtual_uart_controller
              data: !lambda return data;
          - uart_mock.inject_rx:
              id: virtual_uart_server_2
              data: !lambda return data;
  - id: virtual_uart_server_2
    baud_rate: 9600
    auto_start: false
    debug:
    on_tx:
      - then:
          - uart_mock.inject_rx:
              id: virtual_uart_server
              data: !lambda return data;
          - uart_mock.inject_rx:
              id: virtual_uart_controller
              data: !lambda return data;
  - id: virtual_uart_controller
    baud_rate: 9600
    auto_start: false
    debug:
    on_tx:
      - then:
          - uart_mock.inject_rx:
              id: virtual_uart_server
              data: !lambda return data;
          - uart_mock.inject_rx:
              id: virtual_uart_server_2
              data: !lambda return data;

modbus:
  - uart_id: virtual_uart_server
    id: virtual_modbus_server
    role: server
  - uart_id: virtual_uart_server_2
    id: virtual_modbus_server_2
    role: server
  - uart_id: virtual_uart_controller
    id: virtual_modbus_client
    role: client
    turnaround_time: 10ms

modbus_controller:
  - address: 1
    modbus_id: virtual_modbus_client
    update_interval: 1s
    id: modbus_controller_1
  - address: 2
    modbus_id: virtual_modbus_client
    update_interval: 1s
    id: modbus_controller_2
    on_command_sent:
      then:
        - lambda: id(response_time) = millis();

modbus_server:
  - address: 1
    modbus_id: virtual_modbus_server
    server_registers:
      - address: 0x01
        value_type: U_WORD
        read_lambda: return 919;
  - address: 2
    modbus_id: virtual_modbus_server_2
    server_registers:
      - address: 0x01
        value_type: U_WORD
        read_lambda: return 929;

sensor:
  - platform: modbus_controller
    modbus_controller_id: modbus_controller_1
    name: "reg_u_word"
    address: 0x01
    register_type: holding
    value_type: U_WORD
  - platform: modbus_controller
    modbus_controller_id: modbus_controller_2
    name: "reg_u_word_2"
    address: 0x01
    register_type: holding
    value_type: U_WORD
    on_value:
      then:
        - lambda: id(min_response_time).publish_state(millis() - id(response_time));
  - platform: template
    name: "min_response_time"
    update_interval: never
    id: min_response_time
    filters:
      - min:
          window_size: 100
          send_every: 1
          send_first_at: 1

globals:
  - id: response_time
    type: uint32_t

button:
  - platform: template
    name: "Start Scenario"
    id: start_scenario_btn
    on_press:
      - lambda: "id(virtual_uart_server).start_scenario();"
      - lambda: "id(virtual_uart_server_2).start_scenario();"
      - lambda: "id(virtual_uart_controller).start_scenario();"
