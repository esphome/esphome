esphome:
  name: udp-send-before-ready
  on_boot:
    # Runs during setup, before UDP's first loop() opens its sockets
    - priority: 800
      then:
        - udp.write: "early"
    - priority: -100
      then:
        - delay: 500ms
        - udp.write: "late"
        - lambda: |-
            ESP_LOGI("test", "WRITE_DONE");

host:

api:

logger:
  level: VERBOSE

udp:
  - id: test_udp
    addresses: ["127.0.0.1"]
