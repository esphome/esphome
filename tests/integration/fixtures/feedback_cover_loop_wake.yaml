esphome:
  name: feedback-loop-wake

host:
api:
  batch_delay: 0ms
logger:
  level: DEBUG

# Stand in for a motor started outside ESPHome
switch:
  - platform: template
    name: "External Open"
    id: external_open
    optimistic: true
  - platform: template
    name: "External Close"
    id: external_close
    optimistic: true

binary_sensor:
  - platform: template
    id: open_moving
    internal: true
    condition:
      switch.is_on: external_open
  - platform: template
    id: close_moving
    internal: true
    condition:
      switch.is_on: external_close

cover:
  - platform: feedback
    name: "Time Cover"
    open_action:
      - logger.log: "time_cover open"
    close_action:
      - logger.log: "time_cover close"
    stop_action:
      - logger.log: "time_cover stop"
    open_duration: 2s
    close_duration: 2s

  - platform: feedback
    name: "Max Duration Cover"
    open_action:
      - logger.log: "max_cover open"
    close_action:
      - logger.log: "max_cover close"
    stop_action:
      - logger.log: "max_cover stop"
    open_duration: 3s
    close_duration: 3s
    max_duration: 1s

  - platform: feedback
    name: "Sensor Cover"
    open_action:
      - logger.log: "sensor_cover open"
    close_action:
      - logger.log: "sensor_cover close"
    stop_action:
      - logger.log: "sensor_cover stop"
    open_duration: 4s
    close_duration: 4s
    open_sensor: open_moving
    close_sensor: close_moving
    update_interval: 200ms
