esphome:
  name: sched-debug-log
  debug_scheduler: true

host:
api:
logger:
  level: DEBUG
  on_message:
    # debug_scheduler logs each set_timeout, reuse and recycle at DEBUG. This
    # automation then calls back into the scheduler (the delay is a timeout).
    level: DEBUG
    then:
      - delay: 1ms

globals:
  - id: fire_count
    type: int
    initial_value: "0"

interval:
  - interval: 50ms
    then:
      - lambda: |-
          id(fire_count) += 1;
          if (id(fire_count) == 5) {
            ESP_LOGI("test", "INTERVAL_5_FIRES_REACHED");
          }
