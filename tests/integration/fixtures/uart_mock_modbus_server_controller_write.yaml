esphome:
  name: uart-mock-modbus-srv-write

host:
api:
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy modbus's DEPENDENCIES = ["uart"]
# The actual UART bus used is the uart_mock component below
uart:
  baud_rate: 115200
  port: /dev/null

uart_mock:
  - id: virtual_uart_server
    baud_rate: 9600
    auto_start: false
    debug:
    on_tx:
      - then:
          - uart_mock.inject_rx:
              id: virtual_uart_controller
              data: !lambda return data;
  - id: virtual_uart_controller
    baud_rate: 9600
    auto_start: false
    debug:
    on_tx:
      - then:
          - uart_mock.inject_rx:
              id: virtual_uart_server
              data: !lambda return data;

globals:
  - id: stored_u_word
    type: uint16_t
    initial_value: '11'
  - id: stored_s_word
    type: int16_t
    initial_value: '-11'
  - id: stored_u_dword
    type: uint32_t
    initial_value: '100001'
  - id: stored_fp32
    type: float
    initial_value: '1.5'

modbus:
  - uart_id: virtual_uart_server
    id: virtual_modbus_server
    role: server
  - uart_id: virtual_uart_controller
    id: virtual_modbus_controller
    role: client
    turnaround_time: 10ms

modbus_controller:
  - address: 1
    modbus_id: virtual_modbus_controller
    update_interval: 1s

modbus_server:
  - address: 1
    modbus_id: virtual_modbus_server
    server_registers:
      - address: 0x01
        value_type: U_WORD
        read_lambda: return id(stored_u_word);
        write_lambda: id(stored_u_word) = x; return true;
      - address: 0x03
        value_type: S_WORD
        read_lambda: return id(stored_s_word);
        write_lambda: id(stored_s_word) = x; return true;
      - address: 0x05
        value_type: U_DWORD
        read_lambda: return id(stored_u_dword);
        write_lambda: id(stored_u_dword) = x; return true;
      - address: 0x08
        value_type: FP32
        read_lambda: return id(stored_fp32);
        write_lambda: id(stored_fp32) = x; return true;

sensor:
  - platform: modbus_controller
    name: "reg_u_word"
    address: 0x01
    register_type: holding
    value_type: U_WORD
  - platform: modbus_controller
    name: "reg_s_word"
    address: 0x03
    register_type: holding
    value_type: S_WORD
  - platform: modbus_controller
    name: "reg_u_dword"
    address: 0x05
    register_type: holding
    value_type: U_DWORD
  - platform: modbus_controller
    name: "reg_fp32"
    address: 0x08
    register_type: holding
    value_type: FP32

number:
  - platform: modbus_controller
    name: "write_u_word"
    address: 0x01
    register_type: holding
    value_type: U_WORD
    min_value: 0
    max_value: 65535
  - platform: modbus_controller
    name: "write_s_word"
    address: 0x03
    register_type: holding
    value_type: S_WORD
    min_value: -16777215
    max_value: 16777215
  - platform: modbus_controller
    name: "write_u_dword"
    address: 0x05
    register_type: holding
    value_type: U_DWORD
    min_value: 0
    max_value: 16777215
  - platform: modbus_controller
    name: "write_fp32"
    address: 0x08
    register_type: holding
    value_type: FP32
    min_value: -16777215
    max_value: 16777215
    step: 0.01

button:
  - platform: template
    name: "Start Scenario"
    id: start_scenario_btn
    on_press:
      - lambda: "id(virtual_uart_server).start_scenario();"
      - lambda: "id(virtual_uart_controller).start_scenario();"
