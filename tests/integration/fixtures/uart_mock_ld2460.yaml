esphome:
  name: uart-mock-ld2460-test

host:
api:
  batch_delay: 0ms  # Disable batching to receive all state updates
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy ld2460's DEPENDENCIES = ["uart"]
# The actual UART bus used is the uart_mock component below
uart:
  baud_rate: 115200
  port: /dev/null

uart_mock:
  id: mock_uart
  baud_rate: 115200
  auto_start: false
  responses:
    # The hub queries the installation mode at boot (HLK-LD2460 serial protocol v1.0, table 11):
    #   FD FC FB FA 0A 0C 00 01 04 03 02 01
    # Answer with the side-mount receipt from table 12 (mode byte 01).
    - expect_tx: [0xFD, 0xFC, 0xFB, 0xFA, 0x0A, 0x0C, 0x00, 0x01, 0x04, 0x03, 0x02, 0x01]
      inject_rx: [0xFD, 0xFC, 0xFB, 0xFA, 0x0A, 0x0C, 0x00, 0x01, 0x04, 0x03, 0x02, 0x01]

  injections:
    # Phase 1 (t=100ms): the datasheet's own report example (table 2), one target at (1.5 m, 2.3 m)
    #   F4 F3 F2 F1 = header, 04 = function, 0F 00 = length 15 (little endian),
    #   0F 00 = X 15 (0.1 m steps), 17 00 = Y 23, F8 F7 F6 F5 = footer
    # Side mount: distance = sqrt(1.5² + 2.3²) = 2.746 m, angle = atan2(1.5, 2.3) = 33.1°
    - delay: 100ms
      inject_rx:
        [
          0xF4, 0xF3, 0xF2, 0xF1, 0x04, 0x0F, 0x00,
          0x0F, 0x00, 0x17, 0x00,
          0xF8, 0xF7, 0xF6, 0xF5,
        ]

    # Phase 2 (t=300ms): garbage bytes accumulate in the parser buffer
    - delay: 200ms
      inject_rx: [0xDE, 0xAD, 0xBE, 0xEF, 0x00, 0x11, 0x22]

    # Phase 3 (t=400ms): a report header with partial data and no footer
    - delay: 100ms
      inject_rx: [0xF4, 0xF3, 0xF2, 0xF1, 0x04, 0x13, 0x00, 0x01, 0x02]

    # Phase 4 (t=600ms): overflow the 32-byte frame buffer. Phases 2 and 3 left 16 bytes
    # in it; 48 more make 64, so the parser fills the buffer twice. The 33rd byte logs
    # "Max frame length exceeded" and restarts the buffer, the 64th leaves it full, and the
    # first byte of the next frame restarts it again, so phase 5 parses from a clean buffer.
    - delay: 200ms
      inject_rx:
        [
          0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
          0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
          0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
          0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
        ]

    # Phase 5 (t=700ms): recovery, two targets after the overflow
    #   Target 1 at (-2.0 m, 3.0 m): X = -20 = 0xFFEC, Y = 30 = 0x001E
    #     distance = 3.606 m, side-mount angle = atan2(-2.0, 3.0) = -33.7°
    #   Target 2 at (0.5 m, 1.0 m): X = 5, Y = 10
    #     distance = 1.118 m, angle = atan2(0.5, 1.0) = 26.6°
    #   length = 11 + 2 * 4 = 19 = 0x13
    - delay: 100ms
      inject_rx:
        [
          0xF4, 0xF3, 0xF2, 0xF1, 0x04, 0x13, 0x00,
          0xEC, 0xFF, 0x1E, 0x00,
          0x05, 0x00, 0x0A, 0x00,
          0xF8, 0xF7, 0xF6, 0xF5,
        ]

    # Phase 6 (t=900ms): the datasheet's top-mount receipt (table 12 example,
    # FD FC FB FA 0A 0C 00 02 04 03 02 01) switches the angle formula, then the
    # same single target as phase 1 reports again
    #   Top mount: angle = atan2(2.3, 1.5) = 56.9°
    - delay: 200ms
      inject_rx: [0xFD, 0xFC, 0xFB, 0xFA, 0x0A, 0x0C, 0x00, 0x02, 0x04, 0x03, 0x02, 0x01]
    - delay: 100ms
      inject_rx:
        [
          0xF4, 0xF3, 0xF2, 0xF1, 0x04, 0x0F, 0x00,
          0x0F, 0x00, 0x17, 0x00,
          0xF8, 0xF7, 0xF6, 0xF5,
        ]

ld2460:
  id: ld2460_dev
  uart_id: mock_uart

sensor:
  - platform: ld2460
    ld2460_id: ld2460_dev
    target_count:
      name: "Target Count"
      filters: &sensor_filters
        - timeout:
            timeout: 50ms
            value: last
        - throttle_with_priority: 50ms
    target_1:
      x:
        name: "Target 1 X"
        filters: *sensor_filters
      y:
        name: "Target 1 Y"
        filters: *sensor_filters
      distance:
        name: "Target 1 Distance"
        filters: *sensor_filters
      angle:
        name: "Target 1 Angle"
        filters: *sensor_filters
    target_2:
      x:
        name: "Target 2 X"
        filters: *sensor_filters
      y:
        name: "Target 2 Y"
        filters: *sensor_filters
      distance:
        name: "Target 2 Distance"
        filters: *sensor_filters
      angle:
        name: "Target 2 Angle"
        filters: *sensor_filters

button:
  - platform: template
    name: "Start Scenario"
    id: start_scenario_btn
    on_press:
      - lambda: 'id(mock_uart).start_scenario();'
