esphome:
  name: camera-mock-test

host:
api:
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

mock_camera:
  name: Mock Camera
  # Larger than MAX_BATCH_PACKET_SIZE (1390) so the image is split across
  # multiple CameraImageResponse chunks and the client must reassemble.
  image_size: 4096
  frame_interval: 50ms
