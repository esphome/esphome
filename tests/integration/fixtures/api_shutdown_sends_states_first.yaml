esphome:
  name: api-shutdown-order

host:

logger:

api:

switch:
  - platform: template
    id: test_switch
    name: "Test switch"
    optimistic: true

button:
  - platform: restart
    id: restart_button
    name: "Restart"
  - platform: template
    name: "Toggle then restart"
    on_press:
      - switch.toggle: test_switch
      - button.press: restart_button
  - platform: template
    name: "Publish then restart"
    on_press:
      # More states than one batch packet holds
      - lambda: |-
          id(burst_0).publish_state(0);
          id(burst_1).publish_state(1);
          id(burst_2).publish_state(2);
          id(burst_3).publish_state(3);
          id(burst_4).publish_state(4);
