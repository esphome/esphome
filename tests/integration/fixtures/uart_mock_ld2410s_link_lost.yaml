esphome:
  name: uart-mock-ld2410s-link-lost

host:
api:
  batch_delay: 0ms  # Disable batching to receive all state updates
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy ld2410s's DEPENDENCIES = ["uart"]
# The actual UART bus used is the uart_mock component below
uart:
  baud_rate: 115200
  port: /dev/null

uart_mock:
  id: mock_uart
  baud_rate: 115200
  auto_start: false
  responses:
    # Config-mode start, acknowledged with protocol version 2 and buffer size 0x20
    - expect_tx: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFF, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]
      inject_rx: [0xFD, 0xFC, 0xFB, 0xFA, 0x08, 0x00, 0xFF, 0x01, 0x00, 0x00, 0x02, 0x00, 0x20, 0x00, 0x04, 0x03, 0x02, 0x01]
    # Version read, answered with device type 1 and firmware 1.2.3
    - expect_tx: [0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0x00, 0x00, 0x04, 0x03, 0x02, 0x01]
      inject_rx:
        [
          0xFD, 0xFC, 0xFB, 0xFA, 0x0E, 0x00, 0x00, 0x01, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x01, 0x00,
          0x02, 0x00, 0x03, 0x00, 0x04, 0x03, 0x02, 0x01,
        ]
    # Parameter read, answered with gates 0 to 16, no delay 10 s, 8 Hz reporting, normal speed
    - expect_tx:
        [
          0xFD, 0xFC, 0xFB, 0xFA, 0x0E, 0x00, 0x71, 0x00, 0x05, 0x00, 0x0A, 0x00, 0x06, 0x00, 0x02, 0x00,
          0x0C, 0x00, 0x0B, 0x00, 0x04, 0x03, 0x02, 0x01,
        ]
      inject_rx:
        [
          0xFD, 0xFC, 0xFB, 0xFA, 0x1C, 0x00, 0x71, 0x01, 0x00, 0x00, 0x10, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x00, 0x00, 0x0A, 0x00, 0x00, 0x00, 0x50, 0x00, 0x00, 0x00, 0x50, 0x00, 0x00, 0x00, 0x05, 0x00,
          0x00, 0x00, 0x04, 0x03, 0x02, 0x01,
        ]
    # Output-mode switch to minimal, acknowledged
    - expect_tx: [0xFD, 0xFC, 0xFB, 0xFA, 0x08, 0x00, 0x7A, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x04, 0x03, 0x02, 0x01]
      inject_rx: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0x7A, 0x01, 0x00, 0x00, 0x04, 0x03, 0x02, 0x01]
    # Config-mode end, acknowledged
    - expect_tx: [0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0xFE, 0x00, 0x04, 0x03, 0x02, 0x01]
      inject_rx: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFE, 0x01, 0x00, 0x00, 0x04, 0x03, 0x02, 0x01]
  injections:
    # Short frames every second for 7 s, longer than the 5 s link timeout, so they must keep the link alive
    # t=1 s: short frame, state 2 -> presence on
    - delay: 1000ms
      inject_rx: [0x6E, 0x02, 0x2C, 0x01, 0x62]
    # t=2 s: short frame, state 0 -> presence off
    - delay: 1000ms
      inject_rx: [0x6E, 0x00, 0x00, 0x00, 0x62]
    # t=3 s: short frame, state 2 -> presence on
    - delay: 1000ms
      inject_rx: [0x6E, 0x02, 0x2C, 0x01, 0x62]
    # t=4 s: short frame, state 0 -> presence off
    - delay: 1000ms
      inject_rx: [0x6E, 0x00, 0x00, 0x00, 0x62]
    # t=5 s: short frame, state 2 -> presence on
    - delay: 1000ms
      inject_rx: [0x6E, 0x02, 0x2C, 0x01, 0x62]
    # t=6 s: short frame, state 0 -> presence off
    - delay: 1000ms
      inject_rx: [0x6E, 0x00, 0x00, 0x00, 0x62]
    # t=7 s: short frame, state 2 -> presence on
    - delay: 1000ms
      inject_rx: [0x6E, 0x02, 0x2C, 0x01, 0x62]
    # Then silence: the link watchdog must start the init sequence over

ld2410s:
  id: ld2410s_dev
  uart_id: mock_uart

binary_sensor:
  - platform: ld2410s
    ld2410s_id: ld2410s_dev
    has_target:
      name: "Has Target"

button:
  - platform: template
    name: "Start Scenario"
    id: start_scenario_btn
    on_press:
      - lambda: 'id(mock_uart).start_scenario();'
