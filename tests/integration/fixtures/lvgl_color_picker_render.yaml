esphome:
  name: lvgl-color-picker-render

host:

api:
  actions:
    # A snapshot never writes over an existing file, so the test supplies a new name each time.
    - action: take_screenshot
      variables:
        name: string
      then:
        - snapshot.take:
            id: picker_display
            filename: !lambda return name;
    - action: set_orange
      then:
        - lvgl.color_picker.update:
            id: picker_sliders
            color: 0xFF8800
        - lvgl.color_picker.update:
            id: picker_wheel
            color: 0xFF8800
        # White has no saturation, which a hue-only picker could never change again
        - lvgl.color_picker.update:
            id: picker_hue
            color: 0xFFFFFF

logger:
  level: DEBUG

display:
  - platform: snapshot
    id: picker_display
    auto_clear_enabled: false
    dimensions:
      width: 680
      height: 480

lvgl:
  displays: picker_display
  default_font: montserrat_14
  widgets:
    - obj:
        width: 100%
        height: 100%
        bg_color: 0x404040
        bg_opa: cover
        border_width: 0
        radius: 0
        pad_all: 4
        layout:
          type: flex
          flex_flow: row_wrap
          pad_row: 4
          pad_column: 4
        widgets:
          - color_picker:
              id: picker_sliders
              width: 196
              color: 0x3366CC
          - color_picker:
              id: picker_wheel
              width: 196
              wheel: true
              color: 0x3366CC
          # Sized from the text font
          - color_picker:
              id: picker_content
              color: 0x3366CC
          # No red, green and blue bars beside the swatch
          - color_picker:
              id: picker_hsv
              width: 196
              sliders: hsv
              color: 0x3366CC
          # Only the hue bar
          - color_picker:
              id: picker_hue
              width: 196
              sliders: hue
              color: 0x3366CC
