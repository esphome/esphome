esphome:
  name: test-merged-actions

host:

logger:
  level: DEBUG

globals:
  - id: running
    type: int
    initial_value: "7"

switch:
  - platform: template
    id: stopper
    optimistic: true
    on_turn_on:
      - script.stop: stop_by_callback

api:
  actions:
    - action: run_stop_in_lambda
      then:
        - script.execute: stop_in_lambda
        - logger.log: "STOP_LAMBDA done"
    - action: run_stop_by_action
      then:
        - script.execute: stop_by_action
        - logger.log: "STOP_ACTION done"
    - action: run_stop_by_callback
      then:
        - switch.turn_off: stopper
        - script.execute: stop_by_callback
        - logger.log: "STOP_CALLBACK done"
    - action: run_stop_in_branch
      then:
        - script.execute: stop_in_branch
        - logger.log: "STOP_BRANCH done"
    - action: run_restart_reentry
      then:
        - script.execute:
            id: restart_reentry
            depth: 0
    - action: run_parallel_limit
      then:
        - script.execute: parallel_limit
        - logger.log: "PARALLEL done"
    - action: run_is_running
      then:
        - script.execute: reports_running
        - lambda: |-
            ESP_LOGI("test", "RUNNING after %d", id(reports_running).is_running());
    - action: run_lambda_scope
      then:
        - script.execute:
            id: lambda_scope
            text: "abc"
        - script.execute:
            id: lambda_scope
            text: "abc"
        - logger.log: "SCOPE done"
    - action: run_named_running
      then:
        - script.execute:
            id: param_named_running
            running: 5
        - script.execute: uses_global_running
        - logger.log: "NAMED done"
    - action: run_repeat
      then:
        - repeat:
            count: 2
            then:
              - logger.log:
                  format: "REPEAT first %u"
                  args: [iteration]
              - lambda: |-
                  ESP_LOGI("test", "REPEAT second %u", (unsigned) iteration);
        - logger.log: "REPEAT done"
    - action: run_args
      variables:
        value: int
      then:
        - logger.log:
            format: "ARGS first %d"
            args: [value]
        - lambda: |-
            ESP_LOGI("test", "ARGS second %d", value);
        - delay: 1ms
        - logger.log:
            format: "ARGS third %d"
            args: [value]
        - lambda: |-
            ESP_LOGI("test", "ARGS fourth %d", value);

script:
  - id: stop_in_lambda
    then:
      - logger.log: "STOP_LAMBDA before"
      - lambda: id(stop_in_lambda).stop();
      - logger.log: "STOP_LAMBDA after"
  - id: stop_by_action
    then:
      - logger.log: "STOP_ACTION before"
      - script.stop:
      - logger.log: "STOP_ACTION after"
  - id: stop_by_callback
    then:
      - logger.log: "STOP_CALLBACK before"
      - switch.turn_on: stopper
      - logger.log: "STOP_CALLBACK after"
  - id: stop_in_branch
    then:
      - if:
          condition:
            lambda: return true;
          then:
            - logger.log: "STOP_BRANCH before"
            - lambda: id(stop_in_branch).stop();
            - logger.log: "STOP_BRANCH after inner"
      - logger.log: "STOP_BRANCH after outer"
  - id: restart_reentry
    mode: restart
    parameters:
      depth: int
    then:
      - logger.log:
          format: "RESTART start %d"
          args: [depth]
      - lambda: |-
          if (depth == 0)
            id(restart_reentry).execute(1);
      - logger.log:
          format: "RESTART middle %d"
          args: [depth]
      - delay: 1ms
      - logger.log:
          format: "RESTART end %d"
          args: [depth]
  - id: parallel_limit
    mode: parallel
    max_runs: 1
    then:
      - logger.log: "PARALLEL start"
      - lambda: id(parallel_limit).execute();
      - logger.log: "PARALLEL end"
  - id: reports_running
    then:
      - logger.log: "RUNNING first"
      - lambda: |-
          ESP_LOGI("test", "RUNNING during %d", id(reports_running).is_running());
  - id: lambda_scope
    mode: queued
    parameters:
      text: string
    then:
      # A return ends only its own lambda, and each lambda gets its own copy of the argument
      - lambda: |-
          text += "!";
          ESP_LOGI("test", "SCOPE first %s", text.c_str());
          return;
      - lambda: |-
          static int count = 0;
          count++;
          ESP_LOGI("test", "SCOPE second %s %d", text.c_str(), count);
  - id: param_named_running
    parameters:
      running: int
    then:
      - logger.log:
          format: "NAMED param first %d"
          args: [running]
      - lambda: |-
          ESP_LOGI("test", "NAMED param second %d", running);
  - id: uses_global_running
    then:
      - logger.log:
          format: "NAMED global first %d"
          args: [id(running)]
      - lambda: |-
          ESP_LOGI("test", "NAMED global second %d", id(running));
