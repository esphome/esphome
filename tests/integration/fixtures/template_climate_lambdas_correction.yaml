esphome:
  name: tmpl-clim-lam-corr
host:
api:
logger:

# This fixture tests the "device rejects command" scenario with state-readback lambdas
# and optimistic=true. The lambdas always return fixed values regardless of commands.
# The mode lambda always returns OFF; the target_temperature lambda always returns 22.0.
# This lets the test verify that the device's correction (via lambdas) takes effect
# even though commands are temporarily applied as an optimistic preview.
climate:
  - platform: template
    id: test_climate
    name: Test Correction Climate
    optimistic: true
    mode: !lambda "return static_cast<climate::ClimateMode>(0);"  # Always OFF
    target_temperature: !lambda "return 22.0f;"  # Always 22.0°C
    supported_modes:
      - "OFF"
      - HEAT
      - COOL
    visual:
      min_temperature: 16.0
      max_temperature: 30.0
      temperature_step: 0.5
    set_mode_action:
      - logger.log:
          format: "Mode command %d received but device ignores it"
          args: ["(int) x"]
    set_target_temperature_action:
      - logger.log:
          format: "Target temp command %.1f received but device ignores it"
          args: ["x"]
