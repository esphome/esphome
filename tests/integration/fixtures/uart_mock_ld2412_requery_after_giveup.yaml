esphome:
  name: uart-mock-ld2412-regiveup

host:
api:
  batch_delay: 0ms  # Disable batching to receive all state updates
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy ld2412's DEPENDENCIES = ["uart"]
# The actual UART bus used is the uart_mock component below
uart:
  baud_rate: 115200
  port: /dev/null

# Only the third motion query is answered: the setup query and the first write's re-query go unanswered,
# so that write is given up. The still query is never answered
uart_mock:
  id: mock_uart
  baud_rate: 256000
  on_tx:
    - then:
        - lambda: |-
            // The length and command word arrive as one write of their own
            static const std::vector<uint8_t> MOTION_QUERY = {0x02, 0x00, 0x13, 0x00};
            static int motion_queries = 0;
            if (data != MOTION_QUERY || ++motion_queries != 3) {
              return;
            }
            id(mock_uart).inject_to_rx_buffer(std::vector<uint8_t>{
                0xFD, 0xFC, 0xFB, 0xFA,  // header
                0x12, 0x00,              // length 18
                0x13, 0x01,              // answer to command 0x0013
                0x00, 0x00,              // status: success
                0x19, 0x0B, 0x0C, 0x0D, 0x0E, 0x0F, 0x10,  // gates 0 to 6
                0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17,  // gates 7 to 13
                0x04, 0x03, 0x02, 0x01,  // footer
            });

ld2412:
  id: ld2412_dev
  uart_id: mock_uart

number:
  - platform: ld2412
    ld2412_id: ld2412_dev
    gate_0:
      move_threshold:
        name: "Gate 0 Move Threshold"
      still_threshold:
        name: "Gate 0 Still Threshold"
    gate_5:
      move_threshold:
        name: "Gate 5 Move Threshold"
      still_threshold:
        name: "Gate 5 Still Threshold"
