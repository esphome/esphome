esphome:
  name: light-cb-weights-test
host:
api:  # Port will be automatically injected
logger:
  level: DEBUG

output:
  - platform: template
    id: weighted_cold_white_output
    type: float
    write_action:
      - logger.log:
          format: "WEIGHTED_CW_OUTPUT:%.6f"
          args: [state]
  - platform: template
    id: weighted_warm_white_output
    type: float
    write_action:
      - logger.log:
          format: "WEIGHTED_WW_OUTPUT:%.6f"
          args: [state]

light:
  - platform: cwww
    name: "Test Weighted Light"
    id: test_weighted_light
    cold_white: weighted_cold_white_output
    warm_white: weighted_warm_white_output
    cold_white_color_temperature: 6536 K
    warm_white_color_temperature: 2000 K
    constant_brightness: color_temperature_priority
    cold_to_warm_ratio: 0.7077  # 0.92 / 1.30
    gamma_correct: 2.8
