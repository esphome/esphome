modbus:
  id: modbus_dev
  uart_id: virtual_uart_dev

modbus_controller:
  - id: modbus_controller_dev
    modbus_id: modbus_dev
    address: 1

sensor:
  - platform: modbus_controller
    name: "basic_register"
    address: 0x03
    register_type: holding
  - platform: sdm_meter
    address: 2
    phase_a:
      voltage:
        name: sdm_voltage

