esphome:
  name: uart-mock-modbus-test

host:
api:
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy modbus's DEPENDENCIES = ["uart"]
# The actual UART bus used is the uart_mock component below
uart:
  baud_rate: 115200
  port: /dev/null

virtual_uart:
  - id: virtual_uart_dev
    baud_rate: 9600
    rx_full_threshold: 120
    rx_timeout: 2
    on_tx:
      - then:
          - if:
              condition: # Read holding register 1 on device 1
                lambda: "return data == std::vector<uint8_t>({0x01,0x03,0x00,0x03,0x00,0x01,0x74,0x0A});"
              then:
                - virtual_uart.inject_rx:
                    id: virtual_uart_dev
                    data: [0x01, 0x03, 0x02, 0x01, 0x03, 0xF9, 0xD5] #Return value 0x0103 (hex) = 259 (dec)
          - if:
              condition: #Read 80 input registers on device 2, starting at address 0 (SDM meter request)
                lambda: "return data == std::vector<uint8_t>({0x02,0x04,0x00,0x00,0x00,0x50,0xF0,0x05});"
              then:
                - virtual_uart.inject_rx:
                    id: virtual_uart_dev
