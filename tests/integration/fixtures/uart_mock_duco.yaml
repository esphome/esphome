esphome:
  name: uart-mock-duco
  # More requests than the old fixed table held, all sent before the hub reads an answer
  on_boot:
    priority: -100
    then:
      - component.update: co2
      - component.update: temperature
      - component.update: humidity
      - component.update: filter_remaining
      - component.update: flow_level
      - component.update: time_remaining
      - component.update: bypass
      - component.update: temperature_oda
      - component.update: temperature_sup
      - component.update: temperature_eta
      - component.update: temperature_eha
      - component.update: serial_number
      - component.update: serial_number_node_2
      - component.update: version_node_3
      - component.update: errors_node_1
      - component.update: comfort_temperature
      - component.update: manual_time_box
      - component.update: manual_time_node_3
      - component.update: flow_level_manual_1
      - component.update: flow_level_manual_2
      - component.update: flow_level_manual_3
      - component.update: co2_setpoint
      - component.update: rh_setpoint
      - component.update: show_sensor_level
      - component.update: uc_error_mode_box
      - component.update: uc_error_mode_node_2
      - component.update: rh_delta_mode
      - component.update: co2_temperature_dependent_control
      - component.update: flow_level_request

host:
api:
  batch_delay: 0ms  # Disable batching to receive all state updates
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy DEPENDENCIES = ["uart"]
uart:
  baud_rate: 57600
  port: /dev/null

time:
  - platform: host
    id: host_time

uart_mock:
  id: mock_uart
  baud_rate: 57600
  # A model of the Duco box: an acknowledgement, then the answer, both byte stuffed
  on_tx:
    - then:
        - lambda: |-
            static std::vector<uint8_t> rx;
            static uint8_t mode = 0x04;
            static uint8_t comfort = 210;
            struct NodeSetting {
              uint8_t address;
              uint8_t item;
              uint16_t value;
              uint16_t step;
              uint16_t minimum;
              uint16_t maximum;
            };
            static NodeSetting settings[] = {
                {1, 0x09, 60, 5, 5, 720},    // Manual time
                {3, 0x09, 15, 5, 5, 720},    // Manual time
                {2, 0x04, 70, 5, 0, 90},     // RH setpoint
                {2, 0x05, 1, 1, 0, 1},       // RH delta mode
                {2, 0x12, 50, 5, 0, 100},    // Show sensor level
                {1, 0x14, 1, 1, 0, 2},       // UC error mode
                {2, 0x14, 2, 1, 0, 2},
                {3, 0x03, 800, 10, 0, 2000}, // CO2 setpoint
                {3, 0x06, 10, 5, 0, 50},     // Manual level 1
                {3, 0x07, 50, 5, 10, 100},   // Manual level 2
                {3, 0x08, 100, 5, 50, 100},  // Manual level 3
                {3, 0x0E, 1, 1, 0, 1},       // Temperature-dependent CO2
            };
            rx.insert(rx.end(), data.begin(), data.end());
            while (rx.size() >= 3) {
              if (rx[0] != 0xAA || rx[1] != 0x55) {
                rx.erase(rx.begin());
                continue;
              }
              const size_t total = 2 + rx[2] + 3;
              if (rx.size() < total)
                return;
              std::vector<uint8_t> frame(rx.begin() + 2, rx.begin() + total);
              rx.erase(rx.begin(), rx.begin() + total);
              const uint8_t function = frame[1];
              const uint8_t message_id = frame[2];
              const uint8_t *d = frame.data() + 3;

              auto reply = [message_id](uint8_t fn, std::vector<uint8_t> payload) {
                std::vector<uint8_t> body{static_cast<uint8_t>(payload.size() + 2), fn, message_id};
                body.insert(body.end(), payload.begin(), payload.end());
                const uint16_t crc = crc16(body.data(), body.size());
                body.push_back(crc & 0xFF);
                body.push_back(crc >> 8);
                std::vector<uint8_t> out{0xAA, 0x55};
                for (uint8_t b : body) {
                  out.push_back(b);
                  if (b == 0xAA)
                    out.push_back(0x01);
                }
                id(mock_uart).inject_to_rx_buffer(out);
              };

              reply(function + 1, {});
              if (function == 0x0c && d[0] == 0x01) {
                static const uint8_t TYPES[] = {0, 17, 8, 12};
                reply(0x0e, {d[1] < sizeof(TYPES) ? TYPES[d[1]] : uint8_t(0), 0, 0, 0, 0, 0, 0});
              } else if (function == 0x0c && d[0] == 0x02) {
                std::vector<uint8_t> status(20, 0);
                status[0] = mode;
                status[2] = 45;
                status[12] = 0xAA;  // 21930 s, sent as AA 01 55: an escaped header inside the data
                status[13] = 0x55;
                reply(0x0e, status);
              } else if (function == 0x0c && d[0] == 0x04) {
                mode = d[2];
                ESP_LOGI("sim", "Mode set to %02X", mode);
                reply(0x0e, {0x01});
              } else if (function == 0x10 && d[3] == 0x49) {
                // temperature 21.5, CO2 682 (0x02AA exercises the byte stuffing), humidity 54.32
                reply(0x12, {0, 0, 215, 0, 0xAA, 0x02, 0x38, 0x15});
              } else if (function == 0x10 &&
                         ((d[1] == 1 && d[3] == 0x1a && d[4] == 0x10) ||
                          (d[1] != 1 && d[3] == 0x08 && d[4] == 0x06))) {
                std::vector<uint8_t> serial{0, 0, 'S', 'N', d[1] == 2 ? '2' : '1', '2', '3', '4'};
                serial.resize(18, 0);
                reply(0x12, serial);
              } else if (function == 0x10 && d[3] == 0x00 && d[4] == 0x04) {
                reply(0x12, {0, 0, 0xBE, 0x00, 0x04, 0x05, 0x06});
              } else if (function == 0x18) {
                NodeSetting *setting = nullptr;
                for (auto &candidate : settings) {
                  if (candidate.address == d[1] && candidate.item == d[2]) {
                    setting = &candidate;
                    break;
                  }
                }
                if (setting != nullptr && d[0] == 0x00) {
                  reply(0x1a, {setting->address, static_cast<uint8_t>(setting->value),
                                static_cast<uint8_t>(setting->value >> 8), static_cast<uint8_t>(setting->step),
                                static_cast<uint8_t>(setting->step >> 8), static_cast<uint8_t>(setting->minimum),
                                static_cast<uint8_t>(setting->minimum >> 8), static_cast<uint8_t>(setting->maximum),
                                static_cast<uint8_t>(setting->maximum >> 8)});
                } else if (setting != nullptr && d[0] == 0x01) {
                  setting->value = (static_cast<uint16_t>(d[3]) << 8) | d[4];
                  ESP_LOGI("sim", "Node setting %u/%02X set to %u", setting->address, setting->item, setting->value);
                  reply(0x1a, {setting->address});
                }
              } else if (function == 0x30) {
                reply(0x32, {0x01, 0x00, 0x1F, 0x13, 0x01, 0x00});
              } else if (function == 0x24 && d[0] == 0x00) {
                int16_t value = 0;
                if (d[2] == 0x0a && d[1] == 0x12)
                  value = comfort;
                else if (d[1] == 0x00)
                  value = -35;
                else if (d[1] == 0x01)
                  value = 195;
                else if (d[1] == 0x02)
                  value = 220;
                else if (d[1] == 0x03)
                  value = 80;
                else if (d[1] == 0x10)
                  value = 50;
                else if (d[1] == 0x30)
                  value = 120;
                reply(0x26, {0x01, d[1], d[2], uint8_t(value & 0xFF), uint8_t((value >> 8) & 0xFF), 0, 0});
              } else if (function == 0x24 && d[0] == 0x01) {
                comfort = d[3];
                ESP_LOGI("sim", "Comfort set to %u", comfort);
                reply(0x26, {0x01, d[1], d[2], d[3], 0, 0, 0});
              } else if (function == 0x24 && d[0] == 0x05) {
                ESP_LOGI("sim", "Time set to %u", encode_uint32(d[4], d[3], d[2], d[1]));
                reply(0x26, {0x05});
              }
            }

duco:
  uart_id: mock_uart
  disable_crc: false
  allow_dangerous_controls: false
  discovery: {}
  time:
    time_id: host_time
    update_interval: 2s

select:
  - platform: duco
    name: Mode
    update_interval: 1s
  - platform: duco
    mode:
      - id: mode_node_2
        name: Mode Node 2
        address: 2
    bypass:
      id: bypass_control
      name: Bypass Control
    adaptive_bypass:
      id: adaptive_bypass
      name: Adaptive Bypass
    frost_heater:
      id: frost_heater
      name: Frost Heater
    passive_cooling:
      id: passive_cooling
      name: Passive Cooling
    nightboost:
      id: nightboost
      name: NightBoost
    nightboost_month_start:
      id: nightboost_month_start
      name: NightBoost Start Month
    nightboost_month_stop:
      id: nightboost_month_stop
      name: NightBoost Stop Month
    uc_error_mode:
      - id: uc_error_mode_box
        name: Box UC Error Mode
        update_interval: never
      - id: uc_error_mode_node_2
        name: Node 2 UC Error Mode
        address: 2
        update_interval: never
    rh_delta_mode:
      - id: rh_delta_mode
        name: RH Delta Mode
        address: 2
        update_interval: never
    co2_temperature_dependent_control:
      - id: co2_temperature_dependent_control
        name: CO2 Temperature Dependent Control
        address: 3
        update_interval: never
  - platform: duco
    type: time_filter
    id: time_filter
    name: Time Filter

number:
  - platform: duco
    id: comfort_temperature
    name: Comfort Temperature
    update_interval: never
  - platform: duco
    comfort_temperature:
      - id: comfort_temperature_zone_1
        name: Comfort Temperature Zone 1
        address: 0x13
      - id: comfort_temperature_zone_2
        name: Comfort Temperature Zone 2
        address: 0x14
    nightboost_temperature:
      id: nightboost_temperature
      name: NightBoost Temperature
    nightboost_max:
      id: nightboost_max
      name: NightBoost Max
    box_ventilation_min:
      id: ventilation_min
      name: Ventilation Min
    box_ventilation_max:
      id: ventilation_max
      name: Ventilation Max
    manual_time:
      - id: manual_time_box
        name: Manual Time Box
        update_interval: never
      - id: manual_time_node_3
        name: Manual Time Node 3
        address: 3
        update_interval: never
    flow_level_manual_1:
      - id: flow_level_manual_1
        name: Manual Flow Level 1
        address: 3
        update_interval: never
    flow_level_manual_2:
      - id: flow_level_manual_2
        name: Manual Flow Level 2
        address: 3
        update_interval: never
    flow_level_manual_3:
      - id: flow_level_manual_3
        name: Manual Flow Level 3
        address: 3
        update_interval: never
    co2_setpoint:
      - id: co2_setpoint
        name: CO2 Setpoint
        address: 3
        update_interval: never
    rh_setpoint:
      - id: rh_setpoint
        name: RH Setpoint
        address: 2
        update_interval: never
    show_sensor_level:
      - id: show_sensor_level
        name: Show Sensor Level
        address: 2
        update_interval: never

text_sensor:
