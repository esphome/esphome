esphome:
  name: api-client-synced

host:

api:
  on_client_synced:
    - logger.log: "Synced trigger entered"
    - if:
        condition:
          api.connected:
            state_subscription_only: true
        then:
          - logger.log: "Synced trigger fired"
    # Home Assistant subscribes to actions in the same packet as states
    - homeassistant.event:
        event: esphome.client_synced

switch:
  # A known state at boot, so the test can check it is sent before the trigger
  - platform: template
    id: ready_switch
    name: "Ready switch"
    optimistic: true
    restore_mode: ALWAYS_ON

logger:
  level: DEBUG
