esphome:
  name: host-ota-test
host:
api:
ota:
  - platform: esphome
    port: __OTA_PORT__
    on_begin:
      - logger.log: "AUTOMATION begin"
    on_progress:
      - lambda: |-
          static_assert(std::is_same_v<std::remove_cvref_t<decltype(x)>, float>);
          ESP_LOGI("test", "AUTOMATION progress %.1f", x);
    on_end:
      - logger.log: "AUTOMATION end"
    on_abort:
      - logger.log: "AUTOMATION abort"
    on_error:
      - lambda: |-
          static_assert(std::is_same_v<std::remove_cvref_t<decltype(x)>, uint8_t>);
          ESP_LOGI("test", "AUTOMATION error %u", x);
    # Two automations on one key: each must fire
    on_state_change:
      - then:
          - lambda: |-
              static_assert(std::is_same_v<std::remove_cvref_t<decltype(state)>, ota::OTAState>);
              ESP_LOGI("test", "AUTOMATION state %d", static_cast<int>(state));
      - then:
          - lambda: |-
              ESP_LOGI("test", "AUTOMATION second state %d", static_cast<int>(state));
logger:
  level: DEBUG
