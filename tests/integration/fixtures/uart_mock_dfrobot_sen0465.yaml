esphome:
  name: uart-mock-dfrobot-sen0465

host:
api:
  batch_delay: 0ms # Disable batching to receive all state updates
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy DEPENDENCIES = ["uart"]
uart:
  baud_rate: 9600
  port: /dev/null

# A model of a SEN0466 (CO) probe. The first mode change is refused, the first alarm request gets a late
# answer to the mode change instead, and the first data request gets no answer, so the component has to
# retry, reject the wrong answer and wait out the timeout without sending a new request
uart_mock:
  id: mock_uart
  baud_rate: 9600
  on_tx:
    - then:
        - lambda: |-
            if (data.size() != 9 || data[0] != 0xFF || data[1] != 0x01)
              return;
            static int mode_requests = 0;
            static int alarm_requests = 0;
            static int data_requests = 0;
            static uint32_t mode_confirmed_ms = 0;
            static bool alarm_set = false;
            std::vector<uint8_t> reply(9, 0);
            reply[0] = 0xFF;
            reply[1] = data[2];
            switch (data[2]) {
              case 0x78:
                if (data[3] == 0x04 && ++mode_requests >= 2) {
                  reply[2] = 0x01;
                  mode_confirmed_ms = millis();
                }
                break;
              case 0x89:
                ESP_LOGI("sim", "Alarm switch %u threshold %u type %u, %u ms after the mode change", data[3],
                         (data[4] << 8) | data[5], data[6], millis() - mode_confirmed_ms);
                reply[2] = 0x01;
                if (++alarm_requests == 1) {
                  reply[1] = 0x78;  // FF 78 01 00 00 00 00 00 87: valid checksum and result, wrong command
                  break;
                }
                alarm_set = true;
                break;
              case 0x88:
                if (!alarm_set)
                  ESP_LOGE("sim", "Data requested before the setup was done");
                if (++data_requests == 1) {
                  ESP_LOGI("sim", "Data request left unanswered");
                  return;
                }
                if (data_requests == 2)
                  ESP_LOGI("sim", "Data request answered");
                reply[2] = 0x00;  // 20 ppm
                reply[3] = 0x14;
                reply[4] = 0x04;  // CO
                reply[5] = 0x00;  // no decimal places
                reply[6] = 0x01;  // NTC ADC 511, a non-zero byte 7 that the checksum must leave out
                reply[7] = 0xFF;
                break;
              default:
                return;
            }
            // The checksum covers bytes 1 to 6 only, as in the DFRobot library
            uint8_t sum = 0;
            for (int i = 1; i < 7; i++)
              sum += reply[i];
            reply[8] = static_cast<uint8_t>(~sum + 1);
            id(mock_uart).inject_to_rx_buffer(reply);

sensor:
  - platform: dfrobot_sen0465_uart
    uart_id: mock_uart
    model: SEN0466
    temperature_compensation: true
    update_interval: 2s
    alarm:
      threshold: 35
      type: high
    concentration:
      name: CO
    temperature:
      name: Probe Temperature
