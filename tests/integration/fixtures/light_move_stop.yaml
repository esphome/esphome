esphome:
  name: light-move-stop-test
host:
api:
logger:
  level: DEBUG

output:
  - platform: template
    id: out_mono
    type: float
    write_action:
      - lambda: ""
  - platform: template
    id: out_cold
    type: float
    write_action:
      - lambda: ""
  - platform: template
    id: out_warm
    type: float
    write_action:
      - lambda: ""

light:
  - platform: monochromatic
    name: "Mono Light"
    id: mono_light
    output: out_mono
  - platform: cwww
    name: "CWWW Light"
    id: cwww_light
    cold_white: out_cold
    warm_white: out_warm
    cold_white_color_temperature: 153 mireds
    warm_white_color_temperature: 500 mireds

button:
  - platform: template
    name: "Mono Setup"
    on_press:
      - light.turn_on:
          id: mono_light
          brightness: 20%
          transition_length: 0s
  - platform: template
    name: "Mono Up"
    on_press:
      - light.move:
          id: mono_light
          direction: UP
          duration: 2s
  - platform: template
    name: "Mono Down"
    on_press:
      - light.move:
          id: mono_light
          direction: DOWN
          duration: 2s
          brightness_limits:
            min_brightness: 10%
  - platform: template
    name: "Mono Stop"
    on_press:
      - light.stop: mono_light
  - platform: template
    name: "Mono Off"
    on_press:
      - light.turn_off:
          id: mono_light
          transition_length: 0s
  - platform: template
    name: "CT Setup"
    on_press:
      - light.turn_on:
          id: cwww_light
          brightness: 100%
          color_temperature: 300 mireds
          transition_length: 0s
  - platform: template
    name: "CT Up"
    on_press:
      - light.move:
          id: cwww_light
          attribute: COLOR_TEMPERATURE
          direction: UP
          duration: 2s
  - platform: template
    name: "CT Stop"
    on_press:
      - light.stop: cwww_light
