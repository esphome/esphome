esphome:
  name: light-move-stop-test
host:
api:
logger:
  level: DEBUG

output:
  - platform: template
    id: out_mono
    type: float
    write_action:
      - lambda: ""

light:
  - platform: monochromatic
    name: "Mono Light"
    id: mono_light
    output: out_mono

button:
  - platform: template
    name: "Mono Setup"
    on_press:
      - light.turn_on:
          id: mono_light
          brightness: 20%
          transition_length: 0s
  - platform: template
    name: "Mono Up"
    on_press:
      - light.move:
          id: mono_light
          direction: UP
          duration: 2s
  - platform: template
    name: "Mono Down"
    on_press:
      - light.move:
          id: mono_light
          direction: DOWN
          duration: 2s
          brightness_limits:
            min_brightness: 10%
  - platform: template
    name: "Mono Stop"
    on_press:
      - light.stop: mono_light
  - platform: template
    name: "Mono Off"
    on_press:
      - light.turn_off:
          id: mono_light
          transition_length: 0s
