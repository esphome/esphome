esphome:
  name: ltspi-save
host:
api:
logger:

preferences:
  flash_write_interval: 0s  # Flush to disk on every loop

output:
  - platform: template
    id: mono_output
    type: float
    write_action:
      - logger.log:
          format: "mono_output: %.2f"
          args: [state]

light:
  - platform: monochromatic
    id: test_mono_light
    name: "Test Mono Light"
    output: mono_output
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 1s
    transition_state_publish_interval: 0.2s

button:
  - platform: template
    id: run_persistence_transition
    name: "Run Persistence Transition"
    on_press:
      - lambda: |-
          auto call = id(test_mono_light).turn_on();
          call.set_brightness(1.0f);
          call.set_transition_length(1000);
          call.set_save(true);
          call.perform();
