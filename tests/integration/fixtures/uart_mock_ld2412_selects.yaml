esphome:
  name: uart-mock-ld2412-selects

host:
api:
  batch_delay: 0ms  # Disable batching to receive all state updates
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy ld2412's DEPENDENCIES = ["uart"]
# The actual UART bus used is the uart_mock component below
uart:
  baud_rate: 115200
  port: /dev/null

# Answers the distance resolution query with 0x01, the module's code for 0.5m
uart_mock:
  id: mock_uart
  baud_rate: 256000
  on_tx:
    - then:
        - lambda: |-
            // The length and command word arrive as one write of their own
            static const std::vector<uint8_t> RESOLUTION_QUERY = {0x02, 0x00, 0x11, 0x00};
            if (data != RESOLUTION_QUERY) {
              return;
            }
            id(mock_uart).inject_to_rx_buffer(std::vector<uint8_t>{
                0xFD, 0xFC, 0xFB, 0xFA,  // header
                0x06, 0x00,              // length 6
                0x11, 0x01,              // answer to command 0x0011
                0x00, 0x00,              // status: success
                0x01, 0x00,              // resolution code 0x01 = 0.5m
                0x04, 0x03, 0x02, 0x01,  // footer
            });

ld2412:
  id: ld2412_dev
  uart_id: mock_uart

select:
  - platform: ld2412
    ld2412_id: ld2412_dev
    distance_resolution:
      name: "Distance Resolution"
    baud_rate:
      name: "Baud Rate"
