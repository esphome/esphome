ld2450:
  id: ld2450_dev
  uart_id: mock_uart

text:
  - platform: ld2450
    ld2450_id: ld2450_dev
    polygon_zones:
      - id: hold_zone
        name: "Hold Zone Polygon"

binary_sensor:
  - platform: ld2450
    ld2450_id: ld2450_dev
    has_target:
      name: "Has Target"
    polygon_zones:
      - polygon_zone_id: hold_zone
        name: "Hold Zone Presence"

number:
  - platform: ld2450
    ld2450_id: ld2450_dev
    presence_timeout:
      name: "Presence Timeout"

button:
  - platform: template
    name: "Start Scenario"
    id: start_scenario_btn
    on_press:
      - lambda: 'id(mock_uart).start_scenario();'
