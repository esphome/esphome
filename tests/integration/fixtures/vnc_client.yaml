esphome:
  name: vnc-client-test

host:

api:
  actions:
    - action: take_snapshot
      variables:
        filename: string
      then:
        - snapshot.take:
            id: disp
            filename: !lambda return filename;
    - action: tap
      variables:
        x: int
        y: int
      then:
        - vnc.send_pointer:
            x: !lambda return x;
            y: !lambda return y;
            buttons: [left]
        - vnc.send_pointer:
            x: !lambda return x;
            y: !lambda return y;
            buttons: 0
    - action: key
      variables:
        keysym: int
      then:
        - vnc.send_key:
            key: !lambda return keysym;
    - action: type
      variables:
        chars: string
      then:
        - vnc.type_text:
            text: !lambda return chars;
    - action: vnc_connect
      then:
        - vnc.connect: remote
    - action: vnc_refresh
      then:
        - vnc.refresh: remote

logger:
  level: DEBUG

display:
  - platform: snapshot
    id: disp
    update_interval: never
    dimensions:
      width: 64
      height: 48

vnc:
  id: remote
  display_id: disp
  host: 127.0.0.1
  # Rewritten by the test to the fake server's port
  port: 15900
  reconnect_interval: 1s
  # Longer than the time the next request may take, so the two can be told apart
  update_delay: 300ms
  max_update_delay: 500ms
  on_connect:
    - logger.log: "VNC_TEST_CONNECTED"
  on_disconnect:
    - logger.log: "VNC_TEST_DISCONNECTED"
