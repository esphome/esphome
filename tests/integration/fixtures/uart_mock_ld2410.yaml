esphome:
  name: uart-mock-ld2410-test

host:
api:
  batch_delay: 0ms  # Disable batching to receive all state updates
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy ld2410's DEPENDENCIES = ["uart"]
# The actual UART bus used is the uart_mock component below
uart:
  baud_rate: 115200
  port: /dev/null

uart_mock:
  id: mock_uart
  baud_rate: 256000
  auto_start: false
  injections:
    # Phase 1 (t=100ms): Valid LD2410 normal mode data frame - happy path
    # The buffer is clean at this point, so this frame should parse correctly.
    # Moving target: 100cm, energy 50
    # Still target: 120cm, energy 25
    # Detection distance: 300cm
    # Target state: 0x03 (moving + still)
    #
    # Frame layout (23 bytes):
    #   [0-3]  F4 F3 F2 F1 = data frame header
    #   [4-5]  0D 00       = length 13
    #   [6]    02          = data type (normal)
    #   [7]    AA          = data header marker
    #   [8]    03          = target states (moving+still)
    #   [9-10] 64 00       = moving distance 100 (0x0064)
    #   [11]   32          = moving energy 50
    #   [12-13] 78 00      = still distance 120 (0x0078)
    #   [14]   19          = still energy 25
    #   [15-16] 2C 01      = detection distance 300 (0x012C)
    #   [17]   55          = data footer marker
    #   [18]   00          = CRC/check
    #   [19-22] F8 F7 F6 F5 = data frame footer
    - delay: 100ms
      inject_rx:
        [
          0xF4, 0xF3, 0xF2, 0xF1,
          0x0D, 0x00,
          0x02, 0xAA,
          0x03,
          0x64, 0x00,
          0x32,
          0x78, 0x00,
          0x19,
          0x2C, 0x01,
          0x55, 0x00,
          0xF8, 0xF7, 0xF6, 0xF5,
        ]

    # Phase 2 (t=200ms): Garbage bytes
    # None of them can start a frame header, so the parser drops them all.
    - delay: 100ms
      inject_rx: [0xDE, 0xAD, 0xBE, 0xEF, 0x00, 0x11, 0x22]

    # Phase 3 (t=300ms): Truncated frame (header + partial data, no footer)
    # The header opens the buffer; the parser waits for the 23 bytes its length announces.
    - delay: 100ms
      inject_rx: [0xF4, 0xF3, 0xF2, 0xF1, 0x0D, 0x00, 0x02, 0xAA]

    # Phase 4 (t=500ms): 85 bytes of 0xFF
    # The first 15 complete the truncated frame's 23 bytes without its footer, so it is dropped
    # with an 'Invalid length' warning; the rest cannot start a header and are dropped too.
    - delay: 200ms
      inject_rx:
        [
          0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
          0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
          0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
          0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
          0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
          0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
          0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
          0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
          0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
        ]

    # Phase 5 (t=600ms): Valid frame after the garbage - recovery test
    # The buffer is empty again, so this valid frame should parse correctly.
    # Moving target: 50cm, energy 100
    # Still target: 75cm, energy 80
    # Detection distance: 127cm
    - delay: 100ms
      inject_rx:
        [
          0xF4, 0xF3, 0xF2, 0xF1,
          0x0D, 0x00,
          0x02, 0xAA,
          0x03,
          0x32, 0x00,
          0x64,
          0x4B, 0x00,
          0x50,
          0x7F, 0x00,
          0x55, 0x00,
          0xF8, 0xF7, 0xF6, 0xF5,
        ]

    # Phase 6 (t=3100ms): Values that spell the command footer 04 03 02 01
    # Moving distance 772 (0x0304), moving energy 2, still distance 1: bytes 9 to 12 are the
    # command frame footer, which must not end the frame early.
    # Still energy 5, detection distance 772. The sensors hold and throttle values for a second,
    # so the gap lets the phase 5 states reach the test before these replace them.
    - delay: 2500ms
      inject_rx:
        [
          0xF4, 0xF3, 0xF2, 0xF1,
          0x0D, 0x00,
          0x02, 0xAA,
          0x03,
          0x04, 0x03,
          0x02,
          0x01, 0x00,
          0x05,
          0x04, 0x03,
          0x55, 0x00,
          0xF8, 0xF7, 0xF6, 0xF5,
        ]

    # Phase 7 (t=5600ms): Truncated frame merged with a complete one
    # The eight header bytes announce a 23 byte frame, so its window takes in the first 15 bytes of
    # the valid frame that follows. The merged frame has no footer where the count says, so it is
    # dropped and the bytes after its header are replayed, which recovers the valid frame.
    # Moving distance 400, moving energy 7, still distance 200, still energy 9, detection distance 400
    - delay: 2500ms
      inject_rx:
        [
          0xF4, 0xF3, 0xF2, 0xF1, 0x0D, 0x00, 0x02, 0xAA,
          0xF4, 0xF3, 0xF2, 0xF1,
          0x0D, 0x00,
          0x02, 0xAA,
          0x03,
          0x90, 0x01,
          0x07,
          0xC8, 0x00,
          0x09,
          0x90, 0x01,
          0x55, 0x00,
          0xF8, 0xF7, 0xF6, 0xF5,
        ]

    # Phase 8 (t=8100ms): Impossible counts, then a complete frame
    # A command header counting 0xFFF6 bytes (65536 in total, which must not wrap to 0) and one counting
    # 0xFFFF are each dropped as soon as the count arrives, and the valid frame after them is parsed.
    # Moving distance 600, moving energy 11, still distance 300, still energy 13, detection distance 600
    - delay: 2500ms
      inject_rx:
        [
          0xFD, 0xFC, 0xFB, 0xFA, 0xF6, 0xFF,
          0xFD, 0xFC, 0xFB, 0xFA, 0xFF, 0xFF,
          0xF4, 0xF3, 0xF2, 0xF1,
          0x0D, 0x00,
          0x02, 0xAA,
          0x03,
          0x58, 0x02,
          0x0B,
          0x2C, 0x01,
          0x0D,
          0x58, 0x02,
          0x55, 0x00,
          0xF8, 0xF7, 0xF6, 0xF5,
        ]

ld2410:
  id: ld2410_dev
  uart_id: mock_uart

sensor:
  - platform: ld2410
    ld2410_id: ld2410_dev
    moving_distance:
      name: "Moving Distance"
    still_distance:
      name: "Still Distance"
    moving_energy:
      name: "Moving Energy"
    still_energy:
      name: "Still Energy"
    detection_distance:
      name: "Detection Distance"

binary_sensor:
  - platform: ld2410
    ld2410_id: ld2410_dev
    has_target:
      name: "Has Target"
    has_moving_target:
      name: "Has Moving Target"
    has_still_target:
      name: "Has Still Target"

button:
  - platform: template
    name: "Start Scenario"
    id: start_scenario_btn
    on_press:
      - lambda: 'id(mock_uart).start_scenario();'
