esphome:
  name: uart-mock-kamstrup-test
  # As this is a PollingComponent, it will start automaticly running its
  # update() and therefore quering uart_mock before the scenario started,
  # creating havoc in the state change detection. So we suspend
  # immediately and only do a one-time update when the test starts.
  on_boot:
    - priority: -100.0
      then:
        - component.suspend: sut

host:
api:
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy modbus's DEPENDENCIES = ["uart"]
# The actual UART bus used is the uart_mock component below
uart:
  baud_rate: 1200
  port: /dev/null

uart_mock:
  - id: virtual_uart_kamstrup
    baud_rate: 1200
    stop_bits: 2
    rx_full_threshold: 120
    rx_timeout: 2
    auto_start: false
    debug:
    responses:
      - expect_tx: [0x80, 0x3F, 0x10, 0x01, 0x00, 0x3C, 0xB2, 0x5F, 0x0D]
        inject_rx: [0x40, 0x3F, 0x10, 0x00, 0x3C, 0x08, 0x04, 0x42,
                    0x00, 0x00, 0x54, 0x82, 0x04, 0xDF, 0x0D]

      - expect_tx: [0x80, 0x3F, 0x10, 0x01, 0x00, 0x4A, 0xAC, 0x0E, 0x0D]
        inject_rx: [0x40, 0x3F, 0x10, 0x00, 0x4A, 0x29, 0x04, 0x00,
                    0x00, 0x00, 0x00, 0x21, 0xF0, 0x96, 0x0D]

      - expect_tx: [0x80, 0x3F, 0x10, 0x01, 0x00, 0x44, 0x4D, 0xC0, 0x0D]
        inject_rx: [0x40, 0x3F, 0x10, 0x00, 0x44, 0x28, 0x04, 0x42,
                    0x00, 0x02, 0x2B, 0xAD, 0x67, 0x75, 0x0D]

      - expect_tx: [0x80, 0x3F, 0x10, 0x01, 0x00, 0x50, 0x1F, 0x75, 0x0D]
        inject_rx: [0x40, 0x3F, 0x10, 0x00, 0x50, 0x16, 0x04, 0x41,
                    0x00, 0x00, 0x00, 0x03, 0x30, 0x23, 0x0D]

      - expect_tx: [0x80, 0x3F, 0x10, 0x01, 0x00, 0x56, 0x7F, 0xB3, 0x0D]
        inject_rx: [0x40, 0x3F, 0x10, 0x00, 0x56, 0x25, 0x02, 0x42,
                    0x14, 0x38, 0x61, 0x3D, 0x0D]

      - expect_tx: [0x80, 0x3F, 0x10, 0x01, 0x00, 0x57, 0x6F, 0x92, 0x0D]
        inject_rx: [0x40, 0x3F, 0x10, 0x00, 0x57, 0x25, 0x02, 0x42,
                    0x11, 0xE3, 0xA1, 0x7E, 0x0D]

      - expect_tx: [0x80, 0x3F, 0x10, 0x01, 0x00, 0x59, 0x8E, 0x5C, 0x0D]
        inject_rx: [0x40, 0x3F, 0x10, 0x00, 0x59, 0x26, 0x02, 0x42,
                    0x02, 0x4C, 0xDD, 0x2A, 0x0D]

sensor:
  - platform: kamstrup_kmp
    id: sut
    uart_id: virtual_uart_kamstrup
    update_interval: 60s
    heat_energy:
      name: "heat_energy"
    power:
      name: "power"
    temp1:
      name: "temperature_1"
    temp_diff:
      name: "temperature_diff"
    flow:
      name: "flow"
    volume:
      name: "volume"
    custom:
      - name: "custom_59"
        command: 0x0059

button:
  - platform: template
    name: "Start Scenario"
    id: start_scenario_btn
    on_press:
      - lambda: "id(virtual_uart_kamstrup).start_scenario();"
      # Run the sensor once.
      - component.update: sut
