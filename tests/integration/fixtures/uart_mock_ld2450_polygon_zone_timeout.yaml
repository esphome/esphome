esphome:
  name: uart-mock-ld2450-zone-timeout

host:
api:
  batch_delay: 0ms  # Disable batching to receive all state updates
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy ld2450's DEPENDENCIES = ["uart"]
# The actual UART bus used is the uart_mock component below
uart:
  baud_rate: 115200
  port: /dev/null

uart_mock:
  id: mock_uart
  baud_rate: 256000
  auto_start: false
  responses:
    # Generic ACK for any command, to unblock setup commands
    - expect_tx: [0x04, 0x03, 0x02, 0x01]
      inject_rx:
        [
          0xFD, 0xFC, 0xFB, 0xFA,
          0x04, 0x00,
          0xFF, 0x01,
          0x00, 0x00,
          0x04, 0x03, 0x02, 0x01,
        ]

  # One frame every 100 ms, as the radar sends them. Target 1 is either at (-500, 1000), inside the zone, or at
  # (300, 400), outside it. Coordinates are sign-magnitude, with the high bit set for positive values.
  injections:
    # Inside the zone
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0xF4, 0x01, 0xE8, 0x83, 0x00, 0x00, 0x40, 0x01,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x55, 0xCC,
        ]
    # Outside for one frame: radar noise that presence_timeout must hide
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0x2C, 0x81, 0x90, 0x81, 0x00, 0x00, 0x64, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x55, 0xCC,
        ]
    # Inside again: the last inside frame
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0xF4, 0x01, 0xE8, 0x83, 0x00, 0x00, 0x40, 0x01,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x55, 0xCC,
        ]
    # Outside: presence clears once presence_timeout passes
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0x2C, 0x81, 0x90, 0x81, 0x00, 0x00, 0x64, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x55, 0xCC,
        ]
    # Outside
    - delay: 100ms
