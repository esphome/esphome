esphome:
  name: api-backpressure-test

host:

api:
  # Small queue so a non-draining client blocks the send path quickly, but
  # with room (2 KB per slot) for one oversized service response to park
  max_send_queue: 4
  actions:
# GENERATED_ACTIONS

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH
    components: [sndbuf_pin_component]

# Pins the device's socket send buffers for deterministic TCP backpressure
sndbuf_pin_component:
  buffer_size: SERVER_SNDBUF

logger:
  level: DEBUG
