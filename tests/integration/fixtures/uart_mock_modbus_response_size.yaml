esphome:
  name: uart-mock-modbus-response-size

host:
api:
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy modbus's DEPENDENCIES = ["uart"]
# The actual UART bus used is the uart_mock component below
uart:
  baud_rate: 115200
  port: /dev/null

# A single mock UART that acts as a NON-CONFORMANT modbus server: it echoes back a read response with
# more data bytes than the requested register count implies. This is the case response_size exists for
# ("the server responds with more bytes than the number of registers would normally allow"). When the
# controller polls registers 0x30..0x31 (count 2), a conformant server returns 4 data bytes; this one
# returns 6, with 2 extra bytes emitted by the wide register 0x30. Layout of the 6 data bytes:
#   [0..1] register 0x30 value  = 0x1111 (4369)
#   [2..3] extra bytes the wide register 0x30 emits = 0xEEEE (must NOT be read as register 0x31)
#   [4..5] register 0x31 value  = 0x2222 (8738)
# Without response_size honored, register 0x31 is read from bytes [2..3] (0xEEEE); with it, from [4..5].
uart_mock:
  - id: virtual_uart_controller
    baud_rate: 9600
    auto_start: true
    debug:
    on_tx:
      - then:
          - uart_mock.inject_rx:
              id: virtual_uart_controller
              data: !lambda |-
                // Respond only to our read of holding registers 0x30, count 2 (addr 1, function 3).
                if (data.size() < 6 || data[0] != 0x01 || data[1] != 0x03 || data[2] != 0x00 ||
                    data[3] != 0x30 || data[4] != 0x00 || data[5] != 0x02)
                  return {};
                std::vector<uint8_t> resp = {0x01, 0x03, 0x06, 0x11, 0x11, 0xEE, 0xEE, 0x22, 0x22};
                uint16_t crc = crc16(resp.data(), resp.size());
                resp.push_back(crc & 0xFF);
                resp.push_back(crc >> 8);
                return resp;

modbus:
  - uart_id: virtual_uart_controller
    id: virtual_modbus_controller
    role: client
    turnaround_time: 10ms

modbus_controller:
  - address: 1
    modbus_id: virtual_modbus_controller
    id: modbus_controller_1
    update_interval: 1s

# Two holding-register sensors that group into one polled range (0x30..0x31). The first declares
# response_size: 4, telling the controller the device returns 4 bytes for that register, so the second
# sensor must be located 4 bytes into the response (past the 2 extra bytes), not 2.
sensor:
  - platform: modbus_controller
    modbus_controller_id: modbus_controller_1
    name: "wide_first"
    address: 0x30
    register_type: holding
    value_type: U_WORD
    response_size: 4
  - platform: modbus_controller
    modbus_controller_id: modbus_controller_1
    name: "after_wide"
    address: 0x31
    register_type: holding
    value_type: U_WORD

button:
  - platform: template
    name: "Start Scenario"
    id: start_scenario_btn
    # This test does not have anything to start (mock is autostart)
