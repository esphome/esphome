esphome:
  name: uart-mock-ld2410s-test

host:
api:
  batch_delay: 0ms  # Disable batching to receive all state updates
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy ld2410s's DEPENDENCIES = ["uart"]
# The actual UART bus used is the uart_mock component below
uart:
  baud_rate: 115200
  port: /dev/null

uart_mock:
  id: mock_uart
  baud_rate: 115200
  auto_start: false
  responses:
    # Config-mode start, acknowledged with protocol version 2 and buffer size 0x20
    - expect_tx: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFF, 0x00, 0x01, 0x00, 0x04, 0x03, 0x02, 0x01]
      inject_rx: [0xFD, 0xFC, 0xFB, 0xFA, 0x08, 0x00, 0xFF, 0x01, 0x00, 0x00, 0x02, 0x00, 0x20, 0x00, 0x04, 0x03, 0x02, 0x01]
    # Output-mode switch to minimal, acknowledged
    - expect_tx: [0xFD, 0xFC, 0xFB, 0xFA, 0x08, 0x00, 0x7A, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x04, 0x03, 0x02, 0x01]
      inject_rx: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0x7A, 0x01, 0x00, 0x00, 0x04, 0x03, 0x02, 0x01]
    # Config-mode end, acknowledged
    - expect_tx: [0xFD, 0xFC, 0xFB, 0xFA, 0x02, 0x00, 0xFE, 0x00, 0x04, 0x03, 0x02, 0x01]
      inject_rx: [0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFE, 0x01, 0x00, 0x00, 0x04, 0x03, 0x02, 0x01]
  injections:
    # Short frame, state 2 (target), distance 300 -> presence on
    - delay: 100ms
      inject_rx: [0x6E, 0x02, 0x2C, 0x01, 0x62]
    # Short frame, state 0 (no target) -> presence off
    - delay: 100ms
      inject_rx: [0x6E, 0x00, 0x00, 0x00, 0x62]
    # Standard data frame, type 1, state 2, distance 300 -> presence on
    - delay: 100ms
      inject_rx: [0xF4, 0xF3, 0xF2, 0xF1, 0x05, 0x00, 0x01, 0x02, 0x2C, 0x01, 0x00, 0xF8, 0xF7, 0xF6, 0xF5]
    # Short frame, state 1 (no target) -> presence off
    - delay: 100ms
      inject_rx: [0x6E, 0x01, 0x00, 0x00, 0x62]
    # Noise byte directly followed by a short frame, state 2 -> presence on
    - delay: 100ms
      inject_rx: [0xAA, 0x6E, 0x02, 0x2C, 0x01, 0x62]
    # Short frame, state 0 -> presence off
    - delay: 100ms
      inject_rx: [0x6E, 0x00, 0x00, 0x00, 0x62]
    # Partial standard header byte directly followed by a short frame, state 3 -> presence on
    - delay: 100ms
      inject_rx: [0xF4, 0x6E, 0x03, 0x2C, 0x01, 0x62]

ld2410s:
  id: ld2410s_dev
  uart_id: mock_uart

binary_sensor:
  - platform: ld2410s
    ld2410s_id: ld2410s_dev
    has_target:
      name: "Has Target"

button:
  - platform: template
    name: "Start Scenario"
    id: start_scenario_btn
    on_press:
      - lambda: 'id(mock_uart).start_scenario();'
