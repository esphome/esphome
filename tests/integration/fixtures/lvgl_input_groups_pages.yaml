esphome:
  name: lvgl-input-groups-pages
  on_boot:
    # Runs before LVGL's setup(), which has the lower setup priority, and after initial_focus
    - then:
        - lvgl.widget.focus:
            lvgl_id: boot_lvgl
            action: next

packages:
  lvgl_input_groups: !include
    file: INCLUDES_PATH/lvgl_input_groups.yaml
    vars:
      includes_path: INCLUDES_PATH

api:
  actions:
    - action: reset
      then:
        - lvgl.widget.hide: [button_msgbox, empty_msgbox, close_msgbox]
        - lvgl.page.show:
            id: page_a
            lvgl_id: paged_lvgl
        - lvgl.widget.focus: page_a_button
        - script.execute: report
    - action: next_page
      then:
        - lvgl.page.next:
            lvgl_id: paged_lvgl
        - script.execute: report
    - action: previous_page
      then:
        - lvgl.page.previous:
            lvgl_id: paged_lvgl
        - script.execute: report
    - action: show_page_b
      then:
        - lvgl.page.show:
            id: page_b
            lvgl_id: paged_lvgl
        - script.execute: report
    - action: focus_next
      then:
        - lvgl.widget.focus:
            lvgl_id: paged_lvgl
            action: next
        - script.execute: report
    - action: show_msgbox
      then:
        - lvgl.widget.show: button_msgbox
        - script.execute: report
    - action: hide_msgbox
      then:
        - lvgl.widget.hide: button_msgbox
        - script.execute: report
    - action: show_empty_msgbox
      then:
        - lvgl.widget.show: empty_msgbox
        - script.execute: report
    - action: hide_empty_msgbox
      then:
        - lvgl.widget.hide: empty_msgbox
        - script.execute: report
    - action: show_close_msgbox
      then:
        - lvgl.widget.show: close_msgbox
        - script.execute: report
    - action: raise_msgbox
      then:
        - lvgl.widget.set_z_index:
            id: button_msgbox
            position: top
        - script.execute: report
    - action: lower_msgbox
      then:
        - lvgl.widget.set_z_index:
            id: button_msgbox
            position: bottom
        - script.execute: report
    - action: focus_close_ok
      then:
        - lvgl.widget.focus: close_ok
        - script.execute: report
    - action: focus_msgbox_ok
      then:
        - lvgl.widget.focus: msgbox_ok
        - script.execute: report
    - action: focus_page_b_button
      then:
        - lvgl.widget.focus: page_b_button
        - script.execute: report
    - action: focus_top_button
      then:
        - lvgl.widget.focus: top_button
        - script.execute: report
    - action: focus_next_plain
      then:
        - lvgl.widget.focus:
            lvgl_id: plain_lvgl
            action: next
        - script.execute: report
    - action: next_later_page
      then:
        - lvgl.page.next:
            lvgl_id: later_lvgl
        - script.execute: report
    - action: next_keypad_page
      then:
        - lvgl.page.next:
            lvgl_id: keypad_lvgl
        - script.execute: report

    - action: menu_reset
      then:
        - lvgl.widget.hide: menu_msgbox
        - lvgl.page.show:
            id: menu_page_a
            lvgl_id: menu_lvgl
        - lvgl.widget.focus: menu_item
        - script.execute: report
    - action: menu_show_page_b
      then:
        - lvgl.page.show:
            id: menu_page_b
            lvgl_id: menu_lvgl
        - script.execute: report
    - action: menu_show_page_a
      then:
        - lvgl.page.show:
            id: menu_page_a
            lvgl_id: menu_lvgl
        - script.execute: report
    - action: menu_show_msgbox
      then:
        - lvgl.widget.show: menu_msgbox
        - script.execute: report
    - action: menu_hide_msgbox
      then:
        - lvgl.widget.hide: menu_msgbox
        - script.execute: report
    # LVGL creates the sidebar, with its back button, when the menu first gets a sidebar page
    - action: menu_show_sidebar
      then:
        - lvgl.menu.set_page:
            id: menu_widget
            page: menu_nav_page
            sidebar: true
        - script.execute: report

globals:
  - id: page_a_button_clicks
    type: int

display:
  - platform: snapshot
    id: paged_display
    auto_clear_enabled: false
    dimensions:
      width: 320
      height: 240
  - platform: snapshot
    id: plain_display
    auto_clear_enabled: false
    dimensions:
      width: 320
      height: 240
  - platform: snapshot
    id: grouped_display
    auto_clear_enabled: false
    dimensions:
      width: 320
      height: 240
  - platform: snapshot
    id: keypad_display
    auto_clear_enabled: false
    dimensions:
      width: 320
      height: 240
  - platform: snapshot
    id: later_display
    auto_clear_enabled: false
    dimensions:
      width: 320
      height: 240
  - platform: snapshot
    id: boot_display
    auto_clear_enabled: false
    dimensions:
      width: 320
      height: 240
  - platform: snapshot
    id: menu_display
    auto_clear_enabled: false
    dimensions:
      width: 320
      height: 240

binary_sensor:
  - platform: template
    id: plain_next
    name: plain_next
  - platform: template
    id: plain_enter
    name: plain_enter
  - platform: template
    id: grouped_next
    name: grouped_next
  - platform: template
    id: keypad_next
    name: keypad_next
  # Never pressed: the initial_focus tests only read where the focus is
  - platform: template
    id: idle_enter
  - platform: template
    id: idle_left
  - platform: template
    id: idle_right
  - platform: template
    id: menu_encoder_left
    name: menu_encoder_left
  - platform: template
    id: menu_encoder_right
    name: menu_encoder_right
  - platform: template
    id: menu_encoder_enter
    name: menu_encoder_enter

script:
  - id: report
    then:
      - lambda: |-
          auto name = [](lv_obj_t *obj) {
            return lvgl_test_name(obj, {
                {id(top_button), "top_button"},
                {id(bottom_button), "bottom_button"},
                {id(root_button), "root_button"},
                {id(page_a_button), "page_a_button"},
                {id(page_a_button2), "page_a_button2"},
                {id(page_b_button), "page_b_button"},
                {id(page_b_button2), "page_b_button2"},
                {id(msgbox_ok), "msgbox_ok"},
                {id(close_ok), "close_ok"},
                {id(close_cancel), "close_cancel"},
                {lv_obj_get_child(lv_msgbox_get_header(id(close_msgbox)), -1), "close_button"},
                {id(plain_button), "plain_button"},
                {id(plain_button2), "plain_button2"},
                {id(grouped_button1), "grouped_button1"},
                {id(grouped_button2), "grouped_button2"},
                {id(loose_button), "loose_button"},
                {id(keypad_root_button), "keypad_root_button"},
                {id(keypad_a_button), "keypad_a_button"},
                {id(keypad_a_button2), "keypad_a_button2"},
                {id(keypad_b_button), "keypad_b_button"},
                {id(keypad_b_button2), "keypad_b_button2"},
                {id(later_a_button), "later_a_button"},
                {id(later_b_button), "later_b_button"},
                {id(later_b_button2), "later_b_button2"},
                {id(boot_a_button), "boot_a_button"},
                {id(boot_a_button2), "boot_a_button2"},
                {id(boot_a_button3), "boot_a_button3"},
                {id(boot_b_button), "boot_b_button"},
                {id(menu_item), "item"},
                {id(menu_nav_button), "nav_button"},
                {lv_menu_get_sidebar_header_back_button(id(menu_widget)), "sidebar_back_button"},
                {id(menu_page_b_button), "page_b_button"},
            });
          };
          lv_indev_t *encoder = id(paged_encoder)->get_drv();
          ESP_LOGI("report",
                   "focus_report page=%u encoder=%s encoder_pressed=%d close_msgbox_hidden=%d "
                   "page_a_button_pressed=%d page_a_button_clicks=%d",
                   (unsigned) id(paged_lvgl).get_current_page(), name(lvgl_test_focused(encoder)),
                   lvgl_test_pressed(encoder), lv_obj_has_flag(lv_obj_get_parent(id(close_msgbox)), LV_OBJ_FLAG_HIDDEN),
                   lv_obj_has_state(id(page_a_button), LV_STATE_PRESSED), id(page_a_button_clicks));
          lv_indev_t *plain = id(plain_keypad)->get_drv();
          lv_indev_t *grouped = id(grouped_keypad)->get_drv();
          lv_indev_t *keypad = id(page_keypad)->get_drv();
          ESP_LOGI("report",
                   "instances_report plain=%s plain_pressed=%d grouped=%s grouped_pressed=%d keypad_page=%u keypad=%s "
                   "keypad_pressed=%d",
                   name(lvgl_test_focused(plain)), lvgl_test_pressed(plain), name(lvgl_test_focused(grouped)),
                   lvgl_test_pressed(grouped), (unsigned) id(keypad_lvgl).get_current_page(),
                   name(lvgl_test_focused(keypad)), lvgl_test_pressed(keypad));
          ESP_LOGI("report", "initial_report later_page=%u later=%s boot=%s",
                   (unsigned) id(later_lvgl).get_current_page(),
                   name(lvgl_test_focused(id(later_encoder)->get_drv())),
                   name(lvgl_test_focused(id(boot_encoder)->get_drv())));
          lv_indev_t *menu = id(menu_encoder)->get_drv();
          ESP_LOGI("report", "menu_report page=%u encoder=%s encoder_pressed=%d",
                   (unsigned) id(menu_lvgl).get_current_page(), name(lvgl_test_focused(menu)), lvgl_test_pressed(menu));

lvgl:
  - id: paged_lvgl
    displays: paged_display
    encoders:
      id: paged_encoder
      enter_button: encoder_enter
      sensor:
        left_button: encoder_left
        right_button: encoder_right
      initial_focus: top_button
    # On the screen that the pages replace, so never shown
    widgets:
      - button:
          id: root_button
    top_layer:
      widgets:
        - button:
            id: top_button
            align: bottom_left
    bottom_layer:
      widgets:
        - button:
            id: bottom_button
            align: top_left
    msgboxes:
      - id: button_msgbox
        title: Buttons
        close_button: false
        buttons:
          - id: msgbox_ok
            text: OK
      - id: empty_msgbox
        title: Empty
        close_button: false
      - id: close_msgbox
        title: Close
        close_button: true
        buttons:
          - id: close_ok
            text: OK
          - id: close_cancel
            text: Cancel
    pages:
      - id: page_a
        widgets:
          - button:
              id: page_a_button
              on_click:
                - lambda: id(page_a_button_clicks)++;
          - button:
              id: page_a_button2
              y: 50
      - id: page_b
        widgets:
          - button:
              id: page_b_button
          - button:
              id: page_b_button2
              y: 50

  - id: plain_lvgl
    displays: plain_display
    keypads:
      - id: plain_keypad
        enter: plain_enter
        next: plain_next
    widgets:
      - button:
          id: plain_button
          on_press:
            - logger.log: "PRESSED plain_button"
      - button:
          id: plain_button2
          y: 50

  # A keypad with a group of its own stays on it
  - id: grouped_lvgl
    displays: grouped_display
    keypads:
      - id: grouped_keypad
        group: grouped
        next: grouped_next
    widgets:
      - button:
          id: grouped_button1
          group: grouped
      - button:
          id: grouped_button2
          group: grouped
          y: 50
      - button:
          id: loose_button
          y: 100

  # The keypad is the only input of its instance, and it has no group of its own
  - id: keypad_lvgl
    displays: keypad_display
    keypads:
      - id: page_keypad
        next: keypad_next
    # On the screen that the pages replace, so never shown
    widgets:
      - button:
          id: keypad_root_button
    pages:
      - id: keypad_page_a
        widgets:
          - button:
              id: keypad_a_button
          - button:
              id: keypad_a_button2
              y: 50
      - id: keypad_page_b
        widgets:
          - button:
              id: keypad_b_button
          - button:
              id: keypad_b_button2
              y: 50

  # initial_focus on a page that is not shown first
  - id: later_lvgl
    displays: later_display
    encoders:
      id: later_encoder
      enter_button: idle_enter
      sensor:
        left_button: idle_left
        right_button: idle_right
      initial_focus: later_b_button2
    pages:
      - id: later_page_a
        widgets:
          - button:
              id: later_a_button
      - id: later_page_b
        widgets:
          - button:
              id: later_b_button
          - button:
              id: later_b_button2
              y: 50

  # on_boot moves the focus away from initial_focus, before LVGL's setup()
  - id: boot_lvgl
    displays: boot_display
    encoders:
      id: boot_encoder
      enter_button: idle_enter
      sensor:
        left_button: idle_left
        right_button: idle_right
      initial_focus: boot_a_button2
    pages:
      - id: boot_page_a
        widgets:
          - button:
              id: boot_a_button
          - button:
              id: boot_a_button2
              y: 50
          - button:
              id: boot_a_button3
              y: 100
      - id: boot_page_b
        widgets:
          - button:
              id: boot_b_button

  # A menu on a page whose group is not the last default group from codegen. The menu has no sidebar until the
  # test adds one.
  - id: menu_lvgl
    displays: menu_display
    encoders:
      id: menu_encoder
      enter_button: menu_encoder_enter
      sensor:
        left_button: menu_encoder_left
        right_button: menu_encoder_right
    msgboxes:
      - id: menu_msgbox
        title: Buttons
        close_button: false
        buttons:
          - text: OK
    pages:
      - id: menu_page_a
        widgets:
          - menu:
              id: menu_widget
              root_page: menu_root_page
              root_back_btn: enabled
              pages:
                - id: menu_root_page
                  widgets:
                    - button:
                        id: menu_item
                - id: menu_nav_page
                  widgets:
                    - button:
                        id: menu_nav_button
      - id: menu_page_b
        widgets:
          - button:
              id: menu_page_b_button
