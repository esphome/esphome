esphome:
  name: test-delta-filters

host:
api:
  batch_delay: 0ms  # Disable batching to receive all state updates
logger:
  level: DEBUG

sensor:
  - platform: template
    name: "Source Sensor 1"
    id: source_sensor_1
    accuracy_decimals: 1

  - platform: template
    name: "Source Sensor 2"
    id: source_sensor_2
    accuracy_decimals: 1

  - platform: template
    name: "Source Sensor 3"
    id: source_sensor_3
    accuracy_decimals: 1

  - platform: template
    name: "Source Sensor 4"
    id: source_sensor_4
    accuracy_decimals: 1

  - platform: template
    name: "Source Sensor 5"
    id: source_sensor_5
    accuracy_decimals: 1

  - platform: template
    name: "Source Sensor 6"
    id: source_sensor_6
    accuracy_decimals: 1

  - platform: template
    name: "Source Sensor 7"
    id: source_sensor_7
    accuracy_decimals: 1

  - platform: template
    name: "Source Sensor 8"
    id: source_sensor_8
    accuracy_decimals: 1

  - platform: template
    name: "Source Sensor 9"
    id: source_sensor_9
    accuracy_decimals: 1

  - platform: template
    name: "Inf Done"
    id: inf_done
    accuracy_decimals: 1

  - platform: copy
    source_id: source_sensor_1
    name: "Filter Min"
    id: filter_min
    filters:
      - delta:
          min_value: 10

  - platform: copy
    source_id: source_sensor_2
    name: "Filter Max"
    id: filter_max
    filters:
      - delta:
          max_value: 10

  - platform: copy
    source_id: source_sensor_3
    id: test_3_baseline
    filters:
      - median:
          window_size: 6
          send_every: 1
          send_first_at: 1

  - platform: copy
    source_id: source_sensor_3
    name: "Filter Baseline Max"
    id: filter_baseline_max
    filters:
      - delta:
          max_value: 10
          baseline: !lambda return id(test_3_baseline).state;

  - platform: copy
    source_id: source_sensor_4
    name: "Filter Zero Delta"
    id: filter_zero_delta
    filters:
      - delta: 0

  - platform: copy
    source_id: source_sensor_5
    name: "Filter Percentage"
    id: filter_percentage
    filters:
      - delta: 50%

  - platform: copy
    source_id: source_sensor_6
    name: "Filter NaN"
    id: filter_nan
    filters:
      - delta: 0

  - platform: copy
    source_id: source_sensor_7
    name: "Filter Min Max"
    id: filter_min_max
    filters:
      - delta:
          min_value: 2
          max_value: 10

  - platform: copy
    source_id: source_sensor_8
    name: "Filter Percentage Max"
    id: filter_percentage_max
    filters:
      - delta:
          max_value: 50%

  # After an infinite value, an absolute min with a percentage max drops every later value
  - platform: copy
    source_id: source_sensor_9
    name: "Filter Inf Reference"
    id: filter_inf_reference
    filters:
      - delta:
          min_value: 1
          max_value: 50%

script:
  - id: test_filter_min
    then:
      - sensor.template.publish:
          id: source_sensor_1
          state: 1.0
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_1
          state: 5.0  # Filtered out
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_1
          state: 12.0
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_1
          state: 8.0  # Filtered out
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_1
          state: -2.0

  - id: test_filter_max
    then:
      - sensor.template.publish:
          id: source_sensor_2
          state: 1.0
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_2
          state: 5.0
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_2
          state: 40.0  # Filtered out
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_2
          state: 10.0
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_2
          state: -40.0  # Filtered out

  - id: test_filter_baseline_max
    then:
      - sensor.template.publish:
          id: source_sensor_3
          state: 1.0
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_3
          state: 2.0
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_3
          state: 3.0
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_3
          state: 40.0  # Filtered out
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_3
          state: 20.0  # Filtered out
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_3
          state: 20.0

  - id: test_filter_zero_delta
    then:
      - sensor.template.publish:
          id: source_sensor_4
          state: 1.0
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_4
          state: 1.0  # Filtered out
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_4
          state: 2.0

  - id: test_filter_percentage
    then:
      - sensor.template.publish:
          id: source_sensor_5
          state: 100.0
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_5
          state: 120.0  # Filtered out (delta=20, need >50)
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_5
          state: 160.0  # Passes (delta=60 > 50% of 100=50)
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_5
          state: 200.0  # Filtered out (delta=40, need >50% of 160=80)
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_5
          state: 250.0  # Passes (delta=90 > 80)

  - id: test_filter_nan
    then:
      - sensor.template.publish:
          id: source_sensor_6
          state: 1.0
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_6
          state: !lambda "return NAN;"
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_6
          state: !lambda "return NAN;"  # Filtered out
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_6
          state: 2.0

  - id: test_filter_min_max
    then:
      - sensor.template.publish:
          id: source_sensor_7
          state: 0.0
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_7
          state: 1.0  # Filtered out (delta=1, need >2)
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_7
          state: 2.0  # Filtered out (delta=2, need >2)
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_7
          state: 12.0  # Filtered out (delta=12, need <=10)
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_7
          state: 10.0  # Passes (delta=10)
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_7
          state: 15.0

  - id: test_filter_percentage_max
    then:
      - sensor.template.publish:
          id: source_sensor_8
          state: 100.0
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_8
          state: 160.0  # Filtered out (delta=60, need <=50)
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_8
          state: 150.0  # Passes (delta=50)
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_8
          state: 150.0  # Filtered out (delta=0, need >0)
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_8
          state: 75.0  # Passes (delta=75 <= 50% of 150)

  - id: test_filter_inf_reference
    then:
      - sensor.template.publish:
          id: source_sensor_9
          state: !lambda "return INFINITY;"
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_9
          state: 5.0  # Filtered out
      - delay: 20ms
      - sensor.template.publish:
          id: source_sensor_9
          state: 100.0  # Filtered out
      - delay: 20ms
      - sensor.template.publish:
          id: inf_done
          state: 1.0

button:
  - platform: template
    name: "Test Filter Min"
    id: btn_filter_min
    on_press:
      - script.execute: test_filter_min

  - platform: template
    name: "Test Filter Max"
    id: btn_filter_max
    on_press:
      - script.execute: test_filter_max

  - platform: template
    name: "Test Filter Baseline Max"
    id: btn_filter_baseline_max
    on_press:
      - script.execute: test_filter_baseline_max

  - platform: template
    name: "Test Filter Zero Delta"
    id: btn_filter_zero_delta
    on_press:
      - script.execute: test_filter_zero_delta

  - platform: template
    name: "Test Filter Percentage"
    id: btn_filter_percentage
    on_press:
      - script.execute: test_filter_percentage

  - platform: template
    name: "Test Filter NaN"
    id: btn_filter_nan
    on_press:
      - script.execute: test_filter_nan

  - platform: template
    name: "Test Filter Min Max"
    id: btn_filter_min_max
    on_press:
      - script.execute: test_filter_min_max

  - platform: template
    name: "Test Filter Percentage Max"
    id: btn_filter_percentage_max
    on_press:
      - script.execute: test_filter_percentage_max

  - platform: template
    name: "Test Filter Inf Reference"
    id: btn_filter_inf_reference
    on_press:
      - script.execute: test_filter_inf_reference
