esphome:
  name: host-write-after-close

host:

api:
  actions:
    - action: write_twice
      then:
        - lambda: |-
            ESP_LOGI("test", "Holding the loop");
            // Hold the loop so the peer's close lands before the link reads it.
            delay(300);
            id(tcp_uart_1).write_byte('a');
            id(tcp_uart_1).flush();
            // The closed peer answers the first byte with a reset.
            delay(50);
            id(tcp_uart_1).write_byte('b');
            id(tcp_uart_1).flush();

logger:
  level: INFO

tcp_uart:
  - id: tcp_uart_1
    host: 127.0.0.1
    port: 18126
    reconnect_interval: 60s
