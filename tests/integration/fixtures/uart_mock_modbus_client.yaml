esphome:
  name: uart-mock-modbus-client

host:
api:
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy modbus's DEPENDENCIES = ["uart"]
# The actual UART bus used is the uart_mock component below
uart:
  baud_rate: 115200
  port: /dev/null

uart_mock:
  - id: virtual_uart_server
    baud_rate: 9600
    auto_start: true
    debug:
    on_tx:
      - then:
          - uart_mock.inject_rx:
              id: virtual_uart_client
              data: !lambda return data;
  - id: virtual_uart_client
    baud_rate: 9600
    auto_start: true
    debug:
    on_tx:
      - then:
          - uart_mock.inject_rx:
              id: virtual_uart_server
              data: !lambda return data;

modbus:
  - uart_id: virtual_uart_server
    id: virtual_modbus_server
    role: server
  - uart_id: virtual_uart_client
    id: virtual_modbus_client
    role: client
    turnaround_time: 10ms

modbus_server:
  - address: 1
    modbus_id: virtual_modbus_server
    id: modbus_server_1
    registers:
      - address: 0x10
        value_type: U_WORD
        read_lambda: return 1234;

# The ad-hoc client: send a raw read-holding PDU from an automation and decode the reply in on_response.
# `item` is not involved here - the client IS the device, and its single on_response handler receives every
# reply (with the request PDU so a shared handler could tell them apart).
modbus_client:
  - id: adhoc_client
    modbus_id: virtual_modbus_client
    address: 1
    on_response:
      then:
        - lambda: |-
            // Read-holding reply PDU: [0x03, byte_count, hi, lo, ...]. Publish the first register value.
            if (response.size() >= 4) {
              id(adhoc_value).publish_state((response[2] << 8) | response[3]);
            }
    on_no_response:
      then:
        - logger.log: "modbus_client: no reply"

sensor:
  - platform: template
    name: "adhoc_value"
    id: adhoc_value

button:
  - platform: template
    name: "Start Scenario"
    id: start_scenario_btn
    on_press:
      # Read holding register 0x10 (count 1) from the server at address 1.
      - modbus_client.send:
          id: adhoc_client
          pdu: [0x03, 0x00, 0x10, 0x00, 0x01]
