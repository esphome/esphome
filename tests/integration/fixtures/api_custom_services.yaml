esphome:
  name: api-custom-services-test
host:

# This is required for CustomAPIDevice to work
api:
  custom_services: true
  homeassistant_states: true
  # Also test that YAML services still work
  actions:
    - action: test_yaml_service
      then:
        - logger.log: "YAML service called"

    # Test YAML service with arguments (tests UserServiceBase with const char* array)
    - action: test_yaml_service_with_args
      variables:
        my_int: int
        my_string: string
      then:
        - logger.log:
            format: "YAML service with args: %d, %s"
            args: [my_int, my_string.c_str()]

    # Test YAML service with multiple arguments
    - action: test_yaml_service_many_args
      variables:
        arg1: int
        arg2: float
        arg3: bool
        arg4: string
      then:
        - logger.log:
            format: "YAML service many args: %d, %.2f, %d, %s"
            args: [arg1, arg2, arg3, arg4.c_str()]

    # Array arguments, read in place
    - action: test_yaml_service_arrays
      variables:
        bool_arr: bool[]
        int_arr: int[]
        float_arr: float[]
        string_arr: string[]
      then:
        - logger.log:
            format: "YAML service arrays: %d %d, %ld %ld %ld, %.1f, %s %s"
            args:
              - bool_arr[0]
              - bool_arr[1]
              - (long) int_arr[0]
              - (long) int_arr[1]
              - (long) int_arr[2]
              - float_arr[0]
              - string_arr[0].c_str()
              - string_arr[1].c_str()

    # Arguments still read after a delay
    - action: test_yaml_service_delay
      variables:
        name: string
        int_arr: int[]
      then:
        - logger.log: "YAML service delay before"
        - delay: 10ms
        - logger.log:
            format: "YAML service delay after: %s %zu %ld"
            args:
              - name.c_str()
              - int_arr.size()
              - (long) int_arr[1]

    # Each lambda gets its own copy of the arguments
    - action: test_yaml_service_by_value
      variables:
        x: int
      then:
        - lambda: |-
            x *= 2;
            ESP_LOGI("test", "YAML service by value first: %d", (int) x);
        - lambda: |-
            ESP_LOGI("test", "YAML service by value second: %d", (int) (x *= 3));
        - logger.log:
            format: "YAML service by value last: %d"
            args: [(int) x]

logger:
  level: DEBUG

# External component that uses CustomAPIDevice
external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH
    components: [custom_api_device_component]

custom_api_device_component:
