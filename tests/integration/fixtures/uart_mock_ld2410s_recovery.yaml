esphome:
  name: uart-mock-ld2410s-recovery

host:
api:
  batch_delay: 0ms  # Disable batching to receive all state updates
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy ld2410s's DEPENDENCIES = ["uart"]
# The actual UART bus used is the uart_mock component below
uart:
  baud_rate: 115200
  port: /dev/null

# No responses: the init commands go unanswered, so the test also covers the resend and give-up path;
# this does not affect receiving data frames
uart_mock:
  id: mock_uart
  baud_rate: 115200
  auto_start: false
  injections:
    # Short frame, state 2 -> presence on (baseline)
    - delay: 100ms
      inject_rx: [0x6E, 0x02, 0x2C, 0x01, 0x62]
    # Standard header with a 255 byte length field (over the 96 byte buffer), three payload bytes,
    # then a short frame, state 0 -> frame dropped, presence off
    - delay: 100ms
      inject_rx: [0xF4, 0xF3, 0xF2, 0xF1, 0xFF, 0x00, 0x01, 0x02, 0x03, 0x6E, 0x00, 0x00, 0x00, 0x62]
    # Standard frame declaring 5 payload bytes but carrying 3, then a short frame, state 2: the short
    # frame is read as the rest of the declared length, so the frame stays one byte short
    - delay: 100ms
      inject_rx: [0xF4, 0xF3, 0xF2, 0xF1, 0x05, 0x00, 0x01, 0x02, 0x2C, 0x6E, 0x02, 0x2C, 0x01, 0x62]
    # Short frame, state 0: its first byte completes the truncated frame (footer mismatch), the rest
    # is dropped as noise -> no change
    - delay: 100ms
      inject_rx: [0x6E, 0x00, 0x00, 0x00, 0x62]
    # Short frame, state 2 -> presence on
    - delay: 100ms
      inject_rx: [0x6E, 0x02, 0x2C, 0x01, 0x62]
    # Command frame with zeros where the footer belongs, then a short frame, state 0 -> presence off
    - delay: 100ms
      inject_rx:
        [
          0xFD, 0xFC, 0xFB, 0xFA, 0x04, 0x00, 0xFE, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x6E, 0x00,
          0x00, 0x00, 0x62,
        ]
    # 100 bytes that never start a header, then a short frame, state 2 -> presence on
    - delay: 100ms
      inject_rx:
        [
          0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55,
          0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55,
          0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55,
          0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55,
          0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55,
          0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55, 0x55,
          0x55, 0x55, 0x55, 0x55, 0x6E, 0x02, 0x2C, 0x01, 0x62,
        ]
    # Short frame, state 0 -> presence off
    - delay: 100ms
      inject_rx: [0x6E, 0x00, 0x00, 0x00, 0x62]
    # Standard frame of the largest size that fits (86 byte payload: type 1, state 2, distance 300,
    # 82 padding bytes) -> presence on
    - delay: 100ms
      inject_rx:
        [
          0xF4, 0xF3, 0xF2, 0xF1, 0x56, 0x00, 0x01, 0x02, 0x2C, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xF8, 0xF7, 0xF6, 0xF5,
        ]
    # Short frame, state 0 -> presence off
    - delay: 100ms
      inject_rx: [0x6E, 0x00, 0x00, 0x00, 0x62]

ld2410s:
  id: ld2410s_dev
  uart_id: mock_uart

binary_sensor:
  - platform: ld2410s
    ld2410s_id: ld2410s_dev
    has_target:
      name: "Has Target"

button:
  - platform: template
    name: "Start Scenario"
    id: start_scenario_btn
    on_press:
      - lambda: 'id(mock_uart).start_scenario();'
