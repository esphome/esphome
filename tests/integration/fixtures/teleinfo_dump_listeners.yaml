esphome:
  name: teleinfo-dump-listeners

host:
api:
logger:
  level: DEBUG

uart:
  baud_rate: 9600
  port: /dev/null
  data_bits: 7
  parity: EVEN

teleinfo:
  update_interval: 1h

sensor:
  - platform: teleinfo
    name: Energy Index
    tag_name: EAST
  - platform: teleinfo
    name: Current
    tag_name: IRMS1

text_sensor:
  - platform: teleinfo
    name: Meter Address
    tag_name: ADSC
