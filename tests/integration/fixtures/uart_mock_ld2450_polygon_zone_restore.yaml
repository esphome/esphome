esphome:
  name: uart-mock-ld2450-zone-restore

host:
api:
  batch_delay: 0ms
logger:
  level: DEBUG

preferences:
  flash_write_interval: 0s

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy ld2450's DEPENDENCIES = ["uart"]
# The actual UART bus used is the uart_mock component below
uart:
  baud_rate: 115200
  port: /dev/null

uart_mock:
  id: mock_uart
  baud_rate: 256000
  responses:
    # Generic ACK for any command, to unblock setup commands
    - expect_tx: [0x04, 0x03, 0x02, 0x01]
      inject_rx:
        [
          0xFD, 0xFC, 0xFB, 0xFA,
          0x04, 0x00,
          0xFF, 0x01,
          0x00, 0x00,
          0x04, 0x03, 0x02, 0x01,
        ]

ld2450:
  id: ld2450_dev
  uart_id: mock_uart

text:
  - platform: ld2450
    ld2450_id: ld2450_dev
    polygon_zones:
      - id: restore_zone
        name: "Restore Zone Polygon"

binary_sensor:
  - platform: ld2450
    ld2450_id: ld2450_dev
    polygon_zones:
      - polygon_zone_id: restore_zone
        name: "Restore Zone Presence"
