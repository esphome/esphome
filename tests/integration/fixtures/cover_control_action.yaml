esphome:
  name: cover-control-action-test
host:
api:
logger:
  level: DEBUG

globals:
  - id: test_position
    type: float
    initial_value: "0.42"

cover:
  - platform: template
    name: "Test Cover"
    id: test_cover
    has_position: true
    optimistic: true
    assumed_state: true
    open_action:
      - cover.template.publish:
          id: test_cover
          position: 1.0
    close_action:
      - cover.template.publish:
          id: test_cover
          position: 0.0
    stop_action:
      - cover.template.publish:
          id: test_cover
          current_operation: IDLE
    tilt_action:
      - lambda: |-
          // Manually set tilt and publish
          id(test_cover).tilt = tilt;
          id(test_cover).publish_state();

button:
  # Test 1: cover.control with position only (mask 0b010 = 2)
  - platform: template
    id: btn_position
    name: "Set Position"
    on_press:
      - cover.control:
          id: test_cover
          position: 50%

  # Test 2: cover.control with tilt only (mask 0b100 = 4)
  - platform: template
    id: btn_tilt
    name: "Set Tilt"
    on_press:
      - cover.control:
          id: test_cover
          tilt: 75%

  # Test 3: cover.control with position + tilt (mask 0b110 = 6)
  - platform: template
    id: btn_pos_tilt
    name: "Set Pos Tilt"
    on_press:
      - cover.control:
          id: test_cover
          position: 25%
          tilt: 30%

  # Test 4: cover.control with state alias (sets position bit via CONF_STATE)
  - platform: template
    id: btn_open_state
    name: "Open State"
    on_press:
      - cover.control:
          id: test_cover
          state: OPEN

  # Test 5: cover.control with lambda position (exercises lambda path)
  - platform: template
    id: btn_lambda_position
    name: "Lambda Position"
    on_press:
      - cover.control:
          id: test_cover
          position: !lambda "return id(test_position);"

  # Test 6: cover.template.publish position only (mask 0b001)
  - platform: template
    id: btn_publish_pos
    name: "Publish Pos"
    on_press:
      - cover.template.publish:
          id: test_cover
          position: 0.6

  # Test 7: cover.template.publish current_operation only (mask 0b100)
  - platform: template
    id: btn_publish_op
    name: "Publish Op"
    on_press:
      - cover.template.publish:
          id: test_cover
          current_operation: OPENING

  # Test 8: cover.control with stop only (mask 0b001 = 1) — runs after
  # Publish Op so we can verify current_operation transitions OPENING -> IDLE
  - platform: template
    id: btn_stop
    name: "Stop Cover"
    on_press:
      - cover.control:
          id: test_cover
          stop: true
