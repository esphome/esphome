ld2450:
  id: ld2450_dev
  uart_id: mock_uart
  link_timeout: 30s  # Frames pause for longer than the default

text_sensor:
  - platform: ld2450
    ld2450_id: ld2450_dev
    target_1:
      xy:
        name: "Target 1 XY"
        # The default filters, which publish at most once per second
    target_2:
      xy:
        name: "Target 2 XY"
        filters:
          - map:
              - NA -> Away

button:
  - platform: ld2450
    ld2450_id: ld2450_dev
    xy_unfiltered:
      name: "XY Unfiltered"
  - platform: template
    name: "Start Scenario"
    id: start_scenario_btn
    on_press:
      - lambda: 'id(mock_uart).start_scenario();'
