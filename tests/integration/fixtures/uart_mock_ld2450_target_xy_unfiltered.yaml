esphome:
  name: uart-mock-ld2450-xy-unfiltered

host:
api:
  batch_delay: 0ms  # Disable batching to receive all state updates
logger:

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy ld2450's DEPENDENCIES = ["uart"]
# The actual UART bus used is the uart_mock component below
uart:
  baud_rate: 115200
  port: /dev/null

uart_mock:
  id: mock_uart
  baud_rate: 256000
  auto_start: false
  responses:
    # Generic ACK for any command, to unblock setup commands
    - expect_tx: [0x04, 0x03, 0x02, 0x01]
      inject_rx:
        [
          0xFD, 0xFC, 0xFB, 0xFA,
          0x04, 0x00,
          0xFF, 0x01,
          0x00, 0x00,
          0x04, 0x03, 0x02, 0x01,
        ]

  # Target 1 moves one step per frame (100 ms apart; coordinates are sign-magnitude, with the high bit set for
  # positive values). Times are from the start of the scenario:
  # 0.1 s: 4 positions (A), 11 s: 4 positions (B), 18.5 s: 4 positions (C), 21 s: 2 positions (D), 22.5 s: it leaves
  # Target 2 is seen in the first 2 frames, and gone in the next ones
  injections:
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0x58, 0x02, 0xE8, 0x83, 0x00, 0x00, 0x64, 0x00,
          0xC8, 0x80, 0xD0, 0x87, 0x00, 0x00, 0x64, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x55, 0xCC
        ]
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0xF4, 0x01, 0x1A, 0x84, 0x00, 0x00, 0x64, 0x00,
          0x18, 0x81, 0xEE, 0x87, 0x00, 0x00, 0x64, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x55, 0xCC
        ]
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0x90, 0x01, 0x4C, 0x84, 0x00, 0x00, 0x64, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x55, 0xCC
        ]
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0x2C, 0x01, 0x7E, 0x84, 0x00, 0x00, 0x64, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x55, 0xCC
        ]
    - delay: 10600ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0xC8, 0x00, 0xB0, 0x84, 0x00, 0x00, 0x64, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
