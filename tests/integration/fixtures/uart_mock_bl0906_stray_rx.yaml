esphome:
  name: uart-mock-bl0906-stray-rx

host:
api:
  batch_delay: 0ms # Disable batching to receive all state updates
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy DEPENDENCIES = ["uart"]
uart:
  baud_rate: 9600
  port: /dev/null

# A model of a BL0906 that answers register reads. The first temperature answer carries one stray
# trailing byte, which the component must drain before the voltage read in a later stage of the cycle
uart_mock:
  id: mock_uart
  baud_rate: 19200
  on_tx:
    - then:
        - lambda: |-
            // The read command and the register address arrive as two writes of one byte each
            static bool read_pending = false;
            static bool stray_sent = false;
            if (data.size() != 1)
              return;
            if (!read_pending) {
              read_pending = data[0] == 0x35;
              return;
            }
            read_pending = false;
            const uint8_t address = data[0];
            uint32_t raw;
            switch (address) {
              case 0x5E:  // temperature: (300 - 64) * 12.5 / 59 - 40 = 10 C
                raw = 300;
                break;
              case 0x16:  // voltage
                raw = 0x2A1B3C;
                break;
              default:
                return;
            }
            const uint8_t l = raw & 0xFF, m = (raw >> 8) & 0xFF, h = (raw >> 16) & 0xFF;
            std::vector<uint8_t> reply{l, m, h, static_cast<uint8_t>((address + l + m + h) ^ 0xFF)};
            if (address == 0x5E && !stray_sent) {
              stray_sent = true;
              reply.push_back(0xAA);
            }
            id(mock_uart).inject_to_rx_buffer(reply);

sensor:
  - platform: bl0906
    uart_id: mock_uart
    update_interval: 1s
    temperature:
      name: Temperature
    voltage:
      name: Voltage
