ld2450:
  id: ld2450_dev
  uart_id: mock_uart

# Only has_target: no sensor platform and no presence_timeout number
binary_sensor:
  - platform: ld2450
    ld2450_id: ld2450_dev
    has_target:
      name: "Has Target"

button:
  - platform: template
    name: "Start Scenario"
    id: start_scenario_btn
    on_press:
      - lambda: 'id(mock_uart).start_scenario();'
