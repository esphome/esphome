esphome:
  name: scheduler-delay-failed

host:
api:
logger:
  level: DEBUG

globals:
  - id: started
    type: bool
    restore_value: false
    initial_value: "false"

# The interval fires with itself as the current component, schedules a delay, then marks itself
# failed. The delay continuation must still fire: a failed component must not drop an
# already-scheduled delay, because the SELF_POINTER scheduler item has no owning component.
interval:
  - interval: 100ms
    id: host_interval
    then:
      - if:
          condition:
            lambda: "return !id(started);"
          then:
            - lambda: |-
                id(started) = true;
                id(host_interval)->mark_failed();
            - delay: 200ms
            - logger.log: "DELAY_FIRED_AFTER_FAIL"
