esphome:
  name: tcp-uart-noise-test

host:

api:

logger:
  level: DEBUG

tcp_uart:
  # An encrypted pair. The server closes a session after 3s without traffic;
  # the client then connects again.
  - id: inbound
    role: server
    port: 18130
    timeout: 3s
    encryption:
      key: "dGNwX3VhcnQgbm9pc2UgdGVzdCBsaW5rIGtleSAxMjM="
  - id: outbound
    host: 127.0.0.1
    port: 18130
    reconnect_interval: 1s
    encryption:
      key: "dGNwX3VhcnQgbm9pc2UgdGVzdCBsaW5rIGtleSAxMjM="
  # The client holds another key.
  - id: locked
    role: server
    port: 18131
    encryption:
      key: "bG9ja2VkIHNlcnZlciBrZXkgZm9yIHRoZSBub2lzZSE="
  - id: wrong_key
    host: 127.0.0.1
    port: 18131
    reconnect_interval: 1s
    encryption:
      key: "d3Jvbmcga2V5IGZvciB0aGUgbG9ja2VkIHNlcnZlciE="
  # A plaintext peer from the test.
  - id: sealed
    role: server
    port: 18132
    encryption:
      key: "c2VhbGVkIHNlcnZlciBrZXkgZm9yIHRoZSBub2lzZSE="

interval:
  # Echoes what the client reads.
  - interval: 20ms
    then:
      - lambda: |-
          uint8_t buf[64];
          size_t n = std::min<size_t>(id(outbound).available(), sizeof(buf));
          if (n != 0 && id(outbound).read_array(buf, n)) {
            id(outbound).write_array(buf, n);
          }
  # Sends 512 bytes, more than one frame, into each new session and checks the echo.
  - interval: 20ms
    then:
      - lambda: |-
          static bool was_up = false;
          static size_t got = 0;
          bool up = id(inbound).is_connected();
          if (up && !was_up) {
            uint8_t data[512];
            for (size_t i = 0; i < sizeof(data); i++) {
              data[i] = static_cast<uint8_t>(i);
            }
            id(inbound).write_array(data, sizeof(data));
            got = 0;
          }
          was_up = up;
          uint8_t b;
          while (id(inbound).read_byte(&b)) {
            if (b != static_cast<uint8_t>(got)) {
              ESP_LOGE("echo", "Echo mismatch at byte %u", static_cast<unsigned>(got));
            }
            if (++got == 512) {
              ESP_LOGI("echo", "Echo complete");
            }
          }
