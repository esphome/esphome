esphome:
  name: uart-mock-ld2450-target-xy

host:
api:
  batch_delay: 0ms  # Disable batching to receive all state updates
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Dummy uart entry to satisfy ld2450's DEPENDENCIES = ["uart"]
# The actual UART bus used is the uart_mock component below
uart:
  baud_rate: 115200
  port: /dev/null

uart_mock:
  id: mock_uart
  baud_rate: 256000
  auto_start: false
  responses:
    # Generic ACK for any command, to unblock setup commands
    - expect_tx: [0x04, 0x03, 0x02, 0x01]
      inject_rx:
        [
          0xFD, 0xFC, 0xFB, 0xFA,
          0x04, 0x00,
          0xFF, 0x01,
          0x00, 0x00,
          0x04, 0x03, 0x02, 0x01,
        ]

  # One frame every 100 ms, as the radar sends them. Coordinates are sign-magnitude, with the high bit set for
  # positive values.
  injections:
    # Targets 1 and 2 move, one step per frame. Target 3 moves for 3 frames, then leaves while its
    # later positions are still held back by the throttle
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0x58, 0x02, 0xE8, 0x83, 0x00, 0x00, 0x64, 0x00,
          0xC8, 0x80, 0xD0, 0x87, 0x00, 0x00, 0x64, 0x00,
          0x2C, 0x01, 0xB8, 0x8B, 0x00, 0x00, 0x64, 0x00,
          0x55, 0xCC,
        ]
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0xF4, 0x01, 0x1A, 0x84, 0x00, 0x00, 0x64, 0x00,
          0x18, 0x81, 0xEE, 0x87, 0x00, 0x00, 0x64, 0x00,
          0xFA, 0x00, 0xEA, 0x8B, 0x00, 0x00, 0x64, 0x00,
          0x55, 0xCC,
        ]
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0x90, 0x01, 0x4C, 0x84, 0x00, 0x00, 0x64, 0x00,
          0x68, 0x81, 0x0C, 0x88, 0x00, 0x00, 0x64, 0x00,
          0xC8, 0x00, 0x1C, 0x8C, 0x00, 0x00, 0x64, 0x00,
          0x55, 0xCC,
        ]
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0x2C, 0x01, 0x7E, 0x84, 0x00, 0x00, 0x64, 0x00,
          0xB8, 0x81, 0x2A, 0x88, 0x00, 0x00, 0x64, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x55, 0xCC,
        ]
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0xC8, 0x00, 0xB0, 0x84, 0x00, 0x00, 0x64, 0x00,
          0x08, 0x82, 0x48, 0x88, 0x00, 0x00, 0x64, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x55, 0xCC,
        ]
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0x64, 0x00, 0xE2, 0x84, 0x00, 0x00, 0x64, 0x00,
          0x58, 0x82, 0x66, 0x88, 0x00, 0x00, 0x64, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x55, 0xCC,
        ]
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0x00, 0x00, 0x14, 0x85, 0x00, 0x00, 0x64, 0x00,
          0xA8, 0x82, 0x84, 0x88, 0x00, 0x00, 0x64, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x55, 0xCC,
        ]
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0x64, 0x80, 0x46, 0x85, 0x00, 0x00, 0x64, 0x00,
          0xF8, 0x82, 0xA2, 0x88, 0x00, 0x00, 0x64, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x55, 0xCC,
        ]
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0xC8, 0x80, 0x78, 0x85, 0x00, 0x00, 0x64, 0x00,
          0x48, 0x83, 0xC0, 0x88, 0x00, 0x00, 0x64, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x55, 0xCC,
        ]
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0x2C, 0x81, 0xAA, 0x85, 0x00, 0x00, 0x64, 0x00,
          0x98, 0x83, 0xDE, 0x88, 0x00, 0x00, 0x64, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x55, 0xCC,
        ]
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0x90, 0x81, 0xDC, 0x85, 0x00, 0x00, 0x64, 0x00,
          0xE8, 0x83, 0xFC, 0x88, 0x00, 0x00, 0x64, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x55, 0xCC,
        ]
    - delay: 100ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0xF4, 0x81, 0x0E, 0x86, 0x00, 0x00, 0x64, 0x00,
          0x38, 0x84, 0x1A, 0x89, 0x00, 0x00, 0x64, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x55, 0xCC,
        ]
    # Targets 1 and 2 stand still for 1.2 s (repeated frames are ignored), then leave
    - delay: 1300ms
      inject_rx:
        [
          0xAA, 0xFF, 0x03, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
          0x55, 0xCC,
        ]

ld2450:
  id: ld2450_dev
  uart_id: mock_uart

text_sensor:
  - platform: ld2450
    ld2450_id: ld2450_dev
    target_1:
      xy:
        name: "Target 1 XY"
        filters:
          - timeout:
              timeout: 500ms
              value: last
          - throttle_with_priority:
              timeout: 500ms
              value: NA
    target_2:
      xy:
        name: "Target 2 XY"
        filters: []
    target_3:
      xy:
        name: "Target 3 XY"
        filters:
          - timeout:
              timeout: 500ms
              value: last
          - throttle_with_priority:
              timeout: 500ms
              value: NA

button:
  - platform: template
    name: "Start Scenario"
    id: start_scenario_btn
    on_press:
      - lambda: 'id(mock_uart).start_scenario();'
