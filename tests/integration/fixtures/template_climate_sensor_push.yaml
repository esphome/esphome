esphome:
  name: tmpl-clim-sensor-push
host:
api:
logger:

# current_temperature/current_humidity are pushed by the referenced sensor/humidity_sensor, not
# polled. The two sensors below have no lambda/update_interval of their own -- they're driven
# entirely by sensor.template.publish (buttons here stand in for e.g. a BLE scan callback
# elsewhere in a real config). This proves a *later* change to the backing sensor's value (not
# just its initial reading at boot) propagates into a new climate state, with no polling and no
# explicit climate.template.publish call for the temperature/humidity fields themselves.
sensor:
  - platform: template
    id: room_temperature
    name: Room Temperature
  - platform: template
    id: room_humidity
    name: Room Humidity

climate:
  - platform: template
    id: test_climate
    name: Test Sensor Push Climate
    optimistic: true
    sensor: room_temperature
    humidity_sensor: room_humidity
    supported_modes:
      - "OFF"
      - HEAT

button:
  - platform: template
    id: publish_temperature
    name: Publish Temperature
    on_press:
      - sensor.template.publish:
          id: room_temperature
          state: 24.0
  - platform: template
    id: publish_temperature_same
    name: Publish Temperature Same Value
    on_press:
      - sensor.template.publish:
          id: room_temperature
          state: 24.0
  - platform: template
    id: publish_humidity
    name: Publish Humidity
    on_press:
      - sensor.template.publish:
          id: room_humidity
          state: 65.0
