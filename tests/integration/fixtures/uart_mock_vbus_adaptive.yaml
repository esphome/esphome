esphome:
  name: uart-mock-vbus-adaptive
host:
api:
logger:
  level: DEBUG
external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH
uart:
  baud_rate: 9600
  port: /dev/null
uart_mock:
  id: mock_uart
  baud_rate: 9600
  auto_start: false
  on_tx:
    - lambda: ESP_LOGI("vbus.wire_test", "%s", format_hex_pretty(data).c_str());
    - if:
        condition:
          lambda: return data[6] == 0 && data[7] == 3;
        then:
          - delay: 25ms
          - lambda: |-
              const uint16_t index = uint16_t(data[8] | ((data[14] & 1u) << 7)) |
                  (uint16_t(data[9] | ((data[14] & 2u) << 6)) << 8);
              const auto spec = vbus::cs_plus::find_setting(index);
              if (!spec) return;
              int32_t value = spec->minimum;
              switch (index) {
                case 1: value = 1; break;
                case 10: value = 0; break;
                case 48: value = 35; break;
                case 50: value = 65; break;
                case 55: value = 4; break;
                case 81: value = 1; break;
                case 90: value = 1; break;
                case 385: value = 100; break;
                case 401: value = 40; break;
                case 411: value = 120; break;
                case 12549: value = 2; break;
                default: break;
              }
              const uint32_t raw = static_cast<uint32_t>(value);
              std::vector<uint8_t> response{0xaa, 0x20, 0, 0x11, 0x22, 0x20, 0, 1,
                  uint8_t(index), uint8_t(index >> 8), uint8_t(raw), uint8_t(raw >> 8),
                  uint8_t(raw >> 16), uint8_t(raw >> 24), 0, 0};
              for (size_t i = 0; i < 6; ++i) {
                response[14] |= (response[8 + i] >> 7) << i;
                response[8 + i] &= 0x7f;
              }
              uint8_t checksum = 0x7f;
              for (size_t i = 1; i < 15; ++i) checksum = (checksum - response[i]) & 0x7f;
              response[15] = checksum;
              id(mock_uart).inject_to_rx_buffer(response);
    - if:
        condition:
          lambda: return data[6] == 0 && data[7] == 6;
        then:
          - delay: 25ms
          - uart_mock.inject_rx:
              id: mock_uart
              data: [0xAA, 0x10, 0x00, 0x11, 0x22, 0x10, 0x00, 0x01, 0x0A, 0x21, 0x7B, 0x00, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F, 0x01, 0x09, 0x00, 0x00, 0x00, 0x75, 0x00, 0x00, 0x3E, 0x00, 0x00, 0x41, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F, 0x6F, 0x00, 0x00, 0x00, 0x00, 0x10, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F]
          - delay: 100ms
          - uart_mock.inject_rx:
              id: mock_uart
              data: [0xAA, 0, 0, 0x11, 0x22, 0x20, 0, 5, 0, 0, 0, 0, 0, 0, 0, 0x27]
vbus:
  id: bus
  uart_id: mock_uart
  transmit:
    destination: 0x2211
    transactions:
      controller:
        id: controller
        model: deltasol_cs_plus
        update_interval: 5min
        adaptive_polling:
          context_update_interval: 60s
        on_snapshot:
          - lambda: |-
              int32_t scheme = -1, unit = -1, language = -1;
              id(controller).get_value(1, scheme);
              id(controller).get_value(10, unit);
              id(controller).get_value(55, language);
              ESP_LOGI("vbus.snapshot_test", "%u %u %u %u %d %d %d", id(controller).completed_scans(),
                  id(controller).request_count(), id(controller).group_count(), id(controller).release_count(),
                  scheme, unit, language);
sensor:
  - platform: vbus
    model: deltasol_cs_plus
    vbus_id: bus
    temperature_1:
      name: Controller RX
button:
  - platform: template
    name: Start Scenario
    on_press:
      - lambda: id(mock_uart).start_scenario();
      - uart_mock.inject_rx:
          id: mock_uart
          data: [0xAA, 0x10, 0x00, 0x11, 0x22, 0x10, 0x00, 0x01, 0x0A, 0x21, 0x7B, 0x00, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F, 0x01, 0x09, 0x00, 0x00, 0x00, 0x75, 0x00, 0x00, 0x3E, 0x00, 0x00, 0x41, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F, 0x6F, 0x00, 0x00, 0x00, 0x00, 0x10, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F]
      - delay: 100ms
      - vbus.scan_controller:
          id: controller
      - delay: 100ms
      - uart_mock.inject_rx:
          id: mock_uart
          data: [0xAA, 0, 0, 0x11, 0x22, 0x20, 0, 5, 0, 0, 0, 0, 0, 0, 0, 0x27]

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: return !id(controller).is_scanning() || id(controller).request_count() == 0;
          then:
            - uart_mock.inject_rx:
                id: mock_uart
                data: [0xAA, 0x10, 0x00, 0x11, 0x22, 0x10, 0x00, 0x01, 0x0A, 0x21, 0x7B, 0x00, 0x00, 0x00, 0x00, 0x04, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F, 0x01, 0x09, 0x00, 0x00, 0x00, 0x75, 0x00, 0x00, 0x3E, 0x00, 0x00, 0x41, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F, 0x6F, 0x00, 0x00, 0x00, 0x00, 0x10, 0x00, 0x00, 0x00, 0x00, 0x00, 0x7F]
            - delay: 100ms
            - uart_mock.inject_rx:
                id: mock_uart
                data: [0xAA, 0x00, 0x00, 0x11, 0x22, 0x20, 0x00, 0x05, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x27]
