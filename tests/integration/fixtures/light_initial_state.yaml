esphome:
  name: light-initial-state-test
host:
api:  # Port will be automatically injected
logger:
  level: DEBUG

output:
  - platform: template
    id: test_red
    type: float
    write_action:
      - lambda: ""
  - platform: template
    id: test_green
    type: float
    write_action:
      - lambda: ""
  - platform: template
    id: test_blue
    type: float
    write_action:
      - lambda: ""
  - platform: template
    id: test_restore_and_on_output
    type: float
    write_action:
      - lambda: ""
  - platform: template
    id: test_restore_default_initial_state_output
    type: float
    write_action:
      - lambda: ""
  - platform: template
    id: test_restore_default_initial_state_on_output
    type: float
    write_action:
      - lambda: ""

light:
  - platform: rgb
    name: "Test Light"
    id: test_light
    red: test_red
    green: test_green
    blue: test_blue
    restore_mode: ALWAYS_OFF
    initial_state:
      color_mode: RGB
      state: "ON"
      brightness: 0.75
      red: 1.0
      green: 0.5
      blue: 0.0

  - platform: monochromatic
    name: "Test Restore And On Light"
    id: test_restore_and_on_light
    output: test_restore_and_on_output
    restore_mode: RESTORE_AND_ON
    # Simulates a stale/persisted zero brightness: RESTORE_AND_ON always forces the light
    # on at boot regardless of the recovered state, so a leftover brightness of 0 must not
    # leave the light on-but-invisible.
    initial_state:
      color_mode: BRIGHTNESS
      state: "OFF"
      brightness: 0%

  - platform: monochromatic
    name: "Test Restore Default Initial State Light"
    id: test_restore_default_initial_state_light
    output: test_restore_default_initial_state_output
    restore_mode: RESTORE_DEFAULT_INITIAL_STATE
    # With nothing saved in flash to restore, RESTORE_DEFAULT_INITIAL_STATE must honor
    # initial_state's "state: OFF" -- unlike RESTORE_DEFAULT_ON/ALWAYS_ON, which would
    # force the light on here regardless of what initial_state says.
    initial_state:
      color_mode: BRIGHTNESS
      state: OFF
      brightness: 100%

  - platform: monochromatic
    name: "Test Restore Default Initial State On Light"
    id: test_restore_default_initial_state_on_light
    output: test_restore_default_initial_state_on_output
    restore_mode: RESTORE_DEFAULT_INITIAL_STATE
    # The other half of the pass-through check above: with nothing saved, this must honor
    # initial_state's "state: ON" -- unlike RESTORE_DEFAULT_OFF/ALWAYS_OFF, which would
    # force the light off here regardless of what initial_state says. Together, these two
    # lights prove RESTORE_DEFAULT_INITIAL_STATE passes initial_state's value through rather
    # than reproducing the behavior of any pre-existing restore_mode.
    initial_state:
      color_mode: BRIGHTNESS
      state: ON
      brightness: 42%
