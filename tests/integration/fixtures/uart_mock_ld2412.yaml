esphome:
  name: uart-mock-ld2412-test
  on_boot:
    then:
      # truncated_answer: a complete motion answer after setup proves the parser recovered
      - if:
          condition:
            lambda: return id(ld2412_scenario) == "truncated_answer";
          then:
            - uart_mock.inject_rx:
                id: mock_uart
                delay: 1500ms
                data:
                  [
                    0xFD, 0xFC, 0xFB, 0xFA,  # header
                    0x12, 0x00,  # length 18
                    0x13, 0x01,  # answer to command 0x0013
                    0x00, 0x00,  # status: success
                    0x0A, 0x0B, 0x0C, 0x0D, 0x0E, 0x0F, 0x10,  # gates 0 to 6
                    0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17,  # gates 7 to 13
                    0x04, 0x03, 0x02, 0x01,  # footer
                  ]

host:
api:
  batch_delay: 0ms  # Disable batching to receive all state updates
logger:
  level: VERBOSE

external_components:
  - source:
      type: local
      path: EXTERNAL_COMPONENT_PATH

# Every test shares this build; the test names its scenario in LD2412_SCENARIO, which picks what the
# mock answers and what the Start Scenario button injects
globals:
  - id: ld2412_scenario
    type: std::string
    initial_value: 'getenv("LD2412_SCENARIO") ?: ""'

# Dummy uart entry to satisfy ld2412's DEPENDENCIES = ["uart"]
# The actual UART bus used is the uart_mock component below
uart:
  baud_rate: 115200
  port: /dev/null

uart_mock:
  id: mock_uart
  baud_rate: 256000
  on_tx:
    - then:
        - lambda: |-
            // The length and command word arrive as one write of their own
            static const std::vector<uint8_t> RESOLUTION_QUERY = {0x02, 0x00, 0x11, 0x00};
            static const std::vector<uint8_t> MOTION_QUERY = {0x02, 0x00, 0x13, 0x00};
            static const std::vector<uint8_t> STILL_QUERY = {0x02, 0x00, 0x14, 0x00};
            static int motion_queries = 0;
            const std::string &scenario = id(ld2412_scenario);
            if (scenario == "selects" && data == RESOLUTION_QUERY) {
              id(mock_uart).inject_to_rx_buffer(std::vector<uint8_t>{
                  0xFD, 0xFC, 0xFB, 0xFA,  // header
                  0x06, 0x00,              // length 6
                  0x11, 0x01,              // answer to command 0x0011
                  0x00, 0x00,              // status: success
                  0x01, 0x00,              // resolution code 0x01 = 0.5m
                  0x04, 0x03, 0x02, 0x01,  // footer
              });
            } else if (scenario == "footer_in_payload" && data == MOTION_QUERY) {
              // Both answers hold the footer 04 03 02 01 inside the gate bytes, so the parser must read on
              // to the real footer. Here gates 5 to 8 hold it
              id(mock_uart).inject_to_rx_buffer(std::vector<uint8_t>{
                  0xFD, 0xFC, 0xFB, 0xFA, 0x12, 0x00, 0x13, 0x01, 0x00, 0x00,
                  0x00, 0x23, 0x23, 0x23, 0x23, 0x04, 0x03,
                  0x02, 0x01, 0x19, 0x19, 0x19, 0x19, 0x19,
                  0x04, 0x03, 0x02, 0x01,
              });
            } else if (scenario == "footer_in_payload" && data == STILL_QUERY) {
              // Gates 10 to 13 hold 04 03 02 01, right before the real footer
              id(mock_uart).inject_to_rx_buffer(std::vector<uint8_t>{
                  0xFD, 0xFC, 0xFB, 0xFA, 0x12, 0x00, 0x14, 0x01, 0x00, 0x00,
                  0x00, 0x23, 0x23, 0x23, 0x23, 0x19, 0x19,
                  0x19, 0x19, 0x19, 0x04, 0x03, 0x02, 0x01,
                  0x04, 0x03, 0x02, 0x01,
              });
            } else if (scenario == "truncated_answer" && data == MOTION_QUERY) {
              // The motion answer is two gate bytes short, so the parser reads on into the next acknowledgement
              id(mock_uart).inject_to_rx_buffer(std::vector<uint8_t>{
                  0xFD, 0xFC, 0xFB, 0xFA,              // motion header
                  0x12, 0x00,                          // length 18, but only 16 bytes follow
                  0x13, 0x01,                          // answer to command 0x0013
                  0x00, 0x00,                          // status: success
                  0x30, 0x31, 0x32, 0x33, 0x34, 0x35,  // gates 0 to 5
                  0x36, 0x37, 0x38, 0x39, 0x3A, 0x3B,  // gates 6 to 11, gates 12 and 13 are missing
                  0x04, 0x03, 0x02, 0x01,              // motion footer
                  0xFD, 0xFC, 0xFB, 0xFA,              // next frame: the config-mode end acknowledgement
                  0x04, 0x00,                          // length 4
                  0xFE, 0x01,                          // answer to command 0x00FE
                  0x00, 0x00,                          // status: success
                  // Its footer; the 28 bytes the answer announced hold no footer, so it is dropped
                  0x04, 0x03, 0x02, 0x01,
              });
            } else if (scenario == "requery_after_giveup" && data == MOTION_QUERY && ++motion_queries == 3) {
              // Only the third motion query is answered: the setup query and the first write's re-query go
              // unanswered, so that write is given up. The still query is never answered
              id(mock_uart).inject_to_rx_buffer(std::vector<uint8_t>{
                  0xFD, 0xFC, 0xFB, 0xFA,  // header
                  0x12, 0x00,              // length 18
                  0x13, 0x01,              // answer to command 0x0013
                  0x00, 0x00,              // status: success
                  0x19, 0x0B, 0x0C, 0x0D, 0x0E, 0x0F, 0x10,  // gates 0 to 6
                  0x11, 0x12, 0x13, 0x14, 0x15, 0x16, 0x17,  // gates 7 to 13
                  0x04, 0x03, 0x02, 0x01,  // footer
              });
            }

# The timelines the Start Scenario button injects; each delay counts from the button press
script:
  - id: frames_timeline
    then:
      # Phase 1 (t=100ms): Valid LD2412 normal mode data frame - happy path
      # The buffer is clean at this point, so this frame should parse correctly.
      # Moving target: 100cm, energy 50
      # Still target: 120cm, energy 25
      # Target state: 0x03 (moving + still)
      # detection_distance = 100 (LD2412 computes from moving target when MOVE_BITMASK set)
      #
      # Frame layout (23 bytes):
      #   [0-3]   F4 F3 F2 F1 = data frame header
      #   [4-5]   0D 00       = length 13
      #   [6]     02          = data type (normal)
      #   [7]     AA          = data header marker
      #   [8]     03          = target states (moving+still)
      #   [9-10]  64 00       = moving distance 100 (0x0064)
      #   [11]    32          = moving energy 50
      #   [12-13] 78 00       = still distance 120 (0x0078)
      #   [14]    19          = still energy 25
      #   [15-16] 64 00       = detect distance bytes (ignored by LD2412 code)
      #   [17]    55          = data footer marker
      #   [18]    00          = CRC/check
      #   [19-22] F8 F7 F6 F5 = data frame footer
      - uart_mock.inject_rx:
          id: mock_uart
          delay: 100ms
          data:
            [
              0xF4, 0xF3, 0xF2, 0xF1,
              0x0D, 0x00,
              0x02, 0xAA,
              0x03,
              0x64, 0x00,
              0x32,
              0x78, 0x00,
              0x19,
              0x64, 0x00,
              0x55, 0x00,
              0xF8, 0xF7, 0xF6, 0xF5,
            ]

      # Phase 2 (t=300ms): Garbage bytes
      # LD2412's parser rejects bytes that don't match the frame header at
      # position 0 (must start with F4 or FD), so buffer stays empty.
      - uart_mock.inject_rx:
          id: mock_uart
          delay: 300ms
          data: [0xDE, 0xAD, 0xBE, 0xEF, 0x00, 0x11, 0x22]

      # Phase 3 (t=550ms): Truncated frame (header + partial data, no footer)
      # Starts with a valid data frame header, so the parser waits for the 23 bytes its length announces.
      - uart_mock.inject_rx:
          id: mock_uart
          delay: 550ms
          data: [0xF4, 0xF3, 0xF2, 0xF1, 0x0D, 0x00, 0x02, 0xAA]

      # Phase 4 (t=600ms): 60 bytes of 0xFF
      # The first 15 complete the truncated frame's 23 bytes without its footer, so it is dropped
      # with an 'Invalid footer' warning; the rest cannot start a header and are dropped too.
      - uart_mock.inject_rx:
          id: mock_uart
          delay: 600ms
          data:
            [
              0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
              0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
              0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
              0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
              0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
              0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF,
            ]

      # Phase 5 (t=700ms): Valid frame after the garbage - recovery test
      # The buffer is empty again, so this valid frame should parse correctly.
      # Moving target: 50cm, energy 100
      # Still target: 75cm, energy 80
      # detection_distance = 50 (moving target distance, since MOVE_BITMASK set)
      - uart_mock.inject_rx:
          id: mock_uart
          delay: 700ms
          data:
            [
              0xF4, 0xF3, 0xF2, 0xF1,
              0x0D, 0x00,
              0x02, 0xAA,
              0x03,
              0x32, 0x00,
              0x64,
              0x4B, 0x00,
              0x50,
              0x32, 0x00,
              0x55, 0x00,
              0xF8, 0xF7, 0xF6, 0xF5,
            ]

      # Phase 6 (t=3200ms): Values that spell the command footer 04 03 02 01
      # Moving distance 772 (0x0304), moving energy 2, still distance 1: bytes 9 to 12 are the
      # command frame footer, which must not end the frame early.
      # Still energy 5, detection_distance = 772 (moving target distance, since MOVE_BITMASK set).
      # The sensors hold and throttle values for a second, so the gap lets the phase 5 states
      # reach the test before these replace them.
      - uart_mock.inject_rx:
          id: mock_uart
          delay: 3200ms
          data:
            [
              0xF4, 0xF3, 0xF2, 0xF1,
              0x0D, 0x00,
              0x02, 0xAA,
              0x03,
              0x04, 0x03,
              0x02,
              0x01, 0x00,
              0x05,
              0x04, 0x03,
              0x55, 0x00,
              0xF8, 0xF7, 0xF6, 0xF5,
            ]

      # Phase 7 (t=5700ms): Truncated frame merged with a complete one
      # The eight header bytes announce a 23 byte frame, so its window takes in the first 15 bytes of
      # the valid frame that follows. The merged frame has no footer where the count says, so it is
      # dropped and the bytes after its header are replayed, which recovers the valid frame.
      # Moving distance 400, moving energy 7, still distance 200, still energy 9, detection_distance = 400
      - uart_mock.inject_rx:
          id: mock_uart
          delay: 5700ms
          data:
            [
              0xF4, 0xF3, 0xF2, 0xF1, 0x0D, 0x00, 0x02, 0xAA,
              0xF4, 0xF3, 0xF2, 0xF1,
              0x0D, 0x00,
              0x02, 0xAA,
              0x03,
              0x90, 0x01,
              0x07,
              0xC8, 0x00,
              0x09,
              0x90, 0x01,
              0x55, 0x00,
              0xF8, 0xF7, 0xF6, 0xF5,
            ]

      # Phase 8 (t=8200ms): Impossible counts, then a complete frame
      # A command header counting 0xFFF6 bytes (65536 in total, which must not wrap to 0) and one counting
      # 0xFFFF are each dropped as soon as the count arrives, and the valid frame after them is parsed.
      # Moving distance 600, moving energy 11, still distance 300, still energy 13, detection distance 600
      - uart_mock.inject_rx:
          id: mock_uart
          delay: 8200ms
          data:
            [
              0xFD, 0xFC, 0xFB, 0xFA, 0xF6, 0xFF,
              0xFD, 0xFC, 0xFB, 0xFA, 0xFF, 0xFF,
              0xF4, 0xF3, 0xF2, 0xF1,
              0x0D, 0x00,
              0x02, 0xAA,
              0x03,
              0x58, 0x02,
              0x0B,
              0x2C, 0x01,
              0x0D,
              0x58, 0x02,
              0x55, 0x00,
              0xF8, 0xF7, 0xF6, 0xF5,
            ]

  - id: engineering_timeline
    then:
      # Phase 1 (t=100ms): Valid LD2412 engineering mode data frame
      #
      # Engineering mode frame layout (52 bytes):
      #   [0-3]   F4 F3 F2 F1 = data frame header
      #   [4-5]   2A 00       = length 42
      #   [6]     01          = data type (engineering mode)
      #   [7]     AA          = data header marker
      #   [8]     03          = target states (moving+still)
      #   [9-10]  1E 00       = moving distance 30 (0x001E)
      #   [11]    64          = moving energy 100
      #   [12-13] 1E 00       = still distance 30 (0x001E)
      #   [14]    64          = still energy 100
      #   [15-16] 00 00       = detection distance bytes (ignored)
      #   [17-30] gate moving energies (14 gates)
      #   [31-44] gate still energies (14 gates)
      #   [45]    57          = light sensor value 87
      #   [46]    55          = data footer marker
      #   [47]    00          = check
      #   [48-51] F8 F7 F6 F5 = data frame footer
      - uart_mock.inject_rx:
          id: mock_uart
          delay: 100ms
          data:
            [
              0xF4, 0xF3, 0xF2, 0xF1,
              0x2A, 0x00,
              0x01, 0xAA,
              0x03,
              0x1E, 0x00,
              0x64,
              0x1E, 0x00,
              0x64,
              0x00, 0x00,
              0x64, 0x41, 0x06, 0x0E, 0x2B, 0x16, 0x03, 0x03, 0x07, 0x05, 0x09, 0x08, 0x07, 0x06,
              0x00, 0x00, 0x64, 0x64, 0x64, 0x64, 0x64, 0x64, 0x64, 0x50, 0x40, 0x30, 0x20, 0x10,
              0x57,
              0x55, 0x00,
              0xF8, 0xF7, 0xF6, 0xF5,
            ]

      # Phase 2 (t=200ms): Second engineering mode frame with different values
      # Moving at 73cm, still at 30cm
      - uart_mock.inject_rx:
          id: mock_uart
          delay: 200ms
          data:
            [
              0xF4, 0xF3, 0xF2, 0xF1,
              0x2A, 0x00,
              0x01, 0xAA,
              0x03,
              0x49, 0x00,
              0x64,
              0x1E, 0x00,
              0x64,
              0x21, 0x00,
              0x11, 0x64, 0x05, 0x29, 0x39, 0x10, 0x03, 0x11, 0x0E, 0x08, 0x06, 0x04, 0x03, 0x02,
              0x00, 0x00, 0x64, 0x64, 0x64, 0x64, 0x64, 0x64, 0x64, 0x50, 0x40, 0x30, 0x20, 0x10,
              0x57,
              0x55, 0x00,
              0xF8, 0xF7, 0xF6, 0xF5,
            ]

      # Phase 3 (t=300ms): Frame with still target at 291cm (multi-byte distance)
      # This tests encode_uint16 with high byte > 0
      # Target state: 0x02 (still only) -> detection_distance = still distance = 291
      - uart_mock.inject_rx:
          id: mock_uart
          delay: 300ms
          data:
            [
              0xF4, 0xF3, 0xF2, 0xF1,
              0x2A, 0x00,
              0x01, 0xAA,
              0x02,
              0x2F, 0x00,
              0x36,
              0x23, 0x01,
              0x64,
              0x21, 0x00,
              0x2F, 0x36, 0x09, 0x0D, 0x15, 0x0B, 0x06, 0x06, 0x08, 0x09, 0x08, 0x07, 0x06, 0x05,
              0x00, 0x00, 0x64, 0x64, 0x64, 0x64, 0x64, 0x5A, 0x3D, 0x30, 0x20, 0x10, 0x08, 0x04,
              0x57,
              0x55, 0x00,
              0xF8, 0xF7, 0xF6, 0xF5,
            ]

  - id: engineering_truncated_timeline
    then:
      # Phase 1 (t=100ms): Valid engineering mode frame (52 bytes, buffer_pos_=52)
      # Establishes baseline: gate_0_move=100, light=87
      - uart_mock.inject_rx:
          id: mock_uart
          delay: 100ms
          data:
            [
              0xF4, 0xF3, 0xF2, 0xF1,
              0x2A, 0x00,
              0x01, 0xAA,
              0x03,
              0x1E, 0x00,
              0x64,
              0x1E, 0x00,
              0x64,
              0x00, 0x00,
              0x64, 0x41, 0x06, 0x0E, 0x2B, 0x16, 0x03, 0x03, 0x07, 0x05, 0x09, 0x08, 0x07, 0x06,
              0x00, 0x00, 0x64, 0x64, 0x64, 0x64, 0x64, 0x64, 0x64, 0x50, 0x40, 0x30, 0x20, 0x10,
              0x57,
              0x55, 0x00,
              0xF8, 0xF7, 0xF6, 0xF5,
            ]

      # Phase 2 (t=200ms): Truncated engineering mode frame (24 bytes, buffer_pos_=24)
      # This frame has data_type=0x01 (engineering) but only enough data for the
      # basic target fields, not the gate energies or light sensor.
      # buffer_pos_=24 passes the old check (>= 12) but fails the new check (< 46).
      # Without the fix, indices 17-45 would read stale buffer data from Phase 1.
      #
      # Layout (24 bytes):
      #   [0-3]   F4 F3 F2 F1 = data frame header
      #   [4-5]   0E 00       = length 14
      #   [6]     01          = data type (engineering mode)
      #   [7]     AA          = data header marker
      #   [8]     03          = target states (moving+still)
      #   [9-10]  1E 00       = moving distance 30
      #   [11]    50          = moving energy 80
      #   [12-13] 1E 00       = still distance 30
      #   [14]    50          = still energy 80
      #   [15-16] FF FF       = garbage detection distance bytes
      #   [17]    FF          = padding (would be gate data in full frame)
      #   [18]    55          = data footer marker (at buffer_pos_ - 6)
      #   [19]    00          = check byte
      #   [20-23] F8 F7 F6 F5 = data frame footer
      - uart_mock.inject_rx:
          id: mock_uart
          delay: 200ms
          data:
            [
              0xF4, 0xF3, 0xF2, 0xF1,
              0x0E, 0x00,
              0x01, 0xAA,
              0x03,
              0x1E, 0x00,
              0x50,
              0x1E, 0x00,
              0x50,
              0xFF, 0xFF,
              0xFF,
              0x55, 0x00,
              0xF8, 0xF7, 0xF6, 0xF5,
            ]

      # Phase 3 (t=300ms): Valid recovery frame with different values
      # gate_0_move=50, light=42 — proves component recovered
      - uart_mock.inject_rx:
          id: mock_uart
          delay: 300ms
          data:
            [
              0xF4, 0xF3, 0xF2, 0xF1,
              0x2A, 0x00,
              0x01, 0xAA,
              0x03,
              0x1E, 0x00,
              0x64,
              0x1E, 0x00,
              0x64,
              0x00, 0x00,
              0x32, 0x20, 0x06, 0x0E, 0x2B, 0x16, 0x03, 0x03, 0x07, 0x05, 0x09, 0x08, 0x07, 0x06,
              0x00, 0x00, 0x32, 0x32, 0x32, 0x32, 0x32, 0x32, 0x32, 0x28, 0x20, 0x18, 0x10, 0x08,
              0x2A,
              0x55, 0x00,
              0xF8, 0xF7, 0xF6, 0xF5,
            ]

  - id: short_answers_timeline
    then:
      # Version answer cut after two version bytes
      - uart_mock.inject_rx:
          id: mock_uart
          delay: 100ms
          data:
            [
              0xFD, 0xFC, 0xFB, 0xFA, 0x08, 0x00, 0xA0, 0x01, 0x00, 0x00,
              0x00, 0x01, 0x07, 0x02,
              0x04, 0x03, 0x02, 0x01,
            ]

      # Basic configuration answer cut after the minimum gate 7
      - uart_mock.inject_rx:
          id: mock_uart
          delay: 200ms
          data:
            [
              0xFD, 0xFC, 0xFB, 0xFA, 0x05, 0x00, 0x12, 0x01, 0x00, 0x00,
              0x07,
              0x04, 0x03, 0x02, 0x01,
            ]

      # Whole version answer: firmware type 1, version 2.07.22062416
      - uart_mock.inject_rx:
          id: mock_uart
          delay: 300ms
          data:
            [
              0xFD, 0xFC, 0xFB, 0xFA, 0x0C, 0x00, 0xA0, 0x01, 0x00, 0x00,
              0x00, 0x01, 0x07, 0x02, 0x16, 0x24, 0x06, 0x22,
              0x04, 0x03, 0x02, 0x01,
            ]

      # Whole basic configuration answer: gates 3 to 9, timeout 10 s, output pin level low
      - uart_mock.inject_rx:
          id: mock_uart
          delay: 400ms
          data:
            [
              0xFD, 0xFC, 0xFB, 0xFA, 0x09, 0x00, 0x12, 0x01, 0x00, 0x00,
              0x03, 0x09, 0x0A, 0x00, 0x01,
              0x04, 0x03, 0x02, 0x01,
            ]

# Common filter definitions
.sensor_filters: &sensor_filters
  filters:
    - timeout:
        timeout: 50ms
        value: last
    - throttle_with_priority: 50ms

.binary_filters: &binary_filters
  filters:
    - settle: 50ms

ld2412:
  id: ld2412_dev
  uart_id: mock_uart

sensor:
  - platform: ld2412
    ld2412_id: ld2412_dev
    moving_distance:
      name: "Moving Distance"
      <<: *sensor_filters
    still_distance:
      name: "Still Distance"
      <<: *sensor_filters
    moving_energy:
      name: "Moving Energy"
      <<: *sensor_filters
    still_energy:
      name: "Still Energy"
      <<: *sensor_filters
    detection_distance:
      name: "Detection Distance"
      <<: *sensor_filters
    light:
      name: "Light"
      <<: *sensor_filters
    gate_0:
      move_energy:
        name: "Gate 0 Move Energy"
        <<: *sensor_filters
      still_energy:
        name: "Gate 0 Still Energy"
        <<: *sensor_filters
    gate_1:
      move_energy:
        name: "Gate 1 Move Energy"
        <<: *sensor_filters
      still_energy:
        name: "Gate 1 Still Energy"
        <<: *sensor_filters
    gate_2:
      move_energy:
        name: "Gate 2 Move Energy"
        <<: *sensor_filters
      still_energy:
        name: "Gate 2 Still Energy"
        <<: *sensor_filters

binary_sensor:
  - platform: ld2412
    ld2412_id: ld2412_dev
    has_target:
      name: "Has Target"
      <<: *binary_filters
    has_moving_target:
      name: "Has Moving Target"
      <<: *binary_filters
    has_still_target:
      name: "Has Still Target"
      <<: *binary_filters

# Only 2 of the 14 gates have a threshold number; gate 5 holds a footer byte in the footer_in_payload
# motion answer
number:
  - platform: ld2412
    ld2412_id: ld2412_dev
    min_distance_gate:
      name: "Min Distance Gate"
    max_distance_gate:
      name: "Max Distance Gate"
    timeout:
      name: "Timeout"
    gate_0:
      move_threshold:
        name: "Gate 0 Move Threshold"
      still_threshold:
        name: "Gate 0 Still Threshold"
    gate_5:
      move_threshold:
        name: "Gate 5 Move Threshold"
      still_threshold:
        name: "Gate 5 Still Threshold"

select:
  - platform: ld2412
    ld2412_id: ld2412_dev
    distance_resolution:
      name: "Distance Resolution"
    baud_rate:
      name: "Baud Rate"

text_sensor:
  - platform: ld2412
    ld2412_id: ld2412_dev
    version:
      name: "Version"

button:
  - platform: ld2412
    ld2412_id: ld2412_dev
    factory_reset:
      name: "Factory Reset"
  - platform: template
    name: "Start Scenario"
    on_press:
      - lambda: |-
          const std::string &scenario = id(ld2412_scenario);
          if (scenario == "frames") {
            id(frames_timeline).execute();
          } else if (scenario == "engineering") {
            id(engineering_timeline).execute();
          } else if (scenario == "engineering_truncated") {
            id(engineering_truncated_timeline).execute();
          } else if (scenario == "short_answers") {
            id(short_answers_timeline).execute();
          }
  # Lambdas reach the name taking setters directly, which the API cannot do with an unknown name
  - platform: template
    name: "Bogus Names"
    on_press:
      - lambda: |-
          id(ld2412_dev).set_distance_resolution("bogus");
          id(ld2412_dev).set_baud_rate("bogus");
          ESP_LOGI("test", "bogus names done");
  - platform: template
    name: "Named Values"
    on_press:
      - lambda: |-
          id(ld2412_dev).set_distance_resolution("0.75m");
          id(ld2412_dev).set_baud_rate("57600");
