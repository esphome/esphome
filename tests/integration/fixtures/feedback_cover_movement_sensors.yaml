esphome:
  name: feedback-cover-movement
host:
api:
logger:
  level: DEBUG

switch:
  - platform: template
    name: "Reverse Opening"
    id: reverse_opening
    optimistic: true
  - platform: template
    name: "Reverse Closing"
    id: reverse_closing
    optimistic: true
  - platform: template
    name: "Limit Opening"
    id: limit_opening
    optimistic: true
  - platform: template
    name: "Flicker Opening"
    id: flicker_opening
    optimistic: true

binary_sensor:
  - platform: template
    id: reverse_open_sensor
    lambda: return id(reverse_opening).state;
  - platform: template
    id: reverse_close_sensor
    lambda: return id(reverse_closing).state;
  - platform: template
    id: limit_open_sensor
    lambda: return id(limit_opening).state;
  - platform: template
    id: limit_close_sensor
    lambda: return false;
  - platform: template
    id: flicker_open_sensor
    lambda: return id(flicker_opening).state;
  - platform: template
    id: flicker_close_sensor
    lambda: return false;
  - platform: template
    id: stuck_open_sensor
    lambda: return false;
  - platform: template
    id: stuck_close_sensor
    lambda: return false;

cover:
  - platform: feedback
    name: "Reverse Cover"
    open_duration: 6s
    open_sensor: reverse_open_sensor
    close_duration: 6s
    close_sensor: reverse_close_sensor
    direction_change_wait_time: 0s
    has_built_in_endstop: true
    infer_endstop_from_movement: true
    open_action:
      - logger.log: "REVERSE_OPEN_ACTION"
    close_action:
      - logger.log: "REVERSE_CLOSE_ACTION"
    stop_action:
      - logger.log: "REVERSE_STOP_ACTION"
  - platform: feedback
    name: "Stuck Cover"
    open_duration: 6s
    open_sensor: stuck_open_sensor
    close_duration: 6s
    close_sensor: stuck_close_sensor
    max_duration: 500ms
    open_action:
      - logger.log: "STUCK_OPEN_ACTION"
    close_action:
      - logger.log: "STUCK_CLOSE_ACTION"
    stop_action:
      - logger.log: "STUCK_STOP_ACTION"
  - platform: feedback
    name: "Limit Cover"
    open_duration: 6s
    open_sensor: limit_open_sensor
    close_duration: 6s
    close_sensor: limit_close_sensor
    max_duration: 1s
    has_built_in_endstop: true
    open_action:
      - logger.log: "LIMIT_OPEN_ACTION"
    close_action:
      - logger.log: "LIMIT_CLOSE_ACTION"
    stop_action:
      - logger.log: "LIMIT_STOP_ACTION"
  - platform: feedback
    name: "Flicker Cover"
    open_duration: 4s
    open_sensor: flicker_open_sensor
    close_duration: 4s
    close_sensor: flicker_close_sensor
    open_action:
      - logger.log: "FLICKER_OPEN_ACTION"
    close_action:
      - logger.log: "FLICKER_CLOSE_ACTION"
    stop_action:
      - logger.log: "FLICKER_STOP_ACTION"
      - switch.turn_off: flicker_opening
