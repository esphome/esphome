# Physical bridge-backed bench; see controller-temperature.yaml for the stock Dallas oracle.
esphome:
  name: ow-model-raw-controller
esp32:
  board: esp32dev
  framework:
    type: esp-idf
logger:
  level: DEBUG
i2c:
  sda: GPIO21
  scl: GPIO22
  frequency: 50kHz
  scan: false
ds248x:
  id: bridge
  type: ds2482-800
  address: 0x18
  active_pullup: true
one_wire:
  - platform: ds248x
    id: bench_bus
    ds248x_id: bridge
    channel: 2
interval:
  - interval: 3s
    then:
      - lambda: |-
          auto *bus = id(bench_bus);
          const auto &devices = bus->get_devices();
          bool ok = devices.size() == 1;
          uint64_t rom = ok ? devices[0] : 0;
          unsigned family = rom & 0xff;
          uint8_t status = 0;
          if (family == 0x01) {
            for (uint8_t command : {0x33, 0x0f}) {
              bool presence = false;
              ok &= id(bridge).select_channel(2) && id(bridge).ow_reset(presence) && presence;
              bus->write8(command);
              ok &= bus->read64() == rom;
            }
          } else if (family == 0x3a) {
            ok &= bus->select(rom);
            bus->write8(0xf5);
            uint8_t input = bus->read8();
            ok &= ((input ^ (input >> 4)) & 0xf) == 0xf;
            ok &= bus->select(rom);
            bus->write8(0x5a);
            bus->write8(0xfc); bus->write8(0x03);
            ok &= bus->read8() == 0xaa;
            ok &= bus->read8() == 0xf0;
            bus->write8(0xfd); bus->write8(0x02);
            ok &= bus->read8() == 0xaa;
            status = bus->read8();
            ok &= status == 0xc3 || status == 0xd2;
            bus->write8(0xff); bus->write8(0xff);
            ok &= bus->read8() == 0xff;  // Bad complement must not acknowledge.
            ok &= bus->select(rom);
            bus->write8(0xf5);
            uint8_t after_bad_write = bus->read8();
            ok &= ((after_bad_write >> 1) & 1) == 1 && ((after_bad_write >> 3) & 1) == 0;
          } else {
            ok = false;
          }
          ESP_LOGI("hil", "HIL_CHECK family=%02X ok=%d status=%02X", family, ok, status);
