# Physical bridge-backed bench; see controller-temperature.yaml for the stock Dallas oracle.
esphome:
  name: ow-named-value-controller
esp32:
  board: esp32dev
  framework:
    type: esp-idf
logger:
  level: DEBUG
i2c:
  sda: GPIO21
  scl: GPIO22
  frequency: 50kHz
  scan: false
ds248x:
  id: bridge
  type: ds2482-800
  address: 0x18
  active_pullup: true
one_wire:
  - platform: ds248x
    id: bench_bus
    ds248x_id: bridge
    channel: 2
interval:
  - interval: 3s
    then:
      - lambda: |-
          auto *bus = id(bench_bus);
          const auto &devices = bus->get_devices();
          bool ok = devices.size() == 1;
          uint64_t rom = ok ? devices[0] : 0;
          ok &= (rom & 0xff) == 0x3a;
          ok &= bus->select(rom);
          bus->write8(0x5a);
          bus->write8(0xff); bus->write8(0x00);  // Release both output latches.
          ok &= bus->read8() == 0xaa;
          uint8_t status = bus->read8();
          ok &= ((status ^ (status >> 4)) & 0xf) == 0xf;
          ok &= (status & 0x0a) == 0x0a;
          ESP_LOGI("hil", "HIL_FIELDS ok=%d status=%02X a=%d b=%d", ok, status, status & 1, (status >> 2) & 1);
