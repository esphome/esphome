# Physical testrig-pi5-1 DS2482-800. No change to stock controller implementation.
esphome:
  name: ow-model-controller
esp32:
  board: esp32dev
  framework:
    type: esp-idf
logger:
  level: DEBUG
  logs:
    i2c: WARN
i2c:
  sda: GPIO21
  scl: GPIO22
  frequency: 50kHz
  scan: false
ds248x:
  id: bridge
  type: ds2482-800
  address: 0x18
  active_pullup: true
one_wire:
  - platform: ds248x
    id: bench_bus
    ds248x_id: bridge
    channel: 2
sensor:
  - platform: dallas_temp
    name: "HIL thermometer"
    one_wire_id: bench_bus
    index: 0
    update_interval: 3s
