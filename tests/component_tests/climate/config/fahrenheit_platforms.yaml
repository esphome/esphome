esphome:
  name: test
  on_boot:
    then:
      - climate.control:
          id: cn105_ac
          target_temperature: 72°F
      - climate.control:
          id: friedrich_ac
          target_temperature: 20°C
      - climate.control:
          id: islandaire_ac
          target_temperature: 20°C

esp8266:
  board: esp01_1m

uart:
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 2400
  parity: EVEN

remote_transmitter:
  pin: GPIO5
  carrier_duty_percent: 50%

mitsubishi_cn105:
  id: hub
  use_fahrenheit: ${use_fahrenheit}

climate:
  - platform: mitsubishi_cn105
    id: cn105_ac
    name: CN105
    visual:
      min_temperature: 60°F
      max_temperature: 30°C
  - platform: friedrich
    id: friedrich_ac
    name: Friedrich
    visual:
      min_temperature: 15°C
  - platform: islandaire
    id: islandaire_ac
    name: Islandaire
    visual:
      min_temperature: 15°C
