esphome:
  name: c3-7735-pte

esp32:
  board: lolin_c3_mini

spi:
  mosi_pin:
    number: GPIO2
    ignore_strapping_warning: true
  clk_pin: GPIO1

display:
  - platform: mipi_spi
    data_rate: 20MHz
    model: st7735
    cs_pin:
      number: GPIO8
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO3
    reset_pin:
      number: GPIO4

font:
  - file: ../../font/NotoSans-Regular.ttf
    id: ui_font
    engine: pte

lvgl:
  widgets:
    - label:
        id: hello_label
        text: Hello
        text_font: ui_font
        text_size: 14
