esphome:
  name: rmt-test

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

# The small strip is set up first, then the large one can extend into the free RX blocks.
# Both have the same setup priority, so setup_priority fixes their order.
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    setup_priority: 801
    chipset: WS2812
    channel_colors: GRB
    pin: GPIO4
    num_leds: 1
    rmt_symbols: 48
  - platform: esp32_rmt_led_strip
    id: matrix
    chipset: WS2812
    channel_colors: GRB
    pin: GPIO5
    num_leds: 64
    rmt_symbols: 288
