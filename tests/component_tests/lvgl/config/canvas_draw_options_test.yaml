esphome:
  name: test-canvas-draw-options
  on_boot:
    - lvgl.canvas.draw_rectangle:
        id: test_canvas
        x: 0
        y: 0
        width: 20
        height: 10
        bg_grad: test_grad
    - lvgl.canvas.draw_line:
        id: test_canvas
        dash_width: 4
        dash_gap: 2
        points:
          - 0,0
          - 10,10

esp32:
  board: lolin_c3_mini

spi:
  mosi_pin:
    number: GPIO2
    ignore_strapping_warning: true
  clk_pin: GPIO1

display:
  - platform: mipi_spi
    data_rate: 20MHz
    model: st7735
    cs_pin:
      number: GPIO8
      ignore_strapping_warning: true
    dc_pin: GPIO3

lvgl:
  gradients:
    - id: test_grad
      direction: hor
      stops:
        - color: 0xFF0000
          position: 0
        - color: 0x0000FF
          position: 255
  widgets:
    - canvas:
        id: test_canvas
        width: 32
        height: 32
