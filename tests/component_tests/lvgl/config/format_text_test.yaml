esphome:
  name: test-format-text
  on_boot:
    - lvgl.label.update:
        id: temp_label
        text:
          format: "%.1f°C"
          args: [id(temp).state]
    - lvgl.label.update:
        id: nan_label
        text:
          format: "%.0f%%"
          args: [id(temp).state]
          if_nan: "--"
    - lvgl.label.update:
        id: str_label
        text:
          format: "name %s"
          args: ['"x"']

esp32:
  board: esp32dev
  framework:
    type: esp-idf

spi:
  - id: spi_bus
    clk_pin: GPIO18
    mosi_pin: GPIO23

display:
  - platform: mipi_spi
    spi_id: spi_bus
    model: st7789v
    id: tft_display
    dimensions:
      width: 240
      height: 320
    cs_pin: GPIO22
    dc_pin: GPIO21
    update_interval: never

sensor:
  - platform: template
    id: temp

lvgl:
  displays: tft_display
  widgets:
    - label:
        id: temp_label
        text:
          format: "%5.2f"
          args: [id(temp).state]
    - label:
        id: nan_label
    - label:
        id: str_label
