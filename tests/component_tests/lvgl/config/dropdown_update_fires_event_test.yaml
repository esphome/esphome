esphome:
  name: test-dropdown-update-event
  on_boot:
    - lvgl.dropdown.update:
        id: test_dropdown
        selected_index: 2

esp32:
  board: lolin_c3_mini

spi:
  mosi_pin:
    number: GPIO2
    ignore_strapping_warning: true
  clk_pin: GPIO1

display:
  - platform: mipi_spi
    data_rate: 20MHz
    model: st7735
    cs_pin:
      number: GPIO8
      ignore_strapping_warning: true
    dc_pin: GPIO3

lvgl:
  widgets:
    - dropdown:
        id: test_dropdown
        options:
          - First
          - Second
          - Third
        on_update:
          - lambda: |-
              ESP_LOGD("test", "dropdown updated");
