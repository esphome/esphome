esphome:
  name: test-action-value-lambda-copy

esp32:
  board: lolin_c3_mini

spi:
  mosi_pin:
    number: GPIO2
    ignore_strapping_warning: true
  clk_pin: GPIO1

display:
  - platform: mipi_spi
    data_rate: 20MHz
    model: st7735
    cs_pin:
      number: GPIO8
      ignore_strapping_warning: true
    dc_pin: GPIO3

lvgl:
  pages:
    - id: test_page
      widgets:
        - slider:
            id: source_slider
            on_value:
              - lvgl.slider.update:
                  id: target_slider
                  value: !lambda return ++x + 1;
              - lvgl.canvas.draw_rectangle:
                  id: test_canvas
                  x: 0
                  y: 0
                  width: !lambda return ++x + 2;
                  height: 10
              - lvgl.canvas.set_pixels:
                  id: test_canvas
                  color: red
                  opa: !lambda return ++x + 3;
                  points:
                    - 1,1
              - lvgl.page.next:
                  time: !lambda return ++x + 4;
              - if:
                  condition:
                    lvgl.is_idle:
                      timeout: !lambda return ++x + 5;
                  then:
                    - lvgl.page.previous:
        - slider:
            id: target_slider
        - canvas:
            id: test_canvas
            width: 32
            height: 32
