esphome:
  name: test-action-value-lambda-copy

esp32:
  board: lolin_c3_mini

spi:
  mosi_pin:
    number: GPIO2
    ignore_strapping_warning: true
  clk_pin: GPIO1

display:
  - platform: mipi_spi
    data_rate: 20MHz
    model: st7735
    cs_pin:
      number: GPIO8
      ignore_strapping_warning: true
    dc_pin: GPIO3

lvgl:
  widgets:
    - slider:
        id: source_slider
        on_value:
          - lvgl.slider.update:
              id: target_slider
              value: !lambda return ++x;
    - slider:
        id: target_slider
