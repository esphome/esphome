esphome:
  name: test-update-creation-only
  on_boot:
    - lvgl.tabview.update:
        id: test_tabview
        hidden: true
    - lvgl.tileview.update:
        id: test_tileview
        hidden: true
    - lvgl.canvas.update:
        id: test_canvas
        hidden: true
    - lvgl.menu.update:
        id: test_menu
        hidden: true

esp32:
  board: lolin_c3_mini

spi:
  mosi_pin:
    number: GPIO2
    ignore_strapping_warning: true
  clk_pin: GPIO1

display:
  - platform: mipi_spi
    data_rate: 20MHz
    model: st7735
    cs_pin:
      number: GPIO8
      ignore_strapping_warning: true
    dc_pin: GPIO3

lvgl:
  widgets:
    - tabview:
        id: test_tabview
        tabs:
          - name: First
            id: test_tab
    - tileview:
        id: test_tileview
        tiles:
          - id: test_tile
            row: 0
            column: 0
    - canvas:
        id: test_canvas
        width: 16
        height: 16
    - menu:
        id: test_menu
        root_page: test_page
        pages:
          - id: test_page
