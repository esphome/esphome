esphome:
  name: test-list

esp32:
  board: lolin_c3_mini

spi:
  mosi_pin:
    number: GPIO2
    ignore_strapping_warning: true
  clk_pin: GPIO1

display:
  - platform: mipi_spi
    data_rate: 20MHz
    model: st7735
    cs_pin:
      number: GPIO8
      ignore_strapping_warning: true
    dc_pin: GPIO3

lvgl:
  theme:
    label:
      bg_color: 0xFF0000
  widgets:
    - list:
        id: test_list
        pad_row: 4
        on_add:
          - delay: 10ms
          - delay: 20ms
        on_remove:
          - delay: 10ms
    - button:
        id: trigger_button
        text: "Trigger"
        on_click:
          - lvgl.list.add_text:
              id: test_list
              text: "Header"
          - lvgl.list.add_text:
              id: test_list
              text: "Pinned"
              index: 0
          - lvgl.list.add:
              id: test_list
              button:
                text: "Entry"
                checkable: true
          - lvgl.list.add:
              id: test_list
              index: 1
              obj:
                widgets:
                  - label:
                      text: "Nested"
                  - dropdown:
                      options:
                        - "One"
                        - "Two"
          - lvgl.list.add:
              id: test_list
              obj:
                widgets:
                  - obj:
                      widgets:
                        - label:
                            text: "Grandchild"
          - lvgl.list.remove:
              id: test_list
              index: 0
          - lvgl.list.clear:
              id: test_list
          - lvgl.list.update:
              id: test_list
              pad_row: 8
