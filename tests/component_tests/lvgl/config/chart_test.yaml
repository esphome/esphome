esphome:
  name: test-chart

esp32:
  board: lolin_c3_mini

spi:
  mosi_pin:
    number: GPIO2
    ignore_strapping_warning: true
  clk_pin: GPIO1

display:
  - platform: mipi_spi
    data_rate: 20MHz
    model: st7735
    cs_pin:
      number: GPIO8
      ignore_strapping_warning: true
    dc_pin: GPIO3

lvgl:
  widgets:
    - chart:
        id: line_chart
        type: line
        point_count: 2
        items:
          line_width: 2
        series:
          - id: line_series
            values: [10, 20]
    - chart:
        id: scatter_chart
        type: scatter
        point_count: 2
        series:
          - id: scatter_series
            points:
              - {x: 10, y: 20}
              - {x: 30, y: 40}
    - button:
        on_click:
          - lvgl.chart.series.update:
              id: line_series
              value: !lambda return 30;
          - lvgl.chart.series.update:
              id: scatter_series
              point:
                x: !lambda return 50;
                y: !lambda return 60;
