esphome:
  name: test-keyboard-update-textarea
  on_boot:
    - lvgl.keyboard.update:
        id: kb
        textarea: ta2

esp32:
  board: lolin_c3_mini

spi:
  mosi_pin:
    number: GPIO2
    ignore_strapping_warning: true
  clk_pin: GPIO1

display:
  - platform: mipi_spi
    data_rate: 20MHz
    model: st7735
    cs_pin:
      number: GPIO8
      ignore_strapping_warning: true
    dc_pin: GPIO3

lvgl:
  widgets:
    - keyboard:
        id: kb
        textarea: ta1
    - textarea:
        id: ta1
    - textarea:
        id: ta2
