esphome:
  name: test-widget-on-boot

esp32:
  board: lolin_c3_mini

spi:
  mosi_pin:
    number: GPIO2
    ignore_strapping_warning: true
  clk_pin: GPIO1

display:
  - platform: mipi_spi
    data_rate: 20MHz
    model: st7735
    cs_pin:
      number: GPIO8
      ignore_strapping_warning: true
    dc_pin:
      number: GPIO3

lvgl:
  widgets:
    - label:
        id: boot_label
        text: Booting
        on_boot:
          trigger_id: boot_label_boot
          then:
            - logger.log: label booted

logger:
