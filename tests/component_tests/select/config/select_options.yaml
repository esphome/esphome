esphome:
  name: test

esp8266:
  board: esp01_1m

select:
  - platform: template
    id: fan_a
    name: Fan A
    optimistic: true
    options: [low, medium, high]
  - platform: template
    id: fan_b
    name: Fan B
    optimistic: true
    options: [low, medium, high]
  - platform: template
    id: mode
    name: Mode
    optimistic: true
    options: [auto, manual]
  - platform: copy
    id: fan_copy
    name: Fan Copy
    source_id: fan_a
