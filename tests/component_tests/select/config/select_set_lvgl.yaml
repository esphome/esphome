esphome:
  name: test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

spi:
  - id: spi_bus
    clk_pin: GPIO18
    mosi_pin: GPIO23

display:
  - platform: mipi_spi
    spi_id: spi_bus
    model: st7789v
    id: tft_display
    dimensions:
      width: 240
      height: 320
    cs_pin: GPIO22
    dc_pin: GPIO21
    auto_clear_enabled: false
    invert_colors: false
    update_interval: never

lvgl:
  displays: tft_display
  widgets:
    - dropdown:
        id: dropdown_widget
        options: [low, high]

select:
  - platform: lvgl
    id: lv_fan
    name: LVGL Fan
    widget: dropdown_widget

button:
  - platform: template
    name: Set
    on_press:
      - select.set:
          id: lv_fan
          option: high
