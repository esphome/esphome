esphome:
  name: test

esp8266:
  board: d1_mini

wifi:
  ssid: test
  password: testtest

sensor:
  - platform: template
    id: source
    name: Source
    lambda: return 1.0;
    unit_of_measurement: W
    accuracy_decimals: 1
    icon: mdi:flash
  # Listed before the copy that carries the metadata, so the consumer must follow that
  # copy's own inheritance chain instead of reading only what it already has.
  - platform: copy
    id: consumer
    source_id: middle
    name: Consumer
  - platform: copy
    id: middle
    source_id: source
    name: Middle
