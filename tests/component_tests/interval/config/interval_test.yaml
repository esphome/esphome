esphome:
  name: test

esp32:
  board: esp32dev

interval:
  - id: no_delay
    interval: 1s
    then:
      - logger.log: Tick
  - id: zero_delay
    interval: 3s
    startup_delay: 0s
    then:
      - logger.log: Tick with zero delay
  - id: delayed
    interval: 2s
    startup_delay: 5s
    then:
      - logger.log: Tick after startup delay
      - lambda: id(no_delay)->stop_poller();

logger:
