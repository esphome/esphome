esphome:
  name: test

esp32:
  board: esp32dev

i2c:
  sda: GPIO21
  scl: GPIO22

sx1509:
  - id: hub
    keypad:
      key_rows: 2
      key_columns: 2
  - id: idle_hub
    address: 0x3F

binary_sensor:
  - platform: sx1509
    sx1509_id: hub
    id: key_r0_c0
    row: 0
    col: 0
  - platform: sx1509
    sx1509_id: hub
    id: key_r1_c1
    row: 1
    col: 1
