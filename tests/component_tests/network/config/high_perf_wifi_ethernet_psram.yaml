esphome:
  name: test

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

psram:
  mode: octal
  ignore_not_found: false

wifi:
  ssid: "test_ssid"
  password: "test_password"

ethernet:
  type: W5500
  clk_pin: GPIO12
  mosi_pin: GPIO11
  miso_pin: GPIO13
  cs_pin: GPIO10
  interrupt_pin: GPIO14
  reset_pin: GPIO9

network:
  priority:
    - wifi
    - ethernet
  enable_high_performance: true
