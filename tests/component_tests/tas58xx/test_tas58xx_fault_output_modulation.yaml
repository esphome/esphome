esphome:
  name: test

esp32:
  board: esp32dev

i2c:
  id: i2c_bus
  sda: 21
  scl: 22

audio_dac:
  - platform: tas58xx
    model: tas5805m
    id: amp_5805_default
    ignore_enable_pin_warning: true
  - platform: tas58xx
    model: tas5825m
    id: amp_5825_default
    ignore_enable_pin_warning: true
  - platform: tas58xx
    model: tas5805m
    id: amp_5805_none
    address: 0x2C
    ignore_enable_pin_warning: true
    fault_output: none
