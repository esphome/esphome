esphome:
  name: gree-test

esp32:
  board: esp32dev

remote_transmitter:
  id: xmitr
  pin: GPIO4
  carrier_duty_percent: 50%

climate:
  - platform: gree
    id: gree_yan
    name: GREE YAN
    model: yan
    transmitter_id: xmitr

switch:
  - platform: gree
    gree_id: gree_yan
    light:
      id: yan_light
      name: YAN Light
    turbo:
      id: yan_turbo
      name: YAN Turbo
    health:
      id: yan_health
      name: YAN Health
      restore_mode: ALWAYS_ON
