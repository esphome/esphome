---
esphome:
  name: test

esp32:
  board: esp32dev

output:
  - platform: ledc
    id: out_cold
    pin: GPIO4
  - platform: ledc
    id: out_warm
    pin: GPIO5
  - platform: ledc
    id: out_red
    pin: GPIO12
  - platform: ledc
    id: out_green
    pin: GPIO13
  - platform: ledc
    id: out_blue
    pin: GPIO14

light:
  - platform: cwww
    name: Priority Light
    output_id: priority_output
    cold_white: out_cold
    warm_white: out_warm
    cold_white_color_temperature: 153 mireds
    warm_white_color_temperature: 500 mireds
    constant_brightness: color_temperature_priority
    cold_to_warm_ratio: 0.708
  - platform: cwww
    name: Plain Light
    output_id: plain_output
    cold_white: out_cold
    warm_white: out_warm
  - platform: cwww
    name: Enabled Light
    output_id: enabled_output
    cold_white: out_cold
    warm_white: out_warm
    constant_brightness: true
    # Equal channels need no weighting
    cold_to_warm_ratio: 1.0
  - platform: cwww
    name: Disabled Weighted Light
    output_id: disabled_output
    cold_white: out_cold
    warm_white: out_warm
    constant_brightness: false
    cold_to_warm_ratio: 0.5
  - platform: rgbww
    name: RGBWW Light
    output_id: rgbww_output
    red: out_red
    green: out_green
    blue: out_blue
    cold_white: out_cold
    warm_white: out_warm
    constant_brightness: true
    cold_to_warm_ratio: 1.3
