esphome:
  name: test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

uart:
  rx_pin: GPIO16
  baud_rate: 9600
  parity: EVEN
  data_bits: 7

mk2pvrouter:
  id: router

sensor:
  - platform: mk2pvrouter
    id: power
    name: Power
    tag: P
  - platform: mk2pvrouter
    id: voltage
    name: Voltage
    tag: v1

binary_sensor:
  - platform: mk2pvrouter
    id: relay
    name: Relay
    tag: R2

text_sensor:
  - platform: mk2pvrouter
    id: status
    name: Status
    tag: S_MC
