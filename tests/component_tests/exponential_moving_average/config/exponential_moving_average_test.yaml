esphome:
  name: test
  on_boot:
    then:
      - sensor.exponential_moving_average.reset: ema_default

esp32:
  board: esp32dev

sensor:
  - platform: template
    id: source_sensor
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    device_class: temperature
    state_class: measurement
    lambda: return 1.0;
  - platform: exponential_moving_average
    id: ema_default
    name: EMA Default
    sensor: source_sensor
  - platform: exponential_moving_average
    id: ema_alpha
    name: EMA Alpha
    sensor: source_sensor
    alpha: 0.25
    unit_of_measurement: "K"
    accuracy_decimals: 3
  - platform: exponential_moving_average
    id: ema_time_constant
    name: EMA Time Constant
    sensor: source_sensor
    time_constant: 5min
    restore: false
