---
esphome:
  name: test

logger:

esp32:
  board: esp32dev

sensor:
  - platform: template
    id: temp_sensor
    lambda: return 21.0;

climate:
  - platform: thermostat
    id: heater
    name: Heater
    sensor: temp_sensor
    min_idle_time: 30s
    min_heating_off_time: 300s
    min_heating_run_time: 300s
    min_cooling_off_time: 300s
    heat_action:
      - logger.log: heat
    idle_action:
      - logger.log: idle
