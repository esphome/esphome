---
esphome:
  name: test

logger:

esp32:
  board: esp32dev

sensor:
  - platform: template
    id: temp_sensor
    lambda: return 21.0;

climate:
  - platform: thermostat
    id: thermo
    name: Thermo
    sensor: temp_sensor
    humidity_sensor: temp_sensor
    idle_action:
      - logger.log: idle_action
    cool_action:
      - logger.log: cool_action
    supplemental_cooling_action:
      - logger.log: supplemental_cooling_action
    heat_action:
      - logger.log: heat_action
    supplemental_heating_action:
      - logger.log: supplemental_heating_action
    dry_action:
      - logger.log: dry_action
    fan_only_action:
      - logger.log: fan_only_action
    auto_mode:
      - logger.log: auto_mode
    off_mode:
      - logger.log: off_mode
    heat_mode:
      - logger.log: heat_mode
    cool_mode:
      - logger.log: cool_mode
    dry_mode:
      - logger.log: dry_mode
    fan_only_mode:
      - logger.log: fan_only_mode
    heat_cool_mode:
      - logger.log: heat_cool_mode
    fan_mode_on_action:
      - logger.log: fan_mode_on_action
    fan_mode_off_action:
      - logger.log: fan_mode_off_action
    fan_mode_auto_action:
      - logger.log: fan_mode_auto_action
    fan_mode_low_action:
      - logger.log: fan_mode_low_action
    fan_mode_medium_action:
      - logger.log: fan_mode_medium_action
    fan_mode_high_action:
      - logger.log: fan_mode_high_action
    fan_mode_middle_action:
      - logger.log: fan_mode_middle_action
    fan_mode_focus_action:
      - logger.log: fan_mode_focus_action
    fan_mode_diffuse_action:
      - logger.log: fan_mode_diffuse_action
    fan_mode_quiet_action:
      - logger.log: fan_mode_quiet_action
    swing_off_action:
      - logger.log: swing_off_action
    swing_horizontal_action:
      - logger.log: swing_horizontal_action
    swing_vertical_action:
      - logger.log: swing_vertical_action
    swing_both_action:
      - logger.log: swing_both_action
    target_humidity_change_action:
      - logger.log: target_humidity_change_action
    target_temperature_change_action:
      - logger.log: target_temperature_change_action
    humidity_control_humidify_action:
      - logger.log: humidity_control_humidify_action
    humidity_control_off_action:
      - logger.log: humidity_control_off_action
    preset_change:
      - logger.log: preset_change
    humidity_hysteresis: 0.5
    startup_delay: true
    supplemental_cooling_delta: 2.0
    supplemental_heating_delta: 3.0
    cool_deadband: 0.6
    cool_overrun: 0.7
    heat_deadband: 0.8
    heat_overrun: 0.9
    min_cooling_off_time: 301s
    min_cooling_run_time: 302s
    max_cooling_run_time: 601s
    min_heating_off_time: 303s
    min_heating_run_time: 304s
    max_heating_run_time: 602s
    min_fanning_off_time: 31s
    min_fanning_run_time: 32s
    min_fan_mode_switching_time: 15s
    min_idle_time: 30s
    fan_only_action_uses_fan_mode_timer: true
    fan_with_cooling: true
