---
esphome:
  name: test
  on_boot:
    then:
      - hlk_fm22x.enroll:
          name: "Test"
          direction: 1
      - hlk_fm22x.enroll:
          name: "Admin"
          direction: left
          admin: true
          timeout: 20s
          allow_duplicate: false
      - hlk_fm22x.enroll: "Single"
      - hlk_fm22x.scan:
          timeout: 15s
      - hlk_fm22x.cancel:
      - hlk_fm22x.get_face_details: 3
      - hlk_fm22x.delete: 0
      - hlk_fm22x.delete_all:
      - hlk_fm22x.reset:

esp32:
  board: nodemcu-32s

uart:
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 115200

hlk_fm22x:
  id: face_module
  on_face_scan_matched:
    - lambda: 'ESP_LOGI("test", "%d %s %d", face_id, name.c_str(), admin);'
  on_face_details:
    - lambda: 'ESP_LOGI("test", "%d %s %d", face_id, name.c_str(), admin);'

binary_sensor:
  - platform: hlk_fm22x
    enrolling:
      name: "Face Enrolling"
    scanning:
      name: "Face Scanning"

sensor:
  - platform: hlk_fm22x
    face_count:
      name: "Face Count"

text_sensor:
  - platform: hlk_fm22x
    version:
      name: "Version"
    serial_number:
      name: "Serial Number"
    face_state:
      name: "Face State"
