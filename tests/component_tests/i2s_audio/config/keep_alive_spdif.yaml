---
esphome:
  name: i2s-test

esp32:
  board: esp32dev

i2s_audio:
  i2s_bclk_pin: GPIO27
  i2s_lrclk_pin: GPIO26

speaker:
  - platform: i2s_audio
    dac_type: external
    i2s_dout_pin: GPIO12
    spdif_mode: true
    use_apll: true
    sample_rate: 48000
    channel: stereo
    keep_alive: true
