---
esphome:
  name: test

esp32:
  board: esp32dev

logger:

switch:
  # Three causes, deliberately not in sorted order in the YAML, with different modes, so the
  # emitted table's order, count and cause-to-mode pairing are all observable.
  - platform: template
    id: override_switch
    optimistic: true
    restore_mode: ALWAYS_ON
    restore_mode_on_reset:
      watchdog: ALWAYS_OFF
      external: ALWAYS_ON
      software: RESTORE_DEFAULT_OFF
  - platform: template
    id: plain_switch
    optimistic: true
