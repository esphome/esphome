esphome:
  name: test
  on_boot:
    then:
      - sx127x.send_packet: [0xC5, 0x51, 0x78, 0x82]
      - sx127x.send_packet: [0xC5, 0x51, 0x78, 0x82]
      - sx127x.send_packet: "hi"
      - sx127x.send_packet: !lambda return {0x09};

esp32:
  board: esp32dev

spi:
  clk_pin: 18
  mosi_pin: 23
  miso_pin: 19

sx127x:
  cs_pin: 12
  rst_pin: 13
  dio0_pin: 26
  frequency: 433920000
  modulation: LORA
  preamble_size: 8
