esphome:
  name: test

esp32:
  board: esp32dev

spi:
  clk_pin: 18
  mosi_pin: 23
  miso_pin: 19

sx127x:
  cs_pin: 12
  rst_pin: 13
  dio1_pin: 27
  frequency: 868950000
  modulation: FSK
  bitsync: true
  packet_mode: true
  payload_length: !lambda |-
    if (x.size() < 3) return 0;
    return x[2] + 12;
