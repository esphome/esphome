---
esphome:
  name: test

esp32:
  board: esp32dev

logger:

uart:
  - id: uart_bus
    tx_pin: GPIO16
    rx_pin: GPIO17
    baud_rate: 9600

tuya:
  id: tuya_hub
  on_datapoint_update:
    - sensor_datapoint: 1
      then:
        - logger.log: "Datapoint 1 updated"

sensor:
  - platform: tuya
    id: tuya_sensor
    sensor_datapoint: 1

select:
  - platform: tuya
    id: tuya_select
    enum_datapoint: 42
    options:
      0: Low
      1: High

fan:
  - platform: tuya
    id: tuya_fan
    switch_datapoint: 3
