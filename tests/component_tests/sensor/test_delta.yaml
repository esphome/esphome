esphome:
  name: test

esp8266:
  board: d1_mini_lite

sensor:
  - platform: template
    id: s_1
    filters:
      - delta: 0.1
  - platform: template
    id: s_2
    filters:
      - delta: 0.1
      - delta:
          min_value: 1
          max_value: 10%
  - platform: template
    id: s_3
    filters:
      - delta:
          min_value: 5%
      - delta:
          min_value: 1
          max_value: 10
      - delta:
          max_value: 10
          baseline: !lambda return id(s_1).state;
      - delta:
          max_value: 10
          baseline: !lambda return id(s_1).state;
