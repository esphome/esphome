esphome:
  name: test

esp32:
  board: esp32dev

i2c:
  sda: GPIO21
  scl: GPIO22

mpr121:
  - id: hub_busy
    address: 0x5A
  - id: hub_one
    address: 0x5B
  - id: hub_none
    address: 0x5C

binary_sensor:
  - platform: mpr121
    mpr121_id: hub_busy
    id: busy_0
    channel: 0
  - platform: mpr121
    mpr121_id: hub_one
    id: one_0
    channel: 0
  - platform: mpr121
    mpr121_id: hub_busy
    id: busy_1
    channel: 1
  - platform: mpr121
    mpr121_id: hub_busy
    id: busy_2
    channel: 2
