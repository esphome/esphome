esphome:
  name: test
  on_boot:
    then:
      - sx126x.send_packet: [0xC5, 0x51, 0x78, 0x82]
      - sx126x.send_packet: [0xC5, 0x51, 0x78, 0x82]
      - sx126x.send_packet: "hi"
      - sx126x.send_packet: !lambda return {0x09};

esp32:
  board: esp32dev

spi:
  clk_pin: 18
  mosi_pin: 23
  miso_pin: 19

sx126x:
  cs_pin: 12
  rst_pin: 13
  busy_pin: 25
  dio1_pin: 26
  frequency: 433920000
  hw_version: sx1262
  modulation: LORA
  bandwidth: 125_0kHz
  rf_switch: true
