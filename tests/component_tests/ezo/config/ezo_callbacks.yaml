esphome:
  name: test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

i2c:
  sda: 21
  scl: 22

sensor:
  - platform: ezo
    id: ph_ezo
    address: 99
    on_custom:
      - then:
          - lambda: 'ESP_LOGD("test", "custom %s", x.c_str());'
      - then:
          - delay: 1s
          - lambda: 'ESP_LOGD("test", "custom later %s", x.c_str());'
    on_calibration:
      - logger.log: calibration
    on_slope:
      - logger.log: slope
    on_t:
      - logger.log: temperature compensation
    on_device_information:
      - logger.log: device information
    on_led:
      - logger.log: led
