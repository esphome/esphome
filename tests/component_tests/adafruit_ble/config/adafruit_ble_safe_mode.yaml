esphome:
  name: adafruitbletest

nrf52:
  board: adafruit_itsybitsy_nrf52840
  bootloader: adafruit_nrf52_sd140_v6

logger:

safe_mode:

zephyr_ble_server:
  on_numeric_comparison_request:
    then:
      - ble_server.numeric_comparison_reply:
          accept: true

ota:
  - platform: adafruit_ble
    on_begin:
      then:
        - logger.log: "OTA begin"
