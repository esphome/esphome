esphome:
  name: test

esp32:
  board: esp32dev

logger:

external_components:
  - source:
      type: local
      path: ../external_components

fake_protocol:

remote_receiver:
  - id: rcvr
    pin: GPIO4
    dump:
      - fake
      - nec
    on_fake:
      then:
        - remote_transmitter.transmit_fake:
    on_nec:
      then:
        - logger.log: nec

remote_transmitter:
  pin: GPIO5
  carrier_duty_percent: 50%

binary_sensor:
  - platform: remote_receiver
    name: Fake Input
    fake:
