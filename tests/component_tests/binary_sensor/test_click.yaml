---
esphome:
  name: test

esp32:
  board: esp32dev

logger:

binary_sensor:
  - platform: gpio
    id: button_a
    pin: GPIO32
    on_click:
      - then:
          - logger.log: a click
      - min_length: 1s
        max_length: 3s
        then:
          - logger.log: a long click
          - delay: 1s
          - logger.log: a long click done
    on_double_click:
      - min_length: 20ms
        max_length: 400ms
        then:
          - logger.log: a double click
