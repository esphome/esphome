---
esphome:
  name: test

esp32:
  board: esp32dev

logger:

binary_sensor:
  - platform: gpio
    id: button_a
    pin: GPIO32
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - logger.log: a single
      - timing:
          - ON for at least 2s
        invalid_cooldown: 500ms
        then:
          - logger.log: a long
  - platform: gpio
    id: button_b
    pin: GPIO33
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - logger.log: b single
