esphome:
  name: test

esp32:
  board: nodemcu-32s

deep_sleep:
  id: deepsleep
  sleep_duration: 1min
  run_duration: 10s
  on_wake:
    - lambda: 'ESP_LOGD("test", "cause %d", static_cast<int>(cause));'
  esp32_ext1_wakeup:
    mode: ANY_HIGH
    pins:
      - pin: GPIO2
        on_wake:
          - lambda: 'ESP_LOGD("test", "left");'
      - pin:
          number: GPIO4
        on_wake:
          - lambda: 'ESP_LOGD("test", "right");'
      - number: GPIO13
