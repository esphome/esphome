esphome:
  name: test

esp32:
  board: esp32dev

sensor:
  - platform: adc
    id: mq8_adc
    name: MQ-8 AO voltage
    pin: GPIO34
    attenuation: 12db

  # Calibrated at boot: R0 is averaged from clean air, then every reading is
  # converted with the built-in MQ-8 H2 curve.
  - platform: mq_gas_sensors
    id: mq8_boot
    name: MQ-8 H2
    sensor_type: MQ-8
    gas: H2
    voltage: mq8_adc
    voltage_divider:
      r1: 20.0
      r2: 10.0
    sample_count: 4
    calibration:
      delay: 5s
      sample_count: 5

  # The reference is hard-coded, so nothing is calibrated at boot.
  - platform: mq_gas_sensors
    id: mq4_fixed
    name: MQ-4 CH4
    sensor_type: MQ-4
    voltage: mq8_adc
    voltage_divider:
      r1: 20.0
      r2: 10.0
    r0: 10.0

  # Owned wiring and diagnostics: `pin:` creates the hidden `adc` sensor, the
  # 20k/10k divider derives the multiplier, and the reading is mirrored to the
  # diagnostic sensors and the log.
  - platform: mq_gas_sensors
    id: mq8_pin
    name: MQ-8 H2 on pin
    sensor_type: MQ-8
    gas: H2
    pin: GPIO32
    voltage_divider:
      r1: 20.0
      r2: 10.0
    adc_attenuation: 12db
    ratio_sensor: mq8_ratio
    rs_sensor: mq8_rs
    voltage_sensor: mq8_voltage
    log_sensor: mq8_logs
    log_ppm: true
    r0: 9.5

  # No built-in coefficients: they come from the YAML, with the R0/RS
  # convention and a custom range.
  - platform: mq_gas_sensors
    id: mq136_custom
    name: MQ-136 custom
    sensor_type: MQ-136
    voltage: mq8_adc
    voltage_divider:
      r1: 20.0
      r2: 10.0
    coefficient_a: 36.0
    coefficient_b: -2.0
    regression_method: linear
    ratio_mode: r0_rs
    min_ppm: 1.0
    max_ppm: 200.0
    r0: 10.0

  - platform: template
    id: mq8_ratio
    name: MQ-8 ratio
    accuracy_decimals: 4

  - platform: template
    id: mq8_rs
    name: MQ-8 RS
    unit_of_measurement: kOhm
    accuracy_decimals: 3

  - platform: template
    id: mq8_voltage
    name: MQ-8 voltage
    unit_of_measurement: V
    accuracy_decimals: 4

text_sensor:
  - platform: template
    id: mq8_logs
    name: MQ-8 logs
