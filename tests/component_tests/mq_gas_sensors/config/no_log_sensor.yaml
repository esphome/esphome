# Fixture without `log_sensor:`: the C++ log mirror must not be compiled in.
esphome:
  name: test

esp32:
  board: esp32dev

sensor:
  - platform: adc
    id: mq_no_log_adc
    name: MQ AO voltage
    pin: GPIO34
    attenuation: 12db

  - platform: mq_gas_sensors
    id: mq_no_log
    name: MQ-8 H2
    sensor_type: MQ-8
    gas: H2
    voltage: mq_no_log_adc
    voltage_divider:
      r1: 20.0
      r2: 10.0
    r0: 10.0
