# Config-only fixture: the sampler `voltage:` reads from averages its own `samples:`
# inside every `sample()`, and `sample_count` of those run back to back in one loop
# pass, so the product is bounded like the one of an owned `pin:`.
esphome:
  name: test

esp32:
  board: esp32dev

sensor:
  - platform: adc
    id: mq_burst_adc
    name: MQ AO voltage
    pin: GPIO34
    samples: 255
    attenuation: 12db

  - platform: mq_gas_sensors
    id: mq_burst
    name: MQ-8 H2
    sensor_type: MQ-8
    gas: H2
    voltage: mq_burst_adc
    voltage_divider:
      r1: 20.0
      r2: 10.0
    sample_count: 2
    r0: 10.0
