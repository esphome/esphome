# Config-only fixture: a declared `adc_input_max:` cannot widen the range of the
# sampler `voltage:` reads from past what its attenuation measures.
esphome:
  name: test

esp32:
  board: esp32dev

sensor:
  - platform: adc
    id: mq_declared_adc
    name: MQ AO voltage at 6 dB
    pin: GPIO35
    attenuation: 6db

  # 5 V through the 10k/10k divider is 2.5 V: below the declared 3.34 V, above the
  # 1.75 V a 6 dB ADC measures, so the top of the reading clips.
  - platform: mq_gas_sensors
    id: mq_declared
    name: MQ-8 H2 declared
    sensor_type: MQ-8
    gas: H2
    voltage: mq_declared_adc
    voltage_divider:
      r1: 10.0
      r2: 10.0
    adc_input_max: 3.34
    r0: 10.0
