# Config-only fixture: one conversion of an ADS1115 at 8 SPS waits 126 ms, so
# `sample_count` conversions run back to back inside one pass of the main loop and
# the burst has to fit the time budget.
esphome:
  name: test

esp32:
  board: esp32dev

i2c:
  sda: GPIO21
  scl: GPIO22

ads1115:
  - address: 0x48

sensor:
  - platform: ads1115
    id: mq_ads_adc
    name: MQ AO voltage
    multiplexer: A0_GND
    gain: 6.144
    sample_rate: 8

  - platform: mq_gas_sensors
    id: mq_ads
    name: MQ-8 H2
    sensor_type: MQ-8
    gas: H2
    voltage: mq_ads_adc
    voltage_divider:
      r1: 20.0
      r2: 10.0
    sample_count: 16
    r0: 10.0
