# Config-only fixture: a sampler that is not an internal ADC has a range this
# component cannot deduce, so the wiring is accepted with a warning instead of
# being checked silently.
esphome:
  name: test

esp32:
  board: esp32dev

i2c:
  sda: GPIO21
  scl: GPIO22

ads1115:
  - address: 0x48

sensor:
  - platform: ads1115
    id: mq_external_adc
    name: MQ AO voltage
    multiplexer: A0_GND
    gain: 6.144

  - platform: mq_gas_sensors
    id: mq_external
    name: MQ-8 H2
    sensor_type: MQ-8
    gas: H2
    voltage: mq_external_adc
    voltage_divider:
      r1: 20.0
      r2: 10.0
    r0: 10.0
