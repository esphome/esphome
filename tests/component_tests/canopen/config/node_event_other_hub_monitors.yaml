esphome:
  name: canopen-test

esp32:
  board: esp32dev

logger:

canbus:
  - platform: esp32_can
    id: can_bus
    can_id: 0
    bit_rate: 125kbps
    tx_pin: GPIO4
    rx_pin: GPIO5

canopen:
  # monitors a node, so node monitoring is built
  - id: node_a
    canbus_id: can_bus
    node_id: 0x10
    heartbeat_clients:
      - node_id: 0x20
        timeout: 1500ms
  # monitors nothing: its on_node_event never fires
  - id: node_b
    canbus_id: can_bus
    node_id: 0x11
    on_node_event:
      - logger.log: "node event"
