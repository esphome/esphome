esphome:
  name: canopen-test

esp32:
  board: esp32dev
  framework:
    advanced:
      minimum_chip_revision: "3.0"

logger:

canbus:
  - platform: esp32_can
    id: can_bus
    can_id: 0
    bit_rate: 20kbps
    tx_pin: GPIO4
    rx_pin: GPIO5

canopen:
  - id: canopen_node
    canbus_id: can_bus
    node_id: 0x10
