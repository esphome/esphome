esphome:
  name: canopen-test

esp32:
  board: esp32dev

logger:

external_components:
  - source:
      type: local
      path: ../external_components

canbus:
  - platform: esp32_can
    id: can_bus
    can_id: 0
    bit_rate: 125kbps
    tx_pin: GPIO4
    rx_pin: GPIO5

canopen:
  - id: canopen_node
    canbus_id: can_bus
    node_id: 0x10
    on_node_event:
      - logger.log: "node event"

fake_canopen_profile:
  - id: drive
    node_id: 0x21
