esphome:
  name: test

esp32:
  board: esp32dev

sensor:
  - platform: adc
    id: mics_5524_adc
    name: MiCS-5524 AO
    pin: GPIO34

  # Calibrated at boot: the reference is averaged from clean air, then every gas
  # below it is published with the same ratio.
  - platform: mics_5524
    id: mics_5524_boot
    voltage: mics_5524_adc
    voltage_multiplier: 1.5
    sample_count: 3
    calibration:
      delay: 5s
      sample_count: 3
    carbon_monoxide:
      id: mics_5524_co
      name: MiCS-5524 CO
      max_ppm: 500.0
    methane:
      id: mics_5524_ch4
      name: MiCS-5524 CH4

  # The reference is hard-coded, so nothing is calibrated at boot.
  - platform: mics_5524
    id: mics_5524_fixed
    voltage: mics_5524_adc
    air_reference: 3.6
    hydrogen:
      id: mics_5524_h2
      name: MiCS-5524 H2
