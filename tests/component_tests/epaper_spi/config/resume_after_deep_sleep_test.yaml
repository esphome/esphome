esphome:
  name: test

esp32:
  board: esp32dev

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19

display:
  - platform: epaper_spi
    id: epaper_display
    model: ssd1681
    dc_pin: GPIO21
    busy_pin: GPIO22
    reset_pin: GPIO23
    cs_pin: GPIO5
    full_update_every: 20
    partial_update_after_deep_sleep: panel
