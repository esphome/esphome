esphome:
  name: test

esp32:
  board: esp32dev

spi:
  clk_pin: GPIO18
  mosi_pin: GPIO19

display:
  - platform: epaper_spi
    id: epaper_display
    model: ssd1677
    dc_pin: GPIO21
    busy_pin: GPIO22
    reset_pin: GPIO23
    cs_pin: GPIO5
    full_update_every: 5
    dimensions:
      width: 200
      height: 200

binary_sensor:
  - platform: gpio
    pin: GPIO27
    name: Trigger
    on_press:
      - epaper_spi.full_update_next: epaper_display
