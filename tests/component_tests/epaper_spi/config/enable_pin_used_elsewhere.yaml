esphome:
  name: test

esp32:
  board: esp32-s3-devkitc-1

psram:
  mode: octal

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

# Takes over the model's default enable pin
switch:
  - platform: gpio
    id: panel_power
    pin: GPIO47

display:
  - platform: epaper_spi
    id: epaper_display
    model: seeed-reterminal-sticky
