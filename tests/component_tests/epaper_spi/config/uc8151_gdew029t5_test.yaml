esphome:
  name: test

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3

spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

display:
  - platform: epaper_spi
    id: epaper_display
    model: goodisplay-gdew029t5-2.9
    full_update_every: 5
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin: GPIO12
    busy_pin:
      number: GPIO13
      inverted: true
