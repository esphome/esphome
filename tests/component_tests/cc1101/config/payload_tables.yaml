---
esphome:
  name: test
  on_boot:
    then:
      - cc1101.send_packet: [0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08]
      - cc1101.send_packet:
          data: [0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08]
      - cc1101.send_packet: !lambda return {0x09};

esp32:
  board: esp32dev

spi:
  clk_pin: 18
  mosi_pin: 23
  miso_pin: 19

cc1101:
  id: transceiver
  cs_pin: 5
  gdo0_pin: 4
  frequency: 433.92MHz
  packet_mode: true
  packet_length: 8
