esphome:
  name: atm90e32-thresholds-test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

spi:
  clk_pin: GPIO18
  miso_pin: GPIO19
  mosi_pin: GPIO23

sensor:
  - platform: atm90e32
    cs_pin: GPIO16
    line_frequency: 60Hz
    phase_a:
      current:
        name: Phase A Current
    thresholds:
      current_peak: 65.535A
      frequency_low_hz: 58Hz
      frequency_high_hz: 62Hz
