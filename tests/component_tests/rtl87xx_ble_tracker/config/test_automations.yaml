wifi:
  ssid: MySSID
  password: password1

esphome:
  name: rtl-trigger-codegen
  on_boot:
    then:
      - rtl87xx_ble_tracker.start_scan:
          continuous: true
      # Bare form: restores the configured scan_parameters mode — no
      # set_continuous emitted (asserted in the codegen test).
      - rtl87xx_ble_tracker.start_scan:
      - rtl87xx_ble_tracker.stop_scan

rtl87xx:
  board: bw16
  # The stock releases have no realtek-ambd yet; any non-stock source passes
  # the framework guard (codegen tests never fetch the framework).
  framework:
    version: 1.13.0
    source: https://github.com/libretiny-eu/libretiny.git#ambd

rtl87xx_ble_tracker:
  scan_parameters:
    continuous: false
    active: false
  on_ble_advertise:
    - mac_address:
        - AC:37:43:77:5F:4C
        - 11:22:33:44:55:66
      then:
        - lambda: 'char addr[MAC_ADDRESS_PRETTY_BUFFER_SIZE]; ESP_LOGD("t", "%s", x.address_str_to(addr));'
  on_ble_service_data_advertise:
    - service_uuid: ABCDABCD-ABCD-ABCD-ABCD-ABCDABCDABCD
      mac_address: AC:37:43:77:5F:4C
      then:
        - lambda: 'ESP_LOGD("t", "%zu", x.size());'
    - service_uuid: ABCDABCD
      then:
        - lambda: 'ESP_LOGD("t", "%zu", x.size());'
  on_ble_manufacturer_data_advertise:
    - manufacturer_id: ABCD
      then:
        - lambda: 'ESP_LOGD("t", "%zu", x.size());'
    - manufacturer_id: ABCDABCD
      then:
        - lambda: 'ESP_LOGD("t", "%zu", x.size());'
    - manufacturer_id: ABCDABCD-ABCD-ABCD-ABCD-ABCDABCDABCD
      then:
        - lambda: 'ESP_LOGD("t", "%zu", x.size());'
  on_scan_end:
    - then:
        - lambda: 'ESP_LOGD("t", "end");'
