esphome:
  name: vl53l4cx-test

esp32:
  board: esp32dev

i2c:
  id: i2c_bus
  sda: GPIO21
  scl: GPIO22

sensor:
  - platform: vl53l4cx
    i2c_id: i2c_bus
    id: garage
    name: Garage Distance
    address: 0x2C
    enable_pin: GPIO32
    interrupt_pin: GPIO35
    target: farthest
    min_distance: 100mm
    update_interval: 33ms
