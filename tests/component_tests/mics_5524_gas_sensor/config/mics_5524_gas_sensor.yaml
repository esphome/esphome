esphome:
  name: test

esp32:
  board: esp32dev

sensor:
  - platform: adc
    id: mics_5524_adc
    name: MiCS-5524 AO
    pin: GPIO34

  # Calibrated at boot: the reference is averaged from clean air, then every gas
  # below it is published with the same ratio.
  - platform: mics_5524_gas_sensor
    id: mics_5524_boot
    voltage: mics_5524_adc
    voltage_multiplier: 1.5
    sample_count: 3
    calibration:
      delay: 5s
      sample_count: 3
    carbon_monoxide:
      id: mics_5524_co
      name: MiCS-5524 CO
      max_ppm: 500.0
    methane:
      id: mics_5524_ch4
      name: MiCS-5524 CH4

  # The reference is hard-coded, so nothing is calibrated at boot.
  - platform: mics_5524_gas_sensor
    id: mics_5524_fixed
    voltage: mics_5524_adc
    air_reference: 3.6
    hydrogen:
      id: mics_5524_h2
      name: MiCS-5524 H2

  # The datasheet model, with the ADC this component owns: `pin:` creates the hidden
  # `adc` sensor, and the 10k/20k divider brings the 5 V of the breakout down to the
  # 3.33 V the ESP32 ADC measures, which `adc_input_max:` has to allow.
  - platform: mics_5524_gas_sensor
    id: mics_5524_pin
    pin: GPIO32
    voltage_divider:
      r1: 10000
      r2: 20000
    adc_input_max: 3.34
    conversion: datasheet
    r0: 10.0
    # Diagnostics of this reading: the ratio and RS of the active model, and the voltage
    # they were computed from.  They belong to this hub, which declares them itself.
    ratio_sensor:
      id: mics_5524_ratio
      name: MiCS-5524 ratio
    rs_sensor:
      id: mics_5524_rs
      name: MiCS-5524 RS
    voltage_sensor:
      id: mics_5524_volts
      name: MiCS-5524 volts
    carbon_monoxide:
      id: mics_5524_co_ds
      name: MiCS-5524 CO (datasheet)
      max_ppm: 2000.0

