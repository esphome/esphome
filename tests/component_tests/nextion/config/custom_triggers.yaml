esphome:
  name: test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

uart:
  tx_pin: 17
  rx_pin: 16
  baud_rate: 115200

display:
  - platform: nextion
    on_custom_text_sensor:
      - then:
          - lambda: 'ESP_LOGD("test", "%s=%s", key.c_str(), value.c_str());'
      - then:
          - delay: 1s
          - lambda: 'ESP_LOGD("test", "%s=%s", key.c_str(), value.c_str());'
