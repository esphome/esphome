    tt21100_id: ts1
    id: key3
    index: 3
  - platform: tt21100
    tt21100_id: ts1
    id: key0
    index: 0
  - platform: tt21100
    tt21100_id: ts2
    id: other0
    index: 0
  - platform: tt21100
    tt21100_id: ts1
    id: key0_again
    index: 0
