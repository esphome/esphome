esphome:
  name: test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

wifi:
  ssid: "test_ssid"
  password: "test_password"

logger:

api:

time:
  - platform: sntp
    id: sntp_time
    timezone: UTC0
    on_time:
      - seconds: 0
        then:
          - logger.log: sntp_first
      - seconds: 30
        then:
          - logger.log: sntp_second
  - platform: homeassistant
    id: ha_time
    timezone: UTC0
    on_time:
      - seconds: 15
        then:
          - logger.log: ha_only
