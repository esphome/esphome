esphome:
  name: test

esp32:
  board: esp32dev

wifi:
  ssid: SomeNetwork
  password: SomePassword

logger:

globals:
  - id: doubled
    type: int
    initial_value: "0"
  # Same id the respond_named cleanup action would get without a uniqueness check
  - id: worker__after
    type: int
    initial_value: "0"

api:
  actions:
    - action: no_args
      then:
        - logger.log: "NO_ARGS called"
        - globals.set:
            id: doubled
            value: "1"
    - action: mixed_args
      variables:
        bool_: bool
        int_: int
        float_: float
        string_: string
        int_arr: int[]
        string_arr: string[]
      then:
        - logger.log:
            format: "MIXED %d %ld %.1f %s %zu %zu"
            args:
              - bool_
              - (long) int_
              - float_
              - string_.c_str()
              - int_arr.size()
              - string_arr.size()
    # A lambda action gets the arguments by value, so it may change them
    - action: by_value
      variables:
        x: int
      then:
        - lambda: |-
            x *= 2;
            ESP_LOGD("test", "BY_VALUE %d", x);
        - lambda: |-
            ESP_LOGD("test", "BY_VALUE again %d", x *= 2);
    - action: with_delay
      variables:
        name: string
        int_arr: int[]
      then:
        - logger.log: "WITH_DELAY before"
        - delay: 10ms
        - logger.log:
            format: "WITH_DELAY %s %zu"
            args: [name.c_str(), int_arr.size()]
    - action: respond_optional
      variables:
        value: int
      then:
        - api.respond:
            data: !lambda |-
              root["value"] = value;
    - action: respond_only
      supports_response: only
      variables:
        name: string
      then:
        - logger.log:
            format: "RESPOND_ONLY %s"
            args: [name.c_str()]
        - api.respond:
            data: !lambda |-
              root["name"] = name;
    - action: manual_trigger_id
      trigger_id: manual_service_trigger
      then:
        - logger.log: "MANUAL called"
    - action: respond_then_log
      then:
        - api.respond:
            success: true
        - delay: 1ms
        - logger.log: "RESPONDED"
    # Lambdas for the status and the error text
    - action: respond_error_lambda
      supports_response: status
      then:
        - api.respond:
            success: !lambda "return call_id > 1;"
            error_message: !lambda 'return std::string("failed");'
    # A response-only variable that only shares its name with the optional mode argument
    - action: respond_only_named_return_response
      supports_response: only
      variables:
        return_response: int
      then:
        - api.respond:
            data: !lambda |-
              root["n"] = return_response;
    # A response-only bool variable of that name, after another one, does not make the data optional
    - action: respond_only_bool_named_return_response
      supports_response: only
      variables:
        value: int
        return_response: bool
      then:
        - api.respond:
            data: !lambda |-
              root["value"] = value;
    # repeat: puts its iteration before call_id and return_response
    - action: respond_optional_in_repeat
      supports_response: optional
      then:
        - repeat:
            count: 1
            then:
              - api.respond:
                  data: !lambda |-
                    root["n"] = iteration;
    # A data lambda copies only the args it names, and may modify them
    - action: respond_data_copies_named_args
      supports_response: only
      variables:
        big: string
        count: int
      then:
        - api.respond:
            data: !lambda |-
              root["count"] = ++count;
    # A data lambda that adds nothing still builds
    - action: respond_data_bare_return
      supports_response: only
      then:
        - api.respond:
            data: !lambda return;
    - action: respond_error_constant
      supports_response: status
      then:
        - api.respond:
            success: false
            error_message: "not ready"
    # Only inline actions: the lambda reports the status itself
    - action: status_inline
      supports_response: status
      then:
        - logger.log: "STATUS_INLINE first"
        - lambda: |-
            api::global_api_server->send_action_response(call_id, true, StringRef());
    # A lambda may use the service's own id
    - action: self_reference
      trigger_id: self_reference_service
      then:
        - lambda: |-
            ESP_LOGD("test", "SELF_REFERENCE %p", (const void *) id(self_reference_service));
    # A config id that the response cleanup action's generated id would otherwise take
    - action: respond_named
      automation_id: worker
      supports_response: only
      then:
        - api.respond:
            data: !lambda |-
              root["ok"] = true;
        # Not inline, so the cleanup is an action of its own
        - delay: 1ms
