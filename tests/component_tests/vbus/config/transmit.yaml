esphome:
  name: vbus-tx-codegen
host:
logger:
uart:
  id: test_uart
  port: /dev/null
  baud_rate: 9600
vbus:
  id: test_bus
  uart_id: test_uart
  transmit:
    destination: 0x2211

button:
  - platform: template
    name: Read VBus Value
    on_press:
      - vbus.send_datagram:
          id: test_bus
          command: 0x0300
          value_id: !lambda return 2;
