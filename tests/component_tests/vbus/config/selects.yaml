esphome:
  name: vbus-selects-codegen
host: {}
logger: {}
uart:
  id: test_uart
  port: /dev/null
  baud_rate: 9600
vbus:
  id: select_bus
  transmit:
    destination: 8721
    transactions:
      controller:
        id: select_controller
        model: deltasol_cs_plus
        writes:
          require_write_arm: false
select:
