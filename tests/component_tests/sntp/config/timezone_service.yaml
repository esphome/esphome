esphome:
  name: sntp-timezone-test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

wifi:
  ssid: "testssid"
  password: "testpassword"

http_request:

time:
  - platform: sntp
    id: sntp_time
    timezone:
      zone: Europe/London
      update_interval: 30min

text_sensor:
  - platform: sntp
    name: Timezone Abbreviation

script:
  - id: change_timezone
    then:
      - time.sntp.set_timezone: Australia/Sydney
      - time.sntp.set_timezone:
          latitude: 40.71
          longitude: -74.01°
