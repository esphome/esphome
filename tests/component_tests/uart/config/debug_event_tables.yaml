esphome:
  name: test

esp8266:
  board: esp01_1m

uart:
  - id: uart_a
    tx_pin: GPIO1
    rx_pin: GPIO3
    baud_rate: 9600
    debug:
      after:
        delimiter: "\r\n"
  - id: uart_b
    tx_pin: GPIO2
    baud_rate: 9600
    debug:
      after:
        delimiter: [0x0D, 0x0A]

event:
  - platform: uart
    uart_id: uart_a
    name: Event A
    event_types:
      - "start": "*A#"
      - "stop": [0x2A, 0x42, 0x23]
  - platform: uart
    uart_id: uart_a
    name: Event B
    event_types:
      - "start": "*A#"
      - "stop": [0x2A, 0x42, 0x23]
