---
esphome:
  name: test
  on_boot:
    then:
      - uart.write: [0x01, 0x02, 0x03]
      - uart.write: !lambda return {0x09};
      - uart.write: ""

esp32:
  board: esp32dev

uart:
  tx_pin: 17
  rx_pin: 16
  baud_rate: 9600

switch:
  - platform: uart
    id: shared_switch
    name: Shared Switch
    data: [0x01, 0x02, 0x03]
  - platform: uart
    id: on_off_switch
    name: On Off Switch
    data:
      turn_on: "ON"
      turn_off: [0x04]

button:
  - platform: uart
    id: shared_button
    name: Shared Button
    data: [0x01, 0x02, 0x03]
