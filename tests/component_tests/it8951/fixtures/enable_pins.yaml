esphome:
  name: it8951-enable-pins

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

psram:
  mode: octal

spi:
  clk_pin: 7
  mosi_pin: 9
  miso_pin: 8

# Takes over the model's default 1.8V logic supply enable pin
switch:
  - platform: gpio
    id: logic_supply
    pin: GPIO21

display:
  - platform: it8951
    id: epaper_display
    model: seeed-reterminal-e1003
