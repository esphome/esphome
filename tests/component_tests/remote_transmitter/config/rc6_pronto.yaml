esphome:
  name: test

esp8266:
  board: esp01_1m

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

button:
  - platform: template
    name: RC6 one
    on_press:
      - remote_transmitter.transmit_rc6:
          address: 0x00
          command: 0x0C
  - platform: template
    name: RC6 two
    on_press:
      - remote_transmitter.transmit_rc6:
          address: 0x00
          command: 0x0D
  - platform: template
    name: Pronto
    on_press:
      - remote_transmitter.transmit_pronto:
          data: "0000 006D 0001 0000 0015 0016"
