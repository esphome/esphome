esphome:
  name: test

esp8266:
  board: esp01_1m

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

button:
  - platform: template
    name: ABBWelcome fixed id
    on_press:
      - remote_transmitter.transmit_abbwelcome:
          source_address: 0x123456
          destination_address: 0x56789A
          three_byte_address: true
          message_type: 0x01
          message_id: 0x42
          data: [0x10]
  - platform: template
    name: AEHA lambda
    on_press:
      - remote_transmitter.transmit_aeha:
          address: !lambda return 0x8008;
          carrier_frequency: 36700Hz
          data: !lambda return {0x00, 0x02};
  - platform: template
    name: Midea lambda
    on_press:
      - remote_transmitter.transmit_midea:
          code: !lambda return {0xA2, 0x08, 0xFF, 0xFF, 0xFF};
  - platform: template
    name: Pioneer WYT lambda
    on_press:
      - remote_transmitter.transmit_pioneer_wyt:
          code: !lambda return {0x23, 0xCB, 0x26, 0x01, 0x00, 0x24, 0x03, 0x05, 0x00, 0x00, 0x00, 0x00, 0x80};
