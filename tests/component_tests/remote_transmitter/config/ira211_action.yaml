esphome:
  name: test

esp8266:
  board: esp01_1m

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

button:
  - platform: template
    name: IRA211 constant
    on_press:
      - remote_transmitter.transmit_ira211:
          command: sync
          temperature: 22.5
          mode: timer
          fan_mode: high
  - platform: template
    name: IRA211 lambda temperature
    on_press:
      - remote_transmitter.transmit_ira211:
          command: sync
          temperature: !lambda return 21.0f;
