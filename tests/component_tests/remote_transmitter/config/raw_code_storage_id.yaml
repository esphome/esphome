esphome:
  name: test

esp8266:
  board: esp01_1m

remote_transmitter:
  id: tx
  pin: GPIO4
  carrier_duty_percent: 50%

button:
  - platform: template
    name: Raw named
    on_press:
      - remote_transmitter.transmit_raw:
          code: [1000, -1000, 500, -500]
          code_storage_id: my_raw_code
      - lambda: |-
          ESP_LOGD("test", "Code size %u", (unsigned) sizeof(my_raw_code));
  - platform: template
    name: Raw generated
    on_press:
      - remote_transmitter.transmit_raw:
          code: [1000, -1000, 500, -500]
