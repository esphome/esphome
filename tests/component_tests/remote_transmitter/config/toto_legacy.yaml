esphome:
  name: test

esp8266:
  board: esp01_1m

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

button:
  - platform: template
    name: Toto code
    on_press:
      - remote_transmitter.transmit_toto:
          code: 0x37BB
  - platform: template
    name: Toto legacy fields
    on_press:
      - remote_transmitter.transmit_toto:
          command: 0xEC
          rc_code_1: 0x0D
          rc_code_2: 0x0D
  - platform: template
    name: Toto legacy command only
    on_press:
      - remote_transmitter.transmit_toto:
          command: 0xB0
