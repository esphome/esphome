esphome:
  name: test

esp8266:
  board: esp01_1m

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

script:
  - id: send_nec
    parameters:
      x: int
    then:
      - remote_transmitter.transmit_nec:
          address: !lambda "x *= 2; return x;"
          command: !lambda "return x *= 2;"
