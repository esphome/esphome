esphome:
  name: test

esp8266:
  board: esp01_1m

remote_transmitter:
  pin: GPIO4
  carrier_duty_percent: 50%

button:
  - platform: template
    name: Toto default repeat
    on_press:
      - remote_transmitter.transmit_toto:
          code: 0x37BB
  - platform: template
    name: Toto explicit repeat
    on_press:
      - remote_transmitter.transmit_toto:
          code: 0x37BB
          repeat:
            times: 2
            wait_time: 20ms
  - platform: template
    name: NEC default wait
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0x4242
          command: 0x8484
          repeat: 4
  - platform: template
    name: NEC once
    on_press:
      - remote_transmitter.transmit_nec:
          address: 0x4242
          command: 0x8484
