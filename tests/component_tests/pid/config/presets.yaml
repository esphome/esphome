esphome:
  name: test

logger:

esp8266:
  board: esp01_1m

output:
  - platform: template
    id: heater
    type: float
    write_action: []

sensor:
  - platform: template
    id: room_temp
    lambda: return 21.0;

climate:
  - platform: pid
    id: room
    name: Room
    sensor: room_temp
    default_target_temperature: 21°C
    heat_output: heater
    control_parameters:
      kp: 0.4
    preset:
      - name: Home
        default_target_temperature: 22°C
      - name: Frost protection
        default_target_temperature: 7°C
    default_preset: HOME
    on_boot_restore_from: DEFAULT_PRESET
    preset_change:
      - logger.log: Preset changed
