esphome:
  name: test

esp32:
  board: esp32dev

number:
  - platform: template
    id: level
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    on_value_range:
      - trigger_id: level_range
        above: 10
        below: 90
        then:
          - number.set:
              id: level
              value: 50
