esphome:
  name: test

esp32:
  board: esp32dev

number:
  - platform: template
    id: source
    min_value: 0
    max_value: 100
    step: 1
    optimistic: true
    on_value_range:
      - trigger_id: range_trigger
        above: !lambda "return id(range_trigger).is_action_running() ? 100.0f : 10.0f;"
        then:
          - delay: 1s
