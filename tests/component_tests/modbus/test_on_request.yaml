---
esphome:
  name: test

esp32:
  board: nodemcu-32s

uart:
  - id: master_uart
    tx_pin: GPIO17
    rx_pin: GPIO16
    baud_rate: 9600
  - id: plain_uart
    tx_pin: GPIO18
    rx_pin: GPIO19
    baud_rate: 9600

modbus:
  - id: master_port
    uart_id: master_uart
    role: server
    on_request:
      - lambda: |-
          ESP_LOGD("test", "Request to %u", address);
  - id: plain_server
    uart_id: plain_uart
    role: server
