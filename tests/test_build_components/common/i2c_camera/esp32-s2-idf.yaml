# I2C bus and camera pins for the ESP32-S2 test target.
psram:
  mode: quad

i2c:
  - id: i2c_camera_bus
    sda: 13
    scl: 14
    frequency: 400kHz

esp32_camera:
  id: test_camera
  name: ESP32 Camera
  data_pins:
    - number: 1
    - number: 2
    - number: 3
    - number: 4
    - number: 5
    - number: 6
    - number: 7
    - number: 8
  vsync_pin: 9
  href_pin: 10
  pixel_clock_pin: 11
  external_clock:
    pin: 12
    frequency: 20MHz
  i2c_id: i2c_camera_bus
  reset_pin: 15
  power_down_pin: 16
  resolution: 640x480
  jpeg_quality: 10
  frame_buffer_location: PSRAM
  pixel_format: JPEG
  on_image:
    then:
      - lambda: |-
          ESP_LOGD("main", "image len=%d, data=%c", image.length, image.data[0]);
