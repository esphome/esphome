# Two UART buses for ESP32 IDF tests
# For components that need one bus per instance, such as several meter hubs
# Components must set uart_id explicitly, since there is more than one bus

substitutions:
  tx_pin: GPIO17
  rx_pin: GPIO16
  tx_pin_2: GPIO25
  rx_pin_2: GPIO26

uart:
  - id: uart_bus
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}
    baud_rate: 9600
  - id: uart_bus_2
    tx_pin: ${tx_pin_2}
    rx_pin: ${rx_pin_2}
    baud_rate: 9600
