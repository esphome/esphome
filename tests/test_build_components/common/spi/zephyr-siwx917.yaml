# Common SPI configuration for platform: zephyr, variant: siwx917 tests
# Unlike EFR32's free-mux USART, SiWx91x's GSPI only has a handful of
# enumerated candidate pins per signal (see siwx917.py's spi_pin_macros) --
# these three are real, valid options for clk/mosi/miso respectively.

substitutions:
  clk_pin: "25"
  mosi_pin: "27"
  miso_pin: "26"

spi:
  - id: spi_bus
    clk_pin: ${clk_pin}
    mosi_pin: ${mosi_pin}
    miso_pin: ${miso_pin}
