# Silicon Labs USART SPI mode is free-mux via SILABS_DBUS -- any valid pin works.
# PA1/PA2/PA3 avoid the board's own default pin claims (usart0: PC0-2, usart1: PA5/
# PA6, i2c0: PD2/PD3).
substitutions:
  clk_pin: "1"
  mosi_pin: "2"
  miso_pin: "3"

spi:
  - id: spi_bus
    clk_pin: ${clk_pin}
    mosi_pin: ${mosi_pin}
    miso_pin: ${miso_pin}
