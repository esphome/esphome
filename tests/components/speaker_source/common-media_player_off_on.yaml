substitutions:
  scl_pin: GPIO16
  sda_pin: GPIO17
  i2s_bclk_pin: GPIO27
  i2s_lrclk_pin: GPIO26
  i2s_mclk_pin: GPIO25
  i2s_dout_pin: GPIO23

<<: !include common.yaml

media_player:
  - platform: speaker_source
    on_turn_on:
      - then:
          - homeassistant.service:
              data:
                entity_id: switch.media_player_1_switch
              action: switch.turn_on
    on_turn_off:
      - then:
          - homeassistant.service:
              data:
                entity_id: switch.media_player_1_switch
              action: switch.turn_off
