one_wire:
  - platform: gpio
    id: ow_dallas_temp
    pin: 4
    use_rmt: true
    rmt_timing:
      read_threshold: 15us

sensor:
  - platform: dallas_temp
    one_wire_id: ow_dallas_temp
    address: 0x1C0000031EDD2A28
    name: Dallas Temperature 1
    resolution: 9
  - platform: dallas_temp
    one_wire_id: ow_dallas_temp
    name: Dallas Temperature 2
