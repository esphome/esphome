logger:

modem:
  id: atmodem
  rx_pin: GPIO26
  tx_pin: GPIO27
  baud_rate: 115200
  model: SIM7600
  apn: orange
  pin_code: "0000"
  enable_on_boot: True
  reboot_timeout: 5min
  on_connect:
    logger.log: "modem connected"
  on_disconnect:
    logger.log: "modem disconnected"
  on_sync:
    logger.log: "modem synced - ready for AT commands"

packages:
  - !include common.yaml
