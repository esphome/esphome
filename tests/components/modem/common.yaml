esphome:
  on_boot:
    then:
      - modem.disable
      - modem.enable
      - if:
          condition:
            modem.enabled:
          then:
            modem.send_at: "AT+CGSN"
          else:
            modem.enable:
      - if:
          condition:
            not:
              modem.connected:
          then:
            modem.reset
