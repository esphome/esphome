microphone:
  - platform: i2s_audio
    id: audio_analyzer_i2s_mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: ${din_pin}
    adc_type: external
    bits_per_sample: 16bit

speaker:
  - platform: i2s_audio
    id: audio_analyzer_i2s_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: ${dout_pin}
    dac_type: external
  - platform: audio_analyzer
    id: speaker_analyzer
    output_speaker: audio_analyzer_i2s_speaker
    buffer_duration: 500ms
    attack: 0ms
    release: 0ms

audio_analyzer:
  - id: mic_analyzer
    microphone: audio_analyzer_i2s_mic
    passive: false
    min_frequency: 80Hz
    max_frequency: 5000Hz
    power_range:
      min_db: -60
      max_db: -10
    band_range:
      min_db: -70
      max_db: -20
    attack: 20ms
    release: 300ms
    update_interval: 2s

sensor:
  - platform: audio_analyzer
    audio_analyzer_id: mic_analyzer
    power:
      name: Mic Power
    bands:
      - band: 0
        name: Mic Band 0
      - band: 11
        name: Mic Band 11
  - platform: audio_analyzer
    audio_analyzer_id: speaker_analyzer
    power:
      name: Speaker Power
  - platform: template
    name: Mic Loudest Band
    lambda: |-
      float loudest = 0.0f;
      for (uint8_t i = 0; i < id(mic_analyzer).get_num_bands(); ++i) {
        loudest = std::max(loudest, id(mic_analyzer).get_band(i));
      }
      return id(mic_analyzer).is_active() ? loudest : id(speaker_analyzer).get_power();
