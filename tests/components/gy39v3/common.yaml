sensor:
  - platform: gy39v3
    i2c_id: i2c_bus
    address: 0x5b
    illuminance:
      name: GY39v3 Illuminance
    temperature:
      name: GY39v3 Temperature
    pressure:
      name: GY39v3 Pressure
    humidity:
      name: GY39v3 Humidity
    elevation:
      name: GY39v3 Elevation
    update_interval: 60s
