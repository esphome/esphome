sensor:
  - platform: gy39v3
    i2c_id: i2c_bus
    address: 0x5b
    illuminance:
      name: GY39v3 Illuminance
    temperature:
      name: GY39v3 Temperature
    pressure:
      name: GY39v3 Pressure
    humidity:
      name: GY39v3 Humidity
    altitude:
      name: GY39v3 Elevation/Altitude [m]
    vapor_pressure_deficit:
      name: GY39v3 VPD (calculated)
    update_interval: 60s
