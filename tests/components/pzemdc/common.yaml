esphome:
  on_boot:
    then:
      - pzemdc.reset_energy: pzemdc1

modbus:
  - id: pzemdc_modbus

sensor:
  - platform: pzemdc
    modbus_id: pzemdc_modbus
    id: pzemdc1
    voltage:
      name: PZEMDC Voltage
    current:
      name: PZEMDC Current
    power:
      name: PZEMDC Power
    energy:
      name: PZEMDC Energy
