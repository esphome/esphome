esphome:
  on_boot:
    then:
      - esp32_ble_tracker.start_scan
      - esp32_ble_tracker.stop_scan

esp32_ble_tracker:
  on_ble_advertise:
    - mac_address:
        - AA:BB:CC:DD:EE:FF
        - FF:EE:DD:CC:BB:AA
      then:
        # yamllint disable rule:line-length
        - lambda: !lambda |-
            char addr[MAC_ADDRESS_PRETTY_BUFFER_SIZE];
            ESP_LOGD("main", "The device address (%s) exists in list", x.address_str_to(addr));
        # yamllint enable rule:line-length
    - mac_address: AC:37:43:77:5F:4C
      then:
        # yamllint disable rule:line-length
        - lambda: !lambda |-
            char addr[MAC_ADDRESS_PRETTY_BUFFER_SIZE];
            ESP_LOGD("main", "The device address is %s", x.address_str_to(addr));
        # yamllint enable rule:line-length
    - then:
        # yamllint disable rule:line-length
        - lambda: !lambda |-
            char addr[MAC_ADDRESS_PRETTY_BUFFER_SIZE];
            ESP_LOGD("main", "The device address is %s", x.address_str_to(addr));
        # yamllint enable rule:line-length
  on_ble_service_data_advertise:
    - service_uuid: ABCD
      then:
        - lambda: !lambda |-
            ESP_LOGD("main", "Length of service data is %zu", x.size());
    - service_uuid: ABCDABCD
      mac_address: AC:37:43:77:5F:4C
      then:
        - logger.log: "32-bit service data"
    - service_uuid: 12345678-1234-5678-1234-56789abcdef0
      then:
        - logger.log: "128-bit service data"
  on_ble_manufacturer_data_advertise:
    - manufacturer_id: ABCD
      then:
        - lambda: !lambda |-
            ESP_LOGD("main", "Length of manufacturer data is %zu", x.size());
    - manufacturer_id: ABCDABCD
      mac_address: AC:37:43:77:5F:4C
      then:
        - logger.log: "32-bit manufacturer data"
    - manufacturer_id: 12345678-1234-5678-1234-56789abcdef0
      then:
        - logger.log: "128-bit manufacturer data"
  on_scan_end:
    - then:
        - lambda: |-
             ESP_LOGD("ble_auto", "The scan has ended!");

wifi:
  ssid: MySSID
  password: password1

ota:
  - platform: esphome
