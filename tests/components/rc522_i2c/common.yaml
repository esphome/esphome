rc522_i2c:
  - id: rc522_nfcc_i2c
    i2c_id: i2c_bus
    update_interval: 1s
    on_tag:
      - lambda: |-
          ESP_LOGD("main", "Found tag UID: %s", x.c_str());
          if (tag.has_ndef_message()) {
            auto msg = tag.get_ndef_message();
            for (auto &record : msg->get_records()) {
              ESP_LOGD("main", "  NDEF record type: %s", record->get_type().c_str());
            }
          }
    on_tag_removed:
      - lambda: |-
          ESP_LOGD("main", "Tag removed: %s", x.c_str());

binary_sensor:
  - platform: rc522
    rc522_id: rc522_nfcc_i2c
    name: RC522 NFC Tag
    uid: 74-10-37-94
