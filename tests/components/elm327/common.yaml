sensor:
  - platform: elm327
    engine_rpm:
      name: Engine RPM
    vehicle_speed:
      name: Vehicle Speed
    coolant_temperature:
      name: Coolant Temperature
    engine_load:
      name: Engine Load
    throttle_position:
      name: Throttle Position
    intake_air_temperature:
      name: Intake Air Temperature
    maf_rate:
      name: MAF Rate
    fuel_level:
      name: Fuel Level
    battery_voltage:
      name: Battery Voltage
    custom_pid:
      - name: Custom Mode 01
        pid: "0x01"
      - name: Custom Mode 22
        pid: "0xB201"
        mode: 0x22
        response_bytes: 2
    update_interval: 10s
