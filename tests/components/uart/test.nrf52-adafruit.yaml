esphome:
  on_boot:
    then:
      - uart.write:
          id: uart_id
          data: 'Hello World'
      - uart.write:
          id: uart_id
          data: [0x00, 0x20, 0x42]

uart:
  - id: uart_id
    tx_pin: P1.08
    rx_pin:
      number: P1.09
      mode:
        input: true
        pullup: true
    baud_rate: 9600
    rx_buffer_size: 512
    parity: EVEN
    stop_bits: 2
    debug:
      debug_prefix: "[UART1] "
