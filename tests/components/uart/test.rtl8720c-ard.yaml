# UART1 on its second pair of pins (the board allows PA01/PA00 or PA03/PA02)
uart:
  - id: uart_id
    tx_pin: PA03
    rx_pin: PA02
    baud_rate: 9600
    data_bits: 8
    parity: NONE
    stop_bits: 1

switch:
  - platform: uart
    name: "UART Switch"
    uart_id: uart_id
    data: [0x01, 0x02, 0x03]
