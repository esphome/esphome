esphome:
  on_boot:
    then:
      - uart.write: 'Hello World'
      - uart.write: [0x00, 0x20, 0x42]

uart:
  # xg27_dk2602a leaves uart_node_labels empty (DTS auto-discovery), so UART0 always
  # resolves to whichever bus is zephyr,console -- usart1 on this board, not usart0.
  # tx_pin/rx_pin exercise the SILABS_DBUS-based remap (same pins the board's own
  # usart1_default already claims, PA5/PA6).
  - id: uart_id
    port: UART0
    tx_pin: 5
    rx_pin: 6
    baud_rate: 115200
    data_bits: 8
    parity: NONE
    stop_bits: 1
