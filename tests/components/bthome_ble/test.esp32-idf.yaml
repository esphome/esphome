esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

sensor:
  # Temperature sensor without encryption
  - platform: bthome_ble
    mac_address: "A4:C1:38:12:34:56"
    type: temperature
    name: "BTHome Temperature"

  # Humidity sensor without encryption
  - platform: bthome_ble
    mac_address: "A4:C1:38:12:34:56"
    type: humidity
    name: "BTHome Humidity"

  # Battery sensor with encryption
  - platform: bthome_ble
    mac_address: "A4:C1:38:78:90:AB"
    bindkey: "231d39c1d7cc1ab1aee224cd096db932"
    type: battery
    name: "BTHome Battery Encrypted"

  # Pressure sensor
  - platform: bthome_ble
    mac_address: "A4:C1:38:12:34:56"
    type: pressure
    name: "BTHome Pressure"

  # Illuminance sensor
  - platform: bthome_ble
    mac_address: "A4:C1:38:12:34:56"
    type: illuminance
    name: "BTHome Illuminance"

  # Power sensor
  - platform: bthome_ble
    mac_address: "A4:C1:38:CD:EF:12"
    type: power
    name: "BTHome Power"

  # Energy sensor
  - platform: bthome_ble
    mac_address: "A4:C1:38:CD:EF:12"
    type: energy
    name: "BTHome Energy"

  # Voltage sensor
  - platform: bthome_ble
    mac_address: "A4:C1:38:CD:EF:12"
    type: voltage
    name: "BTHome Voltage"

  # Current sensor
  - platform: bthome_ble
    mac_address: "A4:C1:38:CD:EF:12"
    type: current
    name: "BTHome Current"

  # PM2.5 sensor
  - platform: bthome_ble
    mac_address: "A4:C1:38:34:56:78"
    type: pm25
    name: "BTHome PM2.5"

  # PM10 sensor
  - platform: bthome_ble
    mac_address: "A4:C1:38:34:56:78"
    type: pm10
    name: "BTHome PM10"

  # CO2 sensor
  - platform: bthome_ble
    mac_address: "A4:C1:38:34:56:78"
    type: co2
    name: "BTHome CO2"

  # VOC sensor
  - platform: bthome_ble
    mac_address: "A4:C1:38:34:56:78"
    type: voc
    name: "BTHome VOC"

  # Moisture sensor
  - platform: bthome_ble
    mac_address: "A4:C1:38:34:56:78"
    type: moisture
    name: "BTHome Moisture"

binary_sensor:
  # Motion sensor without encryption
  - platform: bthome_ble
    mac_address: "A4:C1:38:9A:BC:DE"
    type: motion
    name: "BTHome Motion"

  # Door sensor with encryption
  - platform: bthome_ble
    mac_address: "A4:C1:38:9A:BC:DE"
    bindkey: "231d39c1d7cc1ab1aee224cd096db932"
    type: door
    name: "BTHome Door Encrypted"

  # Window sensor
  - platform: bthome_ble
    mac_address: "A4:C1:38:9A:BC:DE"
    type: window
    name: "BTHome Window"

  # Battery low sensor
  - platform: bthome_ble
    mac_address: "A4:C1:38:9A:BC:DE"
    type: battery_low
    name: "BTHome Battery Low"

  # Occupancy sensor
  - platform: bthome_ble
    mac_address: "A4:C1:38:9A:BC:DE"
    type: occupancy
    name: "BTHome Occupancy"

  # Smoke sensor
  - platform: bthome_ble
    mac_address: "A4:C1:38:9A:BC:DE"
    type: smoke
    name: "BTHome Smoke"

  # Moisture binary sensor
  - platform: bthome_ble
    mac_address: "A4:C1:38:9A:BC:DE"
    type: moisture
    name: "BTHome Moisture Binary"

  # Opening sensor
  - platform: bthome_ble
    mac_address: "A4:C1:38:9A:BC:DE"
    type: opening
    name: "BTHome Opening"
