esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

sensor:
  - platform: bthome_ble
    mac_address: "A4:C1:38:12:34:56"
    type: temperature
    name: "BTHome Temperature"

  - platform: bthome_ble
    mac_address: "A4:C1:38:12:34:56"
    type: humidity
    name: "BTHome Humidity"

  - platform: bthome_ble
    mac_address: "A4:C1:38:78:90:AB"
    bindkey: "231d39c1d7cc1ab1aee224cd096db932"
    type: battery
    name: "BTHome Battery"

binary_sensor:
  - platform: bthome_ble
    mac_address: "A4:C1:38:9A:BC:DE"
    type: motion
    name: "BTHome Motion"

  - platform: bthome_ble
    mac_address: "A4:C1:38:9A:BC:DE"
    bindkey: "231d39c1d7cc1ab1aee224cd096db932"
    type: door
    name: "BTHome Door"
