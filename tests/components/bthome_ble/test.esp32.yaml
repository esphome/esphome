esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true

sensor:
  - platform: bthome_ble
    mac_address: "A4:C1:38:12:34:56"
    sensors:
      - type: temperature
        name: "BTHome Temperature"
      - type: humidity
        name: "BTHome Humidity"

  - platform: bthome_ble
    mac_address: "A4:C1:38:78:90:AB"
    bindkey: "231d39c1d7cc1ab1aee224cd096db932"
    sensors:
      - type: battery
        name: "BTHome Battery"
      - type: pressure
        name: "BTHome Pressure"

binary_sensor:
  - platform: bthome_ble
    mac_address: "A4:C1:38:9A:BC:DE"
    binary_sensors:
      - type: motion
        name: "BTHome Motion"
      - type: window
        name: "BTHome Window"

  - platform: bthome_ble
    mac_address: "A4:C1:38:AB:CD:EF"
    bindkey: "231d39c1d7cc1ab1aee224cd096db932"
    binary_sensors:
      - type: door
        name: "BTHome Door"
      - type: occupancy
        name: "BTHome Occupancy"
