canopen:
  id: canopen_hub
  response_timeout: 250ms

sensor:
  - platform: canopen
    name: CANopen position
    node_id: 32
    index: 0x6064
    value_type: INT32
  - platform: canopen
    name: CANopen statusword
    node_id: 33
    index: 0x6041
    value_type: UINT16
  - platform: canopen
    name: CANopen temperature
    node_id: 33
    index: 0x2000
    subindex: 1
    value_type: FLOAT32

interval:
  - interval: 60s
    then:
      - canopen.sdo_write:
          id: canopen_hub
          node_id: 32
          index: 0x2000
          subindex: 1
          size: 1
          value: 42
      - canopen.sdo_write:
          id: canopen_hub
          node_id: 33
          index: 0x2001
          size: 4
          value: !lambda return uint32_t{1234};
