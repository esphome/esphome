tca9555:
  - id: tca9555_hub
    i2c_id: i2c_bus
    address: 0x21

binary_sensor:
  - platform: gpio
    id: tca9555_binary_sensor
    name: TCA9555 Binary Sensor
    pin:
      tca9555: tca9555_hub
      number: 1
      mode: INPUT
      inverted: true

output:
  - platform: gpio
    id: tca9555_output
    pin:
      tca9555: tca9555_hub
      number: 0
      mode: OUTPUT
      inverted: false
  - platform: gpio
    id: tca9555_open_drain_output
    pin:
      tca9555: tca9555_hub
      number: 2
      mode:
        output: true
        open_drain: true
      inverted: false
