wifi:
  ssid: MySSID
  password: password1

tcp_uart:
  - id: shelly_link
    host: 192.0.2.10
    port: 502
  - id: inbound
    role: server
    port: 1502

modbus_tcp_uart:
  - id: shelly_uart
    tcp_uart_id: shelly_link
  - id: answer
    tcp_uart_id: inbound
    role: server

modbus:
  - id: modbus_bus
    uart_id: shelly_uart
  - id: answer_hub
    uart_id: answer
    role: server

modbus_server:
  - id: answer_server
    modbus_id: answer_hub
