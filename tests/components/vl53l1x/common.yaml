sensor:
  - platform: vl53l1x
    i2c_id: i2c_bus
    name: VL53L1X Distance
    address: 0x31
    enable_pin: GPIO12
  - platform: vl53l1x
    i2c_id: i2c_bus
    name: VL53L1X Short Range
    address: 0x30
    enable_pin: GPIO13
    distance_mode: medium
    timing_budget: 33ms
    roi_width: 8
    roi_height: 8
    offset: 5
    signal_rate_limit: 2.0
    roi_center: 167
