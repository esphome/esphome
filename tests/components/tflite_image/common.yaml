# ESPHome build test: the image kind is the configuration entry and
# tflite_micro_runtime is loaded in the background. The model is pinned to a
# commit so a push to that repository cannot change what ESPHome CI builds.
tflite_image:
  - id: test_image
    model: https://raw.githubusercontent.com/nliaudat/esphome_ai_component/4ca8470aba1b226071bcc3258f3b95fab08895d6/models/digit_recognizer_v24_quantized_integer_quant_uint8.tflite
    input_width: 32
    input_height: 20
    input_channels: 3
