sensor:
  - platform: pulse_counter
    id: pulse_counter_sensor
    name: Pulse Counter
    pin: 4
    count_mode:
      rising_edge: INCREMENT
      falling_edge: DECREMENT
    internal_filter: 13us
    update_interval: 15s
    on_value:
      - pulse_counter.set_total_pulses:
          id: pulse_counter_sensor
          value: 12345
      - pulse_counter.set_total_pulses:
          id: pulse_counter_sensor
          value: !lambda return (uint32_t) x;
