binary_sensor:
  - platform: switch
    id: switch_some_binary_sensor
    name: "Template Switch State"
    source_id: the_switch

switch:
  - platform: template
    name: "Template Switch"
    id: the_switch
    optimistic: true
    on_state:
      - if:
          condition:
            - lambda: return x;
          then:
            - logger.log: "Switch turned ON"
          else:
            - logger.log: "Switch turned OFF"
    on_turn_on:
      - logger.log: "Switch is now ON"
    on_turn_off:
      - logger.log: "Switch is now OFF"
  # Every accepted cause fails safe, so the option needs no platform gate.
  - platform: template
    name: "Reset Cause Override Switch"
    id: reset_cause_override_switch
    optimistic: true
    restore_mode: ALWAYS_ON
    restore_mode_on_reset:
      software: RESTORE_DEFAULT_OFF
      watchdog: ALWAYS_OFF
      external: ALWAYS_ON

esphome:
  on_boot:
    - switch.turn_on: the_switch
    - switch.turn_off: the_switch
    - switch.control:
        id: the_switch
        state: !lambda return (1 > 2);
    - if:
        condition:
          switch.is_on: the_switch
        then:
          - logger.log: "Switch is on"
    - if:
        condition:
          switch.is_off: the_switch
        then:
          - logger.log: "Switch is off"
