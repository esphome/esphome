packages:
  spi: !include ../../test_build_components/common/spi/esp32-idf.yaml

wifi:
  ssid: MySSID
  password: password1

http_request:

image:
  - platform: online_image
    id: online_progressive_jpeg_image
    url: http://www.faqs.org/images/library.jpg
    format: JPEG
    decoder: LIBJPEG_TURBO
    type: RGB565

display:
  - platform: ili9xxx
    spi_id: spi_bus
    id: online_image_main_lcd
    model: ili9342
    cs_pin: 20
    dc_pin: 13
    reset_pin: 21
    invert_colors: true
    lambda: |-
      it.fill(Color(0, 0, 0));
      it.image(0, 0, id(online_progressive_jpeg_image));
