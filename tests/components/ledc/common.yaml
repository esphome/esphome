esphome:
  on_boot:
    then:
      - output.ledc.set_frequency:
          id: test_ledc
          frequency: 100Hz
      - output.ledc.set_frequency:
          id: test_ledc
          frequency: !lambda return 200.0f;

output:
  - platform: ledc
    id: test_ledc
    pin: 4
  - platform: ledc
    id: test_ledc_dithered
    pin: 5
    channel: 2
    frequency: 19531Hz
    dithering: true
