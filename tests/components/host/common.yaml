time:
  - platform: host
    id: esptime
    timezone: Australia/Sydney

logger:
  level: VERBOSE

host:
  mac_address: "62:23:45:AF:B3:DD"

esphome:
  on_boot:
    - lambda: |-
        static const uint8_t my_addr[6] = {0xFF, 0xFF, 0xFF, 0xFF, 0xFF, 0xFF};
        if (!mac_address_is_valid(my_addr))
          ESP_LOGD("test", "Invalid mac address %X", my_addr[0]); // etc.
        int x = 100;
        x = clamp(x, 50, 90);
        assert(x == 90);
        x = clamp_at_least(x, 95);
        assert(x == 95);
        x = clamp_at_most(x, 40);
        assert(x == 40);
    - lambda: |-
        auto result = esphome::host::execute_shell_command("hostname");
        id(last_exit_code).publish_state(result.exit_code);
        id(last_stdout).publish_state(result.stdout_output.substr(0, 255));
        id(last_stderr).publish_state(result.stderr_output);

text_sensor:
  - platform: template
    id: last_stdout
    entity_category: diagnostic
    name: "Last Command Stdout"
  - platform: template
    id: last_stderr
    entity_category: diagnostic
    name: "Last Command Stderr"

sensor:
  - platform: template
    id: last_exit_code
    entity_category: diagnostic
    name: "Last Command Exit Code"
