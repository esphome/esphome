# Enables USE_SENSOR for host unit tests; tests attach their own sensor instances.
sensor:
  - platform: template
    id: bench_flow
    name: "Flow"
  - platform: template
    id: bench_temperature
    name: "Temperature"

# Enables USE_TEXT_SENSOR for host unit tests; tests attach their own text sensor instances.
text_sensor:
  - platform: template
    id: bench_device_id
    name: "Device ID"
  - platform: template
    id: bench_software_version
    name: "Software version"
