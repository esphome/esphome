as734x:
  - id: as7341_hub
    type: AS7341
    i2c_id: i2c_bus
    update_interval: 15s
    gain: X8
    atime: 120
    astep: 99
  - id: as7343_hub
    type: AS7343
    i2c_id: i2c_bus
    address: 0x3A
    gain: X512
  - id: tcs3448_hub
    type: TCS3448
    i2c_id: i2c_bus
    gain: X2048

sensor:
  - platform: as734x
    as734x_id: as7341_hub
    counts:
      f1:
        name: AS7341 F1
      nir:
        name: AS7341 NIR
      clear:
        name: AS7341 Clear
  - platform: as734x
    as734x_id: as7343_hub
    counts:
      fz:
        name: AS7343 FZ
      fxl:
        name: AS7343 FXL
      clear:
        name: AS7343 Clear
  - platform: as734x
    as734x_id: tcs3448_hub
    counts:
      f1:
        name: TCS3448 F1
      fy:
        name: TCS3448 FY
