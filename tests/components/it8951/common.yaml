display:
  # Generic IT8951 with explicit dimensions
  - platform: it8951
    id: epd
    spi_id: spi_bus
    model: it8951
    dimensions:
      width: 1872
      height: 1404
    cs_pin:
      allow_other_uses: true
      number: GPIO5
    reset_pin:
      allow_other_uses: true
      number: GPIO16
    busy_pin:
      allow_other_uses: true
      number: GPIO4
    enable_pin:
      - GPIO17
      - GPIO18
    vcom: 1500
    update_interval: 60s
    # Exercise an alias for the update_mode config option.
    update_mode: fast
    lambda: |-
      it.circle(64, 64, 50, Color::BLACK);
      // Compile coverage for the bulk frame helpers: a host that renders the whole
      // screen elsewhere writes straight into the framebuffer and declares the region
      // instead of going through per-pixel drawing.
      uint8_t *fb = id(epd)->framebuffer_data();
      const size_t fb_size = id(epd)->framebuffer_size();
      if (fb != nullptr && fb_size > 0) {
        fb[0] = 0x00;
      }
      id(epd)->mark_dirty_area(0, 0, it.get_width(), it.get_height());
      id(epd)->mark_dirty_full();
      id(epd)->force_full_gc16();
      ESP_LOGD("it8951_test", "idle=%u fb=%u", static_cast<unsigned>(id(epd)->is_idle()),
               static_cast<unsigned>(fb_size));

  # m5stack-m5paper (960x540) — model supplies pin defaults
  - platform: it8951
    id: m5epd_display
    spi_id: spi_bus
    model: m5stack-m5paper
    cs_pin:
      allow_other_uses: true
      number: GPIO5
    reset_pin:
      allow_other_uses: true
      number: GPIO16
    busy_pin:
      allow_other_uses: true
      number: GPIO4
    full_update_every: 30
    invert_colors: false
    sleep_when_done: true
    grayscale: true
    update_mode: GC16
    rotation: 270
    transform:
      mirror_x: false
      mirror_y: false
    lambda: |-
      it.filled_rectangle(0, 0, it.get_width(), it.get_height(), Color::WHITE);
      it.circle(it.get_width() / 2, it.get_height() / 2, 30, Color::BLACK);

  # seeed-reterminal-e1003 (1872x1404)
  - platform: it8951
    spi_id: spi_bus
    model: seeed-reterminal-e1003
    update_mode: DEFAULT
    cs_pin:
      allow_other_uses: true
      number: GPIO5
    reset_pin:
      allow_other_uses: true
      number: GPIO16
    busy_pin:
      allow_other_uses: true
      number: GPIO4
    vcom: 1400
    sleep_when_done: false
    lambda: |-
      it.filled_rectangle(0, 0, 128, 128, Color::BLACK);

  # seeed-ee03 (1872x1404), monochrome fast path
  - platform: it8951
    spi_id: spi_bus
    model: seeed-ee03
    cs_pin:
      allow_other_uses: true
      number: GPIO5
    reset_pin:
      allow_other_uses: true
      number: GPIO16
    busy_pin:
      allow_other_uses: true
      number: GPIO4
    grayscale: false
    dithering: false
    update_mode: DU
    lambda: |-
      it.circle(128, 128, 64, Color::BLACK);

# Exercise the it8951.update automation: alias modes, a direct enum-name mode,
# and the bare (default-mode) form.
interval:
  - interval: 30s
    then:
      - it8951.update:
          id: m5epd_display
          mode: fast
      - it8951.update:
          id: m5epd_display
          mode: full
      - it8951.update:
          id: m5epd_display
          mode: A2
      - it8951.update: m5epd_display
      - it8951.update:
          id: m5epd_display
          mode: !lambda return it8951::UPDATE_MODE_GL16;
