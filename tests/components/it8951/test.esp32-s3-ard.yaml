packages:
  spi: !include ../../test_build_components/common/spi/esp32-s3-ard.yaml

esphome:
  name: test-it8951

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: arduino

psram:
  mode: octal

display:
  - platform: it8951
    id: e1003_display
    spi_id: spi_bus
    model: seeed-reterminal-e1003
    cs_pin: GPIO10
    vcom: 1400
    update_interval: never
    lambda: |-
      it.filled_rectangle(0, 0, 128, 128, Color::BLACK);

  - platform: it8951
    id: ee03_display
    spi_id: spi_bus
    model: seeed-ee03
    cs_pin: GPIO44
    vcom: 1450
    update_interval: 60s
    lambda: |-
      it.circle(64, 64, 32, Color::BLACK);
