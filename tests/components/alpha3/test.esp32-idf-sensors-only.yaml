# Test config for legacy sensor-only setup (original Jan's implementation)
packages:
  ble: !include ../../test_build_components/common/ble/esp32-idf.yaml

esp32_ble_tracker:

ble_client:
  - mac_address: 01:02:03:04:05:06
    id: alpha3_blec

sensor:
  - platform: alpha3
    id: my_alpha3
    ble_client_id: alpha3_blec
    flow:
      name: "Radiator Pump Flow"
    head:
      name: "Radiator Pump Head"
    power:
      name: "Radiator Pump Power"
    speed:
      name: "Radiator Pump Speed"
    current:
      name: "Radiator Pump Current"
    voltage:
      name: "Radiator Pump Voltage"
