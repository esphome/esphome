esp32_ble_tracker:

ble_client:
  - mac_address: 01:02:03:04:05:06
    id: alpha3_blec

sensor:
  - platform: alpha3
    ble_client_id: alpha3_blec
    flow:
      name: "Radiator Pump Flow"
    head:
      name: "Radiator Pump Head"
    power:
      name: "Radiator Pump Power"
    speed:
      name: "Radiator Pump Speed"

text_sensor:
  - platform: alpha3
    alpha3_id: alpha3_blec
    pump_mode:
      name: "Pump Mode"

select:
  - platform: alpha3
    alpha3_id: alpha3_blec
    pump_mode:
      name: "Pump Mode"

button:
  - platform: alpha3
    alpha3_id: alpha3_blec
    start_pump:
      name: "Start Pump"
    stop_pump:
      name: "Stop Pump"
    setpoint_up:
      name: "Increase Setpoint"
    setpoint_down:
      name: "Decrease Setpoint"
