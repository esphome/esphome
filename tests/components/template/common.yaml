sensor:
  - platform: template
    name: "Template Sensor"
    id: template_sens
    lambda: |-
      if (id(some_binary_sensor).state) {
        return 42.0;
      } else {
        return 0.0;
      }
    update_interval: 60s

  - platform: template
    name: "Template Sensor Dynamic"
    id: template_sensor_dynamic
    update_interval: 1s
    dynamic_lambda:
      source_id: template_sensor_dynamic_script

esphome:
  on_boot:
    - sensor.template.publish:
        id: template_sens
        state: 42.0

    # Templated
    - sensor.template.publish:
        id: template_sens
        state: !lambda "return 42.0;"

    - datetime.date.set:
        id: test_date
        date:
          year: 2021
          month: 1
          day: 1
    - datetime.date.set:
        id: test_date
        date: !lambda "return {.day_of_month = 1, .month = 1, .year = 2021};"
    - datetime.date.set:
        id: test_date
        date: "2021-01-01"
    - script.execute: template_text_dynamic_lambda_test
    - script.execute: template_dynamic_lambda_components_test

binary_sensor:
  - platform: template
    id: some_binary_sensor
    name: "Garage Door Open"
    lambda: |-
      if (id(template_sens).state > 30) {
        // Garage Door is open.
        return true;
      } else {
        // Garage Door is closed.
        return false;
      }

  - platform: template
    name: "Template Binary Dynamic"
    id: template_binary_dynamic
    dynamic_lambda:
      source_id: template_binary_dynamic_script

output:
  - platform: template
    id: outputsplit
    type: float
    write_action:
      - logger.log: "write_action"

switch:
  - platform: template
    name: "Template Switch"
    lambda: |-
      if (id(some_binary_sensor).state) {
        return true;
      } else {
        return false;
      }
    turn_on_action:
      - logger.log: "turn_on_action"
    turn_off_action:
      - logger.log: "turn_off_action"

  - platform: template
    name: "Template Switch Dynamic"
    id: template_switch_dynamic
    dynamic_lambda:
      source_id: template_switch_dynamic_script

button:
  - platform: template
    name: "Template Button"
    on_press:
      - logger.log: Button Pressed

cover:
  - platform: template
    name: "Template Cover"
    lambda: |-
      if (id(some_binary_sensor).state) {
        return COVER_OPEN;
      } else {
        return COVER_CLOSED;
      }
    open_action:
      - logger.log: open_action
    close_action:
      - logger.log: close_action
    stop_action:
      - logger.log: stop_action
    optimistic: true

number:
  - platform: template
    name: "Template number"
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1

  - platform: template
    name: "Template number dynamic"
    id: template_number_dynamic
    min_value: 0
    max_value: 100
    step: 1
    dynamic_lambda:
      source_id: template_number_dynamic_script

select:
  - platform: template
    name: "Template select"
    optimistic: true
    options:
      - one
      - two
      - three
    initial_option: two

lock:
  - platform: template
    name: "Template Lock"
    lambda: |-
      if (id(some_binary_sensor).state) {
        return LOCK_STATE_LOCKED;
      } else {
        return LOCK_STATE_UNLOCKED;
      }
    lock_action:
      - logger.log: lock_action
    unlock_action:
      - logger.log: unlock_action
    open_action:
      - logger.log: open_action

valve:
  - platform: template
    name: "Template Valve"
    lambda: |-
      if (id(some_binary_sensor).state) {
        return VALVE_OPEN;
      } else {
        return VALVE_CLOSED;
      }
    open_action:
      - logger.log: open_action
    close_action:
      - logger.log: close_action
    stop_action:
      - logger.log: stop_action
    optimistic: true

text:
  - platform: template
    name: "Template text"
    optimistic: true
    min_length: 0
    max_length: 100
    mode: text
  - platform: template
    name: "Template text lambda"
    mode: text
    update_interval: 1s
    lambda: |
      return std::string{"Hello!"};
    set_action:
      then:
        - logger.log:
            format: Template Text set to %s
            args: ["x.c_str()"]
  - platform: template
    id: template_text_dynamic
    name: "Template dynamic lambda"
    mode: text
    dynamic_lambda:
      id: template_text_dynamic_result
      name: Template Dynamic Result

text_sensor:
  - platform: template
    name: "Template Sensor Script"
    id: template_sensor_dynamic_script

  - platform: template
    name: "Template Binary Script"
    id: template_binary_dynamic_script

  - platform: template
    name: "Template Switch Script"
    id: template_switch_dynamic_script

  - platform: template
    name: "Template Number Script"
    id: template_number_dynamic_script

script:
  - id: template_text_dynamic_lambda_test
    then:
      - text.set:
          id: template_text_dynamic
          value: 'result = "dynamic string";'
      - lambda: |-
          assert(id(template_text_dynamic_result).state == "dynamic string");
      - text.set:
          id: template_text_dynamic
          value: "result = 123;"
      - lambda: |-
          assert(id(template_text_dynamic_result).state == "123");
      - text.set:
          id: template_text_dynamic
          value: "result = 3.25;"
      - lambda: |-
          assert(id(template_text_dynamic_result).state == "3.25");

  - id: template_dynamic_lambda_components_test
    then:
      - text_sensor.template.publish:
          id: template_sensor_dynamic_script
          state: "result = 12.5;"
      - lambda: |-
          assert(id(template_sensor_dynamic).state == 12.5f);
      - text_sensor.template.publish:
          id: template_sensor_dynamic_script
          state: "result = 6;"
      - lambda: |-
          assert(id(template_sensor_dynamic).state == 6.0f);
      - text_sensor.template.publish:
          id: template_binary_dynamic_script
          state: "result = true;"
      - lambda: |-
          assert(id(template_binary_dynamic).state);
      - text_sensor.template.publish:
          id: template_binary_dynamic_script
          state: "result = 0;"
      - lambda: |-
          assert(!id(template_binary_dynamic).state);
      - text_sensor.template.publish:
          id: template_switch_dynamic_script
          state: "result = 1;"
      - lambda: |-
          assert(id(template_switch_dynamic).state);
      - text_sensor.template.publish:
          id: template_switch_dynamic_script
          state: "result = false;"
      - lambda: |-
          assert(!id(template_switch_dynamic).state);
      - text_sensor.template.publish:
          id: template_number_dynamic_script
          state: "result = 7.25;"
      - lambda: |-
          assert(id(template_number_dynamic).state == 7.25f);
      - text_sensor.template.publish:
          id: template_number_dynamic_script
          state: "result = true;"
      - lambda: |-
          assert(id(template_number_dynamic).state == 1.0f);

alarm_control_panel:
  - platform: template
    name: Alarm Panel
    codes:
      - "1234"

datetime:
  - platform: template
    name: Date
    id: test_date
    type: date
    initial_value: "2000-1-2"
    set_action:
      - logger.log: "set_value"
    on_value:
      - logger.log:
          format: "Date: %04d-%02d-%02d"
          args:
            - x.year
            - x.month
            - x.day_of_month
  - platform: template
    name: Time
    id: test_time
    type: time
    initial_value: "12:34:56am"
    set_action:
      - logger.log: "set_value"
    on_value:
      - logger.log:
          format: "Time: %02d:%02d:%02d"
          args:
            - x.hour
            - x.minute
            - x.second
  - platform: template
    name: DateTime
    id: test_datetime
    type: datetime
    initial_value: "2000-1-2 12:34:56"
    set_action:
      - logger.log: "set_value"
    on_value:
      - logger.log:
          format: "DateTime: %04d-%02d-%02d %02d:%02d:%02d"
          args:
            - x.year
            - x.month
            - x.day_of_month
            - x.hour
            - x.minute
            - x.second

time:
  - platform: sntp  # Required for datetime

wifi:  # Required for sntp time
  ap:
