mk2pvrouter:
  id: test_mk2pvrouter
  uart_id: uart_bus

sensor:
  # Exact tags
  - platform: mk2pvrouter
    name: Power
    tag: P
    mk2pvrouter_id: test_mk2pvrouter
    # An explicit value must win over the tag default
    device_class: ""

  - platform: mk2pvrouter
    name: Energy
    tag: E
    mk2pvrouter_id: test_mk2pvrouter

  # Indexed tags
  - platform: mk2pvrouter
    name: Power Phase 1
    tag: P1
    mk2pvrouter_id: test_mk2pvrouter

  - platform: mk2pvrouter
    name: Power Phase 2
    tag: P2
    mk2pvrouter_id: test_mk2pvrouter

  - platform: mk2pvrouter
    name: Voltage Phase 1
    tag: V1
    mk2pvrouter_id: test_mk2pvrouter

  # The x0.01 correction is applied before filters, so a user filter stacks on the corrected value
  - platform: mk2pvrouter
    name: Voltage Phase 2 Scaled
    tag: V2
    mk2pvrouter_id: test_mk2pvrouter
    filters:
      - multiply: 1.0

  - platform: mk2pvrouter
    name: Temperature 1
    tag: T1
    mk2pvrouter_id: test_mk2pvrouter

  - platform: mk2pvrouter
    name: Diversion Rate 1
    tag: D1
    mk2pvrouter_id: test_mk2pvrouter

  - platform: mk2pvrouter
    name: Relay 1 State
    tag: R1
    mk2pvrouter_id: test_mk2pvrouter

  - platform: mk2pvrouter
    name: Relay 10 State
    tag: R10
    mk2pvrouter_id: test_mk2pvrouter
