modbus_monitor:
  - modbus_id: modbus_server_bus
    on_request:
      - lambda: |-
          ESP_LOGD("modbus_monitor", "Request to %u, function 0x%02X, %u bytes", address, request[0],
                   (unsigned) request.size());
      - if:
          condition:
            lambda: return address == 0x20;
          then:
            # Gateway target failed to respond
            - modbus.send_response:
                modbus_id: modbus_server_bus
                address: !lambda return address;
                request: !lambda return request;
                pdu: !lambda return {static_cast<uint8_t>(request[0] | 0x80), 0x0B};
      - if:
          condition:
            lambda: return address == 0x21;
          then:
            - modbus.send_response:
                address: 0x21
                request: !lambda return request;
                pdu: [0x06, 0x00, 0x10, 0x00, 0x01]
  - on_request:
      - logger.log: "Second monitor on the same hub"
    on_response:
      - lambda: |-
          ESP_LOGD("modbus_monitor", "Response from %u to function 0x%02X, %u bytes", address, request[0],
                   (unsigned) response.size());
