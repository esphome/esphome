camera_encoder:
  id: jpeg_encoder

camera_sensor:
  width: 256
  height: 256
  format: GRAYSCALE

camera:
  name: Test Camera

camera_pipeline:
  - id: stage1
    next: stage2
    type: input

  - id: stage2
    next: stage3
    type: overlay
    on_post_process:
      then:
        - lambda: |-
            static int counter = 0;
            static bool use_context = true;
            static int state = 0;

            if (state == 0) {
              ++state;
              processor.filled_circle(32 + counter, 128, 15, Color(255, 0, 0));
              if (use_context) {
                reentry.set_not_done();
                return;
              }
            }
            if (state == 1) {
              ++state;
              processor.filled_circle(96 + counter, 256, 15, Color(0, 255, 0));
              if (use_context) {
                reentry.set_not_done();
                return;
              }
            }
            if (state == 2) {
              state = 0;
              processor.filled_circle(160 + counter, 384, 15, Color(0, 0, 255));
            }

            ++counter;
            if (counter > 32)
              counter = 0;

  - id: stage3
    type: output
    run_as_job: True
    camera_encoder_id: jpeg_encoder
