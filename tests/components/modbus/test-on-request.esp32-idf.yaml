packages:
  uart: !include ../../test_build_components/common/uart/esp32-idf.yaml

modbus:
  - id: on_request_hub
    uart_id: uart_bus
    role: server
    on_request:
      - lambda: |-
          ESP_LOGD("test", "Request to %u, function 0x%02X, %u bytes", address, request_pdu[0],
                   (unsigned) request_pdu.size());
