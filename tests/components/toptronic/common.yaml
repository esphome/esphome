canbus:
  - platform: esp32_can
    id: canbus_toptronic
    rx_pin: 4
    tx_pin: 5
    can_id: 0
    bit_rate: 50kbps

toptronic:
  - id: tt_hv
    canbus_id: canbus_toptronic
    device_type: HV
    device_addr: 8
    max_pending_messages: 3
    max_frames_per_message: 8
    max_pending_age: 6s
    write_min_interval: 3s
    reject_writes_before_read: false
    boot_refresh_delay: 20s
    max_refresh_per_loop: 6
    refresh_gap: 60ms
    max_refresh_retries: 0
    refresh_retry_interval: 250ms

switch:
  - platform: toptronic
    toptronic_id: tt_hv
    candump:
      name: CAN dump
    find_can_id:
      name: Find CAN id

button:
  - platform: toptronic
    toptronic_id: tt_hv
    name: Hand-written test button
    function_group: 20
    function_number: 0
    datapoint: 1
    type: U8
    value: 1

sensor:
  - platform: toptronic
    toptronic_id: tt_hv
    name: Hand-written test sensor
    function_group: 50
    function_number: 0
    datapoint: 40652
    type: U16
