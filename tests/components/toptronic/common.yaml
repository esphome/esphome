canbus:
  - platform: esp32_can
    id: canbus_toptronic
    rx_pin: 4
    tx_pin: 5
    can_id: 0
    bit_rate: 50kbps

toptronic:
  - id: tt_hv
    canbus_id: canbus_toptronic
    device_type: HV
    device_addr: 8
    max_pending_messages: 24
    max_pending_age: 6s
    cleanup_interval: 9s
    max_frames_per_message: 8
    write_min_interval: 3s
    reject_writes_before_read: false

sensor:
  - platform: toptronic
    toptronic_id: tt_hv
    name: Hand-written test sensor
    function_group: 50
    function_number: 0
    datapoint: 40652
    type: U16
