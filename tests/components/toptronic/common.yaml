canbus:
  - platform: esp32_can
    id: canbus_toptronic
    rx_pin: 4
    tx_pin: 5
    can_id: 0
    bit_rate: 50kbps

toptronic:
  - id: tt_hv
    canbus_id: canbus_toptronic
    device_type: HV
    device_addr: 8
    max_pending_messages: 24
    max_pending_age: 6s
    cleanup_interval: 9s
    boot_refresh_delay: 20s
    max_refresh_per_loop: 6
    max_frames_per_message: 8
    refresh_gap_ms: 60ms
    max_refresh_retries: 0
    refresh_retry_interval_ms: 250ms
    write_min_interval: 3s
    reject_writes_before_read: false

switch:
  - platform: toptronic
    toptronic_id: tt_hv
    debug_mode: candump
    name: CAN dump

button:
  - platform: toptronic
    toptronic_id: tt_hv
    function_group: 20
    function_number: 0
    datapoint: 1
    type: U8
    value: 1
    name: Setpoint reset
