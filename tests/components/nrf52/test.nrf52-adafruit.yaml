esphome:
  on_boot:
    - lambda: |-
        int x = 100;
        x = clamp(x, 50, 90);
        assert(x == 90);
        x = clamp_at_least(x, 95);
        assert(x == 95);
        x = clamp_at_most(x, 40);
        assert(x == 40);
nrf52:
  dfu:
    reset_pin:
      number: 14
      inverted: true
      mode:
        output: true
  dcdc: False
  reg0:
    voltage: 2.1V
    uicr_erase: true
  # P1.x (port-1 math) + inverted + open_drain + omitted startup_delay (defaults
  # to 0us) -- the mcumgr target's power_enable test only covers P0.x/non-inverted/
  # explicit delay/pullup. inverted + open_drain together also exercise the
  # multi-flag `(GPIO_ACTIVE_LOW | GPIO_OPEN_DRAIN)` parenthesized-join path.
  power_enable:
    pin:
      number: P1.02
      inverted: true
      mode:
        output: true
        open_drain: true
