button:
  - platform: template
    name: Send lambda command
    on_press:
      - emontx.send_command:
          id: test_emontx
          command: !lambda return "l";
  - platform: template
    name: Pause emontx
    on_press:
      - if:
          condition:
            emontx.is_paused:
              id: test_emontx
          then:
            - emontx.resume:
                id: test_emontx
          else:
            - emontx.pause:
                id: test_emontx
