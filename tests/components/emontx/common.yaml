wifi:
  ssid: MySSID
  password: password1

api:

uart:
  - id: uart_emontx
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}
    baud_rate: 115200

button:
  - platform: template
    name: Send command test
    on_press:
      - emontx.send_command:
          id: test_emontx
          command: "v"

emontx:
  id: test_emontx

sensor:
  - platform: emontx
    name: Power
    tag_name: P1
    emontx_id: test_emontx
    unit_of_measurement: W
