geolocation:
  - platform: ubx
    id: ubx_receiver
    rate: 2Hz
    dynamic_model: automotive
    millisecond: true
    geoid_separation: true

sensor:
  - platform: geolocation
    geolocation_id: ubx_receiver
    type: latitude
    name: "Latitude"
  - platform: geolocation
    geolocation_id: ubx_receiver
    type: longitude
    name: "Longitude"
  - platform: geolocation
    geolocation_id: ubx_receiver
    type: horizontal_accuracy
    name: "Horizontal Accuracy"
  - platform: geolocation
    geolocation_id: ubx_receiver
    type: vertical_accuracy
    name: "Vertical Accuracy"

time:
  - platform: geolocation
    geolocation_id: ubx_receiver
