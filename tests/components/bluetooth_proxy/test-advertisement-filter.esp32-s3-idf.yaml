# Compile the gated filter path; no external component is in-tree to call
# enable_advertisement_filter(), so the define is forced here.
<<: !include common.yaml

esphome:
  platformio_options:
    build_flags:
      - "-DUSE_BLUETOOTH_PROXY_ADVERTISEMENT_FILTER"

esp32_ble_tracker:

bluetooth_proxy:
  active: true
