packages:
  - !include common_esp32.yaml

sensor:
  - platform: template
    name: "humidity_sensor"
    unit_of_measurement: "%"
    device_class: humidity
    cluster: default
    endpoint: 2
    use_device_type: false
  - platform: template
    name: "pressure_sensor"
    unit_of_measurement: Pa
    device_class: pressure
    cluster: default
  - platform: template
    name: "pm25_sensor"
    unit_of_measurement: 'µg/m³'
    device_class: pm25
    cluster: default
  - platform: template
    name: "co2_sensor"
    unit_of_measurement: ppm
    device_class: carbon_dioxide
    cluster: default
  - platform: template
    name: "flow_sensor"
    unit_of_measurement: L/h
    device_class: volume_flow_rate
    cluster: default
