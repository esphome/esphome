---
switch:
  - platform: zigbee
    output: output_template
    id: zigbee_switch_1
  - platform: zigbee
    output: output_template
    id: zigbee_switch_2

output:
  - platform: template
    id: output_template
    type: binary
    write_action:
      - binary_sensor.zigbee.publish:
          id: zigbee_binary_sensor_1
          state: ON
      - binary_sensor.zigbee.publish:
          id: zigbee_binary_sensor_1
          state: OFF
  - platform: template
    id: output_factory
    type: binary
    write_action:
      - zigbee.factory_reset

binary_sensor:
  - platform: zigbee
    id: zigbee_binary_sensor_1
  - platform: zigbee
    id: zigbee_binary_sensor_2
    lambda: return true;

sensor:
  - platform: zigbee
    id: zigbee_sensor_1
  - platform: zigbee
    id: zigbee_sensor_2
    lambda: return 10;

number:
  - platform: zigbee
    id: zigbee_number_1
    min_value: -10
    max_value: 2000
    step: 0.5

  - platform: zigbee
    id: zigbee_number_2
    min_value: -100
    max_value: 1000
    step: 0.3
    lambda: return 10;

zigbee:
  wipe_on_boot: true
  on_join:
    - switch.zigbee.publish:
        id: zigbee_switch_1
        state: OFF
    - switch.zigbee.publish:
        id: zigbee_switch_1
        state: ON

time:
  - platform: zigbee
    id: test_time
