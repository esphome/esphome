esphome:
  area:
    id: testing_area
    name: Testing Area
  project:
    name: esphome.test
    version: "1.1"

binary_sensor:
  - platform: template
    name: "Garage Door Open 1"
  - platform: template
    name: "Garage Door Open 2"
  - platform: template
    name: "Garage Door Open 3"
  - platform: template
    name: "Garage Door Internal"
    internal: True

sensor:
  - platform: template
    name: "Analog 1"
    lambda: return 10.0;
    accuracy_decimals: 0
    device_class: temperature
    unit_of_measurement: "°C"
  - platform: template
    name: "Analog 2"
    lambda: return 11.0;
    unit_of_measurement: "°C"
  - platform: template
    name: "Analog 3"
    lambda: return 12.0;
    internal: True

output:
  - platform: template
    id: output_factory
    type: binary
    write_action:
      - zigbee.factory_reset
  - platform: template
    id: zb_output_red
    type: float
    write_action:
      - delay: 1s
  - platform: template
    id: zb_output_blue
    type: float
    write_action:
      - delay: 1s
  - platform: template
    id: zb_output_green
    type: float
    write_action:
      - delay: 1s
  - platform: template
    id: zb_output_ww
    type: float
    write_action:
      - delay: 1s
  - platform: template
    id: zb_output_cw
    type: float
    write_action:
      - delay: 1s

switch:
  - platform: template
    name: "Template Switch"
    optimistic: true

number:
  - platform: template
    name: "Template number"
    optimistic: true
    min_value: 2
    max_value: 100
    step: 1
    unit_of_measurement: "°C"
    device_class: temperature

light:
  - platform: rgbww
    name: "RGB Light"
    red: zb_output_red
    green: zb_output_green
    blue: zb_output_blue
    warm_white: zb_output_ww
    cold_white: zb_output_cw
    cold_white_color_temperature: 200 mireds
    warm_white_color_temperature: 455 mireds

time:
  - platform: zigbee
