packages:
  - !include common.yaml

binary_sensor:
  - platform: template
    name: "Garage Door Open 10"
    report: "default"
  - platform: template
    name: "Garage Door Open 12"
    report: "force"

switch:
  - platform: template
    name: "ESP32 Switch 1"
    report: "default"
    optimistic: true
  - platform: template
    name: "ESP32 Switch 2"
    report: "force"
    optimistic: true

zigbee:
  model: zigbee_test
  router: true
  power_source: MAINS_SINGLE_PHASE
  on_join:
    then:
      - logger.log: "Joined network"
