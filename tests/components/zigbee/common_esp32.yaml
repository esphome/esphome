packages:
  - !include common.yaml

binary_sensor:
  - platform: template
    name: "Occupancy Sensor"
    report: "default"
    device_class: occupancy
    cluster: default
    endpoint: 3
  - platform: template
    name: "Garage Door Open 12"
    report: "force"
    endpoint: 1
  - platform: template
    name: "Garage Door Open 13"
    endpoint: 2
    use_device_type: false

sensor:
  - platform: template
    name: "Temperature Sensor"
    lambda: return 10.0;
    device_class: temperature
    unit_of_measurement: "°C"
    endpoint: 1
    use_device_type: true
    cluster: default
  - platform: template
    name: "Light Sensor"
    lambda: return 100.0;
    device_class: illuminance
    unit_of_measurement: "lx"
    endpoint: 2
    use_device_type: true
    cluster: default
  - platform: template
    name: "pressure_sensor"
    unit_of_measurement: Pa
    device_class: pressure
    cluster: default
  - platform: template
    name: "flow_sensor"
    unit_of_measurement: L/h
    device_class: volume_flow_rate
    cluster: default

zigbee:
  model: zigbee_test
  router: false
  power_source: MAINS_SINGLE_PHASE
  on_join:
    then:
      - logger.log: "Joined network"
  on_start:
    then:
      - logger.log: "Started zigbee stack"
