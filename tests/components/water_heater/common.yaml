water_heater:
  # Default (Celsius, no unit_of_measurement)
  - platform: template
    id: my_boiler
    name: "Test Boiler"
    optimistic: true
    visual:
      min_temperature: 10
      max_temperature: 85
      temperature_step: 0.5

  # Explicit Fahrenheit via unit_of_measurement
  - platform: template
    id: my_boiler_fahrenheit
    name: "Test Boiler Fahrenheit"
    unit_of_measurement: °F
    optimistic: true
    visual:
      min_temperature: 100°F
      max_temperature: 145°F
      temperature_step: 1°F

  # Implicit Fahrenheit inferred from temperature field suffixes
  - platform: template
    id: my_boiler_implicit_fahrenheit
    name: "Test Boiler Implicit Fahrenheit"
    optimistic: true
    visual:
      min_temperature: 100°F
      max_temperature: 145°F
