water_heater:
  - platform: template
    id: my_boiler
    name: "Test Boiler"
    optimistic: true
    current_temperature: !lambda "return 45.0f;"
    target_temperature: !lambda "return 60.0f;"
    mode: !lambda "return water_heater::WATER_HEATER_MODE_ECO;"
    visual:
      min_temperature: 10
      max_temperature: 85
      target_temperature_step: 0.5
