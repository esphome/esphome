packages:
  storage: !include common.yaml

# The storage option that costs real flash, kept out of the base test so the memory-impact
# job measures what the component costs rather than what its most expensive corner costs.
#
#   regex:        pulls in <regex>, which is ~50-100 kB of libstdc++ on this target (see the
#                 comment above the include in automation.cpp)
#
# It is opt-in: codegen only sets USE_STORAGE_REGEX_EXTRACT when a config actually asks for it,
# so a node that copies files and reads a key=value file pays nothing. This variant exists so it
# still gets compiled on every run -- ``test-*`` files are part of the normal test set and only
# skipped by ``--base-only`` builds, which the memory job uses.

globals:
  - id: g_label
    type: std::string
    restore_value: false

script:
  - id: exercise_expensive_extracts
    then:
      - storage.file_read:
          path: /sdcard/config/device.conf
          extract:
            - key: name
              separator: "="
            - regex: "([A-Za-z0-9_]+)"
          to_global: g_label
