# Component-only config, shared by every platform test. No driver is configured here, so the
# registry stays empty and nothing is mounted at runtime — this proves that the schema
# validates and that the component links on every target ESPHome builds for. Driver-side
# coverage lives in the driver components' own test suites.

storage:
  copy_chunk_size: 8192
  max_blocking_transfer_size: 2097152
