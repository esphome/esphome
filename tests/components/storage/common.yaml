# Component-only config, shared by every platform test. No driver is configured here, so the
# registry stays empty and nothing is mounted at runtime -- this proves that the schema
# validates and that the component links on every target ESPHome builds for. Driver-side
# coverage lives in the driver components' own test suites.
#
# The action script below covers what is identical on every target: the printf-style write
# path, the extraction pipeline, a condition, and a delete. It has to live here rather than
# in the per-platform files, because without at least one action in the config
# automation.h/.cpp are never instantiated -- the action layer is platform-neutral and has to
# compile everywhere the component does. Deliberately no json: or regex: step (each pulls in
# a heavy dependency and is covered by test-extract.*) and no raw action (those need a
# device).

storage:
  copy_chunk_size: 8192
  max_blocking_transfer_size: 2097152

globals:
  - id: g_read_back
    type: std::string
    restore_value: false

script:
  - id: exercise_actions
    then:
      - storage.file_write:
          path: /storage/state.txt
          content: hello
      - storage.file_append:
          path: /storage/log.txt
          format: "value=%.1f"
          args: ["21.5f"]
      - storage.file_read:
          path: /storage/state.txt
          extract:
            - line: 1
            - trim: true
          to_global: g_read_back
      - if:
          condition:
            storage.file_exists: /storage/state.txt
          then:
            - storage.file_delete:
                path: /storage/state.txt
