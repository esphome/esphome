mpr121:
  - i2c_id: i2c_bus
    id: mpr121_first
    address: 0x5A
  # Hubs with fewer channels (and none) share the busiest hub's list size
  - i2c_id: i2c_bus
    id: mpr121_second
    address: 0x5B
  - i2c_id: i2c_bus
    id: mpr121_third
    address: 0x5C

binary_sensor:
  - platform: mpr121
    mpr121_id: mpr121_first
    id: touchkey0
    name: touchkey0
    channel: 0
  - platform: mpr121
    mpr121_id: mpr121_first
    id: mpr121_bin1
    name: touchkey1
    channel: 1
  - platform: mpr121
    mpr121_id: mpr121_first
    id: mpr121_bin2
    name: touchkey2
    channel: 2
  - platform: mpr121
    mpr121_id: mpr121_first
    id: mpr121_bin3
    name: touchkey3
    channel: 6
  - platform: mpr121
    mpr121_id: mpr121_second
    id: mpr121_second_bin0
    name: second touchkey0
    channel: 0

output:
  - platform: gpio
    id: gpio1
    pin:
      mpr121: mpr121_first
      number: 7
      mode: OUTPUT
  - platform: gpio
    id: gpio2
    pin:
      mpr121: mpr121_first
      number: 11
      mode: OUTPUT
      inverted: true
