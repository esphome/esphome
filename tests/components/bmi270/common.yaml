sensor:
  - platform: bmi270
    type: acceleration_x
    name: "Accel X"
    accuracy_decimals: 4
    filters:
      - sliding_window_moving_average:
          window_size: 4
          send_every: 1
  - platform: bmi270
    type: acceleration_y
    name: "Accel Y"
    accuracy_decimals: 4
  - platform: bmi270
    type: acceleration_z
    name: "Accel Z"
    accuracy_decimals: 4

    # Gyroscope axes (unit: °/s)
  - platform: bmi270
    type: gyroscope_x
    name: "Gyro X"
  - platform: bmi270
    type: gyroscope_y
    name: "Gyro Y"
  - platform: bmi270
    type: gyroscope_z
    name: "Gyro Z"

  - platform: bmi270
    type: angular_rate_x
    name: "Angular Rate X"
  - platform: bmi270
    type: angular_rate_y
    name: "Angular Rate Y"
  - platform: bmi270
    type: angular_rate_z
    name: "Angular Rate Z"

  - platform: bmi270
    type: pitch
    name: "Pitch"
  - platform: bmi270
    type: roll
    name: "Roll"

    # On-chip temperature sensor (unit: °C)
  - platform: bmi270
    type: temperature
    name: "IMU Temperature"
    accuracy_decimals: 1

bmi270:
  # Accelerometer full-scale range: 2G | 4G | 8G | 16G
  acceleration_range: 4G

  # Accelerometer output data rate: 12_5HZ | 25HZ | 50HZ | 100HZ |
  #                                  200HZ | 400HZ | 800HZ | 1600HZ
  acceleration_odr: 100HZ

  # Gyroscope full-scale range: 125DPS | 250DPS | 500DPS | 1000DPS | 2000DPS
  gyroscope_range: 2000DPS

  # Gyroscope output data rate: 25HZ | 50HZ | 100HZ | 200HZ |
  #                               400HZ | 800HZ | 1600HZ | 3200HZ
  gyroscope_odr: 200HZ
