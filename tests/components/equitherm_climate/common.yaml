sensor:
  - platform: template
    id: outdoor_sensor
    lambda: return 12.0;
    update_interval: 60s

  - platform: template
    id: indoor_sensor
    lambda: return 19.5;
    update_interval: 60s

  # Diagnostic sensors (Phase G)
  - platform: equitherm_climate
    climate_id: heating_controller
    type: flow_curve
    name: "Flow Curve Temperature"
    id: flow_curve_sensor

  - platform: equitherm_climate
    climate_id: heating_controller
    type: flow_final
    name: "Flow Final Temperature"
    id: flow_final_sensor

  - platform: equitherm_climate
    climate_id: heating_controller
    type: pid_correction
    name: "PID Correction"
    id: pid_correction_sensor

output:
  - platform: slow_pwm
    pin: 4
    id: heat_output
    period: 15s

# Runtime tuning numbers (Phase H)
number:
  - platform: equitherm_climate
    climate_id: heating_controller
    type: slope
    name: "Heating Curve Slope"
    id: slope_number
    min_value: 0.5
    max_value: 5.0
    step: 0.1

  - platform: equitherm_climate
    climate_id: heating_controller
    type: exponent
    name: "Heating Curve Exponent"
    id: exponent_number
    min_value: 0.5
    max_value: 3.0
    step: 0.1

  - platform: equitherm_climate
    climate_id: heating_controller
    type: shift
    name: "Heating Curve Shift"
    id: shift_number
    min_value: -10.0
    max_value: 10.0
    step: 0.5

  - platform: equitherm_climate
    climate_id: heating_controller
    type: target_diff_factor
    name: "Room Correction Factor"
    id: target_diff_factor_number
    min_value: 0.0
    max_value: 5.0
    step: 0.1

  - platform: equitherm_climate
    climate_id: heating_controller
    type: kp
    name: "PID Kp"
    id: kp_number
    min_value: 0.0
    max_value: 10.0
    step: 0.1

  - platform: equitherm_climate
    climate_id: heating_controller
    type: ki
    name: "PID Ki"
    id: ki_number
    min_value: 0.0
    max_value: 5.0
    step: 0.1

  - platform: equitherm_climate
    climate_id: heating_controller
    type: kd
    name: "PID Kd"
    id: kd_number
    min_value: 0.0
    max_value: 5.0
    step: 0.1

climate:
  - platform: equitherm_climate
    id: heating_controller
    name: Equitherm Climate
    outdoor_sensor: outdoor_sensor
    indoor_sensor: indoor_sensor
    default_target_temperature: 20°C
    heat_output: heat_output
    control_parameters:
      slope: 3.0
      exponent: 1.5
      shift: 0.0
      target_diff_factor: 1.0
      kp: 2.0
      ki: 0.5
      kd: 0.0
      min_integral: -5.0
      max_integral: 5.0
    output_parameters:
      t_min_flow: 25.0
      t_max_flow: 70.0
    deadband_parameters:
      threshold_high: 0.5
      threshold_low: 0.5
      kp_multiplier: 0.1
      ki_multiplier: 0.0
