audio_dac:
  - platform: tas58xx
    model: tas5805m
    id: tas58xx_amp
    i2c_id: i2c_bus
    address: 0x2D
    enable_pin: GPIO12
    analog_gain: -15.5dB
    dac_mode: btl
    mixer_mode: stereo
    volume_min_db: -60dB
    volume_max_db: 0dB
    update_interval: 1s
  - platform: tas58xx
    model: TAS5805M
    id: tas58xx_amp_2
    i2c_id: i2c_bus
    address: 0x2C
    ignore_enable_pin_warning: true

esphome:
  on_boot:
    - tas58xx.deactivate: tas58xx_amp
    - tas58xx.activate:
        id: tas58xx_amp
    - tas58xx.activate: tas58xx_amp_2

binary_sensor:
  - platform: tas58xx
    tas58xx_id: tas58xx_amp
    have_fault:
      name: Any Fault
    left_channel_dc_fault:
      name: Left Channel DC Fault
    right_channel_dc_fault:
      name: Right Channel DC Fault
    left_channel_over_current:
      name: Left Channel Over Current
    right_channel_over_current:
      name: Right Channel Over Current
    otp_crc_check:
      name: OTP CRC Check
    bq_write_failed:
      name: BQ Write Failed
    clock_fault:
      name: Clock Fault
    pvdd_over_voltage:
      name: PVDD Over Voltage
    pvdd_under_voltage:
      name: PVDD Under Voltage
    over_temp_shutdown:
      name: Over Temperature Shutdown
    over_temp_warning:
      name: Over Temperature Warning

  - platform: tas58xx
    tas58xx_id: tas58xx_amp_2
    have_fault:
      name: Second Amp Any Fault
    left_channel_dc_fault:
      name: Second Amp Left Channel DC Fault
