keeloq:
  - id: shutter_remote
    type: jarolift
    # Made-up key for the tests, not a real manufacturer key
    manufacturer_key: "0x1A2B3C4D5E6F7081"
    serial: 0x1234500

button:
  - platform: template
    name: Shutters 1 to 4 and 9 to 12 up
    on_press:
      - keeloq.send:
          id: shutter_remote
          command: 0x8
          channels: 0x0F0F
          repeat:
            times: 2
            wait_time: 0ms
      - keeloq.send:
          id: shutter_remote
          command: shade
          channels: [1, 2]
  - platform: template
    name: Shutter lambda
    on_press:
      - keeloq.send:
          id: shutter_remote
          command: !lambda return 0x2;
          channels: !lambda return 0x0001;
  - platform: template
    name: Set counter
    on_press:
      - keeloq.set_counter:
          id: shutter_remote
          counter: 0x1000
      - keeloq.set_counter:
          id: shutter_remote
          counter: !lambda return id(shutter_remote).get_counter() + 16;
  - platform: template
    name: Pair shutter 1
    on_press:
      - keeloq.learn:
          id: shutter_remote
          channels: 0x0001
      - keeloq.learn:
          id: shutter_remote
          channels: !lambda return 0x0001;
          legacy: true
