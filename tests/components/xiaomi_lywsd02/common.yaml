esp32_ble_tracker:
  id: ble_tracker_hub

sensor:
  # Explicit ble_hub_id: pins the neutral binding as a declared key.
  - platform: xiaomi_lywsd02
    ble_hub_id: ble_tracker_hub
    mac_address: 3F:5B:7D:82:58:4E
    temperature:
      name: Xiaomi LYWSD02 Temperature
    humidity:
      name: Xiaomi LYWSD02 Humidity
    battery_level:
      name: Xiaomi LYWSD02 Battery Level
