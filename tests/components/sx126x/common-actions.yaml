button:
  - platform: template
    name: SX126x Mode Actions
    on_press:
      - sx126x.set_mode_tx
      - sx126x.set_mode_sleep:
          cold: true
      - sx126x.set_mode_sleep:
          cold: !lambda return id(sx126x_my_number).state > 1;

  - platform: template
    name: "SX126x Async Send or Cancel"
    on_press:
      - lambda: |-
          class Listener : public sx126x::SX126xTransmitListener {
           public:
            void on_transmit_complete(sx126x::SX126xError result) override {
              ESP_LOGD("sx126x_test", "Async completion: %d", static_cast<int>(result));
            }
          };
          static Listener listener;
          if (id(sx126x_radio).is_transmitting()) {
            id(sx126x_radio).cancel_transmit_async(&listener);
          } else {
            const uint8_t data[] = {0x11, 0x22, 0x33};
            auto result = id(sx126x_radio).start_transmit_async(&listener, data, sizeof(data), 4000);
            ESP_LOGD("sx126x_test", "Async admission: %d", static_cast<int>(result));
          }
