font:
  - file:
      type: gfonts
      family: "Roboto"
      weight: bold
      italic: true
    size: 32
    id: roboto32

  - file: "gfonts://Roboto"
    id: roboto
    size: 20
    glyphs: "Helo, Wrd!0123456789."
    extras:
      - file: "gfonts://Roboto"
        glyphs: ["\u00C4", "\u00C5", "\U000000C7"]
  - file: "gfonts://Roboto"
    id: roboto_web
    size: 20
  - file: "gfonts://Roboto"
    id: roboto_greek
    size: 20
    glyphs: "Helo \u03ba\u03cc\u03c3\u03bc\u03b5!"
  - file: "https://media.esphome.io/tests/fonts/Monocraft.ttf"
    id: monocraft
    size: 20
  - file:
      type: web
      url: "https://media.esphome.io/tests/fonts/Monocraft.ttf"
    id: monocraft2
    size: 24
  - file: $component_dir/Monocraft.ttf
    id: monocraft3
    size: 28
  - file: $component_dir/MatrixChunky8X.bdf
    id: special_font
    glyphs:
      - '"'
      - "'"
      - '#$%&()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\]^_`abcdefghijklmnopqrstuvwxyz°'

  - file: $component_dir/MatrixChunky8X.bdf
    id: default_font
  - file: $component_dir/Monocraft.ttf
    id: pte_monocraft
    engine: pte
    glyphs: "Helo, Wrd!"

display:
  - platform: sdl
    id: sdl_display
    dimensions:
      width: 800
      height: 600
    lambda: |-
      it.print(0, 0, id(roboto), "Hello, World!");
      it.print(0, 20, id(roboto_web), "Hello, World!");
      it.print(0, 40, id(roboto_greek), "Hello κόσμε!");
      it.print(0, 60, id(monocraft), "Hello, World!");
      it.print(0, 80, id(monocraft2), "Hello, World!");
      it.print(0, 100, id(monocraft3), "Hello, World!");
      it.print(0, 130, pte_font(pte_monocraft,20), "Hello, World!");
      it.print(0, 150, pte_font(pte_monocraft,24), "Hello, World!");
