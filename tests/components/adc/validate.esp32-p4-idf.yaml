# Config only: the P4 compiles the same ADC code as the esp32-s3-idf build
# (curve fitting calibration), only the pin table differs.
sensor:
  - id: adc_my_sensor
    platform: adc
    pin: GPIO16
    name: ADC Test sensor
    update_interval: "1:01"
    attenuation: 2.5db
    unit_of_measurement: "°C"
    icon: "mdi:water-percent"
    accuracy_decimals: 5
    setup_priority: -100
    force_update: true
