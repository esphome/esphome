sensor:
  - id: adc_my_sensor
    platform: adc
    pin: 28
    name: ADC Test sensor
    update_interval: "1:01"
    unit_of_measurement: "°C"
    icon: "mdi:water-percent"
    accuracy_decimals: 5
    setup_priority: -100
    force_update: true
  - platform: adc
    pin: 26
    name: ADC Second sensor
    update_interval: 5sec
  # Declared out of ascending pin/channel order on purpose (pin 28 above maps
  # to channel 2, this one to channel 3) and mixed with an emulated sensor --
  # same position-vs-silicon-channel regression coverage as the nrf52 test,
  # applied to RP2350's identical GPIO26-29 -> channel 0-3 ADC mapping (same
  # raspberrypi,pico-adc binding as RP2040). Each newly configured pin
  # regenerates the board's adc_default pinctrl group from the full set of
  # pins used so far (see esphome/components/adc/sensor.py's rpi_pico
  # branch) -- this file exercises that with 3 distinct pins.
  - platform: adc
    id: adc_mixed_emulated_sensor
    pin: 27
    name: ADC Mixed Emulated sensor
    update_interval: 5sec
    emulation:
      - 900mV
