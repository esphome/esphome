sensor:
  - id: adc_my_sensor
    platform: adc
    pin: 44
    name: ADC Test sensor
    update_interval: "1:01"
    unit_of_measurement: "°C"
    icon: "mdi:water-percent"
    accuracy_decimals: 5
    setup_priority: -100
    force_update: true
  - platform: adc
    pin: 43
    name: ADC Second sensor
    update_interval: 5sec
  # Declared out of ascending pin/AIN order on purpose (pin 44 above maps to
  # AIN5, this one to AIN6) and mixed with an emulated sensor -- same
  # position-vs-silicon-channel regression coverage as the nrf52 test, applied
  # to nRF54L15's larger SAADC. AIN0-AIN3 (P1.04-P1.07) are deliberately
  # avoided here -- nrf54l15dk's own uart20 pinctrl (this variant's UART0,
  # the default console) claims those same pins, so using them would conflict
  # with the always-on logger UART.
  - platform: adc
    id: adc_mixed_emulated_sensor
    pin: 45
    name: ADC Mixed Emulated sensor
    update_interval: 5sec
    emulation:
      - 900mV
