# Config only: the S2 shares the C2's line fitting path (no default_vref) and
# the original ESP32's ADC init (no clk_src); both are compiled by those
# builds, only the S2 pin table differs.
sensor:
  - id: adc_my_sensor
    platform: adc
    pin: GPIO1
    name: ADC Test sensor
    update_interval: "1:01"
    attenuation: 2.5db
    unit_of_measurement: "°C"
    icon: "mdi:water-percent"
    accuracy_decimals: 5
    setup_priority: -100
    force_update: true
