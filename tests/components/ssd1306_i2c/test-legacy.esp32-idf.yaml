substitutions:
  reset_pin: GPIO15

packages:
  i2c: !include ../../test_build_components/common/i2c/esp32-idf.yaml

display:
  - platform: ssd1306_i2c
    i2c_id: i2c_bus
    model: SSD1306_128X64
    reset_pin: ${reset_pin}
    address: 0x3C
    id: ssd1306_i2c_legacy_only
    update_interval: never
