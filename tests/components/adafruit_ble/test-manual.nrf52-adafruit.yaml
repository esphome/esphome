ota:
  - platform: adafruit_ble
    id: firmware_update
    ble_trigger: false
    on_begin:
      then:
        - logger.log: "Entering Adafruit BLE bootloader"

button:
  - platform: template
    name: Enter bootloader
    internal: true
    on_press:
      - ota.adafruit_ble.enter_bootloader: firmware_update
