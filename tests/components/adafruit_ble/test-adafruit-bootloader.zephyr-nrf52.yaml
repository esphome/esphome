zephyr:
  variant: NRF52
  board: promicro_nrf52840/nrf52840/uf2
  advanced:
    bootloader: adafruit_nrf52_sd140_v6

zephyr_ble_server:
  # Turns on pairing, so the trigger characteristic needs an authenticated link
  on_numeric_comparison_request:
    then:
      - ble_server.numeric_comparison_reply:
          accept: true

ota:
  - platform: adafruit_ble
    on_begin:
      then:
        - logger.log: "OTA start"
