packages:
  openthread: !include common.yaml

ethernet:
  type: YT8531
  mdc_pin: GPIO5
  mdio_pin: GPIO6
  power_pin: GPIO7

wifi:
  ssid: "OTBR Test"
  password: "test-password"

network:
  priority:
    - ethernet
    - wifi

openthread:
  border_router:
    backbone: ethernet
  channel: 15
  network_name: ESPHome-OTBR
  network_key: 0x00112233445566778899AABBCCDDEEFF
  pan_id: 0x1234
  ext_pan_id: 0x00AD00BE00C0CAFE
  pskc: 0x004810E2315100AFD6BC9215A6BFAC53
  mesh_local_prefix: fd00:db8:a0:0::/64
