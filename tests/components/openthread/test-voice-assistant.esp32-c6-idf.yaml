# voice_assistant over Thread without the IPv4 stack
packages:
  i2s_audio: !include ../../test_build_components/common/i2s_audio/esp32-c6-idf.yaml

openthread:
  channel: 13
  network_name: OpenThread-8f28
  network_key: 0xdfd34f0f05cad978ec4e32b0413038ff
  pan_id: 0x8f28
  ext_pan_id: 0xd63e8e3e495ebbc3
  pskc: 0xc23a76e98f1a6483639b1ac1271e2e27
  mesh_local_prefix: fd53:145f:ed22:ad81::/64

network:
  enable_ipv6: true
  enable_ipv4: false

api:

microphone:
  - platform: i2s_audio
    id: va_mic
    i2s_audio_id: i2s_audio_bus
    i2s_din_pin: GPIO7
    adc_type: external

speaker:
  - platform: i2s_audio
    id: va_speaker
    i2s_audio_id: i2s_audio_bus
    dac_type: external
    i2s_dout_pin: GPIO10

voice_assistant:
  microphone: va_mic
  speaker: va_speaker
