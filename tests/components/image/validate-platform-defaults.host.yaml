# `platform: file` entry using the `defaults:`/`files:` shape to share options
# across several images without repeating them on every entry. Config-only test
# exercising the (permanent, non-deprecated) expansion path.
display:
  - platform: sdl
    id: image_display
    auto_clear_enabled: false
    dimensions:
      width: 480
      height: 480

image:
  - platform: file
    defaults:
      type: rgb565
      transparency: opaque
      resize: 50x50
      dither: FloydSteinberg
    files:
      - id: platform_defaults_image
        file: ../../pnglogo.png
      - id: platform_defaults_binary
        file: ../../pnglogo.png
        type: binary
