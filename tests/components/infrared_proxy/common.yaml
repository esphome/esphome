wifi:
  ssid: MySSID
  password: password1

api:

remote_transmitter:
  id: ir_transmitter
  pin: ${tx_pin}
  carrier_duty_percent: 50%

remote_receiver:
  id: ir_receiver
  pin: ${rx_pin}

# Test various hardware types with transmitter/receiver
infrared_proxy:
  # Infrared transmitter
  - id: ir_tx
    name: "IR Transmitter"
    hardware_type: infrared
    remote_transmitter_id: ir_transmitter

  # Infrared receiver
  - id: ir_rx
    name: "IR Receiver"
    hardware_type: infrared
    remote_receiver_id: ir_receiver

  # RF 433MHz transmitter
  - id: rf_433_tx
    name: "RF 433 Transmitter"
    hardware_type: rf_433
    remote_transmitter_id: ir_transmitter

  # RF 900MHz receiver
  - id: rf_900_rx
    name: "RF 900 Receiver"
    hardware_type: rf_900
    remote_receiver_id: ir_receiver
