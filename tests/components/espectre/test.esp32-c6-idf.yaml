packages:
  espectre: !include common.yaml

espectre:
  traffic_generator_mode: external
  csi_traffic_multicast_group: 239.255.0.1
  motion_on_hits: 2
  motion_off_hits: 5
  csi_sample_spacing: distinct
  window_size: 1500ms
  csi_target_pps: 200
  evaluation_interval: 500ms
  lowpass_filter:
    cutoff: 8Hz
  hampel_filter:
    window: 5
    threshold: 3.0
