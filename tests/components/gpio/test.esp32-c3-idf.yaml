substitutions:
  binary_sensor_pin: GPIO2
  output_pin: GPIO3
  switch_pin: GPIO4
  switch_pin_2: GPIO5
  switch_pin_3: GPIO6
  switch_pin_4: GPIO7

packages:
  gpio: !include common.yaml

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO18
      hold_during_sleep: true
    id: gpio_binary_sensor_esp32

output:
  - platform: gpio
    pin:
      number: GPIO19
      hold_during_sleep: true
    id: gpio_output_esp32
