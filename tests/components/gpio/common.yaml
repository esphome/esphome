binary_sensor:
  - platform: gpio
    pin: ${binary_sensor_pin}
    id: gpio_binary_sensor

  # Polling sensor alongside an interrupt sensor: proves the mixed build where
  # both code paths are compiled and selected per instance at runtime.
  - platform: gpio
    pin: ${binary_sensor_pin_2}
    id: gpio_binary_sensor_polling
    use_interrupt: false

output:
  - platform: gpio
    pin: ${output_pin}
    id: gpio_output

switch:
  - platform: gpio
    pin: ${switch_pin}
    id: gpio_switch

  - platform: gpio
    pin: ${switch_pin_2}
    id: gpio_switch_interlock_1
    interlock: [gpio_switch_interlock_2, gpio_switch_interlock_3]
    interlock_wait_time: 100ms

  - platform: gpio
    pin: ${switch_pin_3}
    id: gpio_switch_interlock_2
    interlock: [gpio_switch_interlock_1, gpio_switch_interlock_3]

  - platform: gpio
    pin: ${switch_pin_4}
    id: gpio_switch_interlock_3
    interlock: [gpio_switch_interlock_1, gpio_switch_interlock_2]
    interlock_wait_time: 50ms
