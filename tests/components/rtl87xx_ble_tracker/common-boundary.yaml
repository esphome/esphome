rtl87xx_ble_tracker:
  id: ble_tracker
  scan_parameters:
    # Boundary coverage: the smallest window the millisecond-granular controller
    # API expresses (the BLE 2.5 ms floor rounds up to 3 ms here), a small
    # non-round interval, and the non-continuous config path.
    interval: 5ms
    window: 3ms
    duration: 5min
    continuous: false
