gnss:
  - platform: nmea
    id: gnss_receiver

sensor:
  - platform: gnss
    type: latitude
    name: "Latitude"
    id: gnss_lat
    on_value:
      then:
        - logger.log:
            format: "%.6f, %.6f"
            args: [id(gnss_lat).state, id(gnss_long).state]
  - platform: gnss
    type: longitude
    name: "Longitude"
    id: gnss_long
  - platform: gnss
    type: altitude
    name: "Altitude"
  - platform: gnss
    type: speed
    name: "Speed"
  - platform: gnss
    type: course
    name: "Course"
  - platform: gnss
    type: satellites
    name: "Satellites"
  - platform: gnss
    type: hdop
    name: "HDOP"

time:
  - platform: gnss
    on_time_sync:
      then:
        logger.log: "It's time!"

interval:
  - interval: 10s
    then:
      - lambda: |-
          const auto &data = id(gnss_receiver).get_data();
          if (data.has(gnss::GNSS_FIELD_LOCATION) && data.is_updated(gnss::GNSS_FIELD_SPEED)) {
            ESP_LOGI("nmea_test", "%.7f, %.7f at %.1f km/h", data.latitude_e7 * 1e-7, data.longitude_e7 * 1e-7,
                     data.speed_kmh());
          }
