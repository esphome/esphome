bh1745:
  id: bh1745_hub
  i2c_id: i2c_bus
  gain: 16X
  integration_time: 320ms
  glass_attenuation_factor: 2.0

sensor:
  - platform: bh1745
    bh1745_id: bh1745_hub
    red_channel:
      name: Red channel
    green_channel:
      name: Green channel
    blue_channel:
      name: Blue channel
    clear_channel:
      name: Clear channel
    illuminance:
      name: Illuminance
    color_temperature:
      name: Color temperature

output:
  - platform: bh1745
    id: bh1745_output
    bh1745_id: bh1745_hub
