# TLS 1.3 keeps finite-field Diffie-Hellman in the PSA user config header;
# tests/unit_tests/test_psa_user_config.py checks each condition on its own.
esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: y

wifi:
  ssid: MySSID
  password: password1

http_request:
  verify_ssl: false
