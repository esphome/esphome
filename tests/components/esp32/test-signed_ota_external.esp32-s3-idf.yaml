# External RSA signing mode: a bare signed_ota_verification block enables
# ESPHome's own multi-key OTA signature verifier (USE_OTA_SIGNED_VERIFICATION_
# MULTI_KEY), which accepts an image signed by any key the running app trusts.
# wifi + ota pull in the ota component so CI actually compiles that verifier;
# allow_partition_access exercises the bootloader-update verification path too.
esp32:
  variant: esp32s3
  framework:
    type: esp-idf
    advanced:
      signed_ota_verification:

wifi:
  ssid: MySSID
  password: password1

ota:
  - platform: esphome
    allow_partition_access: true

<<: !include common.yaml
