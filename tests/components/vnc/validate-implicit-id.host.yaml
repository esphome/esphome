packages:
  test_display: !include ../../test_build_components/common/test_display/test_display.yaml

vnc:
  - host: 192.0.2.10

interval:
  - interval: 60s
    then:
      - vnc.refresh
      - vnc.send_pointer:
          x: 10
          y: 20
      - vnc.send_key: Return
      - vnc.send_key: 0xFF1B
      - vnc.send_key:
          key: Shift_L
          action: down
      - vnc.type_text: "Hello\n"
      - if:
          condition: vnc.is_connected
          then:
            - vnc.refresh
