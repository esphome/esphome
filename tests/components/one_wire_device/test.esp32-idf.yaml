esphome:
  name: one-wire-device-test
  on_boot:
    then:
      - one_wire_device.set_temperature:
          id: emulated_temperature
          temperature: 23.5
      - one_wire_device.set_temperature:
          id: emulated_temperature
          temperature: !lambda return -10.125;

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

sensor:
  - platform: template
    id: one_wire_device_source
    lambda: return 21.0;

one_wire_device:
  id: emulated_temperature
  pin: GPIO4
  sensor_id: one_wire_device_source
