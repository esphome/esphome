sensor:
  - platform: axp2101
    id: axp2101_id
    i2c_id: i2c_bus
    update_interval: 10s
    internal_temperature:
      name: "AXP2101 Temperature"
    battery_level:
      name: "Battery Level"
    battery_voltage:
      name: "Battery Voltage"
    battery_present:
      name: "Battery Present"
    battery_charging:
      name: "Battery Charging"
    battery_status:
      name: "Battery Status"

button:
  - platform: template
    name: "Shutdown"
    on_press:
      then:
        - lambda: "id(axp2101_id).shutdown();"
