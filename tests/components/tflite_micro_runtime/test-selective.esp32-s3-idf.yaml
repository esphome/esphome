# The audio model in common.yaml has no .txt report upstream, so the runtime
# keeps the full operator table for that build. This variant uses the image model
# alone, whose report lists its operators, so codegen emits the selective
# TFLM_OP_ENABLED_* defines and tflite_op_processor compiles in only those kernels.
psram:
  mode: quad

tflite_micro_runtime:
  - id: test_tflite_image
    model_type: image
    model: https://raw.githubusercontent.com/nliaudat/esphome_ai_component/4ca8470aba1b226071bcc3258f3b95fab08895d6/models/digit_recognizer_v24_quantized_integer_quant_uint8.tflite
    debug: false
