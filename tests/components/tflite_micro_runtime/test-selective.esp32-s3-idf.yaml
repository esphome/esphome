# common.yaml configures the runtime, and tflite_op_processor emits the selective
# TFLM_OP_ENABLED_* defines for the model's operators only. The core does not
# interpret the tensors, so no kind-specific options are set here.
tflite_model_io:

tflite_micro_runtime:
  - id: test_tflite
    model: https://raw.githubusercontent.com/nliaudat/esphome_ai_component/4ca8470aba1b226071bcc3258f3b95fab08895d6/models/digit_recognizer_v24_quantized_integer_quant_uint8.tflite
