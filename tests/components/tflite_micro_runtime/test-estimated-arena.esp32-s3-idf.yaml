# tensor_arena_size is omitted on purpose: this variant exercises the build-time
# arena estimate, which is emitted as the runtime's configured seed. The core does
# not interpret the tensors, so no kind-specific options are set here.
tflite_micro_runtime:
  - id: test_tflite
    model: https://raw.githubusercontent.com/nliaudat/esphome_ai_component/4ca8470aba1b226071bcc3258f3b95fab08895d6/models/digit_recognizer_v24_quantized_integer_quant_uint8.tflite
