# ESPHome build test: tflite_micro_runtime core. model.tflite is a tiny fixture committed
# next to this file, so the test needs no network. The input and output pipelines for
# a model kind are added by the components that implement them; tflite_model_io is
# auto-loaded by the runtime.
tflite_micro_runtime:
  - id: test_tflite
    model: "../../components/tflite_micro_runtime/model.tflite"
    tensor_arena_size: 200KB
    debug: true
    on_result:
      - logger.log: "TFLite result"
