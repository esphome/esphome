# SMP-over-UDP OTA transport (Thread / IPv6). Kept separate from the BLE+UART
# test because OpenThread (802.15.4) and the BLE SoftDevice are not run together.
network:
  enable_ipv6: true

openthread:
  tlv: 0E080000000000010000

ota:
  - platform: zephyr_mcumgr
    transport:
      udp: true
    on_begin:
      then:
        - logger.log: "OTA start"
    on_progress:
      then:
        - logger.log:
            format: "OTA progress %0.1f%%"
            args: ["x"]
    on_end:
      then:
        - logger.log: "OTA end"
    on_error:
      then:
        - logger.log:
            format: "OTA update error %d"
            args: ["x"]
    on_state_change:
      then:
        lambda: >-
          ESP_LOGD("ota", "State %d", state);
