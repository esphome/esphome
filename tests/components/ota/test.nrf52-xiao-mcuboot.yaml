esphome:
  name: nrf52xiaomcuboot

nrf52:
  board: xiao_ble
  bootloader: mcuboot
  mcuboot:
    usb_cdc_recovery: true

logger:

zephyr_ble_server:

ota:
  - platform: zephyr_mcumgr
    transport:
      ble: true
    on_begin:
      then:
        - logger.log: "OTA start"
    on_progress:
      then:
        - logger.log:
            format: "OTA progress %0.1f%%"
            args: ["x"]
    on_end:
      then:
        - logger.log: "OTA end"
    on_error:
      then:
        - logger.log:
            format: "OTA update error %d"
            args: ["x"]
    on_state_change:
      then:
        lambda: >-
          ESP_LOGD("ota", "State %d", state);
