ota:
  - platform: esphome
    id: ota_esphome
    password: "superlongpasswordthatnoonewillknow"
    on_begin:
      then:
        - logger.log: "OTA start"
    on_progress:
      then:
        - logger.log:
            format: "OTA progress %0.1f%%"
            args: ["x"]
    on_end:
      then:
        - logger.log: "OTA end"
    on_error:
      then:
        - logger.log:
            format: "OTA update error %d"
            args: ["x"]
    on_state_change:
      then:
        lambda: >-
          ESP_LOGD("ota", "State %d", state);

# set_auth_password() must stay callable from a lambda
esphome:
  on_boot:
    then:
      - lambda: id(ota_esphome).set_auth_password("runtime_password");
