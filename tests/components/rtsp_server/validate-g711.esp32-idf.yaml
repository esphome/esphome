substitutions:
  # The camera package already uses the I2S package's default pins
  i2s_bclk_pin: GPIO32
  i2s_lrclk_pin: GPIO33
  i2s_mclk_pin: GPIO14
  i2s_din_pin: GPIO13
  sample_rate: "8000"
  audio_codec: PCMA

packages:
  i2c_camera: !include ../../test_build_components/common/i2c_camera/esp32-idf.yaml
  i2s_audio: !include ../../test_build_components/common/i2s_audio/esp32-idf.yaml
  rtsp_server: !include common-microphone.yaml
