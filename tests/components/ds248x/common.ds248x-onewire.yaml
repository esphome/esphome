# Test: DS248x as OneWireBus backend for dallas_temp sensors
# This tests the new OneWireBus interface implementation

ds248x:
  id: ds248x_hub
  address: 0x18
  type: ds2482-100
  active_pullup: true

one_wire:
  - platform: ds248x
    ds248x_id: ds248x_hub
    channel: 0
    id: onewire_bus

sensor:
  - platform: dallas_temp
    one_wire_id: onewire_bus
    address: 0x1C0000031EDD2A28
    name: Dallas Temperature via DS248x
    resolution: 12
