# Test: DS2482-101 with sleep pin
# Tests the sleep pin functionality specific to the 101 variant

ds248x:
  id: ds2482_101
  address: 0x18
  type: ds2482-101
  active_pullup: true
  sleep_pin:
    number: GPIO4
    inverted: false

one_wire:
