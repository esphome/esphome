# Test: DS2484 with custom 1-Wire timing parameters
# DS2484 supports timing adjustment for non-standard cables/devices

ds248x:
  id: ds2484_hub
  address: 0x18
  type: ds2484
  active_pullup: true
  strong_pullup: true
  # DS2484-specific timing parameters (optional fine-tuning)
  ds2484_reset_low_time: 8        # tRSTL: Reset low time
  ds2484_master_sample_time: 8    # tMSP: Master sample point
  ds2484_write_0_low_time: 8      # tW0L: Write-0 low time
  ds2484_recovery_time: 8         # tREC0: Recovery time

one_wire:
  - platform: ds248x
    ds248x_id: ds2484_hub
    channel: 0
    id: onewire_bus

sensor:
  - platform: dallas_temp
    one_wire_id: onewire_bus
    address: 0x1C0000031EDD2A28
    name: Dallas Temperature via DS2484
    resolution: 12
