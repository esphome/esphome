# Test: DS2482-100 with parasitic power mode and overdrive
# Tests advanced features like parasitic power support

ds248x:
  id: ds2482_100
  address: 0x18
  type: ds2482-100
  active_pullup: true
  strong_pullup: true     # Required for parasitic power devices
  overdrive_speed: false  # Overdrive mode (10x faster, shorter cables)

one_wire:
  - platform: ds248x
    ds248x_id: ds2482_100
    channel: 0
    id: onewire_bus

sensor:
  # Test with multiple sensors on same bus
  - platform: dallas_temp
    one_wire_id: onewire_bus
    address: 0x1C0000031EDD2A28
    name: Sensor 1
    resolution: 12

  - platform: dallas_temp
    one_wire_id: onewire_bus
    address: 0x2800000123456789
    name: Sensor 2
    resolution: 10

  - platform: dallas_temp
    one_wire_id: onewire_bus
    index: 0
    name: Sensor by Index
