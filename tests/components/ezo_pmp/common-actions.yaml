button:
  - platform: template
    name: EZO PMP Actions
    on_press:
      - ezo_pmp.change_i2c_address:
          id: hcl_pump
          address: 104
      - ezo_pmp.change_i2c_address:
          id: hcl_pump
          address: !lambda return 105;
      - ezo_pmp.dose_volume:
          id: hcl_pump
          volume: !lambda return 2.5;
      - ezo_pmp.dose_volume_over_time:
          id: hcl_pump
          volume: !lambda return 2.5;
          duration: !lambda return 3;
      - ezo_pmp.arbitrary_command:
          id: hcl_pump
          command: !lambda return "D,?";
