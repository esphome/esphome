trf7962a:
  id: trf7962a_nfcc
  cs_pin: ${cs_pin}
  irq_pin: ${irq_pin}
  on_tag:
    then:
      - logger.log:
          format: "Tag %s (%s)"
          args: [x.c_str(), tag.get_tag_type().c_str()]
  on_tag_removed:
    then:
      - logger.log:
          format: "Tag removed %s"
          args: [x.c_str()]

binary_sensor:
  - platform: nfc
    nfcc_id: trf7962a_nfcc
    name: TRF7962A NFC Tag
    uid: E0-04-01-00-00-00-00-01
