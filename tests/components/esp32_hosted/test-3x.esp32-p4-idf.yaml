# The esp_hosted 3.x line, selected by pinning the component under
# esp32.framework.components (builds default to 2.x, see ESP_HOSTED_ENABLE_3X).
# Covers the 3.x Kconfig set, the ESP-NOW shim on the 3.x peer-data API and
# the esp32_ble path over the 3.x hosted HCI.
esp32:
  framework:
    components:
      - espressif/esp_hosted==3.0.9

packages:
  esp32_hosted: !include common.yaml
  espnow: !include ../espnow/common.yaml

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true
