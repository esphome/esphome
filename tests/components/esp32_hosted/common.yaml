esp32_hosted:
  id: hosted
  variant: ESP32C6
  slot: 1
  reset_pin: GPIO15
  use_psram: true
  cmd_pin: GPIO13
  clk_pin: GPIO12
  d0_pin: GPIO11
  d1_pin: GPIO10
  d2_pin: GPIO9
  d3_pin: GPIO8

wifi:
  ssid: MySSID
  password: password1

esphome:
  on_boot:
    - lambda: |-
        id(hosted).add_on_link_callback([](bool linked) {
          ESP_LOGI("test", "Link up: %s, linked: %s", YESNO(linked), YESNO(id(hosted).is_linked()));
        });
