# The esp_hosted 2.x line, reached only by pinning the component under
# esp32.framework.components (needed on ESP-IDF 5.3/5.4 or with
# `active_high: false`). Covers the 2.x Kconfig set, the ESP-NOW shim on the
# 2.x peer-data API and the esp32_ble path over the 2.x hosted HCI.
esp32:
  framework:
    components:
      - espressif/esp_hosted==2.12.13

packages:
  esp32_hosted: !include common.yaml
  espnow: !include ../espnow/common.yaml

esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 1100ms
    active: true
