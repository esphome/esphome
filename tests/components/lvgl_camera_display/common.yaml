esp_video_camera:
  id: video_camera
  name: Test Camera
  i2c_id: i2c_bus
  device: jpeg
  sensor_model: sc202cs
  resolution: 1600x900
  max_framerate: 10

lvgl:
  pages:
    - id: camera_page
      widgets:
        - canvas:
            id: camera_canvas
            width: 100
            height: 100

lvgl_camera_display:
  camera_id: video_camera
  canvas_id: camera_canvas

switch:
  - platform: template
    name: Camera preview
    optimistic: true
    restore_mode: ALWAYS_ON
    turn_on_action:
      - lvgl_camera_display.start
    turn_off_action:
      - lvgl_camera_display.stop
