canbus:
  - platform: esp32_can
    id: canbus_esp32_internal_can
    rx_pin: 4
    tx_pin: 5
    can_id: 4
    bit_rate: 50kbps
    max_frames_per_loop: 100
    on_frame:
      - can_id: 500
        then:
          - lambda: |-
              std::string b(x.begin(), x.end());
              ESP_LOGD("canid 500", "%s", b.c_str());
      - can_id: 23
        then:
          - if:
              condition:
                lambda: "return x[0] == 0x11;"
              then:
                logger.log: Truth
          - canbus.send: !lambda return x;
      # x forms from the docs
      - can_id: 24
        then:
          - number.set:
              id: canbus_test_number
              value: !lambda "return (x.size() > 0) ? (float) x[0] / 255 : 0;"
          - lambda: |-
              if (x.empty())
                return;
              ESP_LOGI("can", "SOC: %d%%", x[0]);
              ESP_LOGD("can", "%s", format_hex_pretty(x).c_str());
              uint8_t buf[8];
              memcpy(buf, x.data(), x.size());
              for (uint8_t b : x)
                buf[0] ^= b;
              std::vector<uint8_t> copy = x;
              ESP_LOGD("can", "%u %u", buf[0], (unsigned) copy.size());
          - canbus.send: !lambda |-
              std::vector<uint8_t> data(x.begin(), x.end());
              data.push_back(0x01);
              return data;
      - can_id: 0b00000000000000000000001000000
        can_id_mask: 0b11111000000000011111111000000
        use_extended_id: true
        then:
          - lambda: |-
              auto pdo_id = can_id >> 14;
              switch (pdo_id)
              {
                case 117:
                  ESP_LOGD("canbus", "exhaust_fan_duty");
                  break;
                case 118:
                  ESP_LOGD("canbus", "supply_fan_duty");
                  break;
                case 119:
                  ESP_LOGD("canbus", "supply_fan_flow");
                  break;
              }

number:
  - platform: template
    name: "Test Number"
    id: canbus_test_number
    optimistic: true
    min_value: 0
    max_value: 255
    step: 1

button:
  - platform: template
    name: Canbus Actions
    on_press:
      - canbus.send:
          can_id: 0x601
          data: [0, 1, 2]
      - canbus.send:
          can_id: 0x1FFFFFFF
          use_extended_id: true
          data: [0, 1, 2]
      - canbus.send: "abc"
      - canbus.send: [0, 1, 2]
      # Identical on purpose: both sends share one constant payload
      - canbus.send: [0x11, 0x22, 0x33, 0x44, 0x55, 0x66, 0x77, 0x88]
      - canbus.send: [0x11, 0x22, 0x33, 0x44, 0x55, 0x66, 0x77, 0x88]
      - canbus.send: !lambda return {0, 1, 2};
      # Test canbus.send with lambda that references a component (function pointer)
      - canbus.send: !lambda |-
          uint8_t val = (uint8_t)id(canbus_test_number).state;
          return std::vector<uint8_t>{0xAA, val, 0xBB};
      - canbus.send:
          can_id: 0x123
          remote_transmission_request: true
          data: []
