display:
  - platform: ssd1306_i2c
    i2c_id: i2c_bus
    id: graphical_display_menu_triggers_display
    model: SSD1306_128X64
    reset_pin: ${reset_pin}
    lambda: |-
      it.rectangle(0, 0, it.get_width(), it.get_height());

font:
  - file: "gfonts://Roboto"
    id: graphical_display_menu_triggers_font
    size: 20

graphical_display_menu:
  id: graphical_display_menu_triggers_menu
  display: graphical_display_menu_triggers_display
  font: graphical_display_menu_triggers_font
  on_redraw:
    then:
      lambda: 'ESP_LOGI("graphical_display_menu", "redraw, active: %d", it->is_active());'
  items:
    - type: label
      text: "Label"
