host:
  mac_address: "62:23:45:AF:B3:DD"

display:
  - platform: sdl
    id: sdl_sdl_display
    update_interval: 1s
    auto_clear_enabled: false
    show_test_card: true
    dimensions:
      width: 450
      height: 600
    window_options:
      position:
        x: 100
        y: 100

  - platform: sdl
    id: second_display
    dimensions:
      width: 450
      height: 600
    window_options:
      position:
        centered_on_display: 1

  - platform: sdl
    id: third_display
    dimensions:
      width: 450
      height: 600
    window_options:
      position:
        centered_on_display: 0

binary_sensor:
  # Keyboard binary sensors
  - platform: sdl
    sdl_id: sdl_sdl_display
    id: key_up
    key: SDLK_UP
  - platform: sdl
    sdl_id: sdl_sdl_display
    id: key_down
    key: SDLK_DOWN
  - platform: sdl
    sdl_id: sdl_sdl_display
    id: key_enter
    key: SDLK_RETURN

  # Mouse button binary sensors
  - platform: sdl
    sdl_id: sdl_display
    id: mouse_left_button
    name: "Left Mouse Button"
    mouse_button: 1
  - platform: sdl
    sdl_id: sdl_display
    id: mouse_middle_button
    name: "Middle Mouse Button"
    mouse_button: 2
  - platform: sdl
    sdl_id: sdl_display
    id: mouse_right_button
    name: "Right Mouse Button"
    mouse_button: 3

sensor:
  # Test mouse wheel encoder with wrapping
  - platform: sdl
    sdl_id: sdl_display
    id: mouse_encoder
    name: "Mouse Wheel Encoder"
    min_value: 0
    max_value: 100
    wrap: true

  # Test encoder without wrapping
  - platform: sdl
    sdl_id: sdl_display
    id: mouse_encoder_no_wrap
    name: "Mouse Encoder No Wrap"
    min_value: 10
    max_value: 50
    wrap: false
