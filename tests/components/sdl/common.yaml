host:
  mac_address: "62:23:45:AF:B3:DD"

display:
  - platform: sdl
    id: sdl_sdl_display
    update_interval: 1s
    auto_clear_enabled: false
    show_test_card: true
    dimensions:
      width: 450
      height: 600
    window_options:
      position:
        x: 100
        y: 100
    screenshot_key: SDLK_F12

  - platform: sdl
    id: headless_display
    headless: true
    show_test_card: true
    dimensions:
      width: 320
      height: 240

  - platform: sdl
    id: second_display
    dimensions:
      width: 450
      height: 600
    window_options:
      position:
        centered_on_display: 1

  - platform: sdl
    id: third_display
    dimensions:
      width: 450
      height: 600
    window_options:
      position:
        centered_on_display: 0

binary_sensor:
  - platform: sdl
    sdl_id: sdl_sdl_display
    id: key_up
    key: SDLK_UP
  - platform: sdl
    sdl_id: sdl_sdl_display
    id: key_down
    key: SDLK_DOWN
  - platform: sdl
    sdl_id: sdl_sdl_display
    id: key_enter
    key: SDLK_RETURN

interval:
  - interval: 10s
    then:
      # timestamped name
      - sdl.screenshot: sdl_sdl_display
      # fixed name, for a test that asserts on the path
      - sdl.screenshot:
          id: headless_display
          filename: test_card.bmp
      - sdl.screenshot:
          id: headless_display
          filename: !lambda 'return "shot.bmp";'
