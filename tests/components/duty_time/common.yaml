binary_sensor:
  - platform: template
    id: duty_time_bin1
    lambda: |-
      if (millis() > 10000) {
        return true;
      }
      return false;

sensor:
  - platform: duty_time
    id: pump_duty_time
    name: Duty Time
    sensor: duty_time_bin1
  - platform: duty_time
    id: lambda_duty_time
    name: Lambda Duty Time
    lambda: "return id(duty_time_bin1).state;"
