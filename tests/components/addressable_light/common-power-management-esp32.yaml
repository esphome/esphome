light:
  - platform: esp32_rmt_led_strip
    id: power_managed_strip
    chipset: ws2812
    rgb_order: GRB
    num_leds: 100
    pin: ${pin}
    power_limits:
      max_current: 2A
      voltage: 5.0
      led_current_consumption:
        red: 60mA
        green: 60mA
        blue: 60mA
        white: 60mA

  - platform: addressable_light
    id: power_managed_light
    addressable_light_id: power_managed_strip
