esp32_ble_tracker:
  id: ble_tracker_hub

sensor:
  # Explicit ble_hub_id: pins the neutral binding as a declared key.
  - platform: xiaomi_lywsdcgq
    ble_hub_id: ble_tracker_hub
    mac_address: 7A:80:8E:19:36:BA
    temperature:
      name: Xiaomi LYWSDCGQ Temperature
    humidity:
      name: Xiaomi LYWSDCGQ Humidity
    battery_level:
      name: Xiaomi LYWSDCGQ Battery Level
