esphome:
  on_boot:
    then:
      - logger.log:
          level: warn
          format: "Warning: Logger level is %d"
          args: [id(logger_id).get_log_level()]
      - logger.log:
          tag: custom.tag
          level: info
          format: "Tagged log entry"
      - logger.set_level: WARN
      - logger.set_level:
          level: ERROR
          tag: mqtt.client

logger:
  id: logger_id
  level: DEBUG
  initial_level: INFO
  logs:
    mqtt.component: WARN
  on_message:
    - level: WARN
      then:
        - lambda: |-
            if (strcmp(tag, "custom.tag") == 0)
              ESP_LOGD("test", "Level %u: %s", level, message);
    - level: ERROR
      then:
        - delay: 1s
        - lambda: |-
            ESP_LOGD("test", "Error %u from %s: %s", level, tag, message);

select:
  - platform: logger
    name: Logger Level
