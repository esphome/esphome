speaker:
  - platform: i2s_audio
    id: test_speaker
    i2s_audio_id: i2s_audio_bus
    i2s_dout_pin: ${i2s_dout_pin}
    dac_type: external

media_player:
  - platform: speaker
    id: test_media_player
    name: None
    announcement_pipeline:
      speaker: test_speaker
      format: NONE
    on_state:
      - media_player.play: test_media_player
      - media_player.play_media:
          id: test_media_player
          media_url: http://localhost/media.mp3
      - media_player.play_media:
          id: test_media_player
          media_url: !lambda |-
            return id(test_media_player).is_muted() ? "http://localhost/muted.mp3" : "http://localhost/media.mp3";
    on_idle:
      - media_player.pause: test_media_player
    on_play:
      - media_player.stop: test_media_player
      - media_player.stop:
          id: test_media_player
          announcement: true
      - media_player.stop:
          id: test_media_player
          announcement: !lambda 'return id(test_media_player).is_muted();'
    on_announcement:
      - media_player.play: test_media_player
    on_turn_on:
      - media_player.play: test_media_player
    on_turn_off:
      - media_player.stop: test_media_player
    on_pause:
      - media_player.toggle: test_media_player
      - media_player.turn_on: test_media_player
      - media_player.turn_off: test_media_player
      - media_player.next: test_media_player
      - media_player.previous: test_media_player
      - media_player.mute: test_media_player
      - media_player.unmute: test_media_player
      - media_player.repeat_off: test_media_player
      - media_player.repeat_one: test_media_player
      - media_player.repeat_all: test_media_player
      - media_player.shuffle: test_media_player
      - media_player.unshuffle: test_media_player
      - media_player.group_join: test_media_player
      - media_player.clear_playlist: test_media_player
      - wait_until:
          media_player.is_idle: test_media_player
      - wait_until:
          media_player.is_playing: test_media_player
      - wait_until:
          media_player.is_announcing: test_media_player
      - wait_until:
          media_player.is_paused: test_media_player
      - wait_until:
          media_player.is_on: test_media_player
      - wait_until:
          media_player.is_off: test_media_player
      - wait_until:
          media_player.is_muted: test_media_player
      - media_player.volume_up: test_media_player
      - media_player.volume_down: test_media_player
      - media_player.volume_set:
          id: test_media_player
          volume: 50%
      - media_player.volume_set:
          id: test_media_player
          volume: !lambda 'return id(test_media_player).volume / 2;'
      - media_player.enqueue:
          id: test_media_player
          media_url: http://localhost/media.mp3
      - media_player.enqueue:
          id: test_media_player
          media_url: !lambda |-
            return id(test_media_player).is_muted() ? "http://localhost/muted.mp3" : "http://localhost/media.mp3";
      - media_player.enqueue:
          id: test_media_player
          media_url: http://localhost/media.mp3
          announcement: true
