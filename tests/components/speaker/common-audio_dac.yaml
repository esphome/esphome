esphome:
  on_boot:
    then:
      - speaker.mute_on:
      - speaker.mute_off:
      - if:
          condition: speaker.is_stopped
          then:
            - speaker.play: [0, 1, 2, 3]
      - speaker.volume_set: 0.9
      - if:
          condition: speaker.is_playing
          then:
            - speaker.finish:
      - speaker.stop:
      # the single-DAC setter stays public for lambdas and external components
      - lambda: id(speaker_with_audio_dac_id).set_audio_dac(id(internal_dac));

audio_dac:
  - platform: aic3204
    i2c_id: i2c_bus
    id: internal_dac
  - platform: aic3204
    i2c_id: i2c_bus
    id: second_dac
    address: 0x19

speaker:
  - platform: i2s_audio
    id: speaker_with_audio_dac_id
    i2s_audio_id: i2s_audio_bus
    # two DACs on the same I2S output share the speaker's volume and mute
    audio_dac:
      - internal_dac
      - second_dac
    dac_type: external
    i2s_dout_pin: ${i2s_dout_pin}
