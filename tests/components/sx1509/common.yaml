sx1509:
  - id: sx1509_hub
    i2c_id: i2c_bus
    address: 0x3E
    keypad:
      key_rows: 2
      key_columns: 2
      keys: abcd
      on_key:
        - then:
            - lambda: ESP_LOGD("test", "got key '%c'", x);
        - then:
            - lambda: ESP_LOGD("test", "second key '%c'", x);
  - id: sx1509_hub_second
    i2c_id: i2c_bus
    address: 0x3F
    keypad:
      key_rows: 2
      key_columns: 2
      keys: wxyz
      on_key:
        - lambda: ESP_LOGD("test", "second hub key '%c'", x);

binary_sensor:
  - platform: gpio
    name: GPIO SX1509 Test
    pin:
      sx1509: sx1509_hub
      number: 3
  - platform: sx1509
    sx1509_id: sx1509_hub
    name: "keypadkey_0"
    row: 0
    col: 0

switch:
  - platform: gpio
    name: GPIO SX1509 Test Out Open Drain
    pin:
      sx1509: sx1509_hub
      number: 0
      mode:
        output: true
        open_drain: true

  - platform: gpio
    name: GPIO SX1509 Test Out Standard
    pin:
      sx1509: sx1509_hub
      number: 1
      mode:
        output: true

output:
  - platform: sx1509
    id: sx1509_output
    sx1509_id: sx1509_hub
    pin: 5
  - platform: sx1509
    id: sx1509_output_inverted
    sx1509_id: sx1509_hub
    pin: 6
    inverted: true
    min_power: 10%
  - platform: sx1509
    id: sx1509_output_second_hub
    sx1509_id: sx1509_hub_second
    pin: 5
