climate:
  - platform: heatpumpir
    protocol: mitsubishi_heavy_zm
    horizontal_default: left
    vertical_default: up
    name: HeatpumpIR Climate Mitsubishi
    min_temperature: 18
    max_temperature: 30
    transmitter_id: xmitr
  - platform: heatpumpir
    protocol: daikin
    horizontal_default: mleft
    vertical_default: mup
    name: HeatpumpIR Climate Daikin
    min_temperature: 18
    max_temperature: 30
    transmitter_id: xmitr
  - platform: heatpumpir
    protocol: panasonic_altdke
    horizontal_default: mright
    vertical_default: mdown
    name: HeatpumpIR Climate Panasonic
    min_temperature: 18
    max_temperature: 30
    transmitter_id: xmitr
  - platform: heatpumpir
    protocol: greeyap
    horizontal_default: auto
    vertical_default: up
    name: HeatpumpIR Climate Gree YAP (Light Off)
    min_temperature: 16
    max_temperature: 30
    light: false
    transmitter_id: xmitr
  - platform: heatpumpir
    protocol: vaillantvai8
    horizontal_default: auto
    vertical_default: up
    name: HeatpumpIR Climate Vaillant (Light Off)
    min_temperature: 16
    max_temperature: 30
    light: false
    transmitter_id: xmitr
