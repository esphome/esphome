esphome:
  name: inkplate2-test
  friendly_name: Inkplate2Test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

packages:
  spi: !include ../../test_build_components/common/spi/esp32-idf.yaml

display:
  - platform: epaper_spi
    spi_id: spi_bus
    model: inkplate2
    cs_pin: GPIO15
    dc_pin: GPIO33
    reset_pin: GPIO21
    busy_pin: GPIO32
    rotation: 90
    update_interval: 60s
    lambda: |-
      // Clear to white background
      it.fill(COLOR_OFF);

      // Black circle on left
      it.filled_circle(70, 52, 30, COLOR_ON);

      // Red circle on right
      it.filled_circle(142, 52, 30, Color(255, 0, 0));
