display:
  - platform: uart_terminal
    id: terminal
    dimensions: 20x4
    lambda: |-
      id(terminal_menu).draw();
      if (!id(terminal_menu).is_active())
        it.print("Uart terminal");

lcd_menu:
  id: terminal_menu
  display_id: terminal
  active: true
  mode: joystick
  items:
    - type: label
      text: Settings
    - type: menu
      text: Submenu
      items:
        - type: back
          text: Back
