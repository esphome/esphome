i2s_audio:
  - id: i2s_output

speaker:
  - platform: i2s_audio
    id: spdif_speaker_id
    dac_type: external
    i2s_dout_pin: ${spdif_data_pin}
    spdif_mode: true
    use_apll: true
    timeout: 2s
    sample_rate: 48000
    channel: stereo
    i2s_mode: primary

script:
  - id: spdif_play
    then:
      - speaker.play:
          id: spdif_speaker_id
          data: [0x10, 0x20, 0x30, 0x40]
      - speaker.play:
          id: spdif_speaker_id
          data: !lambda "return {0x01, 0x02};"
