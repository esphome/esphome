button:
  - platform: template
    name: Poller component suspend test
    on_press:
      - component.suspend: test_teleinfo
      - delay: 20s
      - component.update: test_teleinfo
      - delay: 20s
      - component.resume: test_teleinfo
      - delay: 20s
      - component.resume:
          id: test_teleinfo
          update_interval: 2s
      - delay: 20s
      - component.resume:
          id: test_teleinfo
          update_interval: !lambda return 2500;

teleinfo:
  id: test_teleinfo
  historical_mode: true
  update_interval: 60s

sensor:
  # Historical mode tags - auto-configured via apply_tag_config
  - platform: teleinfo
    name: hchc
    tag_name: HCHC
    teleinfo_id: test_teleinfo
  - platform: teleinfo
    name: base
    tag_name: BASE
    teleinfo_id: test_teleinfo
  - platform: teleinfo
    name: iinst1
    tag_name: IINST1
    teleinfo_id: test_teleinfo
  - platform: teleinfo
    name: papp
    tag_name: PAPP
    teleinfo_id: test_teleinfo
  - platform: teleinfo
    name: bbrhcjb
    tag_name: BBRHCJB
    teleinfo_id: test_teleinfo
  - platform: teleinfo
    name: ejphn
    tag_name: EJPHN
    teleinfo_id: test_teleinfo
  - platform: teleinfo
    name: pmax
    tag_name: PMAX
    teleinfo_id: test_teleinfo
  - platform: teleinfo
    name: imax1
    tag_name: IMAX1
    teleinfo_id: test_teleinfo
  - platform: teleinfo
    name: isousc
    tag_name: ISOUSC
    teleinfo_id: test_teleinfo
  - platform: teleinfo
    name: adps
    tag_name: ADPS
    teleinfo_id: test_teleinfo
  # Standard mode tags - auto-configured via apply_tag_config
  - platform: teleinfo
    name: east
