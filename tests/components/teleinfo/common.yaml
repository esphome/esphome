  # Explicit override - user-specified unit should not be overwritten
  - platform: teleinfo
    name: hchp_override
    tag_name: HCHP
    teleinfo_id: test_teleinfo
    unit_of_measurement: kWh
  # Unknown tag - no auto-config match, should still compile
  - platform: teleinfo
    name: custom_tag
    tag_name: MYTAG
    teleinfo_id: test_teleinfo

text_sensor:
  - platform: teleinfo
    name: optarif
    tag_name: OPTARIF
    teleinfo_id: test_teleinfo
