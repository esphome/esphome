pcf8574:
  - id: pcf8574_hub
    i2c_id: i2c_bus
    address: 0x21
    pcf8575: false
  - id: pcf8574_hub_int
    i2c_id: i2c_bus
    address: 0x22
    pcf8575: false
    interrupt_pin: ${interrupt_pin}
    reset: true
  - id: pcf8574_preserved
    i2c_id: i2c_bus
    address: 0x23
    reset: false
  - id: pcf8575_preserved
    i2c_id: i2c_bus
    address: 0x24
    pcf8575: true
    reset: false

binary_sensor:
  - platform: gpio
    id: pcf8574_binary_sensor
    name: PCF Binary Sensor
    pin:
      pcf8574: pcf8574_hub
      number: 1
      mode: INPUT
      inverted: true
  - platform: gpio
    id: pcf8574_preserved_input
    pin:
      pcf8574: pcf8574_preserved
      number: 1
      mode: INPUT
  - platform: gpio
    id: pcf8575_preserved_input
    pin:
      pcf8574: pcf8575_preserved
      number: 15
      mode: INPUT

output:
  - platform: gpio
    id: pcf8574_output
    pin:
      pcf8574: pcf8574_hub
      number: 0
      mode: OUTPUT
      inverted: false
  - platform: gpio
    id: pcf8574_preserved_output
    pin:
      pcf8574: pcf8574_preserved
      number: 0
  - platform: gpio
    id: pcf8575_preserved_output
    pin:
      pcf8574: pcf8575_preserved
      number: 8
