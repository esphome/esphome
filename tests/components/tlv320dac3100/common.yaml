esphome:
  on_boot:
    then:
      - audio_dac.mute_off: dac_bclk
      - audio_dac.mute_on: dac_mclk
      - audio_dac.set_volume:
          id: dac_bclk
          volume: 50%

audio_dac:
  - platform: tlv320dac3100
    id: dac_bclk
    i2c_id: i2c_bus
    sample_rate: 44100
    bits_per_sample: 32bit
    output: SPEAKER
    speaker_gain: 24dB
    reset_pin: ${reset_pin}
  - platform: tlv320dac3100
    id: dac_mclk
    i2c_id: i2c_bus
    address: 0x19
    sample_rate: 44100
    bits_per_sample: 32bit
    mclk_frequency: 11289600
    output: HEADPHONE

speaker:
  - platform: i2s_audio
    id: tlv320dac3100_speaker
    i2s_audio_id: i2s_audio_bus
    audio_dac: [dac_bclk, dac_mclk]
    dac_type: external
    i2s_dout_pin: GPIO13
    sample_rate: 44100
    bits_per_sample: 32bit
