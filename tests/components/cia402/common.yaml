canopen:
  - canbus_id: cia402_test_bus
    id: cia402_test_hub

cia402:
  canopen_id: cia402_test_hub
  id: cia402_test_drive
  node_id: 32
  profile_velocity: 1000
  acceleration: 2000
  deceleration: 2000
  on_result:
    - logger.log: "Drive command completed"
button:
  - platform: template
    name: Enable
    on_press:
      - cia402.enable: cia402_test_drive
  - platform: template
    name: Stop
    on_press:
      - cia402.quick_stop: cia402_test_drive
  - platform: template
    name: Move
    on_press:
      - cia402.move_to:
          id: cia402_test_drive
          position: -100
  - platform: template
    name: Home
    on_press:
      - cia402.home:
          id: cia402_test_drive
          method: 35
