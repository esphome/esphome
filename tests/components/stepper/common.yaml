stepper:
  - platform: a4988
    id: test_stepper
    step_pin: 3
    dir_pin: 4
    sleep_pin: 5
    max_speed: 250 steps/s
    acceleration: 100 steps/s^2
    deceleration: 200 steps/s^2

switch:
  - platform: template
    name: Stepper Switch
    assumed_state: true
    turn_on_action:
      - stepper.set_target:
          id: test_stepper
          target: !lambda |-
            static int32_t i = 0;
            i += 1000;
            if (i > 5000) {
              i = -5000;
            }
            return i;
      - stepper.report_position:
          id: test_stepper
          position: 0
      - stepper.set_speed:
          id: test_stepper
          speed: 300 steps/s
      - stepper.set_acceleration:
          id: test_stepper
          acceleration: !lambda return 150.0f;
      - stepper.set_deceleration:
          id: test_stepper
          deceleration: 250 steps/s^2
      - stepper.report_position:
          id: test_stepper
          position: !lambda return 100;
      - stepper.set_speed:
          id: test_stepper
          speed: !lambda return 200.0f;
      - stepper.set_deceleration:
          id: test_stepper
          deceleration: !lambda return 180.0f;
