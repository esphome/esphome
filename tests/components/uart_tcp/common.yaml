wifi:
  ssid: MySSID
  password: password1

uart_tcp:
  - id: bridge
    uart_id: uart_bus
    role: server
    port: 502
    allowed_ips:
      - 192.168.1.10
      - 192.168.1.0/24

binary_sensor:
  - platform: uart_tcp
    uart_tcp_id: bridge
    connected:
      name: UART TCP Connected

sensor:
  - platform: uart_tcp
    uart_tcp_id: bridge
    disconnects:
      name: UART TCP Disconnects
