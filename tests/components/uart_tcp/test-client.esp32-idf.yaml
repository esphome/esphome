packages:
  uart: !include ../../test_build_components/common/uart/esp32-idf.yaml

wifi:
  ssid: MySSID
  password: password1

uart_tcp:
  - id: bridge
    uart_id: uart_bus
    role: client
    host: 192.0.2.20
    port: 502
    reconnect_interval: 10s
    timeout: 30s
    encryption:
      key: "dWFydF90Y3Agbm9pc2UgY29tcGlsZSB0ZXN0IGtleSE="

binary_sensor:
  - platform: uart_tcp
    uart_tcp_id: bridge
    connected:
      name: UART TCP Connected

sensor:
  - platform: uart_tcp
    uart_tcp_id: bridge
    disconnects:
      name: UART TCP Disconnects
