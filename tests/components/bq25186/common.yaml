esphome:
  on_boot:
    priority: -100
    then:
      # Just the defined configuration
      - bq25186.apply_configuration: bq25186_charger
      # Just the defined configuration with some overrides
      - bq25186.apply_configuration:
          id: bq25186_charger
          battery_regulation_voltage: 4.1V
          fast_charge_current: 200mA
      - bq25186.apply_configuration:
          id: bq25186_charger
          charge_enabled: false
          flash_charging_mode: true
          precharge_is_iterm: true
          termination_percent: 5%
          vindpm_mode: 4.7v
          thermal_regulation: 80c
          battery_ocp_limit: 1500ma
          battery_uvlo: 3.0v
          mask_charge_status_interrupt: false
          mask_ilim_interrupt: false
          mask_vindpm_interrupt: true
          ts_auto_function: false
          vlowv: 2.8v
          recharge_threshold: 200mv
          double_timer_during_dpm: true
          safety_timer: 12h
          watchdog: 160s_hardware_reset
          long_press_duration: 15s
          hw_reset_requires_vin: true
          autowake: 2s
          input_current_limit: 200ma
      - bq25186.apply_configuration:
          id: bq25186_charger
          push_button_long_press_action: shutdown_mode
          wake1_timer: 1s
          wake2_timer: 3s
          enable_push_button: false
          system_regulation: 4.6v
          sys_mode: battery_only
          watchdog_15s_enable: false
          disable_vdppm: true
          ts_hot: 65c
          ts_cold: 3c
          ts_warm_disable: true
          ts_cool_disable: true
          ts_ichg: 0.2x
          ts_vrcg: -200mv
          mask_ts_interrupt: true
          mask_treg_interrupt: false
          mask_bat_interrupt: true
          mask_pg_interrupt: true

bq25186:
  - id: bq25186_charger
    i2c_id: i2c_bus
    configure_on_boot: false
    fast_charge_current: 150mA
    battery_regulation_voltage: 4.2V
    input_current_limit: 500ma
    system_regulation: 4.5v
    charge_enabled: true
  # Second charger with the boot-time write enabled
  - id: bq25186_boot
    i2c_id: i2c_bus
    address: 0x6B
    configure_on_boot: true
    fast_charge_current: 20mA
    watchdog: 160s_software_reset
    update_interval: 30s

binary_sensor:
  - platform: bq25186
    bq25186_id: bq25186_charger
    ts:
      name: TS Open
    charging:
      name: Charging
    charge_done:
      name: Charge Done
    ilim:
      name: ILIM Active
    vdppm:
      name: VDPPM Active
    vindpm:
      name: VINDPM Active
    thermreg:
      name: Thermal Regulation Active
    power_good:
      name: VIN Power Good
    vin_ovp:
      name: VIN OVP Active
    battery_uvlo:
      name: Battery UVLO Active
    safety_timer_flag:
      name: Safety Timer Flag
    wake1_flag:
      name: Wake 1 Flag
    wake2_flag:
      name: Wake 2 Flag
    ts_flag:
      name: TS Flag
    ilim_flag:
      name: ILIM Flag
    vdppm_flag:
      name: VDPPM Flag
    vindpm_flag:
      name: VINDPM Flag
    thermreg_flag:
      name: Thermal Regulation Flag
    vin_ovp_flag:
      name: VIN OVP Flag
    battery_uvlo_flag:
      name: Battery UVLO Flag
    battery_ocp_flag:
      name: Battery OCP Flag

text_sensor:
  - platform: bq25186
    bq25186_id: bq25186_charger
    charge_status:
      name: Charge Status
    ts_status:
      name: TS Status

button:
  - platform: bq25186
    bq25186_id: bq25186_charger
    software_reset:
      name: Software Reset
    shutdown:
      name: Shutdown
    ship_mode:
      name: Ship Mode
    hardware_reset:
      name: Hardware Reset

switch:
  - platform: bq25186
    bq25186_id: bq25186_boot
    pg_gpo:
      name: PG GPO
