esphome:
  on_boot:
    priority: -100
    then:
      - bq25186.configure: charger

bq25186:
  id: charger
  configure_on_boot: false
  fast_charge_current: 150
  battery_regulation_voltage: 4200
  input_current_limit: 500ma
  system_regulation: 4.5v
  charge_enabled: true
  flash_charging_mode: true

binary_sensor:
  - platform: bq25186
    bq25186_id: charger
    ts:
      name: TS Open
    charging:
      name: Charging
    charge_done:
      name: Charge Done
    ilim:
      name: ILIM Active
    vdppm:
      name: VDPPM Active
    vindpm:
      name: VINDPM Active
    thermreg:
      name: Thermal Regulation Active
    power_good:
      name: VIN Power Good
    vin_ovp:
      name: VIN OVP Active
    battery_uvlo:
      name: Battery UVLO Active
    safety_timer_fault:
      name: Safety Timer Fault
    wake1_flag:
      name: Wake 1 Flag
    wake2_flag:
      name: Wake 2 Flag
    ts_fault:
      name: TS Fault
    ilim_fault:
      name: ILIM Fault
    vdppm_fault:
      name: VDPPM Fault
    vindpm_fault:
      name: VINDPM Fault
    thermreg_active:
      name: Thermal Regulation Flag
    vin_ovp_fault:
      name: VIN OVP Fault
    battery_uvlo_fault:
      name: Battery UVLO Fault
    battery_ocp_fault:
      name: Battery OCP Fault

text_sensor:
  - platform: bq25186
    bq25186_id: charger
    charge_status:
      name: Charge Status
    ts_status:
      name: TS Status

switch:
  - platform: bq25186
    bq25186_id: charger
    pg_gpo:
      name: PG GPO Switch

button:
  - platform: bq25186
    bq25186_id: charger
    software_reset:
      name: Software Reset
    shutdown:
      name: Shutdown
    ship_mode:
      name: Ship Mode
    hardware_reset:
      name: Hardware Reset
