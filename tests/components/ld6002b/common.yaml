    get_delay:
      name: Get Delay
    get_sensitivity:
      name: Get Sensitivity
    get_trigger_speed:
      name: Get Trigger Speed
    get_z_range:
      name: Get Z Range
    get_installation:
      name: Get Installation
    get_low_power_mode:
