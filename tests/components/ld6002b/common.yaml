    ld6002b_id: ld6002b_radar
    target_count:
      name: Target Count
    point_count:
      name: Point Count
    target_1:
      x:
        name: Target-1 X
      y:
        name: Target-1 Y
      z:
        name: Target-1 Z
      doppler_index:
        name: Target-1 Dop
      cluster_id:
        name: Target-1 Cluster
    target_2:
      x:
        name: Target-2 X
      y:
        name: Target-2 Y
      z:
        name: Target-2 Z
      doppler_index:
        name: Target-2 Dop
      cluster_id:
        name: Target-2 Cluster
    target_3:
      x:
        name: Target-3 X
      y:
        name: Target-3 Y
      z:
        name: Target-3 Z
      doppler_index:
        name: Target-3 Dop
      cluster_id:
        name: Target-3 Cluster
    interference_area_0:
      x_min:
        name: Interference-0 X Min
      x_max:
        name: Interference-0 X Max
      y_min:
        name: Interference-0 Y Min
      y_max:
        name: Interference-0 Y Max
      z_min:
        name: Interference-0 Z Min
      z_max:
        name: Interference-0 Z Max
    detection_area_0:
      x_min:
        name: Detection-0 X Min
      x_max:
        name: Detection-0 X Max
      y_min:
        name: Detection-0 Y Min
      y_max:
        name: Detection-0 Y Max
      z_min:
        name: Detection-0 Z Min
      z_max:
