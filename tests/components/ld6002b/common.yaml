    ld6002b_id: ld6002b_radar
    target:
      name: Presence
    target_1:
      name: Target-1 Presence
    detection_area_0:
      name: Detection Area-0 Presence

text_sensor:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    work_mode:
      name: Work Mode
    ota_version:
      name: OTA Version

number:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    hold_delay:
      name: Hold Delay
    z_min:
      name: Z Min
    z_max:
      name: Z Max
    low_power_sleep_time:
      name: Low Power Sleep
    area_config:
      x_min:
        name: Area X Min
      x_max:
        name: Area X Max
      y_min:
        name: Area Y Min
      y_max:
        name: Area Y Max
      z_min:
        name: Area Z Min
      z_max:
        name: Area Z Max

select:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    sensitivity:
      name: Sensitivity
    trigger_speed:
      name: Trigger Speed
    installation_mode:
      name: Installation
    area_id:
      name: Area ID

switch:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    low_power:
      name: Low Power
    point_cloud:
      name: Point Cloud
    target_display:
      name: Target Display

button:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    apply_area:
