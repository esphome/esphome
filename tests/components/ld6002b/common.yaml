ld6002b:
  id: ld6002b_radar
  wakeup_pin: GPIO14

sensor:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    target_count:
      name: Target Count
    point_count:
      name: Point Count
    target_1:
      x:
        name: Target-1 X
      y:
        name: Target-1 Y
      z:
        name: Target-1 Z
      doppler_index:
        name: Target-1 Dop
      cluster_id:
        name: Target-1 Cluster
    target_2:
      x:
        name: Target-2 X
      y:
        name: Target-2 Y
      z:
        name: Target-2 Z
      doppler_index:
        name: Target-2 Dop
      cluster_id:
        name: Target-2 Cluster
    target_3:
      x:
        name: Target-3 X
      y:
        name: Target-3 Y
      z:
        name: Target-3 Z
      doppler_index:
        name: Target-3 Dop
      cluster_id:
        name: Target-3 Cluster

binary_sensor:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    target:
      name: Presence
    target_1:
      name: Target-1 Presence

text_sensor:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    work_mode:
      name: Work Mode
    ota_version:
      name: OTA Version

number:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    hold_delay:
      name: Hold Delay
    z_min:
      name: Z Min
    z_max:
      name: Z Max
    low_power_sleep_time:
      name: Low Power Sleep

switch:
  - platform: ld6002b
    ld6002b_id: ld6002b_radar
    low_power:
      name: Low Power
    point_cloud:
      name: Point Cloud
    target_display:
      name: Target Display
