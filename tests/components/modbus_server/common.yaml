modbus:
  - id: mod_bus2
    uart_id: uart_bus
    role: server

modbus_server:
  - id: modbus_server2
    address: 0x2
    modbus_id: mod_bus2
    registers:
      - address: 0x0
        value_type: S_DWORD_R
        read_lambda: |-
          return 42.3;
  - id: modbus_server3
    address: 0x3
    modbus_id: mod_bus2
    bits:
      - address: 0x0
        read_lambda: |-
          return true;
      - address: 0x1
        read_lambda: |-
          return address == 0x1;
        write_lambda: |-
          printf("bit address=%d, value=%d\n", (int) address, (int) x);
          return true;
    registers:
      - address: 0x9
        value_type: S_DWORD
        allow_partial_read: true
        read_lambda: |-
          return 31;
        write_lambda: |-
          printf("address=%d, value=%" PRId32 "\n", (int) address, x);
          return true;
  - id: modbus_server4
    modbus_id: mod_bus2
    address: 0x4
    courtesy_response:
      enabled: true
      register_last_address: 100
      register_value: 0
    registers:
      - address: 0x1
        value_type: U_WORD
        read_lambda: |-
          return 0x8;
      - address: 0x5
        value_type: U_WORD
        read_lambda: |-
          return (random_uint32() % 100);
      # Covers CPP_TYPE_REGISTER_MAP / signed byte-swapped codegen
      - address: 0x6
        value_type: S_WORD_S
        read_lambda: |-
          return -2;
        write_lambda: |-
          printf("address=%d, value=%d\n", (int) address, (int) x);
          return true;
