esp32_ble_tracker:
  id: ble_tracker_hub

text_sensor:
  # Explicit ble_hub_id: pins the neutral binding as a declared key.
  - platform: ble_scanner
    ble_hub_id: ble_tracker_hub
    name: Scanner
  # No ble_hub_id: exercises the generated binding _require_hub guards.
  - platform: ble_scanner
    name: Scanner Implicit
