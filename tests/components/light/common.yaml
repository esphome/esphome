esphome:
  on_boot:
    then:
      # Test LightEffect::get_name() returns StringRef
      - lambda: |-
          // Test LightEffect::get_name() returns StringRef
          auto &effects = id(test_monochromatic_light).get_effects();
          if (!effects.empty()) {
            // Test: get_name() returns StringRef
            StringRef name = effects[0]->get_name();

            // Test: comparison with string literal works directly
            if (name == "Strobe") {
              ESP_LOGI("test", "Found Strobe effect");
            }

            // Test: safe logging with %.*s format
            ESP_LOGI("test", "Effect name: %.*s", (int) name.size(), name.c_str());

            // Test: .c_str() for functions expecting const char*
            ESP_LOGI("test", "Effect: %s", name.c_str());

            // Test: explicit conversion to std::string
            std::string name_str(name.c_str(), name.size());
            ESP_LOGI("test", "As string: %s", name_str.c_str());

            // Test: size() method
            ESP_LOGI("test", "Name length: %d", (int) name.size());
          }

      # Test LightState::get_effect_name() returns StringRef
      - lambda: |-
          // Test LightState::get_effect_name() returns StringRef
          StringRef current_effect = id(test_monochromatic_light).get_effect_name();

          // Test: comparison with "None" works directly
          if (current_effect == "None") {
            ESP_LOGI("test", "No effect active");
          }

          // Test: safe logging
          ESP_LOGI("test", "Current effect: %.*s", (int) current_effect.size(), current_effect.c_str());

      # Test str_equals_case_insensitive with StringRef
      - lambda: |-
          // Test str_equals_case_insensitive(StringRef, StringRef)
          auto &effects = id(test_monochromatic_light).get_effects();
          if (!effects.empty()) {
            StringRef name = effects[0]->get_name();

            // Test: case-insensitive comparison
            if (str_equals_case_insensitive(name, "STROBE")) {
              ESP_LOGI("test", "Case-insensitive match works");
            }

            // Test: case-insensitive with StringRef from string
            std::string search = "strobe";
            if (str_equals_case_insensitive(StringRef(search.c_str(), search.size()), name)) {
              ESP_LOGI("test", "Reverse comparison works");
            }
          }

      # Test set_effect with const char* doesn't cause ambiguous overload (issue #14728)
      - lambda: |-
          auto call = id(test_monochromatic_light).turn_on();
          call.set_effect("None");
          call.perform();

      - light.toggle: test_binary_light
      - light.turn_off: test_rgb_light
      - light.turn_on:
          id: test_rgb_light
          brightness: 100%
          red: 100%
          green: 100%
          blue: 1.0
      - light.control:
          id: test_monochromatic_light
          state: on
      # Test static effect name resolution at codegen time
      - light.turn_on:
          id: test_monochromatic_light
          effect: Strobe
      - light.turn_on:
          id: test_monochromatic_light
          effect: none
      # Test resolving a different effect on the same light
      - light.control:
          id: test_monochromatic_light
          effect: My Flicker
      # Test effect: None (capitalized)
      - light.control:
          id: test_monochromatic_light
          effect: None
      # Test effect lambda with no args (on_boot has empty Ts...)
      - light.turn_on:
          id: test_monochromatic_light
          effect: !lambda 'return "Strobe";'
      # Test effect lambda with non-empty args (repeat passes uint32_t iteration)
      - repeat:
          count: 3
          then:
            - light.turn_on:
                id: test_monochromatic_light
                effect: !lambda 'return iteration > 1 ? "Strobe" : "none";'
      # Cycle through configured effects (skip "None")
      - light.effect.next: test_monochromatic_light
      - light.effect.previous: test_monochromatic_light
      # Cycle through effects including "None"
      - light.effect.next:
          id: test_monochromatic_light
          include_none: true
      - light.effect.previous:
          id: test_monochromatic_light
          include_none: true
      - light.dim_relative:
          id: test_monochromatic_light
          relative_brightness: 5%
          brightness_limits:
            max_brightness: 90%
      - light.dim_relative:
          id: test_monochromatic_light
          relative_brightness: -5%
          transition_length: 250ms
      - light.turn_on:
          id: test_addressable_transition
          brightness: 50%
          red: 100%
          green: 0%
          blue: 0%
          transition_length: 500ms
      - light.turn_on:
          id: test_addressable_transition
          brightness: 100%
          red: 0%
          green: 100%
          blue: 0%
          transition_length: 1s

# Exercise light actions inside a trigger with non-empty Ts (number on_value
# passes float).
number:
  - platform: template
    id: test_number_brightness
    optimistic: true
    min_value: 0
    max_value: 100
    step: 1
    on_value:
      then:
        - light.turn_on:
            id: test_monochromatic_light
            brightness: !lambda "return x / 100.0;"

output:
  - platform: template
    id: light_test_restore_state_keep
    type: binary
    write_action:
      - lambda: ""
  - platform: template
    id: light_test_restore_state_override
    type: binary
    write_action:
      - lambda: ""
  - platform: template
    id: light_test_restore_state_none
    type: binary
    write_action:
      - lambda: ""
  - platform: template
    id: light_test_restore_state_initial
    type: binary
    write_action:
      - lambda: ""
light:
  - platform: binary
    id: test_binary_light
    name: Binary Light
    output: light_test_binary
    restore_mode: RESTORE_AND_ON
    effects:
      - strobe:
    on_state:
      - logger.log: Binary light state changed
  # Test restore_state: all (shorthand for {} -- restore everything, no overrides)
  - platform: binary
    id: test_restore_state_keep
    name: Restore State Keep
    output: light_test_restore_state_keep
    restore_state: all
  # Test restore_state: with explicit overrides
  - platform: binary
    id: test_restore_state_override
    name: Restore State Override
    output: light_test_restore_state_override
    restore_state:
      state: INVERT
      brightness: 50%
  # Test restore_state: none (explicit shorthand for "no restoring at all")
  - platform: binary
    id: test_restore_state_none
    name: Restore State None
    output: light_test_restore_state_none
    restore_state: none
    initial_state:
      state: true
  # Test restore_state: with INITIAL fields (copy initial_state:'s value on restore)
  - platform: binary
    id: test_restore_state_initial
    name: Restore State Initial
    output: light_test_restore_state_initial
    initial_state:
      state: true
    restore_state:
      state: INITIAL
      brightness: INITIAL
  - platform: monochromatic
    id: test_monochromatic_light
    name: Monochromatic Light
    output: test_ledc_1
    gamma_correct: 2.8
    default_transition_length: 2s
    effects:
      - strobe:
      - flicker:
      - flicker:
          name: My Flicker
          alpha: 98%
          intensity: 1.5%
      - lambda:
          name: My Custom Effect
          update_interval: 1s
          lambda: |-
            static int state = 0;
            state += 1;
            if (state == 4)
              state = 0;
            if (initial_run) {
              ESP_LOGD("custom_effect", "Effect %s started", it.get_name().c_str());
            }
      - pulse:
          transition_length: 10s
          update_interval: 20s
          min_brightness: 10%
          max_brightness: 90%
      - pulse:
          name: pulse2
          transition_length:
            on_length: 10s
            off_length: 5s
          update_interval: 15s
          min_brightness: 10%
          max_brightness: 90%
  - platform: rgb
    id: test_rgb_light
    name: RGB Light
    red: test_ledc_1
    green: test_ledc_2
    blue: test_ledc_3
  - platform: rgbw
    id: test_rgbw_light
    name: RGBW Light
    red: test_ledc_1
    green: test_ledc_2
    blue: test_ledc_3
    white: test_ledc_4
    color_interlock: true
  - platform: rgbww
    id: test_rgbww_light
    name: RGBWW Light
    red: test_ledc_1
    green: test_ledc_2
    blue: test_ledc_3
    cold_white: test_ledc_4
    warm_white: test_ledc_5
    cold_white_color_temperature: 153 mireds
    warm_white_color_temperature: 500 mireds
    color_interlock: true
  - platform: rgbct
    id: test_rgbct_light
    name: RGBCT Light
    red: test_ledc_1
    green: test_ledc_2
    blue: test_ledc_3
    color_temperature: test_ledc_4
    white_brightness: test_ledc_5
    cold_white_color_temperature: 153 mireds
    warm_white_color_temperature: 500 mireds
    color_interlock: true
  - platform: cwww
    id: test_cwww_light
    name: CWWW Light
    cold_white: test_ledc_1
    warm_white: test_ledc_2
    cold_white_color_temperature: 153 mireds
    warm_white_color_temperature: 500 mireds
    constant_brightness: true
  - platform: color_temperature
    id: test_color_temperature_light
    name: CT Light
    color_temperature: test_ledc_1
    brightness: test_ledc_2
    cold_white_color_temperature: 153 mireds
    warm_white_color_temperature: 500 mireds
  - platform: rgb
    id: test_rgb_light_initial_state
    name: RGB Light Initial State
    red: test_ledc_1
    green: test_ledc_2
    blue: test_ledc_3
    initial_state:
      color_mode: rgb
      red: 100%
      green: 50%
      blue: 50%
  # Test initial_state: with every templatable field set via !lambda (color_mode is
  # the only field that isn't templatable, so it's the only one left as a literal)
  - platform: rgbww
    id: test_rgbww_light_initial_state_lambda
    name: RGBWW Light Initial State Lambda
    red: test_ledc_1
    green: test_ledc_2
    blue: test_ledc_3
    cold_white: test_ledc_4
    warm_white: test_ledc_5
    cold_white_color_temperature: 153 mireds
    warm_white_color_temperature: 500 mireds
    color_interlock: true
    initial_state:
      state: !lambda "return true;"
      color_mode: rgb_cold_warm_white
      brightness: !lambda "return 0.8;"
      color_brightness: !lambda "return 0.9;"
      red: !lambda "return 1.0;"
      green: !lambda "return 0.5;"
      blue: !lambda "return 0.25;"
      white: !lambda "return 0.3;"
      color_temperature: !lambda "return 300.0;"
      cold_white: !lambda "return 0.6;"
      warm_white: !lambda "return 0.4;"
  # Test StrobeLightEffect with multiple colors
  - platform: monochromatic
    id: test_strobe_multiple
    name: Strobe Multiple Colors
    output: test_ledc_1
    effects:
      - strobe:
          name: Strobe Multi
          colors:
            - state: true
              brightness: 100%
              duration: 500ms
            - state: false
              duration: 250ms
            - state: true
              brightness: 50%
              duration: 500ms
  # Test StrobeLightEffect with transition
  - platform: rgb
    id: test_strobe_transition
    name: Strobe With Transition
    red: test_ledc_1
    green: test_ledc_2
    blue: test_ledc_3
    effects:
      - strobe:
          name: Strobe Transition
          colors:
            - state: true
              red: 100%
              green: 0%
              blue: 0%
              duration: 1s
              transition_length: 500ms
            - state: true
              red: 0%
              green: 100%
              blue: 0%
              duration: 1s
              transition_length: 500ms
  - platform: partition
    id: test_addressable_transition
    name: Addressable Transition Test
    default_transition_length: 1s
    segments:
      - single_light_id: test_rgb_light
