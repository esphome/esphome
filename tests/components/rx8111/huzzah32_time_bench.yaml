# Destructive, dedicated HUZZAH32 + RX8111CE bench only. Keep independent USB
# power attached; disconnect any other EVIN driver before driving GPIO18.
# Changes battery switchover, charging, FOUT and EVIN/INT RTC configuration.
# Flash back original firmware and restore RTC settings after the run.
esphome:
  name: rx8111-time-bench

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: UART0

i2c:
  sda: GPIO23
  scl: GPIO22
  scan: true
  frequency: 100kHz

time:
  - platform: rx8111
    id: rtc
    timezone: UTC
    update_interval: never
    alarm_enabled: false
    timer_enabled: false
    battery_backup: true
    battery_charging: false
    fout_frequency: 1hz
    event_enabled: true
    event_level: high
    evin_filter: 2
    evin_pull: pulldown_500k
    on_event:
      - lambda: |-
          id(event_count)++;
          ESP_LOGI("time_bench", "EVIN callback #%u", id(event_count));

globals:
  - id: event_count
    type: unsigned
    restore_value: no
    initial_value: '0'

binary_sensor:
  - platform: gpio
    id: rtc_int
    internal: true
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true

switch:
  - platform: gpio
    id: evin_driver
    internal: true
    pin: GPIO18
    restore_mode: ALWAYS_OFF

sensor:
  - platform: pulse_counter
    id: fout_counter
    internal: true
    pin: GPIO19
    use_pcnt: true
    update_interval: 5s

interval:
  - interval: 1s
    then:
      - lambda: |-
          static unsigned phase = 0;
          static unsigned ticks = 0;
          static bool complete = false;
          if (complete)
            return;
          constexpr const char *TAG = "time_bench";
          auto fail = [&](const char *why) {
            ESP_LOGE(TAG, "FAIL: %s (phase %u)", why, phase);
            id(evin_driver).turn_off();
            complete = true;
          };
          uint8_t power, extension, control, flags, evin;
          if (!id(rtc).read_byte(0x32, &power) || !id(rtc).read_byte(0x1D, &extension) ||
              !id(rtc).read_byte(0x1F, &control) || !id(rtc).read_byte(0x1E, &flags) ||
              !id(rtc).read_byte(0x2B, &evin)) {
            fail("RTC I2C register read");
            return;
          }
          if (phase == 0) {
            ESP_LOGI(TAG, "DIAGNOSTIC: power=%02X extension=%02X control=%02X flag=%02X evin=%02X",
                     power, extension, control, flags, evin);
            if ((power & 0xC0) != 0x40 || (extension & 0xC0) != 0x80 || (control & 0x04) == 0 ||
                (evin & 0xFC) != 0xD0) {
              fail("backup/charging, 1 Hz FOUT or EVIN interrupt register readback");
              return;
            }
            ESP_LOGI(TAG, "PASS: backup enabled, charging disabled, 1 Hz FOUT selected, EVIN interrupt enabled");
            if ((flags & 0x04) && !id(rtc).clear_event_flag()) {
              fail("clear retained EVF before test");
              return;
            }
            phase = 1;
            ticks = 0;
          } else if (phase == 1) {
            if (++ticks < 12)
              return;
            if (isnan(id(fout_counter).state) || fabsf(id(fout_counter).state - 60.0f) > 18.0f) {
              fail("GPIO19 FOUT pulse counter not near 1 Hz");
              return;
            }
            ESP_LOGI(TAG, "PASS: GPIO19 FOUT measured %.1f pulses/minute", id(fout_counter).state);
            id(evin_driver).turn_on();
            phase = 2;
            ticks = 0;
          } else if (phase == 2 || phase == 4) {
            ESP_LOGI(TAG, "DIAGNOSTIC: phase=%u flag=%02X control=%02X evin=%02X callbacks=%u int=%d",
                     phase, flags, control, evin, id(event_count), id(rtc_int).state);
            if ((flags & 0x04) && id(event_count) == (phase == 2 ? 1U : 2U) && id(rtc_int).state) {
              ESP_LOGI(TAG, "PASS: EVIN event #%u set EVF, asserted /INT and fired callback", id(event_count));
              phase = (phase == 2 ? 3 : 6);
              ticks = 0;
            } else if (++ticks > 8) {
              fail("EVIN flag, callback or /INT assertion missing");
            }
          } else if (phase == 3) {
            if (++ticks < 3)
              return;
            if (id(event_count) != 1 || !id(rtc).clear_event_flag()) {
              fail("latched EVF callback repeated or clear action failed");
              return;
            }
            id(evin_driver).turn_off();
            ESP_LOGI(TAG, "PASS: EVF held without duplicate callbacks; explicitly cleared");
            phase = 5;
            ticks = 0;
          } else if (phase == 5) {
            if (++ticks < 3)
              return;
            if (id(rtc_int).state || (flags & 0x04)) {
              fail("EVF or /INT did not release after acknowledgment");
              return;
            }
            id(evin_driver).turn_on();
            phase = 4;
            ticks = 0;
          } else if (phase == 6) {
            id(evin_driver).turn_off();
            if (!id(rtc).clear_event_flag() || !id(rtc).read_byte(0x1F, &control) ||
                !id(rtc).write_byte(0x1F, control & ~0x04)) {
              fail("EVF/EVIN interrupt cleanup");
              return;
            }
            ESP_LOGI(TAG, "PASS: second EVIN event rearmed; EVF cleared, EVIN interrupt disabled");
            ESP_LOGW(TAG, "DONE: restore original firmware AND RTC configuration/time before production use");
            complete = true;
          }
