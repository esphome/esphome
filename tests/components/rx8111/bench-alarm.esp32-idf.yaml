# Dedicated USB-powered ESP32/RX8111 fixture only. Alters alarm, AF and control.
# Does not write RTC time or battery/charging configuration. On reset reruns the bench.
esphome:
  name: rx8111alarmbench
  on_boot:
    priority: -100
    then:
      - delay: 2s
      - lambda: |-
          auto now = id(rtc).utcnow();
          uint8_t flags = 0, control = 0;
          if (!now.is_valid() || now.year < 2020 || now.year > 2099 ||
              !id(rtc).read_byte(0x1E, &flags) || !id(rtc).read_byte(0x1F, &control)) {
            ESP_LOGE("rtc_bench", "FAIL: RTC time invalid or I2C register read failed; no alarm programmed");
            id(phase) = -1;
            return;
          }
          ESP_LOGI("rtc_bench", "Preflight: UTC=%04d-%02d-%02d %02d:%02d:%02d FLAG=0x%02X CONTROL=0x%02X",
                   now.year, now.month, now.day_of_month, now.hour, now.minute, now.second, flags, control);
          id(saved_control) = control;
          // Preserve unrelated latched flags. Temporarily mask UIE/TIE/EIE so
          // /INT measures AF alone, then restore these enables on completion.
          if (!id(rtc).write_byte(0x1F, control & ~0x34)) {
            ESP_LOGE("rtc_bench", "FAIL: cannot isolate alarm /INT");
            id(phase) = -1;
            return;
          }
          if (!id(rtc).unset_alarm() || !id(rtc).clear_alarm_flag() || !id(rtc).schedule_alarm_in(5)) {
            ESP_LOGE("rtc_bench", "FAIL: initial alarm programming");
            uint8_t restore = id(saved_control);
            id(rtc).write_byte(0x1F, restore);
            id(phase) = -1;
            return;
          }
          id(deadline) = millis() + 12000;
          id(phase) = 1;
          ESP_LOGI("rtc_bench", "Waiting for first 5-second alarm");

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: UART0

i2c:
  sda: GPIO23
  scl: GPIO22
  scan: true

time:
  - platform: rx8111
    id: rtc
    timezone: UTC
    update_interval: never
    alarm_enabled: true
    on_alarm:
      - lambda: id(callbacks) += 1;

binary_sensor:
  - platform: gpio
    id: rtc_int
    internal: true
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true

globals:
  - id: phase
    type: int
    initial_value: '0'
  - id: callbacks
    type: int
    initial_value: '0'
  - id: deadline
    type: uint32_t
    initial_value: '0'
  - id: saved_control
    type: uint8_t
    initial_value: '0'

interval:
  - interval: 200ms
    then:
      - lambda: |-
          if (id(phase) <= 0 || id(phase) > 4) return;
          id(rtc).update();
          uint8_t flags = 0, control = 0;
          if (!id(rtc).read_byte(0x1E, &flags) || !id(rtc).read_byte(0x1F, &control)) {
            ESP_LOGE("rtc_bench", "FAIL: I2C read during test");
            id(rtc).unset_alarm();
            id(rtc).clear_alarm_flag();
            id(rtc).write_byte(0x1F, id(saved_control));
            id(phase) = -1;
            return;
          }
          const bool af = (flags & 0x08) != 0;
          const bool asserted = id(rtc_int).state;
          if (static_cast<int32_t>(millis() - id(deadline)) > 0) {
            ESP_LOGE("rtc_bench", "FAIL: timeout phase=%d AF=%d INT=%d callbacks=%d", id(phase), af, asserted, id(callbacks));
            id(rtc).unset_alarm();
            id(rtc).clear_alarm_flag();
            id(rtc).write_byte(0x1F, id(saved_control));
            id(phase) = -1;
            return;
          }
          switch (id(phase)) {
            case 1:
              if (!af || id(callbacks) != 1) return;
              if (!asserted || !(control & 0x08)) {
                ESP_LOGE("rtc_bench", "FAIL: AF set but /INT or AIE not asserted");
                id(phase) = -1;
                return;
              }
              ESP_LOGI("rtc_bench", "PASS: AF, /INT LOW, and one callback");
              id(deadline) = millis() + 2500;
              id(phase) = 2;
              break;
            case 2:
              if (!af || !asserted || id(callbacks) != 1) {
                ESP_LOGE("rtc_bench", "FAIL: latched AF or deduplicated callback");
                id(phase) = -1;
                return;
              }
              if (static_cast<int32_t>(millis() - id(deadline) + 1500) < 0) return;
              ESP_LOGI("rtc_bench", "PASS: AF stays latched and callback fires only once");
              if (!id(rtc).clear_alarm_flag()) {
                ESP_LOGE("rtc_bench", "FAIL: clear_alarm_flag");
                id(phase) = -1;
                return;
              }
              id(deadline) = millis() + 3000;
              id(phase) = 3;
              break;
            case 3:
              if (af || asserted) return;
              ESP_LOGI("rtc_bench", "PASS: explicit AF clear deasserts /INT");
              if (!id(rtc).schedule_alarm_in(5)) {
                ESP_LOGE("rtc_bench", "FAIL: rearm");
                id(phase) = -1;
                return;
              }
              id(deadline) = millis() + 12000;
              id(phase) = 4;
              break;
            case 4:
              if (!af || id(callbacks) != 2) return;
              if (!asserted) {
                ESP_LOGE("rtc_bench", "FAIL: second event without /INT assertion");
                id(phase) = -1;
                return;
              }
              ESP_LOGI("rtc_bench", "PASS: relative alarm rearms and second event fires");
              if (!id(rtc).unset_alarm() || !id(rtc).clear_alarm_flag() ||
                  !id(rtc).write_byte(0x1F, id(saved_control))) {
                ESP_LOGE("rtc_bench", "FAIL: alarm cleanup");
                id(phase) = -1;
                return;
              }
              id(phase) = 5;
              ESP_LOGI("rtc_bench", "RESULT PASS: alarm hardware; RTC calendar and battery settings untouched");
              break;
          }
