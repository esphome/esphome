packages:
  i2c: !include ../../test_build_components/common/i2c/esp32-idf.yaml
  rx8111: !include common.yaml

time:
  - platform: rx8111
    id: relative_rtc
    alarm_enabled: true
    i2c_id: i2c_bus

esphome:
  name: rx8111relative
  on_boot:
    then:
      - rx8111.schedule_alarm_in:
          id: relative_rtc
          hours: 1
          days: 1
      - rx8111.schedule_alarm_in:
          id: relative_rtc
          seconds: !lambda return uint32_t{60};
      - rx8111.set_alarm:
          id: relative_rtc
          minute: !lambda return uint16_t{15};

esp32:
  board: esp32dev
  framework:
    type: esp-idf
