sensor:
  - platform: lsm6ds3
    name: "lsm6ds3 Temperature"

  - platform: motion
    type: acceleration_x
    name: "Accel X"
    accuracy_decimals: 4
    filters:
      - sliding_window_moving_average:
          window_size: 4
          send_every: 1
  - platform: motion
    type: acceleration_y
    name: "Accel Y"
    accuracy_decimals: 4
  - platform: motion
    type: acceleration_z
    name: "Accel Z"
    accuracy_decimals: 4

    # Gyroscope axes (unit: °/s)
  - platform: motion
    type: gyroscope_x
    name: "Gyro X"
  - platform: motion
    type: gyroscope_y
    name: "Gyro Y"
  - platform: motion
    type: gyroscope_z
    name: "Gyro Z"

  - platform: motion
    type: angular_rate_x
    name: "Angular Rate X"
  - platform: motion
    type: angular_rate_y
    name: "Angular Rate Y"
  - platform: motion
    type: angular_rate_z
    name: "Angular Rate Z"

  - platform: motion
    type: pitch
    name: "Pitch"
  - platform: motion
    type: roll
    name: "Roll"

motion:
  - platform: lsm6ds3
    id: my_lsm6ds3
  # Accelerometer full-scale range: 2G | 4G | 8G | 16G
    accelerometer_range: 4G

    accelerometer_odr: 104HZ

    gyroscope_range: 2000DPS

    gyroscope_odr: 208HZ
    axis_map:
      x: y
      y: x
      z: -z

binary_sensor:
  - platform: motion
    motion_id: my_lsm6ds3
    type: face_up
    name: "LSM6DS3 Face Up"
  - platform: motion
    motion_id: my_lsm6ds3
    type: face_down
    name: "LSM6DS3 Face Down"
  - platform: motion
    motion_id: my_lsm6ds3
    type: free_fall
    name: "LSM6DS3 Free Fall"
  - platform: motion
    motion_id: my_lsm6ds3
    type: moving
    name: "LSM6DS3 Moving"

event:
  - platform: motion
    motion_id: my_lsm6ds3
    name: "LSM6DS3 Shake"
