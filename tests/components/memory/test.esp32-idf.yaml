packages:
  spi: !include ../../test_build_components/common/spi/esp32-idf.yaml

# An image whose pixels are decoded at runtime from a buffer the configuration
# already holds: the platform declares the image, a lambda decides when it is
# filled. A 1x1 grayscale JPEG is enough to exercise the whole path.
display:
  - platform: ili9xxx
    spi_id: spi_bus
    id: memory_image_display
    model: ili9342
    cs_pin: 20
    dc_pin: 13
    reset_pin: 21
    invert_colors: true
    lambda: |-
      it.image(0, 0, id(memory_gray_image));

image:
  - platform: memory
    id: memory_gray_image
    format: JPEG
    type: GRAYSCALE
    resize: 16x16

  - platform: memory
    id: memory_rgb565_image
    format: PNG
    type: RGB565
    resize: 8x8

interval:
  - interval: 60s
    then:
      - lambda: |-
          static const uint8_t JPEG[] = {
              0xFF, 0xD8, 0xFF, 0xDB, 0x00, 0x43, 0x00, 0x08, 0x06, 0x06, 0x07, 0x06, 0x05, 0x08, 0x07, 0x07,
              0x07, 0x09, 0x09, 0x08, 0x0A, 0x0C, 0x14, 0x0D, 0x0C, 0x0B, 0x0B, 0x0C, 0x19, 0x12, 0x13, 0x0F,
              0x14, 0x1D, 0x1A, 0x1F, 0x1E, 0x1D, 0x1A, 0x1C, 0x1C, 0x20, 0x24, 0x2E, 0x27, 0x20, 0x22, 0x2C,
              0x23, 0x1C, 0x1C, 0x28, 0x37, 0x29, 0x2C, 0x30, 0x31, 0x34, 0x34, 0x34, 0x1F, 0x27, 0x39, 0x3D,
              0x38, 0x32, 0x3C, 0x2E, 0x33, 0x34, 0x32, 0xFF, 0xC0, 0x00, 0x0B, 0x08, 0x00, 0x01, 0x00, 0x01,
              0x01, 0x01, 0x11, 0x00, 0xFF, 0xC4, 0x00, 0x14, 0x00, 0x01, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00,
              0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x03, 0xFF, 0xC4, 0x00, 0x14, 0x10, 0x01, 0x00,
              0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0xFF, 0xDA,
              0x00, 0x08, 0x01, 0x01, 0x00, 0x00, 0x3F, 0x00, 0x37, 0xFF, 0xD9,
          };
          auto *img = id(memory_gray_image);
          if (!img->begin_decode(sizeof(JPEG)))
            return;
          if (img->feed_data(const_cast<uint8_t *>(JPEG), sizeof(JPEG)) != (int) sizeof(JPEG))
            return;
          if (img->end_decode())
            ESP_LOGD("memory", "decoded %dx%d", img->get_width(), img->get_height());
