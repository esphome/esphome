sensor:
  # UART mode - PM1006K with all sensors (covers PM1.0, PM2.5, PM10.0 code paths)
  - platform: pm100x_uart
    id: pm100x_uart_sensor
    model: PM1006K
    pm_1_0:
      name: PM1006K UART PM1.0
    pm_2_5:
      name: PM1006K UART PM2.5
    pm_10_0:
      name: PM1006K UART PM10.0

  # PWM mode - PM1003
  - platform: pm100x_pwm
    id: pm100x_pm1003_pwm
    model: PM1003
    pm_2_5:
      name: PM1003 PWM PM2.5
    pwm:
      name: PM1003 PWM Duty Cycle
      pin:
        number: ${pwm_pin_1}
        inverted: true

  # PWM mode - PM1006K
  - platform: pm100x_pwm
    id: pm100x_pm1006k_pwm
    model: PM1006K
    pm_2_5:
      name: PM1006K PWM PM2.5
    pwm:
      name: PM1006K PWM Duty Cycle
      pin:
        number: ${pwm_pin_2}
        inverted: true
