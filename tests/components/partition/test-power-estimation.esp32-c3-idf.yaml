light:
  - platform: esp32_rmt_led_strip
    id: part_leds
    default_transition_length: 500ms
    chipset: ws2812
    num_leds: 256
    channel_colors: GRB
    pin: GPIO2
    power_estimation:
      ma_per_led_red: 16.0
      ma_per_led_green: 11.0
      ma_per_led_blue: 15.0
      idle_ma_per_led: 1.0
      max_current_ma: 100.0
  - platform: partition
    name: Partition Light
    segments:
      - id: part_leds
        from: 0
        to: 0
      - id: part_leds
        from: 1
        to: 10
      - id: part_leds
        from: 20
        to: 25
      - single_light_id: part_leds
