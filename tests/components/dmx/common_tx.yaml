# Shared DMX TX configuration

dmx:
  id: dmx_bus
  mode: tx
  uart_num: ${dmx_uart_num}
  tx_pin: ${dmx_tx_pin}
  rx_pin: ${dmx_rx_pin}
  tx_interval: ${dmx_tx_interval}

# DMX uitgangs-Number
number:
  - platform: dmx
    dmx_id: dmx_bus
    channels:
      - channel: 7
        name: "DMX Out 7"

# DMX Lights
light:
  - platform: dmx
    name: "DMX Dimmer"
    dmx_id: dmx_bus
    first_channel: 30
    type: dimmer

  - platform: dmx
    name: "DMX RGB"
    dmx_id: dmx_bus
    first_channel: 50
    type: rgb

  - platform: dmx
    name: "DMX RGBW"
    dmx_id: dmx_bus
    first_channel: 60
    type: rgbw
