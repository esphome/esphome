wifi:
  ssid: MySSID
  password: password1

udp:
  - id: packet_interface_udp
  - id: packet_interface_udp_peer
    port: 18512
    addresses: ["192.168.1.60"]

packet_interface:
  - platform: uart
    id: packet_interface_uart
    max_packet_size: 256
    addressing:
      address: 0x0001
      peers:
        - id: packet_interface_peer_a
          destination: 0x0002
          encryption:
            key: Johnny Cash
            rolling_code_enable: true
          reliability:
            timeout: 300ms
            max_queue_length: 3
            max_retries: 4
          session:
            keep_alive: 5s
            timeout: 12s
            binary_sensor:
              name: Peer A session
        - id: packet_interface_peer_b
          destination: 0x0003
          reliability:
            max_queue_length: 5
          fragmentation:
            max_packet_size: 1024
          session:
        - id: packet_interface_bus
          destination: broadcast
  - platform: udp
    id: packet_interface_network
    udp_id: packet_interface_udp
    addressing:
      address: 0x0001
      destination: 0x0002
    encryption: Johnny Cash
    reliability:
    fragmentation:
    session:
  # Sends to one unicast address, so the link provides addressing
  - platform: udp
    id: packet_interface_udp_peer_link
    udp_id: packet_interface_udp_peer
    reliability:
    session:

sensor:
  - platform: template
    id: packet_interface_sensor
    lambda: return 1.0;

packet_transport:
  - platform: packet_interface
    packet_interface: packet_interface_peer_a
    sensors:
      - packet_interface_sensor
  - platform: packet_interface
    packet_interface: packet_interface_network
    sensors:
      - packet_interface_sensor
  - platform: packet_interface
    packet_interface: packet_interface_udp_peer_link
    sensors:
      - packet_interface_sensor
