sensor:
  - platform: ltr501
    i2c_id: i2c_bus
    address: 0x23
    type: ALS_PS
    gain: 1X
    integration_time: 100ms
    ambient_light: "Ambient light"
    ps_counts: "Proximity counts"
    on_ps_high_threshold:
      - logger.log: PS high
    on_ps_low_threshold:
      - logger.log: PS low
