sensor:
  - platform: ina3221
    i2c_id: i2c_bus
    address: 0x40
    channel_1:
      shunt_resistance: 0.1 ohm
      current:
        name: INA3221 Channel 1 Current
      power:
        name: INA3221 Channel 1 Power
      bus_voltage:
        name: INA3221 Channel 1 Bus Voltage
      shunt_voltage:
        name: INA3221 Channel 1 Shunt Voltage
    update_interval: 15s
  - platform: ina3221
    i2c_id: i2c_bus
    address: 0x41
    continuous_mode: false
    adc_averaging: 4
    adc_time:
      bus_voltage: 2116us
      shunt_voltage: 1.1ms
    channel_1:
      shunt_resistance: 0.05 ohm
      current:
        name: INA3221 B Channel 1 Current
      warning_current_limit: 1A
      critical_current_limit: 2A
    channel_2:
      bus_voltage:
        name: INA3221 B Channel 2 Bus Voltage
    channel_3:
      power:
        name: INA3221 B Channel 3 Power
    sum_shunt_voltage:
      name: INA3221 B Sum Shunt Voltage
    sum_current:
      name: INA3221 B Sum Current
    sum_power:
      name: INA3221 B Sum Power
    update_interval: 15s
