packages:
  spi: !include ../../test_build_components/common/spi/esp32-idf.yaml

sx127x:
  # Above the 64 byte FIFO: unlimited length packet format, drained through DIO1
  - id: transceiver_long_fixed
    cs_pin: GPIO5
    rst_pin: GPIO4
    dio0_pin: GPIO16
    dio1_pin: GPIO17
    frequency: 433920000
    modulation: FSK
    bitsync: true
    packet_mode: true
    payload_length: 1024
    on_packet:
      then:
        - lambda: 'ESP_LOGD("sx127x", "long packet %u bytes", x.size());'

  # Length taken from the packet header; dio0_pin is not needed for long packets
  - id: transceiver_long_lambda
    cs_pin: GPIO25
    rst_pin: GPIO26
    dio1_pin: GPIO14
    frequency: 868950000
    modulation: FSK
    bitsync: true
    packet_mode: true
    payload_length: !lambda |-
      if (x.size() < 3) return 0;
      if (x[0] != 0x54) return -1;
      return x[2] + 12;
    on_packet:
      then:
        - lambda: 'ESP_LOGD("sx127x", "lambda packet %u bytes rssi %.1f", x.size(), rssi);'
