tcp_uart:
  - id: tcp_uart_1
    host: 127.0.0.1
    port: 44502
    connected:
      name: TCP UART Connected

interval:
  - interval: 60s
    then:
      - lambda: |-
          uint8_t byte;
          if (id(tcp_uart_1).available() && id(tcp_uart_1).read_byte(&byte)) {
            id(tcp_uart_1).write_byte(byte);
          }
