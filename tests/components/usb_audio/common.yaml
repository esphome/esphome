usb_audio:
  id: usb_audio_id

microphone:
  - platform: usb_audio
    id: usb_mic
    usb_audio_id: usb_audio_id
    sample_rate: 48000
    bits_per_sample: 16bit
    num_channels: 2
    buffer_size: 6400

speaker:
  - platform: usb_audio
    id: usb_speaker
    usb_audio_id: usb_audio_id
    sample_rate: 48000
    bits_per_sample: 16bit
    num_channels: 2
    buffer_size: 6400
    write_timeout: 20ms
