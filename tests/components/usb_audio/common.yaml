usb_audio:
  id: usb_audio_id
  connect_timeout: 2s
  microphone_buffer_size: 6400
  speaker_buffer_size: 6400

microphone:
  - platform: usb_audio
    id: usb_mic
    usb_audio_id: usb_audio_id
    sample_rate: 48000
    bits_per_sample: 16bit
    num_channels: 2
    channels: [0]

speaker:
  - platform: usb_audio
    id: usb_speaker
    usb_audio_id: usb_audio_id
    sample_rate: 48000
    bits_per_sample: 16bit
    num_channels: 2
    write_timeout: 20ms
