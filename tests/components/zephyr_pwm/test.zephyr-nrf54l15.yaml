output:
  - platform: zephyr_pwm
    id: pwm_output_1
    # Nordic's own "P<port>.<pin>" nomenclature, same pin as a flat "2".
    pin: P0.02
  - platform: zephyr_pwm
    id: pwm_output_2
    pin:
      # gpio0 on this SoC only has 7 pins (ngpios = 7 in nrf54l_05_10_15.dtsi) --
      # unlike nRF52840's uniform 32-pin ports, so a flat pin number here must stay
      # within that real range.
      number: P0.05
      inverted: true
