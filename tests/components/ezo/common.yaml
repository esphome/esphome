sensor:
  - platform: ezo
    i2c_id: i2c_bus
    id: ph_ezo
    address: 99
    unit_of_measurement: pH
    on_custom:
      - then:
          - logger.log:
              format: "custom %s"
              args: [x.c_str()]
          - lambda: |-
              if (x == "?L,1") {
                ESP_LOGD("ezo_test", "led on, %u bytes", (unsigned) x.size());
              }
      - then:
          - delay: 1s
          - logger.log:
              format: "custom later %s"
              args: [x.c_str()]
    on_calibration:
      - logger.log: calibration
    on_slope:
      - logger.log:
          format: "slope %s"
          args: [x.c_str()]
    on_t:
      - logger.log: temperature compensation
    on_device_information:
      - logger.log: device information
    on_led:
      - logger.log: led
