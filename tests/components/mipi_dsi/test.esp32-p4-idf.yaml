packages:
  i2c: !include ../../test_build_components/common/i2c/esp32-p4-idf.yaml

# Select the SDK only in the canonical fixture, keeping one build tree per gate.
esp32:
  framework:
    version: !env_var MIPI_TEST_IDF_VERSION recommended

esp_ldo:
  - id: ldo_id
    channel: 3
    voltage: 2.5V

display:
  - platform: mipi_dsi
    id: mipi_panel
    model: JC1060P470
    enable_pin: GPIO22

#light:
  #- platform: mipi_dsi
    #id: backlight_id

psram:

esphome:
  includes:
    - owned_api.h
  on_boot:
    priority: -100
    then:
      - lambda: esphome::mipi_dsi::testing::exercise_owned_api(*id(mipi_panel));
