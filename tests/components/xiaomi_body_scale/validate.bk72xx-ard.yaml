# Config-only: the CI bk72xx board cannot compile the BLE 5.x tracker
bk72xx_ble_tracker:
  id: ble_tracker_hub

sensor:
  # Explicit ble_hub_id: pins the neutral binding as a declared key.
  - platform: xiaomi_body_scale
    ble_hub_id: ble_tracker_hub
    mac_address: "AA:BB:CC:DD:EE:FF"
    bindkey: "00112233445566778899aabbccddeeff"
    weight:
      name: "Scale Weight"
    impedance_low:
      name: "Scale Impedance Low"
    impedance_high:
      name: "Scale Impedance High"
    heart_rate:
      name: "Scale Heart Rate"
    profile_id:
      name: "Scale Profile ID"
    stabilized:
      name: "Scale Stabilized"
  # No ble_hub_id: exercises the generated binding real configs use.
  - platform: xiaomi_body_scale
    mac_address: "AA:BB:CC:DD:EE:00"
    bindkey: "ffeeddccbbaa99887766554433221100"
    weight:
      name: "Second Scale Weight"
