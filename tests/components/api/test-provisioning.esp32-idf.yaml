# Exercises the EN18031 provisioning window driven by the core `esphome: provisioning:`
# block: api registers as a provisioning source (encryption enabled, no key), the
# on_timeout automation, and the wifi + esp32_improv cross-component guards that
# suppress reboots / refuse provisioning while the window is open. (improv_serial is
# intentionally NOT gated - it requires physical access.)
esphome:
  provisioning:
    timeout: 1min
    on_timeout:
      then:
        - logger.log: "Provisioning window expired"

api:
  encryption:

wifi:
  ssid: MySSID
  password: password1

improv_serial:

binary_sensor:
  - platform: gpio
    pin: 0
    id: io0_button

esp32_improv:
  authorizer: io0_button
