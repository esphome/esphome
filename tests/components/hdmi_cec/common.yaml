hdmi_cec:
  id: cec
  pin: ${cec_pin}  # HDMI pin 13, with HDMI pin 17 as ground
  address: 0x5
  promiscuous_mode: true
  on_message:
    - opcode: 0x8F  # Give Device Power Status
      then:
        - hdmi_cec.send:
            destination: !lambda return source;
            data: [0x90, 0x01]  # Report Power Status: standby
    - opcode: 0x8C  # Give Device Vendor ID
      then:
        - lambda: |-
            id(cec).send(0xf, {0x87, 0x00, 0x09, 0xb0});
    - data: [0x44, 0x41]  # User Control Pressed: Volume Up
      then:
        - logger.log: "HDMI-CEC Volume Up"
