esphome:
  # Only so the action is compiled. Its place in a real configuration is the ota on_begin trigger.
  on_boot:
    then:
      - hoermann_hcp.announce_pause: hoermann_hcp_hub

hoermann_hcp:
  id: hoermann_hcp_hub
  modbus_id: modbus_server_bus

cover:
  - platform: hoermann_hcp
    name: Garage Door
    device_class: garage

binary_sensor:
  - platform: hoermann_hcp
    is_connected:
      name: Garage Connected

button:
  - platform: hoermann_hcp
    vent:
      name: Garage Vent
    half_open:
      name: Garage Half Open

light:
  - platform: hoermann_hcp
    name: Garage Light
