packages:
  i2c: !include ../../test_build_components/common/i2c/esp32-idf.yaml

vl6180x:
  - id: vl6180x_near
    i2c_id: i2c_bus
    address: 0x30
    enable_pin: GPIO4
  - id: vl6180x_far
    i2c_id: i2c_bus
    address: 0x31
    enable_pin: GPIO13

sensor:
  - platform: vl6180x
    vl6180x_id: vl6180x_near
    range:
      name: Near Distance
      scaler: 3
  - platform: vl6180x
    vl6180x_id: vl6180x_far
    lux:
      name: Far Illuminance
      gain: 40
