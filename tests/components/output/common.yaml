esphome:
  on_boot:
    then:
      - output.turn_off: output_light_output_1
      - output.turn_on: output_light_output_1
      - output.set_level:
          id: output_light_output_1
          level: 50%
      - output.set_level:
          id: output_light_output_1
          level: !lambda return 0.25f;
      - output.set_min_power:
          id: output_light_output_1
          min_power: 20%
      - output.set_max_power:
          id: output_light_output_1
          max_power: 80%
      - output.set_min_power:
          id: output_light_output_1
          min_power: !lambda return 0.1f;
      - output.set_max_power:
          id: output_light_output_1
          max_power: !lambda return 0.9f;

output:
  - platform: ${output_platform}
    id: output_light_output_1
    pin: ${pin}

switch:
  - platform: output
    name: Output Switch
    output: output_light_output_1

button:
  - platform: output
    name: Output Button
    output: output_light_output_1
    duration: 500ms
