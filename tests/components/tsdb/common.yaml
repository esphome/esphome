# Component-only configuration: tsdb brings its own LittleFS partition.
tsdb:
  id: tsdb_test
  time_id: tsdb_time
  file: history.tsdb
  on_missing: sentinel
  columns:
    - sensor: tsdb_temperature
      name: temperature
      scale_factor: 10.0
    - sensor: tsdb_humidity
      name: humidity
      scale_factor: 10.0
      offset: 0.0
  errors_sensor: tsdb_errors

sensor:
  - platform: template
    id: tsdb_temperature
    name: TSDB temperature
    lambda: return 21.4f;
    update_interval: 60s
  - platform: template
    id: tsdb_humidity
    name: TSDB humidity
    lambda: return 48.0f;
    update_interval: 60s
  - platform: template
    id: tsdb_errors
    name: TSDB errors
    lambda: return 0.0f;
    update_interval: 60s

time:
  - platform: sntp
    id: tsdb_time
    timezone: UTC
