# Component-only configuration: tsdb brings its own LittleFS partition.
# sntp needs the network stack; the database itself does not.
wifi:
  ssid: MySSID
  password: password1

tsdb:
  id: tsdb_test
  time_id: tsdb_time
  file: history.tsdb
  on_missing: sentinel
  recreate_on_schema_change: true
  paged_allocation: true
  page_size: 4KB
  dump_rows: 120
  columns:
    - sensor: tsdb_temperature
      name: temperature
      scale_factor: 10.0
    - sensor: tsdb_humidity
      name: humidity
      scale_factor: 10.0
      offset: 0.0

sensor:
  - platform: tsdb
    tsdb_id: tsdb_test
    records:
      name: TSDB records
    used:
      name: TSDB used
    free:
      name: TSDB free
    oldest_age:
      name: TSDB oldest record age
    newest_age:
      name: TSDB newest record age
    evictions:
      name: TSDB evictions
    errors:
      name: TSDB errors
    columns:
      - column: temperature
        average:
          name: TSDB temperature average
        min:
          name: TSDB temperature min
        max:
          name: TSDB temperature max
  - platform: template
    id: tsdb_temperature
    name: TSDB temperature
    lambda: return 21.4f;
    update_interval: 60s
  - platform: template
    id: tsdb_humidity
    name: TSDB humidity
    lambda: return 48.0f;
    update_interval: 60s

text_sensor:
  - platform: tsdb
    tsdb_id: tsdb_test
    log:
      name: TSDB log

time:
  - platform: sntp
    id: tsdb_time
    timezone: UTC

# Exercise the tsdb actions; the interval is long enough never to fire.
interval:
  - interval: 24h
    then:
      - tsdb.flush:
          id: tsdb_test
      - tsdb.dump:
          id: tsdb_test
      - tsdb.clear:
          id: tsdb_test
