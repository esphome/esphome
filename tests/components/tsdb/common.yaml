# Component-only configuration: tsdb brings its own LittleFS partition.
# sntp needs the network stack; the database itself does not.
wifi:
  ssid: MySSID
  password: password1

tsdb:
  id: tsdb_test
  time_id: tsdb_time
  file: history.tsdb
  on_missing: sentinel
  recreate_on_schema_change: true
  paged_allocation: true
  page_size: 4KB
  dump_rows: 120
  columns:
    - sensor: tsdb_temperature
      name: temperature
      scale_factor: 10.0
      average_sensor:
        name: TSDB temperature average
      min_sensor:
        name: TSDB temperature min
      max_sensor:
        name: TSDB temperature max
    - sensor: tsdb_humidity
      name: humidity
      scale_factor: 10.0
      offset: 0.0
  records_sensor:
    name: TSDB records
  used_sensor:
    name: TSDB used
  free_sensor:
    name: TSDB free
  oldest_age_sensor:
    name: TSDB oldest record age
  newest_age_sensor:
    name: TSDB newest record age
  evictions_sensor:
    name: TSDB evictions
  errors_sensor:
    name: TSDB errors
  log_sensor:
    name: TSDB log

sensor:
  - platform: template
    id: tsdb_temperature
    name: TSDB temperature
    lambda: return 21.4f;
    update_interval: 60s
  - platform: template
    id: tsdb_humidity
    name: TSDB humidity
    lambda: return 48.0f;
    update_interval: 60s

time:
  - platform: sntp
    id: tsdb_time
    timezone: UTC

# Exercise the tsdb actions; the interval is long enough never to fire.
interval:
  - interval: 24h
    then:
      - tsdb.flush:
          id: tsdb_test
      - tsdb.dump:
          id: tsdb_test
      - tsdb.clear:
          id: tsdb_test
