# Config-only: non-default sizes, page allocator, clock off.
# sntp needs the network stack; nothing is flashed here.
wifi:
  ssid: MySSID
  password: password1

tsdb:
  id: tsdb_validate
  file: events.tsdb
  time_id: tsdb_validate_time
  partition_size: 1MB
  max_file_size: 768KB
  min_free_bytes: 64KB
  index_stride: 190
  buffer_pool_size: 8KB
  memory: internal
  paged_allocation: true
  page_size: 4KB
  sync_interval: 0s
  require_time: false
  on_missing: hold
  update_interval: 30s
  aggregate_window: 15min
  aggregate_interval: 60s
  dump_rows: 120
  columns:
    - sensor: tsdb_validate_value
      name: value
      scale_factor: 100.0
      offset: -40.0
      average_sensor:
        name: TSDB validate average
      min_sensor:
        name: TSDB validate min
      max_sensor:
        name: TSDB validate max
  records_sensor:
    name: TSDB validate records
  used_sensor:
    name: TSDB validate used
  free_sensor:
    name: TSDB validate free
  oldest_age_sensor:
    name: TSDB validate oldest age
  newest_age_sensor:
    name: TSDB validate newest age
  evictions_sensor:
    name: TSDB validate evictions
  log_sensor:
    name: TSDB validate log

sensor:
  - platform: tsdb
    tsdb_id: tsdb_validate
    errors:
      name: TSDB validate errors
  - platform: template
    id: tsdb_validate_value
    name: TSDB validate value
    lambda: return 21.4f;
    update_interval: 60s

time:
  - platform: sntp
    id: tsdb_validate_time
    timezone: UTC
