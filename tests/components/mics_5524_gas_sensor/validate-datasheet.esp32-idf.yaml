# Config-only test: the datasheet conversion model and the wiring this component can
# own itself (`pin:` creates the internal `adc` sensor, `voltage_divider:` brings the
# 5 V of the breakout down to what the ADC input tolerates).
sensor:
  - platform: mics_5524_gas_sensor
    id: mics_5524_dat
    pin: GPIO34
    voltage_divider:
      r1: 10000
      r2: 20000
    adc_input_max: 3.34
    adc_attenuation: 12db
    conversion: datasheet
    r0: 10.0
    rl: 10.0
    enable_pin: GPIO25
    ratio_sensor: mics_5524_dat_ratio
    rs_sensor: mics_5524_dat_rs
    voltage_sensor: mics_5524_dat_volts
    carbon_monoxide:
      id: mics_5524_dat_co
      name: MiCS-5524 CO (datasheet)
      max_ppm: 2000.0
    hydrogen:
      name: MiCS-5524 H2 (fit)
      coefficient_a: 6.3
      coefficient_b: -1.1

  - platform: template
    id: mics_5524_dat_ratio
    name: MiCS-5524 ratio
  - platform: template
    id: mics_5524_dat_rs
    name: MiCS-5524 RS
  - platform: template
    id: mics_5524_dat_volts
    name: MiCS-5524 volts
