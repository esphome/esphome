# Config-only test: the external voltage sampler path, the datasheet conversion
# and the optional diagnostics/control entities.
sensor:
  - platform: adc
    id: mics_5524_adc
    name: MiCS-5524 AO
    pin: GPIO35

  - platform: mics_5524_gas_sensor
    id: mics_5524_co
    name: MiCS-5524 CO
    gas: carbon monoxide
    conversion: datasheet
    voltage: mics_5524_adc
    voltage_multiplier: 1.5
    adc_input_max: 3.4
    r0: 100.0
    rl: 10.0
    coefficient_a: 6.3
    coefficient_b: -1.1
    min_ppm: 1.0
    max_ppm: 1000.0
    vcc: 5.0
    enable_pin: GPIO4
    sample_count: 2
    sample_interval: 50ms
    warmup_time: 30s
    ratio_sensor: mics_5524_adc
    rs_sensor: mics_5524_adc
    voltage_sensor: mics_5524_adc
    log_sensor: mics_5524_log

text_sensor:
  - platform: template
    id: mics_5524_log
    name: MiCS-5524 log
    internal: true
