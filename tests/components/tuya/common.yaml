wifi:
  ssid: MySSID
  password: password1

tuya:
  status_pin:
    number: ${status_pin}
    inverted: true
  on_datapoint_update:
    - sensor_datapoint: 6
      datapoint_type: raw
      then:
        - logger.log:
            format: "Datapoint 6 updated, %u bytes"
            args: [x.size()]
    - sensor_datapoint: 1
      then:
        - logger.log:
            format: "Datapoint %u updated"
            args: [x.id]
    - sensor_datapoint: 1
      datapoint_type: bool
      then:
        - logger.log:
            format: "Datapoint 1 is %s"
            args: ['x ? "on" : "off"']
    - sensor_datapoint: 3
      datapoint_type: int
      then:
        - logger.log:
            format: "Datapoint 3 is %d"
            args: [x]
    - sensor_datapoint: 3
      datapoint_type: uint
      then:
        - logger.log:
            format: "Datapoint 3 is %u"
            args: [x]
    - sensor_datapoint: 7
      datapoint_type: string
      then:
        - logger.log:
            format: "Datapoint 7 is %s"
            args: [x.c_str()]
    - sensor_datapoint: 8
      datapoint_type: enum
      then:
        - logger.log:
            format: "Datapoint 8 is %u"
            args: [x]
    - sensor_datapoint: 9
      datapoint_type: bitmask
      then:
        - logger.log:
            format: "Datapoint 9 is %u"
            args: [x]

binary_sensor:
  - platform: tuya
    id: tuya_binary_sensor
    sensor_datapoint: 1

climate:
  - platform: tuya
    id: tuya_climate
    switch_datapoint: 1
    target_temperature_datapoint: 3
    current_temperature_multiplier: 0.5
    target_temperature_multiplier: 0.5
    reports_fahrenheit: true

cover:
  - platform: tuya
    id: tuya_cover
    position_datapoint: 2

light:
  - platform: tuya
    id: tuya_light
    switch_datapoint: 1
    dimmer_datapoint: 2
    min_value_datapoint: 3
    color_temperature_datapoint: 4
    color_datapoint: 5
    min_value: 1
    max_value: 100
    cold_white_color_temperature: 153 mireds
    warm_white_color_temperature: 500 mireds
    gamma_correct: 1
    color_type: RGB
    color_type_lowercase: true

number:
  - platform: tuya
    id: tuya_number
    number_datapoint: 102
    min_value: 0
    max_value: 17
    step: 1

select:
  - platform: tuya
    id: tuya_select_enum
    enum_datapoint: 42
    options:
      0: Internal
      1: Floor
      2: Both
  - platform: tuya
    id: tuya_select_int
    int_datapoint: 43
    options:
      0: Internal
      1: Floor
      2: Both

sensor:
  - platform: tuya
    id: tuya_sensor
    sensor_datapoint: 1

switch:
  - platform: tuya
    id: tuya_switch
    switch_datapoint: 1

water_heater:
  - platform: tuya
    id: tuya_water_heater
    name: Tuya Water Heater
    switch_datapoint: 1
    current_temperature_datapoint: 3
    target_temperature_datapoint: 2
    current_temperature_multiplier: 0.5
    target_temperature_multiplier: 0.5
    mode_datapoint: 4
    eco_value: 0
    electric_value: 2
    supported_modes:
      - "OFF"
      - ECO
      - ELECTRIC
    visual:
      min_temperature: 30
      max_temperature: 75
      target_temperature_step: 1
