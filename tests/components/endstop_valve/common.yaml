binary_sensor:
  - platform: template
    id: bin1
    lambda: |-
      return millis() > 10000;
  - platform: template
    id: bin2
    lambda: |-
      return millis() > 20000;

switch:
  - platform: template
    id: template_switch1
    optimistic: true
  - platform: template
    id: template_switch2
    optimistic: true

valve:
  - platform: endstop_valve
    id: endstop_valve_test
    name: Endstop Valve
    stop_action:
      - switch.turn_on: template_switch1
    open_endstop: bin1
    open_action:
      - switch.turn_on: template_switch1
    open_duration: 5min
    close_endstop: bin2
    close_action:
      - switch.turn_on: template_switch2
    close_duration: 4.5min
    max_duration: 10min
