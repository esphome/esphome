light:
  - platform: esp32_rmt_led_strip
    id: led_strip1
    pin: ${pin1}
    num_leds: 60
    channel_map: "G,R,B"
    chipset: ws2812
  - platform: esp32_rmt_led_strip
    id: led_strip2
    pin: ${pin2}
    num_leds: 60
    channel_map: "G,R,B"
    bit0_high: 100us
    bit0_low: 100us
    bit1_high: 100us
    bit1_low: 100us
  - platform: esp32_rmt_led_strip
    id: led_strip3
    pin: ${pin3}
    num_leds: 60
    channel_map: "G,R,B,WW,CW"
    chipset: ws2805
    min_mireds: 137.
    max_mireds: 500.
