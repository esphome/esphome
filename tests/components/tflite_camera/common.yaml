# The camera comes from the shared i2c_camera package included by
# test.esp32-idf.yaml. model.tflite is a tiny fixture committed next to this
# file; the pipeline takes the decoded frame size from the decoder at run time.
tflite_camera:
  - id: test_camera_model
    camera_id: test_camera
    model: "../../components/tflite_camera/model.tflite"
    input_width: 32
    input_height: 20
    input_channels: 3
    rotation: 0
    min_interval: 1s
    on_result:
      - lambda: |-
          ESP_LOGI("tflite_camera", "inference finished");
