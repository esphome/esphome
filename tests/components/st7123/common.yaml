display:
  - platform: ssd1306_i2c
    i2c_id: i2c_bus
    id: display_0
    model: SSD1306_128X64
    reset_pin: ${display_reset_pin}
    pages:
      - id: page_0
        lambda: |-
          it.rectangle(0, 0, it.get_width(), it.get_height());

touchscreen:
  - platform: st7123
    i2c_id: i2c_bus
    id: touch_0
    display: display_0
    interrupt_pin: ${interrupt_pin}
    reset_pin: ${reset_pin}

binary_sensor:
  - platform: st7123
    id: key_0
    index: 0
