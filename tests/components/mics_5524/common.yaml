sensor:
  - platform: adc
    id: mics_5524_adc
    name: MiCS-5524 AO
    pin: ${mics_pin}

  - platform: mics_5524
    id: mics_5524_module
    # A 10k/20k divider brings the 5 V output down to 3.33 V on the pin; x1.5 scales it back.
    voltage: mics_5524_adc
    voltage_multiplier: 1.5
    sample_count: 3
    warmup_time: 1s
    calibration:
      delay: 5s
      sample_count: 3
      sample_interval: 20ms
    # rs_sensor: only exists in the datasheet model.
    voltage_sensor:
      name: MiCS-5524 volts
    ratio_sensor:
      name: MiCS-5524 ratio
    carbon_monoxide:
      name: MiCS-5524 CO
      max_ppm: 500.0
    hydrogen:
      name: MiCS-5524 H2

button:
  - platform: template
    name: MiCS-5524 Calibrate
    on_press:
      - mics_5524.request_calibration: mics_5524_module
