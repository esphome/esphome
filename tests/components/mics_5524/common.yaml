sensor:
  - platform: adc
    id: mics_5524_adc
    name: MiCS-5524 AO
    pin: ${mics_pin}

  - platform: mics_5524
    id: mics_5524_module
    # 10k/20k divider: the 5 V breakout's 3.33 V stays under the ADC limit.
    voltage: mics_5524_adc
    voltage_multiplier: 1.5
    sample_count: 3
    warmup_time: 1s
    calibration:
      delay: 5s
      sample_count: 3
      sample_interval: 20ms
    carbon_monoxide:
      name: MiCS-5524 CO
      max_ppm: 500.0
    hydrogen:
      name: MiCS-5524 H2
