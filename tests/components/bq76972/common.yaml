bq76972:
  id: bms
  i2c_id: i2c_bus
  address: 0x08
  crc_enabled: true
  reg_disabled: true
  update_interval: 10s

button:
  - platform: template
    name: "Program BQ I2C Address"
    on_press:
      - bq76972.program_i2c_address:
          id: bms
          address: 0x09
      - bq76972.program_i2c_address: !lambda "return 0x08;"
      - bq76972.program_i2c_address:
          id: bms
          address: !lambda return 0x0A;

sensor:
  - platform: bq76972
    bq76972_id: bms
    stack_voltage:
      name: "Pack Total Voltage"
    internal_temperature:
      name: "Temperature - Internal"
    ts1_temperature:
      name: "Temperature - Pin TS1"
    ts2_temperature:
      name: "Temperature - Pin TS2"
    ts3_temperature:
      name: "Temperature - Pin TS3"
    hdq_temperature:
      name: "Temperature - Pin HDQ"
    cell_1_voltage:
      name: "Cell 1 Voltage"
    cell_2_voltage:
      name: "Cell 2 Voltage"
    cell_3_voltage:
      name: "Cell 3 Voltage"
    cell_4_voltage:
      name: "Cell 4 Voltage"
    cell_5_voltage:
      name: "Cell 5 Voltage"
    cell_6_voltage:
      name: "Cell 6 Voltage"
    cell_7_voltage:
      name: "Cell 7 Voltage"
    cell_8_voltage:
      name: "Cell 8 Voltage"
    cell_9_voltage:
      name: "Cell 9 Voltage"
    cell_10_voltage:
      name: "Cell 10 Voltage"
    cell_11_voltage:
      name: "Cell 11 Voltage"
    cell_12_voltage:
      name: "Cell 12 Voltage"
    cell_13_voltage:
      name: "Cell 13 Voltage"
    cell_14_voltage:
      name: "Cell 14 Voltage"
    cell_15_voltage:
      name: "Cell 15 Voltage"
    cell_16_voltage:
      name: "Cell 16 Voltage"
