# Config-only fixture: the schema paths the compile fixture does not need - an
# external voltage sampler instead of `pin:`, the mqdatascience coefficient
# dataset with the scaled clamp, the compensation opt-out, a sensor type without
# a correction model and a type without built-in coefficients (a/b required).
sensor:
  - platform: adc
    id: mq_validate_adc
    name: ADC voltage
    pin: GPIO35
    attenuation: 12db
    update_interval: 60s

  - platform: template
    id: mq_validate_air_temperature
    name: Air temperature
    update_interval: 60s

  - platform: template
    id: mq_validate_air_humidity
    name: Air humidity
    unit_of_measurement: "%"
    update_interval: 60s

  # Type and gas names are accepted in the YAML spelling, R0 is pinned (no
  # calibration) and the compensation is switched off explicitly.
  - platform: mq_gas_sensors
    id: mq_validate_sampler
    name: MQ-8 on a voltage sampler
    sensor_type: mq-8
    gas: h2
    voltage: mq_validate_adc
    divider:
      r1: 10.0
      r2: 20.0
    adc_input_max: 3.34
    r0: 9.5
    ratio_in_clean_air: 70.0
    ratio_mode: r0_rs
    correction_mode: none
    samples: 4
    sample_interval: 50ms
    log_ppm: true
    temperature: mq_validate_air_temperature
    humidity: mq_validate_air_humidity

  # The MQDataScience dataset (inverse regression) with the scaled clamp.
  - platform: mq_gas_sensors
    id: mq_validate_curve
    name: MQ-8 with the mqdatascience curve
    sensor_type: MQ-8
    gas: H2
    voltage: mq_validate_adc
    voltage_multiplier: 1.5
    curve: mqdatascience
    correction_clamp: scaled
    max_ppm: 20000.0
    r0: 9.5
    temperature: mq_validate_air_temperature
    humidity: mq_validate_air_humidity

  # No correction model for the MQ-9: the linked sensors are ignored (warning).
  - platform: mq_gas_sensors
    id: mq_validate_mq9
    name: MQ-9
    sensor_type: MQ-9
    gas: co
    voltage: mq_validate_adc
    voltage_multiplier: 1.5
    temperature: mq_validate_air_temperature
    humidity: mq_validate_air_humidity

  # No built-in coefficients: a/b must come from the YAML, plus the ADC limits of
  # an external sampler and a bounded calibration window.
  - platform: mq_gas_sensors
    id: mq_validate_mq136
    name: MQ-136
    sensor_type: MQ-136
    voltage: mq_validate_adc
    voltage_multiplier: 1.5
    a: 36.0
    b: -2.0
    regression_method: linear
    min_ppm: 1.0
    max_ppm: 200.0
    correction_factor: 0.5
    adc_input_max: 6.144
    adc_pin_max: 6.144
    calibration:
      ratio_in_clean_air: 1.0
      delay: 5s
      duration: 30s
      samples: 10
      persist: false
