# Config-only fixture: the schema paths the compile fixture does not need - a
# fixed R0 instead of a calibration, the linear regression of the MQ-135, a
# sensor type without built-in coefficients (coefficient_a/coefficient_b
# required) and the ratio/range options.
sensor:
  - platform: adc
    id: mq_validate_adc
    name: ADC voltage
    pin: GPIO35
    attenuation: 12db
    update_interval: 60s

  # Type and gas names are accepted in the YAML spelling, R0 is pinned (no
  # calibration).
  - platform: mq_gas_sensors
    id: mq_validate_sampler
    name: MQ-8 on a voltage sampler
    sensor_type: mq-8
    gas: h2
    voltage: mq_validate_adc
    voltage_multiplier: 1.5
    r0: 9.5
    ratio_in_clean_air: 70.0
    sample_count: 4
    sample_interval: 50ms
    log_ppm: true

  # The linear regression of the MQ-135, calibrated at boot.
  - platform: mq_gas_sensors
    id: mq_validate_mq135
    name: MQ-135
    sensor_type: MQ-135
    gas: NH3
    voltage: mq_validate_adc
    voltage_multiplier: 1.5
    calibration:
      delay: 5s
      sample_count: 10

  # No built-in coefficients: coefficient_a/coefficient_b come from the YAML,
  # with the R0/RS convention, a custom range and the ADC limits of an
  # external sampler.
  - platform: mq_gas_sensors
    id: mq_validate_mq136
    name: MQ-136
    sensor_type: MQ-136
    voltage: mq_validate_adc
    voltage_multiplier: 1.5
    coefficient_a: 36.0
    coefficient_b: -2.0
    regression_method: linear
    ratio_mode: r0_rs
    min_ppm: 1.0
    max_ppm: 200.0
    correction_factor: 0.5
    adc_input_max: 6.144
    adc_pin_max: 6.144
    r0: 10.0
