# MQ-8 hydrogen sensor on a pin owned by the component: the internal ADC is
# created from `pin:`/`adc_samples`, the divider documents the 10k/2k wiring
# (5 V at the sensor output become 0.83 V on the pin, inside the 0 - 1 V of an
# ESP8266 A0 as well as the ranges of the other targets) and the diagnostics and
# the log mirror exercise the optional entities.
sensor:
  - platform: mq_gas_sensors
    id: mq8_hydrogen
    name: MQ-8 hydrogen
    sensor_type: MQ-8
    gas: H2
    pin: ${mq_pin}
    adc_samples: 4
    voltage_divider:
      r1: 10.0
      r2: 2.0
    rl: 10.0
    vcc: 5.0
    sample_count: 4
    min_ppm: 0.0
    max_ppm: 10000.0
    log_ppm: true
    calibration:
      delay: 10s
      sample_count: 5
      sample_interval: 20ms
    ratio_sensor: mq8_ratio
    rs_sensor: mq8_rs
    voltage_sensor: mq8_voltage
    log_sensor: mq8_logs

  - platform: template
    id: mq8_ratio
    name: MQ-8 RS-R0 ratio
    accuracy_decimals: 3

  - platform: template
    id: mq8_rs
    name: MQ-8 RS
    unit_of_measurement: kOhm
    accuracy_decimals: 3

  - platform: template
    id: mq8_voltage
    name: MQ-8 voltage
    unit_of_measurement: V
    accuracy_decimals: 4

text_sensor:
  - platform: template
    id: mq8_logs
    name: MQ-8 logs
