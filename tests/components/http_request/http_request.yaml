substitutions:
  verify_ssl: "true"

network:

esphome:
  on_boot:
    then:
      - http_request.get:
          url: https://esphome.io
          request_headers:
            Content-Type: application/json
          on_error:
            logger.log: "Request failed"
          on_response:
            then:
              - logger.log:
                  format: "Response status: %d, Duration: %lu ms"
                  args:
                    - response->status_code
                    - (long) response->duration_ms
      - http_request.post:
          url: https://esphome.io
          request_headers:
            Content-Type: application/json
          json:
            key: value
      - http_request.send:
          method: PUT
          url: https://esphome.io
          request_headers:
            Content-Type: application/json
          body: "Some data"
          timeout: 15s
      - http_request.get:
          url: https://esphome.io
          timeout: !lambda "return 10000;"
      - http_request.get:
          url: !lambda 'return std::string("https://esphome.io/get");'
          method: GET
          collect_headers:
            - Content-Type
            - X-Request-Id
          max_response_buffer_size: 2kB
          capture_response: true
          on_response:
            then:
              - logger.log:
                  format: "Content-Type %s, body %zu bytes"
                  args:
                    - response->get_response_header("content-type").c_str()
                    - body.size()
      - http_request.post:
          url: !lambda 'return std::string("https://esphome.io/post");'
          method: POST
          body: !lambda 'return std::string("{\"key\": \"value\"}");'
          timeout: 5s
          collect_headers:
            - Location
          max_response_buffer_size: 512
          on_error:
            - logger.log: "POST failed"
      - http_request.post:
          url: https://esphome.io
          body: "plain body"
          timeout: !lambda "return 2500;"
      - http_request.send:
          method: PATCH
          url: !lambda 'return std::string("https://esphome.io/send");'
          json:
            key: value
            dynamic: !lambda 'return std::string("x");'
          collect_headers:
            - ETag
          max_response_buffer_size: 4kB
          capture_response: true
          timeout: !lambda "return 3000;"
          on_response:
            then:
              - logger.log:
                  format: "Send status %d, body %s"
                  args:
                    - response->status_code
                    - body.c_str()
          on_error:
            - logger.log: "Send failed"
      - http_request.send:
          method: DELETE
          url: https://esphome.io/item
          body: !lambda 'return std::string("id=1");'
      - http_request.post:
          url: https://esphome.io
          request_headers:
            Content-Type: application/json
          json:
            key: value
          capture_response: true
          on_response:
            then:
              - logger.log:
                  format: "Captured response status: %d, Body: %s"
                  args:
                    - response->status_code
                    - body.c_str()
              - delay: 1s
              - logger.log:
                  format: "After delay, body still: %s"
                  args:
                    - body.c_str()
              # Regression test for esphome/esphome#16224: a light.turn_on action
              # nested inside on_response with capture_response: true puts
              # `std::string &` into the trigger's Ts..., which exposed a codegen
              # bug where the generated function's parameter list did not match
              # the automation's arguments.
              - light.turn_on:
                  id: test_regression_light
                  brightness: 100%
                  effect: "None"
      - http_request.get:
          url: https://esphome.io
          capture_response: true
          on_response:
            then:
              # Regression test: http_request.post with json: (dict variant) inside
              # on_response of a capture_response: true request puts std::string&
              # (body) into the nested action's Ts..., which exposes a
              # const-correctness bug in HttpRequestSendAction::play() where
              # encode_json_ receives const copies of non-const reference args.
              - http_request.post:
                  url: https://esphome.io
                  request_headers:
                    X-Body-Length: !lambda 'return body.empty() ? "0" : "1";'
                  json:
                    status: "ok"
              # Same with json: lambda variant, exercises json_func_ path
              - http_request.post:
                  url: https://esphome.io
                  json: !lambda "root[\"status\"] = \"ok\";"

http_request:
  useragent: esphome/tagreader
  timeout: 10s
  verify_ssl: ${verify_ssl}

output:
  - platform: template
    id: test_regression_output
    type: float
    write_action:
      - logger.log: "set"

light:
  - platform: monochromatic
    id: test_regression_light
    output: test_regression_output

script:
  - id: does_not_compile
    parameters:
      api_url: string
    then:
      - http_request.get:
          url: "http://google.com"

  - id: send_with_headers
    parameters:
      token: string
    then:
      - http_request.get:
          url: https://esphome.io
          request_headers:
            Accept: application/json
            X-Device: esphome
      - http_request.get:
          url: https://esphome.io/other
          request_headers:
            Accept: application/json
            X-Device: esphome
      - http_request.get:
          url: https://esphome.io
          request_headers:
            Accept: application/json
            X-Token-Set: !lambda 'return token.empty() ? "no" : "yes";'
