mcp23017:
  - i2c_id: i2c_bus
    id: mcp23017_hub
  - i2c_id: i2c_bus
    id: mcp23017_hub_interrupt
    interrupt_pin: GPIO5

binary_sensor:
  - platform: gpio
    id: mcp23017_binary_sensor
    pin:
      mcp23xxx: mcp23017_hub
      number: 0
      mode: INPUT
      interrupt: CHANGE
  - platform: gpio
    id: mcp23017_binary_sensor_interrupt
    pin:
      mcp23xxx: mcp23017_hub_interrupt
      number: 0
      mode: INPUT
      interrupt: CHANGE

switch:
  - platform: gpio
    id: mcp23017_switch
    pin:
      mcp23xxx: mcp23017_hub
      number: 1
      mode: OUTPUT
