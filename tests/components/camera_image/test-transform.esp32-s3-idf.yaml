packages:
  i2c_camera: !include ../../test_build_components/common/i2c_camera/esp32-s3-idf.yaml
  camera_image: !include common.yaml

image:
  - platform: camera_image
    id: test_camera_image_transformed
    camera_id: test_camera
    format: JPEG
    type: RGB565
    resize: 320x240
    crop:
      x: 0
      y: 0
      width: 200
      height: 100
    rotation: 90
    timeout: 8s
    update_interval: never

display:
  - platform: ssd1306_i2c
    i2c_id: i2c_camera_bus
    id: camera_image_display
    model: SSD1306_128X64
    address: 0x3C
    lambda: |-
      it.image(0, 0, id(test_camera_image_transformed));
