canbus:
  - platform: mcp251xfd
    id: mcp251xfd_classic
    cs_pin: ${cs_pin}
    can_id: 0x123
    mode: CLASSIC
    bit_rate: 10KBPS

interval:
  - interval: 1s
    then:
      - lambda: |-
          #ifdef USE_CANBUS_FD
          #error "The classic MCP251XFD test must be built without CAN FD"
          #endif
          esphome::canbus::CanFrame frame{};
          frame.can_id = 0x123;
          frame.can_data_length_code = 1;
          frame.data[0] = 0x11;
          id(mcp251xfd_classic).send_data(frame);
      - canbus.send:
          canbus_id: mcp251xfd_classic
          data: [0x11, 0x22]
