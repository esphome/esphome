esp32_ble_tracker:

ble_client:
  - mac_address: 01:02:03:04:05:06
    id: test_blec
    on_connect:
      - ble_client.ble_write:
          id: test_blec
          service_uuid: "abcd1234-abcd-1234-abcd-abcd12345678"
          characteristic_uuid: "abcd1235-abcd-1234-abcd-abcd12345678"
          value: !lambda |-
            return std::vector<uint8_t>{0x01, 0x02, 0x03};
      - ble_client.ble_write:
          id: test_blec
          service_uuid: "abcd1234-abcd-1234-abcd-abcd12345678"
          characteristic_uuid: "abcd1235-abcd-1234-abcd-abcd12345678"
          value: [0x04, 0x05, 0x06]
    on_passkey_request:
      - ble_client.passkey_reply:
          id: test_blec
          passkey: !lambda |-
            return 123456;
      - ble_client.passkey_reply:
          id: test_blec
          passkey: 654321
    on_numeric_comparison_request:
      - ble_client.numeric_comparison_reply:
          id: test_blec
          accept: !lambda |-
            return true;
      - ble_client.numeric_comparison_reply:
          id: test_blec
          accept: false
    on_passkey_notification:
      - logger.log:
          format: "Passkey %u"
          args: [passkey]

sensor:
  - platform: ble_client
    ble_client_id: test_blec
    type: characteristic
    id: test_sensor_lambda
    name: "BLE Sensor with Lambda"
    service_uuid: "abcd1234-abcd-1234-abcd-abcd12345678"
    characteristic_uuid: "abcd1236-abcd-1234-abcd-abcd12345678"
    lambda: |-
      if (x.size() >= 2) {
        return (float)(x[0] | (x[1] << 8)) / 100.0;
      }
      return NAN;
  - platform: ble_client
    ble_client_id: test_blec
    type: characteristic
    id: test_sensor_no_lambda
    name: "BLE Sensor without Lambda"
    service_uuid: "abcd1234-abcd-1234-abcd-abcd12345678"
    characteristic_uuid: "abcd1237-abcd-1234-abcd-abcd12345678"
    notify: true
    on_notify:
      - logger.log:
          format: "Notify %.2f"
          args: [x]

number:
  - platform: template
    name: "Test Number"
    id: ble_client_test_number
    optimistic: true
    min_value: 0
    max_value: 255
    step: 1

button:
  # Test ble_write with lambda that references a component (function pointer)
  - platform: template
    name: "BLE Write Lambda Test"
    on_press:
      - ble_client.ble_write:
          id: test_blec
          service_uuid: "abcd1234-abcd-1234-abcd-abcd12345678"
          characteristic_uuid: "abcd1235-abcd-1234-abcd-abcd12345678"
          value: !lambda |-
            uint8_t val = (uint8_t)id(ble_client_test_number).state;
            return std::vector<uint8_t>{0xAA, val, 0xBB};
      - ble_client.disconnect: test_blec
      - ble_client.connect: test_blec
      - ble_client.remove_bond:
          id: test_blec

switch:
  - platform: ble_client
    ble_client_id: test_blec
    name: BLE Client Enabled

output:
  - platform: ble_client
    id: ble_client_output
    ble_client_id: test_blec
    service_uuid: "abcd1234-abcd-1234-abcd-abcd12345678"
    characteristic_uuid: "abcd1238-abcd-1234-abcd-abcd12345678"
    require_response: true

text_sensor:
  - platform: ble_client
    ble_client_id: test_blec
    name: BLE Text Sensor
    service_uuid: "abcd1234-abcd-1234-abcd-abcd12345678"
    characteristic_uuid: "abcd1239-abcd-1234-abcd-abcd12345678"
    notify: true
