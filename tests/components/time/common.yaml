wifi:
  ssid: MySSID
  password: password1

api:

time:
  - platform: homeassistant
    on_time:
      - seconds: "0,10,20,30,40,50"
        then:
          - logger.log: "CronTrigger fired (every 10 seconds)"
  - platform: sntp
    id: sntp_time

esphome:
  on_boot:
    - if:
        condition:
          time.has_time:
            id: sntp_time
        then:
          - logger.log: "sntp_time has valid time"
