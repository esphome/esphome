sd_storage:
  id: sd_card
  type: sd_spi
  spi_id: spi_bus
  cs_pin: GPIO13
  cd_pin: GPIO4
  path: /sdcard
  on_mounted:
    - logger.log:
        format: "SD card mounted at %s"
        args: [mount_path]
  on_removed:
    - logger.log: "SD card removed"
  on_inserted:
    - logger.log: "SD card inserted"

script:
  - id: sd_card_exercise
    then:
      - sd_storage.unmount: sd_card
      - sd_storage.mount: sd_card
      - if:
          condition:
            sd_storage.is_mounted: sd_card
          then:
            - sd_storage.list_files:
                id: sd_card
                path: !lambda 'return "/logs";'
