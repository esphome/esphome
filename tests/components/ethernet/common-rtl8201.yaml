ethernet:
  type: RTL8201
  mdc_pin: 23
  mdio_pin: 32
  clk:
    pin: 0
    mode: CLK_EXT_IN
  phy_addr: 0
  power_pin: 33
  phy_registers:
    - address: 0x10
      value: 0x1FFA
      page_id: 0x07
    - address: 0x19
      value: 0x0006
  manual_ip:
    static_ip: 192.168.178.56
    gateway: 192.168.178.1
    subnet: 255.255.255.0
  domain: .local
  mac_address: "02:AA:BB:CC:DD:01"
  on_connect:
    - logger.log: "Ethernet connected!"
  on_disconnect:
    - logger.log: "Ethernet disconnected!"
