esphome:
  on_boot:
    then:
      - wifi.disable
      - wifi.enable
      - wifi.configure:
          ssid: MySSID
          password: password1
          on_connect:
            - logger.log: "Connected to WiFi!"
          on_error:
            - logger.log: "Failed to connect to WiFi!"
      - wifi.configure:
          ssid: MySSID2
          password: password2
          save: false
          timeout: 10s
      - wifi.configure:
          ssid: !lambda 'return std::string("MySSID3");'
          password: !lambda 'return std::string("password3");'
          save: !lambda return true;
          timeout: !lambda return 15000;
      - if:
          condition: wifi.ap_active
          then:
            - logger.log: "WiFi AP is active!"
      - if:
          condition: wifi.connected
          then:
            - logger.log: "WiFi is connected!"
      - if:
          condition: wifi.enabled
          then:
            - logger.log: "WiFi is enabled!"
      - wifi.roam

wifi:
  networks:
    - ssid: MySSID
      password: password1
      priority: 10
    - ssid: MySSID2
      password: password2
      priority: 5
    - ssid: MySSID3
      password: password3
      priority: 0
  on_connect:
    - logger.log: "WiFi connected!"
  on_disconnect:
    - logger.log: "WiFi disconnected!"
