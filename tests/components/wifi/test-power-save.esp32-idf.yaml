# Test WiFi high-performance mode API
# This test verifies that request_high_performance() and release_high_performance()
# APIs are callable

esphome:
  on_boot:
    - then:
        - lambda: |-
            esphome::wifi::global_wifi_component->request_high_performance();
            esphome::wifi::global_wifi_component->release_high_performance();

packages:
  - !include common.yaml
