# IPv6-only station. Not built on common.yaml: its networks use manual_ip, which needs IPv4.
wifi:
  networks:
    - ssid: MySSID
      password: password1
      priority: 10
    - ssid: MySSID2
      password: password2
      priority: 5
  on_connect:
    - logger.log: "WiFi connected!"
  on_disconnect:
    - logger.log: "WiFi disconnected!"

network:
  enable_ipv6: true
  min_ipv6_addr_count: 2
  enable_ipv4: false
