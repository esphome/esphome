packages:
  ble: !include ../../test_build_components/common/ble/esp32-idf.yaml

ble_client:
  - mac_address: DE:00:40:10:62:39
    id: my_ble_client
    auto_connect: true

fendt_caravan:
  id: my_caravan
  ble_client_id: my_ble_client

sensor:
  - platform: fendt_caravan
    parent_id: my_caravan
    type: mcu
    id: main_unit_device

switch:
  - platform: fendt_caravan
    parent_id: main_unit_device
    type: main_switch
    name: Main Switch
    restore_mode: ALWAYS_OFF

  - platform: fendt_caravan
    parent_id: main_unit_device
    type: all_lights
    name: All Lights Switch
    restore_mode: RESTORE_DEFAULT_OFF

  - platform: fendt_caravan
    parent_id: main_unit_device
    type: floor_heater
    name: Floor Heater
    restore_mode: RESTORE_DEFAULT_OFF

text_sensor:
  - platform: fendt_caravan
    parent_id: main_unit_device
    type: power_status
    name: Power Status

  - platform: fendt_caravan
    parent_id: main_unit_device
    type: software_version
    name: Software Version
