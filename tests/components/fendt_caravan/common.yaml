esp32_ble_tracker:

ble_client:
  - mac_address: DE:00:40:10:62:39
    id: my_ble_client
    auto_connect: true

fendt_caravan:
  id: my_caravan
  ble_client_id: my_ble_client

sensor:
  - platform: fendt_caravan
    fendt_caravan_id: my_caravan
    control_unit_device:
      id: control_unit
      main_switch:
        name: "Main Switch"
      temperature_in:
        name: "In Temperature"
        filters:
          - median:
              window_size: 5
      temperature_out:
        name: "Out Temperature"
        filters:
          - median:
              window_size: 5
      power_status:
        name: "AC Status"
      light_status:
        name: "Main Light"
      software_version:
        name: "Software Version"
      floor_heater:
        name: "Floot Heater"
