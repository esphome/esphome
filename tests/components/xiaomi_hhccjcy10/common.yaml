esp32_ble_tracker:
  id: ble_tracker_hub

sensor:
  # Explicit ble_hub_id: pins the neutral binding as a declared key.
  - platform: xiaomi_hhccjcy10
    ble_hub_id: ble_tracker_hub
    mac_address: 94:2B:FF:5C:91:61
    temperature:
      name: Xiaomi HHCCJCY10 Temperature
    moisture:
      name: Xiaomi HHCCJCY10 Moisture
    illuminance:
      name: Xiaomi HHCCJCY10 Illuminance
    conductivity:
      name: Xiaomi HHCCJCY10 Conductivity
    battery_level:
      name: Xiaomi HHCCJCY10 Battery Level
