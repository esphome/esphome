ds3231:
  - id: ds3231_component
    i2c_id: i2c_bus
    address: 0x68
    square_wave_frequency: 1024Hz
    battery_backed_square_wave: false
    output_32khz: false
    aging_offset: -2
    auto_clear_alarms: true
    alarm_check_interval: 2s
    on_alarm_1:
      - logger.log: "DS3231 alarm 1"
    on_alarm_2:
      - logger.log: "DS3231 alarm 2"
