uart:
  - id: uart_0
    tx_pin: 14
    rx_pin: 13
    baud_rate: 115200
  - id: uart_1
    tx_pin: 15
    rx_pin: 16
    baud_rate: 115200

tinyusb:
  usb_manufacturer_str: kbxManufacturer
  usb_product_str: kbxProduct

usb_cdc_acm:
  interfaces:
    - id: cdc_acm_1
      number: 0
    - id: cdc_acm_2
      number: 1

bridge:
  - platform: usb_uart
    uart_id: uart_0
    usb_cdc_acm_id: usb_cdc_acm1
    dtr_pin: 40
    rts_pin: 41
  - platform: usb_uart
    uart_id: uart_1
    usb_cdc_acm_id: usb_cdc_acm2
    dtr_pin: 20
    rts_pin: 21
