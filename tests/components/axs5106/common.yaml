i2c:
  - id: i2c_axs5106
    scl: ${scl_pin}
    sda: ${sda_pin}

spi:
  - id: spi_ili9xxx
    clk_pin: ${clk_pin}
    mosi_pin: ${mosi_pin}

touchscreen:
  platform: axs5106
  id: my_touchscreen
  interrupt_pin: ${interrupt_pin}
  reset_pin: ${reset_pin}

display:
  - id: my_display
    platform: ili9xxx
    model: ili9342
    cs_pin: ${cs_pin}
    dc_pin: ${dc_pin}
    reset_pin: ${disp_reset_pin}
    invert_colors: false
