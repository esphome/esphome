# ESPHome build test: tflite_micro_helper common config
logger:
  level: DEBUG

external_components:
  - source:
      type: local
      path: ../../../components
    components: [tflite_micro_helper]

tflite_micro_helper:
  id: test_tflite
  model_type: audio
  model: https://github.com/esphome/micro-wake-word-models/raw/main/models/v2/okay_nabu.json
  probability_cutoff: 0.5
  sliding_window_size: 10
  features_step_size: 20
  feature_count: 40
  debug: true