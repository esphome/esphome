light:
  - platform: spi_led_strip
    num_leds: 4
    color_correct: [80%, 60%, 100%]
    id: rgb_led
    name: RGB LED
    data_rate: 8MHz
    power_estimation:
      ma_per_led_red: 16.0
      ma_per_led_green: 11.0
      ma_per_led_blue: 15.0
      idle_ma_per_led: 1.0
      max_current_ma: 100.0

# get_estimated_current_ma() is callable from a lambda
interval:
  - interval: 60s
    then:
      - lambda: |-
          ESP_LOGI("test", "Estimated current: %.1f mA", id(rgb_led).get_estimated_current_ma());
