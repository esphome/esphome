event:
  - platform: template
    name: Event
    id: some_event
    event_types:
      - template_event_type1
      - template_event_type2
    on_event:
      - logger.log: Event fired
      - lambda: |-
          // Test get_last_event_type() returns StringRef
          if (id(some_event).has_event()) {
            auto event_type = id(some_event).get_last_event_type();
            // Compare with string literal using ==
            if (event_type == "template_event_type1") {
              ESP_LOGD("test", "Event type is template_event_type1");
            }
            // Log using %.*s format for StringRef
            ESP_LOGD("test", "Event type: %.*s", (int) event_type.size(), event_type.c_str());
          }

  - platform: template
    name: Other Event
    id: other_event
    event_types:
      - template_event_type1

  - platform: template
    name: Dimmer
    id: dimmer_event
    event_types:
      - press
      - rotate_left
      - rotate_right
    variables:
      number_of_presses:
        type: int
        event_types: [press]
      steps:
        type: int
        event_types: [rotate_left, rotate_right]
      speed: float
      long_press: bool
    on_event:
      - logger.log:
          format: "%s: presses %d, steps %d, speed %.1f, long %d"
          args:
            - event_type.c_str()
            - (int) number_of_presses
            - (int) steps
            - speed
            - (int) long_press
      # A delay keeps the values for later
      - delay: 10ms
      - logger.log:
          format: "steps %d"
          args: [(int) steps]

button:
  - platform: template
    name: Turn Dimmer
    on_press:
      - event.trigger:
          id: dimmer_event
          event_type: press
          data:
            number_of_presses: 2
            long_press: true
      - event.trigger:
          id: dimmer_event
          event_type: !lambda return "rotate_right";
          data:
            steps: !lambda return -2;
            speed: 1.5
      - event.trigger:
          id: dimmer_event
          event_type: rotate_left
      - lambda: |-
          // How components trigger an event with values and read them back
          id(dimmer_event).trigger("rotate_left", {{1, 3}, {2, 0.5f}});
          auto data = id(dimmer_event).get_last_event_data();
          for (uint8_t i = 0; i < data.size(); i++) {
            if (data.has(i) && data.variable(i).type == event::EVENT_VARIABLE_TYPE_INT)
              ESP_LOGD("test", "%s=%d", LOG_STR_ARG(data.variable(i).name), (int) data.get_int(i));
          }
          ESP_LOGD("test", "speed %.1f", data.get_float(2));

  - platform: template
    name: Trigger Event
    on_press:
      - event.trigger:
          id: some_event
          event_type: template_event_type1
      - event.trigger:
          id: some_event
          event_type: !lambda |-
            return id(some_event).has_event() ? "template_event_type2" : "template_event_type1";

  - platform: template
    name: Event Types Lambdas
    on_press:
      - lambda: |-
          // How external components and configs read and set event types
          const auto &types = id(some_event).get_event_types();
          for (const char *type : types)
            ESP_LOGD("test", "%s", type);
          if (types.empty()) {
            ESP_LOGD("test", "no types");
          } else if (types.size() > 1) {
            ESP_LOGD("test", "%s %s", types[0], types.at(1));
            const auto *it = std::find(types.begin(), types.end(), types[1]);
            ESP_LOGD("test", "Index %d", (int) (it - types.begin()));
          }
          id(other_event).set_event_types(id(some_event).get_event_types());
          id(other_event).set_event_types({"other_a", "other_b"});
