# Character map fully replaced by the user's own measurements.
stepper:
  - platform: uln2003
    id: wiji_stepper_1
    pin_a: GPIO4
    pin_b: GPIO7
    pin_c: GPIO5
    pin_d: GPIO6
    max_speed: 600 steps/s
  - platform: uln2003
    id: wiji_stepper_2
    pin_a: GPIO8
    pin_b: GPIO11
    pin_c: GPIO9
    pin_d: GPIO10
    max_speed: 600 steps/s

wijiboard:
  - id: wiji
    stepper_1: wiji_stepper_1
    stepper_2: wiji_stepper_2
    use_default_letters: false
    home_on_boot: false
    return_home_between_letters: false
    base_separation: 30.0
    upper_arm_length: 90.0
    forearm_length: 120.0
    steps_per_rotation: 4096
    rest_position: [-2048, 0]
    homing_positions: [2048, 4096, -2100, -2600, 1100, -1060]
    letters:
      "y":
        x: -20.0
        y: 100.0
      "n":
        x: 20.0
        y: 100.0
