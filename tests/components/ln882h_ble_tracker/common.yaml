ln882h_ble_tracker:
  id: ble_tracker
  scan_parameters:
    interval: 100ms
    window: 50ms
    duration: 5min
    continuous: true

# Pulls in USE_OTA_STATE_LISTENER so the OTA scan-pause path compiles in CI
# (same coverage arrangement as the rp2_ble_tracker tests).
wifi:
  ssid: MySSID
  password: password1

ota:
  - platform: esphome

# A migrated BLE sensor so CI compiles the tracker's listener dispatch path
# (ESPHOME_BLE_DEVICE_BASE_LISTENER_COUNT sized to a real listener).
sensor:
  - platform: ble_rssi
    mac_address: 11:22:33:44:55:66
    name: BLE Test RSSI
