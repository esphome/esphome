deep_sleep:
  run_duration: 30s
  sleep_duration: 12h
  on_wake:
    - logger.log:
        format: "Woke up, cause %d"
        args: ["static_cast<int>(cause)"]
  wakeup_pin:
    - pin:
        number: P6
    - pin: P7
      wakeup_pin_mode: KEEP_AWAKE
    - pin:
        number: P10
        inverted: true
      wakeup_pin_mode: INVERT_WAKEUP

<<: !include common.yaml
