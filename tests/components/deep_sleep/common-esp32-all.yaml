deep_sleep:
  run_duration:
    default: 10s
    gpio_wakeup_reason: 30s
    touch_wakeup_reason: 15s
  sleep_duration: 50s
  wakeup_pin: ${wakeup_pin}
  wakeup_pin_mode: INVERT_WAKEUP
  on_wake:
    - logger.log:
        format: "Woke up, cause %d"
        args: ["static_cast<int>(cause)"]
  esp32_ext1_wakeup:
    pins:
      - pin: GPIO2
        on_wake:
          - logger.log: Woken by ext1 pin GPIO2
      - number: GPIO13
    mode: ANY_HIGH
  touch_wakeup: true
