ble_client:
  - mac_address: 12:34:56:78:9A:BC
    id: thermopro_tp970_client

thermopro_tp970:
  id: thermopro_tp970_hub
  ble_client_id: thermopro_tp970_client
  timeout: 15s

sensor:
  - platform: thermopro_tp970
    thermopro_tp970_id: thermopro_tp970_hub
    internal_temperature:
      name: TP970 Internal Temperature
    ambient_temperature:
      name: TP970 Ambient Temperature
    battery_level:
      name: TP970 Battery Level
    notification_count:
      name: TP970 Temperature Notifications

binary_sensor:
  - platform: thermopro_tp970
    thermopro_tp970_id: thermopro_tp970_hub
    temperature_stream:
      name: TP970 Temperature Stream
