rc522_spi:
  id: rc522_nfcc_spi
  cs_pin: ${cs_pin}
  on_tag:
    - then:
        - lambda: |-
            ESP_LOGD("main", "Found tag %s", x.c_str());
    - then:
        - lambda: |-
            ESP_LOGD("main", "Second found tag %s", x.c_str());
  on_tag_removed:
    - then:
        - lambda: |-
            ESP_LOGD("main", "Removed tag %s", x.c_str());
    - then:
        - lambda: |-
            ESP_LOGD("main", "Second removed tag %s", x.c_str());

binary_sensor:
  - platform: rc522
    rc522_id: rc522_nfcc_spi
    name: RC522 NFC Tag
    uid: 74-10-37-94

  - platform: rc522_spi
    rc522_id: rc522_nfcc_spi
    name: RC522 SPI NFC Tag
    uid: 74-10-37-95
