    temperature_4:
      name: BS Plus Temperature 4
    pump_speed_1:
      name: BS Plus Pump Speed 1
    pump_speed_2:
      name: BS Plus Pump Speed 2
    operating_hours_1:
      name: BS Plus Operating Hours 1
    operating_hours_2:
      name: BS Plus Operating Hours 2
    heat_quantity:
      name: BS Plus Heat Quantity
    time:
      name: BS Plus Time
    version:
      name: BS Plus Version
