  - platform: vbus
    model: deltasol_bs2
    temperature_1:
      name: BS2 Temperature 1
    temperature_2:
      name: BS2 Temperature 2
    temperature_3:
      name: BS2 Temperature 3
    temperature_4:
      name: BS2 Temperature 4
    pump_speed_1:
      name: BS2 Pump Speed 1
    pump_speed_2:
      name: BS2 Pump Speed 2
    operating_hours_1:
