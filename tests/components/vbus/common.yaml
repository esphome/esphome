vbus:

binary_sensor:
  - platform: vbus
    model: deltasol_bs_plus
    relay1:
      name: BS Plus Relay 1 On
    relay2:
      name: BS Plus Relay 2 On
    sensor1_error:
      name: BS Plus Sensor 1 Error
    collector_max:
      name: BS Plus Option Collector Max
    collector_min:
      name: BS Plus Option Collector Min
    collector_frost:
      name: BS Plus Option Collector Frost
    tube_collector:
      name: BS Plus Option Tube Collector
    recooling:
      name: BS Plus Option Recooling
    hqm:
      name: BS Plus Option Heat Quantity Measurement
  - platform: vbus
    model: deltasol_bs_2009
    sensor1_error:
      name: BS 2009 Sensor 1 Error
    frost_protection_active:
      name: BS 2009 Frost Protection Active
  - platform: vbus
    model: deltasol_bs2
    sensor1_error:
      name: BS2 Sensor 1 Error
    sensor2_error:
      name: BS2 Sensor 2 Error
    sensor3_error:
      name: BS2 Sensor 3 Error
    sensor4_error:
      name: BS2 Sensor 4 Error
  - platform: vbus
    model: deltasol_cs2
    sensor1_error:
      name: "DeltaSol CS2 Sensor 1 Error"
  - platform: vbus
    model: deltasol_cs4
    sensor1_error:
      name: "DeltaSol CS4 Sensor 1 Error"
  - platform: vbus
    model: deltasol_cs_plus
    sensor1_error:
      name: "DeltaSol CS Plus Sensor 1 Error"
  - platform: vbus
    model: custom
    command: 0x100
    source: 0x1234
    dest: 0x10
    binary_sensors:
      - id: vcustom_b
        name: VBus Custom Binary Sensor
        lambda: return x[0] & 1;

sensor:
  - platform: vbus
    model: deltasol c
    temperature_1:
      name: DeltaSol C Temperature 1
    temperature_2:
      name: DeltaSol C Temperature 2
    temperature_3:
      name: DeltaSol C Temperature 3
    operating_hours_1:
      name: DeltaSol C Operating Hours 1
    heat_quantity:
      name: DeltaSol C Heat Quantity
    time:
      name: DeltaSol C System Time
  - platform: vbus
    model: deltasol_bs_2009
    temperature_1:
      name: BS 2009 Temperature 1
    heat_quantity:
      name: BS 2009 Heat Quantity
    version:
      name: BS 2009 Firmware Version
  - platform: vbus
    model: deltasol_cs2
    temperature_1:
      name: "DeltaSol CS2 Temperature 1"
    pump_speed:
      name: "DeltaSol CS2 Pump Speed"
    operating_hours:
