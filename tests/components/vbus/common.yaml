vbus:

binary_sensor:
  - platform: vbus
    model: deltasol_bs_plus
    relay1:
      name: BS Plus Relay 1 On
    relay2:
      name: BS Plus Relay 2 On
    sensor1_error:
      name: BS Plus Sensor 1 Error
  - platform: vbus
    model: deltasol_bs2
    sensor1_error:
      name: BS2 Sensor 1 Error
    sensor2_error:
      name: BS2 Sensor 2 Error
    sensor3_error:
      name: BS2 Sensor 3 Error
    sensor4_error:
      name: BS2 Sensor 4 Error
  - platform: vbus
    model: deltasol_cs4
    sensor1_error:
      name: "DeltaSol CS4 Sensor 1 Error"
  - platform: vbus
    model: custom
    command: 0x100
    source: 0x1234
    dest: 0x10
    binary_sensors:
      - id: vcustom_b
        name: VBus Custom Binary Sensor
        lambda: return x[0] & 1;

sensor:
  - platform: vbus
    model: deltasol_bs_plus
    temperature_1:
      name: BS Plus Temperature 1
    temperature_2:
      name: BS Plus Temperature 2
    temperature_3:
