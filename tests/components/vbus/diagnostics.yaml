vbus:
  id: controller_bus
  rx_diagnostics: true
  transmit:
    destination: 0x2211
    transactions:
      controller:
        id: solar_controller
        model: deltasol_cs_plus
        on_snapshot:
          - lambda: ESP_LOGI("snapshot", "%u", id(solar_controller).completed_scans());
button:
  - platform: template
    name: Refresh Controller
    on_press:
      - vbus.scan_controller:
          id: solar_controller
      - vbus.suspend_polling:
          id: controller_bus
      - vbus.resume_polling:
          id: controller_bus
sensor:
  - platform: template
    name: VBus Packet Errors
    accuracy_decimals: 0
    lambda: return id(controller_bus).get_packet_error_count();
  - platform: template
    name: VBus Scan Status
    accuracy_decimals: 0
    lambda: return static_cast<unsigned>(id(solar_controller).scan_status());
