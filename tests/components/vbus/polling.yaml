vbus:
  id: polling_bus
  transmit:
    destination: 0x2211
    transactions:
      polling:
        value_ids: [1, 2, 3]
        rx_value_ids: [3]
        on_value:
          - delay: 10ms
          - lambda: ESP_LOGI("value", "%u %u", value_id, value);
        on_result:
          - lambda: |-
              ESP_LOGI("queue", "%u %u %u %u %u", grant_id, command, value_id, value,
                       static_cast<unsigned>(status));
button:
  - platform: template
    name: Queued read
    on_press:
      - vbus.queue_read:
          id: polling_bus
          value_id: !lambda return 2;
  - platform: template
    name: Queued write
    on_press:
      - vbus.queue_write:
          id: polling_bus
          value_id: !lambda return 2;
          value: !lambda return 123;
          command: !lambda return 0x0400;
