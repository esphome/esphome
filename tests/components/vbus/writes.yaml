vbus:
  id: write_bus
  transmit:
    destination: 0x2211
    transactions:
      controller:
        id: writable_controller
        model: deltasol_cs_plus
        writes:
          require_write_arm: false
          on_setting_result:
            - lambda: ESP_LOGI("setting", "%u %u", value_id, unsigned(status));
button:
  - platform: template
    name: Set Language
    on_press:
      - vbus.arm_writes:
          id: writable_controller
          enabled: true
      - vbus.set_setting:
          id: writable_controller
          value_id: 55
          value: 4
text_sensor:
  - platform: vbus
    controller_id: writable_controller
    last_write_result:
      name: Last Setting Write
datetime:
  - platform: vbus
    controller_id: writable_controller
    parameter: system_time
    name: Controller Clock
number:
  - platform: vbus
    controller_id: writable_controller
    min_pump_speed_1:
      name: Minimum Pump Speed
    max_pump_speed_1: {}
select:
  - platform: vbus
    controller_id: writable_controller
    display_language: {}
    holiday_cooling:
      name: Holiday Cooling
