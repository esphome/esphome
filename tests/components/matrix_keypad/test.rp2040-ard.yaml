packages:
  common: !include common.yaml

matrix_keypad:
  id: keypad
  rows:
    - pin: 1
    - pin: 2
  columns:
    - pin: 3
    - pin: 4
  keys: "1234"
  has_pulldowns: true
  on_key:
    - then:
        - lambda: ESP_LOGI("KEY", "key %d pressed", x);
    - then:
        - lambda: ESP_LOGI("KEY", "second key %c", x);
