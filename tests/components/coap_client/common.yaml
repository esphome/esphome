network:

coap_client:
  id: coap_id
  ack_timeout: 2sec
  max_block_size: 512b
  max_retransmit: 4
  request_timeout: 2sec

ota:
  - platform: coap_client
    id: coap_client_ota
    on_begin:
      then:
        - logger.log: "OTA start"
    on_progress:
      then:
        - logger.log:
            format: "OTA progress %0.1f%%"
            args: ["x"]
    on_end:
      then:
        - logger.log: "OTA end"
    on_error:
      then:
        - logger.log:
            format: "OTA update error %d"
            args: ["x"]
    on_state_change:
      then:
        lambda: 'ESP_LOGD("ota", "State %d", state);'

button:
  - platform: template
    name: Firmware update
    on_press:
      then:
        - ota.coap_client.flash:
            id: coap_client_ota
            md5_url: coap://sample.net/local/esphome/firmware.md5
            url: coap://sample.net/local/esphome/firmware.bin

        - ota.coap_client.flash:
            id: coap_client_ota
            md5: 0123456789abcdef0123456789abcdef
            url: coap://sample.net/local/esphome/firmware.bin

        - logger.log: "This message should be not displayed (reboot)"

update:
  - platform: coap_client
    name: OTA Update
    id: ota_update
    ota_id: coap_client_ota
    source: coap://sample.net/local/esphome/manifest.json
    on_update_available:
      - logger.log: "A new update is available"

  - platform: template
    name: "01 - short form call to californium/test"
    on_press:
      then:
        - coap_client.get: coap://californium.eclipseprojects.io/test

  - platform: template
    name: "02 - call to californium/test"
    on_press:
      then:
        - coap_client.get:
            url: coap://californium.eclipseprojects.io/test
            capture_response: true
            on_response:
              then:
                - logger.log:
                    format: '%s Response status: %d, Duration: %u ms, %s'
                    args:
                      - request_name.c_str()
                      - response->status_code
                      - response->duration_ms
                      - payload.c_str()

  - platform: template
    name: "03 - 404 call to californium"
    on_press:
      then:
        - coap_client.get:
            url: coap://californium.eclipseprojects.io/test404
            capture_response: true
            on_response:
              then:
                - logger.log:
                    format: '%s Response status: %d, Duration: %u, ms'
                    args:
                      - request_name.c_str()
                      - response->status_code
                      - response->duration_ms

  - platform: template
    name: 04 - call to californium/obs
    on_press:
      then:
        - coap_client.get:
            request_name: "TestObserve"
            url: coap://californium.eclipseprojects.io/obs
            capture_response: true
            response_timeout: 10sec
            observe: true
            on_response:
              then:
                - logger.log:
                    format: '%s Response status: %d, Duration: %u ms, %s'
                    args:
                      - request_name.c_str()
                      - response->status_code
                      - response->duration_ms
                      - payload.c_str()

  - platform: template
    name: "05 - remove TestObserve"
    on_press:
      then:
        - coap_client.remove:
            request_name: "TestObserve"
