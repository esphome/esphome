network:

coap_client:
  id: coap_id
  ack_timeout: 2sec
  max_block_size: 512b
  max_retransmit: 4
  request_timeout: 2sec

ota:
  - platform: coap_client
    id: coap_client_ota
    on_begin:
      then:
        - logger.log: "OTA start"
    on_progress:
      then:
        - logger.log:
            format: "OTA progress %0.1f%%"
            args: ["x"]
    on_end:
      then:
        - logger.log: "OTA end"
    on_error:
      then:
        - logger.log:
            format: "OTA update error %d"
            args: ["x"]
    on_state_change:
      then:
        lambda: 'ESP_LOGD("ota", "State %d", state);'

update:
  - platform: coap_client
    id: update_coap_client_id
    name: Firmware Update
    source: coap://[fde0:982b:d0e4:a66f:726b:fff:fe36:9916]/manifest.json
    update_interval: 6h

button:
  - platform: template
    name: "00 - Update"
    on_press:
      then:
        - update.perform
  - platform: template
    name: "01 - short form call to californium/test"
    on_press:
      then:
        - coap_client.get: coap://californium.eclipseprojects.io/test

  - platform: template
    name: "02 - call to californium/test"
    on_press:
      then:
        - coap_client.get:
            request_name: "Test"
            url: coap://californium.eclipseprojects.io/test
            capture_response: true
            on_response:
              then:
                - logger.log:
                    format: '%s Response status: %d, Duration: %u ms, %s'
                    args:
                      - request_name.c_str()
                      - response->status_code
                      - response->duration_ms
                      - payload.c_str()

  - platform: template
    name: "03 - 404 call to californium"
    on_press:
      then:
        - coap_client.get:
            url: coap://californium.eclipseprojects.io/test404
            capture_response: true
            on_response:
              then:
                - logger.log:
                    format: '%s Response status: %d, Duration: %u ms'
                    args:
                      - request_name.c_str()
                      - response->status_code
                      - response->duration_ms

  - platform: template
    name: 04 - call to californium/obs
    on_press:
      then:
        - delay: 5 sec
        - coap_client.get:
            request_name: "TestObserve"
            url: coap://californium.eclipseprojects.io/obs
            capture_response: true
            response_timeout: 10sec
            observe: true
            on_response:
              then:
                - logger.log:
                    format: '%s Response status: %d, Duration: %u ms, %s'
                    args:
                      - request_name.c_str()
                      - response->status_code
                      - response->duration_ms
                      - payload.c_str()

  - platform: template
    name: "05 - stop TestObserve"
    on_press:
      then:
        - coap_client.stop:
            request_name: "TestObserve"
            pause: true

  - platform: template
    name: "06 - resume TestObserve"
    on_press:
      then:
        - coap_client.resume: "TestObserve"

  - platform: template
    name: "07 - remove TestObserve"
    on_press:
      then:
        - coap_client.remove: "TestObserve"

  - platform: template
    name: "00 - OTA Coap Update"
    on_press:
      then:
        - logger.log: "Begin OTA Flash"
        - ota.coap_client.flash:
            md5_url: coap://[fde0:982b:d0e4:a66f:726b:fff:fe36:9916]/test-esp32-1/.pioenvs/test-esp32-1/firmware.md5
            url: coap://[fde0:982b:d0e4:a66f:726b:fff:fe36:9916]/test-esp32-1/.pioenvs/test-esp32-1/firmware.ota.bin
