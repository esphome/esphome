# ESPHome build test: the audio kind is the configuration entry and
# tflite_micro_runtime is loaded in the background. The pinned model is a build
# fixture: this test compiles the component, the deferred load and the decoder.
tflite_audio:
  - id: test_audio
    model: https://raw.githubusercontent.com/nliaudat/esphome_ai_component/4ca8470aba1b226071bcc3258f3b95fab08895d6/models/digit_recognizer_v24_quantized_integer_quant_uint8.tflite
    probability_cutoff: 0.5
    sliding_window_size: 10
    features_step_size: 20
    feature_count: 40
