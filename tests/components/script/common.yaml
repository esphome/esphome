esphome:
  on_boot:
    then:
      - script.execute: my_script
      - script.execute:
          id: my_script_with_params
          prefix: "Test"
          param2: 0
          param3: true
      - script.execute:
          id: my_script_with_array_params
          ints: [42, 100]
          floats: [1.5, 2.5]
          bools: [true, false]
          strings: ["a", "b"]
      - script.wait: my_script
      - script.stop: my_script
      - script.stop:
          id: my_script_queued
      - if:
          condition:
            - script.is_running: my_script
          then:
            - logger.log: my_script is running
      - if:
          any:
            - script.is_running: my_script
            - script.is_running: my_script_restart
          then:
            - logger.log: a script is running
      - script.execute: my_script_stops_itself
      - delay:
          minutes: 1
          seconds: 2
          milliseconds: 3
      - delay:
          hours: 1
      - if:
          all:
            - script.is_running: my_script
            - lambda: return true;
          then:
            - logger.log: all conditions true
      - wait_until:
          condition:
            not:
              script.is_running: my_script
          timeout: !lambda return 2000;
      - wait_until:
          condition:
            not:
              script.is_running: my_script
          timeout: 500ms
      - choose:
          - if:
              script.is_running: my_script
            then:
              - logger.log: first choice
          - if:
              - lambda: return true;
              - script.is_running: my_script_restart
            then:
              - logger.log: second choice
          - else:
              - logger.log: default choice

globals:
  - id: nested_total
    type: int

script:
  - id: my_script
    mode: single
    then:
      - lambda: 'ESP_LOGD("main", "Hello World!");'
  - id: my_script_queued
    mode: queued
    max_runs: 2
    then:
      - lambda: 'ESP_LOGD("main", "Hello World!");'
  - id: my_script_parallel
    mode: parallel
    max_runs: 2
    then:
      - lambda: 'ESP_LOGD("main", "Hello World!");'
  - id: my_script_restart
    mode: restart
    on_stop:
      - logger.log: my_script_restart stopped
    then:
      - lambda: 'ESP_LOGD("main", "Hello World!");'
  - id: my_script_stops_itself
    on_stop:
      then:
        - logger.log: my_script_stops_itself stopped
    then:
      - delay: 1s
      - if:
          lambda: return true;
          then:
            - script.stop
      - script.stop:
      - logger.log: never reached
  - id: my_script_with_array_params
    parameters:
      ints: int[]
      floats: float[]
      bools: bool[]
      strings: string[]
    then:
      - lambda: |-
          ESP_LOGD("main", "ints=%d floats=%f bools=%d strings=%s",
                   ints[0], floats[0], (int) bools[0], strings[0].c_str());
  - id: my_script_with_params
    parameters:
      prefix: string
      param2: uint8_t
      param3: bool
    then:
      - lambda: 'ESP_LOGD(prefix.c_str(), "Hello World! %u %u", param2, param3);'
      - if:
          condition:
            for:
              time: !lambda "return param2;"
              condition:
                script.is_running: my_script
          then:
            - lambda: 'ESP_LOGD("main", "API has stayed connected for at least %u minutes", param2);'
      - repeat:
          count: 5
          then:
            - logger.log: looping!
      - repeat:
          count: 2
          then:
            - repeat:
                count: 2
                then:
                  - delay: 200ms
                  - lambda: 'ESP_LOGD("main", "inner iteration %u", iteration);'
                  - globals.set:
                      id: nested_total
                      value: !lambda |-
                        int total = iteration;
                        return total;
  # Lambdas take the parameters by value, so each form can change its own copy
  - id: my_script_by_value_params
    parameters:
      x: int
    then:
      - lambda: |-
          x *= 2;
          ESP_LOGD("main", "x=%d", x);
      - logger.log:
          format: "again %d"
          args: [x *= 2]
      - script.execute:
          id: my_script_with_params
          prefix: !lambda |-
            x *= 2;
            return std::to_string(x);
          param2: !lambda return x *= 2;
          param3: true
