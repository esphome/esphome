---
# Test: Deep sleep with the LILYGO T5 4.7" Plus e-paper display
#
# Verifies that the deep_sleep component compiles together with the
# lilygo_t5_47_plus display and battery sensor. The display's
# on_safe_shutdown() hook calls epd_poweroff_all() automatically before
# the ESP32-S3 enters deep sleep.
#
# Wakeup source: BUTTON_1 (GPIO21) — active LOW (internal pull-up).
#
# NOTE: GPIO47 (TOUCH_INT) does NOT work as a deep sleep wakeup pin on
# the ESP32-S3 because it is directly connected to the GT911 interrupt
# output. The GT911 does not generate a wakeup-compatible signal while
# the ESP32-S3 is in deep sleep (the touch controller itself may also be
# unpowered). Use a physical button (e.g. GPIO21) instead.

esphome:
  name: lilygo-t547-deep-sleep
  on_boot:
    priority: 600
    then:
      - component.update: battery_sensor

packages:
  board: !include ../../../esphome/components/lilygo_t5_47_plus/board_config.yaml

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG
  logs:
    lilygo_t5_47_plus: DEBUG
    deep_sleep: DEBUG

font:
  - file: "gfonts://Roboto"
    id: default_font
    size: 32

# ─── Battery sensor ──────────────────────────────────────────────────────────
sensor:
  - platform: lilygo_t5_47_plus
    id: battery_sensor
    update_interval: never        # Updated once on boot via on_boot trigger
    battery_voltage:
      id: batt_voltage
      name: "Battery voltage"
    battery_level:
      id: batt_level
      name: "Battery level"

# ─── E-paper display ─────────────────────────────────────────────────────────
display:
  - platform: lilygo_t5_47_plus
    id: epd
    greyscale: false
    update_interval: 5s
    lambda: |-
      it.fill(COLOR_OFF);
      it.printf(480, 160, id(default_font), COLOR_ON, TextAlign::CENTER,
                "Deep sleep test");
      // esp_reset_reason() is available via Arduino.h / esp_system.h without extra includes.
      // ESP_RST_DEEPSLEEP (5) = woke from deep sleep; ESP_RST_POWERON (1) = fresh power-on
      esp_reset_reason_t rst = esp_reset_reason();
      const char *cause_str = (rst == ESP_RST_DEEPSLEEP) ? "timer wakeup" : "power-on / reset";
      it.printf(480, 240, id(default_font), COLOR_ON, TextAlign::CENTER,
                "Wakeup: %s", cause_str);
      if (id(batt_voltage).has_state()) {
        it.printf(480, 320, id(default_font), COLOR_ON, TextAlign::CENTER,
                  "Battery: %.2f V", id(batt_voltage).state);
      }

# ─── Deep sleep ──────────────────────────────────────────────────────────────
# Timer-based wakeup: short cycle for testing (25s run, 30s sleep).
# For wakeup via physical button use BUTTON_1 (GPIO21, active LOW):
#   wakeup_pin:
#     number: GPIO21
#     inverted: true
#     mode: { input: true, pullup: true }
#
# NOTE: GPIO47 (TOUCH_INT) does NOT work as a deep sleep wakeup pin on
# the ESP32-S3 because it is directly connected to the GT911 interrupt
# output. The GT911 does not generate a wakeup-compatible signal while
# the ESP32-S3 is in deep sleep (the touch controller itself may also be
# unpowered). Use a physical button (e.g. GPIO21) instead.
deep_sleep:
  id: deep_sleep_ctrl
  run_duration: 25s
  sleep_duration: 30s
