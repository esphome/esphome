---
# Demo: Batterieanzeige mit 5-Minuten-Tiefschlafzyklus
#
# Ablauf:
#   1. ESP32-S3 wacht auf (Timer-Wakeup alle 5 Minuten)
#   2. Batteriespannung (V) und Ladestand (%) werden gemessen
#   3. Display zeigt die aktuellen Werte + Wakeup-Ursache
#   4. Nach run_duration (20 s) geht das Board wieder schlafen
#
# Gesamtzyklus: ~20 s aktiv + 280 s Tiefschlaf ≈ 5 Minuten
#
# Batterie-Kalibrierung (optional):
#   min_voltage: Entladegrenze (Standard: 3.0 V → 0 %)
#   max_voltage: Vollgeladen   (Standard: 4.2 V → 100 %)

esphome:
  name: lilygo-t547-battery-sleep
  on_boot:
    priority: -100   # Erst nach vollständiger Initialisierung aller Komponenten
    then:
      - component.update: battery_sensor   # Batterie messen
      - component.update: epd              # Display aktualisieren

packages:
  board: !include ../../../esphome/components/lilygo_t5_47_plus/board_config.yaml

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

# ─── Schriften ────────────────────────────────────────────────────────────────
font:
  - file: "gfonts://Roboto"
    id: font_title
    size: 56
  - file: "gfonts://Roboto"
    id: font_value
    size: 96
  - file: "gfonts://Roboto"
    id: font_small
    size: 32

# ─── Batteriesensor ───────────────────────────────────────────────────────────
sensor:
  - platform: lilygo_t5_47_plus
    id: battery_sensor
    update_interval: never          # Einmalig per on_boot ausgelöst
    min_voltage: 3.0                # 0 %  – Entladegrenze
    max_voltage: 4.2                # 100 % – Vollgeladen
    # Spannungsteiler-Kalibrierung:
    #   Standardwert 2.0 (nominaler 1:1-Teiler auf der Platine).
    #   Kalibrierung: Akku mit Multimeter messen → durch (ADC-mV / 1000) teilen.
    #   Beispiel: Multimeter 4,19 V, ADC liefert ~1740 mV → 4,19 / 1,74 ≈ 2,41
    voltage_divider: 2.41
    battery_voltage:
      id: batt_voltage
      name: "Battery voltage"
    battery_level:
      id: batt_level
      name: "Battery level"

# ─── E-Ink-Display ────────────────────────────────────────────────────────────
display:
  - platform: lilygo_t5_47_plus
    id: epd
    greyscale: false
    update_interval: never          # Einmalig per on_boot ausgelöst
    lambda: |-
      it.fill(COLOR_OFF);

      // ── Titel ───────────────────────────────────────────────────────────────
      it.printf(480, 55, id(font_title), COLOR_ON, TextAlign::CENTER,
                "Batteriestand");

      // ── Spannung ────────────────────────────────────────────────────────────
      it.printf(200, 160, id(font_small), COLOR_ON, TextAlign::CENTER,
                "Spannung");
      if (id(batt_voltage).has_state()) {
        it.printf(200, 260, id(font_value), COLOR_ON, TextAlign::CENTER,
                  "%.2f V", id(batt_voltage).state);
      } else {
        it.printf(200, 260, id(font_value), COLOR_ON, TextAlign::CENTER,
                  "-- V");
      }

      // ── Ladestand ───────────────────────────────────────────────────────────
      it.printf(760, 160, id(font_small), COLOR_ON, TextAlign::CENTER,
                "Ladestand");
      if (id(batt_level).has_state()) {
        float pct = id(batt_level).state;
        it.printf(760, 260, id(font_value), COLOR_ON, TextAlign::CENTER,
                  "%.0f %%", pct);

        // Ladebalken: 800 px breit, zentriert in 960 px Display
        static const int bar_x = 80;
        static const int bar_y = 360;
        static const int bar_w = 800;
        static const int bar_h = 50;
        it.rectangle(bar_x, bar_y, bar_w, bar_h, COLOR_ON);
        int fill_w = static_cast<int>((pct / 100.0f) * (bar_w - 4));
        if (fill_w > 0) {
          it.filled_rectangle(bar_x + 2, bar_y + 2, fill_w, bar_h - 4, COLOR_ON);
        }
      } else {
        it.printf(760, 260, id(font_value), COLOR_ON, TextAlign::CENTER,
                  "-- %%");
      }

      // Trennlinie zwischen den beiden Werten
      it.line(480, 140, 480, 330, COLOR_ON);

      // ── Wakeup-Info (klein, unten) ──────────────────────────────────────────
      esp_reset_reason_t rst = esp_reset_reason();
      const char *cause_str = (rst == ESP_RST_DEEPSLEEP)
                              ? "Wakeup: Timer (5 min)"
                              : "Wakeup: Power-on / Reset";
      it.printf(480, 455, id(font_small), COLOR_ON, TextAlign::CENTER,
                "%s", cause_str);

# ─── Tiefschlaf ───────────────────────────────────────────────────────────────
# run_duration:   20 s aktiv (Boot + Messung + Display-Update)
# sleep_duration: 280 s Schlaf → Gesamtzyklus ≈ 5 Minuten
deep_sleep:
  id: deep_sleep_ctrl
  run_duration: 20s
  sleep_duration: 280s
