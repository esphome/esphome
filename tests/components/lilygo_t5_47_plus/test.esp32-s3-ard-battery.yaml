---
# Demo: Battery status on the LILYGO T5 4.7" Plus e-paper display
#
# Shows:
#   - Battery voltage (V) on BATT_PIN (GPIO14, ADC2)
#   - State of charge (%) using the built-in LiPo discharge curve
#
# Optional battery calibration:
#   min_voltage: discharge cutoff (default: 3.0 V → 0 %)
#   max_voltage: fully charged   (default: 4.2 V → 100 %)
# Adjust for your battery if needed (e.g. min: 3.2, max: 4.1).
#
# Note: POWER_EN must be active for the ADC measurement. The sensor handles
# this automatically (epd_poweron -> measure -> epd_poweroff_all).

esphome:
  name: lilygo-t547-battery-demo

packages:
  board: !include ../../../esphome/components/lilygo_t5_47_plus/board_config.yaml

logger:
  hardware_uart: USB_SERIAL_JTAG

# ─── Fonts (Roboto via Google Fonts CDN) ─────────────────────────────────────
font:
  - file: "gfonts://Roboto"
    id: font_large
    size: 48
  - file: "gfonts://Roboto"
    id: font_medium
    size: 32

# ─── Battery sensor ──────────────────────────────────────────────────────────
sensor:
  - platform: lilygo_t5_47_plus
    id: battery_sensor
    update_interval: 30s
    # LP103454 (3.7 V, 2000 mAh) discharge limits.
    # These are also the defaults — explicit here for documentation purposes.
    min_voltage: 3.0   # 0%  – discharge cutoff
    max_voltage: 4.2   # 100% – fully charged
    battery_voltage:
      id: batt_voltage
      name: "Battery voltage"
    battery_level:
      id: batt_level
      name: "Battery level"

# ─── E-paper display ─────────────────────────────────────────────────────────
display:
  - platform: lilygo_t5_47_plus
    id: my_display
    greyscale: false
    update_interval: 30s
    lambda: |-
      // White background
      it.fill(COLOR_OFF);

      // ── Title ──────────────────────────────────────────────────────────────
      it.printf(480, 60, id(font_large), COLOR_ON, TextAlign::CENTER,
                "Battery status");

      // ── Voltage ────────────────────────────────────────────────────────────
      if (id(batt_voltage).has_state()) {
        it.printf(480, 200, id(font_medium), COLOR_ON, TextAlign::CENTER,
                  "Voltage:  %.2f V", id(batt_voltage).state);
      } else {
        it.printf(480, 200, id(font_medium), COLOR_ON, TextAlign::CENTER,
                  "Voltage:  -- V");
      }

      // ── State of charge ────────────────────────────────────────────────────
      if (id(batt_level).has_state()) {
        float pct = id(batt_level).state;
        it.printf(480, 270, id(font_medium), COLOR_ON, TextAlign::CENTER,
                  "Level: %.0f %%", pct);

        // Battery bar: 800x40 px, centred on 960 px width
        static const int bar_x = 80;
        static const int bar_y = 330;
        static const int bar_w = 800;
        static const int bar_h = 40;
        it.rectangle(bar_x, bar_y, bar_w, bar_h, COLOR_ON);
        int fill_w = static_cast<int>((pct / 100.0f) * (bar_w - 4));
        if (fill_w > 0) {
          it.filled_rectangle(bar_x + 2, bar_y + 2, fill_w, bar_h - 4, COLOR_ON);
        }
      } else {
        it.printf(480, 270, id(font_medium), COLOR_ON, TextAlign::CENTER,
                  "Level: -- %%");
      }


