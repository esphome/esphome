---
# I2C Bus Scanner – zeigt alle angeschlossenen I2C-Geräte
# Nützlich um Lade-Controller, Fuel-Gauge etc. zu identifizieren

esphome:
  name: lilygo-i2c-scan

packages:
  board: !include ../../../esphome/components/lilygo_t5_47_plus/board_config.yaml

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: DEBUG

i2c:
  sda: GPIO18
  scl: GPIO17
  scan: true   # Gibt beim Boot alle gefundenen Adressen aus
