number:
  - platform: template
    id: remote_transmitter_test_number
    optimistic: true
    min_value: 0
    max_value: 255
    step: 1
    on_value:
      - remote_transmitter.transmit_abbwelcome:
          source_address: 0x1234
          destination_address: 0x5678
          message_type: 0x01
          data: !lambda |-
            return {(uint8_t) x, 0x20};

button:
