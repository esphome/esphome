lis2dh12_spi:
  id: lis2dh12_spi_accel
  spi_id: spi_bus
  cs_pin: GPIO5
  range: 4G
  resolution: high
  output_data_rate: 100Hz
  update_interval: 10s
  calibration:
    offset_x: -0.250
    offset_y: -0.400
    offset_z: -0.800
  transform:
    mirror_x: false
    mirror_y: true
    mirror_z: true
    swap_xy: false
  on_tap:
    - then:
        - logger.log: "Tapped"
  on_double_tap:
    - then:
        - logger.log: "Double tapped"
  on_freefall:
    - then:
        - logger.log: "Freefall detected"
  on_active:
    - then:
        - logger.log: "Activity detected"
  on_orientation:
    - then:
        - logger.log: "Orientation changed"

sensor:
  - platform: lis2dh12_base
    lis2dh12_id: lis2dh12_spi_accel
    acceleration_x: Accel X
    acceleration_y: Accel Y
    acceleration_z: Accel Z

text_sensor:
  - platform: lis2dh12_base
    lis2dh12_id: lis2dh12_spi_accel
    orientation: Orientation

binary_sensor:
  - platform: lis2dh12_base
    lis2dh12_id: lis2dh12_spi_accel
    tap: Single tap
    double_tap:
      name: Double tap
    freefall:
      name: Freefall
    active:
      name: Active
      filters:
        - delayed_off: 5000ms
