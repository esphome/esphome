motion:
  - platform: lis3dh
    id: lis3dh_main
    i2c_id: i2c_bus
    accelerometer_range: 2G
    accelerometer_odr: 100HZ
    operating_mode: HIGH_RESOLUTION
    axis_map:
      x: y
      y: x
      z: -z
    # Motion (activity) interrupt - keeps the INT pad asserted while moving so it
    # can be used as the deep_sleep wakeup_pin.
    interrupt:
      pin: INT1
      threshold: 1.1g
      duration: 0ms
      axes: [x, y, z]
      latched: true
      active_high: true
      high_pass_filter: false
    # Single and double tap together, polled (no interrupt pin).
    tap:
      threshold: 0.6g
      time_limit: 25ms
      high_pass_filter: false
      on_tap:
        - logger.log:
            format: "Tap on axis %u, %s side"
            args: ["axis", 'negative ? "negative" : "positive"']
      on_double_tap:
        - logger.log:
            format: "Double tap on axis %u, %s side"
            args: ["axis", 'negative ? "negative" : "positive"']

  # A second device covering the other side of each option: low power mode with
  # the rate that only exists there, routed to INT2, active low, unlatched, and
  # with the high-pass filter on.
  - platform: lis3dh
    id: lis3dh_low_power
    i2c_id: i2c_bus
    address: 0x19
    accelerometer_range: 16G
    accelerometer_odr: 1620HZ
    operating_mode: LOW_POWER
    interrupt:
      pin: INT2
      threshold: 0.05g
      duration: 1ms
      axes: [z]
      latched: false
      active_high: false
      high_pass_filter: true
    # Double tap only on INT1 (the motion interrupt uses INT2), read only when the
    # interrupt pin is asserted.
    tap:
      threshold: 2g
      time_limit: 20ms
      latency: 40ms
      window: 150ms
      axes: [x, y]
      high_pass_filter: true
      pin: INT1
      interrupt_pin: ${tap_interrupt_pin}
      on_double_tap:
        - lis3dh.set_tap_threshold:
            id: lis3dh_low_power
            threshold: 2.5g
        - lis3dh.set_tap_threshold:
            id: lis3dh_low_power
            threshold: !lambda "return 1.5f;"

sensor:
  - platform: lis3dh
    lis3dh_id: lis3dh_main
    type: temperature
    name: "LIS3DH Temperature"

  - platform: motion
    motion_id: lis3dh_main
    type: acceleration_x
    name: "Accel X"
  - platform: motion
    motion_id: lis3dh_main
    type: acceleration_y
    name: "Accel Y"
  - platform: motion
    motion_id: lis3dh_main
    type: acceleration_z
    name: "Accel Z"
  - platform: motion
    motion_id: lis3dh_main
    type: pitch
    name: "Pitch"
  - platform: motion
    motion_id: lis3dh_main
    type: roll
    name: "Roll"
