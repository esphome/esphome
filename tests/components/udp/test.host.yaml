network:
  enable_ipv6: true

udp:
  - id: my_udp
    listen_address: 239.0.60.53
    addresses: ["239.0.60.53"]
    on_receive:
      - logger.log:
          format: "Received %lu bytes"
          args: [data.size()]
      - udp.write:
          id: my_udp
          data: "hello world"
      - udp.write:
          id: my_udp
          data: !lambda |-
            return std::vector<uint8_t>{1,3,4,5,6};
  - id: my_udpv6
    listen_address: ff12::100
    addresses: ["ff12::102"]
