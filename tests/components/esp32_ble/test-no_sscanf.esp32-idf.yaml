<<: !include common.yaml

esphome:
  # Fails the link if anything still calls sscanf; bluedroid_hex_wraps.cpp
  # replaces Bluedroid's two callers so newlib's scanf engine stays out.
  build_flags:
    - "-Wl,--wrap=sscanf"

# Only newlib builds replace the callers; ESP-IDF 6.0 moved to picolibc
esp32:
  framework:
    type: esp-idf
    version: 5.5.6
