pylontech:
  - id: pylontech0
  - id: pylontech1

sensor:
  - platform: pylontech
    pylontech_id: pylontech0
    battery: 1
    voltage:
      id: pyl01_voltage
    current:
      id: pyl01_current
    coulomb:
      id: pyl01_soc
    mos_temperature:
      id: pyl01_mos_temperature
    # Cell-level sensors from "bat N" command
    cells:
      - cell: 0
        voltage:
          id: pyl01_cell_0_voltage
        temperature:
          id: pyl01_cell_0_temperature
      - cell: 14
        voltage:
          id: pyl01_cell_14_voltage
        temperature:
          id: pyl01_cell_14_temperature
  - platform: pylontech
    pylontech_id: pylontech1
    battery: 1
    voltage:
      id: pyl13_voltage
    temperature_low:
      id: pyl13_temperature_low
    temperature_high:
      id: pyl13_temperature_high
    voltage_low:
      id: pyl13_voltage_low
    voltage_high:
      id: pyl13_voltage_high

text_sensor:
  - platform: pylontech
    pylontech_id: pylontech0
    battery: 1
    base_state:
      id: pyl0_base_state
    voltage_state:
      id: pyl0_voltage_state
    current_state:
      id: pyl0_current_state
    temperature_state:
      id: pyl0_temperature_state

button:
  - platform: template
    name: "Test Pylontech Action"
    on_press:
      - pylontech.set_cell_polling:
          id: pylontech1
          enabled: true
