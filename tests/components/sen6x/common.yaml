sensor:
  # Test with explicit type parameter
  - platform: sen6x
    id: sen6x_sensor
    type: SEN69C
    i2c_id: i2c_bus
    temperature:
      name: Temperature
      accuracy_decimals: 1
    humidity:
      name: Humidity
      accuracy_decimals: 0
    pm_1_0:
      name: PM <1µm Weight concentration
      id: sen6x_pm_1_0
      accuracy_decimals: 1
    pm_2_5:
      name: PM <2.5µm Weight concentration
      id: sen6x_pm_2_5
      accuracy_decimals: 1
    pm_4_0:
      name: PM <4µm Weight concentration
      id: sen6x_pm_4_0
      accuracy_decimals: 1
    pm_10_0:
      name: PM <10µm Weight concentration
      id: sen6x_pm_10_0
      accuracy_decimals: 1
    nox_index:
      name: NOx Index
      algorithm_tuning:
        index_offset: 8
        learning_time_offset_hours: 6
        learning_time_gain_hours: 24
        gating_max_duration_minutes: 900
        gain_factor: 180
    voc_index:
      name: VOC Index
      algorithm_tuning:
        index_offset: 120
        learning_time_offset_hours: 6
        learning_time_gain_hours: 24
        gating_max_duration_minutes: 240
        std_initial: 75
        gain_factor: 180
    co2:
      name: Carbon Dioxide
    formaldehyde:
      name: Formaldehyde
    address: 0x6B
