sensor:
  # Test with explicit type parameter
  - platform: sen6x
    id: sen6x_sensor
    type: SEN69C
    i2c_id: i2c_bus
    temperature:
      name: Temperature
      accuracy_decimals: 1
    humidity:
      name: Humidity
      accuracy_decimals: 0
    pm_1_0:
      name: PM <1µm Weight concentration
      id: sen6x_pm_1_0
      accuracy_decimals: 1
    pm_2_5:
      name: PM <2.5µm Weight concentration
      id: sen6x_pm_2_5
      accuracy_decimals: 1
    pm_4_0:
      name: PM <4µm Weight concentration
      id: sen6x_pm_4_0
      accuracy_decimals: 1
    pm_10_0:
      name: PM <10µm Weight concentration
      id: sen6x_pm_10_0
      accuracy_decimals: 1
    nox_index:
      name: NOx Index
    voc_index:
      name: VOC Index
    co2:
      name: Carbon Dioxide
    formaldehyde:
      name: Formaldehyde
    address: 0x6B

button:
  - platform: template
    name: Fan Cleaning
    on_press:
      - sen6x.stop_measurement: sen6x_sensor
      - delay: 2s
      - sen6x.start_fan_cleaning: sen6x_sensor
      - delay: 11s
      - sen6x.start_measurement: sen6x_sensor
  - platform: template
    name: SHT Heater
    on_press:
      - sen6x.activate_sht_heater: sen6x_sensor
