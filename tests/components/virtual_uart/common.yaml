virtual_uart:
  - id: loop_a
    baud_rate: 9600
    on_tx:
      - virtual_uart.inject_rx:
          id: loop_b
          data: !lambda return std::vector<uint8_t>(data.begin(), data.end());
  - id: loop_b
    baud_rate: 19200
    parity: EVEN
    rx_buffer_size: 64
    debug:

interval:
  - interval: 10s
    then:
      - virtual_uart.inject_rx:
          id: loop_a
          data: [0x01, 0x03, 0x00, 0x00, 0x00, 0x01, 0x84, 0x0A]
      - virtual_uart.inject_rx:
          id: loop_a
          data: "hello"
      - uart.write:
          id: loop_a
          data: [0x01, 0x02]
