wifi:
  ssid: MySSID
  password: password1
  power_save_mode: none

api:

usb_host:

usb_uart:
  - type: CDC_ACM
    vid: 0x303A
    pid: 0x831A
    channels:
      - id: zwave_usb_channel
        baud_rate: 115200

serial_proxy:
  - id: zwave_usb_serial
    uart_id: zwave_usb_channel
    name: Z-Wave
    port_type: USB_SERIAL

zwave_proxy_tap:
  serial_proxy_id: zwave_usb_serial
