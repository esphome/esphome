sensor:
  - platform: bthome
    source_id: bthome_remote_plain
    type: BATTERY_PCT
    name: "Remote Battery"
  - platform: bthome
    source_id: bthome_remote_plain
    type: TEMPERATURE_C_E2
    name: "Remote Temperature"
  - platform: bthome
    source_id: bthome_remote_plain
    type: SIGNAL_STRENGTH
    name: "Remote Signal Strength"

event:
  - platform: bthome
    source_id: bthome_remote_plain
    type: button
    name: "Remote Button"
  - platform: bthome
    source_id: bthome_remote_plain
    type: button
    index: 2
    name: "Remote Button 2"
    on_event:
      - logger.log:
          format: "Button 2: %s"
          args: [event_type.c_str()]
  - platform: bthome
    source_id: bthome_remote_plain
    type: dimmer
    name: "Remote Dimmer"

bthome:
  remote_devices:
    - id: bthome_remote_plain
      mac_address: 11:22:33:44:55:66
