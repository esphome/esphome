# Test mdns with captive_portal on ESP8266
# This tests the priority ordering of wifi -> captive_portal -> mdns

esphome:
  name: mdns-captive-portal-test

esp8266:
  board: esp01_1m

wifi:
  ssid: MySSID
  password: password1
  ap:
    ssid: "Fallback Hotspot"
    password: "fallback123"

# captive_portal depends on wifi and should run after wifi but before mdns
captive_portal:

# mdns should run after both wifi and captive_portal
mdns:
  services:
    - service: _esphome
      protocol: _tcp
      port: 6053
      txt:
        version: "1.0"
        board: "esp8266"
