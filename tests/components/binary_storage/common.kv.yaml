# In-place key-value store on an erase-free byte device (FRAM). Compiles the InplaceKVStore path.
binary_storage:
  - type: FRAM
    id: fram_kv
    address: 0x53
    model: MB85RC256
    capacity: 32kB
    storage_name: "FRAM KV"
    regions:
      - format: kv
        size: remaining
        id: fram_kv_store
