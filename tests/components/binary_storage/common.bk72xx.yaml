binary_storage:
  - type: EEPROM
    id: eeprom_raw
    address: 0x50
    model: AT24C256
    mode: raw
    storage_name: "EEPROM 32KB"

  - type: FRAM
    id: fram_raw
    address: 0x51
    model: MB85RC256
    mode: raw
    storage_name: "FRAM 32KB"

  - type: ONEWIRE_EEPROM
    id: onewire_eeprom_raw
    pin: ${onewire_pin}
    model: DS2431
    storage_name: "DS2431"
