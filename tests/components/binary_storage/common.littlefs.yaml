# LittleFS coverage (ESP32 / ESP-IDF only):
# - mode: littlefs  -> LittleFSMount over the block-callback path (external SPI flash)
# - mode: both      -> raw access plus LittleFSMount on the same device (I2C FRAM)
# - FLASH_PARTITION -> esp_littlefs on an internal partition (FlashPartition driver)
# The partition label does not need to exist for the CI compile; mounting is runtime-only.
binary_storage:
  - type: SPI_FLASH
    id: spi_flash_lfs
    cs_pin: ${spi_flash_lfs_cs_pin}
    model: W25Q32
    mode: littlefs
    mount_path: /extflash
    auto_format: true
    mount_id: spi_flash_lfs_mount
    storage_name: "SPI Flash LittleFS"

  - type: FRAM
    id: fram_both
    address: 0x52
    model: MB85RC256
    mode: both
    fs_size: 16KB
    mount_path: /fram
    storage_name: "FRAM both-mode"

  - type: FLASH_PARTITION
    id: internal_lfs
    partition_label: littlefs
    mount_path: /lfs
    auto_format: true
    storage_name: "Internal LittleFS"
