esphome:
  on_boot:
    then:
      - at581x.settings:
          id: waveradar
          hw_frontend_reset: false
          frequency: 5800MHz
          sensing_distance: 200
          poweron_selfcheck_time: 2s
          protect_time: 1s
          trigger_base: 500ms
          trigger_keep: 10s
          stage_gain: 3
          power_consumption: 70uA
      - at581x.settings:
          id: waveradar
          frequency: !lambda "return 5800;"
          poweron_selfcheck_time: !lambda "return 2000;"
          power_consumption: !lambda "return 70;"
      - at581x.settings:
          id: waveradar
          frequency: 5800MHz
          power_consumption: 91uA
      - at581x.settings:
          id: waveradar
          hw_frontend_reset: !lambda return true;
          sensing_distance: !lambda return 300;
          protect_time: !lambda return 1500;
          trigger_base: !lambda return 600;
          trigger_keep: !lambda return 12000;
          stage_gain: !lambda return 4;
      - at581x.reset:
          id: waveradar

at581x:
  i2c_id: i2c_bus
  id: waveradar

switch:
  - platform: at581x
    name: Enable Radar
