remote_receiver:
  id: rcvr
  pin: GPIO2
  dump: all
  <<: !include common-actions.yaml

binary_sensor:
  - platform: remote_receiver
    name: Panasonic Remote Input
    panasonic:
      address: 0x4004
      command: 0x100BCBD
  - platform: remote_receiver
    name: RC5X Remote Input
    rc5x:
      address: 0x00
      command: 0x0D
      extension: 0x03
