remote_receiver:
  - id: rcvr
    pin: ${pin}
    dump: all
    tolerance: 25%
    clock_resolution: ${clock_resolution}
    filter_symbols: ${filter_symbols}
    receive_symbols: ${receive_symbols}
    rmt_symbols: ${rmt_symbols}
    <<: !include common-actions.yaml

binary_sensor:
  - platform: remote_receiver
    name: Panasonic Remote Input
    panasonic:
      address: 0x4004
      command: 0x100BCBD
  - platform: remote_receiver
    name: RC5X Remote Input
    rc5x:
      address: 0x00
      command: 0x0D
      extension: 0x03
  - platform: remote_receiver
    name: Drayton Thermostat On
    drayton:
      address: 0x6180
      data: 0x8
  - platform: remote_receiver
    name: Drayton Thermostat On Legacy
    drayton:
      address: 0x6180
      channel: 0x12
      command: 0x41
  - platform: remote_receiver
    name: Hob2Hood Light On
    hob2hood:
      command: light_on
  - platform: remote_receiver
    name: Nexus Sensor
    nexus:
      channel: 1
      address: 0x42
