remote_receiver:
  id: rcvr
  pin: GPIO5
  dump: all
  <<: !include common-actions.yaml

binary_sensor:
  - platform: remote_receiver
    name: Haier Remote Input
    haier:
      code: [0xA6, 0x12, 0x00, 0x00, 0x40, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x05]
  - platform: remote_receiver
    name: Mirage Remote Input
    mirage:
      code: [0x56, 0x75, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x00, 0x12]
  - platform: remote_receiver
    name: Panasonic Remote Input
    panasonic:
      address: 0x4004
      command: 0x100BCBD
