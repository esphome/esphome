esphome:
  name: test

wifi:
  ssid: test
  password: password
  power_save_mode: none

api:

uart:
  - id: zigbee_uart
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}
    baud_rate: 115200

# The port owns the UART and carries every byte; zigbee_proxy only taps it
serial_proxy:
  - id: zigbee_serial
    uart_id: zigbee_uart
    name: Zigbee
    port_type: TTL
